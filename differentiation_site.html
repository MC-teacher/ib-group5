  answer:"∴ f''(x) = 6x − 4" },
{ type:'qa', id:'d3a', navLabel:'D3a', qnum:'Q 3a', heading:"Second derivative of an exponential",
  question:"Evaluate the second derivative of the function y = e⁻²ˣ.",
  hint:"💡 Each time you differentiate e^(kx), you multiply by k again.",
  steps:[{label:'Differentiate once', text:"y = e⁻²ˣ, so y' = −2e⁻²ˣ (chain rule: multiply by the derivative of the exponent, −2)"}, {label:'Differentiate again', text:"y'' = −2 × (−2e⁻²ˣ) = 4e⁻²ˣ"}],
  answer:"∴ d²y/dx² = 4e⁻²ˣ" },
{ type:'qa', id:'d3b', navLabel:'D3b', qnum:'Q 3b', heading:"Second derivative of an exponential",
  question:"Evaluate the second derivative of the function y = 2e³ˣ.",
  hint:"💡 Each time you differentiate e^(kx), you multiply by k again.",
  steps:[{label:'Differentiate once', text:"y = 2e³ˣ, so y' = 2 × 3e³ˣ = 6e³ˣ"}, {label:'Differentiate again', text:"y'' = 6 × 3e³ˣ = 18e³ˣ"}],
  answer:"∴ d²y/dx² = 18e³ˣ" },
{ type:'qa', id:'d4a', navLabel:'D4a', qnum:'Q 4a', heading:"Second derivative of ln x",
  question:"Evaluate the second derivative of the function y = ln x.",
  hint:"💡 Recall d/dx(ln x) = 1/x = x⁻¹, then use the power rule on x⁻¹.",
  steps:[{label:'Differentiate once', text:"y = ln x, so y' = 1/x = x⁻¹"}, {label:'Differentiate again', text:"y'' = −x⁻² = −1/x²"}],
  answer:"∴ d²y/dx² = −1/x²" },
{ type:'qa', id:'d4b', navLabel:'D4b', qnum:'Q 4b', heading:"Second derivative of a log function",
  question:"Evaluate the second derivative of the function y = −4 ln (x) + 2.",
  hint:"💡 The constant +2 disappears immediately on differentiating; focus on −4 ln x.",
  steps:[{label:'Differentiate once', text:"y = −4 ln x + 2, so y' = −4/x = −4x⁻¹"}, {label:'Differentiate again', text:"y'' = 4x⁻² = 4/x²"}],
  answer:"∴ d²y/dx² = 4/x²" },
{ type:'qa', id:'d7a', navLabel:'D7a', qnum:'Q 7a', heading:"Interpreting a graph's shape",
  question:"Use the method demonstrated in Worked Example 20.16 to give one or more of the words 'increasing', 'decreasing', 'concave-up', 'concave-down' to describe the given sections of the graph: i A to B  ii C to E  iii E to G. (Graph a shows a curve with labelled points A, B, C, D, E, F, G, where B is a local maximum, D is a local minimum, and F is a smaller local maximum between D and G.)",
  hint:"💡 This is a graph-reading question: look at whether the curve is rising or falling (increasing/decreasing) and whether it bends like a cup or a cap (concave-up/concave-down) between the labelled points.",
  steps:[{label:'A to B', text:"The curve rises from A up to the peak at B, so this section is increasing; as it flattens out approaching the maximum at B it is concave-down"}, {label:'C to E', text:"From C the curve falls to the local minimum at D, then rises again to E, so this section is decreasing then increasing; since a local minimum sits inside it, the curve is concave-up throughout C to E"}, {label:'E to G', text:"From E the curve rises to the local maximum at F, then falls to G, so this section is increasing then decreasing; since a local maximum sits inside it, the curve is concave-down throughout E to G"}],
  answer:"∴ A to B: increasing, concave-down. C to E: decreasing then increasing (local min at D), concave-up throughout. E to G: increasing then decreasing (local max at F), concave-down throughout" },
{ type:'qa', id:'d7b', navLabel:'D7b', qnum:'Q 7b', heading:"Interpreting a graph's shape",
  question:"Use the method demonstrated in Worked Example 20.16 to give one or more of the words 'increasing', 'decreasing', 'concave-up', 'concave-down' to describe the given sections of the graph: i A to B  ii C to F  iii F to G. (Graph b shows a curve with labelled points A, B, C, D, E, F, G, where B is a local minimum and F is a local maximum, with C, D, E lying on the rising section between them.)",
  hint:"💡 This is a graph-reading question: look at whether the curve is rising or falling (increasing/decreasing) and whether it bends like a cup or a cap (concave-up/concave-down) between the labelled points.",
  steps:[{label:'A to B', text:"The curve falls from A down to the local minimum at B, so this section is decreasing; as it flattens out approaching the minimum it is concave-up"}, {label:'C to F', text:"The curve rises steadily from C through D and E up to the local maximum at F, so this section is increasing throughout; it is concave-up nearer C (just after the minimum at B) and concave-down nearer F (just before the maximum), with an inflection point somewhere between D and E"}, {label:'F to G', text:"The curve falls from the local maximum at F down to G, so this section is decreasing; as it falls away from the maximum it is concave-down"}],
  answer:"∴ A to B: decreasing, concave-up. C to F: increasing throughout, concave-up near C changing to concave-down near F. F to G: decreasing, concave-down" },
{ type:'qa', id:'d8a', navLabel:'D8a', qnum:'Q 8a', heading:"Concave-down interval of a cubic",
  question:"Use the method demonstrated in Worked Example 20.17 to find the values of x for which the function f(x) = x³ − 4x² + 5x − 2 is concave-down.",
  hint:"💡 Find f''(x), then solve the inequality f''(x) < 0 for concave-down.",
  steps:[{label:'Find derivatives', text:"f'(x) = 3x² − 8x + 5, so f''(x) = 6x − 8"}, {label:'Set up inequality', text:"For concave-down, f''(x) < 0: 6x − 8 < 0"}, {label:'Solve', text:"6x < 8, so x < 8/6 = 4/3"}],
  answer:"∴ f(x) is concave-down for x < 4/3" },
{ type:'qa', id:'d8b', navLabel:'D8b', qnum:'Q 8b', heading:"Concave-up interval of a cubic",
  question:"Use the method demonstrated in Worked Example 20.17 to find the values of x for which the function f(x) = x³ + 9x² − 4x + 1 is concave-up.",
  hint:"💡 Find f''(x), then solve the inequality f''(x) > 0 for concave-up.",
  steps:[{label:'Find derivatives', text:"f'(x) = 3x² + 18x − 4, so f''(x) = 6x + 18"}, {label:'Set up inequality', text:"For concave-up, f''(x) > 0: 6x + 18 > 0"}, {label:'Solve', text:"6x > −18, so x > −3"}],
  answer:"∴ f(x) is concave-up for x > −3" },
{ type:'qa', id:'d9a', navLabel:'D9a', qnum:'Q 9a', heading:"Concave-up interval of a quartic",
  question:"Use the method demonstrated in Worked Example 20.17 to find the values of x for which the function f(x) = x⁴ − 4x³ − 18x² + 2x − 1 is concave-up.",
  hint:"💡 Find f''(x), factorise the resulting quadratic, and solve f''(x) > 0 as a quadratic inequality.",
  steps:[{label:'Find derivatives', text:"f'(x) = 4x³ − 12x² − 36x + 2, so f''(x) = 12x² − 24x − 36"}, {label:'Simplify inequality', text:"For concave-up, f''(x) > 0: 12x² − 24x − 36 > 0, so x² − 2x − 3 > 0"}, {label:'Factorise and solve', text:"(x − 3)(x + 1) > 0, so x < −1 or x > 3"}],
  answer:"∴ f(x) is concave-up for x < −1 or x > 3" },
{ type:'qa', id:'d9b', navLabel:'D9b', qnum:'Q 9b', heading:"Concave-down interval of a quartic",
  question:"Use the method demonstrated in Worked Example 20.17 to find the values of x for which the function f(x) = x⁴ − 6x³ + 2x − 7 is concave-down.",
  hint:"💡 Find f''(x), factorise it, and solve f''(x) < 0 as a quadratic inequality.",
  steps:[{label:'Find derivatives', text:"f'(x) = 4x³ − 18x² + 2, so f''(x) = 12x² − 36x"}, {label:'Simplify inequality', text:"For concave-down, f''(x) < 0: 12x² − 36x < 0, so 12x(x − 3) < 0"}, {label:'Solve', text:"This holds when x and (x − 3) have opposite signs, so 0 < x < 3"}],
  answer:"∴ f(x) is concave-down for 0 < x < 3" },
{ type:'qa', id:'d10', navLabel:'D10', qnum:'Q 10', heading:"Finding k from f''(1)",
  question:"If f(x) = x³ + kx² + 3x + 1 and f''(1) = 10 find the value of k.",
  hint:"💡 Differentiate twice to get f''(x) in terms of k, then substitute x = 1 and set equal to 10.",
  steps:[{label:'Find derivatives', text:"f'(x) = 3x² + 2kx + 3, so f''(x) = 6x + 2k"}, {label:'Substitute x = 1', text:"f''(1) = 6(1) + 2k = 6 + 2k"}, {label:'Solve for k', text:"6 + 2k = 10, so 2k = 4, k = 2"}],
  answer:"∴ k = 2" },
{ type:'qa', id:'d11', navLabel:'D11', qnum:'Q 11', heading:"Finding a and b from two conditions",
  question:"If f(x) = x³ + ax² + bx + 1 with f''(−1) = −4 and f'(1) = 4 find a and b.",
  hint:"💡 Use f''(−1) = −4 to find a first, then substitute a into f'(1) = 4 to find b.",
  steps:[{label:'Find derivatives', text:"f'(x) = 3x² + 2ax + b, so f''(x) = 6x + 2a"}, {label:"Use f''(−1) = −4", text:"6(−1) + 2a = −4, so −6 + 2a = −4, giving 2a = 2, a = 1"}, {label:"Use f'(1) = 4", text:"f'(1) = 3(1)² + 2(1)(1) + b = 3 + 2 + b = 5 + b"}, {label:'Solve for b', text:"5 + b = 4, so b = −1"}],
  answer:"∴ a = 1 and b = −1" },
{ type:'qa', id:'d12', navLabel:'D12', qnum:'Q 12', heading:"Second derivative via product rule",
  question:"If y = xeˣ find d²y/dx².",
  hint:"💡 Use the product rule to find y', then apply the product rule again to find y''.",
  steps:[{label:'First derivative (product rule)', text:"y = xeˣ, so y' = (1)(eˣ) + x(eˣ) = eˣ(1 + x)"}, {label:'Second derivative (product rule again)', text:"y'' = eˣ(1 + x) + eˣ(1) = eˣ(1 + x + 1) = eˣ(x + 2)"}],
  answer:"∴ d²y/dx² = eˣ(x + 2)" },
{ type:'qa', id:'d13', navLabel:'D13', qnum:'Q 13', heading:"Sketching from sign conditions",
  question:"Sketch a graph where for all x: f(x) < 0, f'(x) > 0, f''(x) < 0",
  hint:"💡 Translate each sign condition into a shape feature: f(x) < 0 means below the x-axis, f'(x) > 0 means always rising, f''(x) < 0 means always bending like a cap.",
  steps:[{label:'Interpret f(x) < 0', text:"The whole curve must lie entirely below the x-axis for every x"}, {label:"Interpret f'(x) > 0", text:"The curve must be increasing (rising left to right) for every x"}, {label:"Interpret f''(x) < 0", text:"The curve must be concave-down (curving like a cap, i.e. its rate of increase is slowing) for every x"}, {label:'Combine into a shape', text:"A curve that rises from a very negative value, stays below the x-axis, and flattens out as it approaches (but never reaches) y = 0 satisfies all three conditions — for example y = −e⁻ˣ, since −e⁻ˣ < 0, its derivative e⁻ˣ > 0, and its second derivative −e⁻ˣ < 0 for all x"}],
  answer:"∴ Sketch an increasing curve lying entirely below the x-axis, concave-down throughout, rising and flattening towards a horizontal asymptote at y = 0 as x → ∞ (e.g. the shape of y = −e⁻ˣ)" },
{ type:'qa', id:'d14', navLabel:'D14', qnum:'Q 14', heading:"Sketching from sign conditions",
  question:"Sketch a graph where for all positive x, f'(x) > 0 and f''(x) > 0 and for all negative x, f'(x) > 0 and f''(x) < 0.",
  hint:"💡 The curve is increasing everywhere, but the concavity flips at x = 0, so look for a curve with an inflection point at the origin.",
  steps:[{label:'Interpret conditions for x > 0', text:"f'(x) > 0 and f''(x) > 0 means the curve is increasing and concave-up (curving like a cup) for all positive x"}, {label:'Interpret conditions for x < 0', text:"f'(x) > 0 and f''(x) < 0 means the curve is increasing and concave-down (curving like a cap) for all negative x"}, {label:'Combine into a shape', text:"The curve must be increasing throughout, with concavity switching from concave-down to concave-up at x = 0, so there is an inflection point at the origin — this is exactly the shape of y = x³, where f'(x) = 3x² > 0 for x ≠ 0, and f''(x) = 6x, which is negative for x < 0 and positive for x > 0"}],
  answer:"∴ Sketch an S-shaped increasing curve through the origin, concave-down for x < 0 and concave-up for x > 0, with an inflection point at x = 0 (e.g. the shape of y = x³)" },
{ type:'qa', id:'d15', navLabel:'D15', qnum:'Q 15', heading:"Finding k from a concavity boundary",
  question:"The graph of x³ − kx² + 4x + 7 is concave-up for all x > 1 and this is the only section which is concave-up. Find the value of k.",
  hint:"💡 Find f''(x) in terms of k, solve f''(x) > 0 to get a boundary in terms of k, then match it to x > 1.",
  steps:[{label:'Find derivatives', text:"f(x) = x³ − kx² + 4x + 7, so f'(x) = 3x² − 2kx + 4, and f''(x) = 6x − 2k"}, {label:'Solve for concave-up', text:"f''(x) > 0 gives 6x − 2k > 0, so x > 2k/6 = k/3"}, {label:'Match to given boundary', text:"This region is given as x > 1, so k/3 = 1"}],
  answer:"∴ k = 3" },
{ type:'qa', id:'d16', navLabel:'D16', qnum:'Q 16', heading:"Solving for n from f''(1)",
  question:"If f(x) = xⁿ and f''(1) = 12 find the possible values of n.",
  hint:"💡 Differentiate xⁿ twice using the power rule, substitute x = 1, and solve the resulting quadratic in n.",
  steps:[{label:'Find derivatives', text:"f(x) = xⁿ, so f'(x) = nx^(n−1), and f''(x) = n(n − 1)x^(n−2)"}, {label:'Substitute x = 1', text:"f''(1) = n(n − 1)(1)^(n−2) = n(n − 1)"}, {label:'Set up and solve the equation', text:"n(n − 1) = 12, so n² − n − 12 = 0, giving (n − 4)(n + 3) = 0"}],
  answer:"∴ n = 4 or n = −3" },
{ type:'qa', id:'d17', navLabel:'D17', qnum:'Q 17', heading:"Proving a parabola is concave-up",
  question:"Prove that the graph of y = x² + bx + c is always concave-up.",
  hint:"💡 Find y'' and show it is a positive constant, independent of x, b and c.",
  steps:[{label:'Differentiate once', text:"y = x² + bx + c, so y' = 2x + b"}, {label:'Differentiate again', text:"y'' = 2"}, {label:'Conclude', text:"Since y'' = 2 > 0 for every value of x (and this does not depend on b or c), the graph is concave-up for all x"}],
  answer:"∴ y'' = 2 > 0 for all x, so y = x² + bx + c is always concave-up" },
{ type:'qa', id:'d18', navLabel:'D18', qnum:'Q 18', heading:"Proving a second-derivative identity",
  question:"If y = sin 3x + 2cos 3x prove that d²y/dx² = −9y.",
  hint:"💡 Differentiate twice using the chain rule, then factor out −9 and compare with the original y.",
  steps:[{label:'Differentiate once', text:"y = sin 3x + 2cos 3x, so y' = 3cos 3x − 6sin 3x"}, {label:'Differentiate again', text:"y'' = −9sin 3x − 18cos 3x"}, {label:'Factor and compare', text:"y'' = −9(sin 3x + 2cos 3x) = −9y"}],
  answer:"∴ d²y/dx² = −9y, as required" },
{ type:'qa', id:'d19', navLabel:'D19', qnum:'Q 19', heading:"Second derivative of ln(a + x)",
  question:"If y = ln(a + x) find d²y/dx². Hence, prove that the graph of y = ln(a + x) is always concave-down.",
  hint:"💡 Use the chain rule to differentiate ln(a + x) twice, then argue about the sign of the resulting expression.",
  steps:[{label:'Differentiate once', text:"y = ln(a + x), so y' = 1/(a + x)"}, {label:'Differentiate again', text:"y'' = −1/(a + x)²"}, {label:'Argue the sign', text:"For any x in the domain (x ≠ −a), (a + x)² > 0, so −1/(a + x)² < 0 for every such x"}, {label:'Conclude', text:"Since y'' < 0 throughout the domain, the graph of y = ln(a + x) is always concave-down"}],
  answer:"∴ d²y/dx² = −1/(a + x)², which is always negative, so y = ln(a + x) is always concave-down" },
{ type:'qa', id:'d20', navLabel:'D20', qnum:'Q 20', heading:"Point where the second derivative equals 1",
  question:"Find the point on the graph y = x² ln x where the second derivative equals 1.",
  hint:"💡 Use the product rule twice to find y'', set it equal to 1, solve for x, then substitute back to find y.",
  steps:[{label:"Find y' (product rule)", text:"y = x² ln x, so y' = 2x ln x + x²(1/x) = 2x ln x + x"}, {label:"Find y'' (product rule again)", text:"y'' = (2 ln x + 2x(1/x)) + 1 = 2 ln x + 2 + 1 = 2 ln x + 3"}, {label:"Set y'' = 1 and solve", text:"2 ln x + 3 = 1, so 2 ln x = −2, ln x = −1, giving x = e⁻¹ = 1/e"}, {label:'Find the y-coordinate', text:"y = (1/e)² ln(1/e) = (1/e²)(−1) = −1/e²"}],
  answer:"∴ The point is (1/e, −1/e²)" },
{ type:'qa', id:'d21', navLabel:'D21', qnum:'Q 21', heading:"Interval where the gradient decreases",
  question:"Find the interval in which the gradient of the graph y = x³ − 5x² + 4x − 2 is decreasing.",
  hint:"💡 The gradient is y'; for the gradient itself to be decreasing, its derivative (y'') must be negative.",
  steps:[{label:'Find the gradient function', text:"y = x³ − 5x² + 4x − 2, so y' = 3x² − 10x + 4"}, {label:'Find how the gradient changes', text:"The rate of change of the gradient is y'' = 6x − 10"}, {label:'Set up and solve inequality', text:"The gradient is decreasing where y'' < 0: 6x − 10 < 0, so x < 10/6 = 5/3"}],
  answer:"∴ The gradient is decreasing for x < 5/3" },
{ type:'qa', id:'d22a', navLabel:'D22a', qnum:'Q 22a', heading:"Finding a from a concavity boundary",
  question:"The curve y = x³ + ax² + bx + 7 is concave-up for all x > 2 and this is the only section which is concave-up. Find the value of a.",
  hint:"💡 Find y'' in terms of a, solve y'' > 0 to get a boundary, then match it to x > 2.",
  steps:[{label:'Find derivatives', text:"y = x³ + ax² + bx + 7, so y' = 3x² + 2ax + b, and y'' = 6x + 2a"}, {label:'Solve for concave-up', text:"y'' > 0 gives 6x + 2a > 0, so x > −2a/6 = −a/3"}, {label:'Match to given boundary', text:"This region is given as x > 2, so −a/3 = 2, giving a = −6"}],
  answer:"∴ a = −6" },
{ type:'qa', id:'d22b', navLabel:'D22b', qnum:'Q 22b', heading:"Condition for strictly increasing",
  question:"The curve y = x³ + ax² + bx + 7 is concave-up for all x > 2 and this is the only section which is concave-up. Find a condition on b for the curve to be strictly increasing.",
  hint:"💡 With a = −6 from part a, y' is an upward-opening quadratic in x; for the curve to be strictly increasing everywhere you need y' ≥ 0 for all x, which means the discriminant of y' must not be positive.",
  steps:[{label:"Substitute a = −6 into y''", text:"y' = 3x² + 2(−6)x + b = 3x² − 12x + b"}, {label:'State the requirement', text:"For the curve to be strictly increasing for all x, we need y' ≥ 0 for every x, which (since the coefficient of x² is positive) requires the discriminant of y' to satisfy discriminant ≤ 0"}, {label:'Form and solve the discriminant inequality', text:"Discriminant = (−12)² − 4(3)(b) = 144 − 12b ≤ 0, so 144 ≤ 12b"}, {label:'Solve for b', text:"b ≥ 12"}],
  answer:"∴ The curve is strictly increasing for b ≥ 12" },
{ type:'qa', id:'d23a', navLabel:'D23a', qnum:'Q 23a', heading:"Evaluating b/a from critical points",
  question:"The curve y = ax³ − bx² (where a and b are positive) is increasing for x < 0 and x > 4. Evaluate b/a.",
  hint:"💡 The endpoints of the decreasing region (0 and 4) are the roots of y' = 0; factor y' and match its non-zero root to x = 4.",
  steps:[{label:"Find y' and factorise", text:"y = ax³ − bx², so y' = 3ax² − 2bx = x(3ax − 2b)"}, {label:'Identify the critical points', text:"y' = 0 when x = 0 or x = 2b/(3a); since the curve is increasing for x < 0 and x > 4 (and so decreasing between 0 and 4), these critical points must be x = 0 and x = 4"}, {label:'Solve for b/a', text:"2b/(3a) = 4, so 2b = 12a, giving b/a = 6"}],
  answer:"∴ b/a = 6" },
{ type:'qa', id:'d23b', navLabel:'D23b', qnum:'Q 23b', heading:"Proving concavity from the critical points",
  question:"The curve y = ax³ − bx² (where a and b are positive) is increasing for x < 0 and x > 4. Prove that the curve is concave-up for x > 2.",
  hint:"💡 Substitute b = 6a (from part a) into y'' and show it is positive whenever x > 2, using a > 0.",
  steps:[{label:"Find y''", text:"y = ax³ − bx², so y' = 3ax² − 2bx, and y'' = 6ax − 2b"}, {label:'Substitute b = 6a', text:"From part a, b = 6a, so y'' = 6ax − 2(6a) = 6ax − 12a = 6a(x − 2)"}, {label:'Argue the sign for x > 2', text:"Since a > 0 and (x − 2) > 0 whenever x > 2, the product 6a(x − 2) > 0 for all x > 2"}, {label:'Conclude', text:"Since y'' > 0 for all x > 2, the curve is concave-up for x > 2"}],
  answer:"∴ y'' = 6a(x − 2) > 0 for x > 2 (since a > 0), so the curve is concave-up for x > 2, as required" },
{ type:'qa', id:'d24', navLabel:'D24', qnum:'Q 24', heading:"Reconstructing y(x) from y''",
  question:"If y''(x) = 10, y'(0) = 10 and y(0) = 2 find y(x).",
  hint:"💡 Integrate y''(x) once to get y'(x) (using y'(0) to find the constant), then integrate again to get y(x) (using y(0) to find the next constant).",
  steps:[{label:"Integrate y'' to find y'", text:"y''(x) = 10, so y'(x) = 10x + C₁ for some constant C₁"}, {label:"Use y'(0) = 10 to find C₁", text:"y'(0) = 10(0) + C₁ = C₁ = 10, so y'(x) = 10x + 10"}, {label:"Integrate y' to find y", text:"y(x) = 5x² + 10x + C₂ for some constant C₂"}, {label:'Use y(0) = 2 to find C₂', text:"y(0) = 5(0)² + 10(0) + C₂ = C₂ = 2, so y(x) = 5x² + 10x + 2"}],
  answer:"∴ y(x) = 5x² + 10x + 2" },

{ type:'divider', id:'div-20e', navLabel:'20E', symbol:'E', bigNum:'20E', heading:'Local Maximum & Minimum Points', sub:"Finding turning points where the gradient is zero" },
{ type:'keypoint', id:'kp2010', navLabel:'KP 20.10', badge:'Key Point 20.10', heading:'Local Maximum and Minimum Points', formula:"At a local maximum or minimum point, f'(x) = 0.", notes:["Such a point is often called a stationary point.", "A point where the curve changes from increasing to decreasing is a local maximum; a point where it changes from decreasing to increasing is a local minimum."] },
{ type:'example', id:'we2018', navLabel:'WE 20.18', badge:'Worked Example 20.18', heading:'Finding Local Maximum/Minimum Points Using Substitution', question:"Find the value of x at any local maximum/minimum points of f(x) = x² − 2x^(3/2) + x.", hints:["Local maximum/minimum points occur where f'(x) = 0, so first differentiate: f'(x) = 2x − 2 × (3/2)x^(1/2) + 1 = 2x − 3x^(1/2) + 1.", "Set f'(x) = 0: 2x − 3x^(1/2) + 1 = 0.", "This is a disguised quadratic in x^(1/2). Let u = x^(1/2), so x = u²: 2u² − 3u + 1 = 0.", "Factorise: (2u − 1)(u − 1) = 0, giving u = 1/2 or u = 1.", "Convert back to x using x = u²: if u = 1/2 then x = (1/2)² = 1/4; if u = 1 then x = 1² = 1.", "So f(x) has local maximum/minimum points at x = 1/4 and x = 1."] },

{ type:'example', id:'we2019', navLabel:'WE 20.19', badge:'Worked Example 20.19', heading:'Local Maximum or Minimum?', question:"Determine whether each of the points found in Worked Example 20.18 is a local maximum or minimum. (Worked Example 20.18 found stationary points at x = 1/4 and x = 1, using f'(x) = 2x − 3x^(1/2) + 1.)", hints:["The stationary points found in Worked Example 20.18 occur at x = 1/4 and x = 1, since f'(x) = 2x − 3x^(1/2) + 1 = 0 at these values.", "Find the second derivative: f''(x) = 2 − (3/2)x^(-1/2).", "Evaluate the second derivative at x = 1/4: f''(1/4) = 2 − (3/2)(1/4)^(-1/2) = 2 − (3/2)(2) = 2 − 3 = −1.", "Since f''(1/4) = −1 < 0, there is a local maximum at x = 1/4.", "Evaluate the second derivative at x = 1: f''(1) = 2 − (3/2)(1)^(-1/2) = 2 − 3/2 = 1/2.", "Since f''(1) = 1/2 > 0, there is a local minimum at x = 1."] },
{ type:'keypoint', id:'kp2011', navLabel:'KP 20.11', badge:'Key Point 20.11', heading:'Key Point 20.11', formula:"Given f'(a) = 0: f''(a) negative ⇒ local maximum at x = a; f''(a) positive ⇒ local minimum at x = a; f''(a) = 0 ⇒ no conclusion can be drawn", notes:["This second derivative test only applies once you already know f'(a) = 0, i.e. that x = a is a stationary point.", "If f''(a) = 0, the test is inconclusive — the point could be a local maximum, a local minimum, or a point of inflection (see Worked Example 20.23) — so you must investigate further, for example by checking the sign of f'(x) on either side of x = a."] },
{ type:'example', id:'we2020', navLabel:'WE 20.20', badge:'Worked Example 20.20', heading:'Optimizing Profit', question:"A business produces x thousand units of a particular product each month, where x > 0. The profit P (in thousands of dollars) is given by P = 16x^(3/2) − x³ − 25. a) Find the number of units the business should produce each month to maximize its profit, showing that this is indeed a maximum. b) Find this maximum monthly profit.", hints:["Part a: Differentiate P with respect to x: dP/dx = 16 × (3/2)x^(1/2) − 3x² = 24x^(1/2) − 3x².", "For a maximum (or minimum), set dP/dx = 0: 24x^(1/2) − 3x² = 0.", "Factorize: 3x^(1/2)(8 − x^(3/2)) = 0. Since x > 0, x^(1/2) ≠ 0, so 8 − x^(3/2) = 0, giving x^(3/2) = 8.", "Solve for x by raising both sides to the power 2/3: x = 8^(2/3) = 4.", "To confirm this is a maximum (not a minimum), find the second derivative: d²P/dx² = 12x^(-1/2) − 6x.", "Evaluate at x = 4: d²P/dx² = 12(4^(-1/2)) − 6(4) = 12 × (1/2) − 24 = 6 − 24 = −18.", "Since d²P/dx² = −18 < 0, this confirms x = 4 gives a maximum.", "Remember x is measured in thousands of units, so the business should produce 4000 items per month to maximize its profit.", "Part b: Substitute x = 4 into P: P = 16(4^(3/2)) − 4³ − 25 = 16(8) − 64 − 25.", "P = 128 − 64 − 25 = 39. The maximum monthly profit is $39 000."] },

{ type:'divider', id:'div-ex20e', navLabel:'─', symbol:'E', bigNum:'Ex 20E', heading:'Exercise 20E — Full Solutions', sub:'Q1–22' },
{ type:'qa', id:'e1a', navLabel:'E1a', qnum:'Q 1a', heading:'Cubic stationary points',
  question:"f(x) = x³ - 3x² - 9x + 17",
  hint:"💡 Differentiate, solve f'(x)=0, then use f''(x) to classify",
  steps:[{label:'Differentiate', text:"f'(x) = 3x² - 6x - 9 = 3(x - 3)(x + 1)"}, {label:"Solve f'(x)=0", text:"3(x-3)(x+1)=0 gives x = 3 or x = -1"}, {label:'Find y-values', text:"f(3) = 27 - 27 - 27 + 17 = -10; f(-1) = -1 - 3 + 9 + 17 = 22"}, {label:"Classify with f''(x)", text:"f''(x) = 6x - 6. f''(3) = 12 > 0 so (3, -10) is a minimum. f''(-1) = -12 < 0 so (-1, 22) is a maximum"}],
  answer:"∴ Local maximum at (-1, 22), local minimum at (3, -10)" },
{ type:'qa', id:'e1b', navLabel:'E1b', qnum:'Q 1b', heading:'Cubic stationary points',
  question:"f(x) = 2x³ - 9x² + 12x + 5",
  hint:"💡 Factor f'(x) into two linear factors before solving",
  steps:[{label:'Differentiate', text:"f'(x) = 6x² - 18x + 12 = 6(x-1)(x-2)"}, {label:"Solve f'(x)=0", text:"6(x-1)(x-2)=0 gives x = 1 or x = 2"}, {label:'Find y-values', text:"f(1) = 2 - 9 + 12 + 5 = 10; f(2) = 16 - 36 + 24 + 5 = 9"}, {label:"Classify with f''(x)", text:"f''(x) = 12x - 18. f''(1) = -6 < 0 so (1, 10) is a maximum. f''(2) = 6 > 0 so (2, 9) is a minimum"}],
  answer:"∴ Local maximum at (1, 10), local minimum at (2, 9)" },
{ type:'qa', id:'e2a', navLabel:'E2a', qnum:'Q 2a', heading:'Fractional power stationary point',
  question:"f(x) = 2x^(1/2) - 3x + 1",
  hint:"💡 Write √x as x^(1/2) before differentiating",
  steps:[{label:'Differentiate', text:"f'(x) = x^(-1/2) - 3 = 1/√x - 3"}, {label:"Solve f'(x)=0", text:"1/√x = 3 ⟹ √x = 1/3 ⟹ x = 1/9"}, {label:'Find y-value', text:"f(1/9) = 2(1/3) - 3(1/9) + 1 = 2/3 - 1/3 + 1 = 4/3"}, {label:"Classify with f''(x)", text:"f''(x) = -(1/2)x^(-3/2). f''(1/9) = -(1/2)(27) = -13.5 < 0, so this is a maximum"}],
  answer:"∴ Local maximum at (1/9, 4/3)" },
{ type:'qa', id:'e2b', navLabel:'E2b', qnum:'Q 2b', heading:'Fractional power stationary point',
  question:"f(x) = x^(-1/2) + 4x - 2",
  hint:"💡 Differentiate term by term using the power rule with negative exponents",
  steps:[{label:'Differentiate', text:"f'(x) = -(1/2)x^(-3/2) + 4"}, {label:"Solve f'(x)=0", text:"4 = (1/2)x^(-3/2) ⟹ x^(-3/2) = 8 ⟹ x^(3/2) = 1/8 ⟹ x = 1/4"}, {label:'Find y-value', text:"f(1/4) = (1/4)^(-1/2) + 4(1/4) - 2 = 2 + 1 - 2 = 1"}, {label:"Classify with f''(x)", text:"f''(x) = (3/4)x^(-5/2), which is positive for all x > 0, so f''(1/4) > 0 and this is a minimum"}],
  answer:"∴ Local minimum at (1/4, 1)" },
{ type:'qa', id:'e3a', navLabel:'E3a', qnum:'Q 3a', heading:'Trig stationary points',
  question:"f(x) = sin x - x/2, 0 < x < 2π",
  hint:"💡 Solve cos x = 1/2 for two solutions in the given interval",
  steps:[{label:'Differentiate', text:"f'(x) = cos x - 1/2"}, {label:"Solve f'(x)=0", text:"cos x = 1/2 ⟹ x = π/3 or x = 5π/3 (in 0 < x < 2π)"}, {label:'Find y-values', text:"f(π/3) = √3/2 - π/6 ≈ 0.342; f(5π/3) = -√3/2 - 5π/6 ≈ -3.484"}, {label:"Classify with f''(x)", text:"f''(x) = -sin x. f''(π/3) = -√3/2 < 0 (maximum); f''(5π/3) = √3/2 > 0 (minimum)"}],
  answer:"∴ Local maximum at (π/3, √3/2 - π/6), local minimum at (5π/3, -√3/2 - 5π/6)" },
{ type:'qa', id:'e3b', navLabel:'E3b', qnum:'Q 3b', heading:'Trig stationary points',
  question:"f(x) = cos x + x/2, 0 < x < 2π",
  hint:"💡 Solve sin x = 1/2 for two solutions in the given interval",
  steps:[{label:'Differentiate', text:"f'(x) = -sin x + 1/2"}, {label:"Solve f'(x)=0", text:"sin x = 1/2 ⟹ x = π/6 or x = 5π/6 (in 0 < x < 2π)"}, {label:'Find y-values', text:"f(π/6) = √3/2 + π/12 ≈ 1.128; f(5π/6) = -√3/2 + 5π/12 ≈ 0.443"}, {label:"Classify with f''(x)", text:"f''(x) = -cos x. f''(π/6) = -√3/2 < 0 (maximum); f''(5π/6) = √3/2 > 0 (minimum)"}],
  answer:"∴ Local maximum at (π/6, √3/2 + π/12), local minimum at (5π/6, -√3/2 + 5π/12)" },
{ type:'qa', id:'e4a', navLabel:'E4a', qnum:'Q 4a', heading:'Exponential stationary point',
  question:"f(x) = eˣ - 5x",
  hint:"💡 Set the derivative eˣ - 5 to zero and take ln",
  steps:[{label:'Differentiate', text:"f'(x) = eˣ - 5"}, {label:"Solve f'(x)=0", text:"eˣ = 5 ⟹ x = ln5"}, {label:'Find y-value', text:"f(ln5) = 5 - 5ln5 ≈ -3.05"}, {label:"Classify with f''(x)", text:"f''(x) = eˣ > 0 for all x, so f''(ln5) > 0, giving a minimum"}],
  answer:"∴ Local minimum at (ln5, 5 - 5ln5)" },
{ type:'qa', id:'e4b', navLabel:'E4b', qnum:'Q 4b', heading:'Exponential stationary point',
  question:"f(x) = x/2 - eˣ",
  hint:"💡 Set the derivative 1/2 - eˣ to zero and take ln",
  steps:[{label:'Differentiate', text:"f'(x) = 1/2 - eˣ"}, {label:"Solve f'(x)=0", text:"eˣ = 1/2 ⟹ x = ln(1/2) = -ln2"}, {label:'Find y-value', text:"f(-ln2) = (-ln2)/2 - e^(-ln2) = -(ln2)/2 - 1/2 = -(1+ln2)/2 ≈ -0.847"}, {label:"Classify with f''(x)", text:"f''(x) = -eˣ < 0 for all x, so f''(-ln2) < 0, giving a maximum"}],
  answer:"∴ Local maximum at (-ln2, -(1+ln2)/2)" },
{ type:'qa', id:'e5a', navLabel:'E5a', qnum:'Q 5a', heading:'Logarithmic stationary point',
  question:"f(x) = 3ln x - 2x",
  hint:"💡 Differentiate ln x as 1/x, then solve for x",
  steps:[{label:'Differentiate', text:"f'(x) = 3/x - 2"}, {label:"Solve f'(x)=0", text:"3/x = 2 ⟹ x = 3/2"}, {label:'Find y-value', text:"f(3/2) = 3ln(3/2) - 3 ≈ -1.78"}, {label:"Classify with f''(x)", text:"f''(x) = -3/x², which is negative for all x > 0, so this is a maximum"}],
  answer:"∴ Local maximum at (3/2, 3ln(3/2) - 3)" },
{ type:'qa', id:'e5b', navLabel:'E5b', qnum:'Q 5b', heading:'Logarithmic stationary point',
  question:"f(x) = x^(1/2) - ln x",
  hint:"💡 Multiply the equation f'(x)=0 through by x to clear fractions",
  steps:[{label:'Differentiate', text:"f'(x) = (1/2)x^(-1/2) - 1/x"}, {label:"Solve f'(x)=0", text:"Multiply by x: (1/2)x^(1/2) - 1 = 0 ⟹ √x = 2 ⟹ x = 4"}, {label:'Find y-value', text:"f(4) = 2 - ln4 = 2 - 2ln2 ≈ 0.61"}, {label:"Classify with f''(x)", text:"f''(x) = -(1/4)x^(-3/2) + 1/x². f''(4) = -1/32 + 1/16 = 1/32 > 0, so this is a minimum"}],
  answer:"∴ Local minimum at (4, 2 - 2ln2)" },
{ type:'qa', id:'e6', navLabel:'E6', qnum:'Q 6', heading:'Unknown constants from minimum',
  question:"The curve y = x² + bx + c has a minimum value at (1, 2). Find the values of b and c.",
  hint:"💡 Use dy/dx = 0 at x = 1, then substitute the point into y",
  steps:[{label:'Differentiate', text:"dy/dx = 2x + b"}, {label:'Apply stationary condition', text:"At x = 1, dy/dx = 0: 2(1) + b = 0 ⟹ b = -2"}, {label:'Substitute the point', text:"y(1) = 1 + b + c = 2 ⟹ 1 - 2 + c = 2 ⟹ c = 3"}],
  answer:"∴ b = -2, c = 3" },
{ type:'qa', id:'e7', navLabel:'E7', qnum:'Q 7', heading:'Unknown constants from minimum',
  question:"The curve y = x⁴ + bx + c has a minimum value at (1, -2). Find the values of b and c.",
  hint:"💡 Use dy/dx = 0 at x = 1, then substitute the point into y",
  steps:[{label:'Differentiate', text:"dy/dx = 4x³ + b"}, {label:'Apply stationary condition', text:"At x = 1, dy/dx = 0: 4(1) + b = 0 ⟹ b = -4"}, {label:'Substitute the point', text:"y(1) = 1 + b + c = -2 ⟹ 1 - 4 + c = -2 ⟹ c = 1"}],
  answer:"∴ b = -4, c = 1" },
{ type:'qa', id:'e8', navLabel:'E8', qnum:'Q 8', heading:'Advertising profit optimization',
  question:"The profit $P million made by a business which invests $x million in advertising is given by P = 10x² - 10x⁴ for x ≥ 0. Find the maximum profit the company can make, based on this model.",
  hint:"💡 Differentiate, set dP/dx = 0 and factorise out the common factor of x, then classify the resulting stationary point with the second derivative.",
  steps:[{label:'Differentiate', text:"dP/dx = 20x - 40x³"}, {label:'Solve dP/dx=0', text:"20x - 40x³ = 0 ⟹ 20x(1 - 2x²) = 0 ⟹ x = 0 or x² = 1/2, so x = 1/√2 (taking x ≥ 0)"}, {label:'Classify the stationary point', text:"d²P/dx² = 20 - 120x². At x = 1/√2: d²P/dx² = 20 - 120(1/2) = 20 - 60 = -40 < 0, so this is a maximum. (At x = 0, P = 0, which is smaller, and P → -∞ as x → ∞, confirming x = 1/√2 gives the global maximum for x ≥ 0.)"}, {label:'Find maximum profit', text:"P(1/√2) = 10(1/√2)² - 10(1/√2)⁴ = 10(1/2) - 10(1/4) = 5 - 2.5 = 2.5"}],
  answer:"∴ Maximum profit is P = $2.5 million, when x = 1/√2 ≈ $0.707 million is invested" },
{ type:'qa', id:'e9a', navLabel:'E9a', qnum:'Q 9a', heading:'Rectangle perimeter',
  question:"A rectangle has width x cm and length 20 - x cm. Find the perimeter of the rectangle.",
  hint:"💡 Add all four sides — the x terms should cancel",
  steps:[{label:'Sum the sides', text:"Perimeter = 2(width + length) = 2(x + (20-x))"}, {label:'Simplify', text:"Perimeter = 2(20) = 40 cm"}],
  answer:"∴ Perimeter = 40 cm, which is constant regardless of x" },
{ type:'qa', id:'e9b', navLabel:'E9b', qnum:'Q 9b', heading:'Rectangle area optimization',
  question:"A rectangle has width x cm and length 20 - x cm. Find the maximum area of the rectangle.",
  hint:"💡 Write area as a function of x, then differentiate and set to zero",
  steps:[{label:'Form area function', text:"A(x) = x(20-x) = 20x - x²"}, {label:'Differentiate and solve', text:"A'(x) = 20 - 2x = 0 ⟹ x = 10"}, {label:'Classify', text:"A''(x) = -2 < 0, so x = 10 gives a maximum"}, {label:'Evaluate maximum area', text:"A(10) = 10(20-10) = 100 cm²"}],
  answer:"∴ Maximum area = 100 cm² (when x = 10 cm, forming a 10 cm × 10 cm square)" },
{ type:'qa', id:'e10', navLabel:'E10', qnum:'Q 10', heading:'Stationary points of rational function',
  question:"Find the stationary points on the curve y = x²/(1+x).",
  hint:"💡 Use the quotient rule, then factor the numerator to find where y'=0",
  steps:[{label:'Differentiate with quotient rule', text:"y' = [2x(1+x) - x²(1)]/(1+x)² = (x² + 2x)/(1+x)² = x(x+2)/(1+x)²"}, {label:"Solve y'=0", text:"x(x+2) = 0 ⟹ x = 0 or x = -2"}, {label:'Find y-values', text:"y(0) = 0/1 = 0; y(-2) = 4/(1-2) = -4"}],
  answer:"∴ Stationary points at (0, 0) and (-2, -4)" },
{ type:'qa', id:'e11', navLabel:'E11', qnum:'Q 11', heading:'Stationary point with square root',
  question:"Find and classify the stationary points on the curve y = x - 2√x.",
  hint:"💡 Write √x as x^(1/2) and differentiate using the power rule",
  steps:[{label:'Differentiate', text:"y' = 1 - x^(-1/2) = 1 - 1/√x"}, {label:"Solve y'=0", text:"1/√x = 1 ⟹ √x = 1 ⟹ x = 1"}, {label:'Find y-value', text:"y(1) = 1 - 2(1) = -1"}, {label:"Classify with y''", text:"y'' = (1/2)x^(-3/2). At x=1, y'' = 1/2 > 0, so this is a minimum"}],
  answer:"∴ Local minimum at (1, -1)" },
{ type:'qa', id:'e12', navLabel:'E12', qnum:'Q 12', heading:'Stationary point with justification',
  question:"Find the stationary point on the curve y = sin x - 0.5x for 0 < x < π and justify that it is a local maximum.",
  hint:"💡 Solve cos x = 0.5 in the given interval, then use the second derivative",
  steps:[{label:'Differentiate', text:"y' = cos x - 0.5"}, {label:"Solve y'=0", text:"cos x = 0.5 ⟹ x = π/3 (the only solution in 0 < x < π)"}, {label:'Find y-value', text:"y(π/3) = sin(π/3) - 0.5(π/3) = √3/2 - π/6 ≈ 0.342"}, {label:"Justify with y''", text:"y'' = -sin x. At x = π/3, y'' = -√3/2 < 0, which confirms a local maximum"}],
  answer:"∴ Stationary point at (π/3, √3/2 - π/6) is a local maximum" },
{ type:'qa', id:'e13', navLabel:'E13', qnum:'Q 13', heading:'Cuboid volume optimization',
  question:"A cuboid is formed by a square base of side length x cm. The other side of the cuboid is of length 9 - x cm. Find the maximum volume of the cuboid.",
  hint:"💡 Write volume as base area × height, then differentiate and set to zero",
  steps:[{label:'Form volume function', text:"V(x) = x²(9-x) = 9x² - x³"}, {label:'Differentiate and solve', text:"V'(x) = 18x - 3x² = 3x(6-x) = 0 ⟹ x = 0 or x = 6"}, {label:'Classify', text:"V''(x) = 18 - 6x. At x = 6, V'' = -18 < 0, so this is a maximum (x=0 gives trivial zero volume)"}, {label:'Evaluate maximum volume', text:"V(6) = 6²(9-6) = 36(3) = 108 cm³"}],
  answer:"∴ Maximum volume = 108 cm³ (when x = 6 cm)" },
{ type:'qa', id:'e14a', navLabel:'E14a', qnum:'Q 14a', heading:'Derivative of ln x / x',
  question:"The function f is defined by f(x) = ln x / x for x > 0. Find f'(x).",
  hint:"💡 Apply the quotient rule with numerator ln x and denominator x",
  steps:[{label:'Apply quotient rule', text:"f'(x) = [(1/x)(x) - (ln x)(1)]/x² = (1 - ln x)/x²"}],
  answer:"∴ f'(x) = (1 - ln x)/x²" },
{ type:'qa', id:'e14b', navLabel:'E14b', qnum:'Q 14b', heading:'Stationary point of ln x / x',
  question:"Find the coordinates of the stationary point on the curve y = f(x).",
  hint:"💡 Set f'(x) = 0 using the result from part a",
  steps:[{label:"Solve f'(x)=0", text:"(1 - ln x)/x² = 0 ⟹ 1 - ln x = 0 ⟹ ln x = 1 ⟹ x = e"}, {label:'Find y-value', text:"f(e) = ln e / e = 1/e"}],
  answer:"∴ Stationary point at (e, 1/e)" },
{ type:'qa', id:'e14c', navLabel:'E14c', qnum:'Q 14c', heading:'Prove second derivative formula',
  question:"Show that f''(x) = (2 ln x - 3)/x³.",
  hint:"💡 Differentiate f'(x) = (1-ln x)x⁻² using the product rule",
  steps:[{label:'Apply product rule', text:"f''(x) = (-1/x)x^(-2) + (1-ln x)(-2x^(-3)) = -x^(-3) - 2x^(-3)(1-ln x)"}, {label:'Simplify', text:"f''(x) = -x^(-3)[1 + 2(1-ln x)] = -x^(-3)[3 - 2ln x] = (2ln x - 3)/x³"}],
  answer:"∴ f''(x) = (2 ln x - 3)/x³, as required" },
{ type:'qa', id:'e14d', navLabel:'E14d', qnum:'Q 14d', heading:"Classify using f''(x)",
  question:"Hence classify the stationary point.",
  hint:"💡 Substitute x = e into the formula for f''(x) from part c",
  steps:[{label:"Evaluate f''(e)", text:"f''(e) = (2ln e - 3)/e³ = (2-3)/e³ = -1/e³"}, {label:'Interpret sign', text:"Since f''(e) = -1/e³ < 0, the stationary point is a maximum"}],
  answer:"∴ (e, 1/e) is a local maximum" },
{ type:'qa', id:'e15', navLabel:'E15', qnum:'Q 15', heading:'Stationary points of e^(sinx)',
  question:"Find and classify the stationary points on the curve y = e^(sinx) for 0 < x < 2π.",
  hint:"💡 Since e^(sinx) is never zero, y'=0 only where cos x = 0",
  steps:[{label:'Differentiate', text:"y' = cos x · e^(sinx)"}, {label:"Solve y'=0", text:"Since e^(sinx) > 0 always, cos x = 0 ⟹ x = π/2 or x = 3π/2"}, {label:'Find y-values', text:"At x=π/2, sinx=1 so y=e; at x=3π/2, sinx=-1 so y=e⁻¹=1/e"}, {label:"Classify with y''", text:"y'' = e^(sinx)(cos²x - sinx). At x=π/2: y''=e(0-1)=-e<0 (maximum). At x=3π/2: y''=e⁻¹(0+1)=1/e>0 (minimum)"}],
  answer:"∴ Local maximum at (π/2, e), local minimum at (3π/2, 1/e)" },
{ type:'qa', id:'e16a', navLabel:'E16a', qnum:'Q 16a', heading:'Initial bacteria count',
  question:"The number of live bacteria, N million, t minutes after being introduced into an agar solution is modelled by N = eᵗ - 2t + 5. Find the initial number of live bacteria.",
  hint:"💡 Substitute t = 0 into the model",
  steps:[{label:'Substitute t=0', text:"N(0) = e⁰ - 2(0) + 5 = 1 + 5 = 6"}],
  answer:"∴ Initial number of live bacteria = 6 million" },
{ type:'qa', id:'e16b', navLabel:'E16b', qnum:'Q 16b', heading:'Minimum bacteria count',
  question:"Find the minimum value of N.",
  hint:"💡 Differentiate N with respect to t and set to zero",
  steps:[{label:'Differentiate', text:"dN/dt = eᵗ - 2"}, {label:'Solve dN/dt=0', text:"eᵗ = 2 ⟹ t = ln2"}, {label:'Classify', text:"d²N/dt² = eᵗ > 0 for all t, so this is a minimum"}, {label:'Evaluate minimum N', text:"N(ln2) = e^(ln2) - 2ln2 + 5 = 2 - 2ln2 + 5 = 7 - 2ln2 ≈ 5.61"}],
  answer:"∴ Minimum value of N = 7 - 2ln2 ≈ 5.61 million (at t = ln2 minutes)" },
{ type:'qa', id:'e17a', navLabel:'E17a', qnum:'Q 17a', heading:'Widget pricing optimization',
  question:"A manufacturer of widgets believes that if he sets the price of widgets at $x per widget he will make a profit of $x - 4 per widget and sell 1000 - 100x widgets each day. Based on this model, what price should he charge to maximize his profit?",
  hint:"💡 Multiply profit-per-widget by number sold to get total daily profit, then optimize",
  steps:[{label:'Form total profit function', text:"P(x) = (x-4)(1000-100x) = 1000x - 100x² - 4000 + 400x = -100x² + 1400x - 4000"}, {label:'Differentiate and solve', text:"P'(x) = -200x + 1400 = 0 ⟹ x = 7"}, {label:'Classify', text:"P''(x) = -200 < 0, so x = 7 gives a maximum"}],
  answer:"∴ The manufacturer should charge $7 per widget to maximize profit" },
{ type:'qa', id:'e17b', navLabel:'E17b', qnum:'Q 17b', heading:'Comparing pricing models',
  question:"An alternative model suggests that the number of widgets sold will be 1000/(x+1)². Explain one advantage of this model compared to the one described in a.",
  hint:"💡 Think about what happens to the number sold as x becomes large in each model",
  steps:[{label:'Examine original model', text:"In the model from part a, sales = 1000-100x becomes negative for x > 10, which is not realistic (you cannot sell a negative number of widgets)"}, {label:'Examine alternative model', text:"In the alternative model, sales = 1000/(x+1)² is always positive for x > -1, and simply approaches 0 as price increases, which better reflects realistic sales behavior at high prices"}],
  answer:"∴ Advantage: the alternative model never predicts a negative (unrealistic) number of widgets sold, whereas the original model does for x > 10" },
{ type:'qa', id:'e17c', navLabel:'E17c', qnum:'Q 17c', heading:'Optimizing with alternative sales model',
  question:"Based on the alternative model, find the price the manufacturer should charge to maximize his profit.",
  hint:"💡 Form P(x) = (x-4)×1000/(x+1)² and use the quotient (or product) rule",
  steps:[{label:'Form profit function', text:"P(x) = 1000(x-4)/(x+1)² = 1000(x-4)(x+1)^(-2)"}, {label:'Differentiate', text:"P'(x) = 1000[(x+1)^(-2) + (x-4)(-2)(x+1)^(-3)] = 1000(x+1)^(-3)[(x+1) - 2(x-4)] = 1000(9-x)/(x+1)³"}, {label:"Solve P'(x)=0", text:"9 - x = 0 ⟹ x = 9"}, {label:'Classify', text:"P'(x) > 0 for x < 9 and P'(x) < 0 for x > 9 (since (x+1)³ > 0), so x = 9 gives a maximum"}],
  answer:"∴ The manufacturer should charge $9 per widget to maximize profit" },
{ type:'qa', id:'e18a', navLabel:'E18a', qnum:'Q 18a', heading:'Drone distance expression',
  question:"A drone of mass m kg (which is larger than 0.25) can travel at a constant speed of 4 - 1/m metres per second for a time of 200/m seconds. Find an expression for the distance travelled by a drone of mass m.",
  hint:"💡 Distance = speed × time",
  steps:[{label:'Multiply speed by time', text:"D(m) = (4 - 1/m)(200/m) = 800/m - 200/m²"}],
  answer:"∴ D(m) = 800/m - 200/m²" },
{ type:'qa', id:'e18b', navLabel:'E18b', qnum:'Q 18b', heading:'Optimizing drone mass',
  question:"What mass should the manufacturer select to maximize the distance the drone can travel?",
  hint:"💡 Differentiate D(m) with respect to m and set to zero, checking m > 0.25",
  steps:[{label:'Differentiate', text:"D'(m) = -800m^(-2) + 400m^(-3)"}, {label:"Solve D'(m)=0", text:"-800/m² + 400/m³ = 0 ⟹ multiply by m³: -800m + 400 = 0 ⟹ m = 0.5"}, {label:'Check domain and classify', text:"m = 0.5 satisfies m > 0.25. D''(m) = 1600m^(-3) - 1200m^(-4); at m=0.5, D'' = 12800 - 19200 = -6400 < 0, so this is a maximum"}],
  answer:"∴ The manufacturer should select a mass of m = 0.5 kg (giving a maximum distance of 800 m)" },
{ type:'qa', id:'e19', navLabel:'E19', qnum:'Q 19', heading:'Range of exponential function',
  question:"Find the range of the function f(x) = eˣ - 3x + 7.",
  hint:"💡 Find the global minimum, then note the function increases without bound either side",
  steps:[{label:'Differentiate and solve', text:"f'(x) = eˣ - 3 = 0 ⟹ x = ln3"}, {label:'Classify', text:"f''(x) = eˣ > 0 for all x, so f is convex and x = ln3 gives the global minimum"}, {label:'Evaluate minimum', text:"f(ln3) = 3 - 3ln3 + 7 = 10 - 3ln3 ≈ 6.70"}, {label:'Determine range', text:"Since f''(x) > 0 everywhere, f(x) → ∞ as x → ±∞, so the minimum value is the least value attained"}],
  answer:"∴ Range: f(x) ≥ 10 - 3ln3, i.e. [10 - 3ln3, ∞)" },
{ type:'qa', id:'e20', navLabel:'E20', qnum:'Q 20', heading:'Range of quartic function',
  question:"Find the range of the function f(x) = 3x⁴ - 4x³ - 12x² + 2.",
  hint:"💡 Find all stationary points, classify them, then compare local minima with the end behavior",
  steps:[{label:'Differentiate and factor', text:"f'(x) = 12x³ - 12x² - 24x = 12x(x² - x - 2) = 12x(x-2)(x+1)"}, {label:"Solve f'(x)=0", text:"x = 0, x = 2, x = -1"}, {label:"Classify using f''(x)", text:"f''(x)=36x²-24x-24. f''(0)=-24<0 (max, f=2); f''(2)=72>0 (min, f=-30); f''(-1)=36>0 (min, f=-3)"}, {label:'Determine global minimum', text:"Since the leading term 3x⁴ is positive, f(x)→∞ as x→±∞, so the overall minimum is the smaller of the two local minima: -30 (at x=2) versus -3 (at x=-1)"}],
  answer:"∴ Range: f(x) ≥ -30, i.e. [-30, ∞)" },
{ type:'qa', id:'e21', navLabel:'E21', qnum:'Q 21', heading:'Stationary points via substitution',
  question:"Find and classify the stationary points on the curve y = e^(2x) - 6eˣ + 4x + 8.",
  hint:"💡 Let u = eˣ to turn y'=0 into a quadratic equation",
  steps:[{label:'Differentiate', text:"y' = 2e^(2x) - 6eˣ + 4"}, {label:'Substitute u=eˣ and solve', text:"Let u=eˣ: 2u² - 6u + 4 = 0 ⟹ u² - 3u + 2 = 0 ⟹ (u-1)(u-2)=0 ⟹ u=1 or u=2"}, {label:'Find x and y values', text:"u=1: eˣ=1 ⟹ x=0, y(0)=1-6+0+8=3. u=2: eˣ=2 ⟹ x=ln2, y(ln2)=4-12+4ln2+8=4ln2"}, {label:"Classify with y''", text:"y''=4e^(2x)-6eˣ. At x=0: y''=4-6=-2<0 (maximum). At x=ln2: y''=16-12=4>0 (minimum)"}],
  answer:"∴ Local maximum at (0, 3), local minimum at (ln2, 4ln2)" },
{ type:'qa', id:'e22', navLabel:'E22', qnum:'Q 22', heading:'Hanging chain minimum height',
  question:"The height, h metres, of a point on a hanging chain at a given x-coordinate, is modelled by h(x) = eˣ + e^(-2x). Find the minimum height of the chain.",
  hint:"💡 Set h'(x)=0 and multiply through by e^(2x) to solve for eˣ",
  steps:[{label:'Differentiate', text:"h'(x) = eˣ - 2e^(-2x)"}, {label:"Solve h'(x)=0", text:"eˣ = 2e^(-2x) ⟹ multiply by e^(2x): e^(3x) = 2 ⟹ x = (ln2)/3"}, {label:'Classify', text:"h''(x) = eˣ + 4e^(-2x) > 0 for all x, so this is a minimum"}, {label:'Evaluate minimum height', text:"eˣ = 2^(1/3), e^(-2x) = 2^(-2/3) = 2^(1/3)/2. So h = 2^(1/3) + 2^(1/3)/2 = (3/2)×2^(1/3) = (3∛2)/2 ≈ 1.89 m"}],
  answer:"∴ Minimum height = (3∛2)/2 ≈ 1.89 metres (at x = (ln2)/3)" },

{ type:'divider', id:'div-20f', navLabel:'20F', symbol:'F', bigNum:'20F', heading:'Points of Inflection', sub:'Identifying stationary and non-stationary points of inflection using the second derivative' },
{ type:'keypoint', id:'kp2012', navLabel:'KP 20.12', badge:'Key Point 20.12', heading:'Key Point 20.12', formula:"At a point of inflection: f''(x) = 0 and the concavity of the function changes", notes:["f''(x) = 0 is a necessary condition for a point of inflection, but it is NOT sufficient on its own — you must also check that the concavity (the sign of f''(x)) actually changes either side of the point.", "If f''(x) = 0 but the sign of f''(x) is the same on both sides (for example, positive-then-positive), the concavity has not changed and the point is NOT a point of inflection — see Worked Example 20.22, where x = 0 satisfies f''(0) = 0 but is not a point of inflection.", "A point of inflection is called stationary if f'(x) = 0 there too (the tangent is horizontal), and non-stationary if f'(x) ≠ 0 (the tangent has a non-zero gradient but the curve still crosses it at that point)."] },
{ type:'example', id:'we2021', navLabel:'WE 20.21', badge:'Worked Example 20.21', heading:'Stationary or Non-Stationary Inflection?', question:"The function f(x) = eˣ − 3x² has a point of inflection. a) Find the value of x at which this occurs. b) Determine whether this is a stationary or non-stationary point of inflection.", hints:["Part a: Find the first derivative: f'(x) = eˣ − 6x.", "Find the second derivative: f''(x) = eˣ − 6.", "At a point of inflection, f''(x) = 0: eˣ − 6 = 0, so eˣ = 6, giving x = ln 6.", "Since this is the only candidate and the question only asks for the point of inflection, there is no need to check that the concavity changes here.", "Part b: At a stationary point, f'(x) = 0, so check whether this holds at x = ln 6.", "f'(ln 6) = e^(ln 6) − 6 ln 6 = 6 − 6 ln 6.", "Since ln 6 ≠ 1, we have 6 − 6 ln 6 ≠ 0, so f'(ln 6) ≠ 0.", "So x = ln 6 is a non-stationary point of inflection."] },
{ type:'example', id:'we2022', navLabel:'WE 20.22', badge:'Worked Example 20.22', heading:'Checking Candidates Carefully', question:"Find any inflection points of the function f(x) = 3x⁵ + 5x⁴.", hints:["Find the first derivative: f'(x) = 15x⁴ + 20x³.", "Find the second derivative: f''(x) = 60x³ + 60x².", "At a point of inflection, f''(x) = 0: 60x³ + 60x² = 0, so 60x²(x + 1) = 0, giving two candidates: x = 0 or x = −1.", "Check the candidate x = −1 first: find the sign of f''(x) either side of x = −1 (avoid using x = 0, since you already know f''(0) = 0).", "f''(−2) = 60(−2)³ + 60(−2)² = 60(−8) + 60(4) = −480 + 240 = −240 < 0.", "f''(−1/2) = 60(−1/2)³ + 60(−1/2)² = 60(−1/8) + 60(1/4) = −15/2 + 15 = 15/2 > 0.", "The concavity changes from concave-down to concave-up either side of x = −1, so this IS a point of inflection. The y-coordinate is f(−1) = 3(−1)⁵ + 5(−1)⁴ = −3 + 5 = 2, giving the point (−1, 2).", "Also, f'(−1) = 15(−1)⁴ + 20(−1)³ = 15 − 20 = −5 ≠ 0, so (−1, 2) is a non-stationary point of inflection.", "Now check the candidate x = 0. You already found f''(x) is positive (concave-up) for x just less than 0 (using x = −1/2 above). Now check the sign just greater than 0.", "f''(1) = 60(1)³ + 60(1)² = 60 + 60 = 120 > 0.", "The function is concave-up on both sides of x = 0 (no sign change), so despite f''(0) = 0, x = 0 is NOT a point of inflection — this shows that f''(x) = 0 alone is not sufficient."] },
{ type:'example', id:'we2023', navLabel:'WE 20.23', badge:'Worked Example 20.23', heading:'When the Second Derivative Test Fails', question:"Find the coordinates of the stationary point on the curve y = x⁴ and determine its nature.", hints:["Stationary points occur where dy/dx = 0: dy/dx = 4x³, so 4x³ = 0, giving x = 0.", "Find the y-coordinate: when x = 0, y = 0⁴ = 0. So the only stationary point is (0, 0).", "Find the second derivative: d²y/dx² = 12x².", "Evaluate at x = 0: d²y/dx² = 12(0)² = 0. Since d²y/dx² = 0, no conclusion can be drawn about the nature of the stationary point from this alone.", "As the second derivative test is inconclusive, check the sign of the first derivative (gradient) either side of x = 0 instead.", "When x = −1: dy/dx = 4(−1)³ = −4 < 0, so the curve is decreasing just before x = 0.", "When x = 1: dy/dx = 4(1)³ = 4 > 0, so the curve is increasing just after x = 0.", "The gradient changes from negative to positive either side of x = 0, so (0, 0) is a local minimum."] },

{ type:'divider', id:'div-ex20f', navLabel:'─', symbol:'F', bigNum:'Ex 20F', heading:'Exercise 20F — Full Solutions', sub:'Q1–18' },
{ type:'qa', id:'f1a', navLabel:'F1a', qnum:'Q 1a', heading:'Cubic inflection point',
  question:"For questions 1 to 5, use the method demonstrated in Worked Example 20.21 to find the value(s) of x at which the given function has the given number of points of inflection, stating whether each is stationary or non-stationary. f(x) = x³ - 6x² - 4x + 3: 1 point of inflection.",
  hint:"💡 Solve f''(x) = 0 for the x-value, then test f'(x) there to decide stationary vs non-stationary.",
  steps:[
    {label:'Differentiate twice', text:"f'(x) = 3x² - 12x - 4, so f''(x) = 6x - 12."},
    {label:"Solve f''(x)=0", text:"6x - 12 = 0 gives x = 2. Since f'''(x) = 6 ≠ 0, f''(x) genuinely changes sign at x = 2, confirming a true point of inflection."},
    {label:'Test the gradient there', text:"f'(2) = 3(2)² - 12(2) - 4 = 12 - 24 - 4 = -16 ≠ 0, so the tangent at x = 2 is not horizontal."}
  ],
  answer:"∴ x = 2 is a non-stationary point of inflection." },

{ type:'qa', id:'f1b', navLabel:'F1b', qnum:'Q 1b', heading:'Cubic inflection point',
  question:"f(x) = x³ - 12x² + x + 5: find the x-value of its 1 point of inflection and state whether it is stationary or non-stationary.",
  hint:"💡 Find where f''(x) = 0, then check f' there.",
  steps:[
    {label:'Differentiate twice', text:"f'(x) = 3x² - 24x + 1, so f''(x) = 6x - 24."},
    {label:"Solve f''(x)=0", text:"6x - 24 = 0 gives x = 4. f'''(x) = 6 ≠ 0, so the concavity genuinely changes here."},
    {label:'Test the gradient there', text:"f'(4) = 3(16) - 24(4) + 1 = 48 - 96 + 1 = -47 ≠ 0."}
  ],
  answer:"∴ x = 4 is a non-stationary point of inflection." },

{ type:'qa', id:'f2a', navLabel:'F2a', qnum:'Q 2a', heading:'Quartic, two inflections',
  question:"f(x) = x⁴ - 6x³: find the x-values of its 2 points of inflection, stating whether each is stationary or non-stationary.",
  hint:"💡 f''(x) will be quadratic — factorise it to get both x-values at once.",
  steps:[
    {label:'Differentiate twice', text:"f'(x) = 4x³ - 18x², so f''(x) = 12x² - 36x = 12x(x - 3)."},
    {label:"Solve f''(x)=0", text:"x = 0 or x = 3. Checking signs of 12x(x-3): positive for x<0, negative for 0<x<3, positive for x>3 — f'' changes sign at both values, so both are genuine points of inflection."},
    {label:'Test the gradient at x=0', text:"f'(0) = 4(0)³ - 18(0)² = 0, so x = 0 is stationary."},
    {label:'Test the gradient at x=3', text:"f'(3) = 4(27) - 18(9) = 108 - 162 = -54 ≠ 0, so x = 3 is non-stationary."}
  ],
  answer:"∴ x = 0 is a stationary point of inflection; x = 3 is a non-stationary point of inflection." },

{ type:'qa', id:'f2b', navLabel:'F2b', qnum:'Q 2b', heading:'Quartic, two inflections',
  question:"f(x) = x⁴ - 4x³ + 16x - 16: find the x-values of its 2 points of inflection, stating whether each is stationary or non-stationary.",
  hint:"💡 Factorise f''(x) to find both x-values, then test f'(x) at each.",
  steps:[
    {label:'Differentiate twice', text:"f'(x) = 4x³ - 12x² + 16, so f''(x) = 12x² - 24x = 12x(x - 2)."},
    {label:"Solve f''(x)=0", text:"x = 0 or x = 2. The sign of 12x(x-2) is positive, negative, positive across these regions, so f'' changes sign at both — both are genuine points of inflection."},
    {label:'Test the gradient at x=0', text:"f'(0) = 16 ≠ 0, so x = 0 is non-stationary."},
    {label:'Test the gradient at x=2', text:"f'(2) = 4(8) - 12(4) + 16 = 32 - 48 + 16 = 0, so x = 2 is stationary."}
  ],
  answer:"∴ x = 0 is a non-stationary point of inflection; x = 2 is a stationary point of inflection." },

{ type:'qa', id:'f3a', navLabel:'F3a', qnum:'Q 3a', heading:'Trig inflections on [0,2π]',
  question:"f(x) = sin x - x, x ∈ [0, 2π]: find the x-values of its 3 points of inflection, stating whether each is stationary or non-stationary.",
  hint:"💡 Use f'''(x) ≠ 0 to confirm each root of f''(x) = 0 is genuine, then use f'(x) for stationarity.",
  steps:[
    {label:'Differentiate', text:"f'(x) = cos x - 1, f''(x) = -sin x, f'''(x) = -cos x."},
    {label:"Solve f''(x)=0", text:"-sin x = 0 on [0, 2π] gives x = 0, π, 2π."},
    {label:'Confirm each is genuine', text:"f'''(0) = -1 ≠ 0, f'''(π) = 1 ≠ 0, f'''(2π) = -1 ≠ 0, so all three are genuine points of inflection (f'' changes sign at each)."},
    {label:'Test the gradient at each', text:"f'(0) = cos 0 - 1 = 0 (stationary); f'(π) = cos π - 1 = -2 ≠ 0 (non-stationary); f'(2π) = cos 2π - 1 = 0 (stationary)."}
  ],
  answer:"∴ x = 0 and x = 2π are stationary points of inflection; x = π is a non-stationary point of inflection." },

{ type:'qa', id:'f3b', navLabel:'F3b', qnum:'Q 3b', heading:'Trig inflections on [0,2π]',
  question:"f(x) = cos x - x, x ∈ [0, 2π]: find the x-values of its 2 points of inflection, stating whether each is stationary or non-stationary.",
  hint:"💡 Solve f''(x) = 0 for cos x = 0 on the given interval, then check f'''(x) and f'(x).",
  steps:[
    {label:'Differentiate', text:"f'(x) = -sin x - 1, f''(x) = -cos x, f'''(x) = sin x."},
    {label:"Solve f''(x)=0", text:"cos x = 0 on [0, 2π] gives x = π/2, 3π/2."},
    {label:'Confirm each is genuine', text:"f'''(π/2) = 1 ≠ 0 and f'''(3π/2) = -1 ≠ 0, so both are genuine points of inflection."},
    {label:'Test the gradient at each', text:"f'(π/2) = -sin(π/2) - 1 = -2 ≠ 0 (non-stationary); f'(3π/2) = -sin(3π/2) - 1 = 1 - 1 = 0 (stationary)."}
  ],
  answer:"∴ x = π/2 is a non-stationary point of inflection; x = 3π/2 is a stationary point of inflection." },

{ type:'qa', id:'f4a', navLabel:'F4a', qnum:'Q 4a', heading:'Exponential inflection point',
  question:"f(x) = 4eˣ - x²: find the x-value of its 1 point of inflection and state whether it is stationary or non-stationary.",
  hint:"💡 f''(x) = 0 gives eˣ = a number — solve using ln.",
  steps:[
    {label:'Differentiate twice', text:"f'(x) = 4eˣ - 2x, so f''(x) = 4eˣ - 2."},
    {label:"Solve f''(x)=0", text:"4eˣ = 2 → eˣ = 1/2 → x = -ln 2. f'''(x) = 4eˣ > 0 always, so this is genuinely a point of inflection."},
    {label:'Test the gradient there', text:"f'(-ln 2) = 4e^(-ln 2) - 2(-ln 2) = 4(1/2) + 2ln 2 = 2 + 2ln 2 ≠ 0."}
  ],
  answer:"∴ x = -ln 2 is a non-stationary point of inflection." },

{ type:'qa', id:'f4b', navLabel:'F4b', qnum:'Q 4b', heading:'Exponential inflection point',
  question:"f(x) = eˣ - (1/2)x²: find the x-value of its 1 point of inflection and state whether it is stationary or non-stationary.",
  hint:"💡 Set f''(x) = 0 and solve for x using ln.",
  steps:[
    {label:'Differentiate twice', text:"f'(x) = eˣ - x, so f''(x) = eˣ - 1."},
    {label:"Solve f''(x)=0", text:"eˣ = 1 → x = 0. f'''(x) = eˣ = 1 ≠ 0 at x = 0, so this is genuinely a point of inflection."},
    {label:'Test the gradient there', text:"f'(0) = e⁰ - 0 = 1 ≠ 0."}
  ],
  answer:"∴ x = 0 is a non-stationary point of inflection." },

{ type:'qa', id:'f5', navLabel:'F5', qnum:'Q 5', heading:'Coordinates of an inflection point',
  question:"Find the coordinates of the point of inflection on the curve y = x³ + 9x² + x - 1.",
  hint:"💡 Find x from y'' = 0, then substitute back into y to get the y-coordinate.",
  steps:[
    {label:'Differentiate twice', text:"y' = 3x² + 18x + 1, so y'' = 6x + 18."},
    {label:"Solve y''=0", text:"6x + 18 = 0 → x = -3. Since y''' = 6 ≠ 0, y'' genuinely changes sign here."},
    {label:'Find the y-coordinate', text:"y(-3) = (-3)³ + 9(-3)² + (-3) - 1 = -27 + 81 - 3 - 1 = 50."}
  ],
  answer:"∴ the point of inflection is (-3, 50)." },

{ type:'qa', id:'f6', navLabel:'F6', qnum:'Q 6', heading:'Coordinates of an inflection point',
  question:"Find the point of inflection on the curve y = x⁵ - 80x².",
  hint:"💡 Solve y'' = 0 for x, then substitute back to find y.",
  steps:[
    {label:'Differentiate twice', text:"y' = 5x⁴ - 160x, so y'' = 20x³ - 160."},
    {label:"Solve y''=0", text:"20x³ = 160 → x³ = 8 → x = 2. y''' = 60x², and y'''(2) = 240 ≠ 0, so this is genuine."},
    {label:'Find the y-coordinate', text:"y(2) = 2⁵ - 80(2)² = 32 - 320 = -288."}
  ],
  answer:"∴ the point of inflection is (2, -288)." },

{ type:'qa', id:'f7', navLabel:'F7', qnum:'Q 7', heading:'Unknown constants from inflection point',
  question:"The curve y = x³ + bx² + c has a point of inflection at (1, 3). Find the values of b and c.",
  hint:"💡 Use y''(1) = 0 for b, then substitute (1,3) into y for c.",
  steps:[
    {label:'Differentiate twice', text:"y' = 3x² + 2bx, so y'' = 6x + 2b."},
    {label:"Apply y''(1)=0", text:"6(1) + 2b = 0 → 6 + 2b = 0 → b = -3."},
    {label:'Apply the point (1,3)', text:"y(1) = 1 + b(1) + c = 3. With b = -3: 1 - 3 + c = 3 → c = 5."},
    {label:'Sanity check', text:"y''' = 6 ≠ 0 always, so y'' = 6x - 6 genuinely changes sign at x = 1 — confirms a true point of inflection."}
  ],
  answer:"∴ b = -3 and c = 5." },

{ type:'qa', id:'f8', navLabel:'F8', qnum:'Q 8', heading:'Unknown constants from inflection point',
  question:"The curve y = 2x³ - ax² + b has a point of inflection at (1, -7). Find the values of a and b.",
  hint:"💡 Use y''(1) = 0 for a, then substitute (1,-7) into y for b.",
  steps:[
    {label:'Differentiate twice', text:"y' = 6x² - 2ax, so y'' = 12x - 2a."},
    {label:"Apply y''(1)=0", text:"12(1) - 2a = 0 → a = 6."},
    {label:'Apply the point (1,-7)', text:"y(1) = 2(1) - a(1) + b = 2 - 6 + b = -7 → b = -3."}
  ],
  answer:"∴ a = 6 and b = -3." },

{ type:'qa', id:'f9', navLabel:'F9', qnum:'Q 9', heading:'Stationary point of inflection, three unknowns',
  question:"The curve y = x³ + ax² + bx + c has a stationary point of inflection at (1, 3). Find the values of a, b and c.",
  hint:"💡 'Stationary point of inflection' means both y'(1) = 0 AND y''(1) = 0, plus the point lies on the curve.",
  steps:[
    {label:'Differentiate', text:"y' = 3x² + 2ax + b, y'' = 6x + 2a."},
    {label:"Apply y''(1)=0", text:"6 + 2a = 0 → a = -3."},
    {label:"Apply y'(1)=0", text:"3 + 2a + b = 0 → 3 - 6 + b = 0 → b = 3."},
    {label:'Apply the point (1,3)', text:"1 + a + b + c = 3 → 1 - 3 + 3 + c = 3 → c = 2."},
    {label:'Verify', text:"y = x³ - 3x² + 3x + 2 gives y' = 3(x-1)² ≥ 0 everywhere (flat but never negative — genuinely stationary, not extremum), and y'' = 6x - 6 changes sign at x = 1, confirming a genuine stationary point of inflection."}
  ],
  answer:"∴ a = -3, b = 3, c = 2." },

{ type:'qa', id:'f10a', navLabel:'F10a', qnum:'Q 10a', heading:"Log function's inflection point",
  question:"Find the point of inflection of the function f(x) = 8 ln x + x², where x > 0.",
  hint:"💡 Set f''(x) = 0 and solve for x (remember x > 0).",
  steps:[
    {label:'Differentiate twice', text:"f'(x) = 8/x + 2x, so f''(x) = -8/x² + 2."},
    {label:"Solve f''(x)=0", text:"2 = 8/x² → x² = 4 → x = 2 (rejecting x = -2 since x > 0)."},
    {label:'Find the y-coordinate', text:"f(2) = 8 ln 2 + 2² = 8 ln 2 + 4."}
  ],
  answer:"∴ the point of inflection is (2, 4 + 8 ln 2)." },

{ type:'qa', id:'f10b', navLabel:'F10b', qnum:'Q 10b', heading:"Log function's inflection point",
  question:"Determine whether the point of inflection found in part a is stationary or non-stationary.",
  hint:"💡 Evaluate f'(2) and also confirm the concavity actually changes sign either side of x = 2.",
  steps:[
    {label:'Test the gradient', text:"f'(2) = 8/2 + 2(2) = 4 + 4 = 8 ≠ 0, so the tangent is not horizontal."},
    {label:'Confirm genuineness', text:"f''(x) = 2 - 8/x²: for x < 2, f'' < 0; for x > 2, f'' > 0 — concavity genuinely changes at x = 2."}
  ],
  answer:"∴ (2, 4 + 8 ln 2) is a non-stationary point of inflection." },

{ type:'qa', id:'f11a', navLabel:'F11a', qnum:'Q 11a', heading:'No stationary points',
  question:"Show that the graph y = 2 ln x + x² has no stationary points.",
  hint:"💡 Write down y' and consider the sign of each term for x > 0 (the domain of ln x).",
  steps:[
    {label:'Differentiate', text:"y' = 2/x + 2x."},
    {label:'Consider the domain', text:"Since ln x requires x > 0, both terms 2/x and 2x are strictly positive for every x in the domain."},
    {label:'Conclude', text:"A sum of two positive quantities can never equal zero, so y' = 0 has no solution."}
  ],
  answer:"∴ y' > 0 for all x > 0, so the curve has no stationary points." },

{ type:'qa', id:'f11b', navLabel:'F11b', qnum:'Q 11b', heading:'Coordinates of an inflection point',
  question:"Find the coordinates of the point of inflection on the graph y = 2 ln x + x².",
  hint:"💡 Solve y'' = 0, keeping only the solution in the domain x > 0.",
  steps:[
    {label:'Differentiate twice', text:"y' = 2/x + 2x, so y'' = -2/x² + 2."},
    {label:"Solve y''=0", text:"2 = 2/x² → x² = 1 → x = 1 (x = -1 is rejected since x > 0)."},
    {label:'Confirm genuineness', text:"For 0 < x < 1, y'' < 0; for x > 1, y'' > 0 — concavity genuinely changes."},
    {label:'Find the y-coordinate', text:"y(1) = 2 ln 1 + 1² = 0 + 1 = 1."}
  ],
  answer:"∴ the point of inflection is (1, 1)." },

{ type:'qa', id:'f12', navLabel:'F12', qnum:'Q 12', heading:"Reading f'(x) graphs",
  question:"The graph shows y = f'(x): a cubic-shaped curve that comes up from below the x-axis on the left, crosses the axis moving upward, rises to a hump (turning point) above the axis, falls back down and crosses the axis moving downward, dips to a trough (turning point) below the axis, then rises again, crosses the axis moving upward, and shoots up steeply to the right. Make a sketch of y = f(x). a Mark all points corresponding to a local minimum of f(x) with a P. b Mark all points corresponding to a local maximum of f(x) with a Q. c Mark all points corresponding to a point of inflection of f(x) with an R. d Are any of the points of inflection stationary points of inflection? Explain your answer.",
  hint:"💡 Zeros of f'(x) give stationary points of f; turning points of f'(x) (where f''(x)=0) give inflection points of f.",
  steps:[
    {label:'Find local minima (P)', text:"A local minimum of f occurs where f'(x) = 0 AND f' changes from negative to positive. This happens at the first crossing (left) and again at the third crossing (right), where the f'-graph rises up through the axis — mark these P."},
    {label:'Find local maxima (Q)', text:"A local maximum of f occurs where f'(x) = 0 AND f' changes from positive to negative. This happens at the middle crossing, where the f'-graph falls down through the axis — mark this Q."},
    {label:'Find inflection points (R)', text:"A point of inflection of f occurs where f''(x) = 0, i.e. where the f'-graph itself has a turning point (its own local max or min). This happens at the hump (f' has a local max there) and at the trough (f' has a local min there) — mark both R."},
    {label:'Decide which are stationary (d)', text:"A stationary point of inflection needs BOTH f'(x) = 0 and f''(x) = 0 at the same x. The hump of the f'-graph sits clearly above the x-axis (f' > 0 there, not zero), and the trough sits clearly below it (f' < 0 there, not zero) — neither R point coincides with an x-intercept of f'."}
  ],
  answer:"∴ P marks the two upward crossings, Q marks the middle downward crossing, R marks the hump and the trough of the f'-graph; neither point of inflection is stationary, because f'(x) ≠ 0 at the hump or the trough (a stationary point of inflection would require f' to touch the x-axis exactly at its own turning point, which does not happen here)." },

{ type:'qa', id:'f13a', navLabel:'F13a', qnum:'Q 13a', heading:'Stationary points of a quartic',
  question:"Find the x-coordinates of the stationary points of the function f(x) = x⁴ - 6x² + 8x - 3.",
  hint:"💡 Set f'(x) = 0 and factorise the resulting cubic (try small integer roots).",
  steps:[
    {label:'Differentiate', text:"f'(x) = 4x³ - 12x + 8 = 4(x³ - 3x + 2)."},
    {label:'Factorise', text:"x = 1 is a root of x³ - 3x + 2 (1 - 3 + 2 = 0), so x³ - 3x + 2 = (x - 1)(x² + x - 2) = (x - 1)(x - 1)(x + 2) = (x-1)²(x+2)."},
    {label:"Solve f'(x)=0", text:"4(x-1)²(x+2) = 0 gives x = 1 (repeated) or x = -2."}
  ],
  answer:"∴ the stationary points are at x = -2 and x = 1." },

{ type:'qa', id:'f13b', navLabel:'F13b', qnum:'Q 13b', heading:'Nature of stationary points',
  question:"Determine the nature of the stationary points found in part a.",
  hint:"💡 Try the second derivative test first; if it's inconclusive at the repeated root, examine the sign of f' either side.",
  steps:[
    {label:'Second derivative test', text:"f''(x) = 12x² - 12. f''(-2) = 12(4) - 12 = 36 > 0, so x = -2 is a local minimum."},
    {label:'Test at x=1', text:"f''(1) = 12 - 12 = 0 — inconclusive, so examine f'(x) = 4(x-1)²(x+2) directly around x = 1."},
    {label:"Sign of f' near x=1", text:"(x-1)² ≥ 0 always, and (x+2) ≈ 3 > 0 near x = 1, so f'(x) ≥ 0 on both sides of x = 1 — the gradient does not change sign."}
  ],
  answer:"∴ x = -2 is a local minimum; x = 1 is a stationary point of inflection (not a max or min)." },

{ type:'qa', id:'f14a', navLabel:'F14a', qnum:'Q 14a', heading:'Stationary points of a quintic',
  question:"Find the x-coordinates of the stationary points of the function f(x) = 5x⁴ - x⁵.",
  hint:"💡 Factor f'(x) as fully as possible before solving.",
  steps:[
    {label:'Differentiate', text:"f'(x) = 20x³ - 5x⁴ = 5x³(4 - x)."},
    {label:"Solve f'(x)=0", text:"5x³(4-x) = 0 gives x = 0 (from x³ = 0) or x = 4."}
  ],
  answer:"∴ the stationary points are at x = 0 and x = 4." },

{ type:'qa', id:'f14b', navLabel:'F14b', qnum:'Q 14b', heading:'Nature of stationary points',
  question:"Determine the nature of the stationary points found in part a.",
  hint:"💡 Test the sign of f'(x) = 5x³(4-x) just either side of each stationary point.",
  steps:[
    {label:'Sign either side of x=0', text:"At x = -0.1: x³ < 0, (4-x) > 0, so f' < 0. At x = 0.1: x³ > 0, (4-x) > 0, so f' > 0. Gradient goes negative → positive."},
    {label:'Sign either side of x=4', text:"At x = 3.9: x³ > 0, (4-x) > 0, so f' > 0. At x = 4.1: x³ > 0, (4-x) < 0, so f' < 0. Gradient goes positive → negative."}
  ],
  answer:"∴ x = 0 is a local minimum; x = 4 is a local maximum." },

{ type:'qa', id:'f15', navLabel:'F15', qnum:'Q 15', heading:'Inflections of a bell curve',
  question:"Find the exact coordinates of the points of inflection on the curve y = e^(-x²), fully justifying your answer.",
  hint:"💡 Use the product/chain rule twice, and remember e^(-x²) is never zero.",
  steps:[
    {label:'Differentiate once', text:"y' = -2x·e^(-x²)."},
    {label:'Differentiate again', text:"y'' = -2e^(-x²) + (-2x)(-2x·e^(-x²)) = e^(-x²)(4x² - 2)."},
    {label:"Solve y''=0", text:"Since e^(-x²) ≠ 0 for all x, we need 4x² - 2 = 0 → x² = 1/2 → x = ±√2/2."},
    {label:'Justify genuineness', text:"The sign of y'' matches the sign of (4x² - 2): positive for |x| > √2/2, negative for |x| < √2/2 — this changes sign at both x-values, confirming two genuine points of inflection."},
    {label:'Find the y-coordinates', text:"y(±√2/2) = e^(-1/2) = 1/√e, since x² = 1/2 at both points."}
  ],
  answer:"∴ the points of inflection are (√2/2, 1/√e) and (-√2/2, 1/√e)." },

{ type:'qa', id:'f16', navLabel:'F16', qnum:'Q 16', heading:'Inflection point of x²ln x',
  question:"Find the point of inflection on the curve y = x² ln x.",
  hint:"💡 Use the product rule twice; the domain is x > 0.",
  steps:[
    {label:'Differentiate once', text:"y' = 2x ln x + x²·(1/x) = 2x ln x + x."},
    {label:'Differentiate again', text:"y'' = 2 ln x + 2x·(1/x) + 1 = 2 ln x + 3."},
    {label:"Solve y''=0", text:"2 ln x + 3 = 0 → ln x = -3/2 → x = e^(-3/2)."},
    {label:'Justify genuineness', text:"y'' = 2 ln x + 3 is strictly increasing (its derivative 2/x > 0 for x > 0), so it changes sign exactly once, at x = e^(-3/2) — a genuine point of inflection."},
    {label:'Find the y-coordinate', text:"y(e^(-3/2)) = (e^(-3/2))²·ln(e^(-3/2)) = e^(-3)·(-3/2) = -3/(2e³)."}
  ],
  answer:"∴ the point of inflection is (e^(-3/2), -3/(2e³))." },

{ type:'qa', id:'f17', navLabel:'F17', qnum:'Q 17', heading:'Necessary but not sufficient',
  question:"Find the coordinates of any inflection points on the curve y = 3x⁵ - 10x⁴ + 10x³ + 2.",
  hint:"💡 Remember y'' = 0 is necessary but NOT sufficient — check that the sign of y'' actually changes at each root.",
  steps:[
    {label:'Differentiate twice', text:"y' = 15x⁴ - 40x³ + 30x², so y'' = 60x³ - 120x² + 60x = 60x(x² - 2x + 1) = 60x(x-1)²."},
    {label:"Solve y''=0", text:"y'' = 0 gives x = 0 or x = 1 (repeated root)."},
    {label:'Check x=0', text:"(x-1)² ≥ 0 always, so the sign of y'' follows the sign of x: negative for x < 0, positive for x > 0 — genuine sign change, so x = 0 IS a point of inflection."},
    {label:'Check x=1', text:"Near x = 1, both x > 0 and (x-1)² ≥ 0, so y'' ≥ 0 on both sides of x = 1 — no sign change, so x = 1 is NOT a point of inflection despite y''(1) = 0."},
    {label:'Find the y-coordinate at x=0', text:"y(0) = 0 - 0 + 0 + 2 = 2."}
  ],
  answer:"∴ the only point of inflection is (0, 2); x = 1 fails the sign-change test and is not an inflection point." },

{ type:'qa', id:'f18', navLabel:'F18', qnum:'Q 18', heading:'Proving a² = 3b',
  question:"The function f(x) = x³ + ax² + bx + c has a stationary point of inflection. Show that a² = 3b.",
  hint:"💡 A stationary point of inflection means f'(x) = 0 has a repeated root — use the discriminant.",
  steps:[
    {label:'Differentiate', text:"f'(x) = 3x² + 2ax + b, an upward-opening parabola."},
    {label:'State the condition', text:"A stationary point of inflection needs f'(x) = 0 to touch the x-axis without crossing — i.e. f'(x) = 0 must have a repeated (double) root, so its discriminant must equal zero."},
    {label:'Apply the discriminant condition', text:"For 3x² + 2ax + b = 0: discriminant = (2a)² - 4(3)(b) = 4a² - 12b."},
    {label:'Set discriminant to zero', text:"4a² - 12b = 0 → dividing by 4 gives a² - 3b = 0."}
  ],
  answer:"∴ a² = 3b, as required." },
