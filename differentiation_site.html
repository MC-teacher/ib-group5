{ type:'qa', id:'mp1a', navLabel:'M1a', qnum:'Q 1a', heading:'Cubic with parameter a',
  question:"Consider the function f(x) = ax³ - 3x + 5, where a ≠ 0. Find f'(x).",
  hint:"💡 Differentiate term by term using the power rule.",
  steps:[
    {label:'Differentiate each term', text:"d/dx(ax³) = 3ax², d/dx(-3x) = -3, d/dx(5) = 0."}
  ],
  answer:"f'(x) = 3ax² - 3" },

{ type:'qa', id:'mp1b', navLabel:'M1b', qnum:'Q 1b', heading:'Cubic with parameter a',
  question:"Using f'(x) = 3ax² - 3, write down the value of f'(0).",
  hint:"💡 Substitute x = 0 directly.",
  steps:[
    {label:'Substitute x = 0', text:"f'(0) = 3a(0)² - 3 = 0 - 3."}
  ],
  answer:"f'(0) = -3" },

{ type:'qa', id:'mp1c', navLabel:'M1c', qnum:'Q 1c', heading:'Cubic with parameter a',
  question:"The function f(x) = ax³ - 3x + 5 has a local maximum at x = -2. Calculate the value of a.",
  hint:"💡 A local maximum means f'(-2) = 0. Substitute and solve for a.",
  steps:[
    {label:'Apply the stationary condition', text:"f'(-2) = 0, so 3a(-2)² - 3 = 0."},
    {label:'Simplify', text:"3a(4) - 3 = 0, so 12a - 3 = 0."},
    {label:'Solve for a', text:"12a = 3, so a = 3/12 = 1/4."}
  ],
  answer:"∴ a = 1/4" },

{ type:'qa', id:'mp2', navLabel:'M2', qnum:'Q 2', heading:'Point of inflection of a cubic',
  question:"Find the coordinates of the point of inflection on the curve y = x³ + 6x² - 4x + 1.",
  hint:"💡 Find y'', set it to zero, solve for x, then substitute back into y to find the y-coordinate.",
  steps:[
    {label:'Differentiate twice', text:"y' = 3x² + 12x - 4, so y'' = 6x + 12."},
    {label:"Solve y''(x) = 0", text:"6x + 12 = 0, so x = -2. Since y''' = 6 ≠ 0, this is a genuine point of inflection."},
    {label:'Find the y-coordinate', text:"y(-2) = (-2)³ + 6(-2)² - 4(-2) + 1 = -8 + 24 + 8 + 1 = 25."}
  ],
  answer:"∴ Point of inflection: (-2, 25)" },

{ type:'qa', id:'mp3', navLabel:'M3', qnum:'Q 3', heading:'Minimum point → find b, c',
  question:"The curve y = x² + bx + c has a minimum value at (2, 3). Find the values of b and c.",
  hint:"💡 The minimum gives two facts: the gradient is zero there, and the point lies on the curve.",
  steps:[
    {label:'Use the stationary condition', text:"y' = 2x + b. Since the minimum is at x = 2, y'(2) = 0: 2(2) + b = 0, so b = -4."},
    {label:'Use the point on the curve', text:"y(2) = 3: (2)² + b(2) + c = 3, so 4 + 2(-4) + c = 3, giving 4 - 8 + c = 3."},
    {label:'Solve for c', text:"-4 + c = 3, so c = 7."}
  ],
  answer:"∴ b = -4, c = 7" },

{ type:'qa', id:'mp4', navLabel:'M4', qnum:'Q 4', heading:'Inflection point → find b, c',
  question:"The curve y = x³ + bx² + cx + 5 has a point of inflection at (2, -3). Find the values of b and c.",
  hint:"💡 A point of inflection gives y''(2) = 0, and the point also lies on the curve — that's two equations in b and c.",
  steps:[
    {label:'Differentiate twice', text:"y' = 3x² + 2bx + c, so y'' = 6x + 2b."},
    {label:'Apply the inflection condition', text:"y''(2) = 0: 6(2) + 2b = 0, so 12 + 2b = 0, giving b = -6."},
    {label:'Use the point on the curve', text:"y(2) = -3: (2)³ + b(2)² + c(2) + 5 = -3, so 8 + 4b + 2c + 5 = -3."},
    {label:'Substitute b = -6 and solve for c', text:"8 + 4(-6) + 2c + 5 = -3, so 8 - 24 + 2c + 5 = -3, giving -11 + 2c = -3, so 2c = 8, c = 4."}
  ],
  answer:"∴ b = -6, c = 4" },

{ type:'qa', id:'mp5', navLabel:'M5', qnum:'Q 5', heading:'Gradient of a square-root tangent',
  question:"Find the gradient of the tangent to the curve y = √(x - 1) at x = 5.",
  hint:"💡 Rewrite as (x-1)^(1/2) and use the chain rule.",
  steps:[
    {label:'Differentiate', text:"y = (x-1)^(1/2), so y' = (1/2)(x-1)^(-1/2) = 1/(2√(x-1))."},
    {label:'Substitute x = 5', text:"y'(5) = 1/(2√(5-1)) = 1/(2√4) = 1/(2·2) = 1/4."}
  ],
  answer:"∴ The gradient of the tangent at x = 5 is 1/4." },

{ type:'qa', id:'mp6', navLabel:'M6', qnum:'Q 6', heading:'Tangent to y = ln x',
  question:"Find the equation of the tangent to the curve y = ln x at x = 1.",
  hint:"💡 Find the gradient and the point, then use y - y₁ = m(x - x₁).",
  steps:[
    {label:'Differentiate and evaluate the gradient', text:"y' = 1/x, so y'(1) = 1/1 = 1."},
    {label:'Find the point of tangency', text:"y(1) = ln(1) = 0, so the point is (1, 0)."},
    {label:'Form the tangent line', text:"y - 0 = 1(x - 1)."}
  ],
  answer:"∴ y = x - 1" },

{ type:'qa', id:'mp7', navLabel:'M7', qnum:'Q 7', heading:'Normal to y = e^(2x)',
  question:"Find the equation of the normal to the curve y = e^(2x) at x = 0.",
  hint:"💡 Find the tangent gradient first, then take the negative reciprocal for the normal.",
  steps:[
    {label:'Differentiate and evaluate the gradient', text:"y' = 2e^(2x), so y'(0) = 2e⁰ = 2."},
    {label:'Find the normal gradient', text:"The normal gradient is the negative reciprocal: -1/2."},
    {label:'Find the point', text:"y(0) = e⁰ = 1, so the point is (0, 1)."},
    {label:'Form the normal line', text:"y - 1 = -1/2(x - 0)."}
  ],
  answer:"∴ y = -x/2 + 1" },

{ type:'qa', id:'mp8a', navLabel:'M8a', qnum:'Q 8a', heading:'x(ln x)² — local max & min',
  question:"The diagram shows the graph of f(x) = x(ln x)² for x > 0. It has a local maximum at point A and a local minimum at point B. Find the coordinates of A and B.",
  hint:"💡 Differentiate using the product rule, factorise f'(x), and use the sign of f' either side of each root to identify max vs min.",
  steps:[
    {label:'Differentiate using the product rule', text:"f'(x) = (ln x)² + x · 2(ln x)(1/x) = (ln x)² + 2 ln x = ln x (ln x + 2)."},
    {label:"Solve f'(x) = 0", text:"ln x = 0 gives x = 1; ln x = -2 gives x = e⁻²."},
    {label:'Test the sign of f′ across each region', text:"For 0 < x < e⁻²: both factors negative, so f' > 0 (increasing). For e⁻² < x < 1: ln x negative, (ln x+2) positive, so f' < 0 (decreasing). For x > 1: both factors positive, so f' > 0 (increasing). So x = e⁻² is a local maximum and x = 1 is a local minimum."},
    {label:'Evaluate f at each point', text:"f(e⁻²) = e⁻²(-2)² = 4e⁻². f(1) = 1(0)² = 0."}
  ],
  answer:"∴ A = (e⁻², 4e⁻²) ≈ (0.135, 0.541), B = (1, 0)" },

{ type:'qa', id:'mp8b', navLabel:'M8b', qnum:'Q 8b', heading:'x(ln x)² — point of inflection',
  question:"Given that the graph of f(x) = x(ln x)² has exactly one point of inflection, find its coordinates.",
  hint:"💡 Differentiate f'(x) = (ln x)² + 2 ln x again to get f''(x), then solve f''(x) = 0.",
  steps:[
    {label:'Differentiate again', text:"f''(x) = 2(ln x)(1/x) + 2(1/x) = (2/x)(ln x + 1)."},
    {label:"Solve f''(x) = 0", text:"Since 2/x ≠ 0 for x > 0, we need ln x + 1 = 0, so ln x = -1, giving x = e⁻¹ = 1/e."},
    {label:'Evaluate f at this point', text:"f(1/e) = (1/e)(ln(1/e))² = (1/e)(-1)² = 1/e."}
  ],
  answer:"∴ Point of inflection: (1/e, 1/e)" },

{ type:'qa', id:'mp9', navLabel:'M9', qnum:'Q 9', heading:'Maximum tranquillizer concentration',
  question:"A tranquillizer is injected into a muscle from which it enters the bloodstream. The concentration C, in mg l⁻¹, of tranquillizer in the bloodstream is modelled by C(t) = 2t/(3+t²), t ≥ 0, where t is the number of minutes after the injection. Find the maximum concentration of tranquillizer in the bloodstream.",
  hint:"💡 Use the quotient rule to differentiate, set C'(t) = 0, then evaluate C at that time.",
  steps:[
    {label:'Differentiate using the quotient rule', text:"With u = 2t, v = 3+t²: C'(t) = [2(3+t²) - 2t(2t)]/(3+t²)² = (6 + 2t² - 4t²)/(3+t²)² = (6 - 2t²)/(3+t²)²."},
    {label:"Solve C'(t) = 0", text:"6 - 2t² = 0, so t² = 3, giving t = √3 (taking t ≥ 0)."},
    {label:'Evaluate the concentration', text:"C(√3) = 2√3/(3+3) = 2√3/6 = √3/3."}
  ],
  answer:"∴ Maximum concentration = √3/3 ≈ 0.577 mg l⁻¹ (at t = √3 minutes)" },

{ type:'qa', id:'mp10', navLabel:'M10', qnum:'Q 10', heading:'Rate of separation of two cyclists',
  question:"Two cyclists are at the same road intersection. One cyclist travels north at 20 km h⁻¹. The other cyclist travels west at 15 km h⁻¹. Use calculus to show that the rate at which the distance between the two cyclists changes is independent of time.",
  hint:"💡 Write the north and west distances in terms of t, form the distance D using Pythagoras, then differentiate.",
  steps:[
    {label:'Set up the distances', text:"After t hours, the northbound cyclist has travelled 20t km and the westbound cyclist has travelled 15t km. Since the paths are perpendicular, the distance between them is D = √((20t)² + (15t)²)."},
    {label:'Simplify D', text:"D = √(400t² + 225t²) = √(625t²) = 25t (for t ≥ 0)."},
    {label:'Differentiate', text:"dD/dt = 25."}
  ],
  answer:"∴ dD/dt = 25 km h⁻¹, a constant — so the rate of separation is independent of time." },

{ type:'qa', id:'mp11a', navLabel:'M11a', qnum:'Q 11a', heading:'f(0) for ln(x⁴+1)',
  question:"Consider f(x) = ln(x⁴ + 1). Find the value of f(0).",
  hint:"💡 Substitute x = 0 directly.",
  steps:[
    {label:'Substitute x = 0', text:"f(0) = ln(0⁴ + 1) = ln(1)."}
  ],
  answer:"∴ f(0) = 0" },

{ type:'qa', id:'mp11b', navLabel:'M11b', qnum:'Q 11b', heading:'Where f is increasing',
  question:"For f(x) = ln(x⁴ + 1), find the set of values of x for which f is increasing.",
  hint:"💡 Differentiate using the chain rule, then decide the sign of the numerator (the denominator is always positive).",
  steps:[
    {label:'Differentiate', text:"f'(x) = 4x³/(x⁴ + 1)."},
    {label:'Analyze the sign', text:"Since x⁴ + 1 > 0 for all x, the sign of f'(x) matches the sign of 4x³, which is positive exactly when x > 0."}
  ],
  answer:"∴ f is increasing for x > 0" },

{ type:'qa', id:'mp11c', navLabel:'M11c', qnum:'Q 11c', heading:'f″(1) and no inflection at 0',
  question:"Given that f''(x) = 4x²(3-x⁴)/(x⁴+1)², (i) find f''(1), and (ii) hence show that there is no point of inflection on the graph of f at x = 0.",
  hint:"💡 For (ii), examine whether f''(x) actually changes sign as x passes through 0 — note that x² ≥ 0 always.",
  steps:[
    {label:'(i) Substitute x = 1', text:"f''(1) = 4(1)²(3-1)/(1+1)² = 4(1)(2)/4 = 8/4 = 2."},
    {label:'(ii) Examine the sign of f″ near x = 0', text:"f''(0) = 4(0)²(3-0)/(0+1)² = 0. But near x = 0, the factor 4x² ≥ 0 for every x (it is never negative), and (3-x⁴) > 0 for x close to 0. So f''(x) ≥ 0 on both sides of x = 0 — its sign does not change."},
    {label:'Conclude', text:"Since f'' does not change sign at x = 0 (it stays non-negative on both sides, only touching zero), the concavity does not actually change there, so x = 0 is not a point of inflection."}
  ],
  answer:"∴ f''(1) = 2; since f'' does not change sign at x = 0, there is no point of inflection there." },

{ type:'qa', id:'mp11d', navLabel:'M11d', qnum:'Q 11d', heading:'Sketching f for x ≥ 0',
  question:"There is a point of inflection on the graph of f at x = ⁴√3 (≈1.316). Sketch the graph of f, for x ≥ 0. [Since a hand-drawn sketch cannot be reproduced here, describe the graph's key features instead: intercepts, monotonicity, concavity, and the inflection point.]",
  hint:"💡 Combine the results from parts (a)–(c): the value at 0, where f increases, and where the concavity switches.",
  steps:[
    {label:'Starting point and monotonicity', text:"f(0) = 0 (part a), and f is increasing for all x > 0 (part b) — since f'(x) = 4x³/(x⁴+1)² > 0 for x>0, the curve rises steadily from the origin with no turning points."},
    {label:'Concavity either side of the inflection', text:"f''(x) = 4x²(3-x⁴)/(x⁴+1)² is positive while x⁴ < 3 (i.e. 0 < x < ⁴√3), so the curve is concave-up there, and negative for x > ⁴√3, so the curve is concave-down beyond that."},
    {label:'Long-run behaviour', text:"As x → ∞, f(x) = ln(x⁴+1) → ∞, but ever more slowly, consistent with the concave-down shape for x > ⁴√3."}
  ],
  answer:"∴ The graph starts at the origin, rises throughout x ≥ 0, is concave-up (curving upward more steeply) on 0 < x < ⁴√3 ≈ 1.316, passes through a genuine point of inflection at x = ⁴√3, and is concave-down (flattening out while still increasing) for x > ⁴√3." },

{ type:'qa', id:'mp12a', navLabel:'M12a', qnum:'Q 12a', heading:'Quotient rule derivative',
  question:"Let f(x) = x/(-2x²+5x-2) for -2 ≤ x ≤ 4, x ≠ 1/2, x ≠ 2. The graph of f has a local minimum at A(1,1) and a local maximum at B. Use the quotient rule to show that f'(x) = (2x²-2)/(-2x²+5x-2)².",
  hint:"💡 Apply the quotient rule with u = x and v = -2x²+5x-2, then simplify the numerator carefully.",
  steps:[
    {label:'Set up the quotient rule', text:"With u = x, u' = 1, v = -2x²+5x-2, v' = -4x+5: f'(x) = [1·v - x·v']/v²."},
    {label:'Expand the numerator', text:"Numerator = (-2x²+5x-2) - x(-4x+5) = -2x²+5x-2+4x²-5x = 2x² - 2."}
  ],
  answer:"∴ f'(x) = (2x²-2)/(-2x²+5x-2)² as required." },

{ type:'qa', id:'mp12b', navLabel:'M12b', qnum:'Q 12b', heading:'Coordinates of B',
  question:"Hence find the coordinates of B, the local maximum of f(x) = x/(-2x²+5x-2).",
  hint:"💡 Set the numerator 2x²-2 equal to zero — one root is A's x-coordinate (x=1), the other gives B.",
  steps:[
    {label:"Solve f'(x) = 0", text:"2x² - 2 = 0 gives x² = 1, so x = 1 or x = -1. Since x = 1 corresponds to A, the local maximum B is at x = -1."},
    {label:'Evaluate f(-1)', text:"f(-1) = -1/(-2(1)+5(-1)-2) = -1/(-2-5-2) = -1/(-9) = 1/9."}
  ],
  answer:"∴ B = (-1, 1/9)" },

{ type:'qa', id:'mp12c', navLabel:'M12c', qnum:'Q 12c', heading:'Values of k missed by the graph',
  question:"Given that the line y = k does not meet the graph of f(x) = x/(-2x²+5x-2), find the possible values of k.",
  hint:"💡 Find the range of f on each of its three continuous branches (split by the vertical asymptotes at x = 1/2 and x = 2), then find the gap between them.",
  steps:[
    {label:'Branch on [-2, 1/2)', text:"On [-2,0], f rises from f(-2)=1/10 to the local max f(-1)=1/9, then falls to f(0)=0. On (0, 1/2), f is negative and falls without bound as x→1/2⁻. So this branch's range is (-∞, 1/9]."},
    {label:'Branch on (1/2, 2)', text:"Here f → +∞ at both ends (as x→1/2⁺ and x→2⁻) with a local minimum of f(1)=1 in between. This branch's range is [1, ∞)."},
    {label:'Branch on (2, 4]', text:"Here f is negative throughout, with no turning point, ranging from -∞ (as x→2⁺) up to f(4) = 4/(-32+20-2) = -2/7. This branch's range, (-∞,-2/7], is already covered by the first branch."},
    {label:'Combine the ranges', text:"The overall range of f is (-∞, 1/9] ∪ [1, ∞). Any horizontal line with 1/9 < k < 1 therefore misses the graph entirely."}
  ],
  answer:"∴ 1/9 < k < 1" },

{ type:'qa', id:'mp13', navLabel:'M13', qnum:'Q 13', heading:'Tangent to y = x cos x',
  question:"Find the equation of the tangent to the curve y = x cos x at x = 0.",
  hint:"💡 Use the product rule to differentiate, then evaluate at x = 0.",
  steps:[
    {label:'Differentiate using the product rule', text:"y' = (1)cos x + x(-sin x) = cos x - x sin x."},
    {label:'Evaluate the gradient at x = 0', text:"y'(0) = cos(0) - 0·sin(0) = 1 - 0 = 1."},
    {label:'Find the point', text:"y(0) = 0·cos(0) = 0."},
    {label:'Form the tangent', text:"y - 0 = 1(x - 0)."}
  ],
  answer:"∴ y = x" },

{ type:'qa', id:'mp14', navLabel:'M14', qnum:'Q 14', heading:'Second derivative of x²e^(2x)',
  question:"If y = x²e^(2x), find d²y/dx².",
  hint:"💡 Apply the product rule twice, factoring out e^(2x) as you go to keep the algebra manageable.",
  steps:[
    {label:'First derivative', text:"y' = 2x·e^(2x) + x²·2e^(2x) = 2e^(2x)(x + x²)."},
    {label:'Second derivative — product rule again', text:"y'' = 4e^(2x)(x+x²) + 2e^(2x)(1+2x) = 2e^(2x)[2(x+x²) + (1+2x)]."},
    {label:'Simplify the bracket', text:"2(x+x²) + (1+2x) = 2x + 2x² + 1 + 2x = 2x² + 4x + 1."}
  ],
  answer:"∴ d²y/dx² = 2e^(2x)(2x² + 4x + 1)" },

{ type:'qa', id:'mp15a', navLabel:'M15a', qnum:'Q 15a', heading:'Maximum triangle area',
  question:"The two shorter sides of a right-angled triangle are x cm and (6-x) cm. Find the maximum area of the triangle.",
  hint:"💡 Area = (1/2) × base × height for a right triangle. Maximize with respect to x.",
  steps:[
    {label:'Set up the area function', text:"A(x) = (1/2)x(6-x) = 3x - x²/2."},
    {label:'Differentiate and solve A′(x)=0', text:"A'(x) = 3 - x. Setting A'(x) = 0 gives x = 3."},
    {label:'Evaluate the maximum area', text:"A(3) = 3(3) - (3)²/2 = 9 - 4.5 = 4.5."}
  ],
  answer:"∴ Maximum area = 4.5 cm² (when x = 3, i.e. an isosceles right triangle with legs 3 cm and 3 cm)" },

{ type:'qa', id:'mp15b', navLabel:'M15b', qnum:'Q 15b', heading:'Minimum perimeter',
  question:"For the same right-angled triangle with shorter sides x cm and (6-x) cm, find the minimum perimeter.",
  hint:"💡 The two shorter sides always sum to 6, so minimizing the perimeter is the same as minimizing just the hypotenuse.",
  steps:[
    {label:'Note the constant sum', text:"x + (6-x) = 6 regardless of x, so the perimeter P = 6 + h, where h is the hypotenuse, is minimized exactly when h is minimized."},
    {label:'Write h² using Pythagoras', text:"h² = x² + (6-x)² = 2x² - 12x + 36."},
    {label:'Minimize h² (equivalent to minimizing h)', text:"d(h²)/dx = 4x - 12 = 0 gives x = 3."},
    {label:'Evaluate h and P', text:"h² = 2(9) - 36 + 36 = 18, so h = √18 = 3√2. Then P = 6 + 3√2."}
  ],
  answer:"∴ Minimum perimeter = 6 + 3√2 ≈ 10.24 cm (when x = 3)" },

{ type:'qa', id:'mp16', navLabel:'M16', qnum:'Q 16', heading:'Finding f′(1) from f″(0)',
  question:"If f(x) = xe^(kx) and f''(0) = 10, find f'(1).",
  hint:"💡 Differentiate twice in terms of k, use f''(0)=10 to find k, then substitute into f'(1).",
  steps:[
    {label:'First derivative', text:"f'(x) = e^(kx) + x·k·e^(kx) = e^(kx)(1 + kx)."},
    {label:'Second derivative', text:"f''(x) = k·e^(kx)(1+kx) + e^(kx)·k = k·e^(kx)[(1+kx) + 1] = k·e^(kx)(2 + kx)."},
    {label:'Use f″(0) = 10 to find k', text:"f''(0) = k(1)(2+0) = 2k = 10, so k = 5."},
    {label:'Substitute k = 5 into f′(1)', text:"f'(1) = e^(5)(1 + 5) = 6e⁵."}
  ],
  answer:"∴ k = 5 and f'(1) = 6e⁵" },

{ type:'qa', id:'mp17', navLabel:'M17', qnum:'Q 17', heading:'Finding k from a concavity boundary',
  question:"The graph of x³ - kx² + 8x + 2 is concave-up for all x > 4, and this is the only section which is concave-up. Find the value of k.",
  hint:"💡 Concave-up means the second derivative is positive — find where it changes sign and match that to x = 4.",
  steps:[
    {label:'Differentiate twice', text:"Let g(x) = x³ - kx² + 8x + 2. g'(x) = 3x² - 2kx + 8, so g''(x) = 6x - 2k."},
    {label:'Find where concavity changes', text:"g''(x) > 0 (concave-up) when 6x - 2k > 0, i.e. x > k/3."},
    {label:'Match to the given boundary', text:"This concave-up region is given as x > 4, so k/3 = 4."}
  ],
  answer:"∴ k = 12" },

{ type:'qa', id:'mp18', navLabel:'M18', qnum:'Q 18', heading:'Triple product rule',
  question:"Differentiate xeˣ sin x.",
  hint:"💡 Extend the product rule to three factors: differentiate each factor in turn, keeping the other two unchanged, and add the results.",
  steps:[
    {label:'Apply the product rule to three factors', text:"Let y = x · eˣ · sin x. Then y' = (x)'·eˣ·sinx + x·(eˣ)'·sinx + x·eˣ·(sinx)'."},
    {label:'Substitute each derivative', text:"y' = 1·eˣ·sinx + x·eˣ·sinx + x·eˣ·cosx."},
    {label:'Factor out eˣ', text:"y' = eˣ[sinx + x sinx + x cosx] = eˣ[(1+x)sinx + x cosx]."}
  ],
  answer:"∴ d/dx(xeˣ sin x) = eˣ[(1+x)sin x + x cos x]" },

{ type:'qa', id:'mp19', navLabel:'M19', qnum:'Q 19', heading:'Quotient with a square root',
  question:"If f(x) = x/√(4+x), show that f'(x) = (ax+b)/(2(4+x)^c), where a, b and c are constants to be found.",
  hint:"💡 Write √(4+x) as (4+x)^(1/2) and use the chain rule/quotient combination, then factor out the lowest power of (4+x).",
  steps:[
    {label:'Rewrite and differentiate', text:"f(x) = x(4+x)^(-1/2). By the product rule: f'(x) = (4+x)^(-1/2) + x·(-1/2)(4+x)^(-3/2)."},
    {label:'Factor out (4+x)^(-3/2)', text:"f'(x) = (4+x)^(-3/2)[(4+x) - x/2] = (4+x)^(-3/2)[4 + x/2]."},
    {label:'Tidy into the target form', text:"4 + x/2 = (8+x)/2, so f'(x) = (x+8)/(2(4+x)^(3/2))."}
  ],
  answer:"∴ a = 1, b = 8, c = 3/2" },

{ type:'qa', id:'mp20a', navLabel:'M20a', qnum:'Q 20a', heading:'Where xe⁻ˣ is concave-down',
  question:"Find the set of values for which f(x) = xe⁻ˣ is concave-down.",
  hint:"💡 Find f''(x) and determine where it is negative.",
  steps:[
    {label:'First derivative', text:"f'(x) = e⁻ˣ - xe⁻ˣ = e⁻ˣ(1-x)."},
    {label:'Second derivative', text:"f''(x) = -e⁻ˣ(1-x) + e⁻ˣ(-1) = e⁻ˣ[-(1-x) - 1] = e⁻ˣ(x - 2)."},
    {label:'Solve f″(x) < 0', text:"Since e⁻ˣ > 0 always, f''(x) < 0 exactly when x - 2 < 0, i.e. x < 2."}
  ],
  answer:"∴ f is concave-down for x < 2" },

{ type:'qa', id:'mp20b', navLabel:'M20b', qnum:'Q 20b', heading:'Point of inflection of xe⁻ˣ',
  question:"Hence find the point of inflection on the curve y = xe⁻ˣ.",
  hint:"💡 f'' changes sign at the boundary found in part (a).",
  steps:[
    {label:'Identify the sign change', text:"From part (a), f''(x) = e⁻ˣ(x-2) is negative for x<2 and positive for x>2, so the concavity genuinely changes at x = 2."},
    {label:'Evaluate f(2)', text:"f(2) = 2e⁻² = 2/e²."}
  ],
  answer:"∴ Point of inflection: (2, 2/e²)" },

{ type:'qa', id:'mp21', navLabel:'M21', qnum:'Q 21', heading:'Stationary point of e⁻ˣ sin x',
  question:"Find the coordinates of the stationary point on the curve y = e⁻ˣ sin x for 0 < x < π.",
  hint:"💡 Differentiate with the product rule, then solve y'(x) = 0 for x in the given interval.",
  steps:[
    {label:'Differentiate using the product rule', text:"y' = -e⁻ˣ sinx + e⁻ˣ cosx = e⁻ˣ(cosx - sinx)."},
    {label:"Solve y'(x) = 0", text:"Since e⁻ˣ ≠ 0, we need cosx = sinx, i.e. tanx = 1. In 0 < x < π, this gives x = π/4."},
    {label:'Evaluate y at x = π/4', text:"y(π/4) = e^(-π/4) sin(π/4) = e^(-π/4)·(√2/2)."}
  ],
  answer:"∴ Stationary point: (π/4, (√2/2)e^(-π/4))" },

{ type:'qa', id:'mp22a', navLabel:'M22a', qnum:'Q 22a', heading:'Initial lake volume',
  question:"The volume of water, V million cubic metres, in a lake t hours after a storm is modelled by V = 2te⁻ᵗ + 5. What is the initial volume of the lake?",
  hint:"💡 The initial volume is V at t = 0.",
  steps:[
    {label:'Substitute t = 0', text:"V(0) = 2(0)e⁰ + 5 = 0 + 5."}
  ],
  answer:"∴ Initial volume = 5 million m³" },

{ type:'qa', id:'mp22b', navLabel:'M22b', qnum:'Q 22b', heading:'Maximum lake volume',
  question:"For V = 2te⁻ᵗ + 5, what is the maximum volume of the lake?",
  hint:"💡 Differentiate, find the stationary point, and confirm it is a maximum.",
  steps:[
    {label:'Differentiate using the product rule', text:"V'(t) = 2e⁻ᵗ + 2t(-e⁻ᵗ) = 2e⁻ᵗ(1-t)."},
    {label:"Solve V'(t) = 0", text:"Since e⁻ᵗ ≠ 0, we need 1-t = 0, so t = 1. V' is positive for t<1 and negative for t>1, confirming a maximum."},
    {label:'Evaluate V(1)', text:"V(1) = 2(1)e⁻¹ + 5 = 2/e + 5."}
  ],
  answer:"∴ Maximum volume = 5 + 2/e ≈ 5.74 million m³ (at t = 1 hour)" },

{ type:'qa', id:'mp22c', navLabel:'M22c', qnum:'Q 22c', heading:'When the lake empties fastest',
  question:"For V = 2te⁻ᵗ + 5, when is the lake emptying fastest?",
  hint:"💡 'Emptying fastest' means the rate V'(t) is most negative — find where V''(t) = 0.",
  steps:[
    {label:'Differentiate V′(t) again', text:"V'(t) = 2e⁻ᵗ(1-t) = 2e⁻ᵗ - 2te⁻ᵗ. So V''(t) = -2e⁻ᵗ - [2e⁻ᵗ - 2te⁻ᵗ] = -2e⁻ᵗ - 2e⁻ᵗ + 2te⁻ᵗ = 2e⁻ᵗ(t-2)."},
    {label:"Solve V''(t) = 0", text:"Since e⁻ᵗ ≠ 0, t = 2. V'' changes from negative (t<2) to positive (t>2), so V'(t) reaches its minimum (most negative rate) at t = 2."}
  ],
  answer:"∴ The lake is emptying fastest at t = 2 hours" },

{ type:'qa', id:'mp23', navLabel:'M23', qnum:'Q 23', heading:'Tangent through a fixed point, for any k',
  question:"Prove that the equation of the tangent to the curve y = ln x + kx at x = 1 always passes through the point (0, -1), independent of the value of k.",
  hint:"💡 Find the tangent line in terms of k, then substitute x = 0 and show the k terms cancel.",
  steps:[
    {label:'Find the gradient and point at x=1', text:"y' = 1/x + k, so y'(1) = 1 + k. Also y(1) = ln(1) + k(1) = k."},
    {label:'Write the tangent line', text:"y - k = (1+k)(x - 1)."},
    {label:'Substitute x = 0', text:"y = k + (1+k)(0-1) = k - (1+k) = k - 1 - k = -1."}
  ],
  answer:"∴ When x = 0, y = -1 regardless of k — so the tangent always passes through (0, -1)." },

{ type:'qa', id:'mp24a', navLabel:'M24a', qnum:'Q 24a', heading:'Logistic function: f(0)',
  question:"Let f(x) = 100/(1+50e^(-0.2x)). Part of the graph of f is shown, an S-shaped (logistic) curve. Write down f(0).",
  hint:"💡 Substitute x = 0 directly.",
  steps:[
    {label:'Substitute x = 0', text:"f(0) = 100/(1+50e⁰) = 100/(1+50) = 100/51."}
  ],
  answer:"∴ f(0) = 100/51 ≈ 1.96" },

{ type:'qa', id:'mp24b', navLabel:'M24b', qnum:'Q 24b', heading:'Solving f(x) = 95',
  question:"Solve f(x) = 95 for f(x) = 100/(1+50e^(-0.2x)).",
  hint:"💡 Isolate e^(-0.2x) first, then take the natural log of both sides.",
  steps:[
    {label:'Set up the equation', text:"100/(1+50e^(-0.2x)) = 95, so 1 + 50e^(-0.2x) = 100/95 = 20/19."},
    {label:'Isolate the exponential', text:"50e^(-0.2x) = 20/19 - 1 = 1/19, so e^(-0.2x) = 1/950."},
    {label:'Take natural logs', text:"-0.2x = ln(1/950) = -ln(950), so x = ln(950)/0.2 = 5 ln(950)."}
  ],
  answer:"∴ x = 5 ln(950) ≈ 34.3" },

{ type:'qa', id:'mp24c', navLabel:'M24c', qnum:'Q 24c', heading:'Range of the logistic function',
  question:"Find the range of f(x) = 100/(1+50e^(-0.2x)) for x ≥ 0.",
  hint:"💡 Consider the value at x=0, the increasing behavior of the curve, and the horizontal asymptote as x→∞.",
  steps:[
    {label:'Behaviour as x → ∞', text:"e^(-0.2x) → 0, so f(x) → 100/(1+0) = 100. The curve approaches but never reaches 100."},
    {label:'Behaviour at x = 0 and monotonicity', text:"f(0) = 100/51 from part (a), and f is increasing throughout (the denominator 1+50e^(-0.2x) decreases steadily as x increases), so the smallest value on x ≥ 0 is f(0) = 100/51, attained at x=0."}
  ],
  answer:"∴ Range: 100/51 ≤ f(x) < 100" },

{ type:'qa', id:'mp24d', navLabel:'M24d', qnum:'Q 24d', heading:'Verifying f′(x)',
  question:"Show that f'(x) = 1000e^(-0.2x)/(1+50e^(-0.2x))², for f(x) = 100/(1+50e^(-0.2x)).",
  hint:"💡 Write f(x) = 100(1+50e^(-0.2x))⁻¹ and use the chain rule.",
  steps:[
    {label:'Apply the chain rule', text:"f'(x) = 100·(-1)(1+50e^(-0.2x))⁻²·(50·(-0.2)e^(-0.2x))."},
    {label:'Simplify the constants', text:"100 × (-1) × (-10) = 1000, so f'(x) = 1000e^(-0.2x)(1+50e^(-0.2x))⁻²."}
  ],
  answer:"∴ f'(x) = 1000e^(-0.2x)/(1+50e^(-0.2x))² as required." },

{ type:'qa', id:'mp24e', navLabel:'M24e', qnum:'Q 24e', heading:'Maximum rate of change',
  question:"Find the maximum rate of change of f(x) = 100/(1+50e^(-0.2x)).",
  hint:"💡 The maximum rate of change is the maximum value of f'(x) — substitute u = e^(-0.2x) and maximize with respect to u.",
  steps:[
    {label:'Substitute u = e^(-0.2x)', text:"f'(x) = 1000u/(1+50u)². Differentiate with respect to u using the quotient rule: d/du[1000u/(1+50u)²] = 1000[(1+50u) - 100u]/(1+50u)³ = 1000(1-50u)/(1+50u)³."},
    {label:'Solve for the critical value of u', text:"Setting the numerator to zero: 1 - 50u = 0, so u = 1/50, i.e. e^(-0.2x) = 1/50, giving x = 5 ln(50) ≈ 19.6."},
    {label:'Evaluate the maximum rate', text:"f'(x) = 1000(1/50)/(1+50(1/50))² = 20/(1+1)² = 20/4 = 5."}
  ],
  answer:"∴ Maximum rate of change = 5 (at x = 5 ln 50 ≈ 19.6)" },

{ type:'qa', id:'mp25a', navLabel:'M25a', qnum:'Q 25a', heading:'Showing f′(x) > 0',
  question:"The function f(x) = (x-a)/(x-b) is defined for x ≠ b, and a > b. Show that f'(x) > 0 at all values of x in the domain.",
  hint:"💡 Use the quotient rule and simplify the numerator — it should reduce to a constant.",
  steps:[
    {label:'Apply the quotient rule', text:"With u = x-a, u' = 1, v = x-b, v' = 1: f'(x) = [1·(x-b) - (x-a)·1]/(x-b)² = (a-b)/(x-b)²."},
    {label:'Analyze the sign', text:"Since a > b, the numerator a-b > 0. The denominator (x-b)² > 0 for every x ≠ b."}
  ],
  answer:"∴ f'(x) = (a-b)/(x-b)² > 0 for all x in the domain, as required." },

{ type:'qa', id:'mp25b', navLabel:'M25b', qnum:'Q 25b', heading:'Does f′ > 0 imply p>q ⟹ f(p)>f(q)?',
  question:"Does f'(x) > 0 everywhere mean that if p > q then f(p) > f(q)? Justify your answer.",
  hint:"💡 Think about what happens if p and q sit on opposite sides of the vertical asymptote at x = b — try a concrete counterexample.",
  steps:[
    {label:'State the subtlety', text:"No. f'(x) > 0 only guarantees that f is increasing on each separate interval of its domain — here, on (-∞,b) and on (b,∞) individually — not across the whole domain, because the graph has a discontinuity (vertical asymptote) at x = b."},
    {label:'Give a counterexample', text:"Take a=2, b=0, so f(x) = (x-2)/x = 1 - 2/x. Let p = 1 and q = -1, so p > q. Then f(1) = 1-2 = -1, and f(-1) = 1-2/(-1) = 1+2 = 3."},
    {label:'Compare', text:"Here p > q but f(p) = -1 < 3 = f(q) — so f(p) > f(q) fails, even though f'(x) > 0 everywhere on the domain."}
  ],
  answer:"∴ No — the implication fails across the asymptote at x = b, even though f is increasing on each side of it separately." },

{ type:'qa', id:'mp26a', navLabel:'M26a', qnum:'Q 26a', heading:'Domain of a semicircle',
  question:"State the largest possible domain for the function y = √(4-x²).",
  hint:"💡 The expression under the square root must be non-negative.",
  steps:[
    {label:'Set up the inequality', text:"Need 4 - x² ≥ 0, i.e. x² ≤ 4."},
    {label:'Solve', text:"This gives -2 ≤ x ≤ 2."}
  ],
  answer:"∴ Domain: -2 ≤ x ≤ 2" },

{ type:'qa', id:'mp26b', navLabel:'M26b', qnum:'Q 26b', heading:'Normal always passes through the origin',
  question:"Prove that for any point on the graph of y = √(4-x²), the normal passes through the origin.",
  hint:"💡 y = √(4-x²) traces the upper half of the circle x²+y²=4. Find the normal at a general point (x₀,y₀) and check where it crosses x=0.",
  steps:[
    {label:'Differentiate', text:"y = (4-x²)^(1/2), so y' = (1/2)(4-x²)^(-1/2)(-2x) = -x/√(4-x²) = -x/y."},
    {label:'Find the normal gradient at a general point', text:"At a point (x₀,y₀) on the curve, the tangent gradient is -x₀/y₀, so the normal gradient is the negative reciprocal: y₀/x₀."},
    {label:'Write the normal line and test x = 0', text:"Normal: y - y₀ = (y₀/x₀)(x - x₀), which simplifies to y = (y₀/x₀)x - y₀ + y₀ = (y₀/x₀)x. At x = 0, y = 0."}
  ],
  answer:"∴ Every normal passes through (0,0), the origin (and when x₀=0 the normal is the vertical line x=0, which also passes through the origin)." },

{ type:'qa', id:'mp27a', navLabel:'M27a', qnum:'Q 27a', heading:'Finding n from a gradient condition',
  question:"The graph y = kxⁿ has the property that at every point, the product of the gradient and the y-value equals 1. Find the value of n.",
  hint:"💡 Form the equation y'·y = 1, and note this must hold for every x — so the power of x in the product must vanish.",
  steps:[
    {label:'Differentiate', text:"y' = knxⁿ⁻¹."},
    {label:'Form the product condition', text:"y'·y = (knxⁿ⁻¹)(kxⁿ) = k²n·x^(2n-1) = 1 for all x."},
    {label:'Match powers of x', text:"Since the right-hand side is constant (no x-dependence), the exponent must be zero: 2n - 1 = 0."}
  ],
  answer:"∴ n = 1/2" },

{ type:'qa', id:'mp27b', navLabel:'M27b', qnum:'Q 27b', heading:'Finding the possible values of k',
  question:"Hence find the possible values of k for y = kxⁿ where the product of the gradient and the y-value equals 1 everywhere.",
  hint:"💡 Substitute n = 1/2 back into the constant coefficient equation from part (a).",
  steps:[
    {label:'Substitute n = 1/2', text:"From k²n = 1 (the constant part of the equation), k²(1/2) = 1."},
    {label:'Solve for k', text:"k² = 2, so k = ±√2."}
  ],
  answer:"∴ k = √2 or k = -√2" },

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function nl2br(s) {
  return escHtml(s).replace(/\n/g,'<br>');
}

function renderSlide(sl) {
  switch (sl.type) {
    case 'title':       return renderTitle(sl);
    case 'divider':     return renderDivider(sl);
    case 'keypoint':    return renderKeypoint(sl);
    case 'two-col':     return renderTwoCol(sl);
    case 'example':     return renderExample(sl);
    case 'examiner-q':  return renderExaminerQ(sl);
    case 'examiner':    return renderExaminer(sl);
    case 'exercise':    return renderExercise(sl);
    case 'qa':          return renderQA(sl);
    case 'summary':     return renderSummary(sl);
    default: return '';
  }
}

function renderTitle(sl) {
  const goals = sl.goals.map(g => `<li>${escHtml(g)}</li>`).join('');
  return `
  <div class="slide s-title" id="${sl.id}" data-slide>
    <div class="chapter-badge" style="font-size:1.7rem;">20</div>
    <h1>Core: Differentiation</h1>
    <p class="subtitle">20A&ndash;20F &nbsp;·&nbsp; Rules of Differentiation, the Second Derivative &amp; Optimization</p>
    <ul class="learning-goals">${goals}</ul>
  </div>`;
}

function renderDivider(sl) {
  return `
  <div class="slide s-divider" id="${sl.id}" data-slide data-symbol="${sl.symbol}">
    <div class="divider-num">${sl.bigNum}</div>
    <div>
      <h2>${escHtml(sl.heading)}</h2>
      <p>${escHtml(sl.sub)}</p>
    </div>
  </div>`;
}

function renderKeypoint(sl) {
  const notes = sl.notes.map(n => `<li>${escHtml(n)}</li>`).join('');
  const altHtml = sl.formulaAlt ? `<div class="formula-alt">${sl.formulaAlt}</div>` : '';
  return `
  <div class="slide s-keypoint" id="${sl.id}" data-slide>
    <div class="kp-header">
      <span class="kp-badge">${escHtml(sl.badge)}</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="kp-body">
      <div class="formula-box">
        <div class="formula">${sl.formula}</div>
        ${altHtml}
      </div>
      <ul class="note-list">${notes}</ul>
    </div>
  </div>`;
}

function renderTwoCol(sl) {
  return `
  <div class="slide s-two-col" id="${sl.id}" data-slide>
    <div class="two-col-header"><h3>${escHtml(sl.heading)}</h3></div>
    <div class="two-col-body">
      <div class="col-card">
        <h4>${escHtml(sl.left.title)}</h4>
        <div class="col-content">${sl.left.html}</div>
      </div>
      <div class="col-card">
        <h4>${escHtml(sl.right.title)}</h4>
        <div class="col-content">${sl.right.html}</div>
      </div>
    </div>
  </div>`;
}

function renderExample(sl) {
  const hints = sl.hints.map((h, i) => `
    <li><span class="hint-num">${i+1}</span><span>${escHtml(h)}</span></li>`).join('');
  return `
  <div class="slide s-example" id="${sl.id}" data-slide>
    <div class="ex-header">
      <span class="ex-badge">${escHtml(sl.badge)}</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="ex-body">
      <div class="question-box">
        <div class="q-label">Question</div>
        <div class="q-text">${nl2br(sl.question)}</div>
      </div>
      <div class="hints-section">
        <h4>Hints / Strategy</h4>
        <ul class="hint-list">${hints}</ul>
      </div>
    </div>
  </div>`;
}

function renderExaminerQ(sl) {
  return `
  <div class="slide s-examiner-q" id="${sl.id}" data-slide>
    <div class="examiner-q-header">
      <span class="ex-q-badge">Be the Examiner</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="examiner-q-body">
      <div class="challenge-box">
        <div class="q-text">${nl2br(sl.question)}</div>
      </div>
      <p class="task-label">${escHtml(sl.taskLine)}</p>
      <div class="think-note" style="margin-top:1rem;">${escHtml(sl.thinkNote)}</div>
    </div>
  </div>`;
}

function renderExaminer(sl) {
  const sols = sl.solutions.map(s => `
    <div class="sol-card ${s.style}">
      <div class="sol-card-header">${escHtml(s.label)}</div>
      <div class="sol-card-body">${nl2br(s.lines)}</div>
    </div>`).join('');
  return `
  <div class="slide s-examiner" id="${sl.id}" data-slide>
    <div class="examiner-header">
      <span class="ex-badge-purple">Be the Examiner</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="examiner-body">
      <div class="challenge-box">
        <div class="q-text">${nl2br(sl.question)}</div>
      </div>
      <div class="solutions-grid">${sols}</div>
      <p class="examiner-note">${escHtml(sl.note)}</p>
    </div>
  </div>`;
}

function renderExercise(sl) {
  const cards = sl.problems.map(p => `
    <div class="prob-card">
      <div class="prob-num">Q ${p.num}</div>
      <div class="prob-q">${escHtml(p.q)}</div>
    </div>`).join('');
  return `
  <div class="slide s-exercise" id="${sl.id}" data-slide>
    <div class="ex-set-header">
      <h3>${escHtml(sl.heading)}</h3>
      <span class="ex-set-tag">${escHtml(sl.tag)}</span>
    </div>
    <div class="ex-set-body">
      <div class="problems-grid">${cards}</div>
    </div>
  </div>`;
}

function renderQA(sl) {
  const steps = sl.steps.map(s => `
    <div class="sol-step">
      <span class="step-badge">${escHtml(s.label)}</span>
      <span class="step-content">${escHtml(s.text)}</span>
    </div>`).join('');
  const uid = sl.id + '-sol';
  return `
  <div class="slide s-qa" id="${sl.id}" data-slide>
    <div class="qa-header">
      <span class="qa-qnum">${escHtml(sl.qnum)}</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="qa-body">
      <div class="qa-question">
        <div class="qa-qlabel">Question</div>
        <div class="qa-qtext">${nl2br(sl.question)}</div>
      </div>
      <div class="qa-hint">${escHtml(sl.hint)}</div>
      <div class="qa-solution">
        <button class="qa-sol-toggle" onclick="toggleSol('${uid}')" id="${uid}-btn">
          <span>▶ Show Solution</span>
          <span class="qa-sol-arrow">▼</span>
        </button>
        <div class="qa-sol-body" id="${uid}">
          <div class="qa-sol-inner">
            <div class="sol-steps">${steps}</div>
            <div class="sol-answer">${escHtml(sl.answer)}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderSummary() {
  const rows = [
    ['Power rule',        'f(x) = xⁿ  ⟹  f′(x) = nxⁿ⁻¹',                       'n ∈ ℚ — any rational exponent'],
    ['Trig derivatives',  'sin x → cos x,   cos x → −sin x',                    'x measured in radians'],
    ['Exp & log',         'eˣ → eˣ,   ln x → 1/x',                               'eˣ is its own derivative'],
    ['Chain rule',        'dy/dx = dy/du × du/dx',                              'For composite functions f(g(x))'],
    ['Product rule',      'dy/dx = u(dv/dx) + v(du/dx)',                        'For y = u(x)v(x)'],
    ['Quotient rule',     'dy/dx = (v·du/dx − u·dv/dx) / v²',                   'For y = u(x)/v(x)'],
    ['Concavity',         'f″(x) > 0 concave-up,   f″(x) < 0 concave-down',   'Describes how the curve bends'],
    ['2nd derivative test','Given f′(a)=0: f″(a)<0 ⇒ max, f″(a)>0 ⇒ min, f″(a)=0 ⇒ no conclusion', 'Classifying stationary points'],
    ['Point of inflection','f″(x) = 0 AND concavity changes',               'f″=0 alone is necessary but not sufficient'],
  ].map(r => `<tr>${r.map(x => `<td>${escHtml(x)}</td>`).join('')}</tr>`).join('');

  return `
  <div class="slide s-summary" id="summary" data-slide>
    <h3>Chapter 20 — Differentiation Summary</h3>
    <table class="summary-table">
      <thead><tr><th>Rule</th><th>Expression</th><th>When to Use</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="summary-note">
      Key Reminder: Rewrite roots and fractions as fractional/negative powers before differentiating.
      Use the chain rule for composites, the product/quotient rules for products/quotients, and always confirm
      a point of inflection by checking that the concavity genuinely changes, not just that f″(x) = 0.
    </p>
  </div>`;
}

/* ── Solution toggle ───────────────────────────────── */
function toggleSol(uid) {
  const body = document.getElementById(uid);
  const btn  = document.getElementById(uid + '-btn');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
  btn.querySelector('span:first-child').textContent = isOpen ? '▶ Show Solution' : '▼ Hide Solution';
}

/* ── Build DOM ─────────────────────────────────────── */
const stream = document.getElementById('slideStream');
const navPills = document.getElementById('navPills');

SLIDES.forEach((sl, i) => {
  stream.insertAdjacentHTML('beforeend', renderSlide(sl));
  if (sl.navLabel && sl.navLabel !== '─') {
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${sl.id}" data-nav="${i}">${sl.navLabel}</a>`;
    navPills.appendChild(li);
  }
});

/* ── Intersection Observer (fade-in) ──────────────── */
const allSlides = document.querySelectorAll('[data-slide]');
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.08 });
allSlides.forEach(s => obs.observe(s));

/* ── Progress & counter ───────────────────────────── */
const fill   = document.getElementById('progressFill');
const counter= document.getElementById('slideCounter');
const navAs  = navPills.querySelectorAll('a');

function updateProgress() {
  const scrolled = window.scrollY;
  const total    = document.body.scrollHeight - window.innerHeight;
  const pct      = total > 0 ? (scrolled / total) * 100 : 0;
  fill.style.width = pct + '%';

  // highlight active nav pill
  let active = 0;
  allSlides.forEach((s, i) => {
    const rect = s.getBoundingClientRect();
    if (rect.top < window.innerHeight * 0.5) active = i;
  });
  // map slide index to nav item
  counter.textContent = `${active + 1} / ${allSlides.length}`;
  navAs.forEach(a => {
    a.classList.toggle('active', parseInt(a.dataset.nav) === active);
  });
}
window.addEventListener('scroll', updateProgress, { passive: true });
updateProgress();
</script>
</body>
