{type:'qa', id:'a16', navLabel:'A16', qnum:'Q 16', heading:"Gradient of a sine curve",
question:"Find the gradient of the graph of y = sinx at x = π/3.",
hint:"💡 The gradient of a curve at a point is the value of its derivative there.",
steps:[{label:"Differentiate", text:"y' = cosx"},
{label:"Substitute", text:"At x = π/3: y' = cos(π/3) = 1/2"}],
answer:"∴ The gradient at x = π/3 is 1/2"},

{type:'qa', id:'a17', navLabel:'A17', qnum:'Q 17', heading:"Rate of change in context",
question:"The height of a falcon above the ground in metres (h) during a swooping attack t seconds after it spots some prey is modelled by h = (10t + 20)/√t. What is the rate of change of height when t = 1? What is the significance of the sign of your answer?",
hint:"💡 Rewrite the fraction as two separate powers of t before differentiating, then substitute t = 1.",
steps:[{label:"Rewrite", text:"h = (10t + 20)t^(-1/2) = 10t^(1/2) + 20t^(-1/2)"},
{label:"Differentiate", text:"dh/dt = 10×(1/2)t^(-1/2) + 20×(-1/2)t^(-3/2) = 5t^(-1/2) - 10t^(-3/2)"},
{label:"Substitute t = 1", text:"dh/dt = 5(1) - 10(1) = -5"},
{label:"Interpret sign", text:"The rate of change is negative, meaning the falcon's height is decreasing — it is diving downward at t = 1s"}],
answer:"∴ The height is decreasing at 5 m/s when t = 1; the negative sign shows the falcon is descending (diving toward its prey) at that moment"},

{type:'qa', id:'a18', navLabel:'A18', qnum:'Q 18', heading:"Finding a point with given gradient",
question:"Find the point of the curve y = 2 + 5x - eˣ which has gradient 4.",
hint:"💡 Differentiate, set the derivative equal to 4, and solve for x, then find the matching y-value.",
steps:[{label:"Differentiate", text:"y' = 5 - eˣ"},
{label:"Set equal to 4", text:"5 - eˣ = 4  ⟹  eˣ = 1  ⟹  x = 0"},
{label:"Find y", text:"y = 2 + 5(0) - e⁰ = 2 + 0 - 1 = 1"}],
answer:"∴ The point is (0, 1)"},

{type:'qa', id:'a19', navLabel:'A19', qnum:'Q 19', heading:"Exact gradient value",
question:"Find the exact value of the gradient of the graph y = eˣ + 3x + 4 when x = ln2.",
hint:"💡 Differentiate first, then substitute x = ln2, using eˡⁿ² = 2.",
steps:[{label:"Differentiate", text:"y' = eˣ + 3"},
{label:"Substitute x = ln2", text:"y' = eˡⁿ² + 3 = 2 + 3 = 5"}],
answer:"∴ The exact gradient is 5"},

{type:'qa', id:'a20', navLabel:'A20', qnum:'Q 20', heading:"Tangent parallel to a line",
question:"Find the equation of the tangent to y = 3cosx, 0 < x < π/2 that is parallel to 2y + 3x + 3 = 0.",
hint:"💡 Rearrange the given line to find its slope, set y' equal to that slope, then use y - y₁ = m(x - x₁).",
steps:[{label:"Find target slope", text:"2y + 3x + 3 = 0  ⟹  y = -(3/2)x - 3/2, so slope = -3/2"},
{label:"Differentiate and set equal", text:"y' = -3sinx = -3/2  ⟹  sinx = 1/2  ⟹  x = π/6 (in the given domain)"},
{label:"Find the y-value", text:"y = 3cos(π/6) = 3×(√3/2) = (3√3)/2"},
{label:"Form tangent equation", text:"y - (3√3)/2 = -(3/2)(x - π/6)  ⟹  y = -(3/2)x + π/4 + (3√3)/2"}],
answer:"∴ y = -(3/2)x + π/4 + (3√3)/2"},

{type:'qa', id:'a21', navLabel:'A21', qnum:'Q 21', heading:"Tangent perpendicular to a line",
question:"Find the equation of the tangent to y = eˣ - 2x that is perpendicular to y = -x + 4.",
hint:"💡 The perpendicular slope is the negative reciprocal of the given line's slope; set y' equal to it.",
steps:[{label:"Find target slope", text:"y = -x + 4 has slope -1, so the perpendicular slope is 1"},
{label:"Differentiate and set equal", text:"y' = eˣ - 2 = 1  ⟹  eˣ = 3  ⟹  x = ln3"},
{label:"Find the y-value", text:"y = e^(ln3) - 2ln3 = 3 - 2ln3"},
{label:"Form tangent equation", text:"y - (3 - 2ln3) = 1(x - ln3)  ⟹  y = x + 3 - 3ln3"}],
answer:"∴ y = x + 3 - 3ln3"},

{type:'qa', id:'a22', navLabel:'A22', qnum:'Q 22', heading:"Point with a given tangent",
question:"Find the point on the curve y = √x that has a tangent of y = x/6 + 3/2.",
hint:"💡 Read off the slope from the tangent line, set y' equal to it, and solve for x.",
steps:[{label:"Identify target slope", text:"The line y = x/6 + 3/2 has slope 1/6"},
{label:"Differentiate and set equal", text:"y' = 1/(2√x) = 1/6  ⟹  2√x = 6  ⟹  √x = 3  ⟹  x = 9"},
{label:"Find y and check", text:"y = √9 = 3; checking the line at x = 9: 9/6 + 3/2 = 3 ✓"}],
answer:"∴ The point is (9, 3)"},

{type:'qa', id:'a23a', navLabel:'A23a', qnum:'Q 23a', heading:"Equation of a normal line",
question:"Find the equation of the normal to y = 2x - eˣ at x = ln(5/2).",
hint:"💡 Find the tangent slope from the derivative, take its negative reciprocal for the normal, then use y - y₁ = m(x - x₁).",
steps:[{label:"Differentiate", text:"y' = 2 - eˣ"},
{label:"Find tangent slope", text:"At x₀ = ln(5/2): e^(x₀) = 5/2, so tangent slope = 2 - 5/2 = -1/2"},
{label:"Find normal slope and y₀", text:"Normal slope = 2 (negative reciprocal); y₀ = 2ln(5/2) - 5/2"},
{label:"Form normal equation", text:"y - y₀ = 2(x - x₀)  ⟹  y = 2x - 2x₀ + y₀ = 2x - 2ln(5/2) + 2ln(5/2) - 5/2"}],
answer:"∴ y = 2x - 5/2"},

{type:'qa', id:'a23b', navLabel:'A23b', qnum:'Q 23b', heading:"Normal meets curve once only",
question:"Show that this normal does not meet the original curve at any other point.",
hint:"💡 Set the normal equation equal to the curve equation and show the resulting equation has only one solution.",
steps:[{label:"Set equal", text:"2x - 5/2 = 2x - eˣ (the curve y = 2x - eˣ)"},
{label:"Simplify", text:"-5/2 = -eˣ  ⟹  eˣ = 5/2  ⟹  x = ln(5/2)"},
{label:"Justify uniqueness", text:"Since eˣ is a one-to-one (injective) function, eˣ = 5/2 has exactly one solution, x = ln(5/2), which is the original point of tangency"}],
answer:"∴ The only intersection is at x = ln(5/2) itself, so the normal meets the curve nowhere else"},

{type:'qa', id:'a24a', navLabel:'A24a', qnum:'Q 24a', heading:"Interpreting an exponential model",
question:"The number of bacteria in millions, N, after t hours of being introduced to an agar dish is modelled by N = (1 + √t)². What is the initial population introduced?",
hint:"💡 The initial population is the value of N when t = 0.",
steps:[{label:"Substitute t = 0", text:"N(0) = (1 + √0)² = (1 + 0)² = 1"}],
answer:"∴ The initial population is 1 million bacteria"},

{type:'qa', id:'a24b', navLabel:'A24b', qnum:'Q 24b', heading:"Solving for time in a model",
question:"How long does it take for the population to reach 9 million?",
hint:"💡 Set N = 9 and solve for t, taking the positive square root since √t ≥ 0.",
steps:[{label:"Set N = 9", text:"(1 + √t)² = 9"},
{label:"Take square root", text:"1 + √t = 3 (taking the positive root, since 1 + √t > 0)"},
{label:"Solve", text:"√t = 2  ⟹  t = 4"}],
answer:"∴ It takes 4 hours to reach 9 million"},

{type:'qa', id:'a24c', navLabel:'A24c', qnum:'Q 24c', heading:"Rate of increase from a model",
question:"Find the rate of increase of bacteria when t = 4.",
hint:"💡 Expand N, differentiate with respect to t, then substitute t = 4.",
steps:[{label:"Expand", text:"N = (1 + √t)² = 1 + 2√t + t"},
{label:"Differentiate", text:"dN/dt = 2×(1/(2√t)) + 1 = 1/√t + 1"},
{label:"Substitute t = 4", text:"dN/dt = 1/√4 + 1 = 1/2 + 1 = 3/2"}],
answer:"∴ The rate of increase at t = 4 is 3/2 (1.5) million bacteria per hour"},

{type:'qa', id:'a24d', navLabel:'A24d', qnum:'Q 24d', heading:"Limitation of a growth model",
question:"State one limitation of this model.",
hint:"💡 Think about what happens to N as t becomes very large, and whether that is realistic for a real dish of bacteria.",
steps:[{label:"Consider long-term behaviour", text:"As t → ∞, N = (1 + √t)² → ∞, so the model predicts the population grows without any limit"},
{label:"Relate to reality", text:"In reality, a real agar dish has finite space, food and oxygen, so the population would eventually level off (or growth would slow) rather than increase forever"}],
answer:"∴ One limitation: the model predicts unlimited population growth as t increases, which is unrealistic since limited resources/space in the dish would eventually restrict growth"},

{type:'qa', id:'a25', navLabel:'A25', qnum:'Q 25', heading:"Interval where a function decreases",
question:"Find the interval in which lnx - 2x is a decreasing function.",
hint:"💡 A function is decreasing where its derivative is negative; remember the domain of lnx is x > 0.",
steps:[{label:"Differentiate", text:"f'(x) = 1/x - 2"},
{label:"Set derivative negative", text:"1/x - 2 < 0  ⟹  1/x < 2"},
{label:"Solve (x > 0)", text:"Since x > 0, multiplying both sides by x preserves the inequality: 1 < 2x  ⟹  x > 1/2"}],
answer:"∴ The function is decreasing for x > 1/2"},

{type:'qa', id:'a26', navLabel:'A26', qnum:'Q 26', heading:"Perpendicular tangents",
question:"The tangent to the curve y = √x at x = k is perpendicular to the tangent to the curve y = 1/√x, also at x = k. Find the value of k.",
hint:"💡 Find both derivatives, evaluate at x = k, then use the perpendicular condition m₁×m₂ = -1.",
steps:[{label:"Differentiate both curves", text:"y = x^(1/2): y' = 1/(2√x); y = x^(-1/2): y' = -1/(2x^(3/2))"},
{label:"Evaluate at x = k", text:"m₁ = 1/(2√k), m₂ = -1/(2k^(3/2))"},
{label:"Apply perpendicular condition", text:"m₁×m₂ = -1/(4k²) = -1  ⟹  k² = 1/4"},
{label:"Solve (k > 0)", text:"k = 1/2 (rejecting k = -1/2 since √x and 1/√x require k > 0)"}],
answer:"∴ k = 1/2"},

{type:'qa', id:'a27a', navLabel:'A27a', qnum:'Q 27a', heading:"Area of a triangle formed by tangents",
question:"The curve y = cosx for -π < x < π meets the x-axis at two points, labelled P and Q. The tangents at P and Q meet at R. Find the area of the triangle PQR.",
hint:"💡 Find P and Q from cosx = 0, form each tangent line using y' = -sinx, find their intersection R, then use ½×base×height.",
steps:[{label:"Find P and Q", text:"cosx = 0 for -π < x < π at x = -π/2 and x = π/2, so P = (-π/2, 0), Q = (π/2, 0)"},
{label:"Find tangent lines", text:"y' = -sinx. At P: slope = -sin(-π/2) = 1, giving y = x + π/2. At Q: slope = -sin(π/2) = -1, giving y = -x + π/2"},
{label:"Find R", text:"x + π/2 = -x + π/2  ⟹  x = 0, y = π/2, so R = (0, π/2)"},
{label:"Compute area", text:"Base PQ = π (along the x-axis), height = π/2 (from R to the x-axis). Area = (1/2)×π×(π/2)"}],
answer:"∴ Area of triangle PQR = π²/4"},

{type:'qa', id:'a27b', navLabel:'A27b', qnum:'Q 27b', heading:"Area of a triangle formed by tangents",
question:"The curve y = sinx for 0 ≤ x < 2π meets the x-axis at two points, labelled A and B. The tangents at A and B meet at C. Find the area of the triangle ABC.",
hint:"💡 Find A and B from sinx = 0, form each tangent line using y' = cosx, find their intersection C, then use ½×base×height.",
steps:[{label:"Find A and B", text:"sinx = 0 for 0 ≤ x < 2π at x = 0 and x = π, so A = (0, 0), B = (π, 0)"},
{label:"Find tangent lines", text:"y' = cosx. At A: slope = cos0 = 1, giving y = x. At B: slope = cosπ = -1, giving y = -x + π"},
{label:"Find C", text:"x = -x + π  ⟹  x = π/2, y = π/2, so C = (π/2, π/2)"},
{label:"Compute area", text:"Base AB = π (along the x-axis), height = π/2 (from C to the x-axis). Area = (1/2)×π×(π/2)"}],
answer:"∴ Area of triangle ABC = π²/4"},

{type:'qa', id:'a28', navLabel:'A28', qnum:'Q 28', heading:"Tangent line through an external point",
question:"Find the coordinates on the curve y = √x that has a tangent passing through the point (0, 1).",
hint:"💡 Let the point of tangency be (a, √a), form the tangent line using y' = 1/(2√a), then force it to pass through (0, 1).",
steps:[{label:"Set up tangent line", text:"At (a, √a), slope = 1/(2√a), so tangent: y - √a = (1/(2√a))(x - a)"},
{label:"Substitute (0, 1)", text:"1 - √a = (1/(2√a))(0 - a) = -√a/2"},
{label:"Solve for a", text:"1 - √a = -√a/2  ⟹  1 = √a/2  ⟹  √a = 2  ⟹  a = 4"},
{label:"Find the point", text:"y = √4 = 2; check: slope = 1/4, tangent y = (1/4)x + 1, which passes through (0,1) ✓"}],
answer:"∴ The point is (4, 2)"},

{type:'qa', id:'a29', navLabel:'A29', qnum:'Q 29', heading:"Point of tangency from a line",
question:"The line 2√3y - 3x + 13π/2 = 0 is a tangent to the curve y = sin(x) - 1/2 at the point P. Find the coordinates of P.",
hint:"💡 Rearrange the line to find its slope, set y' = cosx equal to it to get candidate x-values, then match the line's exact position to pick the correct one.",
steps:[{label:"Find line slope", text:"2√3y - 3x + 13π/2 = 0  ⟹  y = (√3/2)x - 13π√3/12, so slope = √3/2"},
{label:"Match derivative", text:"y' = cosx = √3/2  ⟹  x = 2kπ ± π/6 for integer k"},
{label:"Match the exact line", text:"Writing the tangent at x₀ as y = cos(x₀)x + [sin(x₀) - 1/2 - x₀cos(x₀)] and comparing intercepts with -13π√3/12 forces x₀ = π/6 + 2π = 13π/6 (k = 1, using sin(13π/6) = 1/2)"},
{label:"Find y-coordinate and check", text:"y = sin(13π/6) - 1/2 = 1/2 - 1/2 = 0. Check: 2√3(0) - 3(13π/6) + 13π/2 = -13π/2 + 13π/2 = 0 ✓"}],
answer:"∴ P = (13π/6, 0)"},

{type:'qa', id:'a30', navLabel:'A30', qnum:'Q 30', heading:"Tangent parallel to a line",
question:"The x-coordinate of all points on the graph of y = x² - 2lnx where the tangent is parallel to y + 3x = 9.",
hint:"💡 Find the slope of the given line, set y' equal to it, and solve — remembering lnx requires x > 0.",
steps:[{label:"Find target slope", text:"y + 3x = 9  ⟹  y = -3x + 9, so slope = -3"},
{label:"Differentiate and set equal", text:"y' = 2x - 2/x = -3"},
{label:"Solve (multiply by x, x > 0)", text:"2x² - 2 = -3x  ⟹  2x² + 3x - 2 = 0"},
{label:"Solve quadratic", text:"x = (-3 ± √(9+16))/4 = (-3 ± 5)/4, giving x = 1/2 or x = -2; reject x = -2 since domain requires x > 0"}],
answer:"∴ x = 1/2 (the only valid point, since x = -2 is outside the domain of lnx)"},

{ type:'divider', id:'div-20b', navLabel:'20B', symbol:'B', bigNum:'20B', heading:'The Chain Rule', sub:'Differentiating composite functions f(g(x))' },
{ type:'keypoint', id:'kp206', navLabel:'KP 20.6', badge:'Key Point 20.6', heading:'Key Point 20.6', formula:"The chain rule: if y = f(u), where u = g(x), then dy/dx = dy/du × du/dx", notes:["Use the chain rule whenever you need to differentiate a composite function f(g(x)) — one function applied to the output of another.", "Identify an inner function u = g(x), rewrite y in terms of u, differentiate each part separately, then multiply the two derivatives together.", "Always replace u with the original expression in x at the end, so the final answer is written purely in terms of x."] },
{ type:'example', id:'we206', navLabel:'WE 20.6', badge:'Worked Example 20.6', heading:'Worked Example 20.6 — Chain Rule with a Power', question:"Differentiate y = (x² - 3x)⁶.", hints:["Recognize this as a composite function: y = u⁶, where u = x² - 3x", "Use dy/dx = dy/du × du/dx, with dy/du = 6u⁵ and du/dx = 2x - 3: dy/dx = 6u⁵ × (2x - 3)", "Replace u with x² - 3x: dy/dx = 6(x² - 3x)⁵(2x - 3)"] },
{ type:'example', id:'we207', navLabel:'WE 20.7', badge:'Worked Example 20.7', heading:'Worked Example 20.7 — Chain Rule with sin', question:"Differentiate y = sin 4x.", hints:["Recognize this as a composite function: y = sin u, where u = 4x", "Use dy/dx = dy/du × du/dx, with dy/du = cos u and du/dx = 4: dy/dx = cos u × 4", "Replace u with 4x: dy/dx = 4 cos 4x"] },
{ type:'example', id:'we208', navLabel:'WE 20.8', badge:'Worked Example 20.8', heading:'Worked Example 20.8 — Chain Rule with eˣ', question:"Differentiate y = e^(3x²).", hints:["Recognize this as a composite function: y = e^u, where u = 3x²", "Use dy/dx = dy/du × du/dx, with dy/du = e^u and du/dx = 6x: dy/dx = e^u × 6x", "Replace u with 3x²: dy/dx = 6xe^(3x²)"] },
{ type:'example', id:'we209', navLabel:'WE 20.9', badge:'Worked Example 20.9', heading:'Worked Example 20.9 — Chain Rule with Three Functions', question:"Differentiate y = (ln 2x)⁵.", hints:["This is a composite of three functions: y = u⁵, where u = ln v and v = 2x", "Use the chain rule with three derivatives, dy/dx = dy/du × du/dv × dv/dx, where dy/du = 5u⁴, du/dv = 1/v and dv/dx = 2", "Substitute: dy/dx = 5u⁴ × (1/v) × 2", "Replace u with ln 2x and v with 2x: dy/dx = 5(ln 2x)⁴ × (1/(2x)) × 2", "Simplify: dy/dx = (5/x)(ln 2x)⁴"] },

{ type:'divider', id:'div-ex20b', navLabel:'─', symbol:'B', bigNum:'Ex 20B', heading:'Exercise 20B — Full Solutions', sub:'Q1–26' },
{ type:'qa', id:'b1a', navLabel:'B1a', qnum:'Q 1a', heading:'Chain rule with power function',
  question:"y = (3x + 2)⁴",
  hint:"💡 Write y = u⁴ with u = 3x + 2, then use dy/dx = dy/du × du/dx.",
  steps:[
    {label:'Identify u', text:"Let u = 3x + 2, so y = u⁴."},
    {label:'Differentiate parts', text:"dy/du = 4u³ and du/dx = 3."},
    {label:'Chain rule', text:"dy/dx = dy/du × du/dx = 4u³ × 3 = 12u³."},
    {label:'Substitute back', text:"Replace u with 3x + 2: dy/dx = 12(3x + 2)³."}
  ],
  answer:"∴ dy/dx = 12(3x + 2)³" },

{ type:'qa', id:'b1b', navLabel:'B1b', qnum:'Q 1b', heading:'Chain rule with power function',
  question:"y = (2x − 7)⁵",
  hint:"💡 Write y = u⁵ with u = 2x − 7, then apply the chain rule.",
  steps:[
    {label:'Identify u', text:"Let u = 2x − 7, so y = u⁵."},
    {label:'Differentiate parts', text:"dy/du = 5u⁴ and du/dx = 2."},
    {label:'Chain rule', text:"dy/dx = 5u⁴ × 2 = 10u⁴."},
    {label:'Substitute back', text:"Replace u with 2x − 7: dy/dx = 10(2x − 7)⁴."}
  ],
  answer:"∴ dy/dx = 10(2x − 7)⁴" },

{ type:'qa', id:'b2a', navLabel:'B2a', qnum:'Q 2a', heading:'Chain rule with fractional power',
  question:"y = (x² + 3)^(1/2)",
  hint:"💡 Treat the fractional power the same way as an integer power: y = u^(1/2), u = x² + 3.",
  steps:[
    {label:'Identify u', text:"Let u = x² + 3, so y = u^(1/2)."},
    {label:'Differentiate parts', text:"dy/du = (1/2)u^(-1/2) and du/dx = 2x."},
    {label:'Chain rule', text:"dy/dx = (1/2)u^(-1/2) × 2x = x·u^(-1/2)."},
    {label:'Substitute back', text:"Replace u with x² + 3: dy/dx = x(x² + 3)^(-1/2) = x/√(x² + 3)."}
  ],
  answer:"∴ dy/dx = x/√(x² + 3)" },

{ type:'qa', id:'b2b', navLabel:'B2b', qnum:'Q 2b', heading:'Chain rule with fractional power',
  question:"y = (4 − x²)^(2/3)",
  hint:"💡 Write y = u^(2/3) with u = 4 − x², then apply the chain rule.",
  steps:[
    {label:'Identify u', text:"Let u = 4 − x², so y = u^(2/3)."},
    {label:'Differentiate parts', text:"dy/du = (2/3)u^(-1/3) and du/dx = −2x."},
    {label:'Chain rule', text:"dy/dx = (2/3)u^(-1/3) × (−2x) = −(4x/3)u^(-1/3)."},
    {label:'Substitute back', text:"Replace u with 4 − x²: dy/dx = −4x/(3(4 − x²)^(1/3))."}
  ],
  answer:"∴ dy/dx = −4x/(3(4 − x²)^(1/3))" },

{ type:'qa', id:'b3a', navLabel:'B3a', qnum:'Q 3a', heading:'Chain rule with a root',
  question:"y = √(2x³ + x)",
  hint:"💡 Rewrite the root as a power: y = (2x³ + x)^(1/2).",
  steps:[
    {label:'Rewrite as power', text:"y = (2x³ + x)^(1/2). Let u = 2x³ + x, so y = u^(1/2)."},
    {label:'Differentiate parts', text:"dy/du = (1/2)u^(-1/2) and du/dx = 6x² + 1."},
    {label:'Chain rule', text:"dy/dx = (1/2)u^(-1/2) × (6x² + 1)."},
    {label:'Substitute back', text:"Replace u with 2x³ + x: dy/dx = (6x² + 1)/(2√(2x³ + x))."}
  ],
  answer:"∴ dy/dx = (6x² + 1)/(2√(2x³ + x))" },

{ type:'qa', id:'b3b', navLabel:'B3b', qnum:'Q 3b', heading:'Chain rule with a root',
  question:"y = ∛(5x − x³)",
  hint:"💡 Rewrite the cube root as a power of 1/3, then use the chain rule.",
  steps:[
    {label:'Rewrite as power', text:"y = (5x − x³)^(1/3). Let u = 5x − x³, so y = u^(1/3)."},
    {label:'Differentiate parts', text:"dy/du = (1/3)u^(-2/3) and du/dx = 5 − 3x²."},
    {label:'Chain rule', text:"dy/dx = (1/3)u^(-2/3) × (5 − 3x²)."},
    {label:'Substitute back', text:"Replace u with 5x − x³: dy/dx = (5 − 3x²)/(3(5x − x³)^(2/3))."}
  ],
  answer:"∴ dy/dx = (5 − 3x²)/(3(5x − x³)^(2/3))" },

{ type:'qa', id:'b4a', navLabel:'B4a', qnum:'Q 4a', heading:'Chain rule with sine',
  question:"f(x) = sin2x",
  hint:"💡 Use f'(x) = cos(u) × du/dx with u = 2x.",
  steps:[
    {label:'Identify u', text:"Let u = 2x, so f(x) = sin u."},
    {label:'Chain rule', text:"f'(x) = cos u × du/dx = cos2x × 2."}
  ],
  answer:"∴ f'(x) = 2cos2x" },

{ type:'qa', id:'b4b', navLabel:'B4b', qnum:'Q 4b', heading:'Chain rule with sine',
  question:"f(x) = sin(1/3 x)",
  hint:"💡 Use f'(x) = cos(u) × du/dx with u = x/3.",
  steps:[
    {label:'Identify u', text:"Let u = x/3, so f(x) = sin u."},
    {label:'Chain rule', text:"f'(x) = cos u × du/dx = cos(x/3) × 1/3."}
  ],
  answer:"∴ f'(x) = (1/3)cos(x/3)" },

{ type:'qa', id:'b5a', navLabel:'B5a', qnum:'Q 5a', heading:'Chain rule with cosine',
  question:"f(x) = cosπx",
  hint:"💡 Use f'(x) = −sin(u) × du/dx with u = πx.",
  steps:[
    {label:'Identify u', text:"Let u = πx, so f(x) = cos u."},
    {label:'Chain rule', text:"f'(x) = −sin u × du/dx = −sinπx × π."}
  ],
  answer:"∴ f'(x) = −π sinπx" },

{ type:'qa', id:'b5b', navLabel:'B5b', qnum:'Q 5b', heading:'Chain rule with cosine',
  question:"f(x) = cos5x",
  hint:"💡 Use f'(x) = −sin(u) × du/dx with u = 5x.",
  steps:[
    {label:'Identify u', text:"Let u = 5x, so f(x) = cos u."},
    {label:'Chain rule', text:"f'(x) = −sin u × du/dx = −sin5x × 5."}
  ],
  answer:"∴ f'(x) = −5sin5x" },

{ type:'qa', id:'b6a', navLabel:'B6a', qnum:'Q 6a', heading:'Chain rule with sine',
  question:"f(x) = sin(3x + 1)",
  hint:"💡 Use f'(x) = cos(u) × du/dx with u = 3x + 1.",
  steps:[
    {label:'Identify u', text:"Let u = 3x + 1, so f(x) = sin u."},
    {label:'Chain rule', text:"f'(x) = cos u × du/dx = cos(3x + 1) × 3."}
  ],
  answer:"∴ f'(x) = 3cos(3x + 1)" },

{ type:'qa', id:'b6b', navLabel:'B6b', qnum:'Q 6b', heading:'Chain rule with sine',
  question:"f(x) = sin(1 − 4x)",
  hint:"💡 Use f'(x) = cos(u) × du/dx with u = 1 − 4x.",
  steps:[
    {label:'Identify u', text:"Let u = 1 − 4x, so f(x) = sin u."},
    {label:'Chain rule', text:"f'(x) = cos u × du/dx = cos(1 − 4x) × (−4)."}
  ],
  answer:"∴ f'(x) = −4cos(1 − 4x)" },

{ type:'qa', id:'b7a', navLabel:'B7a', qnum:'Q 7a', heading:'Chain rule with cosine',
  question:"f(x) = cos(2 − 3x)",
  hint:"💡 Use f'(x) = −sin(u) × du/dx with u = 2 − 3x.",
  steps:[
    {label:'Identify u', text:"Let u = 2 − 3x, so f(x) = cos u."},
    {label:'Chain rule', text:"f'(x) = −sin u × du/dx = −sin(2 − 3x) × (−3)."}
  ],
  answer:"∴ f'(x) = 3sin(2 − 3x)" },

{ type:'qa', id:'b7b', navLabel:'B7b', qnum:'Q 7b', heading:'Chain rule with cosine',
  question:"f(x) = cos(1/2 x + 4)",
  hint:"💡 Use f'(x) = −sin(u) × du/dx with u = x/2 + 4.",
  steps:[
    {label:'Identify u', text:"Let u = x/2 + 4, so f(x) = cos u."},
    {label:'Chain rule', text:"f'(x) = −sin u × du/dx = −sin(x/2 + 4) × 1/2."}
  ],
  answer:"∴ f'(x) = −(1/2)sin(x/2 + 4)" },

{ type:'qa', id:'b8a', navLabel:'B8a', qnum:'Q 8a', heading:'Chain rule with exponential',
  question:"e^(3x)",
  hint:"💡 Use dy/dx = e^u × du/dx with u = 3x.",
  steps:[
    {label:'Identify u', text:"Let u = 3x, so y = e^u."},
    {label:'Chain rule', text:"dy/dx = e^u × du/dx = e^(3x) × 3."}
  ],
  answer:"∴ dy/dx = 3e^(3x)" },

{ type:'qa', id:'b8b', navLabel:'B8b', qnum:'Q 8b', heading:'Chain rule with exponential',
  question:"e^(x/2)",
  hint:"💡 Use dy/dx = e^u × du/dx with u = x/2.",
  steps:[
    {label:'Identify u', text:"Let u = x/2, so y = e^u."},
    {label:'Chain rule', text:"dy/dx = e^u × du/dx = e^(x/2) × 1/2."}
  ],
  answer:"∴ dy/dx = (1/2)e^(x/2)" },

{ type:'qa', id:'b9a', navLabel:'B9a', qnum:'Q 9a', heading:'Chain rule with exponential',
  question:"e^(-x³)",
  hint:"💡 Use dy/dx = e^u × du/dx with u = −x³.",
  steps:[
    {label:'Identify u', text:"Let u = −x³, so y = e^u."},
    {label:'Chain rule', text:"dy/dx = e^u × du/dx = e^(-x³) × (−3x²)."}
  ],
  answer:"∴ dy/dx = −3x²e^(-x³)" },

{ type:'qa', id:'b9b', navLabel:'B9b', qnum:'Q 9b', heading:'Chain rule with exponential',
  question:"e^(4x²)",
  hint:"💡 Use dy/dx = e^u × du/dx with u = 4x².",
  steps:[
    {label:'Identify u', text:"Let u = 4x², so y = e^u."},
    {label:'Chain rule', text:"dy/dx = e^u × du/dx = e^(4x²) × 8x."}
  ],
  answer:"∴ dy/dx = 8xe^(4x²)" },

{ type:'qa', id:'b10a', navLabel:'B10a', qnum:'Q 10a', heading:'Chain rule with logarithm',
  question:"ln4x",
  hint:"💡 Use dy/dx = (1/u) × du/dx with u = 4x.",
  steps:[
    {label:'Identify u', text:"Let u = 4x, so y = ln u."},
    {label:'Chain rule', text:"dy/dx = (1/u) × du/dx = (1/(4x)) × 4."},
    {label:'Simplify', text:"dy/dx = 4/(4x) = 1/x."}
  ],
  answer:"∴ dy/dx = 1/x" },

{ type:'qa', id:'b10b', navLabel:'B10b', qnum:'Q 10b', heading:'Chain rule with logarithm',
  question:"ln(x/3)",
  hint:"💡 Use dy/dx = (1/u) × du/dx with u = x/3.",
  steps:[
    {label:'Identify u', text:"Let u = x/3, so y = ln u."},
    {label:'Chain rule', text:"dy/dx = (1/u) × du/dx = (3/x) × (1/3)."},
    {label:'Simplify', text:"dy/dx = 3/(3x) = 1/x."}
  ],
  answer:"∴ dy/dx = 1/x" },

{ type:'qa', id:'b11a', navLabel:'B11a', qnum:'Q 11a', heading:'Chain rule with logarithm',
  question:"ln(x² + 1)",
  hint:"💡 Use dy/dx = (1/u) × du/dx with u = x² + 1.",
  steps:[
    {label:'Identify u', text:"Let u = x² + 1, so y = ln u."},
    {label:'Chain rule', text:"dy/dx = (1/u) × du/dx = (1/(x² + 1)) × 2x."}
  ],
  answer:"∴ dy/dx = 2x/(x² + 1)" },

{ type:'qa', id:'b11b', navLabel:'B11b', qnum:'Q 11b', heading:'Chain rule with logarithm',
  question:"ln(3 − 4x²)",
  hint:"💡 Use dy/dx = (1/u) × du/dx with u = 3 − 4x².",
  steps:[
    {label:'Identify u', text:"Let u = 3 − 4x², so y = ln u."},
    {label:'Chain rule', text:"dy/dx = (1/u) × du/dx = (1/(3 − 4x²)) × (−8x)."}
  ],
  answer:"∴ dy/dx = −8x/(3 − 4x²)" },

{ type:'qa', id:'b12a', navLabel:'B12a', qnum:'Q 12a', heading:'Chain rule with three layers',
  question:"y = sin²3x",
  hint:"💡 This is a composite of three functions: square, sine, then 3x — use three derivatives multiplied together.",
  steps:[
    {label:'Identify layers', text:"y = sin²3x = (sin3x)². Let y = u², u = sinv, v = 3x."},
    {label:'Differentiate each layer', text:"dy/du = 2u, du/dv = cosv, dv/dx = 3."},
    {label:'Chain rule', text:"dy/dx = 2u × cosv × 3 = 2sin3x × cos3x × 3."},
    {label:'Simplify', text:"dy/dx = 6sin3x cos3x = 3sin6x (using 2sinAcosA = sin2A)."}
  ],
  answer:"∴ dy/dx = 6sin3x cos3x = 3sin6x" },

{ type:'qa', id:'b12b', navLabel:'B12b', qnum:'Q 12b', heading:'Chain rule with three layers',
  question:"y = cos²4x",
  hint:"💡 This is a composite of three functions: square, cosine, then 4x — use three derivatives multiplied together.",
  steps:[
    {label:'Identify layers', text:"y = cos²4x = (cos4x)². Let y = u², u = cosv, v = 4x."},
    {label:'Differentiate each layer', text:"dy/du = 2u, du/dv = −sinv, dv/dx = 4."},
    {label:'Chain rule', text:"dy/dx = 2u × (−sinv) × 4 = 2cos4x × (−sin4x) × 4."},
    {label:'Simplify', text:"dy/dx = −8sin4x cos4x = −4sin8x (using 2sinAcosA = sin2A)."}
  ],
  answer:"∴ dy/dx = −8sin4x cos4x = −4sin8x" },

{ type:'qa', id:'b13a', navLabel:'B13a', qnum:'Q 13a', heading:'Chain rule with three layers',
  question:"y = e^(cos2x)",
  hint:"💡 This is a composite of three functions: exponential, cosine, then 2x.",
  steps:[
    {label:'Identify layers', text:"Let y = e^u, u = cosv, v = 2x."},
    {label:'Differentiate each layer', text:"dy/du = e^u, du/dv = −sinv, dv/dx = 2."},
    {label:'Chain rule', text:"dy/dx = e^u × (−sinv) × 2 = e^(cos2x) × (−sin2x) × 2."}
  ],
  answer:"∴ dy/dx = −2sin2x·e^(cos2x)" },

{ type:'qa', id:'b13b', navLabel:'B13b', qnum:'Q 13b', heading:'Chain rule with three layers',
  question:"y = e^(sin5x)",
  hint:"💡 This is a composite of three functions: exponential, sine, then 5x.",
  steps:[
    {label:'Identify layers', text:"Let y = e^u, u = sinv, v = 5x."},
    {label:'Differentiate each layer', text:"dy/du = e^u, du/dv = cosv, dv/dx = 5."},
    {label:'Chain rule', text:"dy/dx = e^u × cosv × 5 = e^(sin5x) × cos5x × 5."}
  ],
  answer:"∴ dy/dx = 5cos5x·e^(sin5x)" },

{ type:'qa', id:'b14a', navLabel:'B14a', qnum:'Q 14a', heading:'Chain rule with three layers',
  question:"y = (ln3x)^(1/2)",
  hint:"💡 This is a composite of three functions: power 1/2, natural log, then 3x.",
  steps:[
    {label:'Identify layers', text:"Let y = u^(1/2), u = lnv, v = 3x."},
    {label:'Differentiate each layer', text:"dy/du = (1/2)u^(-1/2), du/dv = 1/v, dv/dx = 3."},
    {label:'Chain rule', text:"dy/dx = (1/2)u^(-1/2) × (1/v) × 3 = (1/2)(ln3x)^(-1/2) × (1/(3x)) × 3."},
    {label:'Simplify', text:"The 3s cancel: dy/dx = (1/2)(ln3x)^(-1/2) × (1/x) = 1/(2x√(ln3x))."}
  ],
  answer:"∴ dy/dx = 1/(2x√(ln3x))" },

{ type:'qa', id:'b14b', navLabel:'B14b', qnum:'Q 14b', heading:'Chain rule with three layers',
  question:"y = (ln2x)^(1/3)",
  hint:"💡 This is a composite of three functions: power 1/3, natural log, then 2x.",
  steps:[
    {label:'Identify layers', text:"Let y = u^(1/3), u = lnv, v = 2x."},
    {label:'Differentiate each layer', text:"dy/du = (1/3)u^(-2/3), du/dv = 1/v, dv/dx = 2."},
    {label:'Chain rule', text:"dy/dx = (1/3)u^(-2/3) × (1/v) × 2 = (1/3)(ln2x)^(-2/3) × (1/(2x)) × 2."},
    {label:'Simplify', text:"The 2s cancel: dy/dx = (1/3)(ln2x)^(-2/3) × (1/x) = 1/(3x(ln2x)^(2/3))."}
  ],
  answer:"∴ dy/dx = 1/(3x(ln2x)^(2/3))" },

{ type:'qa', id:'b15', navLabel:'B15', qnum:'Q 15', heading:'Derivative of a reciprocal exponential',
  question:"If f(x) = 1/e^x find f'(x).",
  hint:"💡 Rewrite 1/e^x as e^(-x) first, then differentiate.",
  steps:[
    {label:'Rewrite', text:"f(x) = 1/e^x = e^(-x)."},
    {label:'Chain rule', text:"Let u = −x. f'(x) = e^u × du/dx = e^(-x) × (−1)."}
  ],
  answer:"∴ f'(x) = −e^(-x) = −1/e^x" },

{ type:'qa', id:'b16', navLabel:'B16', qnum:'Q 16', heading:'Gradient of a curve at a point',
  question:"Find the gradient of the curve y = (eˣ)² + 5x when x = ln3.",
  hint:"💡 Simplify (eˣ)² = e^(2x) before differentiating, then substitute x = ln3.",
  steps:[
    {label:'Simplify', text:"y = (eˣ)² + 5x = e^(2x) + 5x."},
    {label:'Differentiate', text:"dy/dx = 2e^(2x) + 5."},
    {label:'Substitute x = ln3', text:"e^(2ln3) = (e^(ln3))² = 3² = 9, so dy/dx = 2(9) + 5."}
  ],
  answer:"∴ Gradient = 23" },

{ type:'qa', id:'b17', navLabel:'B17', qnum:'Q 17', heading:'Equation of a tangent line',
  question:"Find the equation of the tangent to the curve y = √(x² + 9) at x = 4.",
  hint:"💡 Differentiate using the chain rule, evaluate the gradient and y-value at x = 4, then use y − y₁ = m(x − x₁).",
  steps:[
    {label:'Differentiate', text:"y = (x² + 9)^(1/2). dy/dx = x(x² + 9)^(-1/2) = x/√(x² + 9)."},
    {label:'Evaluate at x = 4', text:"y = √(16 + 9) = √25 = 5. Gradient = 4/√25 = 4/5."},
    {label:'Form tangent line', text:"y − 5 = (4/5)(x − 4)."},
    {label:'Simplify', text:"y = (4/5)x − 16/5 + 5 = (4/5)x + 9/5."}
  ],
  answer:"∴ y = (4/5)x + 9/5" },

{ type:'qa', id:'b18', navLabel:'B18', qnum:'Q 18', heading:'Tangent parallel to a given line',
  question:"Find the coordinates of the point on the graph of y = ln(2x − 5) that has its tangent parallel to y = 2x.",
  hint:"💡 Parallel lines have equal gradients — set the derivative equal to 2 and solve for x.",
  steps:[
    {label:'Differentiate', text:"dy/dx = 2/(2x − 5)."},
    {label:'Set gradient = 2', text:"2/(2x − 5) = 2 ⟹ 2x − 5 = 1 ⟹ x = 3."},
    {label:'Find y', text:"y = ln(2(3) − 5) = ln1 = 0."}
  ],
  answer:"∴ The point is (3, 0)" },

{ type:'qa', id:'b19', navLabel:'B19', qnum:'Q 19', heading:'Tangent to a trig-reciprocal curve',
  question:"Find the tangent to y = cos(1/x) at x = 2/π.",
  hint:"💡 Differentiate with the chain rule (u = 1/x), then substitute x = 2/π for both the gradient and the y-value.",
  steps:[
    {label:'Differentiate', text:"Let u = 1/x = x⁻¹. dy/dx = −sin(u) × du/dx = −sin(1/x) × (−1/x²) = sin(1/x)/x²."},
    {label:'Evaluate at x = 2/π', text:"1/x = π/2, so sin(π/2) = 1 and x² = 4/π². Gradient = 1/(4/π²) = π²/4."},
    {label:'Find y', text:"y = cos(π/2) = 0."},
    {label:'Form tangent line', text:"y − 0 = (π²/4)(x − 2/π) = (π²/4)x − π/2."}
  ],
  answer:"∴ y = (π²/4)x − π/2" },

{ type:'qa', id:'b20', navLabel:'B20', qnum:'Q 20', heading:'Tangent perpendicular to a given line',
  question:"Find the tangent to the curve y = ln(x − 2) that is perpendicular to y = −3x + 2.",
  hint:"💡 Perpendicular gradients multiply to give −1, so the tangent gradient must be 1/3.",
  steps:[
    {label:'Differentiate', text:"dy/dx = 1/(x − 2)."},
    {label:'Find required gradient', text:"The line y = −3x + 2 has gradient −3, so the perpendicular gradient is 1/3."},
    {label:'Solve for x', text:"1/(x − 2) = 1/3 ⟹ x − 2 = 3 ⟹ x = 5."},
    {label:'Find y and form tangent', text:"y = ln(5 − 2) = ln3. Tangent: y − ln3 = (1/3)(x − 5)."}
  ],
  answer:"∴ y = (1/3)x − 5/3 + ln3" },

{ type:'qa', id:'b21a', navLabel:'B21a', qnum:'Q 21a', heading:'Derivative of sin squared',
  question:"Find the derivative of sin²x.",
  hint:"💡 Write sin²x = (sinx)² and apply the chain rule.",
  steps:[
    {label:'Identify u', text:"Let u = sinx, so y = u²."},
    {label:'Chain rule', text:"dy/dx = 2u × du/dx = 2sinx × cosx."},
    {label:'Simplify', text:"dy/dx = 2sinx cosx = sin2x."}
  ],
  answer:"∴ dy/dx = 2sinx cosx = sin2x" },

{ type:'qa', id:'b21b', navLabel:'B21b', qnum:'Q 21b', heading:'Stationary points of sin squared',
  question:"Hence, find all points on the curve of y = sin²x, 0 < x < 2π where the gradient of the tangent is zero.",
  hint:"💡 Set the derivative from part a equal to zero and solve for x in the given interval.",
  steps:[
    {label:'Set derivative to zero', text:"From part a, dy/dx = sin2x. Set sin2x = 0."},
    {label:'Solve for x', text:"For 0 < x < 2π, 0 < 2x < 4π, so 2x = π, 2π, 3π, giving x = π/2, π, 3π/2."},
    {label:'Find y-values', text:"y(π/2) = sin²(π/2) = 1; y(π) = sin²(π) = 0; y(3π/2) = sin²(3π/2) = 1."}
  ],
  answer:"∴ The points are (π/2, 1), (π, 0) and (3π/2, 1)" },

{ type:'qa', id:'b22a', navLabel:'B22a', qnum:'Q 22a', heading:"Trig identity proof",
  question:"Show that (cosx + sinx)² = 1 + sin2x.",
  hint:"💡 Expand the square and use sin²x + cos²x = 1 and sin2x = 2sinxcosx.",
  steps:[
    {label:'Expand', text:"(cosx + sinx)² = cos²x + 2sinxcosx + sin²x."},
    {label:'Apply identities', text:"= (cos²x + sin²x) + 2sinxcosx = 1 + sin2x, using cos²x + sin²x = 1 and 2sinxcosx = sin2x."}
  ],
  answer:"∴ (cosx + sinx)² = 1 + sin2x, as required" },

{ type:'qa', id:'b22b', navLabel:'B22b', qnum:'Q 22b', heading:'Deducing an identity by differentiation',
  question:"Use differentiation to deduce that cos2x = cos²x − sin²x.",
  hint:"💡 Differentiate both sides of the identity from part a; the left side factorises as a difference of squares.",
  steps:[
    {label:'Differentiate LHS', text:"d/dx[(cosx + sinx)²] = 2(cosx + sinx)(−sinx + cosx) = 2(cosx + sinx)(cosx − sinx) = 2(cos²x − sin²x)."},
    {label:'Differentiate RHS', text:"d/dx[1 + sin2x] = 2cos2x."},
    {label:'Equate and simplify', text:"2(cos²x − sin²x) = 2cos2x, so dividing both sides by 2 gives cos²x − sin²x = cos2x."}
  ],
  answer:"∴ cos2x = cos²x − sin²x, as required" },

{ type:'qa', id:'b23', navLabel:'B23', qnum:'Q 23', heading:'Proving a triple angle identity',
  question:"Given that sin3x = 3sinx − 4sin³x prove that cos3x = 4cos³x − 3cosx.",
  hint:"💡 Differentiate both sides of the given identity, then use sin²x = 1 − cos²x to rewrite the result.",
  steps:[
    {label:'Differentiate both sides', text:"LHS: d/dx(sin3x) = 3cos3x. RHS: d/dx(3sinx − 4sin³x) = 3cosx − 12sin²x cosx."},
    {label:'Equate', text:"3cos3x = 3cosx − 12sin²x cosx."},
    {label:'Divide by 3', text:"cos3x = cosx − 4sin²x cosx."},
    {label:'Substitute identity', text:"Replace sin²x with 1 − cos²x: cos3x = cosx − 4(1 − cos²x)cosx = cosx − 4cosx + 4cos³x."},
    {label:'Simplify', text:"cos3x = 4cos³x − 3cosx."}
  ],
  answer:"∴ cos3x = 4cos³x − 3cosx, as required" },

{ type:'qa', id:'b24', navLabel:'B24', qnum:'Q 24', heading:'Tangent y-intercept independent of k',
  question:"The tangent to the curve y = e^(kx) at x = 1/k is called L. Prove that for all k > 0 the y-intercept of L is independent of k.",
  hint:"💡 Find the gradient and the point of contact in terms of k, write the tangent equation, then substitute x = 0.",
  steps:[
    {label:'Differentiate', text:"y = e^(kx), so dy/dx = ke^(kx)."},
    {label:'Evaluate at x = 1/k', text:"y(1/k) = e^(k·1/k) = e¹ = e. Gradient at x = 1/k: k·e^(k·1/k) = ke."},
    {label:'Form tangent line L', text:"L: y − e = ke(x − 1/k)."},
    {label:'Find y-intercept', text:"y = ke·x − ke·(1/k) + e = kex − e + e = kex. At x = 0, y = ke(0) = 0."}
  ],
  answer:"∴ The y-intercept of L is always 0, for every k > 0, so it is independent of k" },

{ type:'qa', id:'b25', navLabel:'B25', qnum:'Q 25', heading:'Tangent parallel to a line, with domain check',
  question:"Find the x-coordinate of any point on the curve y = ln(x² − 8) where the tangent is parallel to y = 6x − 5.",
  hint:"💡 Set the derivative equal to 6, solve the resulting quadratic, then check both roots lie in the domain x² > 8.",
  steps:[
    {label:'Differentiate', text:"dy/dx = 2x/(x² − 8)."},
    {label:'Set gradient = 6', text:"2x/(x² − 8) = 6 ⟹ 2x = 6x² − 48 ⟹ 6x² − 2x − 48 = 0 ⟹ 3x² − x − 24 = 0."},
    {label:'Solve quadratic', text:"x = [1 ± √(1 + 288)]/6 = [1 ± 17]/6, giving x = 3 or x = −8/3."},
    {label:'Check domain', text:"Need x² − 8 > 0. For x = 3: 9 − 8 = 1 > 0, valid. For x = −8/3: 64/9 − 8 = −8/9 < 0, invalid (ln undefined)."}
  ],
  answer:"∴ x = 3 (x = −8/3 is rejected as it is outside the domain)" },

{ type:'qa', id:'b26a', navLabel:'B26a', qnum:'Q 26a', heading:'Verifying a differential equation',
  question:"Show that if y = e^(2x) then dy/dx = 2y.",
  hint:"💡 Differentiate y = e^(2x) with the chain rule, then rewrite the result in terms of y.",
  steps:[
    {label:'Differentiate', text:"y = e^(2x) ⟹ dy/dx = 2e^(2x)."},
    {label:'Rewrite in terms of y', text:"Since y = e^(2x), dy/dx = 2e^(2x) = 2y."}
  ],
  answer:"∴ dy/dx = 2y, as required" },

{ type:'qa', id:'b26b', navLabel:'B26b', qnum:'Q 26b', heading:'Testing the converse statement',
  question:"Is it true that if dy/dx = 2y then y = e^(2x)? Justify your answer.",
  hint:"💡 Think about whether other functions besides e^(2x) also satisfy dy/dx = 2y.",
  steps:[
    {label:'Consider the general solution', text:"The general solution to dy/dx = 2y is y = Ae^(2x) for any constant A, since d/dx(Ae^(2x)) = 2Ae^(2x) = 2y for every value of A."},
    {label:'Test a counterexample', text:"For example, y = 3e^(2x) satisfies dy/dx = 2y (dy/dx = 6e^(2x) = 2(3e^(2x))), but y ≠ e^(2x)."}
  ],
  answer:"∴ No, it is not true in general — dy/dx = 2y only implies y = Ae^(2x) for some constant A, and this equals e^(2x) only in the particular case A = 1" },

{ type:'divider', id:'div-20c', navLabel:'20C', symbol:'C', bigNum:'20C', heading:'Product & Quotient Rules', sub:'Differentiating products and quotients of functions' },
{ type:'keypoint', id:'kp207', navLabel:'KP 20.7', badge:'Key Point 20.7', heading:'Key Point 20.7', formula:"The product rule: if y = u(x)v(x) then dy/dx = u(dv/dx) + v(du/dx)", notes:["You cannot differentiate a product term by term the way you can with a sum — the product rule is needed instead.", "Identify two functions u(x) and v(x) whose product makes up y, find their individual derivatives, then substitute into the formula.", "If either u or v is itself a composite function, use the chain rule to find its derivative first."] },
{ type:'example', id:'we210', navLabel:'WE 20.10', badge:'Worked Example 20.10', heading:'Worked Example 20.10 — Product Rule', question:"Differentiate y = x² ln x.", hints:["Define the functions u(x) and v(x): let u = x² and v = ln x", "Find their derivatives: du/dx = 2x and dv/dx = 1/x", "Substitute into dy/dx = u(dv/dx) + v(du/dx): dy/dx = x²(1/x) + (ln x)(2x)", "Simplify: dy/dx = x + 2x ln x"] },
{ type:'example', id:'we211', navLabel:'WE 20.11', badge:'Worked Example 20.11', heading:'Worked Example 20.11 — Product Rule with the Chain Rule', question:"Differentiate f(x) = eˣ(x² + 3)⁴.", hints:["Define the functions u(x) and v(x) for the product rule: let u = eˣ and v = (x² + 3)⁴, so u' = eˣ", "For v' you need the chain rule — remember to multiply by the derivative of x² + 3: v' = 4(x² + 3)³ × 2x = 8x(x² + 3)³", "Substitute into f'(x) = uv' + vu': f'(x) = eˣ × 8x(x² + 3)³ + (x² + 3)⁴ × eˣ", "Write the answer neatly: f'(x) = 8xeˣ(x² + 3)³ + eˣ(x² + 3)⁴"] },
{ type:'examiner', id:'bte201', navLabel:'BtE 20.1', heading:'Be the Examiner 20.1', question:"Differentiate f(x) = sin(x² - 5x). Which is the correct solution? Identify the errors made in the incorrect solutions.", solutions:[{label:'Solution 1', style:'sol-red', lines:"Let u = sin and v = x² - 5x. Then u' = cos and v' = 2x - 5. f'(x) = sin(2x - 5) + cos(x² - 5x)"}, {label:'Solution 2', style:'sol-green', lines:"f'(x) = (2x - 5)cos(x² - 5x)"}, {label:'Solution 3', style:'sol-red', lines:"f'(x) = cos(2x - 5)"}], note:"Solution 2 is correct. This is a composite function, not a product, so it needs the chain rule: differentiate the outer function (sin → cos), keep the inner function (x² - 5x) unchanged inside it, then multiply by the derivative of the inner function (2x - 5). Solution 1 wrongly treats sin and (x² - 5x) as two functions to be combined with a product-style rule, producing a meaningless mixture of sin(2x - 5) and cos(x² - 5x) that follows no valid differentiation rule. Solution 3 correctly changes sin to cos but forgets to multiply by the derivative of the inner function, and incorrectly puts that derivative (2x - 5) inside the cosine as its argument instead of keeping x² - 5x there." },
{ type:'keypoint', id:'kp208', navLabel:'KP 20.8', badge:'Key Point 20.8', heading:'Key Point 20.8', formula:"The quotient rule: if y = u(x)/v(x), then dy/dx = (v(du/dx) - u(dv/dx))/v²", notes:["You cannot differentiate the top and bottom of a quotient separately — the quotient rule is needed instead.", "Watch the order of terms in the numerator: it is v times du/dx minus u times dv/dx, not the other way round.", "A quotient can sometimes be rewritten as a product using a negative power and differentiated with the product rule instead, but the quotient rule is usually quicker."] },
{ type:'example', id:'we212', navLabel:'WE 20.12', badge:'Worked Example 20.12', heading:'Worked Example 20.12 — Quotient Rule', question:"Differentiate y = (x² + 6x - 2)/(x + 3)², giving your answer in the form a/(x + 3)^b where a, b ∈ ℤ.", hints:["Define the functions u(x) and v(x): let u = x² + 6x - 2 and v = (x + 3)²", "Find their derivatives — for v you need the chain rule, but the derivative of x + 3 is just 1: du/dx = 2x + 6 and dv/dx = 2(x + 3)", "Substitute into dy/dx = (v(du/dx) - u(dv/dx))/v²: dy/dx = [(x + 3)²(2x + 6) - (x² + 6x - 2)·2(x + 3)] / (x + 3)⁴", "Cancel a common factor of (x + 3) from the numerator and denominator: dy/dx = [(x + 3)(2x + 6) - 2(x² + 6x - 2)] / (x + 3)³", "Expand the numerator: (x + 3)(2x + 6) = 2x² + 12x + 18, and 2(x² + 6x - 2) = 2x² + 12x - 4", "Simplify the numerator: (2x² + 12x + 18) - (2x² + 12x - 4) = 22", "Final answer: dy/dx = 22/(x + 3)³"] },
{ type:'example', id:'we213', navLabel:'WE 20.13', badge:'Worked Example 20.13', heading:'Worked Example 20.13 — Proving the Derivative of tan x', question:"Show that if f(x) = tan x then f'(x) = 1/cos²x.", hints:["Use tan x = sin x/cos x to write tan x in terms of functions you can differentiate: f(x) = sin x/cos x", "Now use the quotient rule: let u = sin x and v = cos x, so u' = cos x and v' = -sin x", "Substitute into f'(x) = (vu' - uv')/v²: f'(x) = [cos x · cos x - sin x · (-sin x)] / cos²x", "Simplify the numerator: f'(x) = (cos²x + sin²x)/cos²x", "Use cos²x + sin²x = 1: f'(x) = 1/cos²x"] },
{ type:'examiner', id:'bte202', navLabel:'BtE 20.2', heading:'Be the Examiner 20.2', question:"Differentiate f(x) = 5/e^(2x). Which is the correct solution? Identify the errors made in the incorrect solutions.", solutions:[{label:'Solution 1', style:'sol-red', lines:"Let u = 5 and v = e^(2x). Then u' = 5 and v' = 2e^(2x). f'(x) = (vu' - uv')/v² = (5e^(2x) - 10e^(2x))/(e^(2x))² = -5e^(2x)/e^(4x) = -5/e^(2x)"}, {label:'Solution 2', style:'sol-green', lines:"f(x) = 5/e^(2x) = 5e^(-2x). Let u = 5 and v = e^(-2x). Then u' = 0 and v' = -2e^(-2x). f'(x) = u'v + uv' = 0 + 5(-2e^(-2x)) = -10e^(-2x)"}, {label:'Solution 3', style:'sol-red', lines:"f(x) = 5/e^(2x) = 5e^(-2x). Let u = 5 and v = e^(-2x). Then u' = 0 and v' = 2e^(-2x). f'(x) = u'v + uv' = 0 + 5(2e^(-2x)) = 10e^(-2x)"}], note:"Solution 2 is correct: f'(x) = -10e^(-2x). Solution 1 incorrectly states u' = 5, treating the derivative of the constant 5 as if it were 5 itself, when the derivative of any constant is 0 — this error changes the final answer to -5/e^(2x) instead of -10/e^(2x). Solution 3 correctly rewrites f(x) as 5e^(-2x) but drops the negative sign when applying the chain rule to e^(-2x), writing v' = 2e^(-2x) instead of -2e^(-2x), which flips the sign of the final answer to +10e^(-2x)." },

{ type:'divider', id:'div-ex20c', navLabel:'─', symbol:'C', bigNum:'Ex 20C', heading:'Exercise 20C — Full Solutions', sub:'Q1–25' },
{ type:'qa', id:'c1a', navLabel:'C1a', qnum:'Q 1a', heading:'Product rule with sine',
  question:"Find dy/dx for y = x sin x.",
  hint:"💡 Use the product rule: dy/dx = u'v + uv'.",
  steps:[
    {label:'Define u,v', text:"Let u = x and v = sin x."},
    {label:'Differentiate', text:"u' = 1 and v' = cos x."},
    {label:'Substitute', text:"dy/dx = u'v + uv' = (1)(sin x) + (x)(cos x)"},
    {label:'Simplify', text:"dy/dx = sin x + x cos x"}],
  answer:"∴ dy/dx = sin x + x cos x" },
{ type:'qa', id:'c1b', navLabel:'C1b', qnum:'Q 1b', heading:'Product rule fractional power',
  question:"Find dy/dx for y = x^(1/2) sin x.",
  hint:"💡 Product rule; differentiate x^(1/2) with the power rule.",
  steps:[
    {label:'Define u,v', text:"Let u = x^(1/2) and v = sin x."},
    {label:'Differentiate', text:"u' = (1/2)x^(-1/2) and v' = cos x."},
    {label:'Substitute', text:"dy/dx = (1/2)x^(-1/2) sin x + x^(1/2) cos x"},
    {label:'Simplify', text:"dy/dx = sin x/(2√x) + √x cos x"}],
  answer:"∴ dy/dx = sin x/(2√x) + √x cos x" },
{ type:'qa', id:'c2a', navLabel:'C2a', qnum:'Q 2a', heading:'Product rule with cosine',
  question:"Find dy/dx for y = x² cos x.",
  hint:"💡 Use the product rule with u = x², v = cos x.",
  steps:[
    {label:'Define u,v', text:"Let u = x² and v = cos x."},
    {label:'Differentiate', text:"u' = 2x and v' = -sin x."},
    {label:'Substitute', text:"dy/dx = u'v + uv' = 2x cos x + x²(-sin x)"}],
  answer:"∴ dy/dx = 2x cos x - x² sin x" },
{ type:'qa', id:'c2b', navLabel:'C2b', qnum:'Q 2b', heading:'Product rule negative power',
  question:"Find dy/dx for y = x⁻¹ cos x.",
  hint:"💡 Use the product rule with u = x⁻¹, v = cos x.",
  steps:[
    {label:'Define u,v', text:"Let u = x⁻¹ and v = cos x."},
    {label:'Differentiate', text:"u' = -x⁻² and v' = -sin x."},
    {label:'Substitute', text:"dy/dx = -x⁻² cos x + x⁻¹(-sin x)"}],
  answer:"∴ dy/dx = -cos x/x² - sin x/x" },
{ type:'qa', id:'c3a', navLabel:'C3a', qnum:'Q 3a', heading:'Product rule exponential function',
  question:"Find dy/dx for y = x^(-1/2) e^x.",
  hint:"💡 Use the product rule; keep e^x as it is, since d/dx(e^x) = e^x.",
  steps:[
    {label:'Define u,v', text:"Let u = x^(-1/2) and v = e^x."},
    {label:'Differentiate', text:"u' = -(1/2)x^(-3/2) and v' = e^x."},
    {label:'Substitute', text:"dy/dx = -(1/2)x^(-3/2) e^x + x^(-1/2) e^x"},
    {label:'Simplify', text:"Factor e^x x^(-3/2): dy/dx = e^x x^(-3/2)[x - 1/2] = e^x(2x-1)/(2x^(3/2))"}],
  answer:"∴ dy/dx = e^x(2x-1)/(2x^(3/2))" },
{ type:'qa', id:'c3b', navLabel:'C3b', qnum:'Q 3b', heading:'Product rule cubic exponential',
  question:"Find dy/dx for y = x³ e^x.",
  hint:"💡 Use the product rule with u = x³, v = e^x.",
  steps:[
    {label:'Define u,v', text:"Let u = x³ and v = e^x."},
    {label:'Differentiate', text:"u' = 3x² and v' = e^x."},
    {label:'Substitute', text:"dy/dx = 3x² e^x + x³ e^x"},
    {label:'Simplify', text:"Factor x²e^x: dy/dx = x²e^x(x+3)"}],
  answer:"∴ dy/dx = x²e^x(x+3)" },
{ type:'qa', id:'c4a', navLabel:'C4a', qnum:'Q 4a', heading:'Product rule natural log',
  question:"Find dy/dx for y = x^(2/3) ln x.",
  hint:"💡 Use the product rule; recall d/dx(ln x) = 1/x.",
  steps:[
    {label:'Define u,v', text:"Let u = x^(2/3) and v = ln x."},
    {label:'Differentiate', text:"u' = (2/3)x^(-1/3) and v' = 1/x."},
    {label:'Substitute', text:"dy/dx = (2/3)x^(-1/3) ln x + x^(2/3)(1/x) = (2/3)x^(-1/3) ln x + x^(-1/3)"},
    {label:'Simplify', text:"Factor x^(-1/3): dy/dx = x^(-1/3)[(2/3)ln x + 1]"}],
  answer:"∴ dy/dx = x^(-1/3)[(2/3)ln x + 1], equivalently (2ln x + 3)/(3x^(1/3))" },
{ type:'qa', id:'c4b', navLabel:'C4b', qnum:'Q 4b', heading:'Product rule log function',
  question:"Find dy/dx for y = x⁴ ln x.",
  hint:"💡 Use the product rule with u = x⁴, v = ln x.",
  steps:[
    {label:'Define u,v', text:"Let u = x⁴ and v = ln x."},
    {label:'Differentiate', text:"u' = 4x³ and v' = 1/x."},
    {label:'Substitute', text:"dy/dx = 4x³ ln x + x⁴(1/x) = 4x³ ln x + x³"},
    {label:'Simplify', text:"Factor x³: dy/dx = x³(4ln x + 1)"}],
  answer:"∴ dy/dx = x³(4ln x + 1)" },
{ type:'qa', id:'c5a', navLabel:'C5a', qnum:'Q 5a', heading:'Product and chain rule',
  question:"Find f'(x) for f(x) = x(2x+1)^(1/2).",
  hint:"💡 Product rule for the two factors; chain rule to differentiate (2x+1)^(1/2).",
  steps:[
    {label:'Define u,v', text:"Let u = x and v = (2x+1)^(1/2)."},
    {label:'Differentiate', text:"u' = 1; by the chain rule v' = (1/2)(2x+1)^(-1/2)(2) = (2x+1)^(-1/2)."},
    {label:'Substitute', text:"f'(x) = (2x+1)^(1/2) + x(2x+1)^(-1/2)"},
    {label:'Simplify', text:"Factor (2x+1)^(-1/2): f'(x) = (2x+1)^(-1/2)[(2x+1) + x] = (3x+1)/√(2x+1)"}],
  answer:"∴ f'(x) = (3x+1)/√(2x+1)" },
{ type:'qa', id:'c5b', navLabel:'C5b', qnum:'Q 5b', heading:'Product and chain rule',
  question:"Find f'(x) for f(x) = x²(3x-4)^(3/2).",
  hint:"💡 Product rule for the two factors; chain rule to differentiate (3x-4)^(3/2).",
  steps:[
    {label:'Define u,v', text:"Let u = x² and v = (3x-4)^(3/2)."},
    {label:'Differentiate', text:"u' = 2x; by the chain rule v' = (3/2)(3x-4)^(1/2)(3) = (9/2)(3x-4)^(1/2)."},
    {label:'Substitute', text:"f'(x) = 2x(3x-4)^(3/2) + (9/2)x²(3x-4)^(1/2)"},
    {label:'Simplify', text:"Factor (3x-4)^(1/2): f'(x) = (3x-4)^(1/2)[2x(3x-4) + (9/2)x²] = (3x-4)^(1/2)(10.5x² - 8x)"},
    {label:'Rewrite', text:"10.5x² - 8x = x(21x-16)/2, so f'(x) = [x(21x-16)/2]√(3x-4)"}],
  answer:"∴ f'(x) = x(21x-16)√(3x-4)/2" },
{ type:'qa', id:'c6a', navLabel:'C6a', qnum:'Q 6a', heading:'Product rule with trig',
  question:"Find f'(x) for f(x) = x sin 3x.",
  hint:"💡 Product rule; chain rule for sin 3x.",
  steps:[
    {label:'Define u,v', text:"Let u = x and v = sin 3x."},
    {label:'Differentiate', text:"u' = 1 and v' = 3cos 3x (chain rule)."},
    {label:'Substitute', text:"f'(x) = sin 3x + x(3cos 3x)"}],
  answer:"∴ f'(x) = sin 3x + 3x cos 3x" },
{ type:'qa', id:'c6b', navLabel:'C6b', qnum:'Q 6b', heading:'Product and chain rule trig',
  question:"Find f'(x) for f(x) = x^(3/4) sin 2x.",
  hint:"💡 Product rule with power rule and chain rule.",
  steps:[
    {label:'Define u,v', text:"Let u = x^(3/4) and v = sin 2x."},
    {label:'Differentiate', text:"u' = (3/4)x^(-1/4) and v' = 2cos 2x."},
    {label:'Substitute', text:"f'(x) = (3/4)x^(-1/4) sin 2x + x^(3/4)(2cos 2x)"}],
  answer:"∴ f'(x) = (3/4)x^(-1/4) sin 2x + 2x^(3/4) cos 2x" },
{ type:'qa', id:'c7a', navLabel:'C7a', qnum:'Q 7a', heading:'Product rule phase-shifted cosine',
  question:"Find f'(x) for f(x) = x cos(4x-1).",
  hint:"💡 Product rule; chain rule for cos(4x-1).",
  steps:[
    {label:'Define u,v', text:"Let u = x and v = cos(4x-1)."},
    {label:'Differentiate', text:"u' = 1 and v' = -4sin(4x-1) (chain rule)."},
    {label:'Substitute', text:"f'(x) = cos(4x-1) + x(-4sin(4x-1))"}],
  answer:"∴ f'(x) = cos(4x-1) - 4x sin(4x-1)" },
{ type:'qa', id:'c7b', navLabel:'C7b', qnum:'Q 7b', heading:'Product rule negative power cosine',
  question:"Find f'(x) for f(x) = x⁻¹ cos 5x.",
  hint:"💡 Product rule with u = x⁻¹, v = cos 5x.",
  steps:[
    {label:'Define u,v', text:"Let u = x⁻¹ and v = cos 5x."},
    {label:'Differentiate', text:"u' = -x⁻² and v' = -5sin 5x."},
    {label:'Substitute', text:"f'(x) = -x⁻² cos 5x + x⁻¹(-5sin 5x)"}],
  answer:"∴ f'(x) = -cos 5x/x² - 5sin 5x/x" },
{ type:'qa', id:'c8a', navLabel:'C8a', qnum:'Q 8a', heading:'Product and chain rule exponential',
  question:"Find f'(x) for f(x) = x^(1/2) e^(4x+5).",
  hint:"💡 Product rule; chain rule for e^(4x+5).",
  steps:[
    {label:'Define u,v', text:"Let u = x^(1/2) and v = e^(4x+5)."},
    {label:'Differentiate', text:"u' = (1/2)x^(-1/2) and v' = 4e^(4x+5) (chain rule)."},
    {label:'Substitute', text:"f'(x) = (1/2)x^(-1/2) e^(4x+5) + 4x^(1/2) e^(4x+5)"},
    {label:'Simplify', text:"Combine over 2√x: f'(x) = e^(4x+5)[1/(2√x) + 4√x] = e^(4x+5)(8x+1)/(2√x)"}],
  answer:"∴ f'(x) = (8x+1)e^(4x+5)/(2√x)" },
{ type:'qa', id:'c8b', navLabel:'C8b', qnum:'Q 8b', heading:'Product rule negative power exponential',
  question:"Find f'(x) for f(x) = x⁻² e^(1-x).",
  hint:"💡 Product rule; chain rule for e^(1-x) gives -e^(1-x).",
  steps:[
    {label:'Define u,v', text:"Let u = x⁻² and v = e^(1-x)."},
    {label:'Differentiate', text:"u' = -2x⁻³ and v' = -e^(1-x) (chain rule)."},
    {label:'Substitute', text:"f'(x) = -2x⁻³ e^(1-x) - x⁻² e^(1-x)"},
    {label:'Simplify', text:"Factor -e^(1-x)x⁻³: f'(x) = -e^(1-x)(2 + x)/x³"}],
  answer:"∴ f'(x) = -e^(1-x)(x+2)/x³" },
{ type:'qa', id:'c9a', navLabel:'C9a', qnum:'Q 9a', heading:'Product rule with logarithm',
  question:"Find f'(x) for f(x) = x⁻¹ ln(2x-3).",
  hint:"💡 Product rule; chain rule for ln(2x-3) gives 2/(2x-3).",
  steps:[
    {label:'Define u,v', text:"Let u = x⁻¹ and v = ln(2x-3)."},
    {label:'Differentiate', text:"u' = -x⁻² and v' = 2/(2x-3)."},
    {label:'Substitute', text:"f'(x) = -x⁻² ln(2x-3) + x⁻¹(2/(2x-3))"}],
  answer:"∴ f'(x) = -ln(2x-3)/x² + 2/(x(2x-3))" },
{ type:'qa', id:'c9b', navLabel:'C9b', qnum:'Q 9b', heading:'Product rule with logarithm',
  question:"Find f'(x) for f(x) = x ln(5-x).",
  hint:"💡 Product rule; chain rule for ln(5-x) gives -1/(5-x).",
  steps:[
    {label:'Define u,v', text:"Let u = x and v = ln(5-x)."},
    {label:'Differentiate', text:"u' = 1 and v' = -1/(5-x)."},
    {label:'Substitute', text:"f'(x) = ln(5-x) + x(-1/(5-x))"}],
  answer:"∴ f'(x) = ln(5-x) - x/(5-x)" },
{ type:'qa', id:'c10a', navLabel:'C10a', qnum:'Q 10a', heading:'Quotient rule polynomial',
  question:"Find the derivative of y = x²/(x+2).",
  hint:"💡 Use the quotient rule: dy/dx = (u'v - uv')/v².",
  steps:[
    {label:'Define u,v', text:"Let u = x² and v = x+2."},
    {label:'Differentiate', text:"u' = 2x and v' = 1."},
    {label:'Substitute', text:"dy/dx = [2x(x+2) - x²(1)]/(x+2)² = (x²+4x)/(x+2)²"},
    {label:'Simplify', text:"Factor the numerator: dy/dx = x(x+4)/(x+2)²"}],
  answer:"∴ dy/dx = x(x+4)/(x+2)²" },
{ type:'qa', id:'c10b', navLabel:'C10b', qnum:'Q 10b', heading:'Quotient rule linear functions',
  question:"Find the derivative of y = 3x/(x-4).",
  hint:"💡 Use the quotient rule with u = 3x, v = x-4.",
  steps:[
    {label:'Define u,v', text:"Let u = 3x and v = x-4."},
    {label:'Differentiate', text:"u' = 3 and v' = 1."},
    {label:'Substitute', text:"dy/dx = [3(x-4) - 3x(1)]/(x-4)² = (3x-12-3x)/(x-4)²"}],
  answer:"∴ dy/dx = -12/(x-4)²" },
{ type:'qa', id:'c11a', navLabel:'C11a', qnum:'Q 11a', heading:'Quotient rule with square root',
  question:"Find the derivative of y = (x-2)/√(x+1).",
  hint:"💡 Quotient rule with v = (x+1)^(1/2); chain rule for v'.",
  steps:[
    {label:'Define u,v', text:"Let u = x-2 and v = (x+1)^(1/2)."},
    {label:'Differentiate', text:"u' = 1 and v' = 1/(2√(x+1))."},
    {label:'Substitute', text:"dy/dx = [√(x+1) - (x-2)/(2√(x+1))]/(x+1)"},
    {label:'Simplify numerator', text:"Combine over 2√(x+1): [2(x+1)-(x-2)]/(2√(x+1)) = (x+4)/(2√(x+1))"},
    {label:'Divide by v²', text:"dy/dx = (x+4)/(2√(x+1)·(x+1)) = (x+4)/(2(x+1)^(3/2))"}],
  answer:"∴ dy/dx = (x+4)/(2(x+1)^(3/2))" },
{ type:'qa', id:'c11b', navLabel:'C11b', qnum:'Q 11b', heading:'Quotient rule with power',
  question:"Find the derivative of y = (4-x)/(x-3)².",
  hint:"💡 Quotient rule; chain rule for v = (x-3)².",
  steps:[
    {label:'Define u,v', text:"Let u = 4-x and v = (x-3)²."},
    {label:'Differentiate', text:"u' = -1 and v' = 2(x-3)."},
    {label:'Substitute', text:"dy/dx = [-(x-3)² - (4-x)·2(x-3)]/(x-3)^4"},
    {label:'Simplify', text:"Factor (x-3): [-(x-3) - 2(4-x)]/(x-3)^3 = (x-5)/(x-3)^3"}],
  answer:"∴ dy/dx = (x-5)/(x-3)^3" },
{ type:'qa', id:'c12a', navLabel:'C12a', qnum:'Q 12a', heading:'Quotient rule with exponential',
  question:"Find the derivative of y = e^x/(3x+1)².",
  hint:"💡 Quotient rule; chain rule for v = (3x+1)².",
  steps:[
    {label:'Define u,v', text:"Let u = e^x and v = (3x+1)²."},
    {label:'Differentiate', text:"u' = e^x and v' = 6(3x+1)."},
    {label:'Substitute', text:"dy/dx = [e^x(3x+1)² - 6e^x(3x+1)]/(3x+1)^4"},
    {label:'Simplify', text:"Factor e^x(3x+1): dy/dx = e^x(3x+1)[(3x+1)-6]/(3x+1)^4 = e^x(3x-5)/(3x+1)^3"}],
  answer:"∴ dy/dx = e^x(3x-5)/(3x+1)^3" },
{ type:'qa', id:'c12b', navLabel:'C12b', qnum:'Q 12b', heading:'Quotient rule with exponential',
  question:"Find the derivative of y = e^x/(2x-1)³.",
  hint:"💡 Quotient rule; chain rule for v = (2x-1)³.",
  steps:[
    {label:'Define u,v', text:"Let u = e^x and v = (2x-1)³."},
    {label:'Differentiate', text:"u' = e^x and v' = 6(2x-1)²."},
    {label:'Substitute', text:"dy/dx = [e^x(2x-1)³ - 6e^x(2x-1)²]/(2x-1)^6"},
    {label:'Simplify', text:"Factor e^x(2x-1)²: dy/dx = e^x(2x-1)²[(2x-1)-6]/(2x-1)^6 = e^x(2x-7)/(2x-1)^4"}],
  answer:"∴ dy/dx = e^x(2x-7)/(2x-1)^4" },
{ type:'qa', id:'c13', navLabel:'C13', qnum:'Q 13', heading:'Tangent using quotient rule',
  question:"Find the equation of the tangent to the curve y = sin x/x at x = π/2.",
  hint:"💡 Differentiate with the quotient rule, then use y - y₁ = m(x - x₁).",
  steps:[
    {label:'Differentiate', text:"Let u = sin x, v = x; u' = cos x, v' = 1. dy/dx = (x cos x - sin x)/x²"},
    {label:'Find gradient', text:"At x = π/2: cos(π/2)=0, sin(π/2)=1, so dy/dx = ((π/2)(0)-1)/(π/2)² = -1/(π²/4) = -4/π²"},
    {label:'Find point', text:"y = sin(π/2)/(π/2) = 1/(π/2) = 2/π"},
    {label:'Form tangent', text:"y - 2/π = -4/π²(x - π/2), which expands to y = -4/π² x + 2/π + 2/π"}],
  answer:"∴ y = -(4/π²)x + 4/π" },
{ type:'qa', id:'c14', navLabel:'C14', qnum:'Q 14', heading:'Normal using product rule',
  question:"Find the equation of the normal to the curve y = x cos 2x at x = π/4.",
  hint:"💡 Differentiate with the product rule; normal gradient is the negative reciprocal of the tangent gradient.",
  steps:[
    {label:'Differentiate', text:"Let u = x, v = cos 2x; u' = 1, v' = -2sin 2x. dy/dx = cos 2x - 2x sin 2x"},
    {label:'Find gradient', text:"At x = π/4: cos(π/2)=0, sin(π/2)=1, so dy/dx = 0 - 2(π/4)(1) = -π/2"},
    {label:'Normal gradient', text:"Normal gradient = -1/(-π/2) = 2/π"},
    {label:'Find point & form line', text:"y = (π/4)cos(π/2) = 0. Normal: y - 0 = (2/π)(x - π/4)"}],
  answer:"∴ y = (2/π)x - 1/2" },
{ type:'qa', id:'c15', navLabel:'C15', qnum:'Q 15', heading:'Evaluating a derivative',
  question:"If f(x) = xe^(2x) find f'(3).",
  hint:"💡 Product rule, then substitute x=3.",
  steps:[
    {label:'Differentiate', text:"Let u = x, v = e^(2x); u' = 1, v' = 2e^(2x) (chain rule). f'(x) = e^(2x) + 2xe^(2x) = e^(2x)(1+2x)"},
    {label:'Substitute', text:"f'(3) = e^6(1 + 6)"}],
  answer:"∴ f'(3) = 7e^6" },
{ type:'qa', id:'c16', navLabel:'C16', qnum:'Q 16', heading:'Triple product rule',
  question:"Differentiate xe^x ln x.",
  hint:"💡 Extend the product rule to three factors: (uvw)' = u'vw + uv'w + uvw'.",
  steps:[
    {label:'Define u,v,w', text:"Let u = x, v = e^x, w = ln x."},
    {label:'Differentiate', text:"u' = 1, v' = e^x, w' = 1/x."},
    {label:'Substitute', text:"f'(x) = (1)e^x ln x + x(e^x)ln x + xe^x(1/x) = e^x ln x + xe^x ln x + e^x"},
    {label:'Simplify', text:"Factor e^x: f'(x) = e^x[1 + (1+x)ln x]"}],
  answer:"∴ f'(x) = e^x[1 + (1+x)ln x]" },
{ type:'qa', id:'c17', navLabel:'C17', qnum:'Q 17', heading:'Chain rule with product',
  question:"Differentiate e^(x sin x).",
  hint:"💡 Chain rule on the outer exponential; the inner exponent needs the product rule.",
  steps:[
    {label:'Identify inner function', text:"Let g(x) = x sin x, so f(x) = e^(g(x))."},
    {label:'Differentiate inner', text:"By the product rule: g'(x) = sin x + x cos x"},
    {label:'Apply chain rule', text:"f'(x) = g'(x)e^(g(x)) = (sin x + x cos x)e^(x sin x)"}],
  answer:"∴ f'(x) = (sin x + x cos x)e^(x sin x)" },
{ type:'qa', id:'c18', navLabel:'C18', qnum:'Q 18', heading:'Solving for given gradient',
  question:"Find the point on the curve y = e^(3x) - 11x where the tangent has gradient 13.",
  hint:"💡 Differentiate, set dy/dx = 13, then solve for x using logarithms.",
  steps:[
    {label:'Differentiate', text:"dy/dx = 3e^(3x) - 11"},
    {label:'Set equal to 13', text:"3e^(3x) - 11 = 13 → 3e^(3x) = 24 → e^(3x) = 8"},
    {label:'Solve for x', text:"3x = ln 8 = ln(2³) = 3ln 2, so x = ln 2"},
    {label:'Find y', text:"y = e^(3ln2) - 11ln2 = e^(ln8) - 11ln2 = 8 - 11ln2"}],
  answer:"∴ the point is (ln 2, 8 - 11ln 2)" },
{ type:'qa', id:'c19', navLabel:'C19', qnum:'Q 19', heading:'Stationary point exponential curve',
  question:"Find the coordinates of the points on the curve y = xe^(-x) where the gradient is zero.",
  hint:"💡 Product rule, then set dy/dx = 0 and factor.",
  steps:[
    {label:'Differentiate', text:"Let u = x, v = e^(-x); u' = 1, v' = -e^(-x). dy/dx = e^(-x) - xe^(-x) = e^(-x)(1-x)"},
    {label:'Set equal to 0', text:"Since e^(-x) > 0 for all x, we need 1 - x = 0, so x = 1"},
    {label:'Find y', text:"y = (1)e^(-1) = 1/e"}],
  answer:"∴ the point is (1, 1/e)" },
{ type:'qa', id:'c20', navLabel:'C20', qnum:'Q 20', heading:'Solving for given gradient',
  question:"Find the coordinates of the points on the curve y = x ln x where the gradient is 2.",
  hint:"💡 Product rule, then set dy/dx = 2 and solve using exponentials.",
  steps:[
    {label:'Differentiate', text:"Let u = x, v = ln x; u' = 1, v' = 1/x. dy/dx = ln x + 1"},
    {label:'Set equal to 2', text:"ln x + 1 = 2 → ln x = 1 → x = e"},
    {label:'Find y', text:"y = e·ln e = e(1) = e"}],
  answer:"∴ the point is (e, e)" },
{ type:'qa', id:'c21', navLabel:'C21', qnum:'Q 21', heading:'Quotient rule with constant',
  question:"Find and simplify an expression for the derivative of f(x) = x/√(k+x²) where x is a positive constant.",
  hint:"💡 Here k is the constant being held fixed; write f(x) = x(k+x²)^(-1/2) and use the product/chain rule.",
  steps:[
    {label:'Rewrite', text:"f(x) = x(k+x²)^(-1/2)"},
    {label:'Define u,v', text:"Let u = x and v = (k+x²)^(-1/2)."},
    {label:'Differentiate', text:"u' = 1; by the chain rule v' = -(1/2)(k+x²)^(-3/2)(2x) = -x(k+x²)^(-3/2)"},
    {label:'Substitute & simplify', text:"f'(x) = (k+x²)^(-1/2) - x²(k+x²)^(-3/2) = (k+x²)^(-3/2)[(k+x²) - x²] = k(k+x²)^(-3/2)"}],
  answer:"∴ f'(x) = k/(k+x²)^(3/2)" },
{ type:'qa', id:'c22', navLabel:'C22', qnum:'Q 22', heading:'Show that derivative form',
  question:"If f(x) = x√(2+x) show that f'(x) = (ax+b)/(2√(2+x)) where a and b are integers to be found.",
  hint:"💡 Product rule with v = (2+x)^(1/2), then combine into a single fraction.",
  steps:[
    {label:'Define u,v', text:"Let u = x and v = (2+x)^(1/2)."},
    {label:'Differentiate', text:"u' = 1 and v' = (1/2)(2+x)^(-1/2)."},
    {label:'Substitute', text:"f'(x) = (2+x)^(1/2) + x(1/2)(2+x)^(-1/2)"},
    {label:'Simplify', text:"Factor (2+x)^(-1/2): f'(x) = (2+x)^(-1/2)[(2+x) + x/2] = (4+2x+x)/(2√(2+x)) = (3x+4)/(2√(2+x))"}],
  answer:"∴ f'(x) = (3x+4)/(2√(2+x)), so a = 3 and b = 4" },
{ type:'qa', id:'c23', navLabel:'C23', qnum:'Q 23', heading:'Increasing function proof',
  question:"Show that f(x) = x²/(1+x) is an increasing function if x > a or if x < b where a and b are constants to be determined.",
  hint:"💡 Differentiate with the quotient rule, then analyse the sign of f'(x).",
  steps:[
    {label:'Differentiate', text:"Let u = x², v = 1+x; u' = 2x, v' = 1. f'(x) = [2x(1+x) - x²]/(1+x)² = (x²+2x)/(1+x)² = x(x+2)/(1+x)²"},
    {label:'Analyse sign', text:"(1+x)² > 0 for all x ≠ -1, so the sign of f'(x) matches the sign of x(x+2)"},
    {label:'Solve inequality', text:"x(x+2) is an upward parabola with roots at x=0 and x=-2, so x(x+2) > 0 when x > 0 or x < -2"},
    {label:'Conclude', text:"Hence f'(x) > 0 (f is increasing) when x > 0 or x < -2"}],
  answer:"∴ f is increasing for x > 0 or x < -2, so a = 0 and b = -2" },
{ type:'qa', id:'c24a', navLabel:'C24a', qnum:'Q 24a', heading:'Modelling population growth rate',
  question:"The population of rabbits on an island, P thousands, n years after they were introduced is modelled by P = 4/(1+3e^(-n)). Find an expression for the population growth rate, dP/dn, and explain why this predicts that the population is always growing.",
  hint:"💡 Use the quotient rule, then argue about the sign of the result.",
  steps:[
    {label:'Define u,v', text:"Let u = 4 and v = 1+3e^(-n); u' = 0, v' = -3e^(-n)."},
    {label:'Apply quotient rule', text:"dP/dn = [0·v - 4(-3e^(-n))]/v² = 12e^(-n)/(1+3e^(-n))²"},
    {label:'Analyse sign', text:"e^(-n) > 0 for every real n, and (1+3e^(-n))² > 0 for every n, so dP/dn > 0 for all n"},
    {label:'Interpret', text:"Since the growth rate is always strictly positive, P is always increasing, so the population is predicted to always be growing"}],
  answer:"∴ dP/dn = 12e^(-n)/(1+3e^(-n))², which is always positive, so P is always increasing" },
{ type:'qa', id:'c24b', navLabel:'C24b', qnum:'Q 24b', heading:'Initial value and rate',
  question:"Find (i) the initial population and (ii) the initial population growth rate.",
  hint:"💡 Substitute n = 0 into P and into dP/dn from part a.",
  steps:[
    {label:'Initial population', text:"P(0) = 4/(1+3e^0) = 4/(1+3) = 4/4 = 1"},
    {label:'Initial growth rate', text:"dP/dn at n=0: 12e^0/(1+3e^0)² = 12/4² = 12/16 = 3/4"},
    {label:'State units', text:"P is measured in thousands, so the population starts at 1000 rabbits, growing at 0.75 thousand (750) rabbits per year"}],
  answer:"∴ (i) initial population = 1 thousand (1000 rabbits); (ii) initial growth rate = 3/4 thousand per year (750 rabbits/year)" },
{ type:'qa', id:'c24c', navLabel:'C24c', qnum:'Q 24c', heading:'Long-term limiting value',
  question:"What is the value of P as n gets very large?",
  hint:"💡 Consider what happens to e^(-n) as n → ∞.",
  steps:[
    {label:'Consider limit', text:"As n → ∞, e^(-n) → 0"},
    {label:'Substitute', text:"P → 4/(1+3(0)) = 4/1 = 4"},
    {label:'Interpret', text:"The population approaches a long-term limit (carrying capacity) of 4 thousand rabbits"}],
  answer:"∴ P → 4 (thousand rabbits) as n → ∞" },
{ type:'qa', id:'c24d', navLabel:'C24d', qnum:'Q 24d', heading:'Sketching logistic growth',
  question:"Hence sketch the population as a function of time.",
  hint:"💡 Combine the starting value, the always-increasing property, and the horizontal asymptote.",
  steps:[
    {label:'Starting point', text:"The curve passes through (0, 1), from part b"},
    {label:'Shape', text:"Since dP/dn > 0 for all n, the curve is always rising - an S-shaped (logistic) curve, steep near n=0 then flattening"},
    {label:'Asymptote', text:"As n → ∞, P → 4, so the curve approaches (but never reaches) the horizontal asymptote P = 4"},
    {label:'Describe graph', text:"The graph starts at P=1 when n=0, rises through an inflection point, then curves and levels off toward the line P=4"}],
  answer:"∴ An increasing S-shaped (logistic) curve from (0,1), approaching the horizontal asymptote P=4 as n → ∞" },
{ type:'qa', id:'c25a', navLabel:'C25a', qnum:'Q 25a', heading:'Proving an exponential identity',
  question:"Show that if x > 0 then x^x = e^(x ln x).",
  hint:"💡 Use the defining property that x = e^(ln x) for x > 0.",
  steps:[
    {label:'Use definition of ln', text:"Since x > 0, x = e^(ln x) (the defining property of the natural logarithm as the inverse of e^x)"},
    {label:'Raise to power x', text:"x^x = (e^(ln x))^x"},
    {label:'Apply exponent rule', text:"Using (e^a)^b = e^(ab): (e^(ln x))^x = e^(x ln x)"},
    {label:'Conclude', text:"Therefore x^x = e^(x ln x) for all x > 0"}],
  answer:"∴ x^x = e^(x ln x) for x > 0, as required" },
{ type:'qa', id:'c25b', navLabel:'C25b', qnum:'Q 25b', heading:'Tangent to x^x',
  question:"Hence find the equation of the tangent to the curve y = x^x at x = 1.",
  hint:"💡 Write y = e^(x ln x) and use the chain rule, with the product rule for the inner derivative.",
  steps:[
    {label:'Rewrite using part a', text:"y = x^x = e^(x ln x)"},
    {label:'Differentiate', text:"By the product rule, d/dx(x ln x) = ln x + 1. By the chain rule: dy/dx = e^(x ln x)(ln x + 1) = x^x(ln x + 1)"},
    {label:'Evaluate at x=1', text:"y(1) = 1^1 = 1; dy/dx at x=1 = 1^1(ln1 + 1) = 1(0+1) = 1"},
    {label:'Form tangent', text:"y - 1 = 1(x - 1)"}],
  answer:"∴ the tangent at x = 1 is y = x" },

{ type:'divider', id:'div-20d', navLabel:'20D', symbol:'D', bigNum:'20D', heading:'The Second Derivative', sub:"Differentiating twice — measuring how the gradient itself is changing" },
{ type:'example', id:'we2014', navLabel:'WE 20.14', badge:'Worked Example 20.14', heading:'Evaluating a Second Derivative', question:"If f(x) = x³ + 3x, find f''(2).", hints:["First find f'(x) by differentiating f(x) once: f'(x) = 3x² + 3.", "Then differentiate again to find the second derivative: f''(x) = 6x.", "Now substitute x = 2 into f''(x): f''(2) = 6(2) = 12."] },
{ type:'example', id:'we2015', navLabel:'WE 20.15', badge:'Worked Example 20.15', heading:'Sketching a Second Derivative Graph', question:"The graph of y = f'(x) is a curve that decreases and then increases, with a minimum turning point at B. A point A lies further back on the decreasing branch, and a point C lies further along the increasing branch. By thinking about the gradient of this curve at each point, describe and sketch the shape of the graph of y = f''(x).", hints:["The second derivative f''(x) is just the gradient function of f'(x) — so sketch it using the same point-by-point reasoning as for sketching any derivative graph, but applied to the curve y = f'(x) instead of y = f(x).", "Between A and B: the curve y = f'(x) is decreasing, but more and more slowly as it flattens out near B — so its gradient is negative but increasing towards zero. This means f''(x) is negative on this section.", "At B: the curve y = f'(x) has a horizontal tangent (its minimum turning point), so its gradient is zero there — f''(B) = 0.", "Between B and C: the curve y = f'(x) is increasing, faster and faster — so its gradient is positive and increasing. This means f''(x) is positive on this section.", "Putting it together: the graph of y = f''(x) crosses the x-axis at B, is negative under the A side and positive under the C side, forming a roughly straight, increasing line through B."] },
{ type:'keypoint', id:'kp209', navLabel:'KP 20.9', badge:'Key Point 20.9', heading:'Concave-up and Concave-down', formula:"A function f(x) is concave-up where f''(x) is positive, and concave-down where f''(x) is negative.", notes:["Concave-up sections curve like the inside of a bowl (∪-shaped); concave-down sections curve like the outside of a dome (∩-shaped).", "A curve does not need a turning point to be described this way — any small section of a graph is either concave-up or concave-down."] },
{ type:'example', id:'we2016', navLabel:'WE 20.16', badge:'Worked Example 20.16', heading:'Describing Sections of a Graph', question:"The graph of y = f(x) passes through the following key points from left to right: it falls steeply through a point A, reaches a local minimum at B, rises through C, keeps rising gently to a local maximum at D, falls through E, continues falling to a local minimum at F, then rises steeply through G. Using one or more of the words 'increasing', 'decreasing', 'concave-up', 'concave-down', describe the sections: (a) A to B, (b) C to E, (c) F to G.", hints:["(a) A to B: the curve falls all the way down to the local minimum at B. Since B is a minimum turning point, the curve bends upwards throughout — it is decreasing and concave-up.", "(b) C to E: the curve rises from C to a local maximum at D, then falls from D to E. Although the curve changes from increasing to decreasing partway through (at D), the whole arch-shaped section bends the same way throughout, because D is a maximum turning point — so C to E is concave-down. Notice that a single word like 'increasing' or 'decreasing' cannot describe the whole section, since the curve does both, but the concavity stays the same across it.", "(c) F to G: the curve rises all the way from the local minimum at F, increasingly steeply. Since F is a minimum turning point, the curve bends upwards throughout — it is increasing and concave-up.", "So the answers are: (a) Decreasing, concave-up. (b) Concave-down. (c) Increasing, concave-up."] },
{ type:'example', id:'we2017', navLabel:'WE 20.17', badge:'Worked Example 20.17', heading:'Finding Where a Function is Concave-Down', question:"Find the values of x for which the function f(x) = x⁴ + 2x³ − 36x² + 5x − 4 is concave-down.", hints:["Find the first derivative: f'(x) = 4x³ + 6x² − 72x + 5.", "Differentiate again to find the second derivative: f''(x) = 12x² + 12x − 72.", "For the function to be concave-down, we need f''(x) < 0: 12x² + 12x − 72 < 0.", "Divide every term by 12: x² + x − 6 < 0.", "Factorise the quadratic: (x + 3)(x − 2) < 0.", "This is an upward-opening parabola in x, so x² + x − 6 is negative between its roots x = −3 and x = 2.", "So f(x) is concave-down for −3 < x < 2."] },

{ type:'divider', id:'div-ex20d', navLabel:'─', symbol:'D', bigNum:'Ex 20D', heading:'Exercise 20D — Full Solutions', sub:'Q1–24' },
{ type:'qa', id:'d1a', navLabel:'D1a', qnum:'Q 1a', heading:"Second derivative of a quadratic",
  question:"Evaluate the second derivative of the function f(x) = 5x² + 2x + 1.",
  hint:"💡 Differentiate twice in a row: find f'(x) first, then differentiate f'(x) to get f''(x).",
  steps:[{label:'Differentiate once', text:"f(x) = 5x² + 2x + 1, so f'(x) = 10x + 2"}, {label:'Differentiate again', text:"f''(x) = 10"}],
  answer:"∴ f''(x) = 10" },
{ type:'qa', id:'d1b', navLabel:'D1b', qnum:'Q 1b', heading:"Second derivative of a quadratic",
  question:"Evaluate the second derivative of the function f(x) = 6x² + 3x + 5.",
  hint:"💡 Differentiate twice in a row: find f'(x) first, then differentiate f'(x) to get f''(x).",
  steps:[{label:'Differentiate once', text:"f(x) = 6x² + 3x + 5, so f'(x) = 12x + 3"}, {label:'Differentiate again', text:"f''(x) = 12"}],

{ type:'qa', id:'d2a', navLabel:'D2a', qnum:'Q 2a', heading:"Second derivative of a cubic",
  question:"Evaluate the second derivative of the function f(x) = 5x³ + x² + 3x + 7.",
  hint:"💡 Apply the power rule twice; each term's power drops by 1 each time you differentiate.",

{ type:'qa', id:'d2b', navLabel:'D2b', qnum:'Q 2b', heading:"Second derivative of a cubic",
  question:"Evaluate the second derivative of the function f(x) = x³ − 2x² + 4x + 11.",
  hint:"💡 Apply the power rule twice; each term's power drops by 1 each time you differentiate.",
