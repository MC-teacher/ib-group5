<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 20 · Differentiation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN: Academic editorial — dark navy base with warm
   cream cards, gold accents, serif type, mathematical
   precision in the layout.
═══════════════════════════════════════════════════════ */
:root {
  --navy:    #131d30;
  --navy2:   #1b2a47;
  --teal:    #1a6b3c;
  --teal2:   #27a25a;
  --gold:    #e8a020;
  --gold2:   #f4bb50;
  --cream:   #f5f0e8;
  --cream2:  #ede7d9;
  --white:   #ffffff;
  --dark:    #1a1a1a;
  --grey:    #5a6470;
  --red:     #c0392b;
  --green:   #1a7a4a;
  --slide-w: 860px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--navy);
  color: var(--cream);
  font-family: 'Source Serif 4', Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── TOP NAV ──────────────────────────────────────── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(19,29,48,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(232,160,32,0.25);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 52px;
}
.nav-brand {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--gold); letter-spacing: 0.03em;
}
.nav-pills {
  display: flex; gap: 0.4rem; list-style: none; overflow-x: auto;
  scrollbar-width: none;
}
.nav-pills::-webkit-scrollbar { display: none; }
.nav-pills a {
  display: block; padding: 0.3rem 0.75rem;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; font-weight: 600;
  color: rgba(245,240,232,0.65);
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
}
.nav-pills a:hover, .nav-pills a.active {
  background: var(--teal); color: var(--white);
}

/* ─── SLIDE STREAM ─────────────────────────────────── */
main {
  padding-top: 68px;
  display: flex; flex-direction: column; align-items: center;
  gap: 0;
}

/* each "slide" */
.slide {
  width: 100%; max-width: var(--slide-w);
  margin: 0.6rem 1.2rem;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  opacity: 0; transform: translateY(24px);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.slide.visible { opacity: 1; transform: none; }

/* ─── SLIDE TYPES ───────────────────────────────────── */

/* TITLE */
.s-title {
  background: var(--navy2);
  border: 1px solid rgba(232,160,32,0.3);
  padding: 3rem 3.5rem 2.5rem;
  position: relative;
}
.s-title::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--teal), var(--gold));
}
.chapter-badge {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem; font-weight: 900; color: var(--white);
  margin-bottom: 1.2rem;
}
.s-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900; color: var(--white);
  line-height: 1.1; margin-bottom: 0.4rem;
}
.s-title .subtitle {
  font-size: 1.15rem; font-style: italic;
  color: var(--gold); margin-bottom: 1.8rem;
}
.learning-goals { list-style: none; display: grid; gap: 0.5rem; }
.learning-goals li {
  display: flex; align-items: flex-start; gap: 0.6rem;
  font-size: 0.92rem; color: rgba(245,240,232,0.8);
}
.learning-goals li::before {
  content: '→'; color: var(--teal2); font-weight: 700;
  flex-shrink: 0; margin-top: 0.05rem;
}

/* SECTION DIVIDER */
.s-divider {
  background: var(--teal);
  padding: 2.2rem 3rem;
  display: flex; align-items: center; gap: 2rem;
  position: relative; overflow: hidden;
}
.s-divider::after {
  content: attr(data-symbol);
  position: absolute; right: 2rem; top: 50%;
  transform: translateY(-50%);
  font-family: 'Playfair Display', serif;
  font-size: 7rem; font-weight: 900;
  color: rgba(255,255,255,0.08); line-height: 1;
  pointer-events: none;
}
.divider-num {
  font-family: 'Playfair Display', serif;
  font-size: 4rem; font-weight: 900;
  color: rgba(255,255,255,0.2);
  line-height: 1; flex-shrink: 0;
}
.s-divider h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem; font-weight: 700; color: var(--white);
}
.s-divider p { font-size: 0.9rem; color: rgba(255,255,255,0.75); margin-top: 0.3rem; }

/* KEY POINT */
.s-keypoint {
  background: var(--cream);
  color: var(--dark);
  padding: 0;
}
.kp-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 1rem;
}
.kp-badge {
  background: var(--gold);
  color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; font-weight: 600;
  padding: 0.25rem 0.6rem; border-radius: 4px;
  white-space: nowrap;
}
.kp-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700; color: var(--white);
}
.kp-body { padding: 1.4rem 1.8rem; }
.formula-box {
  background: var(--navy2);
  border-left: 4px solid var(--teal);
  border-radius: 8px;
  padding: 1.1rem 1.5rem;
  margin-bottom: 1.2rem;
  text-align: center;
}
.formula-box .formula {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  font-weight: 600; color: var(--white);
}
.formula-box .formula-alt {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1rem; color: var(--gold2);
  margin-top: 0.4rem;
}
.note-list { list-style: none; display: grid; gap: 0.55rem; }
.note-list li {
  display: flex; align-items: flex-start; gap: 0.7rem;
  font-size: 0.9rem; color: var(--dark);
}
.note-list li::before {
  content: '▸'; color: var(--teal); font-size: 0.75rem;
  flex-shrink: 0; margin-top: 0.2rem;
}

/* TWO COLUMN */
.s-two-col {
  background: var(--cream);
  color: var(--dark);
  padding: 0;
}
.two-col-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
}
.two-col-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700; color: var(--white);
}
.two-col-body {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0; min-height: 240px;
}
.col-card {
  padding: 1.2rem 1.4rem;
}
.col-card:first-child { border-right: 1px solid var(--cream2); }
.col-card h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; font-weight: 600;
  color: var(--teal); text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.8rem; padding-bottom: 0.4rem;
  border-bottom: 2px solid var(--teal);
}
.col-card .col-content {
  font-size: 0.88rem; line-height: 1.7; color: var(--dark);
}
.col-card .col-content strong { color: var(--teal); }

/* WORKED EXAMPLE */
.s-example {
  background: var(--cream);
  color: var(--dark);
  padding: 0;
}
.ex-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 1rem;
}
.ex-badge {
  background: var(--teal);
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; font-weight: 600;
  padding: 0.25rem 0.65rem; border-radius: 4px;
  white-space: nowrap;
}
.ex-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.ex-body { padding: 1.4rem 1.8rem; }
.question-box {
  background: var(--white);
  border: 1px solid var(--cream2);
  border-left: 4px solid var(--teal);
  border-radius: 6px;
  padding: 1rem 1.2rem;
  margin-bottom: 1.2rem;
}
.question-box .q-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  color: var(--teal); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.4rem;
}
.question-box .q-text {
  font-size: 0.95rem; line-height: 1.65; color: var(--dark);
}
.hints-section h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  color: var(--gold); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.6rem;
}
.hint-list { list-style: none; display: grid; gap: 0.4rem; }
.hint-list li {
  display: flex; gap: 0.6rem;
  font-size: 0.88rem; color: var(--dark);
}
.hint-num {
  background: var(--teal);
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; font-weight: 600;
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 0.1rem;
}

/* BE THE EXAMINER — question only */
.s-examiner-q {
  background: var(--cream); color: var(--dark); padding: 0;
}
.examiner-q-header {
  background: #4a2040;
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 0.8rem;
}
.examiner-q-header .ex-q-badge {
  background: var(--gold); color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 700;
  padding: 0.2rem 0.6rem; border-radius: 4px;
}
.examiner-q-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.examiner-q-body { padding: 1.4rem 1.8rem; }
.challenge-box {
  background: var(--white); border: 1px solid var(--cream2);
  border-left: 4px solid #4a2040;
  border-radius: 6px; padding: 1rem 1.2rem; margin-bottom: 1.2rem;
}
.challenge-box .q-text { font-size: 0.95rem; line-height: 1.65; }
.task-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; font-weight: 600;
  color: #4a2040; font-style: italic;
  margin-top: 0.5rem;
}
/* think-time note */
.think-note {
  background: rgba(74,32,64,0.08);
  border: 1px dashed rgba(74,32,64,0.3);
  border-radius: 6px; padding: 0.7rem 1rem;
  font-size: 0.85rem; color: #4a2040; font-style: italic;
  display: flex; align-items: center; gap: 0.5rem;
}

/* BE THE EXAMINER — with solutions */
.s-examiner {
  background: var(--cream); color: var(--dark); padding: 0;
}
.examiner-header {
  background: #4a2040;
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 0.8rem;
}
.examiner-header .ex-badge-purple {
  background: var(--gold); color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 700;
  padding: 0.2rem 0.6rem; border-radius: 4px;
}
.examiner-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.examiner-body { padding: 1.4rem 1.8rem; }
.solutions-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 0.8rem; margin-top: 1rem;
}
.sol-card {
  border-radius: 8px; overflow: hidden;
  border: 1px solid var(--cream2);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.sol-card-header {
  padding: 0.5rem 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; font-weight: 700; color: var(--white);
}
.sol-card-body {
  background: var(--white);
  padding: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem; line-height: 1.7; color: var(--dark);
}
.sol-navy .sol-card-header  { background: var(--navy2); }
.sol-red   .sol-card-header { background: var(--red); }
.sol-green .sol-card-header { background: var(--green); }
.examiner-note {
  margin-top: 1rem;
  font-size: 0.82rem; color: var(--teal);
  font-style: italic;
}

/* EXERCISE SET */
.s-exercise {
  background: var(--cream); color: var(--dark); padding: 0;
}
.ex-set-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; justify-content: space-between;
}
.ex-set-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.ex-set-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  color: var(--gold); background: rgba(232,160,32,0.15);
  padding: 0.2rem 0.6rem; border-radius: 4px;
}
.ex-set-body { padding: 1.2rem 1.4rem; }
.problems-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
}
.prob-card {
  background: var(--white);
  border: 1px solid var(--cream2);
  border-left: 3px solid var(--gold);
  border-radius: 6px; padding: 0.8rem 1rem;
}
.prob-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 700;
  color: var(--teal); margin-bottom: 0.3rem;
}
.prob-q { font-size: 0.88rem; line-height: 1.55; color: var(--dark); }

/* SUMMARY */
.s-summary {
  background: var(--navy2);
  border: 1px solid rgba(232,160,32,0.25);
  padding: 2rem 2.5rem;
}
.s-summary h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem; font-weight: 700; color: var(--white);
  margin-bottom: 1.4rem;
}
.summary-table {
  width: 100%; border-collapse: collapse;
  font-size: 0.88rem;
}
.summary-table th {
  text-align: left; padding: 0.6rem 0.9rem;
  background: rgba(255,255,255,0.05);
  color: var(--gold); font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
  border-bottom: 1px solid rgba(232,160,32,0.3);
}
.summary-table td {
  padding: 0.6rem 0.9rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  color: var(--cream); vertical-align: middle;
}
.summary-table td:nth-child(2) {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem; color: var(--gold2);
}
.summary-table tr:last-child td { border-bottom: none; }
.summary-note {
  margin-top: 1.2rem; padding: 0.75rem 1rem;
  background: rgba(13,115,119,0.2);
  border-left: 3px solid var(--teal2);
  border-radius: 4px;
  font-size: 0.82rem; color: var(--cream); font-style: italic;
}

/* ─── Q&A SLIDE (Question → Solution) ──────────────── */
.s-qa {
  background: var(--cream); color: var(--dark); padding: 0;
}
.qa-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 0.8rem;
}
.qa-qnum {
  background: var(--gold);
  color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; font-weight: 700;
  padding: 0.22rem 0.65rem; border-radius: 4px;
  white-space: nowrap;
}
.qa-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.qa-body { padding: 1.2rem 1.8rem 1.4rem; }

/* question panel */
.qa-question {
  background: var(--white);
  border: 1px solid var(--cream2);
  border-left: 4px solid var(--teal);
  border-radius: 6px;
  padding: 0.9rem 1.1rem;
  margin-bottom: 1rem;
}
.qa-qlabel {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem; font-weight: 600;
  color: var(--teal); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.35rem;
}
.qa-qtext { font-size: 0.93rem; line-height: 1.65; }

/* hint strip */
.qa-hint {
  background: rgba(13,115,119,0.08);
  border: 1px dashed rgba(13,115,119,0.35);
  border-radius: 5px;
  padding: 0.55rem 0.9rem;
  font-size: 0.82rem; color: var(--teal);
  font-style: italic; margin-bottom: 1rem;
  display: flex; align-items: flex-start; gap: 0.5rem;
}

/* solution panel — revealed on click */
.qa-solution {
  border-radius: 8px; overflow: hidden;
  border: 1px solid var(--cream2);
}
.qa-sol-toggle {
  width: 100%;
  background: var(--navy2);
  color: var(--white);
  border: none; cursor: pointer;
  padding: 0.7rem 1.1rem;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; font-weight: 600;
  letter-spacing: 0.04em;
  transition: background 0.2s;
}
.qa-sol-toggle:hover { background: var(--teal); }
.qa-sol-arrow {
  transition: transform 0.3s;
  font-size: 0.9rem;
}
.qa-sol-toggle.open .qa-sol-arrow { transform: rotate(180deg); }
.qa-sol-body {
  background: var(--white);
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s ease;
}
.qa-sol-body.open { max-height: 600px; }
.qa-sol-inner { padding: 1rem 1.1rem; }

/* step rows */
.sol-steps { display: grid; gap: 0.6rem; }
.sol-step {
  display: flex; align-items: flex-start; gap: 0.75rem;
}
.step-badge {
  background: var(--teal);
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; font-weight: 700;
  padding: 0.18rem 0.5rem; border-radius: 3px;
  white-space: nowrap; flex-shrink: 0;
  margin-top: 0.15rem;
}
.step-content { font-size: 0.88rem; line-height: 1.6; color: var(--dark); }
.step-content .math {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem; color: var(--navy2);
  background: var(--cream); padding: 0.1rem 0.35rem;
  border-radius: 3px;
}
.sol-answer {
  margin-top: 0.85rem;
  padding: 0.6rem 0.9rem;
  background: var(--navy2);
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88rem; color: var(--gold2);
  font-weight: 600;
}

/* ─── PROGRESS BAR ─────────────────────────────────── */
.progress-bar {
  position: fixed; top: 52px; left: 0; right: 0;
  height: 3px; background: rgba(255,255,255,0.08); z-index: 99;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--gold));
  width: 0%; transition: width 0.3s;
}

/* ─── SLIDE COUNTER ────────────────────────────────── */
.slide-counter {
  position: fixed; bottom: 1.2rem; right: 1.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; color: rgba(245,240,232,0.4);
}

/* ─── FOOTER ───────────────────────────────────────── */
footer {
  max-width: var(--slide-w); width: 100%; margin: 1rem 0 2rem;
  padding: 1rem 1.5rem;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; color: rgba(245,240,232,0.3);
}

/* ─── RESPONSIVE ───────────────────────────────────── */
@media (max-width: 640px) {
  .two-col-body { grid-template-columns: 1fr; }
  .col-card:first-child { border-right: none; border-bottom: 1px solid var(--cream2); }
  .solutions-grid { grid-template-columns: 1fr; }
  .problems-grid  { grid-template-columns: 1fr; }
  .s-title, .s-divider { padding: 2rem 1.5rem; }
  .kp-body, .ex-body, .examiner-body, .examiner-q-body, .ex-set-body { padding: 1rem 1.2rem; }
  .nav-pills { display: none; }
}
</style>
</head>
<body>
<nav>
  <span class="nav-brand">20A&ndash;20F &nbsp;&middot;&nbsp; Differentiation</span>
  <ul class="nav-pills" id="navPills"></ul>
</nav>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<main id="slideStream"></main>
<footer>IB Mathematics AA SL &nbsp;&middot;&nbsp; Analysis &amp; Approaches &nbsp;&middot;&nbsp; Chapter 20: Differentiation</footer>

<script>

{ type:'keypoint', id:'kp201', navLabel:'KP 20.1', badge:'Key Point 20.1', heading:'Key Point 20.1', formula:"If f(x) = xⁿ, where n ∈ ℚ, then f'(x) = nxⁿ⁻¹", notes:["This is the same power rule you already know for integer powers of x — it now applies for any rational exponent n, positive or negative, whole or fractional.", "Roots must first be rewritten as fractional powers (e.g. √x = x^(1/2), ∛x = x^(1/3)) before the rule can be applied.", "Terms in a denominator can be rewritten with negative exponents (e.g. 1/x² = x⁻²) so the rule applies to those too."] },
{ type:'example', id:'we201', navLabel:'WE 20.1', badge:'Worked Example 20.1', heading:'Worked Example 20.1 — Differentiating a Cube Root', question:"Find f'(x) for f(x) = ∛x.", hints:["Write f(x) in the form xⁿ: f(x) = ∛x = x^(1/3)", "Use f'(x) = nxⁿ⁻¹ with n = 1/3: f'(x) = (1/3)x^(1/3 - 1) = (1/3)x^(-2/3)"] },
{ type:'example', id:'we202', navLabel:'WE 20.2', badge:'Worked Example 20.2', heading:'Worked Example 20.2 — Rewriting Before Differentiating', question:"Find dy/dx for y = (3x² - 4)/√x.", hints:["Use the laws of exponents to write the expression in the form axⁿ + bxᵐ: y = 3x²/x^(1/2) - 4/x^(1/2) = 3x^(3/2) - 4x^(-1/2)", "Differentiate term by term: dy/dx = 3 × (3/2)x^(1/2) - 4 × (-1/2)x^(-3/2)", "Simplify: dy/dx = (9/2)x^(1/2) + 2x^(-3/2)"] },
{ type:'keypoint', id:'kp202', navLabel:'KP 20.2', badge:'Key Point 20.2', heading:'Key Point 20.2', formula:"If f(x) = sin x, then f'(x) = cos x", notes:["This result only holds when x is measured in radians.", "It extends to multiples and sums of terms, so an expression like 2 sin x can be differentiated term by term."] },
{ type:'keypoint', id:'kp203', navLabel:'KP 20.3', badge:'Key Point 20.3', heading:'Key Point 20.3', formula:"If f(x) = cos x, then f'(x) = -sin x", notes:["Again, this result requires x to be measured in radians.", "Notice the sign change: differentiating cosine introduces a negative sign, unlike differentiating sine."] },
{ type:'example', id:'we203', navLabel:'WE 20.3', badge:'Worked Example 20.3', heading:'Worked Example 20.3 — Differentiating Trig Sums', question:"Differentiate f(x) = 2 sin x - 5 cos x.", hints:["Differentiate term by term, using f'(sin x) = cos x and f'(cos x) = -sin x: f'(x) = 2 cos x - 5(-sin x)", "Simplify: f'(x) = 2 cos x + 5 sin x"] },
{ type:'keypoint', id:'kp204', navLabel:'KP 20.4', badge:'Key Point 20.4', heading:'Key Point 20.4', formula:"If f(x) = eˣ, then f'(x) = eˣ", notes:["The exponential function eˣ has the remarkable property that it is its own derivative.", "This property is really the defining characteristic of the number e."] },
{ type:'keypoint', id:'kp205', navLabel:'KP 20.5', badge:'Key Point 20.5', heading:'Key Point 20.5', formula:"If f(x) = ln x, then f'(x) = 1/x", notes:["This result follows from the fact that ln x is the inverse function of eˣ.", "See Proof 20.1 for how this result is derived using reflection in the line y = x."] },
{ type:'example', id:'proof201', navLabel:'Proof 20.1', badge:'Proof 20.1', heading:'Proof 20.1 — Why the Derivative of ln x is 1/x', question:"Given that for y = eˣ, y' = eˣ, prove that for y = ln x, y' = 1/x.", hints:["Let the point P lie on the curve y = eˣ and have x-coordinate p, so P is the point (p, eᵖ)", "Let Q be the reflection of P in the line y = x, so Q is the point (eᵖ, p) — reflecting a point in y = x swaps its x- and y-coordinates", "Since y = eˣ and y = ln x are inverse functions, and the graphs of a function and its inverse are reflections of each other in the line y = x, Q lies on the curve y = ln x", "The gradient of the tangent to y = eˣ at P is eᵖ (since y' = eˣ)", "Reflecting this tangent line in y = x reflects the whole line, and reflecting a line of gradient m in y = x gives a line of gradient 1/m — so the gradient of the tangent to y = ln x at Q is 1/eᵖ", "But 1/eᵖ is exactly the x-coordinate of Q, since Q = (eᵖ, p) — so at the point where x = eᵖ, the gradient of y = ln x equals 1 divided by that x-coordinate", "Since p was any real number, this holds for every point on the curve, so for y = ln x, y' = 1/x"] },
{ type:'example', id:'we204', navLabel:'WE 20.4', badge:'Worked Example 20.4', heading:'Worked Example 20.4 — Using the Laws of Logarithms', question:"Given y = ln x³, find y'.", hints:["Use ln xᵐ = m ln x to rewrite the expression: y = ln x³ = 3 ln x", "Now differentiate, using f'(ln x) = 1/x: y' = 3(1/x)", "Simplify: y' = 3/x"] },
{ type:'example', id:'we205', navLabel:'WE 20.5', badge:'Worked Example 20.5', heading:'Worked Example 20.5 — Equation of a Tangent', question:"Find the equation of the tangent to the curve y = cos x + 2eˣ at the point (0, 3).", hints:["Differentiate term by term: y' = -sin x + 2eˣ", "Find the value of the gradient at x = 0: y'(0) = -sin 0 + 2e⁰ = 0 + 2 = 2", "Substitute into the equation of a straight line, y - y₁ = m(x - x₁), with (x₁, y₁) = (0, 3) and m = 2: y - 3 = 2(x - 0)", "Rearrange: y = 2x + 3"] },

{type:'qa', id:'a1a', navLabel:'A1a', qnum:'Q 1a', heading:"Power rule with fractional exponent",
question:"f(x) = x^(2/3)",
hint:"💡 Use the power rule f'(x) = n·x^(n-1), which works for fractional n exactly as it does for integers.",
steps:[{label:"Apply power rule", text:"Bring the exponent down as a multiplier and reduce it by 1: f'(x) = (2/3)x^(2/3 - 1)"},
{label:"Simplify exponent", text:"2/3 - 1 = -1/3, so f'(x) = (2/3)x^(-1/3)"}],
answer:"∴ f'(x) = (2/3)x^(-1/3)"},

{type:'qa', id:'a1b', navLabel:'A1b', qnum:'Q 1b', heading:"Power rule with fractional exponent",
question:"f(x) = x^(3/4)",
hint:"💡 Use the power rule f'(x) = n·x^(n-1).",
steps:[{label:"Apply power rule", text:"f'(x) = (3/4)x^(3/4 - 1)"},
{label:"Simplify exponent", text:"3/4 - 1 = -1/4, so f'(x) = (3/4)x^(-1/4)"}],
answer:"∴ f'(x) = (3/4)x^(-1/4)"},

{type:'qa', id:'a2a', navLabel:'A2a', qnum:'Q 2a', heading:"Power rule with negative exponent",
question:"f(x) = x^(-1/2)",
hint:"💡 The power rule applies to negative exponents too — just subtract 1 from the exponent.",
steps:[{label:"Apply power rule", text:"f'(x) = (-1/2)x^(-1/2 - 1)"},
{label:"Simplify exponent", text:"-1/2 - 1 = -3/2, so f'(x) = (-1/2)x^(-3/2)"}],
answer:"∴ f'(x) = -(1/2)x^(-3/2)"},

{type:'qa', id:'a2b', navLabel:'A2b', qnum:'Q 2b', heading:"Power rule with negative exponent",
question:"f(x) = x^(-4/3)",
hint:"💡 Subtract 1 from the exponent, then multiply by the original exponent.",
steps:[{label:"Apply power rule", text:"f'(x) = (-4/3)x^(-4/3 - 1)"},
{label:"Simplify exponent", text:"-4/3 - 1 = -7/3, so f'(x) = (-4/3)x^(-7/3)"}],
answer:"∴ f'(x) = -(4/3)x^(-7/3)"},

{type:'qa', id:'a3a', navLabel:'A3a', qnum:'Q 3a', heading:"Differentiating with a coefficient",
question:"f(x) = 6x^(3/2)",
hint:"💡 Multiply the coefficient by the exponent, then reduce the exponent by 1.",
steps:[{label:"Apply power rule", text:"f'(x) = 6×(3/2)x^(3/2 - 1) = 9x^(1/2)"},
{label:"Rewrite", text:"x^(1/2) = √x"}],
answer:"∴ f'(x) = 9√x"},

{type:'qa', id:'a3b', navLabel:'A3b', qnum:'Q 3b', heading:"Differentiating with a coefficient",
question:"f(x) = 8x^(1/4)",
hint:"💡 Multiply the coefficient by the exponent, then reduce the exponent by 1.",
steps:[{label:"Apply power rule", text:"f'(x) = 8×(1/4)x^(1/4 - 1) = 2x^(-3/4)"}],
answer:"∴ f'(x) = 2x^(-3/4)"},

{type:'qa', id:'a4a', navLabel:'A4a', qnum:'Q 4a', heading:"Negative fractional exponent",
question:"f(x) = 9x^(-2/3)",
hint:"💡 Multiply the coefficient by the negative exponent, then reduce the exponent by 1.",
steps:[{label:"Apply power rule", text:"f'(x) = 9×(-2/3)x^(-2/3 - 1) = -6x^(-5/3)"}],
answer:"∴ f'(x) = -6x^(-5/3)"},

{type:'qa', id:'a4b', navLabel:'A4b', qnum:'Q 4b', heading:"Negative fractional exponent",
question:"f(x) = 10x^(-3/2)",
hint:"💡 Multiply the coefficient by the negative exponent, then reduce the exponent by 1.",
steps:[{label:"Apply power rule", text:"f'(x) = 10×(-3/2)x^(-3/2 - 1) = -15x^(-5/2)"}],
answer:"∴ f'(x) = -15x^(-5/2)"},

{type:'qa', id:'a5a', navLabel:'A5a', qnum:'Q 5a', heading:"Differentiating a square root",
question:"f(x) = 2√x",
hint:"💡 Rewrite √x as x^(1/2) first, then apply the power rule.",
steps:[{label:"Rewrite", text:"f(x) = 2x^(1/2)"},
{label:"Apply power rule", text:"f'(x) = 2×(1/2)x^(-1/2) = x^(-1/2)"}],
answer:"∴ f'(x) = 1/√x"},

{type:'qa', id:'a5b', navLabel:'A5b', qnum:'Q 5b', heading:"Differentiating a fourth root",
question:"f(x) = 6∜x",
hint:"💡 Rewrite ∜x as x^(1/4) first, then apply the power rule.",
steps:[{label:"Rewrite", text:"f(x) = 6x^(1/4)"},
{label:"Apply power rule", text:"f'(x) = 6×(1/4)x^(-3/4) = (3/2)x^(-3/4)"}],
answer:"∴ f'(x) = (3/2)x^(-3/4) = 3/(2∜(x³))"},

{type:'qa', id:'a6a', navLabel:'A6a', qnum:'Q 6a', heading:"Differentiating a reciprocal root",
question:"f(x) = -12/∛x",
hint:"💡 Rewrite 1/∛x as x^(-1/3), then apply the power rule.",
steps:[{label:"Rewrite", text:"f(x) = -12x^(-1/3)"},
{label:"Apply power rule", text:"f'(x) = -12×(-1/3)x^(-4/3) = 4x^(-4/3)"}],
answer:"∴ f'(x) = 4x^(-4/3) = 4/∛(x⁴)"},

{type:'qa', id:'a6b', navLabel:'A6b', qnum:'Q 6b', heading:"Differentiating a reciprocal root",
question:"f(x) = -5/∛x",
hint:"💡 Rewrite 1/∛x as x^(-1/3), then apply the power rule.",
steps:[{label:"Rewrite", text:"f(x) = -5x^(-1/3)"},
{label:"Apply power rule", text:"f'(x) = -5×(-1/3)x^(-4/3) = (5/3)x^(-4/3)"}],
answer:"∴ f'(x) = (5/3)x^(-4/3) = 5/(3∛(x⁴))"},

{type:'qa', id:'a7a', navLabel:'A7a', qnum:'Q 7a', heading:"Rewriting a fraction before differentiating",
question:"(9x + 1)/x^(4/3)",
hint:"💡 Split the fraction into separate terms over x^(4/3), then use laws of exponents to write each as a single power of x.",
steps:[{label:"Split fraction", text:"= 9x/x^(4/3) + 1/x^(4/3)"},
{label:"Rewrite", text:"= 9x^(1 - 4/3) + x^(-4/3) = 9x^(-1/3) + x^(-4/3)"},
{label:"Differentiate", text:"f'(x) = 9×(-1/3)x^(-4/3) + (-4/3)x^(-7/3) = -3x^(-4/3) - (4/3)x^(-7/3)"}],
answer:"∴ f'(x) = -3x^(-4/3) - (4/3)x^(-7/3)"},

{type:'qa', id:'a7b', navLabel:'A7b', qnum:'Q 7b', heading:"Rewriting a fraction before differentiating",
question:"(2x - 1)/x^(3/2)",
hint:"💡 Split the fraction into separate terms over x^(3/2), then use laws of exponents.",
steps:[{label:"Split fraction", text:"= 2x/x^(3/2) - 1/x^(3/2)"},
{label:"Rewrite", text:"= 2x^(1 - 3/2) - x^(-3/2) = 2x^(-1/2) - x^(-3/2)"},
{label:"Differentiate", text:"f'(x) = 2×(-1/2)x^(-3/2) - (-3/2)x^(-5/2) = -x^(-3/2) + (3/2)x^(-5/2)"}],
answer:"∴ f'(x) = -x^(-3/2) + (3/2)x^(-5/2)"},

{type:'qa', id:'a8a', navLabel:'A8a', qnum:'Q 8a', heading:"Splitting a fraction into two terms",
question:"(12x² - x)/(5x^(3/4))",
hint:"💡 Split into two fractions with denominator 5x^(3/4) and simplify each with laws of exponents before differentiating.",
steps:[{label:"Split fraction", text:"= (12x²)/(5x^(3/4)) - x/(5x^(3/4))"},
{label:"Rewrite", text:"= (12/5)x^(2 - 3/4) - (1/5)x^(1 - 3/4) = (12/5)x^(5/4) - (1/5)x^(1/4)"},
{label:"Differentiate", text:"f'(x) = (12/5)×(5/4)x^(1/4) - (1/5)×(1/4)x^(-3/4) = 3x^(1/4) - (1/20)x^(-3/4)"}],
answer:"∴ f'(x) = 3x^(1/4) - (1/20)x^(-3/4)"},

{type:'qa', id:'a8b', navLabel:'A8b', qnum:'Q 8b', heading:"Splitting a fraction into two terms",
question:"(6x³ + x)/(7x^(2/3))",
hint:"💡 Split into two fractions with denominator 7x^(2/3) and simplify each with laws of exponents before differentiating.",
steps:[{label:"Split fraction", text:"= (6x³)/(7x^(2/3)) + x/(7x^(2/3))"},
{label:"Rewrite", text:"= (6/7)x^(3 - 2/3) + (1/7)x^(1 - 2/3) = (6/7)x^(7/3) + (1/7)x^(1/3)"},
{label:"Differentiate", text:"f'(x) = (6/7)×(7/3)x^(4/3) + (1/7)×(1/3)x^(-2/3) = 2x^(4/3) + (1/21)x^(-2/3)"}],
answer:"∴ f'(x) = 2x^(4/3) + (1/21)x^(-2/3)"},

{type:'qa', id:'a9a', navLabel:'A9a', qnum:'Q 9a', heading:"Differentiating with a cube root denominator",
question:"(2 - 3x)/∛x",
hint:"💡 Rewrite 1/∛x as x^(-1/3) and multiply through, giving two separate powers of x.",
steps:[{label:"Rewrite", text:"= (2 - 3x)x^(-1/3) = 2x^(-1/3) - 3x^(2/3)"},
{label:"Differentiate", text:"f'(x) = 2×(-1/3)x^(-4/3) - 3×(2/3)x^(-1/3) = -(2/3)x^(-4/3) - 2x^(-1/3)"}],
answer:"∴ f'(x) = -(2/3)x^(-4/3) - 2x^(-1/3)"},

{type:'qa', id:'a9b', navLabel:'A9b', qnum:'Q 9b', heading:"Differentiating with a cube root denominator",
question:"(5 + 8x)/∛x",
hint:"💡 Rewrite 1/∛x as x^(-1/3) and multiply through, giving two separate powers of x.",
steps:[{label:"Rewrite", text:"= (5 + 8x)x^(-1/3) = 5x^(-1/3) + 8x^(2/3)"},
{label:"Differentiate", text:"f'(x) = 5×(-1/3)x^(-4/3) + 8×(2/3)x^(-1/3) = -(5/3)x^(-4/3) + (16/3)x^(-1/3)"}],
answer:"∴ f'(x) = -(5/3)x^(-4/3) + (16/3)x^(-1/3)"},

{type:'qa', id:'a10a', navLabel:'A10a', qnum:'Q 10a', heading:"Differentiating sine",
question:"f(x) = 3sinx",
hint:"💡 The derivative of sinx is cosx.",
steps:[{label:"Differentiate", text:"f'(x) = 3cosx"}],

{type:'qa', id:'a10b', navLabel:'A10b', qnum:'Q 10b', heading:"Differentiating cosine",
question:"f(x) = 4cosx",

steps:[{label:"Differentiate", text:"f'(x) = 4×(-sinx) = -4sinx"}],

{type:'qa', id:'a11a', navLabel:'A11a', qnum:'Q 11a', heading:"Differentiating a trig combination",
question:"f(x) = (1/2)cosx - 5sinx",
hint:"💡 Differentiate term by term: d/dx(cosx) = -sinx, d/dx(sinx) = cosx.",

{label:"Simplify", text:"f'(x) = -(1/2)sinx - 5cosx"}],
answer:"∴ f'(x) = -(1/2)sinx - 5cosx"},

{type:'qa', id:'a11b', navLabel:'A11b', qnum:'Q 11b', heading:"Differentiating a trig combination",
question:"f(x) = (3/4)sinx - 2cosx",
hint:"💡 Differentiate term by term: d/dx(sinx) = cosx, d/dx(cosx) = -sinx.",

{label:"Simplify", text:"f'(x) = (3/4)cosx + 2sinx"}],
answer:"∴ f'(x) = (3/4)cosx + 2sinx"},

{type:'qa', id:'a12a', navLabel:'A12a', qnum:'Q 12a', heading:"Differentiating natural log",

{type:'qa', id:'a12b', navLabel:'A12b', qnum:'Q 12b', heading:"Differentiating natural log",

{type:'qa', id:'a13a', navLabel:'A13a', qnum:'Q 13a', heading:"Log laws before differentiating",
question:"y = lnx²",

{type:'qa', id:'a13b', navLabel:'A13b', qnum:'Q 13b', heading:"Log laws before differentiating",
