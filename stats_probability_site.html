h 8 · Core: Probability distributions › 8A Discrete random variables"}, {"title": "Question 4", "ko": "", "q": "<p>The random variable $X$ has the distribution below and $E(X)=2.5$.<\/p><table class=\"dt\"><tr><th>$x$<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>$P(X=x)$<\/th><td>0.2<\/td><td>$p$<\/td><td>$q$<\/td><td>0.3<\/td><\/tr><\/table><p>Find $p$ and $q$.<\/p>", "guides": [{"q": "You have two unknowns — which two equations can you write?", "qk": "미지수 2개 — 식 2개는?", "a": "Sum of probabilities = 1, and $\\sum xP(X=x)=2.5$.", "ak": "확률의 합 = 1, 기댓값 = 2.5."}], "steps": [["Sum = 1", "$0.2+p+q+0.3=1\\Rightarrow p+q=0.5$"], ["$E(X)=2.5$", "$0.2+2p+3q+1.2=2.5\\Rightarrow 2p+3q=1.1$"], ["Solve", "$2p+3(0.5-p)=1.1\\Rightarrow 1.5-p=1.1\\Rightarrow p=0.4,\\ q=0.1$"]], "ans": "$p=0.4$, $q=0.1$", "fig": null, "ref": "", "type": "practice", "sec": "8A", "code": "8A", "crumb": "Ch 8 · Core: Probability distributions › 8A Discrete random variables"}, {"title": "확률질량함수와 기댓값 (수능 버전)", "unit": "수능특강 05 이산확률변수의 확률분포 · 확률질량함수, 기댓값 (본문 58–61쪽)", "box": "<h4>⑴ 확률변수<\/h4>표본공간의 각 원소에 하나의 실수를 대응시키는 함수. 갖는 값을 셀 수 있으면 <b>이산확률변수<\/b>.<h4>⑵ 확률질량함수<\/h4>$P(X=x_i)=p_i\\ (i=1,2,\\cdots,n)$이면 $0\\le p_i\\le1$, $\\ p_1+p_2+\\cdots+p_n=1$, $\\ P(x_i\\le X\\le x_j)=\\sum_{k=i}^{j}p_k$<h4>⑶ 기댓값(평균)<\/h4>$E(X)=x_1p_1+x_2p_2+\\cdots+x_np_n=\\sum x_ip_i$<h4>⑷ $aX+b$의 평균<\/h4>$E(aX+b)=aE(X)+b$", "map": [["확률질량함수", "probability distribution (function)", ""], ["$E(X)$ 기댓값(평균)", "$E(X)$ expected value", "같음"], ["$m$ (평균)", "$\\mu$", ""], ["확률분포표", "probability distribution table", ""]], "ex": "", "tip": "수능은 확률분포표에 미지수 $a$를 넣고 “확률의 합 = 1”로 푸는 문제가 기본입니다 — IB 8A와 완전히 같아요.", "fig": null, "type": "ks", "sec": "8A", "code": "8A", "crumb": "Ch 8 · Core: Probability distributions › 8A Discrete random variables"}, {"title": "수능형 기초 1", "unit": "수능특강 05 이산확률변수의 확률분포 · 확률질량함수, 기댓값 (본문 58–61쪽)", "q": "<p>이산확률변수 $X$가 갖는 값이 $1,\\ 2,\\ 3,\\ 4$이고 $X$의 확률질량함수가 $$P(X=x)=k(5-x)\\quad(x=1,2,3,4)$$일 때, $E(X)$의 값은? (단, $k$는 상수이다.)<\/p>", "choices": ["$1$", "$\\dfrac32$", "$\\dfrac74$", "$2$", "$\\dfrac52$"], "ans": "4", "guides": [{"q": "각 확률을 $k$로 쓰면?", "qk": "in terms of $k$", "a": "$4k,\\ 3k,\\ 2k,\\ k$", "ak": ""}], "steps": [["확률의 합 = 1", "$10k=1\\Rightarrow k=\\frac1{10}$"], ["기댓값", "$E(X)=1\\cdot\\frac4{10}+2\\cdot\\frac3{10}+3\\cdot\\frac2{10}+4\\cdot\\frac1{10}=\\frac{20}{10}=2$"]], "en": "The probability distribution of $X$ is given by $P(X=x)=k(5-x)$ for $x=1,2,3,4$. Find $E(X)$.", "pts": "[3점]", "ansText": "④ 2", "fig": null, "type": "ksq", "sec": "8A", "code": "8A", "crumb": "Ch 8 · Core: Probability distributions › 8A Discrete random variables"}, {"title": "수능형 기초 2", "unit": "수능특강 05 이산확률변수의 확률분포 · 확률질량함수, 기댓값 (본문 58–61쪽)", "q": "<p>이산확률변수 $X$의 확률분분포가 다음 표와 같을 때, $E(4X+3)$의 값을 구하시오.<\/p><table class=\"dt\"><tr><th>$X$<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>합계<\/td><\/tr><tr><th>$P(X=x)$<\/th><td>$a$<\/td><td>$2a$<\/td><td>$\\frac14$<\/td><td>1<\/td><\/tr><\/table>", "choices": null, "ans": "7", "guides": [{"q": "$a$를 먼저 구하려면?", "qk": "sum = 1", "a": "$3a+\\frac14=1$", "ak": ""}], "steps": [["$a$", "$3a=\\frac34\\Rightarrow a=\\frac14$"], ["$E(X)$", "$0+1\\cdot\\frac12+2\\cdot\\frac14=1$"], ["$E(4X+3)$", "$4E(X)+3=7$"]], "en": "The table shows the probability distribution of $X$. Find $E(4X+3)$.", "pts": "[3점]", "ansText": "7", "fig": null, "type": "ksq", "sec": "8A", "code": "8A", "crumb": "Ch 8 · Core: Probability distributions › 8A Discrete random variables"}, {"title": "수능형 기초 3", "unit": "수능특강 05 이산확률변수의 확률분포 · 확률질량함수, 기댓값 (본문 58–61쪽)", "q": "<p>흰 공 2개와 검은 공 3개가 들어 있는 주머니에서 임의로 2개의 공을 동시에 꺼낼 때, 꺼낸 흰 공의 개수를 확률변수 $X$라 하자. $E(X)$의 값은?<\/p>", "choices": ["$\\dfrac25$", "$\\dfrac12$", "$\\dfrac35$", "$\\dfrac{7}{10}$", "$\\dfrac45$"], "ans": "5", "guides": [{"q": "$X$가 가질 수 있는 값과 전체 경우의 수는?", "qk": "values of $X$", "a": "$0,1,2$ / ${}_5\\mathrm{C}_2=10$", "ak": ""}], "steps": [["확률분포", "$P(X=0)=\\frac{{}_3\\mathrm{C}_2}{10}=\\frac3{10},\\ P(X=1)=\\frac{2\\cdot3}{10}=\\frac6{10},\\ P(X=2)=\\frac1{10}$"], ["기댓값", "$E(X)=\\frac{6}{10}+\\frac{2}{10}=\\frac45$"]], "en": "Two balls are taken at random from a bag of 2 white and 3 black balls. $X$ is the number of white balls taken. Find $E(X)$.", "pts": "[3점]", "ansText": "⑤ $\\frac45$", "fig": null, "type": "ksq", "sec": "8A", "code": "8A", "crumb": "Ch 8 · Core: Probability distributions › 8A Discrete random variables"}, {"title": "Guessing on a multiple-choice quiz", "ko": "객관식 찍기로 몇 개 맞힐까?", "intro": "<p>A quiz has 5 multiple-choice questions, each with 4 options. Mina guesses every answer at random. Let $X$ be the number of correct answers.<\/p>", "intro_ko": "5문항 4지선다 퀴즈를 미나가 모두 찍습니다. $X$는 맞힌 개수입니다.", "steps": [{"q": "What is the probability that she gets the first two right and the last three wrong (CCWWW)?", "qk": "처음 두 개 맞고 나머지 세 개 틀릴(CCWWW) 확률은?", "a": "$\\left(\\frac14\\right)^2\\left(\\frac34\\right)^3=\\frac{27}{1024}$", "ak": ""}, {"q": "In how many different orders can exactly 2 correct answers happen?", "qk": "정확히 2개 맞히는 순서는 몇 가지?", "a": "$\\binom{5}{2}=10$ (CCWWW, CWCWW, …)", "ak": "$_5C_2=10$가지."}, {"q": "So what is $P(X=2)$?", "qk": "그러면 $P(X=2)$는?", "a": "$10\\times\\frac{27}{1024}=\\frac{270}{1024}\\approx0.264$", "ak": ""}, {"q": "List the conditions that made this calculation work.", "qk": "이 계산이 가능했던 조건을 정리해 보세요.", "a": "Fixed number of trials (5); two outcomes (right/wrong); same probability each time ($\\frac14$); trials independent.", "ak": "시행 횟수 고정, 결과 2가지, 성공확률 일정, 각 시행 독립."}], "idea": "When these four conditions hold, $X\\sim B(n,p)$ and $P(X=r)=\\binom{n}{r}p^r(1-p)^{n-r}$. In exams you normally use the GDC (binomial pdf / cdf).", "idea_ko": "네 조건이 성립하면 $X\\sim B(n,p)$이고 $P(X=r)=\\binom{n}{r}p^r(1-p)^{n-r}$입니다. 시험에서는 보통 GDC의 binompdf / binomcdf를 씁니다.", "fig": null, "type": "inquiry", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["binomial distribution", "이항분포", "$X\\sim B(n,p)$"], ["number of trials, $n$", "시행 횟수", "fixed in advance"], ["probability of success, $p$", "성공 확률", "the same for each trial"], ["success / failure", "성공 / 실패", "the two possible outcomes"], ["binomial pdf", "이항 확률 (한 값)", "$P(X=r)$"], ["binomial cdf", "이항 누적확률", "$P(X\\le r)$"], ["at least $r$", "$r$ 이상", "$X\\ge r$"], ["at most $r$", "$r$ 이하", "$X\\le r$"], ["more than / fewer than $r$", "$r$ 초과 / $r$ 미만", "$X\\gt r$ / $X\\lt r$"], ["variance, $\\text{Var}(X)$", "분산", "$np(1-p)$"]], "phrases": [["Write down the distribution of $X$.", "$X$의 분포를 쓰시오 → $X\\sim B(n,p)$ 형태로"], ["State an assumption needed for $X$ to be modelled by a binomial distribution.", "이항분포로 모델링하기 위한 가정을 쓰시오 → “각 시행이 독립”, “확률이 일정”"], ["Find the probability that at least 3 of the seeds germinate.", "적어도 3개가 발아할 확률 → $1-P(X\\le2)$"], ["Find the expected number of …", "기대 개수 → $np$"], ["Find the least value of $n$ such that …", "…를 만족하는 최소 $n$ → GDC 표/그래프 또는 로그"]], "type": "vocab", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "When is a distribution binomial?", "ko": "이항분포의 조건", "kp": "$X\\sim B(n,p)$ when<br>• there is a <b>fixed number of trials<\/b>, $n$<br>• each trial has <b>two outcomes<\/b> (success/failure)<br>• the <b>probability of success $p$ is constant<\/b><br>• the trials are <b>independent<\/b>.<br>$$P(X=r)=\\binom{n}{r}p^r(1-p)^{n-r}$$", "body": "<p>Common traps: “until the first success” (not a fixed $n$), “without replacement from a small group” (not independent / $p$ changes).<\/p>", "kn": "“~할 때까지” → 시행 횟수가 고정이 아니므로 이항분포 아님. 작은 집단에서 비복원 추출 → 확률이 바뀌므로 이항분포 아님.", "tip": "", "guides": [], "fig": null, "type": "concept", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Using the GDC: translating inequalities", "ko": "부등호 바꾸기: GDC 사용법", "kp": "The cdf always gives $P(X\\le r)$.", "body": "<table class=\"dt\"><tr><th>Words<\/th><th>Inequality<\/th><th>GDC<\/th><\/tr><tr><td>at most 4<\/td><td>$X\\le4$<\/td><td>$P(X\\le4)$<\/td><\/tr><tr><td>fewer than 4<\/td><td>$X\\lt 4$<\/td><td>$P(X\\le3)$<\/td><\/tr><tr><td>at least 4<\/td><td>$X\\ge4$<\/td><td>$1-P(X\\le3)$<\/td><\/tr><tr><td>more than 4<\/td><td>$X\\gt 4$<\/td><td>$1-P(X\\le4)$<\/td><\/tr><tr><td>between 2 and 6 inclusive<\/td><td>$2\\le X\\le6$<\/td><td>$P(X\\le6)-P(X\\le1)$<\/td><\/tr><\/table><p>If $X\\sim B(n,p)$: &nbsp; $E(X)=np$, &nbsp; $\\text{Var}(X)=np(1-p)$.<\/p>", "kn": "이산분포에서는 $\\lt $와 $\\le$가 다릅니다! “at least 4”는 4를 포함하므로 $1-P(X\\le3)$. 표를 외우기보다 수직선에 포함되는 값을 직접 표시해 보세요.", "tip": "", "guides": [{"q": "$X\\sim B(20,0.3)$. Which GDC calculation gives $P(X\\gt 5)$?", "qk": "$P(X\\gt 5)$를 GDC로 구하는 식은?", "a": "$1-P(X\\le5)$", "ak": ""}, {"q": "Find $E(X)$ and $\\text{Var}(X)$.", "qk": "기댓값과 분산은?", "a": "$E=6$, $\\text{Var}=20(0.3)(0.7)=4.2$", "ak": ""}], "fig": null, "type": "concept", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Example 8B.1", "ko": "", "q": "<p>$X\\sim B(10,\\ 0.3)$. Find<\/p><p><b>(a)<\/b> $P(X=4)$<\/p><p><b>(b)<\/b> $P(X\\le2)$<\/p><p><b>(c)<\/b> $P(X\\ge4)$<\/p><p><b>(d)<\/b> $E(X)$ and $\\text{Var}(X)$<\/p>", "guides": [{"q": "Which part needs the pdf and which need the cdf?", "qk": "어느 문항이 pdf, 어느 문항이 cdf?", "a": "(a) pdf; (b), (c) cdf.", "ak": ""}], "steps": [["(a) binompdf(10, 0.3, 4)", "$P(X=4)=0.200$"], ["(b) binomcdf(10, 0.3, 2)", "$P(X\\le2)=0.383$"], ["(c) complement", "$P(X\\ge4)=1-P(X\\le3)=1-0.6496=0.350$"], ["(d)", "$E(X)=10(0.3)=3$, &nbsp; $\\text{Var}(X)=10(0.3)(0.7)=2.1$"]], "ans": "(a) 0.200 (b) 0.383 (c) 0.350 (d) 3, 2.1", "fig": null, "ref": "", "type": "example", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Example 8B.2", "ko": "", "q": "<p>The probability that a seed germinates is 0.8. Fifteen seeds are planted.<\/p><p><b>(a)<\/b> State two assumptions needed to model the number of seeds that germinate with a binomial distribution.<\/p><p><b>(b)<\/b> Find the probability that more than 12 seeds germinate.<\/p><p><b>(c)<\/b> Find the probability that at most 10 seeds germinate.<\/p><p><b>(d)<\/b> Find the expected number of seeds that germinate.<\/p>", "guides": [{"q": "Define $X$ and its distribution.", "qk": "$X$와 분포를 정의하세요.", "a": "$X$ = number that germinate, $X\\sim B(15,\\ 0.8)$", "ak": ""}, {"q": "“More than 12” — which values are included?", "qk": "“12 초과”에 포함되는 값은?", "a": "13, 14, 15", "ak": ""}], "steps": [["(a) Assumptions", "Seeds germinate independently of each other; each seed has the same probability 0.8."], ["(b)", "$P(X\\gt 12)=1-P(X\\le12)=0.398$"], ["(c)", "$P(X\\le10)=0.164$"], ["(d)", "$15\\times0.8=12$"]], "ans": "(b) 0.398 (c) 0.164 (d) 12", "fig": null, "ref": "", "type": "example", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Example 8B.3", "ko": "", "q": "<p>A fair die is rolled $n$ times. Find the least value of $n$ for which the probability of getting at least one six is greater than 0.9.<\/p>", "guides": [{"q": "Write $P(\\text{at least one six})$ in terms of $n$.", "qk": "$n$으로 식을 세우세요.", "a": "$1-\\left(\\frac56\\right)^n$", "ak": ""}], "steps": [["Inequality", "$1-\\left(\\frac56\\right)^n\\gt 0.9\\Rightarrow\\left(\\frac56\\right)^n\\lt 0.1$"], ["Solve (logs or GDC table)", "$n\\gt \\dfrac{\\ln0.1}{\\ln(5/6)}=12.6\\ldots$"], ["Check", "$n=12$: $1-(5/6)^{12}=0.888$ ✗ &nbsp; $n=13$: $0.907$ ✓"]], "ans": "$n=13$", "fig": null, "ref": "로그로 풀 때 $\\ln(5/6)\\lt 0$이므로 나누면 부등호 방향이 바뀝니다!", "type": "example", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Question 1", "ko": "", "q": "<p>State, with a reason, whether each random variable can be modelled by a binomial distribution.<\/p><p><b>(a)<\/b> The number of heads when a coin is tossed 20 times.<\/p><p><b>(b)<\/b> The number of rolls of a die until a six appears.<\/p><p><b>(c)<\/b> The number of hearts when 5 cards are dealt from a pack of 52 without replacement.<\/p><p><b>(d)<\/b> The number of left-handed students in a random sample of 30 from a large school (10% left-handed).<\/p>", "guides": [{"q": "Check the four conditions for each one.", "qk": "각각 네 조건을 확인하세요.", "a": "fixed $n$, two outcomes, constant $p$, independent", "ak": ""}], "steps": [["(a)", "Yes: $B(20,\\ 0.5)$"], ["(b)", "No: the number of trials is not fixed."], ["(c)", "No: without replacement, $p$ changes after each card (not independent)."], ["(d)", "Yes (approximately): large population, so $p\\approx0.1$ is constant ⇒ $B(30,\\ 0.1)$"]], "ans": "(a) yes (b) no (c) no (d) yes, approximately", "fig": null, "ref": "", "type": "practice", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Question 2", "ko": "", "q": "<p>$Y\\sim B(8,\\ 0.45)$. Find<\/p><p><b>(a)<\/b> $P(Y=3)$<\/p><p><b>(b)<\/b> $P(Y\\lt 3)$<\/p><p><b>(c)<\/b> $P(Y\\ge5)$<\/p>", "guides": [{"q": "Rewrite (b) and (c) using $\\le$.", "qk": "(b), (c)를 $\\le$로 바꾸세요.", "a": "$P(Y\\le2)$; $1-P(Y\\le4)$", "ak": ""}], "steps": [["(a)", "$0.257$"], ["(b)", "$P(Y\\le2)=0.220$"], ["(c)", "$1-P(Y\\le4)=0.260$"]], "ans": "(a) 0.257 (b) 0.220 (c) 0.260", "fig": null, "ref": "", "type": "practice", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Question 3", "ko": "", "q": "<p>A basketball player scores 70% of her free throws. She takes 12 free throws.<\/p><p><b>(a)<\/b> Find the probability that she scores exactly 9.<\/p><p><b>(b)<\/b> Find the probability that she scores at least 10.<\/p><p><b>(c)<\/b> Find the mean and the standard deviation of the number she scores.<\/p>", "guides": [{"q": "Distribution?", "qk": "분포는?", "a": "$X\\sim B(12,\\ 0.7)$", "ak": ""}], "steps": [["(a)", "$P(X=9)=0.240$"], ["(b)", "$1-P(X\\le9)=0.253$"], ["(c)", "$E(X)=8.4$, &nbsp; $\\sigma=\\sqrt{12(0.7)(0.3)}=\\sqrt{2.52}=1.59$"]], "ans": "(a) 0.240 (b) 0.253 (c) 8.4, 1.59", "fig": null, "ref": "", "type": "practice", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Question 4", "ko": "", "q": "<p>A test has 10 multiple-choice questions, each with 4 options. To pass, a student needs at least 5 correct answers. Leo guesses every answer.<\/p><p><b>(a)<\/b> Find the probability that Leo passes.<\/p><p><b>(b)<\/b> Find the probability that he gets every answer wrong.<\/p>", "guides": [{"q": "What is $p$?", "qk": "$p$는?", "a": "$\\frac14$", "ak": ""}], "steps": [["Model", "$X\\sim B(10,\\ 0.25)$"], ["(a)", "$P(X\\ge5)=1-P(X\\le4)=0.0781$"], ["(b)", "$P(X=0)=0.75^{10}=0.0563$"]], "ans": "(a) 0.0781 (b) 0.0563", "fig": null, "ref": "", "type": "practice", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Question 5", "ko": "", "q": "<p>$X\\sim B(n,p)$ with $E(X)=6$ and $\\text{Var}(X)=4.2$. Find $n$ and $p$.<\/p>", "guides": [{"q": "Divide $\\text{Var}(X)$ by $E(X)$. What do you get?", "qk": "분산을 기댓값으로 나누면?", "a": "$\\frac{np(1-p)}{np}=1-p$", "ak": ""}], "steps": [["Divide", "$1-p=\\frac{4.2}{6}=0.7\\Rightarrow p=0.3$"], ["Then", "$n=\\frac{6}{0.3}=20$"]], "ans": "$n=20$, $p=0.3$", "fig": null, "ref": "", "type": "practice", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "Question 6", "ko": "", "q": "<p>The probability that a train is late on any day is 0.15, independently. Ana takes the train 5 days each week.<\/p><p><b>(a)<\/b> Find the probability that the train is late on at least 2 days in a week.<\/p><p><b>(b)<\/b> Find the probability that, over 10 weeks, there are exactly 3 weeks in which the train is late on at least 2 days.<\/p>", "guides": [{"q": "In (b), what counts as a “success”?", "qk": "(b)에서 “성공”은 무엇?", "a": "A week with at least 2 late days — use the answer to (a) as the new $p$.", "ak": "“2일 이상 늦은 주” → (a)의 답이 새로운 $p$."}], "steps": [["(a) $X\\sim B(5,\\ 0.15)$", "$P(X\\ge2)=1-P(X\\le1)=0.16479\\ldots\\approx0.165$"], ["(b) new variable", "$Y\\sim B(10,\\ 0.16479\\ldots)$"], ["", "$P(Y=3)=0.152$"]], "ans": "(a) 0.165 (b) 0.152", "fig": null, "ref": "(a)의 값을 반올림하지 말고 GDC에 저장해서 (b)에 쓰세요.", "type": "practice", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "독립시행, 이항분포, 이항정리 (수능 버전)", "unit": "수능특강 05 이항분포 (본문 66쪽) · 04 독립시행의 확률 (50쪽) · 02 이항정리 (20쪽)", "box": "<h4>⑴ 독립시행의 확률<\/h4>한 번의 시행에서 사건 $A$가 일어날 확률이 $p$일 때, $n$번의 독립시행에서 $A$가 $r$번 일어날 확률은 $${}_n\\mathrm{C}_r\\,p^r(1-p)^{n-r}\\quad(r=0,1,\\cdots,n)$$<h4>⑵ 이항분포 $B(n,p)$<\/h4>$P(X=x)={}_n\\mathrm{C}_x\\,p^xq^{n-x}\\ (q=1-p)$일 때 $X$는 이항분포 $B(n,p)$를 따른다. $E(X)=np,\\ V(X)=npq,\\ \\sigma(X)=\\sqrt{npq}$<h4>⑶ 이항정리<\/h4>$(a+b)^n=\\sum_{r=0}^{n}{}_n\\mathrm{C}_r\\,a^{n-r}b^r$, 일반항 ${}_n\\mathrm{C}_r\\,a^{n-r}b^r$. 이항분포의 확률들은 $(q+p)^n$을 전개한 각 항과 같다.", "map": [["독립시행", "independent trials", "IB 이항분포 조건"], ["$B(n,p)$", "$B(n,p)$", "같음"], ["$V(X)=npq$", "$\\text{Var}(X)=np(1-p)$", "기호가 다름!"], ["$\\sigma(X)$", "standard deviation $\\sigma$", ""], ["이항계수 ${}_n\\mathrm{C}_r$", "binomial coefficient $\\binom{n}{r}$", ""], ["일반항", "general term", "IB SL Ch 1"]], "ex": "", "tip": "IB는 GDC의 binompdf/binomcdf, 수능은 ${}_n\\mathrm{C}_r\\,p^rq^{n-r}$을 직접 계산합니다. 수능은 숫자가 손으로 계산되게 나와요.", "fig": null, "type": "ks", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "수능형 기초 1", "unit": "수능특강 05 이항분포 (본문 66쪽) · 04 독립시행의 확률 (50쪽) · 02 이항정리 (20쪽)", "q": "<p>다항식 $(x+2)^5$의 전개식에서 $x^3$의 계수는?<\/p>", "choices": ["$10$", "$20$", "$40$", "$80$", "$160$"], "ans": "3", "guides": [{"q": "$x^3$이 나오려면 $2$를 몇 번 택해야 하나요?", "qk": "general term", "a": "2번: ${}_5\\mathrm{C}_2\\,x^3\\,2^2$", "ak": ""}], "steps": [["일반항", "${}_5\\mathrm{C}_r\\,x^{5-r}\\,2^r$"], ["$5-r=3$", "$r=2$: ${}_5\\mathrm{C}_2\\cdot2^2=10\\cdot4=40$"]], "en": "Find the coefficient of $x^3$ in the expansion of $(x+2)^5$.", "pts": "[2점]", "ansText": "③ 40", "fig": null, "type": "ksq", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "수능형 기초 2", "unit": "수능특강 05 이항분포 (본문 66쪽) · 04 독립시행의 확률 (50쪽) · 02 이항정리 (20쪽)", "q": "<p>한 개의 동전을 5번 던질 때, 앞면이 정확히 3번 나올 확률은?<\/p>", "choices": ["$\\dfrac14$", "$\\dfrac5{16}$", "$\\dfrac38$", "$\\dfrac7{16}$", "$\\dfrac12$"], "ans": "2", "guides": [{"q": "$n,\\ p,\\ r$은?", "qk": "identify $n,p,r$", "a": "$n=5,\\ p=\\frac12,\\ r=3$", "ak": ""}], "steps": [["독립시행의 확률", "${}_5\\mathrm{C}_3\\left(\\frac12\\right)^3\\left(\\frac12\\right)^2=\\frac{10}{32}=\\frac5{16}$"]], "en": "A fair coin is tossed 5 times. Find the probability of obtaining exactly 3 heads.", "pts": "[2점]", "ansText": "② $\\frac5{16}$", "fig": null, "type": "ksq", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "수능형 기초 3", "unit": "수능특강 05 이항분포 (본문 66쪽) · 04 독립시행의 확률 (50쪽) · 02 이항정리 (20쪽)", "q": "<p>확률변수 $X$가 이항분포 $B\\left(n,\\ \\dfrac13\\right)$을 따르고 $E(X)=10$일 때, $V(3X)$의 값을 구하시오.<\/p>", "choices": null, "ans": "60", "guides": [{"q": "$E(X)=np$에서 $n$은?", "qk": "$E(X)=np$", "a": "$\\frac n3=10\\Rightarrow n=30$", "ak": ""}, {"q": "$V(aX)$는 $V(X)$의 몇 배?", "qk": "variance scales by $a^2$", "a": "$a^2=9$배", "ak": ""}], "steps": [["$n$", "$n=30$"], ["$V(X)$", "$30\\cdot\\frac13\\cdot\\frac23=\\frac{20}{3}$"], ["$V(3X)$", "$9\\cdot\\frac{20}{3}=60$"]], "en": "$X\\sim B\\left(n,\\frac13\\right)$ and $E(X)=10$. Find $\\text{Var}(3X)$.", "pts": "[3점]", "ansText": "60", "fig": null, "type": "ksq", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "수능형 기초 4", "unit": "수능특강 05 이항분포 (본문 66쪽) · 04 독립시행의 확률 (50쪽) · 02 이항정리 (20쪽)", "q": "<p>한 개의 주사위를 4번 던질 때, 3의 배수의 눈이 적어도 한 번 나올 확률은?<\/p>", "choices": ["$\\dfrac{16}{81}$", "$\\dfrac{49}{81}$", "$\\dfrac{56}{81}$", "$\\dfrac{65}{81}$", "$\\dfrac{80}{81}$"], "ans": "4", "guides": [{"q": "한 번 던질 때 3의 배수가 나오지 않을 확률은?", "qk": "probability of failure", "a": "$\\frac46=\\frac23$", "ak": ""}], "steps": [["여사건", "4번 모두 3의 배수가 아닐 확률 $\\left(\\frac23\\right)^4=\\frac{16}{81}$"], ["답", "$1-\\frac{16}{81}=\\frac{65}{81}$"]], "en": "A fair die is rolled 4 times. Find the probability that a multiple of 3 is obtained at least once.", "pts": "[3점]", "ansText": "④ $\\frac{65}{81}$", "fig": null, "type": "ksq", "sec": "8B", "code": "8B", "crumb": "Ch 8 · Core: Probability distributions › 8B Binomial distribution"}, {"title": "The shape of heights", "ko": "키 분포의 모양", "intro": "<p>The heights of 1000 adult men are recorded. The histogram is bell-shaped and symmetric, with mean 175 cm and standard deviation 7 cm.<\/p>", "intro_ko": "성인 남성 1000명의 키 히스토그램이 종 모양이고 대칭이며, 평균 175 cm, 표준편차 7 cm입니다.", "steps": [{"q": "Where is the peak of the distribution?", "qk": "분포의 꼭대기는 어디인가요?", "a": "At the mean, 175 cm (mean = median = mode).", "ak": "평균 175 cm (평균 = 중앙값 = 최빈값)."}, {"q": "About 68% of the data lies within 1 SD of the mean. Between which heights is that?", "qk": "자료의 약 68%가 평균에서 1 SD 안에 있습니다. 어느 키 사이인가요?", "a": "$168$ cm and $182$ cm", "ak": ""}, {"q": "About 95% lies within 2 SD. Roughly how many men are taller than 189 cm?", "qk": "약 95%가 2 SD 안에 있습니다. 189 cm보다 큰 사람은 대략 몇 명?", "a": "189 is 2 SD above; 5% are outside, half above ⇒ 2.5% of 1000 ≈ 25 men.", "ak": "바깥 5%의 절반 → 약 25명."}, {"q": "Is the probability that a man is exactly 175.000… cm meaningful?", "qk": "키가 정확히 175.000… cm일 확률은?", "a": "For continuous data it is 0; we only find probabilities over intervals.", "ak": "연속분포에서는 0. 구간의 확률만 의미가 있습니다."}], "idea": "Many measurements follow a <b>normal distribution<\/b> $X\\sim N(\\mu,\\sigma^2)$. Probabilities are <b>areas<\/b> under the curve: about 68%, 95%, 99.7% lie within 1, 2, 3 SD of the mean.", "idea_ko": "많은 측정값이 정규분포를 따릅니다. 확률은 곡선 아래의 넓이이고, 평균에서 1, 2, 3 SD 안에 약 68%, 95%, 99.7%가 있습니다.", "fig": {"type": "normal", "mu": 175, "sd": 7, "a": 168, "b": 182, "ticks": [{"v": 161, "l": "161"}, {"v": 168, "l": "168"}, {"v": 175, "l": "175"}, {"v": 182, "l": "182"}, {"v": 189, "l": "189"}], "label": "≈ 68% shaded"}, "type": "inquiry", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["normal distribution", "정규분포", "$X\\sim N(\\mu,\\sigma^2)$ — note: the second number is the <b>variance<\/b>"], ["bell-shaped", "종 모양의", ""], ["symmetric about the mean", "평균에 대해 대칭", "mean = median = mode"], ["mean, $\\mu$", "평균", "centre of the curve"], ["standard deviation, $\\sigma$", "표준편차", "spread of the curve"], ["area under the curve", "곡선 아래 넓이", "= probability"], ["normal cdf", "정규 누적확률", "$P(a\\lt X\\lt b)$ on the GDC"], ["inverse normal", "역정규", "find $x$ from a probability (area to the <b>left<\/b>)"], ["proportion / percentage", "비율 / 백분율", "probability × 100%"], ["upper / lower tail", "오른쪽 / 왼쪽 꼬리", "area $P(X\\gt a)$ / $P(X\\lt a)$"]], "phrases": [["The masses of apples are normally distributed with mean 150 g and standard deviation 12 g.", "사과 무게는 평균 150 g, 표준편차 12 g인 정규분포를 따른다."], ["Find the probability that a randomly chosen apple has a mass greater than 160 g.", "무작위로 고른 사과가 160 g 초과일 확률을 구하시오."], ["Find the expected number of apples in a box of 80 that weigh less than 130 g.", "80개 중 130 g 미만의 기대 개수 → 확률 × 80"], ["10% of the apples have a mass greater than $k$ grams. Find $k$.", "10%가 $k$ g보다 무겁다 → 왼쪽 넓이 0.9로 inverse normal"], ["On the diagram, shade the region representing …", "그림에 …를 나타내는 영역을 색칠하시오."]], "type": "vocab", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Properties of the normal distribution", "ko": "정규분포의 성질", "kp": "If $X\\sim N(\\mu,\\sigma^2)$:<br>• the curve is bell-shaped and symmetric about $\\mu$<br>• about <b>68%<\/b> of values lie in $\\mu\\pm\\sigma$, <b>95%<\/b> in $\\mu\\pm2\\sigma$, <b>99.7%<\/b> in $\\mu\\pm3\\sigma$", "body": "<p>Because $X$ is continuous, $P(X=a)=0$, so $P(X\\lt a)=P(X\\le a)$.<\/p>", "kn": "$N(\\mu,\\sigma^2)$에서 두 번째 자리는 “분산”입니다. $N(50, 16)$이면 $\\sigma=4$! 연속분포이므로 $\\lt $와 $\\le$는 같은 확률입니다(이항분포와의 차이).", "tip": "", "guides": [], "fig": {"type": "normal", "mu": 0, "sd": 1, "a": -2, "b": 2, "ticks": [{"v": -3, "l": "μ−3σ"}, {"v": -2, "l": "μ−2σ"}, {"v": -1, "l": "μ−σ"}, {"v": 0, "l": "μ"}, {"v": 1, "l": "μ+σ"}, {"v": 2, "l": "μ+2σ"}, {"v": 3, "l": "μ+3σ"}], "label": "≈ 95%"}, "type": "concept", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Using the GDC", "ko": "GDC 사용법", "kp": "<b>Probability from a value<\/b>: normal cdf (lower, upper, $\\mu$, $\\sigma$).<br><b>Value from a probability<\/b>: inverse normal (area to the <b>left<\/b>, $\\mu$, $\\sigma$).", "body": "<p>For $P(X\\gt a)$ use upper bound $10^{99}$ (or a very large number). For “the top 10%”, the area to the left is $0.9$.<\/p>", "kn": "inverse normal은 항상 “왼쪽 넓이”를 입력합니다. “상위 10%” → 0.9, “하위 10%” → 0.1. 꼭 그림을 먼저 그리고 색칠하세요!", "tip": "Always sketch the curve and shade the region first — it catches most mistakes.", "guides": [{"q": "$X\\sim N(20,\\ 9)$. What is $\\sigma$?", "qk": "$\\sigma$는?", "a": "$\\sigma=3$", "ak": ""}, {"q": "To find $k$ with $P(X\\gt k)=0.25$, what area do you enter in inverse normal?", "qk": "$P(X\\gt k)=0.25$인 $k$를 구할 때 입력하는 넓이는?", "a": "$0.75$", "ak": ""}], "fig": null, "type": "concept", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Example 8C.1", "ko": "", "q": "<p>The heights of students in a school are normally distributed with mean 170 cm and standard deviation 8 cm. Find the probability that a randomly chosen student is<\/p><p><b>(a)<\/b> shorter than 180 cm<\/p><p><b>(b)<\/b> between 160 cm and 175 cm<\/p><p><b>(c)<\/b> taller than 190 cm.<\/p>", "guides": [{"q": "Write the distribution.", "qk": "분포를 쓰세요.", "a": "$H\\sim N(170,\\ 8^2)$", "ak": ""}], "steps": [["(a) normalcdf$(-10^{99},180,170,8)$", "$P(H\\lt 180)=0.894$"], ["(b) normalcdf$(160,175,170,8)$", "$P(160\\lt H\\lt 175)=0.628$"], ["(c) normalcdf$(190,10^{99},170,8)$", "$P(H\\gt 190)=0.00621$"]], "ans": "(a) 0.894 (b) 0.628 (c) 0.00621", "fig": {"type": "normal", "mu": 170, "sd": 8, "a": 160, "b": 175, "ticks": [160, 170, 175], "label": "(b)"}, "ref": "", "type": "example", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Example 8C.2", "ko": "", "q": "<p>Using the same distribution $H\\sim N(170,\\ 8^2)$:<\/p><p><b>(a)<\/b> Find $h$ such that $P(H\\lt h)=0.9$.<\/p><p><b>(b)<\/b> The tallest 5% of students are invited to join the basketball team. Find the minimum height for an invitation.<\/p>", "guides": [{"q": "In (b), what is the area to the <b>left<\/b> of the minimum height?", "qk": "(b)에서 최소 키의 왼쪽 넓이는?", "a": "$1-0.05=0.95$", "ak": ""}], "steps": [["(a) invNorm$(0.9,170,8)$", "$h=180.3$ cm"], ["(b) invNorm$(0.95,170,8)$", "$h=183.2$ cm"]], "ans": "(a) 180 cm (b) 183 cm", "fig": {"type": "normal", "mu": 170, "sd": 8, "a": 183.16, "ticks": [170, {"v": 183.16, "l": "h"}], "label": "top 5%"}, "ref": "", "type": "example", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Example 8C.3", "ko": "", "q": "<p>The lifetime of a battery is normally distributed with mean 500 hours and standard deviation 40 hours. A shop sells 2000 of these batteries.<\/p><p><b>(a)<\/b> Find the expected number of batteries that last less than 450 hours.<\/p><p><b>(b)<\/b> The manufacturer wants to give a guarantee time so that only 5% of batteries fail before it. Find this time.<\/p>", "guides": [{"q": "How do you turn a probability into an expected number?", "qk": "확률을 기대 개수로 바꾸려면?", "a": "Multiply by the number of batteries, 2000.", "ak": "× 2000."}], "steps": [["(a) probability", "$P(L\\lt 450)=0.10565$"], ["Expected number", "$2000\\times0.10565\\approx211$"], ["(b) inverse normal, area 0.05", "$t=434$ hours"]], "ans": "(a) about 211 (b) 434 hours", "fig": null, "ref": "", "type": "example", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Question 1", "ko": "", "q": "<p>$X\\sim N(50,\\ 5^2)$. <b>Without a calculator<\/b>, use the 68–95–99.7 rule to estimate<\/p><p><b>(a)<\/b> $P(45\\lt X\\lt 55)$<\/p><p><b>(b)<\/b> $P(X\\gt 60)$<\/p><p><b>(c)<\/b> $P(40\\lt X\\lt 55)$<\/p>", "guides": [{"q": "How many SDs is 60 from the mean?", "qk": "60은 평균에서 몇 SD?", "a": "2 SDs", "ak": ""}], "steps": [["(a) $\\mu\\pm\\sigma$", "$\\approx0.68$"], ["(b) above $\\mu+2\\sigma$", "$\\frac{1-0.95}{2}=0.025$"], ["(c) $\\mu-2\\sigma$ to $\\mu+\\sigma$", "$0.475+0.34=0.815$"]], "ans": "(a) 0.68 (b) 0.025 (c) 0.815", "fig": null, "ref": "", "type": "practice", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Question 2", "ko": "", "q": "<p>The masses of apples are normally distributed with mean 150 g and standard deviation 12 g.<\/p><p><b>(a)<\/b> Find the probability that an apple weighs more than 160 g.<\/p><p><b>(b)<\/b> Find the probability that an apple weighs between 140 g and 165 g.<\/p><p><b>(c)<\/b> A box contains 80 apples. Find the expected number that weigh less than 130 g.<\/p>", "guides": [{"q": "Which GDC function for (c)?", "qk": "(c)에 쓰는 GDC 기능은?", "a": "normal cdf, then multiply by 80.", "ak": "normalcdf 후 × 80."}], "steps": [["(a)", "$P(M\\gt 160)=0.202$"], ["(b)", "$P(140\\lt M\\lt 165)=0.692$"], ["(c)", "$80\\times P(M\\lt 130)=80\\times0.04779\\approx3.82$"]], "ans": "(a) 0.202 (b) 0.692 (c) 3.82", "fig": null, "ref": "", "type": "practice", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Question 3", "ko": "", "q": "<p>The times taken to complete a puzzle are normally distributed with mean 42 minutes and standard deviation 6 minutes. A prize is given to the fastest 10% of people. Find the maximum time that wins a prize.<\/p>", "guides": [{"q": "Fastest = largest or smallest times?", "qk": "가장 빠른 = 시간이 큰 쪽? 작은 쪽?", "a": "Smallest times — so the area to the left is 0.1.", "ak": "작은 쪽 → 왼쪽 넓이 0.1."}], "steps": [["Sketch", "Shade the lower 10% tail."], ["invNorm$(0.1,42,6)$", "$t=34.3$ minutes"]], "ans": "34.3 minutes", "fig": null, "ref": "", "type": "practice", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Question 4", "ko": "", "q": "<p>$X\\sim N(\\mu,\\sigma^2)$ with $P(X\\lt 20)=0.3$ and $P(X\\gt 40)=0.3$. Find $\\mu$.<\/p>", "guides": [{"q": "What does the equal tail area tell you about 20 and 40?", "qk": "양 꼬리 넓이가 같다는 것은?", "a": "They are the same distance from the mean (symmetry).", "ak": "평균에서 같은 거리 → 대칭."}], "steps": [["Symmetry", "$\\mu$ is halfway between 20 and 40"], ["", "$\\mu=30$"]], "ans": "$\\mu=30$", "fig": null, "ref": "", "type": "practice", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Question 5", "ko": "", "q": "<p>The masses of eggs are normally distributed with mean 62 g and standard deviation 5 g. Eggs heavier than 70 g are graded “large”.<\/p><p><b>(a)<\/b> Find the probability that an egg is large.<\/p><p><b>(b)<\/b> A box contains 6 eggs. Find the probability that at least 2 of them are large.<\/p>", "guides": [{"q": "In (b), what distribution does the number of large eggs follow?", "qk": "(b)에서 큰 달걀 개수의 분포는?", "a": "$B(6,\\ p)$ where $p$ is the answer to (a).", "ak": ""}], "steps": [["(a)", "$P(M\\gt 70)=0.05480$"], ["(b) $L\\sim B(6,\\ 0.05480)$", "$P(L\\ge2)=1-P(L\\le1)=0.0389$"]], "ans": "(a) 0.0548 (b) 0.0389", "fig": null, "ref": "", "type": "practice", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "정규분포 곡선의 성질 (수능 버전)", "unit": "수능특강 06 연속확률변수의 확률분포 · 3 정규분포, 4 정규분포 곡선의 성질 (본문 76–77쪽)", "box": "<h4>⑴ 정규분포 $N(m,\\sigma^2)$<\/h4>평균이 $m$, 표준편차가 $\\sigma$인 정규분포. 확률밀도함수의 그래프는<br>① 직선 $x=m$에 대하여 대칭인 종 모양 &nbsp; ② $x$축이 점근선 &nbsp; ③ 곡선과 $x$축 사이의 넓이는 1<br>④ $m$이 일정하고 $\\sigma$가 커지면 가운데가 낮아지며 양쪽으로 퍼진다. $\\sigma$가 일정하고 $m$이 변하면 모양은 같고 평행이동한다.<h4>⑵ 대칭성<\/h4>$P(X\\le m)=P(X\\ge m)=0.5$, &nbsp; $P(X\\le m-k)=P(X\\ge m+k)$", "map": [["$N(m,\\sigma^2)$", "$N(\\mu,\\sigma^2)$", "평균 기호만 다름"], ["확률밀도함수", "probability density function (pdf)", "HL 9C"], ["표준정규분포표", "GDC normal cdf", "수능은 GDC 없이 표를 사용"]], "ex": "", "tip": "수능은 “$P(X\\le a)=P(X\\ge b)$이면 $m=\\frac{a+b}{2}$”처럼 대칭성을 묻는 문제가 자주 나옵니다.", "fig": {"type": "normal", "mu": 0, "sd": 1, "a": 1, "ticks": [{"v": -1, "l": "m−k"}, {"v": 0, "l": "m"}, {"v": 1, "l": "m+k"}], "label": "P(X ≥ m+k) = P(X ≤ m−k)"}, "type": "ks", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "수능형 기초 1", "unit": "수능특강 06 연속확률변수의 확률분포 · 3 정규분포, 4 정규분포 곡선의 성질 (본문 76–77쪽)", "q": "<p>확률변수 $X$가 정규분포 $N(m,\\ \\sigma^2)$을 따르고 $$P(X\\le10)=P(X\\ge18)$$일 때, $m$의 값을 구하시오.<\/p>", "choices": null, "ans": "14", "guides": [{"q": "양쪽 꼬리의 넓이가 같다는 것은 무엇을 뜻하나요?", "qk": "symmetry", "a": "10과 18이 $m$에서 같은 거리에 있다", "ak": ""}], "steps": [["대칭", "$m=\\dfrac{10+18}{2}=14$"]], "en": "$X\\sim N(\\mu,\\sigma^2)$ and $P(X\\le10)=P(X\\ge18)$. Find $\\mu$.", "pts": "[2점]", "ansText": "14", "fig": null, "type": "ksq", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "수능형 기초 2", "unit": "수능특강 06 연속확률변수의 확률분포 · 3 정규분포, 4 정규분포 곡선의 성질 (본문 76–77쪽)", "q": "<p>두 확률변수 $X,\\ Y$가 각각 정규분포 $N(50,\\ 4^2)$, $N(50,\\ 6^2)$을 따를 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은?<\/p><div style=\"border:1px solid #cfc9bb;border-radius:6px;padding:.4rem .9rem;margin:.6rem 0\"><div style=\"text-align:center;font-size:.8rem;color:#5b6470\">&lt;보 기&gt;<\/div><div>ㄱ. $P(X\\le50)=P(Y\\le50)$<\/div><div>ㄴ. $P(X\\ge54)=P(Y\\ge56)$<\/div><div>ㄷ. $P(46\\le X\\le54)\\lt P(44\\le Y\\le56)$<\/div><\/div>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "ans": "3", "guides": [{"q": "54와 56은 각각 평균에서 몇 표준편차 떨어져 있나요?", "qk": "how many standard deviations?", "a": "$\\frac{54-50}{4}=1$, $\\frac{56-50}{6}=1$ — 둘 다 1", "ak": ""}], "steps": [["ㄱ", "두 분포 모두 평균이 50 → 둘 다 $0.5$ (참)"], ["ㄴ", "둘 다 평균보다 표준편차 1개 위 → 같은 확률 (참)"], ["ㄷ", "둘 다 “평균 ± 1 표준편차” 구간 → 같은 확률이므로 부등호가 틀림 (거짓)"]], "en": "$X\\sim N(50,4^2)$ and $Y\\sim N(50,6^2)$. Decide which of the statements are true.", "pts": "[3점]", "ansText": "③ ㄱ, ㄴ", "fig": null, "type": "ksq", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "수능형 기초 3", "unit": "수능특강 06 연속확률변수의 확률분포 · 3 정규분포, 4 정규분포 곡선의 성질 (본문 76–77쪽)", "q": "<p>확률변수 $X$가 정규분포 $N(60,\\ 5^2)$을 따를 때, $P(55\\le X\\le70)$의 값을 아래 표준정규분포표를 이용하여 구한 것은?<\/p><table class=\"dt\"><tr><th>$z$<\/th><th>0.5<\/th><th>1.0<\/th><th>1.5<\/th><th>2.0<\/th><th>2.5<\/th><\/tr><tr><td>$P(0\\le Z\\le z)$<\/td><td>0.1915<\/td><td>0.3413<\/td><td>0.4332<\/td><td>0.4772<\/td><td>0.4938<\/td><\/tr><\/table>", "choices": ["$0.6826$", "$0.8185$", "$0.8664$", "$0.9104$", "$0.9544$"], "ans": "2", "guides": [{"q": "55와 70을 각각 $z$로 바꾸면?", "qk": "standardize", "a": "$z=-1$, $z=2$", "ak": ""}, {"q": "$P(-1\\le Z\\le0)$은 표의 어느 값과 같나요?", "qk": "symmetry", "a": "$P(0\\le Z\\le1)=0.3413$", "ak": ""}], "steps": [["표준화", "$P(55\\le X\\le70)=P(-1\\le Z\\le2)$"], ["대칭 이용", "$=P(0\\le Z\\le1)+P(0\\le Z\\le2)=0.3413+0.4772=0.8185$"]], "en": "$X\\sim N(60,5^2)$. Find $P(55\\le X\\le70)$. <i>(IB: use the GDC normal cdf — the answer is the same, 0.819.)<\/i>", "pts": "[3점]", "ansText": "② 0.8185", "fig": null, "type": "ksq", "sec": "8C", "code": "8C", "crumb": "Ch 8 · Core: Probability distributions › 8C The normal distribution"}, {"title": "Which line should I use to predict hours?", "ko": "공부 시간을 예측하려면 어느 직선?", "intro": "<p>Eight students recorded study hours $x$ and test score $y$.<\/p><table class=\"dt\"><tr><th>$x$<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8<\/th><th>9<\/th><\/tr><tr><td>$y$<\/td><td>52<\/td><td>60<\/td><td>55<\/td><td>70<\/td><td>58<\/td><td>72<\/td><td>66<\/td><td>80<\/td><\/tr><\/table><p>The regression line of $y$ on $x$ is $y=3.15x+46.8$ $(r=0.810)$.<\/p>", "intro_ko": "8명의 공부 시간 $x$와 점수 $y$입니다. $x$에 대한 $y$의 회귀직선은 $y=3.15x+46.8$입니다.", "steps": [{"q": "The $y$-on-$x$ line makes the <b>vertical<\/b> distances from the points to the line as small as possible. Why is it designed for predicting $y$?", "qk": "$x$에 대한 $y$ 회귀직선은 “세로” 거리를 최소로 합니다. 왜 $y$를 예측하는 데 맞춰져 있을까요?", "a": "Vertical distances are errors in $y$, so the line minimises the error when we estimate $y$ from $x$.", "ak": "세로 거리는 $y$의 오차이므로, $x$로 $y$를 추정할 때 오차를 최소화합니다."}, {"q": "Rearrange $y=3.15x+46.8$ to estimate the hours for a score of 75.", "qk": "$y=3.15x+46.8$을 변형해서 75점에 필요한 시간을 추정해 보세요.", "a": "$x=\\frac{75-46.8}{3.15}\\approx8.95$ hours", "ak": ""}, {"q": "The GDC can also give the regression line of $x$ on $y$: $x=0.208y-7.84$. What does it give for $y=75$?", "qk": "GDC로 $y$에 대한 $x$ 회귀직선 $x=0.208y-7.84$를 구했습니다. $y=75$를 넣으면?", "a": "$x=0.208(75)-7.84\\approx7.76$ hours", "ak": ""}, {"q": "Why are the two answers different? Which one should you use?", "qk": "두 답이 왜 다를까요? 어느 것을 써야 할까요?", "a": "The lines are different because $|r|\\lt 1$. To predict $x$ from $y$, use the $x$-on-$y$ line: about 7.76 hours.", "ak": "$|r|\\lt 1$이라 두 직선이 다릅니다. $y$로 $x$를 예측할 땐 $x$ on $y$ 직선을 써야 합니다 → 약 7.76시간."}], "idea": "To predict $y$ from $x$, use the regression line of $y$ on $x$. To predict $x$ from $y$, use the regression line of $x$ on $y$ — <b>never rearrange<\/b> the $y$-on-$x$ line. Both lines pass through $(\\bar x,\\bar y)$.", "idea_ko": "$x$로 $y$ 예측 → $y$ on $x$, $y$로 $x$ 예측 → $x$ on $y$. $y$ on $x$ 식을 변형해서 쓰면 안 됩니다. 두 직선 모두 $(\\bar x,\\bar y)$를 지납니다.", "fig": null, "type": "inquiry", "sec": "19A", "code": "19A", "crumb": "Ch 19 · AA: Statistics and probability › 19A Linear regression (x on y)"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["regression line of $x$ on $y$", "$y$에 대한 $x$의 회귀직선", "$x=cy+d$; predicts $x$ from $y$"], ["regression line of $y$ on $x$", "$x$에 대한 $y$의 회귀직선", "$y=ax+b$; predicts $y$ from $x$"], ["least squares", "최소제곱", "minimise the sum of squared distances"], ["residual", "잔차", "observed value − predicted value"], ["mean point", "평균점", "$(\\bar x,\\bar y)$, where the two lines meet"], ["predict / estimate", "예측하다 / 추정하다", ""], ["hence", "그러므로 (앞의 결과를 이용하여)", "you must use the previous part"]], "phrases": [["Find the equation of the regression line of $x$ on $y$.", "$y$에 대한 $x$의 회귀직선의 식을 구하시오. (GDC에 $y$ 데이터를 X리스트로!)"], ["Use an appropriate regression line to estimate …", "“적절한” 회귀직선으로 추정 → 무엇으로 무엇을 예측하는지 먼저 판단"], ["Hence, find the value of $\\bar x$ and $\\bar y$.", "그러므로 평균을 구하시오 → 두 회귀직선의 교점"], ["Explain why the line of $y$ on $x$ should not be used to estimate $x$.", "$y$ on $x$ 직선으로 $x$를 추정하면 안 되는 이유를 설명하시오."]], "type": "vocab", "sec": "19A", "code": "19A", "crumb": "Ch 19 · AA: Statistics and probability › 19A Linear regression (x on y)"}, {"title": "Two regression lines", "ko": "두 개의 회귀직선", "kp": "• $y$ on $x$: $y=ax+b$ — minimises vertical distances — use to predict $y$.<br>• $x$ on $y$: $x=cy+d$ — minimises horizontal distances — use to predict $x$.<br>• Both pass through the mean point $(\\bar x,\\bar y)$.", "body": "<p>If $r=\\pm1$ the two lines are the same line. The weaker the correlation, the bigger the angle between them.<\/p>", "kn": "GDC에서 $x$ on $y$를 구할 때는 Xlist에 $y$ 자료, Ylist에 $x$ 자료를 넣고 LinReg를 실행한 다음, 결과의 $x$, $y$를 바꿔 읽습니다. 그림의 점선은 $y$ on $x$ 직선입니다.", "tip": "", "guides": [{"q": "The two regression lines for a data set are $y=0.5x+20$ and $x=1.6y-28$. Where do they intersect, and why does that matter?", "qk": "두 회귀직선 $y=0.5x+20$, $x=1.6y-28$의 교점은? 왜 중요할까요?", "a": "$x=1.6(0.5x+20)-28\\Rightarrow0.2x=4\\Rightarrow x=20,\\ y=30$. The intersection is the mean point, so $\\bar x=20$, $\\bar y=30$.", "ak": "교점 (20, 30)이 평균점 → $\\bar x=20,\\ \\bar y=30$."}], "fig": {"type": "scatter", "pts": [[2, 52], [3, 60], [4, 55], [5, 70], [6, 58], [7, 72], [8, 66], [9, 80]], "xr": [0, 10], "yr": [40, 90], "xs": 2, "ys": 10, "line": [3.155, 46.77], "xlab": "hours x", "ylab": "score y"}, "type": "concept", "sec": "19A", "code": "19A", "crumb": "Ch 19 · AA: Statistics and probability › 19A Linear regression (x on y)"}, {"title": "Example 19A.1", "ko": "", "q": "<p>Using the data from the inquiry (hours $x$, score $y$):<\/p><p><b>(a)<\/b> Find the regression line of $x$ on $y$.<\/p><p><b>(b)<\/b> Estimate the number of hours studied by a student who scored 75.<\/p><p><b>(c)<\/b> Estimate the score of a student who studied 6.5 hours.<\/p>", "guides": [{"q": "Part (b): which variable is given and which is predicted?", "qk": "(b)에서 주어진 변수와 예측할 변수는?", "a": "Given $y=75$, predict $x$ ⇒ $x$ on $y$.", "ak": ""}, {"q": "Part (c)?", "qk": "(c)는?", "a": "Given $x=6.5$, predict $y$ ⇒ $y$ on $x$.", "ak": ""}], "steps": [["(a) GDC with $y$ as the independent list", "$x=0.208y-7.84$ (3 s.f.)"], ["(b) $x$ on $y$", "$x=0.208(75)-7.84\\approx7.76$ hours"], ["(c) $y$ on $x$", "$y=3.15(6.5)+46.8\\approx67.3$"]], "ans": "(a) $x=0.208y-7.84$ (b) 7.76 h (c) 67.3", "fig": null, "ref": "", "type": "example", "sec": "19A", "code": "19A", "crumb": "Ch 19 · AA: Statistics and probability › 19A Linear regression (x on y)"}, {"title": "Question 1", "ko": "", "q": "<p>The regression line of $y$ on $x$ is $y=0.5x+20$ and the regression line of $x$ on $y$ is $x=1.6y-28$.<\/p><p><b>(a)<\/b> Find $\\bar x$ and $\\bar y$.<\/p><p><b>(b)<\/b> Estimate $y$ when $x=24$.<\/p><p><b>(c)<\/b> Estimate $x$ when $y=35$.<\/p>", "guides": [{"q": "Where do both regression lines pass?", "qk": "두 직선이 공통으로 지나는 점은?", "a": "$(\\bar x,\\bar y)$", "ak": ""}], "steps": [["(a) Solve simultaneously", "$x=1.6(0.5x+20)-28=0.8x+4\\Rightarrow x=20$, $y=30$"], ["(b) $y$ on $x$", "$y=0.5(24)+20=32$"], ["(c) $x$ on $y$", "$x=1.6(35)-28=28$"]], "ans": "(a) $\\bar x=20,\\ \\bar y=30$ (b) 32 (c) 28", "fig": null, "ref": "", "type": "practice", "sec": "19A", "code": "19A", "crumb": "Ch 19 · AA: Statistics and probability › 19A Linear regression (x on y)"}, {"title": "Question 2", "ko": "", "q": "<p>The heights $h$ (cm) and masses $m$ (kg) of nine adults are shown.<\/p><table class=\"dt\"><tr><th>$h$<\/th><th>150<\/th><th>155<\/th><th>158<\/th><th>162<\/th><th>166<\/th><th>170<\/th><th>174<\/th><th>178<\/th><th>183<\/th><\/tr><tr><td>$m$<\/td><td>62<\/td><td>58<\/td><td>66<\/td><td>63<\/td><td>70<\/td><td>64<\/td><td>72<\/td><td>69<\/td><td>77<\/td><\/tr><\/table><p><b>(a)<\/b> Find $r$.<\/p><p><b>(b)<\/b> Find the regression line of $m$ on $h$ and use it to estimate the mass of a person 168 cm tall.<\/p><p><b>(c)<\/b> Find the regression line of $h$ on $m$ and use it to estimate the height of a person with mass 68 kg.<\/p>", "guides": [{"q": "Which variable is “x” for the line of $h$ on $m$?", "qk": "$h$ on $m$에서 독립변수는?", "a": "$m$", "ak": ""}], "steps": [["(a)", "$r=0.832$"], ["(b) $m$ on $h$", "$m=0.439h-6.16$ ⇒ $m(168)\\approx67.6$ kg"], ["(c) $h$ on $m$", "$h=1.58m+60.8$ ⇒ $h(68)\\approx168$ cm"]], "ans": "(a) 0.832 (b) 67.6 kg (c) 168 cm", "fig": null, "ref": "", "type": "practice", "sec": "19A", "code": "19A", "crumb": "Ch 19 · AA: Statistics and probability › 19A Linear regression (x on y)"}, {"title": "Question 3", "ko": "", "q": "<p>For a data set, $r=-1$. What can you say about the two regression lines? Explain.<\/p>", "guides": [{"q": "What does $r=-1$ mean about the points?", "qk": "$r=-1$이면 점들은?", "a": "All points lie exactly on a straight line with negative gradient.", "ak": "모든 점이 기울기가 음수인 한 직선 위에 있음."}], "steps": [["Perfect correlation", "All points lie on one line, so there is no error in either direction."], ["Conclusion", "The two regression lines are identical (the same line)."]], "ans": "They are the same line.", "fig": null, "ref": "", "type": "practice", "sec": "19A", "code": "19A", "crumb": "Ch 19 · AA: Statistics and probability › 19A Linear regression (x on y)"}, {"title": "How worried should a positive test make you?", "ko": "양성 판정이면 정말 병에 걸린 걸까?", "intro": "<p>A disease affects 2% of a population. A test gives a positive result for 95% of people who have the disease, but also for 8% of people who do not.<\/p>", "intro_ko": "어떤 병은 인구의 2%가 걸립니다. 검사는 환자의 95%를 양성으로, 환자가 아닌 사람의 8%도 (잘못) 양성으로 판정합니다.", "steps": [{"q": "Imagine 10 000 people. How many have the disease, and how many of them test positive?", "qk": "1만 명이라고 하면 환자는 몇 명이고 그중 양성은?", "a": "200 have it; $0.95\\times200=190$ test positive.", "ak": "환자 200명, 그중 양성 190명."}, {"q": "How many people <b>without<\/b> the disease test positive?", "qk": "환자가 아닌데 양성인 사람은?", "a": "$0.08\\times9800=784$", "ak": ""}, {"q": "Given that a person tests positive, what is the probability they have the disease?", "qk": "양성 판정을 받았다는 조건에서 실제 환자일 확률은?", "a": "$\\frac{190}{190+784}=\\frac{190}{974}\\approx0.195$", "ak": "약 19.5% — 생각보다 훨씬 작습니다!"}, {"q": "Why is the answer so much smaller than 95%?", "qk": "왜 95%보다 훨씬 작을까요?", "a": "The disease is rare, so most positive results come from the large group of healthy people.", "ak": "병이 드물어서, 양성의 대부분이 많은 수의 건강한 사람에게서 나오기 때문입니다."}], "idea": "$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}$. $P(D\\mid +)$ and $P(+\\mid D)$ are <b>very different<\/b> — always check which event is “given”.", "idea_ko": "$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}$. $P(D\\mid +)$와 $P(+\\mid D)$는 완전히 다릅니다 — 무엇이 “주어진” 사건인지 항상 확인하세요.", "fig": {"type": "tree", "first": [["D", "0.02"], ["D'", "0.98"]], "second": [[["+", "0.95", "0.019"], ["−", "0.05", "0.001"]], [["+", "0.08", "0.0784"], ["−", "0.92", "0.9016"]]]}, "type": "inquiry", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["conditional probability", "조건부확률", "$P(A\\mid B)$, read “$A$ given $B$”"], ["given that", "~라는 조건에서", "the event after “given that” goes after the bar"], ["independent", "독립", "$P(A\\mid B)=P(A)$"], ["reverse conditional", "거꾸로 된 조건부확률", "find $P(\\text{first}\\mid\\text{second})$ from a tree"], ["false positive", "위양성", "positive test but no disease"]], "phrases": [["Given that the bus is late, find the probability that it was raining.", "버스가 늦었다는 조건에서 비가 왔을 확률 → $P(R\\mid L)=\\frac{P(R\\cap L)}{P(L)}$"], ["Find the probability that the first counter was red, given that the second counter was red.", "두 번째가 빨강이라는 조건에서 첫 번째가 빨강일 확률"], ["Show that $A$ and $B$ are independent.", "독립임을 보이시오 → $P(A\\mid B)=P(A)$ 또는 $P(A\\cap B)=P(A)P(B)$"], ["Find $P(A\\mid B')$.", "$B$가 일어나지 않았다는 조건에서 $A$의 확률"]], "type": "vocab", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "The formula for conditional probability", "ko": "조건부확률 공식", "kp": "$$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}$$", "body": "<p>Rearranged: $P(A\\cap B)=P(A\\mid B)\\,P(B)$ — this is exactly what you do when you multiply along the branches of a tree diagram.<\/p>", "kn": "“given that ○○” → ○○이 분모! 수형도에서 가지를 곱하는 것이 바로 $P(A\\cap B)=P(B)P(A\\mid B)$입니다.", "tip": "", "guides": [{"q": "$P(A\\cap B)=0.12$ and $P(B)=0.3$. Find $P(A\\mid B)$.", "qk": "$P(A\\mid B)$를 구하세요.", "a": "$\\frac{0.12}{0.3}=0.4$", "ak": ""}], "fig": null, "type": "concept", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Independence", "ko": "독립의 판정", "kp": "$A$ and $B$ are independent if $$P(A\\mid B)=P(A)$$ or equivalently $P(A\\cap B)=P(A)P(B)$.", "body": "<p>In words: knowing that $B$ happened does not change the probability of $A$.<\/p>", "kn": "“B가 일어났다는 정보가 A의 확률을 바꾸지 않는다” = 독립. 증명할 때는 두 값을 각각 계산해서 같음(또는 다름)을 명시하세요.", "tip": "", "guides": [], "fig": null, "type": "concept", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Example 19B.1", "ko": "", "q": "<p>$P(A)=0.6$, $P(B)=0.5$ and $P(A\\cup B)=0.8$.<\/p><p><b>(a)<\/b> Find $P(A\\mid B)$.<\/p><p><b>(b)<\/b> Determine whether $A$ and $B$ are independent.<\/p><p><b>(c)<\/b> Find $P(B\\mid A')$.<\/p>", "guides": [{"q": "What do you need first for every part?", "qk": "모든 문항에 먼저 필요한 것은?", "a": "$P(A\\cap B)$", "ak": ""}], "steps": [["$P(A\\cap B)$", "$0.6+0.5-0.8=0.3$"], ["(a)", "$P(A\\mid B)=\\frac{0.3}{0.5}=0.6$"], ["(b)", "$P(A\\mid B)=0.6=P(A)$ ⇒ independent"], ["(c) $P(B\\cap A')$", "$P(B)-P(A\\cap B)=0.5-0.3=0.2$"], ["", "$P(B\\mid A')=\\frac{0.2}{0.4}=0.5$"]], "ans": "(a) 0.6 (b) independent (c) 0.5", "fig": null, "ref": "", "type": "example", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Example 19B.2", "ko": "", "q": "<p>Use the information in the inquiry: $P(D)=0.02$, $P(+\\mid D)=0.95$, $P(+\\mid D')=0.08$.<\/p><p><b>(a)<\/b> Find $P(+)$.<\/p><p><b>(b)<\/b> Find $P(D\\mid +)$.<\/p>", "guides": [{"q": "Which two tree paths end in “+”?", "qk": "“+”로 끝나는 경로 두 개는?", "a": "$D\\to+$ and $D'\\to+$", "ak": ""}], "steps": [["(a) add the two paths", "$0.02(0.95)+0.98(0.08)=0.019+0.0784=0.0974$"], ["(b) formula", "$P(D\\mid+)=\\dfrac{P(D\\cap+)}{P(+)}=\\dfrac{0.019}{0.0974}\\approx0.195$"]], "ans": "(a) 0.0974 (b) 0.195", "fig": null, "ref": "", "type": "example", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Question 1", "ko": "", "q": "<p>On any school day the probability that it rains is 0.3. If it rains, the probability that the bus is late is 0.4; otherwise it is 0.1 (see Section 7B).<\/p><p>Given that the bus is late, find the probability that it was raining.<\/p>", "guides": [{"q": "What is $P(L)$?", "qk": "$P(L)$은?", "a": "$0.12+0.07=0.19$", "ak": ""}, {"q": "What goes on top of the fraction?", "qk": "분자는?", "a": "$P(R\\cap L)=0.12$", "ak": ""}], "steps": [["$P(L)$", "$0.3(0.4)+0.7(0.1)=0.19$"], ["$P(R\\mid L)$", "$\\dfrac{0.12}{0.19}=\\dfrac{12}{19}\\approx0.632$"]], "ans": "$\\frac{12}{19}\\approx0.632$", "fig": null, "ref": "", "type": "practice", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Question 2", "ko": "", "q": "<p>Bag A contains 3 red and 2 blue balls. Bag B contains 1 red and 4 blue balls. A fair coin is tossed: heads → choose from bag A, tails → bag B. One ball is taken.<\/p><p><b>(a)<\/b> Find the probability that the ball is red.<\/p><p><b>(b)<\/b> Given that the ball is red, find the probability that it came from bag A.<\/p>", "guides": [{"q": "Draw the tree: first branch = bag, second = colour.", "qk": "수형도: 첫 가지 = 주머니, 두 번째 = 색.", "a": "$P(A\\cap R)=0.5(0.6)=0.3$, $P(B\\cap R)=0.5(0.2)=0.1$", "ak": ""}], "steps": [["(a)", "$0.3+0.1=0.4$"], ["(b)", "$\\dfrac{0.3}{0.4}=0.75$"]], "ans": "(a) 0.4 (b) 0.75", "fig": null, "ref": "", "type": "practice", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Question 3", "ko": "", "q": "<p>A bag has 5 red and 3 blue counters. Two are taken without replacement. Given that the second counter is red, find the probability that the first counter was red.<\/p>", "guides": [{"q": "Which paths have the second counter red?", "qk": "두 번째가 빨강인 경로는?", "a": "RR and BR", "ak": ""}], "steps": [["$P(\\text{2nd R})$", "$\\frac58\\cdot\\frac47+\\frac38\\cdot\\frac57=\\frac{20}{56}+\\frac{15}{56}=\\frac{35}{56}$"], ["$P(\\text{1st R}\\mid\\text{2nd R})$", "$\\dfrac{20/56}{35/56}=\\dfrac{20}{35}=\\dfrac47$"]], "ans": "$\\frac47$", "fig": null, "ref": "", "type": "practice", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Question 4", "ko": "", "q": "<p>$P(A)=0.35$, $P(B)=0.5$ and $P(A\\mid B)=0.4$.<\/p><p><b>(a)<\/b> Find $P(A\\cap B)$.<\/p><p><b>(b)<\/b> Find $P(A\\cup B)$.<\/p><p><b>(c)<\/b> Find $P(B\\mid A)$.<\/p><p><b>(d)<\/b> Are $A$ and $B$ independent? Justify.<\/p>", "guides": [{"q": "Rearrange the formula for (a).", "qk": "(a)를 위해 공식을 변형하세요.", "a": "$P(A\\cap B)=P(A\\mid B)P(B)$", "ak": ""}], "steps": [["(a)", "$0.4\\times0.5=0.2$"], ["(b)", "$0.35+0.5-0.2=0.65$"], ["(c)", "$\\frac{0.2}{0.35}=\\frac47\\approx0.571$"], ["(d)", "$P(A\\mid B)=0.4\\ne0.35=P(A)$ ⇒ not independent"]], "ans": "(a) 0.2 (b) 0.65 (c) $\\frac47$ (d) no", "fig": null, "ref": "", "type": "practice", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "조건부확률, 곱셈정리, 독립 (수능 버전)", "unit": "수능특강 04 조건부확률 · 1 조건부확률, 2 곱셈정리, 3 사건의 독립과 종속 (본문 44–49쪽)", "box": "<h4>⑴ 조건부확률<\/h4>$P(A)\\gt 0$일 때, 사건 $A$가 일어났을 때의 사건 $B$의 조건부확률은 $$P(B\\mid A)=\\frac{P(A\\cap B)}{P(A)}$$<h4>⑵ 확률의 곱셈정리<\/h4>$P(A\\cap B)=P(A)P(B\\mid A)=P(B)P(A\\mid B)$<h4>⑶ 독립과 종속<\/h4>$P(B\\mid A)=P(B)$이면 $A$와 $B$는 서로 <b>독립<\/b>, 독립이 아니면 <b>종속<\/b>. &nbsp; $A,B$가 독립 $\\iff P(A\\cap B)=P(A)P(B)$. 또 $A,B$가 독립이면 $A$와 $B^C$, $A^C$와 $B$, $A^C$와 $B^C$도 각각 독립이다.", "map": [["$P(B\\mid A)$", "$P(B\\mid A)$", "같음 — “$A$가 일어났을 때” = given that $A$"], ["확률의 곱셈정리", "multiplication rule / tree diagram", ""], ["독립 / 종속", "independent / not independent (dependent)", ""], ["$A$가 일어났을 때", "given that $A$ occurs", ""]], "ex": "", "tip": "수능 문장 “사건 $A$가 일어났을 때, 사건 $B$가 일어날 확률” = IB “Given that $A$ occurs, find the probability of $B$”. 조건이 되는 사건이 세로선 뒤(분모)에 갑니다.", "fig": null, "type": "ks", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "수능형 기초 1", "unit": "수능특강 04 조건부확률 · 1 조건부확률, 2 곱셈정리, 3 사건의 독립과 종속 (본문 44–49쪽)", "q": "<p>두 사건 $A,\\ B$에 대하여 $P(A)=0.4,\\ P(A\\cap B)=0.1$일 때, $P(B\\mid A)$의 값은?<\/p>", "choices": ["$0.1$", "$0.25$", "$0.3$", "$0.4$", "$0.5$"], "ans": "2", "guides": [{"q": "분모에 오는 확률은?", "qk": "denominator", "a": "$P(A)=0.4$", "ak": ""}], "steps": [["정의", "$P(B\\mid A)=\\frac{0.1}{0.4}=0.25$"]], "en": "$P(A)=0.4$ and $P(A\\cap B)=0.1$. Find $P(B\\mid A)$.", "pts": "[2점]", "ansText": "② 0.25", "fig": null, "type": "ksq", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "수능형 기초 2", "unit": "수능특강 04 조건부확률 · 1 조건부확률, 2 곱셈정리, 3 사건의 독립과 종속 (본문 44–49쪽)", "q": "<p>두 사건 $A,\\ B$는 서로 독립이고 $$P(A)=\\frac13,\\quad P(A\\cup B)=\\frac12$$일 때, $P(B)$의 값은?<\/p>", "choices": ["$\\dfrac16$", "$\\dfrac15$", "$\\dfrac14$", "$\\dfrac13$", "$\\dfrac12$"], "ans": "3", "guides": [{"q": "독립이면 $P(A\\cap B)$를 $P(B)=p$로 쓰면?", "qk": "independent", "a": "$\\frac13p$", "ak": ""}], "steps": [["덧셈정리", "$\\frac12=\\frac13+p-\\frac13p$"], ["정리", "$\\frac23p=\\frac16\\Rightarrow p=\\frac14$"]], "en": "Events $A$ and $B$ are independent, $P(A)=\\frac13$ and $P(A\\cup B)=\\frac12$. Find $P(B)$.", "pts": "[3점]", "ansText": "③ $\\frac14$", "fig": null, "type": "ksq", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "수능형 기초 3", "unit": "수능특강 04 조건부확률 · 1 조건부확률, 2 곱셈정리, 3 사건의 독립과 종속 (본문 44–49쪽)", "q": "<p>어느 학교 학생 200명이 두 동아리 A, B 중 하나에 가입하였다. 다음은 성별에 따라 조사한 결과이다.<\/p><table class=\"dt\"><tr><th><\/th><th>동아리 A<\/th><th>동아리 B<\/th><th>합계<\/th><\/tr><tr><td>남학생<\/td><td>40<\/td><td>60<\/td><td>100<\/td><\/tr><tr><td>여학생<\/td><td>70<\/td><td>30<\/td><td>100<\/td><\/tr><\/table><p>이 학교 학생 중 임의로 선택한 한 명이 여학생일 때, 이 학생이 동아리 A에 가입한 학생일 확률은 $\\dfrac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.)<\/p>", "choices": null, "ans": "17", "guides": [{"q": "“여학생일 때” → 새로운 표본공간은?", "qk": "restricted sample space", "a": "여학생 100명", "ak": ""}], "steps": [["조건부확률", "$P(A\\mid \\text{여}) = \\dfrac{70}{100}=\\dfrac{7}{10}$"], ["$p+q$", "$10+7=17$"]], "en": "A student is chosen at random. Given that the student is female, find the probability that she is in club A.", "pts": "[3점]", "ansText": "17", "fig": null, "type": "ksq", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "수능형 기초 4", "unit": "수능특강 04 조건부확률 · 1 조건부확률, 2 곱셈정리, 3 사건의 독립과 종속 (본문 44–49쪽)", "q": "<p>흰 공 3개와 검은 공 2개가 들어 있는 주머니에서 임의로 공을 한 개씩 두 번 꺼낸다. (꺼낸 공은 다시 넣지 않는다.) 두 번째 꺼낸 공이 흰 공일 때, 첫 번째 꺼낸 공도 흰 공일 확률은?<\/p>", "choices": ["$\\dfrac14$", "$\\dfrac13$", "$\\dfrac25$", "$\\dfrac12$", "$\\dfrac35$"], "ans": "4", "guides": [{"q": "두 번째가 흰 공인 경우는 어떤 두 경로인가요?", "qk": "two paths", "a": "흰→흰, 검→흰", "ak": ""}], "steps": [["곱셈정리", "$P(\\text{흰}\\cap\\text{흰})=\\frac35\\cdot\\frac24=\\frac{6}{20}$, &nbsp; $P(\\text{검}\\cap\\text{흰})=\\frac25\\cdot\\frac34=\\frac{6}{20}$"], ["두 번째가 흰 공", "$\\frac{6}{20}+\\frac{6}{20}=\\frac{12}{20}$"], ["조건부확률", "$\\dfrac{6/20}{12/20}=\\dfrac12$"]], "en": "Two balls are taken without replacement from a bag of 3 white and 2 black balls. Given that the second ball is white, find the probability that the first ball was white.", "pts": "[3점]", "ansText": "④ $\\frac12$", "fig": null, "type": "ksq", "sec": "19B", "code": "19B", "crumb": "Ch 19 · AA: Statistics and probability › 19B Conditional probability"}, {"title": "Which test result is more impressive?", "ko": "어느 시험 점수가 더 대단할까?", "intro": "<p>Ana scored 78 in a Maths test (mean 64, SD 10) and 76 in an English test (mean 70, SD 5). Both sets of scores are normally distributed.<\/p>", "intro_ko": "아나는 수학 78점(평균 64, SD 10), 영어 76점(평균 70, SD 5)을 받았습니다.", "steps": [{"q": "By how many marks is each score above the mean?", "qk": "각 점수는 평균보다 몇 점 높나요?", "a": "Maths: 14; English: 6", "ak": ""}, {"q": "How many <b>standard deviations<\/b> above the mean is each score?", "qk": "각각 평균보다 몇 “표준편차” 위인가요?", "a": "Maths: $\\frac{14}{10}=1.4$; English: $\\frac65=1.2$", "ak": ""}, {"q": "In which subject did she do better compared with the other students?", "qk": "다른 학생들과 비교하면 어느 과목을 더 잘 본 걸까요?", "a": "Maths — her $z$-score is higher.", "ak": "수학 — $z$값이 더 큼."}, {"q": "If $X\\sim N(\\mu,\\sigma^2)$ and we only know $P(X\\lt 30)=0.2$ and $\\sigma=4$, how could $z$ help us find $\\mu$?", "qk": "$P(X\\lt 30)=0.2$, $\\sigma=4$만 알 때 $z$로 $\\mu$를 어떻게 구할까?", "a": "Find $z$ with $P(Z\\lt z)=0.2$ using inverse normal on $N(0,1)$, then solve $z=\\frac{30-\\mu}{4}$.", "ak": "표준정규분포에서 $z$를 찾고 $z=\\frac{30-\\mu}{4}$를 풀어요."}], "idea": "The $z$-value $z=\\frac{x-\\mu}{\\sigma}$ counts standard deviations from the mean. Every normal variable can be standardised to $Z\\sim N(0,1)$, which lets us find an unknown $\\mu$ or $\\sigma$.", "idea_ko": "$z=\\frac{x-\\mu}{\\sigma}$는 평균에서 몇 표준편차 떨어져 있는지를 셉니다. 모든 정규분포를 $Z\\sim N(0,1)$로 표준화할 수 있고, 이를 이용해 모르는 $\\mu$나 $\\sigma$를 구합니다.", "fig": null, "type": "inquiry", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["standardize / standardization", "표준화하다 / 표준화", "convert $x$ to $z$"], ["$z$-value ($z$-score)", "$z$값", "$z=\\frac{x-\\mu}{\\sigma}$"], ["standard normal distribution", "표준정규분포", "$Z\\sim N(0,1)$"], ["unknown mean / standard deviation", "모르는 평균 / 표준편차", "find using inverse normal on $Z$"], ["simultaneous equations", "연립방정식", "when both $\\mu$ and $\\sigma$ are unknown"]], "phrases": [["Find the $z$-value of a score of 78.", "78점의 $z$값을 구하시오."], ["Given that $P(X\\lt 30)=0.2$, find $\\mu$.", "$P(X\\lt 30)=0.2$일 때 $\\mu$를 구하시오 → invNorm(0.2, 0, 1)"], ["Find the value of $\\sigma$.", "$\\sigma$의 값을 구하시오."], ["Find the mean and standard deviation of $X$.", "$X$의 평균과 표준편차를 구하시오 → 조건 2개 → 연립"]], "type": "vocab", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Standardization", "ko": "표준화", "kp": "If $X\\sim N(\\mu,\\sigma^2)$, the $z$-value of $x$ is $$z=\\frac{x-\\mu}{\\sigma}$$ and $Z=\\frac{X-\\mu}{\\sigma}\\sim N(0,1)$.", "body": "<p>$z\\gt 0$: above the mean; $z\\lt 0$: below the mean. $P(X\\lt x)=P(Z\\lt z)$.<\/p>", "kn": "$z$값은 “평균에서 몇 SD 떨어져 있나”입니다. 단위가 없어서 서로 다른 시험 점수를 공정하게 비교할 수 있어요.", "tip": "", "guides": [], "fig": null, "type": "concept", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Finding an unknown mean or standard deviation", "ko": "모르는 평균·표준편차 구하기", "kp": "1. Use inverse normal on $N(0,1)$ to find $z$.<br>2. Write $z=\\frac{x-\\mu}{\\sigma}$.<br>3. Solve for the unknown (two unknowns ⇒ two equations).", "body": "<p>Remember: inverse normal always uses the area to the <b>left<\/b>.<\/p>", "kn": "모르는 값이 있으면 GDC의 invNorm에 평균 0, 표준편차 1을 넣어 $z$를 먼저 구하세요. 두 개 다 모르면 조건 두 개로 연립방정식!", "tip": "", "guides": [], "fig": {"type": "normal", "mu": 0, "sd": 1, "b": -0.8416, "ticks": [{"v": -0.8416, "l": "z = −0.842"}, {"v": 0, "l": "0"}], "label": "area 0.2"}, "type": "concept", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Example 19C.1", "ko": "", "q": "<p>$X\\sim N(\\mu,\\ 4^2)$ and $P(X\\lt 30)=0.2$. Find $\\mu$.<\/p>", "guides": [{"q": "Is 30 above or below the mean? How do you know?", "qk": "30은 평균보다 위? 아래?", "a": "Below — only 20% of values are less than 30.", "ak": "아래 — 30보다 작은 값이 20%뿐."}], "steps": [["$z$ from $N(0,1)$", "invNorm$(0.2,0,1)$: $z=-0.8416$"], ["Standardize", "$\\dfrac{30-\\mu}{4}=-0.8416$"], ["Solve", "$\\mu=30+4(0.8416)=33.4$"]], "ans": "$\\mu\\approx33.4$", "fig": null, "ref": "", "type": "example", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Example 19C.2", "ko": "", "q": "<p>$X\\sim N(50,\\ \\sigma^2)$ and $P(X\\gt 58)=0.1$. Find $\\sigma$.<\/p>", "guides": [{"q": "What is the area to the left of 58?", "qk": "58의 왼쪽 넓이는?", "a": "0.9", "ak": ""}], "steps": [["$z$", "invNorm$(0.9,0,1)=1.2816$"], ["Standardize", "$\\dfrac{58-50}{\\sigma}=1.2816$"], ["Solve", "$\\sigma=\\dfrac{8}{1.2816}=6.24$"]], "ans": "$\\sigma\\approx6.24$", "fig": null, "ref": "", "type": "example", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Example 19C.3", "ko": "", "q": "<p>$X\\sim N(\\mu,\\ \\sigma^2)$, $P(X\\lt 20)=0.15$ and $P(X\\gt 35)=0.1$. Find $\\mu$ and $\\sigma$.<\/p>", "guides": [{"q": "How many equations do you need?", "qk": "식이 몇 개 필요한가요?", "a": "Two — one from each condition.", "ak": "두 개."}], "steps": [["$z$-values", "$P(Z\\lt z_1)=0.15\\Rightarrow z_1=-1.0364$; &nbsp; $P(Z\\lt z_2)=0.9\\Rightarrow z_2=1.2816$"], ["Equations", "$20=\\mu-1.0364\\sigma$ <br> $35=\\mu+1.2816\\sigma$"], ["Subtract", "$15=2.3180\\sigma\\Rightarrow\\sigma=6.47$"], ["Substitute", "$\\mu=20+1.0364(6.471)=26.7$"]], "ans": "$\\mu\\approx26.7$, $\\sigma\\approx6.47$", "fig": null, "ref": "", "type": "example", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Question 1", "ko": "", "q": "<p>In the inquiry, Ana scored 78 in Maths ($\\mu=64$, $\\sigma=10$) and 76 in English ($\\mu=70$, $\\sigma=5$). Find both $z$-values and state in which subject she performed better relative to the group.<\/p>", "guides": [{"q": "What does a bigger $z$ mean?", "qk": "$z$가 크다는 것은?", "a": "Further above the mean, relative to the spread.", "ak": "퍼짐을 고려했을 때 평균보다 더 위."}], "steps": [["Maths", "$z=\\frac{78-64}{10}=1.4$"], ["English", "$z=\\frac{76-70}{5}=1.2$"], ["Compare", "$1.4\\gt 1.2$ ⇒ Maths"]], "ans": "Maths ($z=1.4$ vs $1.2$)", "fig": null, "ref": "", "type": "practice", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Question 2", "ko": "", "q": "<p>$X\\sim N(\\mu,\\ 6^2)$ and $P(X\\gt 50)=0.25$. Find $\\mu$.<\/p>", "guides": [{"q": "Area to the left of 50?", "qk": "50의 왼쪽 넓이?", "a": "0.75", "ak": ""}], "steps": [["$z$", "invNorm$(0.75,0,1)=0.6745$"], ["Solve", "$\\frac{50-\\mu}{6}=0.6745\\Rightarrow\\mu=50-4.047=45.95$"]], "ans": "$\\mu\\approx46.0$", "fig": null, "ref": "", "type": "practice", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Question 3", "ko": "", "q": "<p>$X\\sim N(80,\\ \\sigma^2)$ and $P(X\\lt 70)=0.15$. Find $\\sigma$.<\/p>", "guides": [{"q": "Will the $z$-value be positive or negative?", "qk": "$z$의 부호는?", "a": "Negative (70 is below the mean).", "ak": "음수."}], "steps": [["$z$", "invNorm$(0.15,0,1)=-1.0364$"], ["Solve", "$\\frac{70-80}{\\sigma}=-1.0364\\Rightarrow\\sigma=\\frac{10}{1.0364}=9.65$"]], "ans": "$\\sigma\\approx9.65$", "fig": null, "ref": "", "type": "practice", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Question 4", "ko": "", "q": "<p>$X\\sim N(\\mu,\\ \\sigma^2)$ with $P(X\\lt 12)=0.2$ and $P(X\\lt 18)=0.85$. Find $\\mu$ and $\\sigma$.<\/p>", "guides": [{"q": "Write the two $z$-values.", "qk": "두 $z$값은?", "a": "$-0.8416$ and $1.0364$", "ak": ""}], "steps": [["Equations", "$12=\\mu-0.8416\\sigma$ <br> $18=\\mu+1.0364\\sigma$"], ["Subtract", "$6=1.8780\\sigma\\Rightarrow\\sigma=3.19$"], ["Substitute", "$\\mu=12+0.8416(3.195)=14.7$"]], "ans": "$\\mu\\approx14.7$, $\\sigma\\approx3.19$", "fig": null, "ref": "", "type": "practice", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "Question 5", "ko": "", "q": "<p>A machine makes nails whose length $L$ mm is normally distributed with $L\\sim N(50,\\ \\sigma^2)$.<\/p><p><b>(a)<\/b> Find $P(50-\\sigma\\lt L\\lt 50+2\\sigma)$.<\/p><p><b>(b)<\/b> Given that 6% of nails are shorter than 48.5 mm, find $\\sigma$.<\/p>", "guides": [{"q": "In (a), what are the $z$-values of the bounds?", "qk": "(a)에서 구간 양 끝의 $z$값은?", "a": "$-1$ and $2$ — you do not need to know $\\sigma$!", "ak": "−1과 2 — $\\sigma$를 몰라도 됩니다!"}], "steps": [["(a)", "$P(-1\\lt Z\\lt 2)=0.819$"], ["(b) $z$", "invNorm$(0.06,0,1)=-1.5548$"], ["Solve", "$\\frac{48.5-50}{\\sigma}=-1.5548\\Rightarrow\\sigma=0.965$"]], "ans": "(a) 0.819 (b) $\\sigma\\approx0.965$", "fig": null, "ref": "", "type": "practice", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "표준화와 표본평균의 분포 (수능 버전)", "unit": "수능특강 06 표준정규분포 (본문 78쪽) · 07 표본평균의 분포, 모평균의 추정 (90–95쪽)", "box": "<h4>⑴ 표준화<\/h4>$X\\sim N(m,\\sigma^2)$일 때 $Z=\\dfrac{X-m}{\\sigma}\\sim N(0,1)$. 수능에서는 표준정규분포표 $P(0\\le Z\\le z)$를 사용한다.<table class=\"dt\"><tr><th>$z$<\/th><th>0.5<\/th><th>1.0<\/th><th>1.5<\/th><th>2.0<\/th><th>2.5<\/th><\/tr><tr><td>$P(0\\le Z\\le z)$<\/td><td>0.1915<\/td><td>0.3413<\/td><td>0.4332<\/td><td>0.4772<\/td><td>0.4938<\/td><\/tr><\/table><h4>⑵ 표본평균의 평균·분산<\/h4>모평균 $m$, 모분산 $\\sigma^2$인 모집단에서 크기 $n$인 표본을 임의추출하면 $$E(\\bar X)=m,\\qquad V(\\bar X)=\\frac{\\sigma^2}{n},\\qquad \\sigma(\\bar X)=\\frac{\\sigma}{\\sqrt n}$$모집단이 정규분포 $N(m,\\sigma^2)$을 따르면 $\\bar X\\sim N\\left(m,\\ \\frac{\\sigma^2}{n}\\right)$.<h4>⑶ 모평균의 신뢰구간<\/h4>표본평균이 $\\bar x$일 때, 신뢰도 95%: $\\bar x-1.96\\dfrac{\\sigma}{\\sqrt n}\\le m\\le\\bar x+1.96\\dfrac{\\sigma}{\\sqrt n}$ &nbsp; (99%: 1.96 대신 2.58)", "map": [["$Z=\\frac{X-m}{\\sigma}$", "$z=\\frac{x-\\mu}{\\sigma}$", "IB 19C와 같음"], ["표준정규분포표", "GDC: inverse normal / normal cdf", ""], ["표본평균의 분포", "distribution of the sample mean", "IB AA에는 없음 (AI HL)"], ["신뢰구간", "confidence interval", "IB AA에는 없음"]], "ex": "", "tip": "IB AA 시험에는 표본평균 분포와 신뢰구간이 나오지 않지만, 표준화 $z=\\frac{x-\\mu}{\\sigma}$는 두 시험에서 똑같이 쓰입니다.", "fig": null, "type": "ks", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "수능형 기초 1", "unit": "수능특강 06 표준정규분포 (본문 78쪽) · 07 표본평균의 분포, 모평균의 추정 (90–95쪽)", "q": "<p>확률변수 $X$가 정규분포 $N(20,\\ \\sigma^2)$을 따르고 $P(X\\ge24)=0.1587$일 때, $\\sigma$의 값을 구하시오. (단, 아래 표준정규분포표를 이용한다.)<\/p><table class=\"dt\"><tr><th>$z$<\/th><th>0.5<\/th><th>1.0<\/th><th>1.5<\/th><th>2.0<\/th><th>2.5<\/th><\/tr><tr><td>$P(0\\le Z\\le z)$<\/td><td>0.1915<\/td><td>0.3413<\/td><td>0.4332<\/td><td>0.4772<\/td><td>0.4938<\/td><\/tr><\/table>", "choices": null, "ans": "4", "guides": [{"q": "$P(Z\\ge z)=0.1587$이면 $P(0\\le Z\\le z)$는?", "qk": "use the table", "a": "$0.5-0.1587=0.3413$ → $z=1$", "ak": ""}], "steps": [["표에서 $z$", "$P(0\\le Z\\le z)=0.3413\\Rightarrow z=1$"], ["표준화", "$\\dfrac{24-20}{\\sigma}=1\\Rightarrow\\sigma=4$"]], "en": "$X\\sim N(20,\\sigma^2)$ and $P(X\\ge24)=0.1587$. Find $\\sigma$.", "pts": "[3점]", "ansText": "4", "fig": null, "type": "ksq", "sec": "19C", "code": "19C", "crumb": "Ch 19 · AA: Statistics and probability › 19C Normal distribution: standardization"}, {"title": "수능형 기초 2", "unit": "수능특강 06 표준정규분포 (본문 78쪽) · 07 표본평균의 분포, 모평균의 추정 (90–95쪽)", "q": "<p>어느 시험의 점수는 평균 70점, 표준편차 10점인 정규분포를 따른다. 이 시험에서 85점 이상을 받은 학생의 비율은? (단, 아래 표준정규분포표를 이용한다.)<\/p><table class=\"dt\"><tr><th>$z$<\/th><th>0.5<\/th><th>1.0<\/th><th>1.5<\/th><th>2.0<\/th><th>2.5<\/th><\/tr><tr><td>$P(0\\le Z\\le z)$<\/td><td>0.1915<\/td><td>0.3413<\/td><td>0.4332<\/td><td>0.4772<\/td><td>0.4938<\/td><\/tr><\/table>", "choices": ["$0.0228$", "$0.0668$", "$0.1587$", "$0.3085$", "$0.4332$"], "ans": "2", "guides": [{"q": "85점의 $z$값은?", "qk": "$z$-value", "a": "$\\frac{85-70}{10}=1.5$", "ak": ""}], "steps": [["표준화", "$P(X\\ge85)=P(Z\\ge1.5)$"], ["표", "$0.5-0.4332=0.0668$"]], "en": "Scores are normally distributed with mean 70 and standard deviation 10. Find the proportion of students scoring at leas const fig = f => !f ? '' : (Array.isArray(f)?f:[f]).map(g=>`${g.cap?`<div style="text-align:center;font-weight:600;margin-top:.4rem">${g.cap}</div>`:''}<div class="fig">${FIG[g.type](g)}</div>`).join('');

    ${s.ex?`<div class="card ks-text"><b>예</b> ${s.ex}</div>`:''}${s.tip?`<div class="tip"><b>TIP</b> ${s.tip}</div>`:''}`;
  },
  ksq(s){
    const ch = s.choices ? `<div class="choices">${s.choices.map((c,i)=>`<button class="choice" data-t="ch" data-i="${i+1}" data-a="${s.ans}">${'①②③④⑤'[i]} ${c}</button>`).join('')}</div>`
      : `<div class="short-in">답 입력 <input type="text" data-a="${s.ans}"><button class="btn" data-t="chk">확인</button><span class="res"></span></div>`;
    return `<span class="tag ks">수능형 기초 · ${s.code}</span><h2 class="st">${s.title}<span class="pts">${s.pts||''}</span></h2><div class="ks-unit">📘 ${s.unit}</div>
    <div class="card ks-text">${s.q}${fig(s.fig)}${ch}</div>
    ${s.en?`<button class="btn" data-t="en">IB 영어 문장으로 보기</button><div class="en-box"><b class="lab">IB-STYLE ENGLISH</b>${s.en}</div>`:''}
    ${guides(s.guides,'생각의 흐름 · Guiding Questions')}
    <div class="sol-head"><button class="btn pri" data-t="sol">풀이 보기</button><button class="btn" data-t="step" style="display:none">다음 단계 ▸</button><button class="btn" data-t="allstep" style="display:none">전체 풀이</button></div>
    <div class="sol card ks-text">${steps(s.steps)}<div class="ks-ans">${s.ansText||s.ans}</div></div>`;
  },
  practice(s){return R.problem(s,false)}
};
/* ---------- side ---------- */
function buildSide(){
  let h=`<h1>${META.h1}</h1><div class="sub">${META.side}</div>`, lastCh='';
  SECS.forEach(x=>{
    if(x.ch!==lastCh){h+=`<div class="toc-ch">${x.ch}</div>`; lastCh=x.ch;}
    h+= x.tb ? `<button class="toc-sec toc-tb" data-go="${x.start}" data-sec="${x.code}">📖 ${x.name}</button>` : `<button class="toc-sec" data-go="${x.start}" data-sec="${x.code}">${x.code} ${x.name}<small>${x.ko}</small></button>`;
  });
  $('#side').innerHTML=h;
}
function secOf(i){ let k=-1; SECS.forEach((x,j)=>{ if(x.start<=i) k=j; }); return k; }
function secRange(k){ if(k<0) return [0, SECS.length?SECS[0].start:S.length]; return [SECS[k].start, k+1<SECS.length?SECS[k+1].start:S.length]; }
let curSec=null;
function show(i, keepScroll){
  cur=Math.max(0,Math.min(S.length-1,i));
  const k=secOf(cur), el=$('#slide');
  if(k!==curSec){
    curSec=k; const [a,b]=secRange(k);
    el.innerHTML = S.slice(a,b).map((s,j)=>`<section class="blk" id="b${a+j}" data-i="${a+j}">${R[s.type](s)}</section>`).join('');
    el.querySelectorAll('[data-fig]').forEach(d=>{try{const o=JSON.parse(d.dataset.fig); d.innerHTML=FIG[o.type](o);}catch(e){}});
    const nx=k+1<SECS.length?SECS[k+1]:null;
    if(nx) el.insertAdjacentHTML('beforeend',`<div class="next-sec"><button class="btn pri" data-go="${nx.start}">다음 단원 ▸ ${nx.code.endsWith('-Ex')||nx.code.endsWith('MP')?'📖 ':nx.code+' '}${nx.name}</button></div>`);
    typeset(el);
    const s=S[a]; $('#crumb').textContent = s.crumb||'';
    $('#count').textContent = k<0 ? 'Cover' : `${SECS[k].tb?'📖 ':SECS[k].code+' · '}${SECS[k].name}  (${b-a} cards)`;
    $('#prog > div').style.width=((k+1)/SECS.length*100)+'%';
    document.querySelectorAll('.toc-sec').forEach(x=>x.classList.toggle('on', k>=0 && x.dataset.sec===SECS[k].code));
    try{ localStorage.setItem(META.key, a); }catch(e){}
  }
  const tgt=document.getElementById('b'+cur), [a0]=secRange(k);
  if(!keepScroll){ if(cur===a0||!tgt) $('#stage').scrollTop=0; else tgt.scrollIntoView({block:'start'}); }
  try{ if(location.hash!=='#s'+(cur+1)) history.replaceState(null,'','#s'+(cur+1)); }catch(e){}
}
function goSec(d){ const k=secOf(cur)+d; if(k<-1||k>=SECS.length) return; show(k<0?0:SECS[k].start); }
document.addEventListener('click', e=>{
  const go=e.target.closest('[data-go]'); if(go){ show(+go.dataset.go); $('#side').classList.remove('open'); return; }
  const t=e.target.closest('[data-t]'); if(!t){ const sp=e.target.closest('.voc-quiz td.k span, .voc-quiz td.n span'); if(sp) sp.classList.toggle('see'); return; }
  const k=t.dataset.t, sl=t.closest('.blk')||$('#slide');
  if(k==='ga'){ const w=t.closest('.gq-item, .inq-step').querySelector('.ga-wrap'); w.classList.toggle('show'); t.textContent=w.classList.contains('show')?'숨기기':'답 보기'; }
  if(k==='ch'){ const ok=t.dataset.i===t.dataset.a; t.classList.add(ok?'right':'wrong'); if(ok) sl.querySelectorAll('.choice').forEach(c=>{if(c!==t) c.disabled=true;}); }
  if(k==='chk'){ const inp=t.parentNode.querySelector('input'), r=t.parentNode.querySelector('.res'); const ok=inp.value.replace(/\s/g,'')===inp.dataset.a; r.textContent=ok?'✓ 정답':'✗ 다시'; r.style.color=ok?'var(--green)':'var(--red)'; }
  if(k==='en'){ sl.querySelector('.en-box').classList.toggle('show'); }
  if(k==='idea'){ sl.querySelector('.big-idea').classList.toggle('show'); }
  if(k==='sol'){ const sol=sl.querySelector('.sol'); const on=!sol.classList.contains('show'); sol.classList.toggle('show',on);
     t.textContent=on?'풀이 닫기':'풀이 보기'; const more=sl.querySelectorAll('.step.hidden').length>0;
     sl.querySelectorAll('[data-t=step],[data-t=allstep]').forEach(x=>x.style.display=on&&more?'':'none'); }
  if(k==='step'||k==='allstep'){ const hid=sl.querySelectorAll('.step.hidden'); if(k==='step'&&hid[0]) hid[0].classList.remove('hidden'); else hid.forEach(h=>h.classList.remove('hidden'));
     if(!sl.querySelectorAll('.step.hidden').length){ sl.querySelector('[data-t=step]').style.display='none'; sl.querySelector('[data-t=allstep]').style.display='none'; } }
  if(k==='vquiz'){ const tb=sl.querySelector('table.voc'); tb.classList.toggle('voc-quiz'); sl.querySelectorAll('table.voc').forEach(x=>x.classList.toggle('voc-quiz', tb.classList.contains('voc-quiz'))); t.classList.toggle('on'); }
});
$('#openAll').onclick=()=>{const sl=$('#slide'); sl.querySelectorAll('.ga-wrap').forEach(w=>w.classList.add('show')); sl.querySelectorAll('.rv').forEach(b=>b.textContent='숨기기');
  sl.querySelectorAll('.sol,.big-idea,.en-box').forEach(w=>w.classList.add('show')); sl.querySelectorAll('.step').forEach(w=>w.classList.remove('hidden'));
  sl.querySelectorAll('[data-t=sol]').forEach(b=>b.textContent='풀이 닫기'); sl.querySelectorAll('[data-t=step],[data-t=allstep]').forEach(x=>x.style.display='none');
  sl.querySelectorAll('.voc-quiz').forEach(x=>x.classList.remove('voc-quiz'));};
$('#closeAll').onclick=()=>{const y=$('#stage').scrollTop; curSec=null; show(cur,true); $('#stage').scrollTop=y;};
$('#koBtn').onclick=e=>{document.body.classList.toggle('nok'); e.target.textContent=document.body.classList.contains('nok')?'한글 OFF':'한글 ON'; e.target.classList.toggle('on');};
$('#prev').onclick=()=>goSec(-1); $('#next').onclick=()=>goSec(1);
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight') goSec(1); if(e.key==='ArrowLeft') goSec(-1); });
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#s(\d+)$/); if(m&&+m[1]-1!==cur) show(+m[1]-1);});
buildSide();
let start=0; const m=location.hash.match(/^#s(\d+)$/); if(m) start=+m[1]-1; else { try{ start=+(localStorage.getItem(META.key)||0);}catch(e){} }
show(start);
})();
</script>
</body>
</html>
