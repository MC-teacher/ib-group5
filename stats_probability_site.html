<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Math AA · Statistics &amp; Probability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" defer></script>
<style>
:root{
  --paper:#fbfaf6; --ink:#1f2328; --muted:#5b6470; --line:#e2ded3;
  --navy:#1f3d63; --blue:#2c5d8f; --blue-bg:#eef4fb; --blue-line:#c9dbef;
  --gold:#b0862e; --gold-bg:#fbf5e6; --green:#2f7a4f; --green-bg:#eaf5ee;
  --red:#a8432f; --red-bg:#fbeeea; --purple:#5a4a8f; --purple-bg:#f1eef9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.7}
.ko{font-family:'Noto Sans KR',sans-serif}
/* layout */
#app{display:grid;grid-template-columns:290px 1fr;height:100vh}
#side{border-right:1px solid var(--line);background:#f4f1e8;overflow-y:auto;padding:1rem .8rem 2rem}
#side h1{font-size:1.05rem;margin:.2rem .3rem .2rem;color:var(--navy);line-height:1.3}
#side .sub{font-family:'Noto Sans KR';font-size:.75rem;color:var(--muted);margin:0 .3rem 1rem}
.toc-ch{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin:1rem .3rem .3rem}
.toc-sec{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:.35rem .5rem;border-radius:6px;font:inherit;font-size:.9rem;color:var(--ink);line-height:1.35}
.toc-sec:hover{background:#e9e4d6}
.toc-sec.on{background:var(--navy);color:#fff}
.toc-tb{padding-left:1.2rem;font-size:.82rem;color:#7a3a2c}
.toc-sec small{display:block;font-family:'Noto Sans KR';font-size:.72rem;opacity:.75}
#main{display:flex;flex-direction:column;height:100vh;min-width:0}
#bar{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
#crumb{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);flex:1;min-width:150px}
.btn{font-family:'Noto Sans KR';font-size:.78rem;border:1px solid var(--line);background:#fff;border-radius:6px;padding:.32rem .65rem;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3f0e7}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.on{background:var(--gold-bg);border-color:var(--gold)}
#prog{height:3px;background:var(--line)}
#prog > div{height:100%;background:var(--gold);transition:width .25s}
#stage{flex:1;overflow-y:auto;padding:2rem 2.2rem 4rem}
.slide{max-width:900px;margin:0 auto}
.blk{padding:1.6rem 0 2.2rem;border-bottom:1px solid var(--line)}
.blk:first-child{padding-top:0}
.next-sec{text-align:center;padding:2rem 0 3rem}
.blk .cover{padding-top:3vh}
#nav{display:flex;justify-content:space-between;align-items:center;padding:.55rem 1rem;border-top:1px solid var(--line);background:#fff}
#count{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted)}
#menuBtn{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  #side.open{transform:none}
  #menuBtn{display:inline-block}
  #stage{padding:1.2rem 1rem 3rem}
  body{font-size:17px}
}
/* slide pieces */
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.18rem .55rem;border-radius:4px;margin-bottom:.6rem}
.tag.inq{background:var(--purple-bg);color:var(--purple)}
.tag.voc{background:var(--gold-bg);color:var(--gold)}
.tag.kp{background:var(--green-bg);color:var(--green)}
.tag.ex{background:var(--blue-bg);color:var(--blue)}
.tag.pr{background:var(--red-bg);color:var(--red)}
.tag.sec{background:var(--navy);color:#fff}
h2.st{font-size:1.55rem;margin:.1rem 0 .2rem;color:var(--navy);line-height:1.3}
.st-ko{font-family:'Noto Sans KR';color:var(--muted);font-size:.9rem;margin-bottom:1.2rem}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.3rem;margin:1rem 0}
.q-text{font-size:1.04rem}
.q-text p{margin:.3rem 0 .6rem}
.kp-box{background:var(--green-bg);border:1px solid #c6e3d1;border-left:5px solid var(--green);border-radius:8px;padding:.9rem 1.2rem;margin:1rem 0}
.kp-box .kp-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;color:var(--green);letter-spacing:.08em}
.ko-note{font-family:'Noto Sans KR';font-size:.88rem;color:#4a4335;background:var(--gold-bg);border-left:3px solid #d9bf85;padding:.55rem .8rem;border-radius:4px;margin:.6rem 0;line-height:1.75}
.ko-note.blue{background:#f0f6fc;border-left-color:#7ea6cf;color:#283a4f}
.tip{font-family:'Noto Sans KR';font-size:.86rem;background:#fff8e1;border:1px dashed #e0c36b;border-radius:6px;padding:.5rem .8rem;margin:.8rem 0}
.tip b{color:var(--gold)}
/* guide box */
.guide-box{background:var(--blue-bg);border:1px solid var(--blue-line);border-left:4px solid var(--blue);border-radius:6px;padding:.75rem 1rem .85rem;margin:1rem 0}
.guide-title{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.35rem}
.gq-item{padding:.45rem 0;border-top:1px dashed var(--blue-line)}
.gq-item:first-of-type{border-top:0}
.gq{font-size:.98rem}
.gq .num{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--blue);font-weight:700;margin-right:.35rem}
.gq-ko{font-family:'Noto Sans KR';font-size:.84rem;color:#5c4d2c;border-left:3px solid #d9bf85;padding-left:.6rem;margin:.2rem 0 .3rem}
.ga-wrap{display:none;margin:.35rem 0 .1rem .9rem}
.ga-wrap.show{display:block}
.ga{font-size:.95rem;color:#173b5f}
.ga-ko{font-family:'Noto Sans KR';font-size:.83rem;color:#1f4f7d;border-left:3px solid #7ea6cf;padding-left:.6rem;margin-top:.15rem}
.rv{font-family:'Noto Sans KR';font-size:.72rem;border:1px solid var(--blue-line);background:#fff;color:var(--blue);border-radius:20px;padding:.08rem .6rem;cursor:pointer;margin-left:.3rem;vertical-align:middle}
.rv:hover{background:var(--blue)}
.rv:hover{color:#fff}
/* solution */
.sol-head{display:flex;gap:.5rem;align-items:center;margin-top:1.1rem;flex-wrap:wrap}
.sol{display:none;margin-top:.7rem}
.sol.show{display:block}
.step{display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:1rem;padding:.6rem 0;border-top:1px solid #efece4}
.tb-sol .step{grid-template-columns:72px 1fr}
.tb-sol .step-note{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--red);font-size:.8rem}
.step:first-child{border-top:0}
.step-note{font-family:'Noto Sans KR';font-size:.82rem;color:var(--muted);line-height:1.6}
.step-content{overflow-x:auto}
.step.hidden{display:none}
@media (max-width:640px){.step{grid-template-columns:1fr;gap:.2rem}}
.answer{margin-top:.8rem;background:var(--green-bg);border:1px solid #c6e3d1;border-radius:6px;padding:.5rem .9rem;font-weight:600}
.answer::before{content:'Answer  ';font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--green);letter-spacing:.06em}
.ref{font-family:'Noto Sans KR';font-size:.75rem;color:var(--muted);margin-top:.6rem}
/* vocab */
table.voc{width:100%;border-collapse:collapse;font-size:.95rem;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.voc th{background:#f4f1e8;font-family:'Noto Sans KR';font-size:.78rem;text-align:left;padding:.45rem .7rem;color:var(--muted)}
table.voc td{padding:.5rem .7rem;border-top:1px solid #efece4;vertical-align:top}
table.voc td.t{font-weight:700;color:var(--navy);white-space:nowrap}
table.voc td.k{font-family:'Noto Sans KR';font-size:.88rem;white-space:nowrap}
table.voc td.n{font-size:.9rem}
table.voc.ph td.t{white-space:normal;font-weight:600;font-style:italic;color:#2b3a4f}
table.voc.ph td.k{white-space:normal}
.voc-quiz td.k span,.voc-quiz td.n span{filter:blur(5px);cursor:pointer;transition:filter .15s}
.voc-quiz td.k span.see,.voc-quiz td.n span.see{filter:none}
h3.mini{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;margin:1.4rem 0 .5rem}
/* inquiry */
.inq-intro{background:var(--purple-bg);border:1px solid #d9d2ef;border-radius:8px;padding:.9rem 1.2rem}
.inq-step{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.7rem 1rem;margin:.7rem 0}
.inq-step .gq .num{color:var(--purple)}
.big-idea{display:none;margin-top:1rem;background:var(--navy);color:#fff;border-radius:8px;padding:.9rem 1.2rem}
.big-idea.show{display:block}
.big-idea .ko{color:#d8e3f0;font-size:.88rem;margin-top:.3rem}
.big-idea b.lab{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:#f0cf86}
/* misc */
table.dt{border-collapse:collapse;margin:.5rem 0;font-size:.95rem;background:#fff}
table.dt td,table.dt th{border:1px solid #cfc9bb;padding:.25rem .65rem;text-align:center}
table.dt th{background:#f4f1e8;font-weight:600}
.fig{display:flex;justify-content:center;margin:.6rem 0}
.fig svg{max-width:100%;height:auto}
.cover{text-align:center;padding-top:8vh}
.cover h1{font-size:2.3rem;color:var(--navy);margin:.2rem 0}
.cover .ko{color:var(--muted)}
.cover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin-top:2rem;text-align:left}
.cover-grid button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;cursor:pointer;font:inherit;text-align:left}
.cover-grid button:hover{border-color:var(--gold)}
.cover-grid b{display:block;color:var(--navy)}
.cover-grid span{font-family:'Noto Sans KR';font-size:.78rem;color:var(--muted)}
.legend{font-family:'Noto Sans KR';font-size:.85rem;color:var(--muted);margin-top:2rem;line-height:1.9}
.sec-list{margin:1rem 0;padding-left:1.2rem}
.sec-list li{margin:.3rem 0}
/* textbook */
.tb-note{font-family:'Noto Sans KR';font-size:.88rem;background:#fff;border:1px dashed #cfc9bb;border-radius:8px;padding:.7rem 1rem;color:#4a4335}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:.4rem;margin-top:1rem}
.qgrid button{font-family:'JetBrains Mono',monospace;font-size:.85rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.45rem 0;cursor:pointer}
.qgrid button:hover{border-color:var(--red);color:var(--red)}
/* 수능형 */
.tag.ks{background:#e3f1ef;color:#1d6f68}
.ks-unit{font-family:'Noto Sans KR';font-size:.8rem;color:#1d6f68;font-weight:700;margin-bottom:.8rem}
.ks-box{font-family:'Noto Sans KR';background:#f2f9f8;border:1px solid #bfe0db;border-left:5px solid #1d6f68;border-radius:8px;padding:.9rem 1.2rem;margin:1rem 0;line-height:1.95;font-size:.95rem}
.ks-box h4{margin:.6rem 0 .2rem;color:#1d6f68;font-size:.95rem}
.ks-box h4:first-child{margin-top:0}
.ks-text{font-family:'Noto Sans KR';font-size:.97rem;line-height:2}
table.map{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff;margin:.6rem 0}
table.map th{background:#e3f1ef;font-family:'Noto Sans KR';font-size:.78rem;padding:.4rem .6rem;text-align:left;color:#1d6f68}
table.map td{border-top:1px solid #e3ece9;padding:.4rem .6rem;vertical-align:top}
table.map td:first-child{font-family:'Noto Sans KR'}
.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem;margin:.9rem 0 .2rem}
@media (max-width:700px){.choices{grid-template-columns:repeat(2,1fr)}}
.choice{font:inherit;font-size:.98rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.45rem .5rem;cursor:pointer;text-align:left}
.choice:hover{border-color:#1d6f68}
.choice.right{background:var(--green-bg);border-color:var(--green)}
.choice.wrong{background:var(--red-bg);border-color:var(--red);opacity:.75}
.pts{font-family:'Noto Sans KR';font-size:.8rem;color:var(--muted);margin-left:.3rem}
.en-box{display:none;background:#f6f6fb;border:1px dashed #b9b4d6;border-radius:6px;padding:.6rem .9rem;margin-top:.7rem;font-size:.97rem}
.en-box.show{display:block}
.en-box b.lab{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--purple);letter-spacing:.06em;display:block;margin-bottom:.2rem}
.ks-ans{margin-top:.8rem;background:var(--green-bg);border:1px solid #c6e3d1;border-radius:6px;padding:.5rem .9rem;font-weight:600;font-family:'Noto Sans KR'}
.ks-ans::before{content:'정답  ';font-size:.75rem;color:var(--green)}
.short-in{display:flex;gap:.4rem;margin-top:.8rem;align-items:center;font-family:'Noto Sans KR';font-size:.88rem}
.short-in input{font:inherit;width:110px;padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px}
.short-in span.res{font-weight:700}
mjx-container[display="true"]{margin:.5em 0 !important;overflow-x:auto;overflow-y:hidden}
body.nok .gq-ko, body.nok .ga-ko, body.nok .big-idea .ko{display:none}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="main">
    <div id="bar">
      <button class="btn" id="menuBtn">☰</button>
      <div id="crumb"></div>
      <button class="btn" id="koBtn" title="한글 번역 보이기/숨기기">한글 ON</button>
      <button class="btn" id="openAll">모든 답 열기</button>
      <button class="btn" id="closeAll">모두 닫기</button>

    <div id="prog"><div></div></div>
    <div id="stage"><div class="slide" id="slide"></div></div>
    <div id="nav">
      <button class="btn" id="prev">← 이전 단원</button>
      <span id="count"></span>
      <button class="btn pri" id="next">다음 단원 →</button>
    </div>
  </div>
</div>
<script>
const DATA = {"slides": [{"crumb": "Statistics & Probability", "html": "이 사이트는 교과서 <b>Ch 6 · 7 · 8 · 19<\/b> (PDF p.157–248, p.467–484)의 흐름을 따라 만든 학습 자료입니다.<br>각 단원은 <b>Guided Inquiry<\/b> → <b>Key Vocabulary<\/b> → <b>Key Concept<\/b> → <b>Worked Example<\/b> → <b>Practice<\/b> 순서로 진행됩니다.<br>파란 상자의 질문은 <b>답 보기<\/b>로, 풀이는 <b>풀이 보기 → 다음 단계<\/b>로 한 단계씩 열 수 있어요. 청록색 <b>수능특강 연계<\/b> 슬라이드에는 같은 내용을 수능 표현으로 정리한 개념, 수능↔IB 표기 대응표, 5지선다·단답형 기초 문제가 있습니다. 단어장은 <b>퀴즈 모드<\/b>로 뜻을 가리고 연습할 수 있습니다. ← → 키로 이동.", "type": "cover", "sec": "", "code": ""}, {"title": "How many hours do CCA students sleep?", "ko": "우리 학교 학생들은 몇 시간 잘까?", "intro": "<p>The student council wants to know the <b>average number of hours of sleep<\/b> on a school night for all 600 students at the school. They do not have time to ask everyone, so they decide to ask only some of the students.<\/p>", "intro_ko": "학생회가 전교생 600명의 평균 수면 시간을 알고 싶어 합니다. 모두에게 물어볼 시간이 없어서 일부 학생에게만 묻기로 했어요.", "steps": [{"q": "In this situation, what is the <b>population<\/b>? What is a <b>sample<\/b>?", "qk": "이 상황에서 모집단은 무엇이고, 표본은 무엇일까요?", "a": "Population = all 600 students. Sample = the group of students actually asked.", "ak": "모집단은 전교생 600명, 표본은 실제로 설문에 응한 학생들입니다."}, {"q": "A council member suggests asking the students sitting near her in the cafeteria at lunch. Why might the result be <b>biased<\/b>?", "qk": "한 위원이 점심시간에 식당에서 자기 근처에 앉은 학생들에게 묻자고 합니다. 왜 결과가 치우칠(biased) 수 있을까요?", "a": "Those students are probably her friends, maybe in the same grade with similar habits, so the sample is not <b>representative<\/b> of the whole school.", "ak": "근처 학생들은 친구나 같은 학년일 가능성이 높아 생활 습관이 비슷하므로, 전체를 대표하지 못합니다."}, {"q": "The school has 150 Grade 9, 200 Grade 10, 130 Grade 11 and 120 Grade 12 students. If they want a sample of 60 that matches the grade proportions, how many should come from each grade?", "qk": "학년별 인원이 150, 200, 130, 120명입니다. 학년 비율에 맞추어 60명을 뽑으려면 학년별로 몇 명씩 뽑아야 할까요?", "a": "$\\frac{60}{600}=\\frac{1}{10}$ of each grade: 15, 20, 13, 12 students.", "ak": "각 학년의 1/10씩: 15명, 20명, 13명, 12명입니다."}, {"q": "One student writes “9.5 hours”, another writes “about 7”. Is “hours of sleep” <b>discrete<\/b> or <b>continuous<\/b> data? What about “number of siblings”?", "qk": "수면 시간은 이산형 자료일까요, 연속형 자료일까요? 형제자매 수는요?", "a": "Hours of sleep is measured, so it is continuous. Number of siblings is counted, so it is discrete.", "ak": "수면 시간은 “측정”하는 값이므로 연속형, 형제자매 수는 “세는” 값이므로 이산형입니다."}], "idea": "A good sample must be <b>representative<\/b> of the population. The way we choose the sample (the <b>sampling technique<\/b>) decides how much we can trust the result.", "idea_ko": "좋은 표본은 모집단을 대표해야 합니다. 표본을 고르는 방법(표본추출 방법)이 결과를 얼마나 믿을 수 있는지를 결정합니다.", "fig": null, "type": "inquiry", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["population", "모집단", "the whole group you want information about"], ["sample", "표본", "the part of the population that is actually studied"], ["representative", "대표성이 있는", "the sample reflects the population well"], ["bias / biased", "편향 / 치우친", "a systematic tendency to give results that are too high or too low"], ["reliable / reliability", "신뢰할 수 있는 / 신뢰도", "how much we can trust the data or the conclusion"], ["discrete data", "이산형 자료", "can only take separate values (usually counted): number of goals"], ["continuous data", "연속형 자료", "can take any value in a range (measured): height, time, mass"], ["outlier", "이상값", "a value far away from the rest of the data"], ["simple random sampling", "단순 무작위 추출", "every possible sample of that size is equally likely"], ["convenience sampling", "편의 추출", "choose people who are easy to reach"], ["systematic sampling", "계통 추출", "take every $k$th item from a list"], ["stratified sampling", "층화 추출", "split into groups, random sample from each group in proportion"], ["quota sampling", "할당 추출", "split into groups, convenience sample until each quota is filled"]], "phrases": [["Identify the sampling technique used.", "사용된 표본추출 방법의 이름을 쓰시오."], ["State whether the data is discrete or continuous.", "자료가 이산형인지 연속형인지 쓰시오. (이유는 짧게)"], ["Describe how a stratified sample of size 50 could be obtained.", "크기 50인 층화 표본을 어떻게 얻는지 설명하시오. → 집단별 인원 계산 + 각 집단에서 무작위 선택"], ["Give one reason why the sample may not be representative of the population.", "표본이 모집단을 대표하지 못할 수 있는 이유 한 가지를 쓰시오."], ["Suggest a more appropriate sampling method.", "더 적절한 표본추출 방법을 제안하시오."]], "type": "vocab", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Types of data and reliability", "ko": "자료의 종류와 신뢰도", "kp": "<b>Discrete<\/b> data can only take certain separate values (often whole numbers you <i>count<\/i>).<br><b>Continuous<\/b> data can take any value in an interval (values you <i>measure<\/i>).", "body": "<p>Before analysing data, check whether it is <b>reliable<\/b>. Unusual values (<b>outliers<\/b>) may be genuine, or may be errors (e.g. a person aged 250, a negative time). Errors should be removed; genuine outliers should usually be kept.<\/p><p>Shoe size is a common trap: it takes values like 7, 7.5, 8 — separate values — so it is <b>discrete<\/b>, even though it is not a whole number.<\/p>", "kn": "세는 것(count) → 이산형, 재는 것(measure) → 연속형. 신발 사이즈 7.5처럼 소수여도 “정해진 값만” 가능하면 이산형입니다. 오류값(나이 250세)은 제거, 진짜 이상값은 보통 남겨 둡니다.", "tip": "", "guides": [{"q": "Is “the time taken to run 100 m” discrete or continuous?", "qk": "100 m 달리기 기록은 이산형인가 연속형인가?", "a": "Continuous — time is measured.", "ak": "연속형 (측정값)."}, {"q": "Is “the number of emails received in a day” discrete or continuous?", "qk": "하루에 받은 이메일 수는?", "a": "Discrete — it is counted.", "ak": "이산형 (세는 값)."}], "fig": null, "type": "concept", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Five sampling techniques", "ko": "다섯 가지 표본추출 방법", "kp": "<table class=\"dt\"><tr><th>Technique<\/th><th>How it works<\/th><th>Random?<\/th><\/tr><tr><td>Simple random<\/td><td>every sample of size $n$ equally likely (random number generator)<\/td><td>yes<\/td><\/tr><tr><td>Convenience<\/td><td>choose whoever is available / easy to reach<\/td><td>no<\/td><\/tr><tr><td>Systematic<\/td><td>list the population, pick every $k$th one (random start)<\/td><td>partly<\/td><\/tr><tr><td>Stratified<\/td><td>split into groups (strata); random sample from each, <b>in proportion<\/b> to group size<\/td><td>yes<\/td><\/tr><tr><td>Quota<\/td><td>split into groups; convenience sample until each group’s quota is reached<\/td><td>no<\/td><\/tr><\/table>", "body": "<p>For a stratified sample of size $n$ from a population of size $N$, the number taken from a group of size $N_i$ is<\/p>$$n_i=\\frac{N_i}{N}\\times n.$$", "kn": "층화(stratified)와 할당(quota)은 둘 다 집단을 나누지만, <b>층화는 각 집단 안에서 무작위<\/b>, <b>할당은 편의대로<\/b> 채운다는 점이 다릅니다. 시험에서 이 차이를 자주 묻습니다.", "tip": "Rounding in stratified samples: round each group, then check that the total is still $n$.", "guides": [], "fig": null, "type": "concept", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Example 6A.1", "ko": "", "q": "<p>A sports club has 84 junior members, 140 adult members and 56 senior members. The manager wants a stratified sample of 40 members.<\/p><p><b>(a)<\/b> Find the number of members from each group that should be in the sample.<\/p><p><b>(b)<\/b> Describe how the junior members in the sample could be chosen.<\/p>", "guides": [{"q": "What is the total number of members?", "qk": "전체 회원 수는?", "a": "$84+140+56=280$", "ak": ""}, {"q": "What fraction of the club is in the sample?", "qk": "전체 중 몇 분의 몇을 뽑나요?", "a": "$\\frac{40}{280}=\\frac{1}{7}$", "ak": "1/7씩 뽑으면 됩니다."}], "steps": [["Total population", "$N=84+140+56=280$"], ["Sampling fraction", "$\\dfrac{40}{280}=\\dfrac{1}{7}$"], ["Multiply each group by the fraction", "Junior: $84\\times\\frac17=12$<br>Adult: $140\\times\\frac17=20$<br>Senior: $56\\times\\frac17=8$<br>Check: $12+20+8=40$ ✓"], ["(b) Random selection inside the group", "Number the junior members 1 to 84 and use a random number generator to choose 12 different numbers."]], "ans": "(a) 12 juniors, 20 adults, 8 seniors &nbsp; (b) number juniors 1–84, choose 12 at random", "fig": null, "ref": "", "type": "example", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Example 6A.2", "ko": "", "q": "<p>Identify the sampling technique in each case.<\/p><p><b>(a)<\/b> A reporter interviews the first 30 people who walk out of a supermarket.<\/p><p><b>(b)<\/b> A teacher lists all 250 students alphabetically, picks a random number from 1 to 10, then chooses that student and every 10th student after.<\/p><p><b>(c)<\/b> A researcher needs 20 men and 20 women. She stands in a park and asks people until she has 20 of each.<\/p><p><b>(d)<\/b> Each of 500 tickets is numbered and a computer randomly selects 25 numbers.<\/p>", "guides": [{"q": "In (c), are the groups chosen randomly inside each group?", "qk": "(c)에서 각 집단 안에서는 무작위로 뽑나요?", "a": "No — she asks whoever she meets.", "ak": "아니요, 만나는 사람에게 묻습니다 → 할당 추출."}], "steps": [["(a) whoever is easiest to reach", "Convenience sampling"], ["(b) every 10th from a list", "Systematic sampling"], ["(c) groups + fixed numbers, not random within groups", "Quota sampling"], ["(d) every set of 25 equally likely", "Simple random sampling"]], "ans": "(a) convenience (b) systematic (c) quota (d) simple random", "fig": null, "ref": "", "type": "example", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Question 1", "ko": "", "q": "<p>State whether each variable is discrete or continuous.<\/p><p><b>(a)<\/b> the mass of a newborn baby<\/p><p><b>(b)<\/b> the number of pages in a book<\/p><p><b>(c)<\/b> a dress size (6, 8, 10, …)<\/p><p><b>(d)<\/b> the temperature at noon<\/p>", "guides": [{"q": "Can you list every possible value (with gaps between them)?", "qk": "가능한 값을 하나씩 셀 수 있나요(값 사이에 틈이 있나요)?", "a": "If yes → discrete; if any value in a range is possible → continuous.", "ak": "셀 수 있으면 이산형, 구간 안 모든 값이 가능하면 연속형."}], "steps": [["(a) measured", "continuous"], ["(b) counted", "discrete"], ["(c) only certain sizes exist", "discrete"], ["(d) measured", "continuous"]], "ans": "(a) continuous (b) discrete (c) discrete (d) continuous", "fig": null, "ref": "", "type": "practice", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Question 2", "ko": "", "q": "<p>A school has 420 students in the IB programme: 230 in Year 1 and 190 in Year 2. A stratified sample of 42 students is to be taken.<\/p><p><b>(a)<\/b> Find how many Year 1 and Year 2 students should be in the sample.<\/p><p><b>(b)<\/b> Explain why stratified sampling may be better than simple random sampling here.<\/p>", "guides": [{"q": "What is the sampling fraction?", "qk": "추출 비율은?", "a": "$\\frac{42}{420}=\\frac{1}{10}$", "ak": ""}], "steps": [["Sampling fraction", "$\\frac{42}{420}=\\frac{1}{10}$"], ["Year 1", "$230\\times\\frac{1}{10}=23$"], ["Year 2", "$190\\times\\frac{1}{10}=19$"], ["(b) Reason", "Year 1 and Year 2 students may differ (e.g. workload). Stratified sampling guarantees both groups are represented in the correct proportion."]], "ans": "(a) 23 and 19 &nbsp; (b) guarantees both year groups are fairly represented", "fig": null, "ref": "", "type": "practice", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Question 3", "ko": "", "q": "<p>A factory produces 2400 phone cases per day. Quality control takes a <b>systematic sample<\/b> of 60 cases.<\/p><p><b>(a)<\/b> Describe how this sample could be taken.<\/p><p><b>(b)<\/b> Give one possible problem with systematic sampling in this context.<\/p>", "guides": [{"q": "Every how many cases should be chosen?", "qk": "몇 개마다 하나씩 뽑나요?", "a": "$2400\\div60=40$, so every 40th case.", "ak": "40개마다 하나씩."}], "steps": [["Interval", "$k=\\dfrac{2400}{60}=40$"], ["Method", "Choose a random starting number between 1 and 40, then take that case and every 40th case after it."], ["(b) Problem", "If a fault in the machine repeats regularly (e.g. every 40th case), the sample could always miss it or always hit it — the sample would be biased."]], "ans": "(a) random start in 1–40, then every 40th case (b) a periodic pattern in production could bias the sample", "fig": null, "ref": "", "type": "practice", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Question 4", "ko": "", "q": "<p>To find out how much time teenagers spend on social media, Jun posts an online survey on his own social media page and uses the first 100 replies.<\/p><p><b>(a)<\/b> Name the sampling technique.<\/p><p><b>(b)<\/b> Give two reasons why the sample may not be representative of all teenagers.<\/p>", "guides": [{"q": "Who can see Jun’s page?", "qk": "준의 페이지를 보는 사람은 누구인가요?", "a": "Mostly his friends — and only people who use social media.", "ak": "주로 친구들, 그리고 SNS를 사용하는 사람들뿐입니다."}], "steps": [["Technique", "Convenience sampling (first 100 who reply)."], ["Reason 1", "Teenagers who do not use social media cannot see the survey, so heavy users are over-represented."], ["Reason 2", "His followers are likely to be similar to him (same age, school, area)."]], "ans": "(a) convenience sampling (b) excludes non-users; followers are similar to Jun / the most active users reply first", "fig": null, "ref": "", "type": "practice", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Question 5", "ko": "", "q": "<p>The heights (in cm) of eight Grade 11 students are recorded:<\/p><p style=\"text-align:center\">$172,\\ 165,\\ 181,\\ 17.8,\\ 169,\\ 176,\\ 158,\\ 174$<\/p><p><b>(a)<\/b> Identify the value that is most likely to be an error, and suggest what it should be.<\/p><p><b>(b)<\/b> Should this value be removed before calculating the mean? Explain.<\/p>", "guides": [{"q": "Is a height of 17.8 cm possible for a Grade 11 student?", "qk": "고등학생 키가 17.8 cm일 수 있나요?", "a": "No — it is probably 178 cm with a misplaced decimal point.", "ak": "불가능 → 소수점 위치 오류로 178 cm일 가능성이 큼."}], "steps": [["Look for an impossible value", "$17.8$ cm is impossible for a teenager."], ["Likely correction", "Probably 178 cm (decimal point in wrong place)."], ["(b) Decision", "Yes — it is an error, not a genuine outlier. Remove it (or correct it if the true value can be confirmed)."]], "ans": "(a) 17.8 cm, probably 178 cm (b) yes, it is an error, so it should be removed or corrected", "fig": null, "ref": "", "type": "practice", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "모집단과 표본 (수능 버전)", "unit": "수능특강 07 통계적 추정 · 1 모집단과 표본 / 2 모평균과 표본평균 (본문 88쪽)", "box": "<h4>⑴ 모집단과 표본<\/h4>조사 대상 전체를 <b>모집단<\/b>, 조사하려고 뽑은 일부를 <b>표본<\/b>이라 한다. 모집단 전체를 조사하면 <b>전수조사<\/b>, 표본만 조사하면 <b>표본조사<\/b>이다.<h4>⑵ 임의추출<\/h4>모집단의 각 대상이 <b>같은 확률로<\/b> 뽑히도록 추출하는 방법. 한 번 뽑은 것을 되돌려 놓고 다시 뽑으면 <b>복원추출<\/b>, 되돌려 놓지 않으면 <b>비복원추출<\/b>.<h4>⑶ 모평균과 표본평균<\/h4>모집단의 평균·분산·표준편차를 $m,\\ \\sigma^2,\\ \\sigma$ (모평균, 모분산, 모표준편차)로 쓴다. 크기가 $n$인 표본 $X_1,\\cdots,X_n$에 대하여 $$\\bar{X}=\\frac{1}{n}\\sum_{i=1}^{n}X_i,\\qquad S^2=\\frac{1}{n-1}\\sum_{i=1}^{n}(X_i-\\bar{X})^2$$", "map": [["모집단 / 표본", "population / sample", ""], ["전수조사 / 표본조사", "census / sample survey", ""], ["임의추출", "simple random sampling", "수능은 임의추출만 다룸"], ["모평균 $m$", "population mean $\\mu$", "기호가 다름!"], ["표본평균 $\\bar X$", "sample mean $\\bar x$", ""], ["표본분산 $S^2$ ($n-1$로 나눔)", "IB GDC: $\\sigma_x^2$ ($n$으로 나눔), $s_x^2$ ($n-1$)", "IB 자료 요약은 $\\sigma_x$를 사용"]], "ex": "", "tip": "한국 표본분산 $S^2$는 $n-1$로 나누고, IB 6B에서 자료의 분산은 $n$으로 나눕니다. 같은 자료라도 값이 다르게 나와요.", "fig": null, "type": "ks", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "수능형 기초 1", "unit": "수능특강 07 통계적 추정 · 1 모집단과 표본 / 2 모평균과 표본평균 (본문 88쪽)", "q": "<p>다음 중 <b>표본조사<\/b>보다 <b>전수조사<\/b>가 더 적합한 것은?<\/p>", "choices": ["전구의 평균 수명 조사", "우리나라 고등학생의 평균 수면 시간 조사", "우리 반 학생의 혈액형 조사", "어느 공장 통조림의 염분 검사", "전국 유권자의 지지 정당 조사"], "ans": "3", "guides": [{"q": "조사하면 물건이 망가지거나, 대상이 너무 많은 경우는 무엇인가요?", "qk": "destructive testing / very large population", "a": "전구 수명, 통조림 검사는 조사하면 제품이 못 쓰게 되고, 전국 단위 조사는 대상이 너무 많아요.", "ak": ""}], "steps": [["파괴 검사", "①, ④는 조사하면 제품을 쓸 수 없으므로 표본조사"], ["대상이 매우 많음", "②, ⑤는 모집단이 매우 크므로 표본조사"], ["작은 집단", "③ 우리 반은 인원이 적어 전체를 조사할 수 있다 → 전수조사"]], "en": "Which of the following situations is most suitable for a <b>census<\/b> rather than a sample?", "pts": "[2점]", "ansText": "③", "fig": null, "type": "ksq", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "수능형 기초 2", "unit": "수능특강 07 통계적 추정 · 1 모집단과 표본 / 2 모평균과 표본평균 (본문 88쪽)", "q": "<p>어느 모집단에서 임의추출한 크기가 4인 표본이 $2,\\ 4,\\ 6,\\ 8$일 때, 표본분산 $S^2$의 값은?<\/p>", "choices": ["$5$", "$\\dfrac{20}{3}$", "$6$", "$7$", "$8$"], "ans": "2", "guides": [{"q": "표본평균 $\\bar X$는?", "qk": "sample mean", "a": "$\\frac{2+4+6+8}{4}=5$", "ak": ""}, {"q": "편차의 제곱의 합을 몇으로 나누나요?", "qk": "divide by $n$ or $n-1$?", "a": "$n-1=3$", "ak": ""}], "steps": [["표본평균", "$\\bar X=5$"], ["편차의 제곱의 합", "$(-3)^2+(-1)^2+1^2+3^2=20$"], ["$n-1$로 나누기", "$S^2=\\dfrac{20}{3}$"], ["비교 (IB)", "GDC의 $\\sigma_x^2=\\frac{20}{4}=5$ ← ①번은 IB 방식으로 계산했을 때의 함정 선택지"]], "en": "A random sample of size 4 is $2,4,6,8$. Find the <b>unbiased estimate of the population variance<\/b>, $s_{n-1}^2$.", "pts": "[2점]", "ansText": "② $\\frac{20}{3}$", "fig": null, "type": "ksq", "sec": "6A", "code": "6A", "crumb": "Ch 6 · Core: Statistics › 6A Sampling"}, {"title": "Exercise 6A · Worked Solutions", "ko": "6A 교과서 연습문제 풀이 — 번호를 누르면 풀이로 이동", "label": "Exercise 6A", "html": "교과서의 문제 번호와 같은 순서입니다. 문제를 먼저 풀고 풀이로 확인하세요.", "items": [[1, 16], [2, 17], [3, 18], [4, 19], [5, 20], [6, 21], [7, 22], [8, 23], [9, 24], [10, 25], [11, 26], [12, 27], [13, 28], [14, 29], [15, 30], [16, 31], [17, 32], [18, 33]], "type": "tbindex", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q1", "label": "Exercise 6A", "num": 1, "page": 136, "guides": [{"q": "What fraction of the sample comes from each group?", "qk": "각 집단에서 표본의 몇 %를 뽑나요?", "a": "", "ak": ""}], "steps": [["a", "$30\\%\\times30=9$ lions, &nbsp; $70\\%\\times30=21$ tigers"], ["b", "$45\\%\\times20=9$ strawberry, &nbsp; $55\\%\\times20=11$ chocolate"]], "ans": "(a) 9 lions, 21 tigers (b) 9 strawberry, 11 chocolate", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q2", "label": "Exercise 6A", "num": 2, "page": 136, "guides": [{"q": "Find the total first, then the sampling fraction.", "qk": "전체 수를 구한 뒤 추출 비율을 구하세요.", "a": "", "ak": ""}], "steps": [["a", "Total 200, fraction $\\frac{40}{200}=\\frac15$: boys $120\\times\\frac15=24$, girls $80\\times\\frac15=16$"], ["b", "Total 210, fraction $\\frac{45}{210}=\\frac{3}{14}$: HL $84\\times\\frac3{14}=18$, SL $126\\times\\frac3{14}=27$"]], "ans": "(a) 24 boys, 16 girls (b) 18 HL, 27 SL", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q3", "label": "Exercise 6A", "num": 3, "page": 136, "guides": [], "steps": [["a", "$0.25\\times40=10$ football, $0.35\\times40=14$ hockey, $0.40\\times40=16$ basketball"], ["b", "$0.30\\times20=6$ cod, $0.45\\times20=9$ haddock, $0.25\\times20=5$ mackerel"]], "ans": "(a) 10, 14, 16 (b) 6, 9, 5", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q4", "label": "Exercise 6A", "num": 4, "page": 136, "guides": [{"q": "Is the sampling fraction a simple number here?", "qk": "추출 비율이 간단한 수인가요?", "a": "", "ak": ""}], "steps": [["a", "Total $240+90+40=370$, fraction $\\frac{37}{370}=\\frac1{10}$: 24 chairs, 9 tables, 4 beds"], ["b", "Total $64+56+32=152$, fraction $\\frac{19}{152}=\\frac18$: 8 oak, 7 willow, 4 chestnut"]], "ans": "(a) 24, 9, 4 (b) 8, 7, 4", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q5", "label": "Exercise 6A", "num": 5, "page": 136, "guides": [{"q": "Who does Anke actually want to know about? Who does she actually ask?", "qk": "알고 싶은 대상과 실제로 묻는 대상은 각각 누구인가요?", "a": "", "ak": ""}], "steps": [["a", "All households in Germany."], ["b", "Convenience sampling."], ["c", "Her friends all live near one city-centre school; city households (often flats) may be less likely to own pets than households in the rest of Germany, and friends tend to have similar backgrounds."]], "ans": "(a) all households in Germany (b) convenience (c) e.g. only city families, similar to each other", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q6", "label": "Exercise 6A", "num": 6, "page": 136, "guides": [{"q": "To take a stratified sample, what must you know about each year group?", "qk": "층화 추출을 하려면 각 학년에 대해 무엇을 알아야 하나요?", "a": "", "ak": ""}], "steps": [["a", "The number of pupils in each year group (and the total number of pupils in the school)."], ["b", "Quota sampling."], ["c i", "10 minutes is a realistic homework time → keep it."], ["c ii", "20 hours in one evening is impossible → an error, discard it."]], "ans": "(a) number of pupils in each year (b) quota (c) keep 10 min, discard 20 h", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q7", "label": "Exercise 6A", "num": 7, "page": 136, "guides": [], "steps": [["a", "Convenience sampling."], ["b", "All residents of his village."], ["c", "People who use the bus at that time (e.g. commuters, students, people without a car) may have different attitudes to environmental issues from other residents."], ["d", "He would need a complete list of all residents and would have to contact every randomly chosen person, who might refuse to take part."]], "ans": "(a) convenience (b) residents of the village (c) bus users may hold different views (d) no list of residents / hard to reach chosen people", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q8", "label": "Exercise 6A", "num": 8, "page": 137, "guides": [{"q": "Can a truly random sample of 20 miss a whole group just by chance?", "qk": "무작위 표본도 우연히 한 집단을 빠뜨릴 수 있을까요?", "a": "", "ak": ""}], "steps": [["Comment", "Not necessarily true. In a random sample of only 20, it is quite possible by chance to get no 17-year-olds (especially if there are few 17-year-olds in the college). A missing group alone does not prove bias, although Joel could check how the sample was chosen."]], "ans": "Mingshan is not necessarily right — a small random sample can miss a group by chance.", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q9", "label": "Exercise 6A", "num": 9, "page": 137, "guides": [{"q": "If you test how long a bulb lasts, what happens to the bulb?", "qk": "전구 수명을 검사하면 그 전구는 어떻게 되나요?", "a": "", "ak": ""}], "steps": [["a", "Continuous (time is measured)."], ["b", "Testing the lifetime uses up the bulb — testing every bulb would leave none to sell (and would take too long)."], ["c", "5% means 1 in 20. Choose a random starting serial number between 1 and 20, then select that bulb and every 20th bulb after it."]], "ans": "(a) continuous (b) testing destroys the bulbs (c) random start 1–20, then every 20th serial number", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q10", "label": "Exercise 6A", "num": 10, "page": 137, "guides": [{"q": "Does taking 10 of each colour reflect how many of each colour are sold?", "qk": "색깔마다 10개씩 뽑으면 실제 판매 비율이 반영되나요?", "a": "", "ak": ""}], "steps": [["a", "Quota sampling."], ["b", "The colours are sold in different proportions; a stratified sample includes each colour in proportion to its sales (and is chosen randomly within each colour)."], ["c", "Red $0.30\\times40=12$, green $12$, blue $0.25\\times40=10$, white $0.15\\times40=6$"]], "ans": "(a) quota (b) colours sold in different proportions (c) 12, 12, 10, 6", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q11", "label": "Exercise 6A", "num": 11, "page": 137, "guides": [], "steps": [["a", "Quota sampling."], ["b", "Each species is represented in proportion to its population; a convenience sample might mostly contain the animals that are easiest to see."], ["c", "There is no list of all the animals, and individual animals cannot easily be identified or found once chosen."]], "ans": "(a) quota (b) each species represented in the right proportion (c) no list / animals hard to identify and find", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q12", "label": "Exercise 6A", "num": 12, "page": 137, "guides": [{"q": "Are basketball players typical students in height?", "qk": "농구부 학생들의 키가 평균적인가요?", "a": "", "ak": ""}], "steps": [["a", "Continuous."], ["b", "Basketball players are likely to be taller than average (and he only uses his friends)."], ["c", "Systematic sampling."], ["d", "Not every group of students is equally likely to be chosen — e.g. two students next to each other on the list can never both be in the sample."]], "ans": "(a) continuous (b) basketball players are taller (c) systematic (d) not every sample is equally likely", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q13", "label": "Exercise 6A", "num": 13, "page": 137, "guides": [{"q": "What is the total number of pets?", "qk": "반려동물은 모두 몇 마리인가요?", "a": "", "ak": ""}], "steps": [["Total", "$27+43+30=100$, fraction $\\frac{20}{100}=\\frac15$"], ["Each type", "cats $5.4\\approx5$, dogs $8.6\\approx9$, fish $6$"], ["Check", "$5+9+6=20$ ✓"]], "ans": "5 cats, 9 dogs, 6 fish", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q14", "label": "Exercise 6A", "num": 14, "page": 138, "guides": [{"q": "Total number of pupils?", "qk": "전체 학생 수는?", "a": "", "ak": ""}], "steps": [["a Total", "$40+52+50+0+37+21=200$, fraction $\\frac{20}{200}=\\frac1{10}$"], ["a Table", "Boys: 12 → 4, 13 → 5.2 ≈ 5, 14 → 5 <br>Girls: 12 → 0, 13 → 3.7 ≈ 4, 14 → 2.1 ≈ 2 <br>Check: $4+5+5+0+4+2=20$ ✓"], ["b", "No — the sample comes from one school only, which may not be typical (for example, it has no 12-year-old girls), so the results cannot be generalised to the whole country."]], "ans": "(a) Boys 4, 5, 5; Girls 0, 4, 2 (b) no — one unusual school", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q15", "label": "Exercise 6A", "num": 15, "page": 138, "guides": [], "steps": [["a", "Discrete (the number of spots is counted)."], ["b", "No — it would be impossible to find and catch every ladybird in the field."], ["c", "Convenience sampling."], ["d (2nd b)", "The ladybirds that are easiest to catch may be different (e.g. slower, older, a particular species), and they all come from one place and time."]], "ans": "(a) discrete (b) no (c) convenience (d) easiest-to-catch ladybirds may differ", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q16", "label": "Exercise 6A", "num": 16, "page": 138, "guides": [{"q": "If heights were random, how likely is it that 5 out of 6 are above average?", "qk": "키가 무작위라면 6명 중 5명 이상이 평균보다 클 확률은?", "a": "", "ak": ""}], "steps": [["a i", "Possible, but a sample of six is far too small to support this conclusion with confidence."], ["a ii", "Not necessarily — the result could easily happen by chance."], ["a iii", "Sensible: with only six children, five above average is not very unusual (about an 11% chance of 5 or more if each is equally likely above or below)."], ["b", "50 out of 60 would be very unlikely by chance, so it would be reasonable to conclude that children at this school are taller than average or that the sampling was biased."], ["c", "$-32$ cm is impossible → discard. 155 cm is tall but possible for an older primary-school child → keep."]], "ans": "(a) i weak ii not necessarily iii sensible (b) strong evidence (c) discard −32, keep 155", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q17", "label": "Exercise 6A", "num": 17, "page": 138, "guides": [{"q": "What fraction of people say “yes” no matter what?", "qk": "사실과 관계없이 “yes”라고 말하는 사람의 비율은?", "a": "", "ak": ""}], "steps": [["a", "Let $p$ = proportion who have taken drugs. $P(\\text{yes})=\\frac13+\\frac13p=\\frac{24}{60}=0.4\\Rightarrow p=0.2$ → 20%"], ["b i", "$P(\\text{True})=\\frac16(0.2)+\\frac56(0.8)=0.7$ ⇒ expected $0.7\\times120=84$"], ["b ii", "$\\frac16p+\\frac56(1-p)=\\frac{48}{120}=0.4\\Rightarrow\\frac56-\\frac46p=0.4\\Rightarrow p=0.65$ → 65%"]], "ans": "(a) 20% (b) i 84 ii 65%", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Q18", "label": "Exercise 6A", "num": 18, "page": 139, "guides": [{"q": "What fraction of the second sample is labelled? This should match what fraction of all cod?", "qk": "두 번째 표본 중 표시된 비율은 전체 대구 중 어떤 비율과 같아야 하나요?", "a": "", "ak": ""}], "steps": [["a", "$\\dfrac{20}{40\\,000}=\\dfrac{50\\,000}{N}\\Rightarrow N=\\dfrac{50\\,000\\times40\\,000}{20}=100\\,000\\,000$"], ["b", "e.g. the population does not change in six months (no births, deaths or migration); labelled cod mix evenly and are just as likely to be caught as unlabelled cod; labels are not lost."]], "ans": "(a) 100 million (b) closed population; labelled fish mix randomly and are equally catchable", "warn": "", "idx": 15, "type": "tb", "sec": "6A-Ex", "code": "6A-Ex", "crumb": "Ch 6 · Core: Statistics › 6A-Ex Exercise 6A"}, {"title": "Same average, different story", "ko": "평균이 같으면 같은 반일까?", "intro": "<p>Two classes took the same 10-point quiz.<\/p><table class=\"dt\"><tr><td>Class P<\/td><td>5<\/td><td>5<\/td><td>6<\/td><td>6<\/td><td>6<\/td><td>7<\/td><td>7<\/td><\/tr><tr><td>Class Q<\/td><td>1<\/td><td>3<\/td><td>6<\/td><td>6<\/td><td>6<\/td><td>9<\/td><td>11<\/td><\/tr><\/table>", "intro_ko": "두 반이 같은 10점 만점 퀴즈를 보았습니다. (Q반의 11점은 보너스 문제 포함)", "steps": [{"q": "Find the mean of each class.", "qk": "각 반의 평균을 구하세요.", "a": "P: $\\frac{42}{7}=6$. Q: $\\frac{42}{7}=6$. The means are equal.", "ak": "두 반 모두 평균 6점입니다."}, {"q": "Find the median of each class.", "qk": "각 반의 중앙값은?", "a": "Both medians are 6 (the 4th value).", "ak": "둘 다 6 (4번째 값)."}, {"q": "Do the two classes look the same? What is different?", "qk": "두 반이 같아 보이나요? 무엇이 다른가요?", "a": "No — Class Q is much more <b>spread out<\/b>. Its range is 10, but Class P’s range is only 2.", "ak": "아니요. Q반이 훨씬 넓게 퍼져 있습니다. 범위가 10 대 2."}, {"q": "Why do we need a second kind of number to describe data?", "qk": "자료를 설명하는 데 왜 두 번째 종류의 수가 필요할까요?", "a": "An average (central tendency) tells us the centre; a measure of <b>dispersion<\/b> tells us how spread out the data is.", "ak": "평균은 “중심”, 산포도는 “퍼짐 정도”를 알려 줍니다. 둘 다 있어야 자료를 제대로 설명할 수 있어요."}], "idea": "Every data set should be described by <b>a measure of central tendency<\/b> (mean, median, mode) <b>and<\/b> <b>a measure of dispersion<\/b> (range, IQR, standard deviation).", "idea_ko": "자료는 대푯값(평균, 중앙값, 최빈값)과 산포도(범위, IQR, 표준편차)를 함께 써서 설명합니다.", "fig": null, "type": "inquiry", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["mean", "평균", "$\\bar{x}=\\frac{\\sum x}{n}$"], ["median", "중앙값", "the middle value when data is in order"], ["mode / modal class", "최빈값 / 최빈 계급", "most common value / group"], ["measure of central tendency", "대푯값", "one number for the “centre”"], ["measure of dispersion (spread)", "산포도", "how spread out the data is"], ["range", "범위", "largest − smallest"], ["lower / upper quartile", "제1사분위수 / 제3사분위수", "$Q_1$: 25% below; $Q_3$: 75% below"], ["interquartile range (IQR)", "사분위수 범위", "$Q_3-Q_1$"], ["standard deviation", "표준편차", "$\\sigma$; typical distance from the mean"], ["variance", "분산", "$\\sigma^2$"], ["frequency", "도수", "how many times a value occurs"], ["grouped data / class interval", "계급으로 묶인 자료 / 계급 구간", "e.g. $10\\le t\\lt 20$"], ["mid-interval value", "계급값", "the midpoint of a class, used to estimate"]], "phrases": [["Write down the median.", "중앙값을 쓰시오. (“Write down” = 계산 거의 없이 바로 쓰기)"], ["Find the mean and standard deviation of the data.", "평균과 표준편차를 구하시오. (GDC 사용)"], ["Estimate the mean number of …", "평균을 “추정”하시오 → 계급값을 사용하는 묶인 자료라는 신호"], ["Determine whether 95 is an outlier. Justify your answer.", "95가 이상값인지 판단하고 근거를 쓰시오 → 울타리 $Q_3+1.5\\times IQR$ 계산"], ["Each value is increased by 4. Write down the new mean and the new standard deviation.", "모든 값에 4를 더했을 때 새 평균·새 표준편차를 쓰시오."]], "type": "vocab", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Mean, median, mode", "ko": "평균·중앙값·최빈값", "kp": "$$\\bar{x}=\\frac{\\sum x}{n}\\qquad\\text{for a frequency table: }\\ \\bar{x}=\\frac{\\sum f x}{\\sum f}$$", "body": "<p>The <b>median<\/b> is the middle value of the ordered data: the $\\frac{n+1}{2}$th value. For <b>grouped data<\/b> we do not know the exact values, so we use the <b>mid-interval value<\/b> of each class to <i>estimate<\/i> the mean, and we give the <b>modal class<\/b> instead of a mode.<\/p>", "kn": "계급으로 묶인 자료에서는 정확한 값을 모르므로 “계급값 × 도수”로 평균을 <b>추정(estimate)<\/b>합니다. 문제에 estimate라는 말이 나오면 이 방법입니다.", "tip": "The median is not affected by outliers, but the mean is. If the data has an outlier, the median is usually a better average.", "guides": [], "fig": null, "type": "concept", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Quartiles, IQR and outliers", "ko": "사분위수, IQR, 이상값", "kp": "$$\\text{IQR}=Q_3-Q_1$$ A value $x$ is an <b>outlier<\/b> if $$x\\lt Q_1-1.5\\times\\text{IQR}\\quad\\text{or}\\quad x\\gt Q_3+1.5\\times\\text{IQR}.$$", "body": "<p>Order the data. $Q_1$ is the median of the lower half and $Q_3$ is the median of the upper half (if $n$ is odd, leave the median out of both halves — this is what the GDC does).<\/p>", "kn": "$Q_1-1.5\\,\\text{IQR}$과 $Q_3+1.5\\,\\text{IQR}$을 “울타리(fence)”라고 생각하세요. 울타리 밖이면 이상값입니다.", "tip": "", "guides": [], "fig": null, "type": "concept", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Standard deviation and variance", "ko": "표준편차와 분산", "kp": "$$\\sigma=\\sqrt{\\frac{\\sum (x-\\bar{x})^2}{n}},\\qquad \\text{variance}=\\sigma^2$$", "body": "<p>The standard deviation measures the typical distance of the data from the mean. In IB exams you find it with the GDC (1-Var Stats, use $\\sigma_x$, not $s_x$).<\/p><p><b>Effect of constant changes<\/b><\/p><table class=\"dt\"><tr><th>Change to every value<\/th><th>mean / median / mode<\/th><th>SD / IQR / range<\/th><th>variance<\/th><\/tr><tr><td>add $k$<\/td><td>$+k$<\/td><td>no change<\/td><td>no change<\/td><\/tr><tr><td>multiply by $k\\ (k\\gt 0)$<\/td><td>$\\times k$<\/td><td>$\\times k$<\/td><td>$\\times k^2$<\/td><\/tr><\/table>", "kn": "GDC에서는 $\\sigma_x$를 씁니다($s_x$ 아님). 모든 값에 더하기는 “위치”만 옮기므로 퍼짐(SD, IQR)은 그대로, 곱하기는 퍼짐도 같이 늘어납니다. 분산은 $k^2$배!", "tip": "", "guides": [{"q": "Every value in a data set with mean 20 and SD 3 is multiplied by 2 and then 5 is added. Find the new mean and SD.", "qk": "평균 20, SD 3인 자료의 모든 값을 2배 한 뒤 5를 더하면?", "a": "Mean $=2(20)+5=45$, SD $=2(3)=6$.", "ak": "평균 45, 표준편차 6 (더한 5는 SD에 영향 없음)."}], "fig": null, "type": "concept", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Example 6B.1", "ko": "", "q": "<p>The times (in minutes) eleven students spent on homework last night were:<\/p><p style=\"text-align:center\">$35,\\ 42,\\ 28,\\ 50,\\ 45,\\ 38,\\ 95,\\ 40,\\ 33,\\ 47,\\ 41$<\/p><p><b>(a)<\/b> Find the mean and the standard deviation.<\/p><p><b>(b)<\/b> Find the median and the interquartile range.<\/p><p><b>(c)<\/b> Determine whether 95 is an outlier.<\/p><p><b>(d)<\/b> Which average better represents the data? Explain.<\/p>", "guides": [{"q": "How many values are there? Which position is the median?", "qk": "값이 몇 개? 중앙값은 몇 번째?", "a": "$n=11$, so the median is the $\\frac{11+1}{2}=6$th value.", "ak": "11개 → 6번째 값."}, {"q": "After ordering, what are the lower half and the upper half?", "qk": "정렬 후 아래쪽 절반과 위쪽 절반은?", "a": "Lower: 28, 33, 35, 38, 40. Upper: 42, 45, 47, 50, 95.", "ak": "중앙값 41을 빼고 5개씩."}], "steps": [["Order the data", "$28,\\ 33,\\ 35,\\ 38,\\ 40,\\ \\mathbf{41},\\ 42,\\ 45,\\ 47,\\ 50,\\ 95$"], ["(a) GDC: 1-Var Stats", "$\\sum x=494$, &nbsp; $\\bar{x}=\\frac{494}{11}=44.9$ (3 s.f.)<br>$\\sigma=16.95\\ldots\\approx 17.0$"], ["(b) Median = 6th value", "median $=41$"], ["Quartiles = medians of each half", "$Q_1=35,\\ Q_3=47$ &nbsp;⇒ IQR $=47-35=12$"], ["(c) Upper fence", "$Q_3+1.5\\times\\text{IQR}=47+18=65$"], ["Compare", "$95\\gt 65$, so 95 is an outlier."], ["(d) Choose the average", "The median (41): the mean is pulled up by the outlier 95, but the median is not affected."]], "ans": "(a) $\\bar x\\approx44.9$, $\\sigma\\approx17.0$ (b) median 41, IQR 12 (c) yes, $95\\gt 65$ (d) median", "fig": null, "ref": "", "type": "example", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Example 6B.2", "ko": "", "q": "<p>The table shows the time, $t$ minutes, that 50 customers waited at a bank.<\/p><table class=\"dt\"><tr><th>Time $t$<\/th><th>$0\\le t\\lt 10$<\/th><th>$10\\le t\\lt 20$<\/th><th>$20\\le t\\lt 30$<\/th><th>$30\\le t\\lt 40$<\/th><th>$40\\le t\\lt 60$<\/th><\/tr><tr><td>Frequency<\/td><td>6<\/td><td>14<\/td><td>18<\/td><td>9<\/td><td>3<\/td><\/tr><\/table><p><b>(a)<\/b> Write down the modal class.<\/p><p><b>(b)<\/b> Estimate the mean waiting time.<\/p><p><b>(c)<\/b> Estimate the standard deviation.<\/p>", "guides": [{"q": "Why can we only <i>estimate<\/i> the mean?", "qk": "왜 평균을 “추정”만 할 수 있나요?", "a": "We do not know the exact times inside each class, so we assume every value is at the mid-interval value.", "ak": "각 계급 안의 정확한 값을 모르므로 모두 계급값이라고 가정합니다."}, {"q": "What is the mid-interval value of $40\\le t\\lt 60$?", "qk": "마지막 계급의 계급값은?", "a": "$\\frac{40+60}{2}=50$ — careful, this class is wider!", "ak": "50 (폭이 다른 계급 주의!)."}], "steps": [["(a) highest frequency", "Modal class: $20\\le t\\lt 30$"], ["Mid-interval values", "$5,\\ 15,\\ 25,\\ 35,\\ 50$"], ["(b) $\\bar{x}=\\frac{\\sum fx}{\\sum f}$", "$\\dfrac{6(5)+14(15)+18(25)+9(35)+3(50)}{50}=\\dfrac{1155}{50}=23.1$ minutes"], ["(c) GDC: list of midpoints with frequencies", "$\\sigma\\approx 11.3$ minutes"]], "ans": "(a) $20\\le t\\lt 30$ (b) 23.1 min (c) 11.3 min", "fig": null, "ref": "", "type": "example", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Example 6B.3", "ko": "", "q": "<p>The temperatures in a city over one week have mean $12^\\circ$C and standard deviation $4^\\circ$C. They are converted to Fahrenheit using $F=1.8C+32$.<\/p><p>Find the mean and standard deviation of the temperatures in $^\\circ$F.<\/p>", "guides": [{"q": "Which part of $1.8C+32$ changes the spread?", "qk": "$1.8C+32$ 중 퍼짐을 바꾸는 것은?", "a": "Only the multiplication by 1.8. Adding 32 shifts the data but does not change the spread.", "ak": "곱하기 1.8만. 32를 더하는 건 이동일 뿐입니다."}], "steps": [["Mean: apply the whole rule", "$\\bar{F}=1.8(12)+32=53.6^\\circ$F"], ["SD: only the multiplication", "$\\sigma_F=1.8\\times4=7.2^\\circ$F"]], "ans": "mean $53.6^\\circ$F, SD $7.2^\\circ$F", "fig": null, "ref": "", "type": "example", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Question 1", "ko": "", "q": "<p>For the data $12,\\ 15,\\ 9,\\ 18,\\ 15,\\ 21,\\ 14,\\ 15,\\ 11,\\ 20$:<\/p><p><b>(a)<\/b> write down the mode<\/p><p><b>(b)<\/b> find the mean and the standard deviation<\/p><p><b>(c)<\/b> find the median and the interquartile range.<\/p>", "guides": [{"q": "With $n=10$ (even), how do you find the median?", "qk": "개수가 짝수일 때 중앙값은?", "a": "Average of the 5th and 6th ordered values.", "ak": "5번째와 6번째 값의 평균."}], "steps": [["Order", "$9,\\ 11,\\ 12,\\ 14,\\ 15,\\ 15,\\ 15,\\ 18,\\ 20,\\ 21$"], ["(a) Mode", "15 (appears 3 times)"], ["(b) GDC", "$\\bar x=\\frac{150}{10}=15$, &nbsp; $\\sigma=3.63$ (3 s.f.)"], ["(c) Median", "$\\frac{15+15}{2}=15$"], ["Quartiles (halves of 5)", "Lower half $9,11,\\mathbf{12},14,15$ ⇒ $Q_1=12$<br>Upper half $15,15,\\mathbf{18},20,21$ ⇒ $Q_3=18$<br>IQR $=6$"]], "ans": "(a) 15 (b) $\\bar x=15$, $\\sigma\\approx3.63$ (c) median 15, IQR 6", "fig": null, "ref": "", "type": "practice", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Question 2", "ko": "", "q": "<p>A survey asked 30 students how many siblings they have.<\/p><table class=\"dt\"><tr><th>Siblings<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><td>Frequency<\/td><td>7<\/td><td>12<\/td><td>8<\/td><td>2<\/td><td>1<\/td><\/tr><\/table><p><b>(a)<\/b> Find the mean number of siblings.<\/p><p><b>(b)<\/b> Find the standard deviation.<\/p><p><b>(c)<\/b> Find the median and the upper quartile.<\/p>", "guides": [{"q": "Is this grouped data? Is the mean exact or an estimate?", "qk": "묶인 자료인가요? 평균은 정확한 값인가요?", "a": "Not grouped — each value is exact, so the mean is exact.", "ak": "계급이 아니라 정확한 값이므로 평균도 정확합니다."}, {"q": "Which position is the median when $n=30$?", "qk": "$n=30$일 때 중앙값의 위치는?", "a": "Between the 15th and 16th values.", "ak": "15번째와 16번째 사이."}], "steps": [["(a) $\\frac{\\sum fx}{\\sum f}$", "$\\dfrac{0(7)+1(12)+2(8)+3(2)+4(1)}{30}=\\dfrac{38}{30}=1.27$ (3 s.f.)"], ["(b) GDC", "$\\sigma=0.998$ (3 s.f.)"], ["(c) Cumulative frequencies", "0: 7, &nbsp;1: 19, &nbsp;2: 27, &nbsp;3: 29, &nbsp;4: 30"], ["Median", "15th and 16th values are both 1 ⇒ median $=1$"], ["Upper quartile", "Upper half = values 16–30; its median is the 23rd value, which is 2 ⇒ $Q_3=2$"]], "ans": "(a) 1.27 (b) 0.998 (c) median 1, $Q_3=2$", "fig": null, "ref": "", "type": "practice", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Question 3", "ko": "", "q": "<p>The lower quartile of a data set is 23 and the upper quartile is 31.<\/p><p><b>(a)<\/b> Find the range of values that would be outliers.<\/p><p><b>(b)<\/b> The largest value is 44. Is it an outlier?<\/p>", "guides": [{"q": "What is the IQR?", "qk": "IQR은?", "a": "$31-23=8$", "ak": ""}], "steps": [["IQR", "$31-23=8$, &nbsp; $1.5\\times8=12$"], ["Fences", "Lower: $23-12=11$; Upper: $31+12=43$"], ["(a) Outliers", "$x\\lt 11$ or $x\\gt 43$"], ["(b) Compare", "$44\\gt 43$, so 44 is an outlier."]], "ans": "(a) $x\\lt 11$ or $x\\gt 43$ (b) yes", "fig": null, "ref": "", "type": "practice", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Question 4", "ko": "", "q": "<p>A set of exam marks has mean 52 and standard deviation 8. The teacher decides to scale the marks using $y=1.25x+5$.<\/p><p><b>(a)<\/b> Find the new mean.<\/p><p><b>(b)<\/b> Find the new standard deviation.<\/p><p><b>(c)<\/b> Find the new variance.<\/p>", "guides": [{"q": "Does “+5” affect the standard deviation?", "qk": "+5가 표준편차에 영향을 주나요?", "a": "No.", "ak": "아니요."}, {"q": "If the SD is multiplied by $k$, what happens to the variance?", "qk": "SD가 $k$배면 분산은?", "a": "It is multiplied by $k^2$.", "ak": "$k^2$배."}], "steps": [["(a)", "$1.25(52)+5=70$"], ["(b)", "$1.25\\times8=10$"], ["(c)", "$10^2=100$"]], "ans": "(a) 70 (b) 10 (c) 100", "fig": null, "ref": "", "type": "practice", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Question 5", "ko": "", "q": "<p>The mean of five numbers is 8. Four of the numbers are 3, 7, 10 and 12. Find the fifth number.<\/p>", "guides": [{"q": "What is the total of all five numbers?", "qk": "다섯 수의 합은?", "a": "$5\\times8=40$", "ak": "평균 × 개수 = 합"}], "steps": [["Total from the mean", "$\\sum x=n\\bar x=5\\times8=40$"], ["Subtract the known values", "$40-(3+7+10+12)=40-32=8$"]], "ans": "8", "fig": null, "ref": "", "type": "practice", "sec": "6B", "code": "6B", "crumb": "Ch 6 · Core: Statistics › 6B Summarizing data"}, {"title": "Exercise 6B · Worked Solutions", "ko": "6B 교과서 연습문제 풀이 — 번호를 누르면 풀이로 이동", "label": "Exercise 6B", "html": "교과서의 문제 번호와 같은 순서입니다. 문제를 먼저 풀고 풀이로 확인하세요.", "items": [[1, 48], [2, 49], [3, 50], [4, 51], [5, 52], [6, 53], [7, 54], [8, 55], [9, 56], [10, 57], [11, 58], [12, 59], [13, 60], [14, 61], [15, 62], [16, 63], [17, 64], [18, 65], [19, 66], [20, 67], [21, 68], [22, 69], [23, 70], [24, 71], [25, 72], [26, 73], [27, 74], [28, 75], [29, 76], [30, 77], [31, 78], [32, 79], [33, 80], [34, 81], [35, 82], [36, 83], [37, 84], [38, 85], [39, 86], [40, 87], [41, 88], [42, 89]], "type": "tbindex", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q1", "label": "Exercise 6B", "num": 1, "page": 145, "guides": [{"q": "Which original values fall into each class?", "qk": "각 계급에 원래 어떤 값들이 들어가나요?", "a": "", "ak": ""}], "steps": [["a", "$14.5\\le t\\lt 16.5$: 15, 16 → $2+1=3$ <br>$16.5\\le t\\lt 18.5$: 17, 18 → $7+5=12$ <br>$18.5\\le t\\lt 20.5$: 19, 20 → $3+0=3$ <br>$20.5\\le t\\lt 22.5$: 21, 22 → $1$ &nbsp; (the time 23 s needs one more class $22.5\\le t\\lt 24.5$: 1)"], ["b", "$14.5\\le t\\lt 17.5$: $2+1+7=10$ <br>$17.5\\le t\\lt 20.5$: $5+3+0=8$ <br>$20.5\\le t\\lt 23.5$: $1+0+1=2$"], ["Total", "20 observations"]], "ans": "(a) 3, 12, 3, 1 (+1 for 22.5–24.5) (b) 10, 8, 2; total 20", "warn": "교과서 (a) 표는 4칸인데 23초 기록 1개는 네 번째 계급(20.5–22.5)에 들어가지 않아요. 수업에서 계급을 하나 더 만들지 확인해 보세요.", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q2", "label": "Exercise 6B", "num": 2, "page": 146, "guides": [{"q": "A book recorded as “300” really has between 300 and 399 pages.", "qk": "“300”으로 기록된 책의 실제 쪽수 범위는?", "a": "", "ak": ""}], "steps": [["a", "$300\\le n\\lt 500$: $2+2=4$; &nbsp; $500\\le n\\lt 700$: $13+12=25$; &nbsp; $700\\le n\\lt 900$: $7+4=11$ &nbsp; (total 40)"], ["b", "$200\\le n\\lt 400$: $2+7=9$; &nbsp; $400\\le n\\lt 600$: $12+8=20$; &nbsp; $600\\le n\\lt 900$: $5+4+2=11$ &nbsp; (total 40)"]], "ans": "(a) 4, 25, 11 (b) 9, 20, 11; 40 books each", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q3", "label": "Exercise 6B", "num": 3, "page": 146, "guides": [], "steps": [["a", "mean $\\frac{27}{7}=3.86$, median 3, mode 1"], ["b", "mean $\\frac{39}{7}=5.57$, median 6, mode 6"]], "ans": "(a) 3.86, 3, 1 (b) 5.57, 6, 6", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q4", "label": "Exercise 6B", "num": 4, "page": 146, "guides": [{"q": "With 10 values, the median is the average of which two?", "qk": "값이 10개면 중앙값은 몇 번째와 몇 번째의 평균?", "a": "", "ak": ""}], "steps": [["a", "ordered: 2,3,3,3,4,5,5,6,8,8 → mean 4.7, median $\\frac{4+5}{2}=4.5$, mode 3"], ["b", "ordered: 12,24,24,24,24,25,33,36,55,55 → mean 31.2, median $\\frac{24+25}{2}=24.5$, mode 24"]], "ans": "(a) 4.7, 4.5, 3 (b) 31.2, 24.5, 24", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q5", "label": "Exercise 6B", "num": 5, "page": 146, "guides": [{"q": "Total = mean × number of values.", "qk": "합 = 평균 × 개수", "a": "", "ak": ""}], "steps": [["a", "$2+5+8+x+2x=5\\times9=45\\Rightarrow3x=30\\Rightarrow x=10$"], ["b", "$1+2+4+6+x+x+3=6\\times5=30\\Rightarrow2x=14\\Rightarrow x=7$"]], "ans": "(a) 10 (b) 7", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q6", "label": "Exercise 6B", "num": 6, "page": 146, "guides": [], "steps": [["a", "$x+(x+2)+3x+(4x+1)=4\\times8.5=34\\Rightarrow9x=31\\Rightarrow x=\\frac{31}{9}\\approx3.44$"], ["b", "$(x-3)+2x+(2x+1)+(3x-2)=4\\times11.2=44.8\\Rightarrow8x=48.8\\Rightarrow x=6.1$"]], "ans": "(a) $\\frac{31}{9}$ (b) 6.1", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q7", "label": "Exercise 6B", "num": 7, "page": 146, "guides": [{"q": "Use $\\sum fx=\\bar x\\sum f$.", "qk": "$\\sum fx = $ 평균 $\\times\\sum f$", "a": "", "ak": ""}], "steps": [["a", "$\\sum f=30$: $12+40+56+6y=5.6\\times30=168\\Rightarrow6y=60\\Rightarrow y=10$"], ["b", "$\\sum f=20$: $135+248+160+3y=34.95\\times20=699\\Rightarrow3y=156\\Rightarrow y=52$"]], "ans": "(a) 10 (b) 52", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q8", "label": "Exercise 6B", "num": 8, "page": 146, "guides": [], "steps": [["a", "$\\sum f=100$: $26y+166.4+109.8+175.2=571\\Rightarrow26y=119.6\\Rightarrow y=4.6$"], ["b", "$\\sum f=20$: $5y+18.9+21+7.6=58.5\\Rightarrow5y=11\\Rightarrow y=2.2$"]], "ans": "(a) 4.6 (b) 2.2", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q9", "label": "Exercise 6B", "num": 9, "page": 146, "guides": [{"q": "Mid-interval values?", "qk": "계급값은?", "a": "", "ak": ""}], "steps": [["a", "midpoints 5, 15, 25: $\\frac{75+180+200}{35}=13$; modal group $0\\le x\\lt 10$"], ["b", "midpoints 10, 20, 30: $\\frac{130+280+450}{42}=20.5$; modal group $25\\le x\\lt 35$"]], "ans": "(a) 13, $0\\le x\\lt 10$ (b) 20.5, $25\\le x\\lt 35$", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q10", "label": "Exercise 6B", "num": 10, "page": 146, "guides": [], "steps": [["a", "midpoints 11.5, 13.5, 15.5: $\\frac{785}{58}=13.5$; modal $12.5\\le x\\lt 14.5$"], ["b", "midpoints 5.5, 9.5, 13.5: $\\frac{961}{94}=10.2$; modal $11.5\\le x\\lt 15.5$"]], "ans": "(a) 13.5, $12.5\\le x\\lt 14.5$ (b) 10.2, $11.5\\le x\\lt 15.5$", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q11", "label": "Exercise 6B", "num": 11, "page": 147, "guides": [{"q": "Careful — the classes have different widths.", "qk": "계급의 폭이 서로 달라요.", "a": "", "ak": ""}], "steps": [["a", "midpoints 2.5, 8.5, 16: $\\frac{15+68+176}{25}=10.4$"], ["b", "midpoints 3.5, 5.5, 7.5: $\\frac{42+49.5+37.5}{26}=4.96$"]], "ans": "(a) 10.4 (b) 4.96", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q12", "label": "Exercise 6B", "num": 12, "page": 147, "guides": [], "steps": [["a", "midpoints 3, 4.5, 8: $\\frac{69+139.5+216}{81}=5.24$"], ["b", "midpoints 15.5, 30.5, 43: $\\frac{217+335.5+1118}{51}=32.8$"]], "ans": "(a) 5.24 (b) 32.8", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q13", "label": "Exercise 6B", "num": 13, "page": 147, "guides": [{"q": "Fences: $Q_1-1.5\\,\\text{IQR}$ and $Q_3+1.5\\,\\text{IQR}$.", "qk": "울타리를 계산하세요.", "a": "", "ak": ""}], "steps": [["a", "IQR 30: $50-45=5$, $80+45=125$ → $x\\lt 5$ or $x\\gt 125$"], ["b", "IQR 4: $16-6=10$, $20+6=26$ → $x\\lt 10$ or $x\\gt 26$"]], "ans": "(a) $x\\lt 5$ or $x\\gt 125$ (b) $x\\lt 10$ or $x\\gt 26$", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q14", "label": "Exercise 6B", "num": 14, "page": 147, "guides": [], "steps": [["a", "IQR 4: $6.5-6=0.5$, $10.5+6=16.5$ → $x\\lt 0.5$ or $x\\gt 16.5$"], ["b", "IQR 12: $33.5-18=15.5$, $45.5+18=63.5$ → $x\\lt 15.5$ or $x\\gt 63.5$"]], "ans": "(a) $x\\lt 0.5$ or $x\\gt 16.5$ (b) $x\\lt 15.5$ or $x\\gt 63.5$", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q15", "label": "Exercise 6B", "num": 15, "page": 147, "guides": [{"q": "Does adding a constant change the spread?", "qk": "상수를 더하면 퍼짐이 바뀌나요?", "a": "", "ak": ""}], "steps": [["a", "mean $34+12=46$, SD 8"], ["b", "mean $162-100=62$, SD 18"]], "ans": "(a) 46, 8 (b) 62, 18", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q16", "label": "Exercise 6B", "num": 16, "page": 147, "guides": [], "steps": [["a", "median 25, IQR 13"], ["b", "median 0.5, IQR 2.1"]], "ans": "(a) 25, 13 (b) 0.5, 2.1", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q17", "label": "Exercise 6B", "num": 17, "page": 147, "guides": [{"q": "Multiplying scales both the average and the spread.", "qk": "곱하면 대푯값과 퍼짐이 모두 같은 배수로 변해요.", "a": "", "ak": ""}], "steps": [["a", "median 360, IQR 180"], ["b", "median 5, IQR 2.6"]], "ans": "(a) 360, 180 (b) 5, 2.6", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q18", "label": "Exercise 6B", "num": 18, "page": 147, "guides": [], "steps": [["a", "mean 8, SD 3"], ["b", "mean 41, SD 3"]], "ans": "(a) 8, 3 (b) 41, 3", "warn": "", "idx": 47, "type": "tb", "sec": "6B ongs", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q23", "label": "Exercise 6B", "num": 23, "page": 148, "guides": [], "steps": [["Order", "1, 2, 3, 3, 3, 4, 5, 6, 6, 8, 11"], ["a", "median 4"], ["b", "$Q_1=3$, $Q_3=6$ → IQR 3"], ["c", "Fences: $3-4.5=-1.5$, $6+4.5=10.5$. $11\\gt 10.5$ → 11 is an outlier."]], "ans": "(a) 4 (b) 3 (c) yes, 11", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q24", "label": "Exercise 6B", "num": 24, "page": 148, "guides": [{"q": "Which foot lengths are in $20.5\\le l\\lt 23.5$?", "qk": "이 계급에 들어가는 길이는?", "a": "", "ak": ""}], "steps": [["a", "67"], ["b", "23 cm"], ["c", "$\\frac{1653}{67}=24.7$ cm"], ["d", "$20.5\\le l\\lt 23.5$: 23; &nbsp; $23.5\\le l\\lt 26.5$: 30; &nbsp; $26.5\\le l\\lt 29.5$: 14"], ["e", "$30+14=44$"], ["f", "No — the modal group is $23.5\\le l\\lt 26.5$ but the mode is 23 cm."]], "ans": "(a) 67 (b) 23 (c) 24.7 (d) 23, 30, 14 (e) 44 (f) no", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q25", "label": "Exercise 6B", "num": 25, "page": 148, "guides": [], "steps": [["a", "$2+5+(a+2)+2a+(3a+1)=85\\Rightarrow6a+10=85\\Rightarrow a=12.5$"], ["b", "values 2, 5, 14.5, 25, 38.5 → $\\sigma=13.4$"]], "ans": "(a) 12.5 (b) 13.4", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q26", "label": "Exercise 6B", "num": 26, "page": 148, "guides": [], "steps": [["a", "$2x+(x+1)+3x+(4x-3)+x+(x-1)=63\\Rightarrow12x-3=63\\Rightarrow x=5.5$"], ["b", "values 11, 6.5, 16.5, 19, 5.5, 4.5 → $\\sigma^2=30.9$"]], "ans": "(a) 5.5 (b) 30.9", "warn": "", "idx": 47, "type": "tb", "sec": "6B-Ex", "code": "6B-Ex", "crumb": "Ch 6 · Core: Statistics › 6B-Ex Exercise 6B"}, {"title": "Q27", "labe
