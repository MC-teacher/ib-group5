<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Math AA HL · Probability (Ch 9)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" defer></script>
<style>
:root{
  --paper:#fbfaf6; --ink:#1f2328; --muted:#5b6470; --line:#e2ded3;
  --navy:#1f3d63; --blue:#2c5d8f; --blue-bg:#eef4fb; --blue-line:#c9dbef;
  --gold:#b0862e; --gold-bg:#fbf5e6; --green:#2f7a4f; --green-bg:#eaf5ee;
  --red:#a8432f; --red-bg:#fbeeea; --purple:#5a4a8f; --purple-bg:#f1eef9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.7}
.ko{font-family:'Noto Sans KR',sans-serif}
/* layout */
#app{display:grid;grid-template-columns:290px 1fr;height:100vh}
#side{border-right:1px solid var(--line);background:#f4f1e8;overflow-y:auto;padding:1rem .8rem 2rem}
#side h1{font-size:1.05rem;margin:.2rem .3rem .2rem;color:var(--navy);line-height:1.3}
#side .sub{font-family:'Noto Sans KR';font-size:.75rem;color:var(--muted);margin:0 .3rem 1rem}
.toc-ch{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin:1rem .3rem .3rem}
.toc-sec{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:.35rem .5rem;border-radius:6px;font:inherit;font-size:.9rem;color:var(--ink);line-height:1.35}
.toc-sec:hover{background:#e9e4d6}
.toc-sec.on{background:var(--navy);color:#fff}
.toc-tb{padding-left:1.2rem;font-size:.82rem;color:#7a3a2c}
.toc-sec small{display:block;font-family:'Noto Sans KR';font-size:.72rem;opacity:.75}
#main{display:flex;flex-direction:column;height:100vh;min-width:0}
#bar{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
#crumb{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);flex:1;min-width:150px}
.btn{font-family:'Noto Sans KR';font-size:.78rem;border:1px solid var(--line);background:#fff;border-radius:6px;padding:.32rem .65rem;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3f0e7}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.on{background:var(--gold-bg);border-color:var(--gold)}
#prog{height:3px;background:var(--line)}
#prog > div{height:100%;background:var(--gold);transition:width .25s}
#stage{flex:1;overflow-y:auto;padding:2rem 2.2rem 4rem}
.slide{max-width:900px;margin:0 auto}
.blk{padding:1.6rem 0 2.2rem;border-bottom:1px solid var(--line)}
.blk:first-child{padding-top:0}
.next-sec{text-align:center;padding:2rem 0 3rem}
.blk .cover{padding-top:3vh}
#nav{display:flex;justify-content:space-between;align-items:center;padding:.55rem 1rem;border-top:1px solid var(--line);background:#fff}
#count{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted)}
#menuBtn{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  #side.open{transform:none}
  #menuBtn{display:inline-block}
  #stage{padding:1.2rem 1rem 3rem}
  body{font-size:17px}
}
/* slide pieces */
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.18rem .55rem;border-radius:4px;margin-bottom:.6rem}
.tag.inq{background:var(--purple-bg);color:var(--purple)}
.tag.voc{background:var(--gold-bg);color:var(--gold)}
.tag.kp{background:var(--green-bg);color:var(--green)}
.tag.ex{background:var(--blue-bg);color:var(--blue)}
.tag.pr{background:var(--red-bg);color:var(--red)}
.tag.sec{background:var(--navy);color:#fff}
h2.st{font-size:1.55rem;margin:.1rem 0 .2rem;color:var(--navy);line-height:1.3}
.st-ko{font-family:'Noto Sans KR';color:var(--muted);font-size:.9rem;margin-bottom:1.2rem}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.3rem;margin:1rem 0}
.q-text{font-size:1.04rem}
.q-text p{margin:.3rem 0 .6rem}
.kp-box{background:var(--green-bg);border:1px solid #c6e3d1;border-left:5px solid var(--green);border-radius:8px;padding:.9rem 1.2rem;margin:1rem 0}
.kp-box .kp-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;color:var(--green);letter-spacing:.08em}
.ko-note{font-family:'Noto Sans KR';font-size:.88rem;color:#4a4335;background:var(--gold-bg);border-left:3px solid #d9bf85;padding:.55rem .8rem;border-radius:4px;margin:.6rem 0;line-height:1.75}
.ko-note.blue{background:#f0f6fc;border-left-color:#7ea6cf;color:#283a4f}
.tip{font-family:'Noto Sans KR';font-size:.86rem;background:#fff8e1;border:1px dashed #e0c36b;border-radius:6px;padding:.5rem .8rem;margin:.8rem 0}
.tip b{color:var(--gold)}
/* guide box */
.guide-box{background:var(--blue-bg);border:1px solid var(--blue-line);border-left:4px solid var(--blue);border-radius:6px;padding:.75rem 1rem .85rem;margin:1rem 0}
.guide-title{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.35rem}
.gq-item{padding:.45rem 0;border-top:1px dashed var(--blue-line)}
.gq-item:first-of-type{border-top:0}
.gq{font-size:.98rem}
.gq .num{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--blue);font-weight:700;margin-right:.35rem}
.gq-ko{font-family:'Noto Sans KR';font-size:.84rem;color:#5c4d2c;border-left:3px solid #d9bf85;padding-left:.6rem;margin:.2rem 0 .3rem}
.ga-wrap{display:none;margin:.35rem 0 .1rem .9rem}
.ga-wrap.show{display:block}
.ga{font-size:.95rem;color:#173b5f}
.ga-ko{font-family:'Noto Sans KR';font-size:.83rem;color:#1f4f7d;border-left:3px solid #7ea6cf;padding-left:.6rem;margin-top:.15rem}
.rv{font-family:'Noto Sans KR';font-size:.72rem;border:1px solid var(--blue-line);background:#fff;color:var(--blue);border-radius:20px;padding:.08rem .6rem;cursor:pointer;margin-left:.3rem;vertical-align:middle}
.rv:hover{background:var(--blue)}
.rv:hover{color:#fff}
/* solution */
.sol-head{display:flex;gap:.5rem;align-items:center;margin-top:1.1rem;flex-wrap:wrap}
.sol{display:none;margin-top:.7rem}
.sol.show{display:block}
.step{display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:1rem;padding:.6rem 0;border-top:1px solid #efece4}
.tb-sol .step{grid-template-columns:72px 1fr}
.tb-sol .step-note{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--red);font-size:.8rem}
.step:first-child{border-top:0}
.step-note{font-family:'Noto Sans KR';font-size:.82rem;color:var(--muted);line-height:1.6}
.step-content{overflow-x:auto}
.step.hidden{display:none}
@media (max-width:640px){.step{grid-template-columns:1fr;gap:.2rem}}
.answer{margin-top:.8rem;background:var(--green-bg);border:1px solid #c6e3d1;border-radius:6px;padding:.5rem .9rem;font-weight:600}
.answer::before{content:'Answer  ';font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--green);letter-spacing:.06em}
.ref{font-family:'Noto Sans KR';font-size:.75rem;color:var(--muted);margin-top:.6rem}
/* vocab */
table.voc{width:100%;border-collapse:collapse;font-size:.95rem;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.voc th{background:#f4f1e8;font-family:'Noto Sans KR';font-size:.78rem;text-align:left;padding:.45rem .7rem;color:var(--muted)}
table.voc td{padding:.5rem .7rem;border-top:1px solid #efece4;vertical-align:top}
table.voc td.t{font-weight:700;color:var(--navy);white-space:nowrap}
table.voc td.k{font-family:'Noto Sans KR';font-size:.88rem;white-space:nowrap}
table.voc td.n{font-size:.9rem}
table.voc.ph td.t{white-space:normal;font-weight:600;font-style:italic;color:#2b3a4f}
table.voc.ph td.k{white-space:normal}
.voc-quiz td.k span,.voc-quiz td.n span{filter:blur(5px);cursor:pointer;transition:filter .15s}
.voc-quiz td.k span.see,.voc-quiz td.n span.see{filter:none}
h3.mini{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;margin:1.4rem 0 .5rem}
/* inquiry */
.inq-intro{background:var(--purple-bg);border:1px solid #d9d2ef;border-radius:8px;padding:.9rem 1.2rem}
.inq-step{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.7rem 1rem;margin:.7rem 0}
.inq-step .gq .num{color:var(--purple)}
.big-idea{display:none;margin-top:1rem;background:var(--navy);color:#fff;border-radius:8px;padding:.9rem 1.2rem}
.big-idea.show{display:block}
.big-idea .ko{color:#d8e3f0;font-size:.88rem;margin-top:.3rem}
.big-idea b.lab{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:#f0cf86}
/* misc */
table.dt{border-collapse:collapse;margin:.5rem 0;font-size:.95rem;background:#fff}
table.dt td,table.dt th{border:1px solid #cfc9bb;padding:.25rem .65rem;text-align:center}
table.dt th{background:#f4f1e8;font-weight:600}
.fig{display:flex;justify-content:center;margin:.6rem 0}
.fig svg{max-width:100%;height:auto}
.cover{text-align:center;padding-top:8vh}
.cover h1{font-size:2.3rem;color:var(--navy);margin:.2rem 0}
.cover .ko{color:var(--muted)}
.cover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin-top:2rem;text-align:left}
.cover-grid button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;cursor:pointer;font:inherit;text-align:left}
.cover-grid button:hover{border-color:var(--gold)}
.cover-grid b{display:block;color:var(--navy)}
.cover-grid span{font-family:'Noto Sans KR';font-size:.78rem;color:var(--muted)}
.legend{font-family:'Noto Sans KR';font-size:.85rem;color:var(--muted);margin-top:2rem;line-height:1.9}
.sec-list{margin:1rem 0;padding-left:1.2rem}
.sec-list li{margin:.3rem 0}
/* textbook */
.tb-note{font-family:'Noto Sans KR';font-size:.88rem;background:#fff;border:1px dashed #cfc9bb;border-radius:8px;padding:.7rem 1rem;color:#4a4335}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:.4rem;margin-top:1rem}
.qgrid button{font-family:'JetBrains Mono',monospace;font-size:.85rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.45rem 0;cursor:pointer}
.qgrid button:hover{border-color:var(--red);color:var(--red)}
/* 수능형 */
.tag.ks{background:#e3f1ef;color:#1d6f68}
.ks-unit{font-family:'Noto Sans KR';font-size:.8rem;color:#1d6f68;font-weight:700;margin-bottom:.8rem}
.ks-box{font-family:'Noto Sans KR';background:#f2f9f8;border:1px solid #bfe0db;border-left:5px solid #1d6f68;border-radius:8px;padding:.9rem 1.2rem;margin:1rem 0;line-height:1.95;font-size:.95rem}
.ks-box h4{margin:.6rem 0 .2rem;color:#1d6f68;font-size:.95rem}
.ks-box h4:first-child{margin-top:0}
.ks-text{font-family:'Noto Sans KR';font-size:.97rem;line-height:2}
table.map{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff;margin:.6rem 0}
table.map th{background:#e3f1ef;font-family:'Noto Sans KR';font-size:.78rem;padding:.4rem .6rem;text-align:left;color:#1d6f68}
table.map td{border-top:1px solid #e3ece9;padding:.4rem .6rem;vertical-align:top}
table.map td:first-child{font-family:'Noto Sans KR'}
.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem;margin:.9rem 0 .2rem}
@media (max-width:700px){.choices{grid-template-columns:repeat(2,1fr)}}
.choice{font:inherit;font-size:.98rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.45rem .5rem;cursor:pointer;text-align:left}
.choice:hover{border-color:#1d6f68}
.choice.right{background:var(--green-bg);border-color:var(--green)}
.choice.wrong{background:var(--red-bg);border-color:var(--red);opacity:.75}
.pts{font-family:'Noto Sans KR';font-size:.8rem;color:var(--muted);margin-left:.3rem}
.en-box{display:none;background:#f6f6fb;border:1px dashed #b9b4d6;border-radius:6px;padding:.6rem .9rem;margin-top:.7rem;font-size:.97rem}
.en-box.show{display:block}
.en-box b.lab{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--purple);letter-spacing:.06em;display:block;margin-bottom:.2rem}
.ks-ans{margin-top:.8rem;background:var(--green-bg);border:1px solid #c6e3d1;border-radius:6px;padding:.5rem .9rem;font-weight:600;font-family:'Noto Sans KR'}
.ks-ans::before{content:'정답  ';font-size:.75rem;color:var(--green)}
.short-in{display:flex;gap:.4rem;margin-top:.8rem;align-items:center;font-family:'Noto Sans KR';font-size:.88rem}
.short-in input{font:inherit;width:110px;padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px}
.short-in span.res{font-weight:700}
mjx-container[display="true"]{margin:.5em 0 !important;overflow-x:auto;overflow-y:hidden}
body.nok .gq-ko, body.nok .ga-ko, body.nok .big-idea .ko{display:none}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="main">
    <div id="bar">
      <button class="btn" id="menuBtn">☰</button>

      <button class="btn" id="koBtn" title="한글 번역 보이기/숨기기">한글 ON</button>

    </div>
  </div>
</div>

const DATA = {"slides": [{"crumb": "HL Probability", "html": "이 사이트는 Hodder <b>Mathematics: Analysis and Approaches HL<\/b> Chapter 9 (책 p.262–293)의 흐름을 따라 만든 학습 자료입니다.<br>각 단원은 <b>Guided Inquiry<\/b> → <b>Key Vocabulary<\/b> → <b>Key Concept<\/b> → <b>Worked Example<\/b> → <b>Practice<\/b> 순서이고, 마지막에 청록색 <b>수능특강 연계<\/b> 슬라이드(수능 표현 개념 정리, 수능↔IB 표기 대응표, 5지선다·단답형 기초 문제)가 이어집니다.<br>파란 상자의 질문은 <b>답 보기<\/b>로, 풀이는 <b>풀이 보기 → 다음 단계<\/b>로 한 단계씩 열 수 있어요. ← → 키로 이동.", "type": "cover", "sec": "", "code": ""}, {"title": "Which machine made the faulty item?", "ko": "불량품은 어느 기계에서 나왔을까?", "intro": "<p>A factory has two machines. Machine A makes 60% of the items and 3% of its items are faulty. Machine B makes 40% of the items and 5% of its items are faulty. An item is chosen at random and found to be faulty.<\/p>", "intro_ko": "기계 A가 제품의 60%를 만들고 그중 3%가 불량, 기계 B가 40%를 만들고 그중 5%가 불량입니다. 임의로 고른 제품이 불량이었습니다.", "steps": [{"q": "Draw a tree diagram: first branch = machine, second = faulty or not. Which two paths end in “faulty”?", "qk": "수형도를 그려 보세요. “불량”으로 끝나는 경로 두 개는?", "a": "$A\\to F$: $0.6\\times0.03=0.018$; &nbsp; $B\\to F$: $0.4\\times0.05=0.020$", "ak": ""}, {"q": "What is $P(F)$?", "qk": "$P(F)$는?", "a": "$0.018+0.020=0.038$", "ak": ""}, {"q": "Before checking, which machine would you guess? After finding it faulty, find $P(B\\mid F)$.", "qk": "처음에는 어느 기계라고 생각했나요? 불량임을 안 후의 $P(B\\mid F)$는?", "a": "Before: A is more likely (0.6). After: $P(B\\mid F)=\\frac{0.020}{0.038}\\approx0.526$ — now B is more likely!", "ak": "처음엔 A(0.6), 불량 정보를 알고 나면 B가 0.526으로 더 가능성이 큽니다."}, {"q": "We knew $P(F\\mid B)$ and wanted $P(B\\mid F)$. What has happened to the condition?", "qk": "$P(F\\mid B)$를 알고 $P(B\\mid F)$를 구했습니다. 조건이 어떻게 바뀌었나요?", "a": "It has been <b>reversed<\/b>: the given event and the event we want swapped places.", "ak": "조건이 “뒤집혔습니다”."}], "idea": "<b>Bayes' theorem<\/b> reverses a conditional probability: $P(B\\mid A)=\\dfrac{P(B)P(A\\mid B)}{P(B)P(A\\mid B)+P(B')P(A\\mid B')}$. In practice: draw the tree, then (the path you want) ÷ (all paths that end in the given event).", "idea_ko": "베이즈 정리는 조건부확률을 뒤집습니다. 실전에서는 수형도를 그린 뒤 (원하는 경로) ÷ (주어진 사건으로 끝나는 모든 경로)로 계산하면 됩니다.", "fig": {"type": "tree", "first": [["A", "0.6"], ["B", "0.4"]], "second": [[["F", "0.03", "0.018"], ["F'", "0.97", "0.582"]], [["F", "0.05", "0.020"], ["F'", "0.95", "0.380"]]]}, "type": "inquiry", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["Bayes' theorem", "베이즈 정리", "reverses a conditional probability"], ["prior probability", "사전확률", "probability before new information, e.g. $P(B)$"], ["posterior probability", "사후확률", "updated probability after information, e.g. $P(B\\mid A)$"], ["reverse conditional probability", "역조건부확률", "find $P(B\\mid A)$ from $P(A\\mid B)$"], ["law of total probability", "전확률 공식", "$P(A)=P(B)P(A\\mid B)+P(B')P(A\\mid B')$"], ["partition / mutually exclusive and exhaustive", "분할 / 서로 배반이고 합하면 전체", "e.g. $B_1,B_2,B_3$ cover all outcomes"], ["false positive / false negative", "위양성 / 위음성", "test says yes but no disease / test says no but disease"], ["sensitivity", "민감도", "$P(+\\mid D)$"]], "phrases": [["Given that the item is faulty, find the probability that it was made by machine B.", "불량품이라는 조건에서 기계 B 제품일 확률 → $P(B\\mid F)$"], ["Find the probability that a randomly chosen person tests positive.", "임의로 고른 사람이 양성일 확률 → 전확률 (경로 합)"], ["Use Bayes' theorem to show that …", "베이즈 정리를 이용하여 …임을 보이시오."], ["Hence, find …", "앞의 결과를 이용하여 …를 구하시오."]], "type": "vocab", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Bayes' theorem for two events", "ko": "두 사건에 대한 베이즈 정리", "kp": "$$P(B\\mid A)=\\frac{P(B)P(A\\mid B)}{P(B)P(A\\mid B)+P(B')P(A\\mid B')}$$", "body": "<p><b>Where it comes from:<\/b> $P(B\\mid A)=\\dfrac{P(A\\cap B)}{P(A)}$. The numerator is $P(B)P(A\\mid B)$ (multiplication rule), and the denominator $P(A)$ is the sum it.<\/p><p>Given that the ball is red, find the probability that it came from bag 2.<\/p>", "guides": [{"q": "What is $P(R\\mid B_i)$ for each bag?", "qk": "각 주머니에서 빨강이 나올 확률은?", "a": "$0.4,\\ 0.7,\\ 0.5$", "ak": ""}], "steps": [["$P(R)$", "$\\frac13(0.4)+\\frac13(0.7)+\\frac13(0.5)=\\frac{1.6}{3}$"], ["Bayes", "$P(B_2\\mid R)=\\dfrac{\\frac13(0.7)}{\\frac13(1.6)}=\\dfrac{0.7}{1.6}=\\dfrac{7}{16}$"]], "ans": "$\\frac{7}{16}$", "fig": null, "ref": "", "type": "example", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Example 9A.3", "ko": "", "q": "<p>For events $A$ and $B$: $P(B\\mid A)=0.3$, $P(B\\mid A')=0.6$ and $P(A\\mid B)=0.4$. Find $P(A)$.<\/p>", "guides": [{"q": "Let $P(A)=x$. Write $P(A\\mid B)$ in terms of $x$.", "qk": "$P(A)=x$로 두고 식을 세우세요.", "a": "$\\dfrac{0.3x}{0.3x+0.6(1-x)}=0.4$", "ak": ""}], "steps": [["Bayes with unknown", "$\\dfrac{0.3x}{0.3x+0.6(1-x)}=0.4$"], ["Multiply out", "$0.3x=0.4(0.6-0.3x)=0.24-0.12x$"], ["Solve", "$0.42x=0.24\\Rightarrow x=\\dfrac{4}{7}\\approx0.571$"]], "ans": "$P(A)=\\frac47$", "fig": null, "ref": "", "type": "example", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Question 1", "ko": "", "q": "<p>A disease affects 1% of a population. A test is positive for 98% of people with the disease and for 5% of people without it.<\/p><p><b>(a)<\/b> Find the probability that a randomly chosen person tests positive.<\/p><p><b>(b)<\/b> Given a positive test, find the probability that the person has the disease.<\/p><p><b>(c)<\/b> Given a negative test, find the probability that the person does not have the disease.<\/p>", "guides": [{"q": "Which paths end in a negative result?", "qk": "음성으로 끝나는 경로는?", "a": "$D\\to-$ and $D'\\to-$", "ak": ""}], "steps": [["(a)", "$0.01(0.98)+0.99(0.05)=0.0098+0.0495=0.0593$"], ["(b)", "$\\dfrac{0.0098}{0.0593}=0.165$"], ["(c)", "$P(-)=1-0.0593=0.9407$; $\\ P(D'\\mid-)=\\dfrac{0.99(0.95)}{0.9407}=\\dfrac{0.9405}{0.9407}=0.9998$"]], "ans": "(a) 0.0593 (b) 0.165 (c) 0.9998", "fig": null, "ref": "", "type": "practice", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Question 2", "ko": "", "q": "<p>On a given day it rains with probability 0.25. If it is going to rain, the forecast predicts rain with probability 0.8; if it is not going to rain, the forecast predicts rain with probability 0.15. Given that the forecast predicts rain, find the probability that it rains.<\/p>", "guides": [{"q": "Numerator?", "qk": "분자는?", "a": "$0.25\\times0.8=0.2$", "ak": ""}], "steps": [["$P(\\text{forecast rain})$", "$0.25(0.8)+0.75(0.15)=0.2+0.1125=0.3125$"], ["Bayes", "$\\dfrac{0.2}{0.3125}=0.64$"]], "ans": "0.64", "fig": null, "ref": "", "type": "practice", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Question 3", "ko": "", "q": "<p>A shop buys 50% of its light bulbs from supplier X, 30% from Y and 20% from Z. The proportions of faulty bulbs are 2%, 3% and 5% respectively. A bulb is faulty. Find the probability that it came from supplier Z.<\/p>", "guides": [{"q": "How many first branches does the tree have?", "qk": "첫 가지는 몇 개?", "a": "Three: X, Y, Z", "ak": ""}], "steps": [["$P(F)$", "$0.5(0.02)+0.3(0.03)+0.2(0.05)=0.01+0.009+0.01=0.029$"], ["Bayes", "$P(Z\\mid F)=\\dfrac{0.01}{0.029}=0.345$"]], "ans": "0.345", "fig": null, "ref": "", "type": "practice", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Question 4", "ko": "", "q": "<p>A bag contains two fair coins and one coin with heads on both sides. A coin is chosen at random and tossed twice. It shows heads both times. Find the probability that the double-headed coin was chosen.<\/p>", "guides": [{"q": "What is $P(HH)$ for a fair coin? For the double-headed coin?", "qk": "HH가 나올 확률은 각각?", "a": "$\\frac14$ and $1$", "ak": ""}], "steps": [["Paths to HH", "double-headed: $\\frac13\\times1=\\frac13$; &nbsp; fair: $\\frac23\\times\\frac14=\\frac16$"], ["Bayes", "$\\dfrac{1/3}{1/3+1/6}=\\dfrac{2}{3}$"]], "ans": "$\\frac23$", "fig": null, "ref": "", "type": "practice", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Question 5", "ko": "", "q": "<p>Starting from $P(B\\mid A)=\\dfrac{P(A\\cap B)}{P(A)}$, prove Bayes' theorem for two events.<\/p>", "guides": [{"q": "How can you rewrite $P(A\\cap B)$ using the multiplication rule with $B$ first?", "qk": "$B$를 먼저 쓰는 곱셈정리로 $P(A\\cap B)$를?", "a": "$P(A\\cap B)=P(B)P(A\\mid B)$", "ak": ""}, {"q": "How can you split $P(A)$?", "qk": "$P(A)$를 어떻게 나누나요?", "a": "$A=(A\\cap B)\\cup(A\\cap B')$, which are mutually exclusive.", "ak": ""}], "steps": [["Numerator", "$P(A\\cap B)=P(B)P(A\\mid B)$"], ["Denominator", "$P(A)=P(A\\cap B)+P(A\\cap B')=P(B)P(A\\mid B)+P(B')P(A\\mid B')$"], ["Combine", "$P(B\\mid A)=\\dfrac{P(B)P(A\\mid B)}{P(B)P(A\\mid B)+P(B')P(A\\mid B')}$ &nbsp;∎"]], "ans": "shown", "fig": null, "ref": "", "type": "practice", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "곱셈정리로 조건부확률 뒤집기 (수능 버전)", "unit": "수능특강 04 조건부확률 · 2 확률의 곱셈정리와 그 활용 (본문 46–47쪽)", "box": "<h4>⑴ 확률의 곱셈정리<\/h4>$P(A\\cap B)=P(A)P(B\\mid A)=P(B)P(A\\mid B)$<h4>⑵ 곱셈정리의 활용<\/h4>사건 $E$가 일어나는 경로가 여러 가지이면 각 경로의 확률을 곱셈정리로 구해 더한다: $P(E)=P(A)P(E\\mid A)+P(A^C)P(E\\mid A^C)$<h4>⑶ 뒤집기<\/h4>“$E$가 일어났을 때, $A$였을 확률” $=\\dfrac{P(A\\cap E)}{P(E)}$. 수능에서는 ‘베이즈 정리’라는 이름을 쓰지 않지만 계산은 IB 9A와 완전히 같다.", "map": [["확률의 곱셈정리", "multiplication rule", ""], ["(곱셈정리의 활용)", "law of total probability", "IB 용어"], ["조건부확률 뒤집기", "Bayes' theorem", "IB HL 9A"], ["$A^C$", "$A'$", "기호가 다름"]], "ex": "", "tip": "수능 문제는 “상자 선택 → 공 꺼내기”, “동전·주사위 결과에 따라 다른 시행”처럼 2단계 상황이 대부분입니다. 수형도를 먼저 그리세요.", "fig": null, "type": "ks", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "수능형 기초 1", "unit": "수능특강 04 조건부확률 · 2 확률의 곱셈정리와 그 활용 (본문 46–47쪽)", "q": "<p>상자 A에는 흰 공 2개와 검은 공 6–47쪽)", "q": "<p>한 개의 동전을 던져 앞면이 나오면 한 개의 주사위를 1번 던지고, 뒷면이 나오면 한 개의 주사위를 2번 던진다. 6의 눈이 적어도 한 번 나왔을 때, 동전의 앞면이 나왔을 확률은?<\/p>", "choices": ["$\\dfrac{4}{17}$", "$\\dfrac{5}{17}$", "$\\dfrac{6}{17}$", "$\\dfrac{7}{17}$", "$\\dfrac{8}{17}$"], "ans": "3", "guides": [{"q": "뒷면일 때 6이 적어도 한 번 나올 확률은?", "qk": "at least once in 2 rolls", "a": "$1-\\left(\\frac56\\right)^2=\\frac{11}{36}$", "ak": ""}], "steps": [["앞면 경로", "$\\frac12\\cdot\\frac16=\\frac{6}{72}$"], ["뒷면 경로", "$\\frac12\\cdot\\frac{11}{36}=\\frac{11}{72}$"], ["조건부확률", "$\\dfrac{6}{6+11}=\\dfrac{6}{17}$"]], "en": "A coin is tossed. If it shows heads, a die is rolled once; if tails, the die is rolled twice. Given that at least one six is obtained, find the probability that the coin showed heads.", "pts": "[3점]", "ansText": "③ $\\frac{6}{17}$", "fig": null, "type": "ksq", "sec": "9A", "code": "9A", "crumb": "Ch 9 · HL: Probability › 9A Bayes' theorem"}, {"title": "Exercise 9A · Worked Solutions", "ko": "9A 교과서 연습문제 풀이 — 번호를 누르면 풀이로 이동", "label": "Exercise 9A", "html": "교과서의 문제 번호와 같은 순서입니다. 문제를 먼저 풀고 풀이로 확인하세요.", "items": [[1, 18], [2, 19], [3, 20], [4, 21], [5, 22], [6, 23], [7, 24], [8, 25], [9, 26], [10, 27], [11, 28], [12, 29], [13, 30], [14, 31], [15, 32], [16, 33], [17, 34], [18, 35], [19, 36], [20, 37], [21, 38], [22, 39], [23, 40]], "type": "tbindex", "sec": "9A-Ex", "code": "9A-Ex", "crumb": "Ch 9 · HL: Probability › 9A-Ex Exercise 9A"}, {"title": "Q1", "label": "Exercise 9A", "num": 1, "page": 267, "guides": [{"q": "Bayes: (the path you want) ÷ (all paths ending in the given event).", "qk": "베이즈: 원하는 경로 ÷ 주어진 사건으로 끝나는 모든 경로", "a": "", "ak": ""}], "steps": [["a", "$\\frac{0.3(0.6)}{0.3(0.6)+0.7(0.8)}=\\frac{0.18}{0.74}=0.243$"], ["b", "$\\frac{0.7(0.9)}{0.7(0.9)+0.3(0.2)}=\\frac{0.63}{0.69}=0.913$"]], "ans": "(a) 0.243 (b) 0.913", "warn": "", "idx": 17, "type": "tb", "sec": "9A-Ex", "code": "9A-Ex", "crumb": "Ch 9 · HL: Probability › 9A-Ex Exercise 9A"}, {"title": "Q2", "label": "Exercise 9A", "num": 2, " "type": "tb", "sec": "9A-Ex", "code": "9A-Ex", "crumb": "Ch 9 · HL: Probability › 9A-Ex Exercise 9A"}, {"title": "Q20", "label": "Exercise 9A", "num": 20, "page": 269, "guides": [{"q": "A 2% negative result for diseased patients means P(+ | D) = 0.98.", "qk": "P(+ | D) = 0.98", "a": "", "ak": ""}], "steps": [["Paths to +", "$0.003(0.98)=0.00294$; $0.997(0.1)=0.0997$"], ["Bayes", "$\\frac{0.00294}{0.10264}=0.0286$"]], "ans": "0.0286", "warn": "", "idx": 17, "type": "tb", "sec": "9A-Ex", "code": "9A-Ex", "crumb": "Ch 9 · HL: Probability › 9A-Ex Exercise 9A"}, {"title": "Q21", "label": "Exercise 9A", "num": 21, "page": 269, "guides": [{"q": "45 of 200 positives were false: $P(D'\\mid+)=0.225$.", "qk": "양성 중 45/200은 위양성", "a": "", "ak": ""}], "steps": [["Let $p$ = prevalence", "$\\frac{0.1(1-p)}{0.9p+0.1(1-p)}=0.225$"], ["Solve", "$0.1-0.1p=0.18p+0.0225\\Rightarrow p=0.277$"]], "ans": "about 27.7%", "warn": "", "idx": 17, "type": "tb", "sec": "9A-Ex", "code": "9A-Ex", "crumb": "Ch 9 · HL: Probability › 9A-Ex Exercise 9A"}, {"title": "Q22", "label": "Exercise 9A", "num": 22, "page": 269, "guides": [], "steps": [["Slot A", "$\\binom73(0.3)^3(0.7)^4=0.2269$"], ["Slot B", "$\\binom{10}3(0.3)^3(0.7)^7=0.2668$"], ["Bayes", "$\\frac{0.2269}{0.2269+0.2668}=0.460$"]], "ans": "0.460", "warn": "", "idx": 17, "type": "tb", "sec": "9A-Ex", "code": "9A-Ex", "crumb": "Ch 9 · HL: Probability › 9A-Ex Exercise 9A"}, {"title": "Q23", "label": "Exercise 9A", "num": 23, "page": 269, "guides": [], "steps": [["a", "$\\frac{m(m-1)+n(n-1)}{(m+n)(m+n-1)}$"], ["b", "yellow: $\\frac{20+210}{380}=\\frac{23}{38}$; blue: $\\frac{42+56}{210}=\\frac7{15}$"], ["Bayes", "$\\frac{\\frac12\\cdot\\frac7{15}}{\\frac12\\cdot\\frac{23}{38}+\\frac12\\cdot\\frac7{15}}=\\frac{266}{611}=0.435$"]], "ans": "(b) $\\frac{266}{611}\\approx0.435$", "warn": "", "idx": 17, "type": "tb", "sec": "9A-Ex", "code": "9A-Ex", "crumb": "Ch 9 · HL: Probability › 9A-Ex Exercise 9A"}, {"title": "Same expected prize, different risk", "ko": "기대 상금은 같은데 위험은 다르다", "intro": "<p>Game A: you win \\$0 or \\$10, each with probability 0.5. &nbsp; Game B: you always win \\$5.<\/p>", "intro_ko": "게임 A는 0달러 또는 10달러를 각각 확률 0.5로, 게임 B는 항상 5달러를 받습니다.", "steps": [{"q": "Find the expected winnings for each game.", "qk": "각 게임의 기댓값은?", "a": "Both are \\$5.", "ak": "둘 다 5달러."}, {"q": "For game A, how far is each outcome from the mean? What is the average of the <b>squared<\/b> distances?", "qk": "게임 A에서 각 결과는 평균에서 얼마나 떨어져 있나요? 거리의 “제곱”의 평균은?", "a": "Both are 5 away; $\\frac12(25)+\\frac12(25)=25$.", "ak": "둘 다 5만큼 → 제곱의 평균 25."}, {"q": "What is the same quantity for game B?", "qk": "게임 B는?", "a": "0 — there is no spread.", "ak": "0."}, {"q": "Compute $E(X^2)-[E(X)]^2$ for game A. What do you notice?", "qk": "게임 A에서 $E(X^2)-[E(X)]^2$를 계산하면?", "a": "$E(X^2)=\\frac12(0)+\\frac12(100)=50$; $50-25=25$ — the same!", "ak": "50 − 25 = 25로 같습니다."}], "idea": "The variance $\\text{Var}(X)=E\\big[(X-\\mu)^2\\big]=E(X^2)-[E(X)]^2$ measures the spread (risk) of a random variable. Two variables can have the same mean but very different variances.", "idea_ko": "분산은 확률변수의 퍼짐(위험도)을 나타냅니다. 평균이 같아도 분산은 매우 다를 수 있어요.", "fig": null, "type": "inquiry", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["variance, $\\text{Var}(X)$", "분산", "$E(X^2)-[E(X)]^2$"], ["standard deviation", "표준편차", "$\\sqrt{\\text{Var}(X)}$"], ["$E(X^2)$", "$X^2$의 기댓값", "$\\sum x^2P(X=x)$ — not $[E(X)]^2$!"], ["linear transformation", "일차변환", "$aX+b$"], ["spread / dispersion", "퍼짐 / 산포", ""], ["expectation algebra", "기댓값의 성질", "$E(aX+b)=aE(X)+b$"]], "phrases": [["Find $\\text{Var}(X)$.", "$X$의 분산을 구하시오."], ["Find the standard deviation of $Y$, where $Y=3X-2$.", "$Y=3X-2$의 표준편차를 구하시오."], ["Given that $E(X)=\\ldots$ and $\\text{Var}(X)=\\ldots$, find …", "$E(X)$와 $\\text{Var}(X)$가 주어졌을 때 …"], ["Show that $\\text{Var}(X)=E(X^2)-[E(X)]^2$.", "…임을 보이시오 → 정의에서 출발해 전개"]], "type": "vocab", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Variance of a discrete random variable", "ko": "이산확률변수의 분산", "kp": "$$\\text{Var}(X)=\\sum x^2P(X=x)-\\big(E(X)\\big)^2=E(X^2)-[E(X)]^2$$ The standard deviation is $\\sqrt{\\text{Var}(X)}$.", "body": "<p>Method: add a row $x^2$ (or $x^2P$) to the table, find $E(X^2)$, then subtract the square of the mean.<\/p>", "kn": "$E(X^2)$은 “$x^2$에 확률을 곱해서 더한 것”이고 $[E(X)]^2$은 “평균의 제곱”입니다. 둘을 헷갈리지 마세요. 분산은 절대 음수가 될 수 없습니다.", "tip": "", "guides": [], "fig": null, "type": "concept", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Linear transformations", "ko": "일차변환 $aX+b$", "kp": "$$E(aX+b)=aE(X)+b,\\qquad \\text{Var}(aX+b)=a^2\\,\\text{Var}(X)$$", "body": "<p>Adding $b$ shifts every value but does not change the spread. Multiplying by $a$ multiplies the standard deviation by $|a|$ and the variance by $a^2$. For $X\\sim B(n,p)$: $\\text{Var}(X)=np(1-p)$.<\/p>", "kn": "SL 6B의 자료 변환 규칙과 똑같습니다. $\\text{Var}(-2X)=4\\text{Var}(X)$ — 음수를 곱해도 분산은 커집니다.", "tip": "", "guides": [{"q": "$\\text{Var}(X)=3$. Find $\\text{Var}(5-2X)$.", "qk": "$\\text{Var}(5-2X)$는?", "a": "$(-2)^2\\times3=12$", "ak": ""}], "fig": null, "type": "concept", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Example 9B.1", "ko": "", "q": "<p>The random variable $X$ has the distribution below. Find $E(X)$, $\\text{Var}(X)$ and the standard deviation of $X$.<\/p><table class=\"dt\"><tr><th>$x$<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>$P(X=x)$<\/th><td>0.1<\/td><td>0.3<\/td><td>0.4<\/td><td>0.2<\/td><\/tr><\/table>", "guides": [{"q": "What is $E(X^2)$?", "qk": "$E(X^2)$는?", "a": "$0+0.3+1.6+1.8=3.7$", "ak": ""}], "steps": [["$E(X)$", "$0+0.3+0.8+0.6=1.7$"], ["$E(X^2)$", "$0^2(0.1)+1^2(0.3)+2^2(0.4)+3^2(0.2)=3.7$"], ["$\\text{Var}(X)$", "$3.7-1.7^2=3.7-2.89=0.81$"], ["SD", "$\\sqrt{0.81}=0.9$"]], "ans": "$E(X)=1.7$, $\\text{Var}(X)=0.81$, SD $=0.9$", "fig": null, "ref": "", "type": "example", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Example 9B.2", "ko": "", "q": "<p>A random variable $X$ has $E(X)=8$ and $\\text{Var}(X)=3$. Find the expected value and variance of $Y=5-2X$.<\/p>", "guides": [{"q": "Which part of $5-2X$ affects the variance?", "qk": "분산에 영향을 주는 부분은?", "a": "Only $-2$, giving a factor of $(-2)^2=4$.", "ak": ""}], "steps": [["$E(Y)$", "$5-2(8)=-11$"], ["$\\text{Var}(Y)$", "$(-2)^2\\times3=12$"]], "ans": "$E(Y)=-11$, $\\text{Var}(Y)=12$", "fig": null, "ref": "", "type": "example", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Example 9B.3", "ko": "", "q": "<p>$X$ takes the values 1, 2, 3 with $P(X=1)=p$, $P(X=2)=q$, $P(X=3)=0.3$, and $E(X)=2.1$. Find $p$, $q$ and $\\text{Var}(X)$.<\/p>", "guides": [{"q": "Which two equations do you have?", "qk": "식 두 개는?", "a": "$p+q+0.3=1$ and $p+2q+0.9=2.1$", "ak": ""}], "steps": [["Equations", "$p+q=0.7$, &nbsp; $p+2q=1.2$"], ["Solve", "$q=0.5,\\ p=0.2$"], ["$E(X^2)$", "$1(0.2)+4(0.5)+9(0.3)=4.9$"], ["$\\text{Var}(X)$", "$4.9-2.1^2=4.9-4.41=0.49$"]], "ans": "$p=0.2$, $q=0.5$, $\\text{Var}(X)=0.49$", "fig": null, "ref": "", "type": "example", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Question 1", "ko": "", "q": "<p>$X$ is the score on a fair six-sided die. Find $E(X)$ and $\\text{Var}(X)$.<\/p>", "guides": [{"q": "What is $\\sum x^2$ for $x=1,\\dots,6$?", "qk": "$1^2+\\cdots+6^2$는?", "a": "91", "ak": ""}], "steps": [["$E(X)$", "$\\frac{21}{6}=3.5$"], ["$E(X^2)$", "$\\frac{91}{6}$"], ["$\\text{Var}(X)$", "$\\frac{91}{6}-\\frac{49}{4}=\\frac{182-147}{12}=\\frac{35}{12}$"]], "ans": "$3.5$, $\\frac{35}{12}$", "fig": null, "ref": "", "type": "practice", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Question 2", "ko": "", "q": "<p>$X$ takes the values $-1,\\ 0,\\ 2$ with probabilities $0.3,\\ 0.5,\\ 0.2$. Find $\\text{Var}(X)$.<\/p>", "guides": [{"q": "Careful with $(-1)^2$.", "qk": "$(-1)^2$ 주의.", "a": "$(-1)^2=1$", "ak": ""}], "steps": [["$E(X)$", "$-0.3+0+0.4=0.1$"], ["$E(X^2)$", "$1(0.3)+0+4(0.2)=1.1$"], ["$\\text{Var}(X)$", "$1.1-0.01=1.09$"]], "ans": "1.09", "fig": null, "ref": "", "type": "practice", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Question 3", "ko": "", "q": "<p>The daily temperature $C$ (°C) in a city has mean 15 and variance 16. Find the mean, variance and standard deviation in °F, where $F=1.8C+32$.<\/p>", "guides": [{"q": "What is $a$ in $aC+b$?", "qk": "$a$는?", "a": "1.8", "ak": ""}], "steps": [["Mean", "$1.8(15)+32=59$"], ["Variance", "$1.8^2\\times16=51.84$"], ["SD", "$\\sqrt{51.84}=7.2$"]], "ans": "59, 51.84, 7.2", "fig": null, "ref": "", "type": "practice", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Question 4", "ko": "", "q": "<p>$X\\sim B(12,\\ 0.25)$ and $Y=4X+1$. Find $E(Y)$ and $\\text{Var}(Y)$.<\/p>", "guides": [{"q": "$E(X)$ and $\\text{Var}(X)$?", "qk": "$E(X)$, $\\text{Var}(X)$는?", "a": "$3$ and $12(0.25)(0.75)=2.25$", "ak": ""}], "steps": [["$E(Y)$", "$4(3)+1=13$"], ["$\\text{Var}(Y)$", "$16\\times2.25=36$"]], "ans": "$E(Y)=13$, $\\text{Var}(Y)=36$", "fig": null, "ref": "", "type": "practice", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Question 5", "ko": "", "q": "<p>A spinner pays \\$0, \\$2 or \\$10 with probabilities 0.5, 0.3 and 0.2. A player pays \\$$k$ to play.<\/p><p><b>(a)<\/b> Find $k$ so that the game is fair.<\/p><p><b>(b)<\/b> Find the standard deviation of the net gain.<\/p>", "guides": [{"q": "Does subtracting $k$ change the standard deviation?", "qk": "$k$를 빼면 표준편차가 바뀌나요?", "a": "No.", "ak": "아니요."}], "steps": [["(a) expected prize", "$E(W)=0+0.6+2=2.6$ ⇒ $k=2.6$"], ["$E(W^2)$", "$0+1.2+20=21.2$"], ["$\\text{Var}(W)$", "$21.2-2.6^2=14.44$"], ["(b)", "SD of $W-k$ $=\\sqrt{14.44}=3.8$"]], "ans": "(a) \\$2.60 (b) \\$3.80", "fig": null, "ref": "", "type": "practice", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "Question 6", "ko": "", "q": "<p>Let $\\mu=E(X)$. Starting from $\\text{Var}(X)=E\\big[(X-\\mu)^2\\big]$, show that $\\text{Var}(X)=E(X^2)-\\mu^2$.<\/p>", "guides": [{"q": "Expand $(x-\\mu)^2$.", "qk": "$(x-\\mu)^2$를 전개하세요.", "a": "$x^2-2\\mu x+\\mu^2$", "ak": ""}], "steps": [["Expand", "$\\sum(x-\\mu)^2P(X=x)=\\sum x^2P-2\\mu\\sum xP+\\mu^2\\sum P$"], ["Use $\\sum xP=\\mu$, $\\sum P=1$", "$=E(X^2)-2\\mu^2+\\mu^2=E(X^2)-\\mu^2$ &nbsp;∎"]], "ans": "shown", "fig": null, "ref": "", "type": "practice", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "분산과 표준편차 (수능 버전)", "unit": "수능특강 05 이산확률변수의 확률분포 · 5 분산·표준편차, 6 $aX+b$, 8 이항분포의 분산 (본문 62–66쪽)", "box": "<h4>⑴ 분산·표준편차<\/h4>$E(X)=m$일 때 $V(X)=E\\big((X-m)^2\\big)=E(X^2)-\\{E(X)\\}^2$, &nbsp; $\\sigma(X)=\\sqrt{V(X)}$<h4>⑵ $aX+b$<\/h4>$E(aX+b)=aE(X)+b$, &nbsp; $V(aX+b)=a^2V(X)$, &nbsp; $\\sigma(aX+b)=|a|\\,\\sigma(X)$<h4>⑶ 이항분포<\/h4>$X\\sim B(n,p)$이면 $E(X)=np$, $V(X)=npq$, $\\sigma(X)=\\sqrt{npq}$ $(q=1-p)$", "map": [["$V(X)$", "$\\text{Var}(X)$", "기호가 다름!"], ["$\\sigma(X)$", "standard deviation of $X$", "IB에는 $\\sigma(X)$ 기호를 잘 쓰지 않음"], ["$E(X^2)-\\{E(X)\\}^2$", "$E(X^2)-[E(X)]^2$", "같음"], ["$npq$", "$np(1-p)$", ""]], "ex": "", "tip": "수능 단골: “$\\sigma(aX+b)$”에서 $|a|$를 빼먹는 실수, “$V(aX+b)$”에서 $b$를 더하는 실수. IB도 똑같이 노리는 함정입니다.", "fig": null, "type": "ks", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "수능형 기초 1", "unit": "수능특강 05 이산확률변수의 확률분포 · 5 분산·표준편차, 6 $aX+b$, 8 이항분포의 분산 (본문 62–66쪽)", "q": "<p>이산확률변수 $X$의 확률분포가 다음 표와 같을 때, $V(2X+1)$의 값을 구하시오.<\/p><table class=\"dt\"><tr><th>$X$<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>합계<\/td><\/tr><tr><th>$P(X=x)$<\/th><td>$\\frac14$<\/td><td>$\\frac12$<\/td><td>$\\frac14$<\/td><td>1<\/td><\/tr><\/table>", "choices": null, "ans": "2", "guides": [{"q": "$E(X)$와 $E(X^2)$은?", "qk": "", "a": "$2$, $\\ \\frac14+2+\\frac94=\\frac92$", "ak": ""}], "steps": [["$V(X)$", "$\\frac92-4=\\frac12$"], ["$V(2X+1)$", "$4\\cdot\\frac12=2$"]], "en": "The table shows the distribution of $X$. Find $\\text{Var}(2X+1)$.", "pts": "[2점]", "ansText": "2", "fig": null, "type": "ksq", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "수능형 기초 2", "unit": "수능특강 05 이산확률변수의 확률분포 · 5 분산·표준편차, 6 $aX+b$, 8 이항분포의 분산 (본문 62–66쪽)", "q": "<p>확률변수 $X$에 대하여 $\\sigma(X)=3$일 때, $\\sigma(-2X+5)$의 값은?<\/p>", "choices": ["$3$", "$6$", "$9$", "$12$", "$18$"], "ans": "2", "guides": [{"q": "$\\sigma(aX+b)$에 붙는 배수는?", "qk": "", "a": "$|a|=2$", "ak": ""}], "steps": [["성질", "$\\sigma(-2X+5)=|-2|\\cdot3=6$"], ["함정", "$-6$은 표준편차가 될 수 없고, $V$로 착각하면 $12$나 $36$"]], "en": "The standard deviation of $X$ is 3. Find the standard deviation of $5-2X$.", "pts": "[2점]", "ansText": "② 6", "fig": null, "type": "ksq", "sec": "9B", "code": "9B", "crumb": "Ch 9 · HL: Probability › 9B Variance of a discrete random variable"}, {"title": "수능형 기초 3", "unit": "수능특강 05 이산확률변수의 확률분포 · 5 분산·표준편차, 6 $aX+b$, 8 이항분포의 분산 (본문 62–66쪽)", "q": "<p>확률변수 $X$가 이항분포 $B(n,\\ p)$를 따르고 $E(X)=6,\\ V(X)=4$일 때, $n$의 값은?<\/p>", "choices": ["$12$", "$15$", "$18$", "$21$", "$24$"], "ans": "3", "guides": [{"q": "$\\frac{V(X)}{E(X)}$는 무엇인가요?", "qk": "divide", "a": "$q=1-p$", "ak": ""}], "steps": [["$q$", "$q=\\frac46=\\frac23\\Rightarrow p=\\frac13$"], ["$n$", "$n=\\frac{6}{1/3}=18$"]], "en": "$ ", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Q22", "label": "Exercise 9B", "num": 22, "page": 273, "guides": [], "steps": [["a", "$\\frac18,\\frac38,\\frac38,\\frac18$ for 0, 1, 2, 3"], ["b", "1.5"], ["c", "$\\text{Var}=np(1-p)=3\\cdot\\frac12\\cdot\\frac12=\\frac34$ → $\\sigma=\\frac{\\sqrt3}2$"]], "ans": "(b) 1.5", "warn": "", "idx": 58, "type": "tb", "sec": "9B-Ex", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Q23", "label": "Exercise 9B", "num": 23, "page": 273, "guides": [{"q": "Find the mean and variance for one roll, then add for two independent rolls.", "qk": "한 번의 평균·분산 → 독립 두 번이면 더하기", "a": "", "ak": ""}], "steps": [["One roll", "$E=\\frac{1+1+2+2+2+3}6=\\frac{11}6$; $E(X^2)=\\frac{23}6$ → $\\text{Var}=\\frac{17}{36}$"], ["Total of two", "mean $\\frac{11}3$, variance $\\frac{17}{18}$, SD $0.972$"]], "ans": "mean 3.67, SD 0.972", "warn": "두 번 굴린 합의 분산은 9B 범위를 넘는 성질($\\text{Var}(X_1+X_2)=\\text{Var}(X_1)+\\text{Var}(X_2)$)을 써요. 합의 확률분포표(2~6)를 만들어 직접 계산해도 같은 답이 나와요.", "idx": 58, "type": "tb", "sec": "9B-Ex", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Q24", "label": "Exercise 9B", "num": 24, "page": 274, "guides": [], "steps": [["a", "$0.4+0.6+3a+4b=2\\Rightarrow3a+4b=1$"], ["b", "$a+b=0.3$"], ["c", "$a=0.2$, $b=0.1$; $E(W^2)=0.4+1.2+1.8+1.6=5$ → $\\text{Var}=1$"]], "ans": "(c) 1", "warn": "", "idx": 58, "type": "tb", "sec": "9B-Ex", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Q25", "label": "Exercise 9B", "num": 25, "page": 274, "guides": [], "steps": [["Equations", "$p+q=0.7$, $p+2q+0.6=1.5$ → $q=0.2$, $p=0.5$"], ["Variance", "$E(X^2)=0.5+0.8+1.8=3.1$ → $\\text{Var}=3.1-2.25=0.85$"]], "ans": "0.85", "warn": "", "idx": 58, "type": "tb", "sec": "9B-Ex", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Q26", "label": "Exercise 9B", "num": 26, "page": 274, "guides": [], "steps": [["a", "mean 5, variance $30\\cdot\\frac16\\cdot\\frac56=\\frac{25}6$"], ["b", "$T=10X-c$: mean $50-c$, variance $100\\cdot\\frac{25}6=\\frac{1250}3$"], ["c", "$c=50$"]], "ans": "(c) 50", "warn": "", "idx": 58, "type": "tb", "sec": "9B-Ex", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Q27", "label": "Exercise 9B", "num": 27, "page": 274, "guides": [], "steps": [["Set up", "$E(S)=\\frac{26+c}6$, $E(S^2)=\\frac{194+c^2}6$"], ["Solve", "$\\frac{194+c^2}6-\\frac{(26+c)^2}{36}=\\frac{185}9\\Rightarrow5c^2-52c-252=0\\Rightarrow(c-14)(5c+18)=0$ → $c=14$ (since $c\\gt 10$)"]], "ans": "$c=14$", "warn": "", "idx": 58, "type": "tb", "sec": "9B-Ex", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Q28", "label": "Exercise 9B", "num": 28, "page": 274, "guides": [], "steps": [["Set up", "$p+q=0.6$; $E(X)=q+1$, $E(X^2)=q+2.6$"], ["Solve", "$q+2.6-(q+1)^2=0.85\\Rightarrow q^2+q-0.75=0\\Rightarrow q=0.5$"], ["Answer", "$E(X)=1.5$"]], "ans": "1.5", "warn": "", "idx": 58, "type": "tb", "sec": "9B-Ex", "code": "9B-Ex", "crumb": "Ch 9 · HL: Probability › 9B-Ex Exercise 9B"}, {"title": "Waiting for the bus", "ko": "버스를 기다리는 시간", "intro": "<p>A bus arrives every 10 minutes. You arrive at a random time, so your waiting time $X$ (minutes) is equally likely to be anywhere between 0 and 10.<\/p>", "intro_ko": "버스가 10분마다 옵니다. 임의의 시각에 도착하면 기다리는 시간 $X$는 0분에서 10분 사이 어디든 같은 가능성입니다.", "steps": [{"q": "What is $P(X\\lt 5)$? What is $P(2\\lt X\\lt 4)$?", "qk": "$P(X\\lt 5)$와 $P(2\\lt X\\lt 4)$는?", "a": "$\\frac{5}{10}=0.5$; &nbsp; $\\frac{2}{10}=0.2$", "ak": ""}, {"q": "What is the probability that you wait <b>exactly<\/b> 3 minutes (3.000…)?", "qk": "정확히 3분을 기다릴 확률은?", "a": "0 — an interval of length 0.", "ak": "0."}, {"q": "We describe $X$ with a horizontal line $f(x)=c$ for $0\\le x\\le10$, where probabilities are <b>areas<\/b>. What must $c$ be?", "qk": "$f(x)=c$ 그래프 아래 넓이가 확률이라면 $c$는?", "a": "Total area $=10c=1\\Rightarrow c=\\frac1{10}$", "ak": ""}, {"q": "How would you find a probability if $f(x)$ were a curve instead of a horizontal line?", "qk": "$f(x)$가 곡선이면 확률은 어떻게 구할까요?", "a": "Area under the curve ⇒ integrate: $P(a\\lt X\\lt b)=\\int_a^b f(x)\\,dx$.", "ak": "곡선 아래 넓이 → 적분."}], "idea": "A continuous random variable is described by a <b>probability density function<\/b> $f(x)$: probabilities are areas, $P(a\\lt X\\lt b)=\\int_a^b f(x)\\,dx$, and the total area is 1.", "idea_ko": "연속확률변수는 확률밀도함수 $f(x)$로 나타냅니다. 확률 = 넓이 = 적분이고 전체 넓이는 1입니다.", "fig": {"type": "pdf", "pts": [[0, 0.1], [10, 0.1], [10, 0]], "shade": [2, 4], "xr": [-0.5, 11], "ymax": 0.14, "xt": [0, 2, 4, 10], "yt": [{"v": 0.1, "l": "1/10"}]}, "type": "inquiry", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Words you need", "ko": "이 단원의 핵심 영단어", "rows": [["continuous random variable", "연속확률변수", "takes any value in an interval"], ["probability density function (pdf)", "확률밀도함수", "$f(x)$; area = probability"], ["piecewise function", "구간별로 정의된 함수", "different rules on different intervals"], ["otherwise", "그 밖의 경우", "$f(x)=0$ outside the given interval"], ["mode", "최빈값", "$x$ where $f(x)$ is largest"], ["median", "중앙값", "$\\int_{-\\infty}^{m}f(x)\\,dx=\\frac12$"], ["mean / expected value", "평균 / 기댓값", "$\\int xf(x)\\,dx$"], ["variance", "분산", "$\\int x^2f(x)\\,dx-\\mu^2$"], ["exact value", "정확한 값", "leave as fraction, surd, $\\ln$, $\\pi$"]], "phrases": [["$X$ has probability density function $f(x)=\\begin{cases}kx(4-x) & 0\\le x\\le4\\\\0 & \\text{otherwise}\\end{cases}$", "$X$의 확률밀도함수가 다음과 같다 (otherwise = 그 밖에는 0)"], ["Find the value of $k$.", "$k$의 값을 구하시오 → 전체 적분 = 1"], ["Find the exact value of the median of $X$.", "중앙값의 “정확한 값” → 적분 = 1/2을 풀어 근호·로그로 남기기"], ["Sketch the graph of $f$ and hence write down the mode.", "그래프를 그리고 최빈값을 쓰시오."], ["Find $P(X\\gt 1)$.", "$P(X\\gt 1)$을 구하시오."]], "type": "vocab", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL:  "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Mode, median, mean and variance", "ko": "최빈값, 중앙값, 평균, 분산", "kp": "• <b>Mode<\/b>: the value of $x$ where $f(x)$ is largest (may be at an end point).<br>• <b>Median<\/b> $m$: $\\displaystyle\\int_{-\\infty}^{m}f(x)\\,dx=\\frac12$<br>• <b>Mean<\/b>: $\\displaystyle E(X)=\\int_{-\\infty}^{\\infty}x\\,f(x)\\,dx$<br>• <b>Variance<\/b>: $\\displaystyle \\text{Var}(X)=\\int_{-\\infty}^{\\infty}x^2f(x)\\,dx-[E(X)]^2$", "body": "<p>The rules $E(aX+b)=aE(X)+b$ and $\\text{Var}(aX+b)=a^2\\text{Var}(X)$ still hold. If $f$ is symmetric about $x=c$, then mean = median $=c$.<\/p>", "kn": "이산형의 $\\sum$이 연속형에서는 $\\int$로 바뀝니다. 최빈값은 미분해서 $f'(x)=0$인 점이거나 구간의 끝점일 수 있으니 반드시 그래프를 확인하세요.", "tip": "", "guides": [], "fig": null, "type": "concept", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Example 9C.1", "ko": "", "q": "<p>$X$ has pdf $f(x)=kx(4-x)$ for $0\\le x\\le4$, and $0$ otherwise.<\/p><p><b>(a)<\/b> Find $k$.<\/p><p><b>(b)<\/b> Find $P(X\\lt 1)$.<\/p><p><b>(c)<\/b> Write down the mode, the median and the mean of $X$.<\/p><p><b>(d)<\/b> Find $\\text{Var}(X)$.<\/p>", "guides": [{"q": "Which equation gives $k$?", "qk": "$k$를 구하는 식은?", "a": "$\\int_0^4kx(4-x)\\,dx=1$", "ak": ""}, {"q": "Is the graph symmetric? About which line?", "qk": "그래프가 대칭인가요?", "a": "Yes, a parabola symmetric about $x=2$.", "ak": "$x=2$에 대해 대칭."}], "steps": [["(a)", "$k\\int_0^4(4x-x^2)\\,dx=k\\left[2x^2-\\tfrac{x^3}{3}\\right]_0^4=k\\cdot\\tfrac{32}{3}=1\\Rightarrow k=\\tfrac{3}{32}$"], ["(b)", "$\\tfrac{3}{32}\\left[2x^2-\\tfrac{x^3}{3}\\right]_0^1=\\tfrac{3}{32}\\cdot\\tfrac53=\\tfrac{5}{32}$"], ["(c) symmetry about $x=2$", "mode $=$ median $=$ mean $=2$"], ["(d) $E(X^2)$", "$\\tfrac{3}{32}\\int_0^4(4x^3-x^4)\\,dx=\\tfrac{3}{32}\\left(256-\\tfrac{1024}{5}\\right)=\\tfrac{24}{5}$"], ["$\\text{Var}(X)$", "$\\tfrac{24}{5}-2^2=\\tfrac45$"]], "ans": "(a) $\\frac3{32}$ (b) $\\frac5{32}$ (c) 2, 2, 2 (d) $\\frac45$", "fig": null, "ref": "", "type": "example", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Example 9C.2", "ko": "", "q": "<p>$X$ has pdf $f(x)=\\dfrac{x}{8}$ for $0\\le x\\le4$, and $0$ otherwise.<\/p><p><b>(a)<\/b> Find the exact value of the median.<\/p><p><b>(b)<\/b> Write down the mode.<\/p><p><b>(c)<\/b> Find $E(X)$ and $\\text{Var}(X)$.<\/p>", "guides": [{"q": "Where is $f(x)$ largest on $[0,4]$?", "qk": "$f(x)$가 가장 큰 곳은?", "a": "At the end point $x=4$.", "ak": "끝점 $x=4$."}], "steps": [["(a)", "$\\int_0^m\\tfrac{x}{8}\\,dx=\\tfrac{m^2}{16}=\\tfrac12\\Rightarrow m^2=8\\Rightarrow m=2\\sqrt2$"], ["(b)", "mode $=4$"], ["(c) $E(X)$", "$\\int_0^4\\tfrac{x^2}{8}\\,dx=\\tfrac{64}{24}=\\tfrac83$"], ["$E(X^2)$", "$\\int_0^4\\tfrac{x^3}{8}\\,dx=\\tfrac{256}{32}=8$"], ["$\\text{Var}(X)$", "$8-\\tfrac{64}{9}=\\tfrac89$"]], "ans": "(a) $2\\sqrt2$ (b) 4 (c) $\\frac83$, $\\frac89$", "fig": {"type": "pdf", "pts": [[0, 0], [4, 0.5], [4, 0]], "xr": [-0.4, 4.6], "ymax": 0.6, "xt": [0, {"v": 2.828, "l": "m"}, 4], "yt": [{"v": 0.5, "l": "1/2"}], "shade": [0, 2.828]}, "ref": "", "type": "example", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Example 9C.3", "ko": "", "q": "<p>$X$ has pdf $f(x)=\\begin{cases}kx & 0\\le x\\le2\\\\ k(4-x) & 2\\lt x\\le4\\\\ 0&\\text{otherwise}\\end{cases}$<\/p><p><b>(a)<\/b> Find $k$.<\/p><p><b>(b)<\/b> Find $P(1\\lt X\\lt 3)$.<\/p>", "guides": [{"q": "What shape is the graph? What is its area?", "qk": "그래프 모양과 넓이는?", "a": "A triangle with base 4 and height $2k$: area $4k$.", "ak": "밑변 4, 높이 $2k$인 삼각형."}], "steps": [["(a) area = 1", "$\\frac12\\cdot4\\cdot2k=4k=1\\Rightarrow k=\\frac14$"], ["(b) complement", "Left corner $0\\le x\\le1$: triangle $\\frac12\\cdot1\\cdot\\frac14=\\frac18$; right corner $3\\le x\\le4$: also $\\frac18$"], ["", "$P(1\\lt X\\lt 3)=1-\\frac18-\\frac18=\\frac34$"]], "ans": "(a) $\\frac14$ (b) $\\frac34$", "fig": {"type": "pdf", "pts": [[0, 0], [2, 0.5], [4, 0]], "shade": [1, 3], "xr": [-0.4, 4.6], "ymax": 0.6, "xt": [0, 1, 2, 3, 4], "yt": [{"v": 0.5, "l": "2k"}]}, "ref": "적분 없이 넓이로 풀 수 있는 문제 — 수능 확통에서 확률밀도함수를 다루는 방식과 같습니다.", "type": "example", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Example 9C.4", "ko": "", "q": "<p>$X$ has pdf $f(x)=\\frac12\\sin x$ for $0\\le x\\le\\pi$, and $0$ otherwise. Find $E(X)$ and the exact value of $\\text{Var}(X)$.<\/p>", "guides": [{"q": "Is the graph symmetric?", "qk": "대칭인가요?", "a": "Yes, about $x=\\frac\\pi2$, so $E(X)=\\frac\\pi2$.", "ak": ""}, {"q": "Which technique integrates $x^2\\sin x$?", "qk": "$x^2\\sin x$의 적분 방법은?", "a": "Integration by parts, twice.", "ak": "부분적분 2번."}], "steps": [["Mean", "$E(X)=\\frac\\pi2$ (symmetry)"], ["$\\int_0^\\pi x^2\\sin x\\,dx$", "by parts twice: $\\left[-x^2\\cos x+2x\\sin x+2\\cos x\\right]_0^\\pi=\\pi^2-4$"], ["$E(X^2)$", "$\\frac12(\\pi^2-4)$"], ["$\\text{Var}(X)$", "$\\frac{\\pi^2}{2}-2-\\frac{\\pi^2}{4}=\\frac{\\pi^2}{4}-2\\ (\\approx0.467)$"]], "ans": "$E(X)=\\frac\\pi2$, $\\text{Var}(X)=\\frac{\\pi^2}{4}-2$", "fig": null, "ref": "", "type": "example", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Question 1", "ko": "", "q": "<p>$f(x)=k(x^2+1)$ for $0\\le x\\le3$, and $0$ otherwise.<\/p><p><b>(a)<\/b> Find $k$.<\/p><p><b>(b)<\/b> Find $P(X\\gt 2)$.<\/p>", "guides": [{"q": "$\\int_0^3(x^2+1)\\,dx=$?", "qk": "", "a": "$9+3=12$", "ak": ""}], "steps": [["(a)", "$12k=1\\Rightarrow k=\\frac1{12}$"], ["(b)", "$\\frac1{12}\\left[\\frac{x^3}{3}+x\\right]_2^3=\\frac1{12}\\left(12-\\frac{14}{3}\\right)=\\frac{11}{18}$"]], "ans": "(a) $\\frac1{12}$ (b) $\\frac{11}{18}$", "fig": null, "ref": "", "type": "practice", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Question 2", "ko": "", "q": "<p>$f(x)=\\dfrac{3x^2}{8}$ for $0\\le x\\le2$, and $0$ otherwise.<\/p><p><b>(a)<\/b> Find the exact value of the median.<\/p><p><b>(b)<\/b> Find $E(X)$ and $\\text{Var}(X)$.<\/p><p><b>(c)<\/b> Write down the mode.<\/p>", "guides": [{"q": "Median equation?", "qk": "중앙값 식은?", "a": "$\\frac{m^3}{8}=\\frac12$", "ak": ""}], "steps": [["(a)", "$m^3=4\\Rightarrow m=\\sqrt[3]{4}\\ (\\approx1.59)$"], ["(b)", "$E(X)=\\int_0^2\\frac{3x^3}{8}dx=\\frac32$; $\\ E(X^2)=\\int_0^2\\frac{3x^4}{8}dx=\\frac{12}{5}$; $\\ \\text{Var}=\\frac{12}{5}-\\frac94=\\frac{3}{20}$"], ["(c)", "increasing ⇒ mode $=2$"]], "ans": "(a) $\\sqrt[3]4$ (b) $\\frac32$, $\\frac3{20}$ (c) 2", "fig": null, "ref": "", "type": "practice", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Question 3", "ko": "", "q": "<p>$f(x)=\\frac43e^{-x}$ for $0\\le x\\le\\ln4$, and $0$ otherwise.<\/p><p><b>(a)<\/b> Verify that $f$ is a pdf.<\/p><p><b>(b)<\/b> Find $P(X\\lt \\ln2)$.<\/p><p><b>(c)<\/b> Find the exact value of the median.<\/p>", "guides": [{"q": "$\\int e^{-x}dx=$?", "qk": "", "a": "$-e^{-x}$", "ak": ""}], "steps": [["(a)", "$f\\ge0$ and $\\frac43\\left[-e^{-x}\\right]_0^{\\ln4}=\\frac43\\left(1-\\frac14\\right)=1$ ✓"], ["(b)", "$\\frac43\\left(1-\\frac12\\right)=\\frac23$"], ["(c)", "$\\frac43(1-e^{-m})=\\frac12\\Rightarrow e^{-m}=\\frac58\\Rightarrow m=\\ln\\frac85$"]], "ans": "(b) $\\frac23$ (c) $\\ln\\frac85\\approx0.470$", "fig": null, "ref": "", "type": "practice", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Question 4", "ko": "", "q": "<p>$f(x)=\\frac34x(2-x)$ for $0\\le x\\le2$, and $0$ otherwise.<\/p><p><b>(a)<\/b> Write down the mode and $E(X)$.<\/p><p><b>(b)<\/b> Find $\\text{Var}(X)$.<\/p><p><b>(c)<\/b> Find $E(5X-2)$ and $\\text{Var}(5X-2)$.<\/p>", "guides": [{"q": "Symmetric about which line?", "qk": "대칭축은?", "a": "$x=1$", "ak": ""}], "steps": [["(a)", "mode $=1$, $E(X)=1$"], ["(b)", "$E(X^2)=\\frac34\\int_0^2(2x^3-x^4)dx=\\frac34\\cdot\\frac85=\\frac65$; $\\ \\text{Var}=\\frac65-1=\\frac15$"], ["(c)", "$E=5(1)-2=3$; $\\ \\text{Var}=25\\cdot\\frac15=5$"]], "ans": "(a) 1, 1 (b) $\\frac15$ (c) 3, 5", "fig": null, "ref": "", "type": "practice", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "Question 5", "ko": "", "q": "<p>$f(x)=ax+b$ for $0\\le x\\le1$, and $0$ otherwise. Given $E(X)=\\frac{7}{12}$, find $a$ and $b$.<\/p>", "guides": [{"q": "Two conditions?", "qk": "조건 두 개는?", "a": "$\\int_0^1f=1$ and $\\int_0^1xf=\\frac7{12}$", "ak": ""}], "steps": [["Total area", "$\\frac a2+b=1$"], ["Mean", "$\\frac a3+\\frac b2=\\frac7{12}$"], ["Solve", "$b=1-\\frac a2\\Rightarrow\\frac a3+\\frac12-\\frac a4=\\frac7{12}\\Rightarrow\\frac a{12}=\\frac1{12}\\Rightarrow a=1,\\ b=\\frac12$"]], "ans": "$a=1$, $b=\\frac12$", "fig": null, "ref": "", "type": "practice", "sec": "9C", "code": "9C", "crumb": "Ch 9 · HL: Probability › 9C Continuous random variables"}, {"title": "확률밀도함수 (수능 버전)", "unit": "수능특강 06 연속확률변수의 확률분포 · 1 연속확률변수, 2 확률밀도함수 (본문 74–75쪽)", "box": "<h4>⑴ 연속확률변수<\/h4>어떤 구간에 속하는 모든 실수의 값을 갖는 확률변수 (길이, 무게, 시간, 온도 등).<h4>⑵ 확률밀도함수<\/h4>$\\alpha\\le X\\le\\beta$에서 정의된 함수 $f(x)$가<br>&nbsp;① $f(x)\\ge0$<br>&nbsp;② $y=f(x)$의 그래프와 $x$축 및 두 직선 $x=\\alpha,\\ x=\\beta$로 둘러싸인 부분의 넓이가 1<br>&nbsp;③ $P(a\\le X\\le b)$는 $x=a$부터 $x=b$까지 그래프 아래의 넓이<br>를 만족시킬 때 $f(x)$를 $X$의 확률밀도함수라 한다.<h4>⑶ 수능 확통은 적분을 쓰지 않는다<\/h4>그래프가 직선(삼각형, 사다리꼴, 직사각형)으로 주어지고 넓이로 확률을 계산한다. $P(X=a)=0$.", "map": [["확률밀도함수", "probability density function", ""], ["넓이 = 1", "$\\int f(x)\\,dx=1$", "IB HL은 적분 사용"], ["$P(a\\le X\\le b)$ = 넓이", "$\\int_a^b f(x)\\,dx$", ""], ["연속확률변수의 평균·분산", "$\\int xf\\,dx$, $\\int x^2f\\,dx-\\mu^2$", "수능 확통에는 없음 (IB HL만)"]], "ex": "", "tip": "위 그래프에서 넓이 = 1로 $k$를 구해 보세요. 사다리꼴($0\\le x\\le1$) $\\frac{3k}{4}$ + 직사각형 $2k$ + 삼각형 $\\frac k2$ $=\\frac{13k}{4}=1$ → $k=\\frac4{13}$. 색칠된 $P(1\\le X\\le3)=2k=\\frac{8}     $('#count').textContent = k<0 ? 'Cover' : `${SECS[k].tb?'📖 ':SECS[k].code+' · '}${SECS[k].name}  (${b-a} cards)`;
    $('#prog > div').style.width=((k+1)/SECS.length*100)+'%';
    document.querySelectorAll('.toc-sec').forEach(x=>x.classList.toggle('on', k>=0 && x.dataset.sec===SECS[k].code));
    try{ localStorage.setItem(META.key, a); }catch(e){}
  }
  const tgt=document.getElementById('b'+cur), [a0]=secRange(k);
  if(!keepScroll){ if(cur===a0||!tgt) $('#stage').scrollTop=0; else tgt.scrollIntoView({block:'start'}); }
  try{ if(location.hash!=='#s'+(cur+1)) history.replaceState(null,'','#s'+(cur+1)); }catch(e){}
}
function goSec(d){ const k=secOf(cur)+d; if(k<-1||k>=SECS.length) return; show(k<0?0:SECS[k].start); }
document.addEventListener('click', e=>{
  const go=e.target.closest('[data-go]'); if(go){ show(+go.dataset.go); $('#side').classList.remove('open'); return; }
  const t=e.target.closest('[data-t]'); if(!t){ const sp=e.target.closest('.voc-quiz td.k span, .voc-quiz td.n span'); if(sp) sp.classList.toggle('see'); return; }
  const k=t.dataset.t, sl=t.closest('.blk')||$('#slide');
  if(k==='ga'){ const w=t.closest('.gq-item, .inq-step').querySelector('.ga-wrap'); w.classList.toggle('show'); t.textContent=w.classList.contains('show')?'숨기기':'답 보기'; }
  if(k==='ch'){ const ok=t.dataset.i===t.dataset.a; t.classList.add(ok?'right':'wrong'); if(ok) sl.querySelectorAll('.choice').forEach(c=>{if(c!==t) c.disabled=true;}); }
  if(k==='chk'){ const inp=t.parentNode.querySelector('input'), r=t.parentNode.querySelector('.res'); const ok=inp.value.replace(/\s/g,'')===inp.dataset.a; r.textContent=ok?'✓ 정답':'✗ 다시'; r.style.color=ok?'var(--green)':'var(--red)'; }
  if(k==='en'){ sl.querySelector('.en-box').classList.toggle('show'); }
  if(k==='idea'){ sl.querySelector('.big-idea').classList.toggle('show'); }
  if(k==='sol'){ const sol=sl.querySelector('.sol'); const on=!sol.classList.contains('show'); sol.classList.toggle('show',on);
     t.textContent=on?'풀이 닫기':'풀이 보기'; const more=sl.querySelectorAll('.step.hidden').length>0;
     sl.querySelectorAll('[data-t=step],[data-t=allstep]').forEach(x=>x.style.display=on&&more?'':'none'); }
  if(k==='step'||k==='allstep'){ const hid=sl.querySelectorAll('.step.hidden'); if(k==='step'&&hid[0]) hid[0].classList.remove('hidden'); else hid.forEach(h=>h.classList.remove('hidden'));
     if(!sl.querySelectorAll('.step.hidden').length){ sl.querySelector('[data-t=step]').style.display='none'; sl.querySelector('[data-t=allstep]').style.display='none'; } }
  if(k==='vquiz'){ const tb=sl.querySelector('table.voc'); tb.classList.toggle('voc-quiz'); sl.querySelectorAll('table.voc').forEach(x=>x.classList.toggle('voc-quiz', tb.classList.contains('voc-quiz'))); t.classList.toggle('on'); }
});
$('#openAll').onclick=()=>{const sl=$('#slide'); sl.querySelectorAll('.ga-wrap').forEach(w=>w.classList.add('show')); sl.querySelectorAll('.rv').forEach(b=>b.textContent='숨기기');
  sl.querySelectorAll('.sol,.big-idea,.en-box').forEach(w=>w.classList.add('show')); sl.querySelectorAll('.step').forEach(w=>w.classList.remove('hidden'));
  sl.querySelectorAll('[data-t=sol]').forEach(b=>b.textContent='풀이 닫기'); sl.querySelectorAll('[data-t=step],[data-t=allstep]').forEach(x=>x.style.display='none');
  sl.querySelectorAll('.voc-quiz').forEach(x=>x.classList.remove('voc-quiz'));};
$('#closeAll').onclick=()=>{const y=$('#stage').scrollTop; curSec=null; show(cur,true); $('#stage').scrollTop=y;};
$('#koBtn').onclick=e=>{document.body.classList.toggle('nok'); e.target.textContent=document.body.classList.contains('nok')?'한글 OFF':'한글 ON'; e.target.classList.toggle('on');};
$('#prev').onclick=()=>goSec(-1); $('#next').onclick=()=>goSec(1);
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight') goSec(1); if(e.key==='ArrowLeft') goSec(-1); });
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#s(\d+)$/); if(m&&+m[1]-1!==cur) show(+m[1]-1);});
buildSide();
let start=0; const m=location.hash.match(/^#s(\d+)$/); if(m) start=+m[1]-1; else { try{ start=+(localStorage.getItem(META.key)||0);}catch(e){} }
show(start);
})();
</script>
</body>
</html>
