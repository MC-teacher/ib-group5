<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 8 · Vectors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN: Academic editorial — dark navy base with warm
   cream cards, gold accents, serif type, mathematical
   precision in the layout.
═══════════════════════════════════════════════════════ */
:root {
  --navy:    #131d30;
  --navy2:   #1b2a47;
  --teal:    #1a6b3c;
  --teal2:   #27a25a;
  --gold:    #e8a020;
  --gold2:   #f4bb50;
  --cream:   #f5f0e8;
  --cream2:  #ede7d9;
  --white:   #ffffff;
  --dark:    #1a1a1a;
  --grey:    #5a6470;
  --red:     #c0392b;
  --green:   #1a7a4a;
  --slide-w: 860px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--navy);
  color: var(--cream);
  font-family: 'Source Serif 4', Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── TOP NAV ──────────────────────────────────────── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(19,29,48,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(232,160,32,0.25);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 52px;
}
.nav-brand {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--gold); letter-spacing: 0.03em;
}
.nav-pills {
  display: flex; gap: 0.4rem; list-style: none; overflow-x: auto;
  scrollbar-width: none;
}
.nav-pills::-webkit-scrollbar { display: none; }
.nav-pills a {
  display: block; padding: 0.3rem 0.75rem;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; font-weight: 600;
  color: rgba(245,240,232,0.65);
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
}
.nav-pills a:hover, .nav-pills a.active {
  background: var(--teal); color: var(--white);
}

/* ─── SLIDE STREAM ─────────────────────────────────── */
main {
  padding-top: 68px;
  display: flex; flex-direction: column; align-items: center;
  gap: 0;
}

/* each "slide" */
.slide {
  width: 100%; max-width: var(--slide-w);
  margin: 0.6rem 1.2rem;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  opacity: 0; transform: translateY(24px);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.slide.visible { opacity: 1; transform: none; }

/* ─── SLIDE TYPES ───────────────────────────────────── */

/* TITLE */
.s-title {
  background: var(--navy2);
  border: 1px solid rgba(232,160,32,0.3);
  padding: 3rem 3.5rem 2.5rem;
  position: relative;
}
.s-title::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--teal), var(--gold));
}
.chapter-badge {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem; font-weight: 900; color: var(--white);
  margin-bottom: 1.2rem;
}
.s-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900; color: var(--white);
  line-height: 1.1; margin-bottom: 0.4rem;
}
.s-title .subtitle {
  font-size: 1.15rem; font-style: italic;
  color: var(--gold); margin-bottom: 1.8rem;
}
.learning-goals { list-style: none; display: grid; gap: 0.5rem; }
.learning-goals li {
  display: flex; align-items: flex-start; gap: 0.6rem;
  font-size: 0.92rem; color: rgba(245,240,232,0.8);
}
.learning-goals li::before {
  content: '→'; color: var(--teal2); font-weight: 700;
  flex-shrink: 0; margin-top: 0.05rem;
}

/* SECTION DIVIDER */
.s-divider {
  background: var(--teal);
  padding: 2.2rem 3rem;
  display: flex; align-items: center; gap: 2rem;
  position: relative; overflow: hidden;
}
.s-divider::after {
  content: attr(data-symbol);
  position: absolute; right: 2rem; top: 50%;
  transform: translateY(-50%);
  font-family: 'Playfair Display', serif;
  font-size: 7rem; font-weight: 900;
  color: rgba(255,255,255,0.08); line-height: 1;
  pointer-events: none;
}
.divider-num {
  font-family: 'Playfair Display', serif;
  font-size: 4rem; font-weight: 900;
  color: rgba(255,255,255,0.2);
  line-height: 1; flex-shrink: 0;
}
.s-divider h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem; font-weight: 700; color: var(--white);
}
.s-divider p { font-size: 0.9rem; color: rgba(255,255,255,0.75); margin-top: 0.3rem; }

/* KEY POINT */
.s-keypoint {
  background: var(--cream);
  color: var(--dark);
  padding: 0;
}
.kp-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 1rem;
}
.kp-badge {
  background: var(--gold);
  color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; font-weight: 600;
  padding: 0.25rem 0.6rem; border-radius: 4px;
  white-space: nowrap;
}
.kp-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700; color: var(--white);
}
.kp-body { padding: 1.4rem 1.8rem; }
.formula-box {
  background: var(--navy2);
  border-left: 4px solid var(--teal);
  border-radius: 8px;
  padding: 1.1rem 1.5rem;
  margin-bottom: 1.2rem;
  text-align: center;
}
.formula-box .formula {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  font-weight: 600; color: var(--white);
}
.formula-box .formula-alt {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1rem; color: var(--gold2);
  margin-top: 0.4rem;
}
.note-list { list-style: none; display: grid; gap: 0.55rem; }
.note-list li {
  display: flex; align-items: flex-start; gap: 0.7rem;
  font-size: 0.9rem; color: var(--dark);
}
.note-list li::before {
  content: '▸'; color: var(--teal); font-size: 0.75rem;
  flex-shrink: 0; margin-top: 0.2rem;
}

/* TWO COLUMN */
.s-two-col {
  background: var(--cream);
  color: var(--dark);
  padding: 0;
}
.two-col-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
}
.two-col-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700; color: var(--white);
}
.two-col-body {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0; min-height: 240px;
}
.col-card {
  padding: 1.2rem 1.4rem;
}
.col-card:first-child { border-right: 1px solid var(--cream2); }
.col-card h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; font-weight: 600;
  color: var(--teal); text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.8rem; padding-bottom: 0.4rem;
  border-bottom: 2px solid var(--teal);
}
.col-card .col-content {
  font-size: 0.88rem; line-height: 1.7; color: var(--dark);
}
.col-card .col-content strong { color: var(--teal); }

/* WORKED EXAMPLE */
.s-example {
  background: var(--cream);
  color: var(--dark);
  padding: 0;
}
.ex-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 1rem;
}
.ex-badge {
  background: var(--teal);
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; font-weight: 600;
  padding: 0.25rem 0.65rem; border-radius: 4px;
  white-space: nowrap;
}
.ex-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.ex-body { padding: 1.4rem 1.8rem; }
.question-box {
  background: var(--white);
  border: 1px solid var(--cream2);
  border-left: 4px solid var(--teal);
  border-radius: 6px;
  padding: 1rem 1.2rem;
  margin-bottom: 1.2rem;
}
.question-box .q-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  color: var(--teal); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.4rem;
}
.question-box .q-text {
  font-size: 0.95rem; line-height: 1.65; color: var(--dark);
}
.hints-section h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  color: var(--gold); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.6rem;
}
.hint-list { list-style: none; display: grid; gap: 0.4rem; }
.hint-list li {
  display: flex; gap: 0.6rem;
  font-size: 0.88rem; color: var(--dark);
}
.hint-num {
  background: var(--teal);
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; font-weight: 600;
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 0.1rem;
}

/* BE THE EXAMINER — question only */
.s-examiner-q {
  background: var(--cream); color: var(--dark); padding: 0;
}
.examiner-q-header {
  background: #4a2040;
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 0.8rem;
}
.examiner-q-header .ex-q-badge {
  background: var(--gold); color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 700;
  padding: 0.2rem 0.6rem; border-radius: 4px;
}
.examiner-q-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.examiner-q-body { padding: 1.4rem 1.8rem; }
.challenge-box {
  background: var(--white); border: 1px solid var(--cream2);
  border-left: 4px solid #4a2040;
  border-radius: 6px; padding: 1rem 1.2rem; margin-bottom: 1.2rem;
}
.challenge-box .q-text { font-size: 0.95rem; line-height: 1.65; }
.task-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; font-weight: 600;
  color: #4a2040; font-style: italic;
  margin-top: 0.5rem;
}
/* think-time note */
.think-note {
  background: rgba(74,32,64,0.08);
  border: 1px dashed rgba(74,32,64,0.3);
  border-radius: 6px; padding: 0.7rem 1rem;
  font-size: 0.85rem; color: #4a2040; font-style: italic;
  display: flex; align-items: center; gap: 0.5rem;
}

/* BE THE EXAMINER — with solutions */
.s-examiner {
  background: var(--cream); color: var(--dark); padding: 0;
}
.examiner-header {
  background: #4a2040;
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 0.8rem;
}
.examiner-header .ex-badge-purple {
  background: var(--gold); color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 700;
  padding: 0.2rem 0.6rem; border-radius: 4px;
}
.examiner-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.examiner-body { padding: 1.4rem 1.8rem; }
.solutions-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 0.8rem; margin-top: 1rem;
}
.sol-card {
  border-radius: 8px; overflow: hidden;
  border: 1px solid var(--cream2);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.sol-card-header {
  padding: 0.5rem 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; font-weight: 700; color: var(--white);
}
.sol-card-body {
  background: var(--white);
  padding: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem; line-height: 1.7; color: var(--dark);
}
.sol-navy .sol-card-header  { background: var(--navy2); }
.sol-red   .sol-card-header { background: var(--red); }
.sol-green .sol-card-header { background: var(--green); }
.examiner-note {
  margin-top: 1rem;
  font-size: 0.82rem; color: var(--teal);
  font-style: italic;
}

/* EXERCISE SET */
.s-exercise {
  background: var(--cream); color: var(--dark); padding: 0;
}
.ex-set-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; justify-content: space-between;
}
.ex-set-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.ex-set-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  color: var(--gold); background: rgba(232,160,32,0.15);
  padding: 0.2rem 0.6rem; border-radius: 4px;
}
.ex-set-body { padding: 1.2rem 1.4rem; }
.problems-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
}
.prob-card {
  background: var(--white);
  border: 1px solid var(--cream2);
  border-left: 3px solid var(--gold);
  border-radius: 6px; padding: 0.8rem 1rem;
}
.prob-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; font-weight: 700;
  color: var(--teal); margin-bottom: 0.3rem;
}
.prob-q { font-size: 0.88rem; line-height: 1.55; color: var(--dark); }

/* SUMMARY */
.s-summary {
  background: var(--navy2);
  border: 1px solid rgba(232,160,32,0.25);
  padding: 2rem 2.5rem;
}
.s-summary h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem; font-weight: 700; color: var(--white);
  margin-bottom: 1.4rem;
}
.summary-table {
  width: 100%; border-collapse: collapse;
  font-size: 0.88rem;
}
.summary-table th {
  text-align: left; padding: 0.6rem 0.9rem;
  background: rgba(255,255,255,0.05);
  color: var(--gold); font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
  border-bottom: 1px solid rgba(232,160,32,0.3);
}
.summary-table td {
  padding: 0.6rem 0.9rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  color: var(--cream); vertical-align: middle;
}
.summary-table td:nth-child(2) {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem; color: var(--gold2);
}
.summary-table tr:last-child td { border-bottom: none; }
.summary-note {
  margin-top: 1.2rem; padding: 0.75rem 1rem;
  background: rgba(13,115,119,0.2);
  border-left: 3px solid var(--teal2);
  border-radius: 4px;
  font-size: 0.82rem; color: var(--cream); font-style: italic;
}

/* ─── Q&A SLIDE (Question → Solution) ──────────────── */
.s-qa {
  background: var(--cream); color: var(--dark); padding: 0;
}
.qa-header {
  background: var(--navy2);
  padding: 0.85rem 1.8rem;
  display: flex; align-items: center; gap: 0.8rem;
}
.qa-qnum {
  background: var(--gold);
  color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; font-weight: 700;
  padding: 0.22rem 0.65rem; border-radius: 4px;
  white-space: nowrap;
}
.qa-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.qa-body { padding: 1.2rem 1.8rem 1.4rem; }

/* question panel */
.qa-question {
  background: var(--white);
  border: 1px solid var(--cream2);
  border-left: 4px solid var(--teal);
  border-radius: 6px;
  padding: 0.9rem 1.1rem;
  margin-bottom: 1rem;
}
.qa-qlabel {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem; font-weight: 600;
  color: var(--teal); text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.35rem;
}
.qa-qtext { font-size: 0.93rem; line-height: 1.65; }

/* hint strip */
.qa-hint {
  background: rgba(13,115,119,0.08);
  border: 1px dashed rgba(13,115,119,0.35);
  border-radius: 5px;
  padding: 0.55rem 0.9rem;
  font-size: 0.82rem; color: var(--teal);
  font-style: italic; margin-bottom: 1rem;
  display: flex; align-items: flex-start; gap: 0.5rem;
}

/* solution panel — revealed on click */
.qa-solution {
  border-radius: 8px; overflow: hidden;
  border: 1px solid var(--cream2);
}
.qa-sol-toggle {
  width: 100%;
  background: var(--navy2);
  color: var(--white);
  border: none; cursor: pointer;
  padding: 0.7rem 1.1rem;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; font-weight: 600;
  letter-spacing: 0.04em;
  transition: background 0.2s;
}
.qa-sol-toggle:hover { background: var(--teal); }
.qa-sol-arrow {
  transition: transform 0.3s;
  font-size: 0.9rem;
}
.qa-sol-toggle.open .qa-sol-arrow { transform: rotate(180deg); }
.qa-sol-body {
  background: var(--white);
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s ease;
}
.qa-sol-body.open { max-height: 600px; }
.qa-sol-inner { padding: 1rem 1.1rem; }

/* step rows */
.sol-steps { display: grid; gap: 0.6rem; }
.sol-step {
  display: flex; align-items: flex-start; gap: 0.75rem;
}
.step-badge {
  background: var(--teal);
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; font-weight: 700;
  padding: 0.18rem 0.5rem; border-radius: 3px;
  white-space: nowrap; flex-shrink: 0;
  margin-top: 0.15rem;
}
.step-content { font-size: 0.88rem; line-height: 1.6; color: var(--dark); }
.step-content .math {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem; color: var(--navy2);
  background: var(--cream); padding: 0.1rem 0.35rem;
  border-radius: 3px;
}
.sol-answer {
  margin-top: 0.85rem;
  padding: 0.6rem 0.9rem;
  background: var(--navy2);
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88rem; color: var(--gold2);
  font-weight: 600;
}

/* ─── PROGRESS BAR ─────────────────────────────────── */
.progress-bar {
  position: fixed; top: 52px; left: 0; right: 0;
  height: 3px; background: rgba(255,255,255,0.08); z-index: 99;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--gold));
  width: 0%; transition: width 0.3s;
}

/* ─── SLIDE COUNTER ────────────────────────────────── */
.slide-counter {
  position: fixed; bottom: 1.2rem; right: 1.4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem; color: rgba(245,240,232,0.4);
}

/* ─── FOOTER ───────────────────────────────────────── */
footer {
  max-width: var(--slide-w); width: 100%; margin: 1rem 0 2rem;
  padding: 1rem 1.5rem;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; color: rgba(245,240,232,0.3);
}

/* ─── RESPONSIVE ───────────────────────────────────── */
@media (max-width: 640px) {
  .two-col-body { grid-template-columns: 1fr; }
  .col-card:first-child { border-right: none; border-bottom: 1px solid var(--cream2); }
  .solutions-grid { grid-template-columns: 1fr; }
  .problems-grid  { grid-template-columns: 1fr; }
  .s-title, .s-divider { padding: 2rem 1.5rem; }
  .kp-body, .ex-body, .examiner-body, .examiner-q-body, .ex-set-body { padding: 1rem 1.2rem; }
  .nav-pills { display: none; }
}

/* ═══ ADDITIONS FOR CHAPTER 8 (vectors + guided questions) ═══ */
/* column vector */
.cv {
  display: inline-flex; flex-direction: column; vertical-align: middle;
  border-left: 1.6px solid currentColor; border-right: 1.6px solid currentColor;
  border-radius: 9px; padding: 0.05em 0.4em; margin: 0.1em 0.15em;
  line-height: 1.2; text-align: center; font-size: 0.92em;
}

const SLIDES = [];
/* ==== 00_title ==== */
/* ---------- SVG helpers for diagrams ---------- */
let _MK = 0;
function _arrowDefs(id, col) {
  return `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`;
}
/* grid with vectors; coordinates in grid units, y measured upward from bottom */
function gridSVG(cols, rows, vecs, unit) {
  unit = unit || 34; const pad = 14;
  const W = cols * unit + 2 * pad, H = rows * unit + 2 * pad;
  const X = x => pad + x * unit, Y = y => pad + (rows - y) * unit;
  let g = '';
  for (let i = 0; i <= cols; i++) g += `<line x1="${X(i)}" y1="${pad-6}" x2="${X(i)}" y2="${H-pad+6}" stroke="#b9b9b9" stroke-width="1"/>`;
  for (let j = 0; j <= rows; j++) g += `<line x1="${pad-6}" y1="${Y(j)}" x2="${W-pad+6}" y2="${Y(j)}" stroke="#b9b9b9" stroke-width="1"/>`;
  const id = 'mk' + (_MK++);
  let v = '';
  vecs.forEach(o => {
    const [x1, y1] = o.from, [x2, y2] = o.to;
    v += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="#1a8fd0" stroke-width="2.4" marker-end="url(#${id})"/>`;
    const mx = (X(x1) + X(x2)) / 2, my = (Y(y1) + Y(y2)) / 2;
    v += `<text x="${mx + (o.dx || 8)}" y="${my + (o.dy || -6)}" font-family="Georgia" font-weight="700" font-size="15" fill="#1a8fd0">${o.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg"><defs>${_arrowDefs(id, '#1a8fd0')}</defs>${g}${v}</svg>`;
}
/* free figure: pts {A:[x,y,labelDx,labelDy]}, segs [{p:'A',q:'B',label,arrow,color,dash,lx,ly}] (svg px, y down) */
function figSVG(W, H, pts, segs, extra) {
  const ids = {};
  const col = c => c || '#1b2a47';
  let defs = '', body = '';
  segs.forEach(s => {
    const c = col(s.color);
    if (s.arrow && !ids[c]) { ids[c] = 'mk' + (_MK++); defs += _arrowDefs(ids[c], c); }
    const [x1, y1] = pts[s.p], [x2, y2] = pts[s.q];
    if (s.arrow === 'mid') {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="6 5"' : ''}/>`;
      body += `<line x1="${x1}" y1="${y1}" x2="${mx + (x2 - x1) * 0.04}" y2="${my + (y2 - y1) * 0.04}" stroke="${c}" stroke-width="2.2" marker-end="url(#${ids[c]})"/>`;
    } else {
      body += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="6 5"' : ''} ${s.arrow ? `marker-end="url(#${ids[c]})"` : ''}/>`;
    }
    if (s.label) {
      const mx = (x1 + x2) / 2 + (s.lx || 0), my = (y1 + y2) / 2 + (s.ly || 0);
      body += `<text x="${mx}" y="${my}" font-family="Georgia" font-weight="700" font-size="16" fill="${c}" text-anchor="middle">${s.label}</text>`;
    }
  });
  Object.keys(pts).forEach(k => {
    const p = pts[k]; if (p[4] === false) return;
    body += `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#1b2a47"/>`;
    body += `<text x="${p[0] + (p[2] || 0)}" y="${p[1] + (p[3] || 0)}" font-family="Georgia" font-style="italic" font-size="16" fill="#1b2a47" text-anchor="middle">${k}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}${extra || ''}</svg>`;
}

SLIDES.push(
{ type:'divider', id:'div-8a', navLabel:'8A', symbol:'A', bigNum:'8A', heading:'Introduction to Vectors', sub:'Representations, addition, scalar multiples, parallel vectors, magnitude and unit vectors' },

{ type:'guided', id:'gi8a1', navLabel:'GI 8A-1', heading:'Guided Inquiry — What do you need to describe a journey?',

{ type:'example', id:'we81', navLabel:'WE 8.1', badge:'Worked Example 8.1', heading:'Worked Example 8.1 — Reading Column Vectors from a Grid',

         {q:"Once t is known, how do you find p and q?", a:"Equate the remaining components: p = 2t, q = 7t."}],
  hints:["If two vectors are parallel we can write **c** = t**a**: [[−2;p;q]] = t[[1;2;7]] = [[t;2t;7t]]", "Equal vectors have equal components: −2 = t, p = 2t, q = 7t", "p = −4, q = −14"] },

{ type:'keypoint', id:'kp82', navLabel:'KP 8.2', badge:'Key Point 8.2', heading:'Key Point 8.2 — Magnitude of a Vector',
  formula:"**a** = [[a₁;a₂;a₃]]  ⟹  |**a**| = √(a₁² + a₂² + a₃²)",
  notes:["This is Pythagoras’ theorem applied twice (once in the base, once vertically).", "The magnitude symbol is the same as the absolute value (modulus) symbol.", "|k**a**| = |k||**a**| — scaling by k multiplies the length by |k|."] },

{ type:'keypoint', id:'kp83', navLabel:'KP 8.3', badge:'Key Point 8.3', heading:'Key Point 8.3 — Unit Vectors',
  formula:"The unit vector in the direction of **a** is  **a** / |**a**|",
  notes:["A unit vector has magnitude 1. **i**, **j**, **k** are unit vectors.", "Dividing by the magnitude keeps the direction but changes the length to 1.", "−**a**/|**a**| is the unit vector in the opposite direction — also “parallel to **a**”."] },

{ type:'example', id:'we87', navLabel:'WE 8.7', badge:'Worked Example 8.7', heading:'Worked Example 8.7 — Magnitude and Unit Vector',
  question:"a  Find the magnitude of the vector **a** = [[2;−2;1]].\nb  Find a unit vector parallel to **a**.",
  guide:[{q:"Do negative components reduce the magnitude?", a:"No — each component is squared, so signs don’t matter."},
         {q:"Why are there two possible answers in part b?", a:"You may divide by 3 or by −3; the second reverses the direction but is still parallel."}],
  hints:["Use Pythagoras: |**a**| = √(2² + 2² + 1²) = 3", "Divide by the magnitude: unit vector = ⅓**a** = [[2/3;−2/3;1/3]]"] },

{ type:'qa', id:'a5', navLabel:'A5', qnum:'Q 5', heading:'Column vectors → base vectors',
  question:"Write using base vectors **i**, **j**, **k**:\na  [[1;2;3]]     b  [[4;5;6]]",
  guide:[{q:"Which base vector goes with the top component? The middle? The bottom?", a:"Top → **i**, middle → **j**, bottom → **k**."}],
  steps:[{label:'a', text:"Components are the coefficients: **i** + 2**j** + 3**k**"},{label:'b', text:"4**i** + 5**j** + 6**k**"}],
  answer:"a  **i** + 2**j** + 3**k**     b  4**i** + 5**j** + 6**k**" },
{ type:'qa', id:'a6', navLabel:'A6', qnum:'Q 6', heading:'Column vectors → base vectors',
  question:"Write using base vectors **i**, **j**, **k**:\na  [[−3;1;0]]     b  [[2;−2;0]]",
  guide:[{q:"What happens to a component that is zero?", a:"That base vector is simply left out."}],
  steps:[{label:'a', text:"−3**i** + 1**j** + 0**k** = −3**i** + **j**"},{label:'b', text:"2**i** − 2**j** + 0**k** = 2**i** − 2**j**"}],
  answer:"a  −3**i** + **j**     b  2**i** − 2**j**" },
{ type:'qa', id:'a7', navLabel:'A7', qnum:'Q 7', heading:'Column vectors → base vectors',
  question:"Write using base vectors **i**, **j**, **k**:\na  [[3;0;0]]     b  [[0;−5;0]]",
  guide:[{q:"Which directions do these vectors point along?", a:"a is along the x-axis (**i**), b along the negative y-axis (−**j**)."}],
  steps:[{label:'a', text:"Only the **i**-component is non-zero: 3**i**"},{label:'b', text:"Only the **j**-component is non-zero: −5**j**"}],

{ type:'qa', id:'a8', navLabel:'A8', qnum:'Q 8', heading:'Base vectors → column vectors',
  question:"Write as three-dimensional column vectors:\na  2**i** − 3**j** + **k**     b  3**i** + **j** − 4**k**",

  steps:[{label:'a', text:"Coefficients 2, −3, 1"},{label:'b', text:"Coefficients 3, 1, −4"}],

{ type:'qa', id:'a9', navLabel:'A9', qnum:'Q 9', heading:'Base vectors → column vectors',
  question:"Write as three-dimensional column vectors:\na  **i** + 3**k**     b  2**j** − **k**",
  guide:[{q:"Which component is missing in each?", a:"a has no **j** term; b has no **i** term — those components are 0."}],
  steps:[{label:'a', text:"**i**-coefficient 1, **j**-coefficient 0, **k**-coefficient 3"},{label:'b', text:"0, 2, −1"}],
  answer:"a  [[1;0;3]]     b  [[0;2;−1]]" },
{ type:'qa', id:'a10', navLabel:'A10', qnum:'Q 10', heading:'Base vectors → column vectors (order matters!)',
  question:"Write as three-dimensional column vectors:\na  4**j** − **i** − 2**k**     b  **k** − 3**i**",
  guide:[{q:"The terms are not written in the order i, j, k. What must you do before writing the column?", a:"Re-order: a = −**i** + 4**j** − 2**k**, b = −3**i** + 0**j** + **k**."}],
  steps:[{label:'a', text:"−**i** + 4**j** − 2**k**"},{label:'b', text:"−3**i** + 0**j** + 1**k**"}],
  answer:"a  [[−1;4;−2]]     b  [[−3;0;1]]" },

{ type:'qa', id:'a11', navLabel:'A11', qnum:'Q 11', heading:'Routes along a chain of vectors',
  question:"{AB} = **a**, {BC} = **b**, {CD} = **c**. Express in terms of **a**, **b**, **c**:\na  {AC}     b  {BD}", fig: FIG_QUAD,
  guide:[{q:"Which route from A to C uses only the given vectors?", a:"A → B → C."},{q:"Which route from B to D?", a:"B → C → D."}],
  steps:[{label:'a', text:"{AC} = {AB} + {BC} = **a** + **b**"},{label:'b', text:"{BD} = {BC} + {CD} = **b** + **c**"}],
  answer:"a  **a** + **b**     b  **b** + **c**" },
{ type:'qa', id:'a12', navLabel:'A12', qnum:'Q 12', heading:'Going against the arrows',
  question:"{AB} = **a**, {BC} = **b**, {CD} = **c**. Express in terms of **a**, **b**, **c**:\na  {DA}     b  {DB}", fig: FIG_QUAD,
  guide:[{q:"If you travel D → C → B → A, are you going with or against each arrow?", a:"Against each arrow, so each vector gets a minus sign."}],
  steps:[{label:'a', text:"{DA} = −{AD} = −(**a** + **b** + **c**)"},{label:'b', text:"{DB} = {DC} + {CB} = −**c** − **b**"}],
  answer:"a  −**a** − **b** − **c**     b  −**b** − **c**" },

{ type:'qa', id:'a13', navLabel:'A13', qnum:'Q 13', heading:'Vector subtraction',
  question:"**a** = [[1;2;3]], **b** = [[4;−5;6]]. Find  a  **a** − **b**    b  **b** − **a**",
  guide:[{q:"How should **b** − **a** relate to **a** − **b**?", a:"It is the negative: **b** − **a** = −(**a** − **b**). Use this to check."}],
  steps:[{label:'a', text:"[[1−4;2−(−5);3−6]] = [[−3;7;−3]]"},{label:'b', text:"[[4−1;−5−2;6−3]] = [[3;−7;3]]  ✓ the negative of part a"}],
  answer:"a  [[−3;7;−3]]     b  [[3;−7;3]]" },
{ type:'qa', id:'a14', navLabel:'A14', qnum:'Q 14', heading:'Linear combinations',
  question:"**a** = [[1;2;3]], **b** = [[4;−5;6]]. Find  a  3**a** + 2**b**    b  2**a** + 5**b**",
  guide:[{q:"What is 3**a**? What is 2**b**?", a:"3**a** = [[3;6;9]], 2**b** = [[8;−10;12]]."}],
  steps:[{label:'a', text:"[[3;6;9]] + [[8;−10;12]] = [[11;−4;21]]"},{label:'b', text:"[[2;4;6]] + [[20;−25;30]] = [[22;−21;36]]"}],
  answer:"a  [[11;−4;21]]     b  [[22;−21;36]]" },
{ type:'qa', id:'a15', navLabel:'A15', qnum:'Q 15', heading:'Linear combinations',
  question:"**a** = [[1;2;3]], **b** = [[4;−5;6]]. Find  a  3**b** − **a**    b  **b** − 2**a**",
  guide:[{q:"Compute 3**b** and 2**a** first.", a:"3**b** = [[12;−15;18]], 2**a** = [[2;4;6]]."}],
  steps:[{label:'a', text:"[[12;−15;18]] − [[1;2;3]] = [[11;−17;15]]"},{label:'b', text:"[[4;−5;6]] − [[2;4;6]] = [[2;−9;0]]"}],
  answer:"a  [[11;−17;15]]     b  [[2;−9;0]]" },

{ type:'qa', id:'a16', navLabel:'A16', qnum:'Q 16', heading:'Parallelogram with extended sides',
  question:"ABCD is a parallelogram with {AB} = {DC} = **a** and {AD} = {BC} = **b**. M is the midpoint of BC, BQ = ½AB (Q on AB extended) and CP = ⅓BC (P on BC extended).\nFind  a  {AP}    b  {AM}", fig: FIG_PARA_16,
  guide:[{q:"Express {BP} as a multiple of **b**.", a:"BP = BC + CP = **b** + ⅓**b** = (4/3)**b**."},{q:"Express {BM} as a multiple of **b**.", a:"{BM} = ½**b**."}],
  steps:[{label:'a', text:"{AP} = {AB} + {BC} + {CP} = **a** + **b** + ⅓**b**"},{label:'b', text:"{AM} = {AB} + {BM} = **a** + ½**b**"}],
  answer:"a  **a** + (4/3)**b**     b  **a** + ½**b**" },
{ type:'qa', id:'a17', navLabel:'A17', qnum:'Q 17', heading:'Parallelogram with extended sides',
  question:"Same diagram. Find  a  {QD}    b  {MQ}", fig: FIG_PARA_16,
  guide:[{q:"What is {AQ} in terms of **a**?", a:"AQ = AB + BQ = (3/2)**a**."},{q:"Route for {MQ}?", a:"M → B → Q."}],
  steps:[{label:'a', text:"{QD} = {QA} + {AD} = −(3/2)**a** + **b**"},{label:'b', text:"{MQ} = {MB} + {BQ} = −½**b** + ½**a**"}],
  answer:"a  −(3/2)**a** + **b**     b  ½**a** − ½**b**" },
{ type:'qa', id:'a18', navLabel:'A18', qnum:'Q 18', heading:'Parallelogram with extended sides',
  question:"Same diagram. Find  a  {DQ}    b  {PQ}", fig: FIG_PARA_16,
  guide:[{q:"How can you use your answer to Q17a?", a:"{DQ} = −{QD}."},{q:"Route for {PQ}?", a:"P → B → Q, where {PB} = −(4/3)**b**."}],
  steps:[{label:'a', text:"{DQ} = −{QD} = (3/2)**a** − **b**"},{label:'b', text:"{PQ} = {PB} + {BQ} = −(4/3)**b** + ½**a**"}],
  answer:"a  (3/2)**a** − **b**     b  ½**a** − (4/3)**b**" },

{ type:'qa', id:'a19', navLabel:'A19', qnum:'Q 19', heading:'Parallel vectors — find p and q',
  question:"Find p and q such that **a** and **b** are parallel.\na  **a** = [[2;1;5]], **b** = [[6;p;q]]     b  **a** = [[1;1;4]], **b** = [[4;p;q]]",
  guide:[{q:"Write **b** = t**a**. Which component gives t directly?", a:"The first: a 6 = 2t → t = 3;  b 4 = t."}],
  steps:[{label:'a', text:"6 = 2t ⇒ t = 3;  p = 1·3 = 3,  q = 5·3 = 15"},{label:'b', text:"4 = 1·t ⇒ t = 4;  p = 4,  q = 16"}],
  answer:"a  p = 3, q = 15     b  p = 4, q = 16" },
{ type:'qa', id:'a20', navLabel:'A20', qnum:'Q 20', heading:'Parallel vectors — negative scalar',
  question:"Find p and q such that **a** and **b** are parallel.\na  **a** = [[3;2;−1]], **b** = [[−9;p;q]]     b  **a** = [[1;−1;4]], **b** = [[−2;p;q]]",
  guide:[{q:"What is t here, and what does its sign mean?", a:"a t = −3, b t = −2: **b** points in the opposite direction to **a**."}],
  steps:[{label:'a', text:"−9 = 3t ⇒ t = −3;  p = 2(−3) = −6,  q = (−1)(−3) = 3"},{label:'b', text:"−2 = t;  p = (−1)(−2) = 2,  q = 4(−2) = −8"}],
  answer:"a  p = −6, q = 3     b  p = 2, q = −8" },
{ type:'qa', id:'a21', navLabel:'A21', qnum:'Q 21', heading:'Parallel vectors — unknowns in both',
  question:"Find p and q such that **a** and **b** are parallel.\na  **a** = [[2;p;6]], **b** = [[q;2;3]]     b  **a** = [[−3;p;6]], **b** = [[q;15;2]]",
  guide:[{q:"Which component has numbers in BOTH vectors?", a:"The third component — use it to find t."},{q:"Once t is found, which unknown is in **a** and which in **b**?", a:"p is in **a**, q is in **b** — be careful which way the multiplication goes."}],
  steps:[{label:'a', text:"**b** = t**a**: 3 = 6t ⇒ t = ½.  q = 2·½ = 1;  2 = p·½ ⇒ p = 4"},{label:'b', text:"2 = 6t ⇒ t = ⅓.  q = −3·⅓ = −1;  15 = p·⅓ ⇒ p = 45"}],
  answer:"a  p = 4, q = 1     b  p = 45, q = −1" },
{ type:'qa', id:'a22', navLabel:'A22', qnum:'Q 22', heading:'Parallel vectors in i, j, k form',
  question:"Find p and q such that **a** and **b** are parallel.\na  **a** = **i** − 2**j** + 6**k**, **b** = p**i** + 6**j** + q**k**\nb  **a** = −2**i** + **j** − 3**k**, **b** = p**i** + q**j** + 6**k**",
  guide:[{q:"Which component is known in both vectors?", a:"a the **j**-component (−2 and 6);  b the **k**-component (−3 and 6)."}],
  steps:[{label:'a', text:"6 = −2t ⇒ t = −3;  p = 1(−3) = −3,  q = 6(−3) = −18"},{label:'b', text:"6 = −3t ⇒ t = −2;  p = (−2)(−2) = 4,  q = 1(−2) = −2"}],
  answer:"a  p = −3, q = −18     b  p = 4, q = −2" },
{ type:'qa', id:'a23', navLabel:'A23', qnum:'Q 23', heading:'Parallel vectors in i, j, k form',
  question:"Find p and q such that **a** and **b** are parallel.\na  **a** = 2**i** + p**j** + 5**k**, **b** = −4**i** + 4**j** + q**k**\nb  **a** = p**i** + 6**j** + 9**k**, **b** = **i** − 2**j** + q**k**",
  guide:[{q:"Find t from the component known in both vectors.", a:"a −4 = 2t ⇒ t = −2;  b −2 = 6t ⇒ t = −⅓."}],
  steps:[{label:'a', text:"t = −2:  4 = −2p ⇒ p = −2;  q = 5(−2) = −10"},{label:'b', text:"t = −⅓:  1 = −⅓p ⇒ p = −3;  q = 9(−⅓) = −3"}],
  answer:"a  p = −2, q = −10     b  p = −3, q = −3" },

{ type:'qa', id:'a24', navLabel:'A24', qnum:'Q 24', heading:'Unit vectors',
  question:"Find the unit vector in the same direction as\na  **a** = [[1;2;2]]     b  **a** = [[3;0;4]]",
  guide:[{q:"What is the magnitude of each vector?", a:"a √(1+4+4) = 3;  b √(9+0+16) = 5."}],
  steps:[{label:'a', text:"|**a**| = 3, so unit vector = ⅓[[1;2;2]]"},{label:'b', text:"|**a**| = 5, so unit vector = ⅕[[3;0;4]]"}],
  answer:"a  [[1/3;2/3;2/3]]     b  [[3/5;0;4/5]]" },
{ type:'qa', id:'a25', navLabel:'A25', qnum:'Q 25', heading:'Unit vectors with surds',
  question:"Find the unit vector in the same direction as\na  **a** = [[−1;1;2]]     b  **a** = [[1;−2;3]]",
  guide:[{q:"Find |**a**| in each case.", a:"a √(1+1+4) = √6;  b √(1+4+9) = √14."}],
  steps:[{label:'a', text:"(1/√6)[[−1;1;2]]"},{label:'b', text:"(1/√14)[[1;−2;3]]"}],
  answer:"a  (1/√6)[[−1;1;2]]     b  (1/√14)[[1;−2;3]]" },
{ type:'qa', id:'a26', navLabel:'A26', qnum:'Q 26', heading:'Unit vectors in i, j, k form',
  question:"Find the unit vector in the same direction as\na  **a** = 3**i** + **j** − **k**     b  **a** = **i** − 2**j** + **k**",
  guide:[{q:"Magnitudes?", a:"a √(9+1+1) = √11;  b √(1+4+1) = √6."}],
  steps:[{label:'a', text:"(3**i** + **j** − **k**)/√11"},{label:'b', text:"(**i** − 2**j** + **k**)/√6"}],
  answer:"a  (1/√11)(3**i** + **j** − **k**)     b  (1/√6)(**i** − 2**j** + **k**)" },
{ type:'qa', id:'a27', navLabel:'A27', qnum:'Q 27', heading:'Unit vectors in i, j, k form',
  question:"Find the unit vector in the same direction as\na  **a** = **i** − 4**j**     b  **a** = 2**j** − 3**k**",
  guide:[{q:"Missing components count as 0. Magnitudes?", a:"a √(1+16) = √17;  b √(4+9) = √13."}],
  steps:[{label:'a', text:"(**i** − 4**j**)/√17"},{label:'b', text:"(2**j** − 3**k**)/√13"}],
  answer:"a  (1/√17)(**i** − 4**j**)     b  (1/√13)(2**j** − 3**k**)" },

{ type:'qa', id:'a28', navLabel:'A28', qnum:'Q 28', heading:'Vectors in a rectangle',
  question:"ABCD is a rectangle. E is the midpoint of BC, F is the midpoint of DC and G is on AB extended with BG = AB. {AB} = **a**, {AD} = **b**.\nExpress  a  {AE}    b  {EF}    c  {DG}",
  fig: figSVG(340, 215, {A:[30,185,-12,6],B:[170,185,0,22],C:[170,45,12,-4],D:[30,45,-12,0],E:[170,115,14,4],F:[100,45,0,-10],G:[310,185,12,6]},
    [{p:'A',q:'B',label:'a',arrow:'mid',color:'#1a8fd0',ly:20},{p:'A',q:'D',label:'b',arrow:'mid',color:'#c0392b',lx:-14},{p:'D',q:'C'},{p:'B',q:'C'},{p:'B',q:'G'}]),
  guide:[{q:"What is {BE} in terms of **b**?", a:"½**b** (E is halfway up BC, which equals **b**)."},{q:"Route from E to F?", a:"E → C → F: up ½**b**, then left ½**a**."},{q:"What is {AG}?", a:"2**a**."}],
  steps:[{label:'a', text:"{AE} = {AB} + {BE} = **a** + ½**b**"},{label:'b', text:"{EF} = {EC} + {CF} = ½**b** − ½**a**"},{label:'c', text:"{DG} = {DA} + {AG} = −**b** + 2**a**"}],

{ type:'qa', id:'a29', navLabel:'A29', qnum:'Q 29', heading:'Vectors in a triangle',
  question:"In triangle OAB, {OA} = **a** and {OB} = **b**. M is the midpoint of OA and N is the point on AB such that BN = ⅓BA.\nExpress  a  {BA}    b  {ON}    c  {MN}",
  fig: figSVG(290, 290, {O:[30,265,-12,6],A:[260,265,12,6],B:[100,25,-6,-8],M:[145,265,0,22],N:[153.3,105,14,0]},
    [{p:'O',q:'A',label:'a',arrow:'mid',color:'#1a8fd0',ly:20},{p:'O',q:'B',label:'b',arrow:'mid',color:'#c0392b',lx:-14},{p:'B',q:'A'},{p:'M',q:'N',dash:true}]),
  guide:[{q:"Route from B to A?", a:"B → O → A: −**b** + **a**."},{q:"To reach N from O, go to B first, then what fraction of {BA}?", a:"⅓ of {BA}."},{q:"How can you get {MN} from {OM} and {ON}?", a:"{MN} = {ON} − {OM}."}],
  steps:[{label:'a', text:"{BA} = {BO} + {OA} = **a** − **b**"},{label:'b', text:"{ON} = {OB} + ⅓{BA} = **b** + ⅓(**a** − **b**) = ⅓**a** + ⅔**b**"},{label:'c', text:"{MN} = {ON} − {OM} = ⅓**a** + ⅔**b** − ½**a** = −⅙**a** + ⅔**b**"}],
  answer:"a  **a** − **b**    b  ⅓**a** + ⅔**b**    c  −⅙**a** + ⅔**b**" },
{ type:'qa', id:'a30', navLabel:'A30', qnum:'Q 30', heading:'Combination and magnitude',
  question:"Given **a** = [[2;−1;3]], **b** = [[0;1;−5]], **c** = [[−2;2;3]], find\na  3**a** − **c** + 5**b**     b  |**b** − 2**a**|",
  guide:[{q:"Work out 3**a** and 5**b** first.", a:"3**a** = [[6;−3;9]], 5**b** = [[0;5;−25]]."},{q:"For part b, find the vector first, then its magnitude.", a:"**b** − 2**a** = [[−4;3;−11]]."}],
  steps:[{label:'a', text:"[[6;−3;9]] − [[−2;2;3]] + [[0;5;−25]] = [[8;0;−19]]"},{label:'b', text:"**b** − 2**a** = [[0−4;1+2;−5−6]] = [[−4;3;−11]];  |…| = √(16 + 9 + 121) = √146"}],

{ type:'qa', id:'a31', navLabel:'A31', qnum:'Q 31', heading:'Unknown from a magnitude',
  question:"Find the possible values of the constant k such that the vector [[3k;−k;k]] has magnitude 22.",
  guide:[{q:"Write the magnitude as an expression in k.", a:"√(9k² + k² + k²) = √(11k²) = √11·|k|."},{q:"Why are there two answers?", a:"k is squared, so k and −k give the same magnitude."}],
  steps:[{label:'Magnitude', text:"√11·|k| = 22"},{label:'Solve', text:"|k| = 22/√11 = 2√11"}],

{ type:'qa', id:'a32', navLabel:'A32', qnum:'Q 32', heading:'Unknown from a magnitude',
  question:"The vector 2**i** + 3t**j** + (t − 1)**k** has magnitude 3. Find the possible values of t.",
  guide:[{q:"Square both sides of |**v**| = 3. What equation do you get?", a:"4 + 9t² + (t − 1)² = 9."},{q:"What type of equation is this?", a:"A quadratic in t — use the quadratic formula."}],
  steps:[{label:'Set up', text:"2² + (3t)² + (t − 1)² = 9 ⇒ 4 + 9t² + t² − 2t + 1 = 9"},{label:'Simplify', text:"10t² − 2t − 4 = 0 ⇒ 5t² − t − 2 = 0"},{label:'Solve', text:"t = (1 ± √(1 + 40))/10 = (1 ± √41)/10"}],
  answer:"t = (1 ± √41)/10  (≈ 0.740 or −0.540)" },
{ type:'qa', id:'a33', navLabel:'A33', qnum:'Q 33', heading:'Solving a vector equation',

  steps:[{label:'Rearrange', text:"4**x** = **b** − 3**a** = [[5+3;3−3;3−6]] = [[8;0;−3]]"},{label:'Divide', text:"**x** = ¼[[8;0;−3]]"}],
  answer:"**x** = [[2;0;−3/4]]" },
{ type:'qa', id:'a34', navLabel:'A34', qnum:'Q 34', heading:'Solving for a scalar',
  question:"Given **a** = 3**i** − 2**j** + 5**k**, **b** = **i** − **j** + 2**k** and **c** = **i** + **k**, find the scalar t such that **a** + t**b** = **c**.",
  guide:[{q:"Write **a** + t**b** in components.", a:"(3 + t)**i** + (−2 − t)**j** + (5 + 2t)**k**."},{q:"Three equations, one unknown — what must you check?", a:"That the same t satisfies all three."}],
  steps:[{label:'i', text:"3 + t = 1 ⇒ t = −2"},{label:'j', text:"−2 − t = 0 ⇒ t = −2 ✓"},{label:'k', text:"5 + 2t = 1 ⇒ t = −2 ✓"}],

{ type:'qa', id:'a35', navLabel:'A35', qnum:'Q 35', heading:'Unit vectors and scaling to a given length',

  guide:[{q:"Magnitude of 6**i** + 6**j** − 3**k**?", a:"√(36+36+9) = 9."},{q:"How do you make a vector of length 10 in a given direction?", a:"10 × (unit vector)."}],
  steps:[{label:'a', text:"(6**i** + 6**j** − 3**k**)/9 = ⅔**i** + ⅔**j** − ⅓**k**"},{label:'b', text:"|[[4;−1;2√2]]| = √(16 + 1 + 8) = 5, so the vector is (10/5)[[4;−1;2√2]]"}],
  answer:"a  ⅔**i** + ⅔**j** − ⅓**k** (or its negative)    b  [[8;−2;4√2]]" },
{ type:'qa', id:'a36', navLabel:'A36', qnum:'Q 36', heading:'Combination parallel to a given vector',

  steps:[{label:'Set up', text:"[[2+3p;p;2+3p]] = t[[3;2;3]]"},{label:'Solve', text:"p = 2t and 2 + 3p = 3t ⇒ 2 + 6t = 3t ⇒ t = −⅔, p = −4/3"},{label:'Check', text:"**a** + p**b** = [[−2;−4/3;−2]] = −⅔[[3;2;3]] ✓"}],

{ type:'qa', id:'a37', navLabel:'A37', qnum:'Q 37', heading:'Combination parallel to j',

  guide:[{q:"A vector parallel to **j** has the form [[0;s;0]]. Which components must vanish?", a:"The **i**- and **k**-components."},{q:"Write λ**x** + **y** in components.", a:"(2λ + 4)**i** + (3λ + 1)**j** + (λ + 2)**k**."}],
  steps:[{label:'i-comp', text:"2λ + 4 = 0 ⇒ λ = −2"},{label:'k-comp', text:"λ + 2 = 0 ⇒ λ = −2 ✓ (consistent)"},{label:'Check', text:"λ**x** + **y** = −5**j**, which is parallel to **j**"}],

{ type:'qa', id:'a38', navLabel:'A38', qnum:'Q 38', heading:'Vector of given magnitude',
  question:"Find a vector of magnitude 6 parallel to [[4;−1;1]].",

  steps:[{label:'Magnitude', text:"√(16 + 1 + 1) = 3√2"},{label:'Scale', text:"(6/(3√2))[[4;−1;1]] = √2[[4;−1;1]]"}],

{ type:'qa', id:'a39', navLabel:'A39', qnum:'Q 39', heading:'Magnitude equation in λ',
  question:"Let **a** = [[−2;0;−1]] and **b** = [[2;−1;2]]. Find the possible values of λ such that |**a** + λ**b**| = 5√2.",
  guide:[{q:"Write **a** + λ**b** in components.", a:"[[−2+2λ;−λ;−1+2λ]]."},{q:"Square both sides: what is (5√2)²?", a:"50."}],
  steps:[{label:'Set up', text:"(2λ − 2)² + λ² + (2λ − 1)² = 50"},{label:'Expand', text:"4λ² − 8λ + 4 + λ² + 4λ² − 4λ + 1 = 50 ⇒ 9λ² − 12λ − 45 = 0"},{label:'Solve', text:"3λ² − 4λ − 15 = 0 ⇒ (3λ + 5)(λ − 3) = 0"}],

  question:"Find the smallest possible magnitude of the vector (2t)**i** + (t + 3)**j** − (2t + 1)**k**, where t is a real constant.",

  steps:[{label:'Square', text:"|**v**|² = 4t² + (t + 3)² + (2t + 1)² = 9t² + 10t + 10"},{label:'Minimise', text:"Vertex at t = −10/18 = −5/9"},{label:'Value', text:"9(25/81) − 50/9 + 10 = 25/9 − 50/9 + 90/9 = 65/9"}],
  answer:"Smallest magnitude = √65 / 3 ≈ 2.69" },
{ type:'qa', id:'a41', navLabel:'A41', qnum:'Q 41', heading:'Trigonometric components',
  question:"a  Show that [[3 sin θ;−3 cos θ;4]] has the same magnitude for all θ.\nb  Find the largest possible magnitude of [[1 + 3 sin θ;1 − 3 cos θ;4]].",
  guide:[{q:"Which identity will make θ disappear in part a?", a:"sin²θ + cos²θ = 1."},{q:"In part b, after expanding, what θ-expression remains? What is its maximum?", a:"6(sin θ − cos θ); sin θ − cos θ = √2 sin(θ − π/4) has maximum √2."}],
  steps:[{label:'a', text:"|**v**|² = 9sin²θ + 9cos²θ + 16 = 9 + 16 = 25, so |**v**| = 5 for all θ"},{label:'b expand', text:"(1 + 3sin θ)² + (1 − 3cos θ)² + 16 = 18 + 9 + 6sin θ − 6cos θ = 27 + 6(sin θ − cos θ)"},{label:'b max', text:"sin θ − cos θ = √2 sin(θ − π/4) ≤ √2 (at θ = 3π/4)"}],
  answer:"a  |**v**| = 5     b  max = √(27 + 6√2) ≈ 5.96" }

{ type:'qa', id:'b6', navLabel:'B6', qnum:'Q 6', heading:'Exact distances',
  question:"Find the exact distance AB.\na  **a** = [[3;7;−2]], **b** = [[1;−2;−5]]     b  **a** = [[2;0;−2]], **b** = [[0;0;5]]",
  guide:[{q:"Displacements?", a:"a [[−2;−9;−3]];  b [[−2;0;7]]."}],
  steps:[{label:'a', text:"√(4 + 81 + 9) = √94"},{label:'b', text:"√(4 + 0 + 49) = √53"}],
  answer:"a  √94     b  √53" },
{ type:'qa', id:'b7', navLabel:'B7', qnum:'Q 7', heading:'Parallelogram? Rhombus?',
  question:"Determine whether ABCD is a parallelogram; if so, whether it is a rhombus.\na  A(2, 0, 1), B(4, 4, 2), C(1, 2, 5), D(−1, −2, 4)\nb  A(3, 1, 4), B(4, 2, 8), C(2, 2, 5), D(1, 1, 1)",
  guide:[{q:"Which vectors do you compare first?", a:"{AB} and {DC}."},{q:"If they are equal, what do you compare next?", a:"|{AB}| and |{BC}|."}],
  steps:[{label:'a', text:"{AB} = [[2;4;1]], {DC} = [[2;4;1]] ⇒ parallelogram.  |{AB}|² = 21, {BC} = [[−3;−2;3]], |{BC}|² = 22 ⇒ not a rhombus"},
         {label:'b', text:"{AB} = [[1;1;4]] = {DC} ⇒ parallelogram.  |{AB}|² = 18, {BC} = [[−2;0;−3]], |{BC}|² = 13 ⇒ not a rhombus"}],
  answer:"a  parallelogram, not a rhombus     b  parallelogram, not a rhombus" },
{ type:'qa', id:'b8', navLabel:'B8', qnum:'Q 8', heading:'Parallelogram? Rhombus?',
  question:"Determine whether ABCD is a parallelogram; if so, whether it is a rhombus.\na  A(1, 1, 2), B(−1, 3, 5), C(5, 1, 2), D(2, 2, 3)\nb  A(−1, 4, 5), B(3, −3, 7), C(1, 2, 5), D(−1, 2, 2)",
  guide:[{q:"Is {AB} equal to {DC}?", a:"Compute both and compare component by component."}],
  steps:[{label:'a', text:"{AB} = [[−2;2;3]], {DC} = [[3;−1;−1]] ⇒ {AB} ≠ {DC}"},{label:'b', text:"{AB} = [[4;−7;2]], {DC} = [[2;0;3]] ⇒ {AB} ≠ {DC}"}],
  answer:"a  not a parallelogram     b  not a parallelogram" },
{ type:'qa', id:'b9', navLabel:'B9', qnum:'Q 9', heading:'Parallelogram? Rhombus?',
  question:"Determine whether ABCD is a parallelogram; if so, whether it is a rhombus.\na  A(1, 0, 2), B(4, −4, 7), C(−1, 1, 7), D(−4, 5, 2)\nb  A(3, 1, 6), B(2, 2, 5), C(1, 3, 6), D(2, 2, 7)",
  guide:[{q:"Compute {AB}, {DC}, {BC}.", a:"a [[3;−4;5]], [[3;−4;5]], [[−5;5;0]];  b [[−1;1;−1]], [[−1;1;−1]], [[−1;1;1]]."}],
  steps:[{label:'a', text:"{AB} = {DC} ⇒ parallelogram. |{AB}|² = 9 + 16 + 25 = 50, |{BC}|² = 25 + 25 = 50 ⇒ rhombus"},{label:'b', text:"{AB} = {DC} ⇒ parallelogram. |{AB}|² = 3, |{BC}|² = 3 ⇒ rhombus"}],
  answer:"a  rhombus     b  rhombus" },
{ type:'qa', id:'b10', navLabel:'B10', qnum:'Q 10', heading:'Collinear points',
  question:"Find p and q so that A, B, C are collinear.\na  A(2, 5, 2), B(1, 1, 6), C(−3, p, q)     b  A(−1, 1, 5), B(2, 1, 3), C(11, p, q)",
  guide:[{q:"Find {AB} and {BC}. Which component of {BC} is fully known?", a:"The x-component."},{q:"Set {AB} = k{BC}. What is k?", a:"a −1 = −4k ⇒ k = ¼;  b 3 = 9k ⇒ k = ⅓."}],
  steps:[{label:'a', text:"{AB} = [[−1;−4;4]], {BC} = [[−4;p−1;q−6]], k = ¼: −4 = ¼(p − 1) ⇒ p = −15; 4 = ¼(q − 6) ⇒ q = 22"},
         {label:'b', text:"{AB} = [[3;0;−2]], {BC} = [[9;p−1;q−3]], k = ⅓: 0 = ⅓(p − 1) ⇒ p = 1; −2 = ⅓(q − 3) ⇒ q = −3"}],
  answer:"a  p = −15, q = 22     b  p = 1, q = −3" },
{ type:'qa', id:'b11', navLabel:'B11', qnum:'Q 11', heading:'Collinear points',
  question:"Find p and q so that A, B, C are collinear.\na  **a** = [[2;−1;3]], **b** = [[5;2;6]], **c** = [[p;7;q]]     b  **a** = [[1;1;−5]], **b** = [[5;−3;3]], **c** = [[2;p;q]]",
  guide:[{q:"In part a, which component of **c** is known?", a:"The y-component (7) — use it to find k."}],
  steps:[{label:'a', text:"{AB} = [[3;3;3]], {BC} = [[p−5;5;q−6]]. 3 = 5k ⇒ k = ⅗. 3 = ⅗(p − 5) ⇒ p = 10; 3 = ⅗(q − 6) ⇒ q = 11"},
         {label:'b', text:"{AB} = [[4;−4;8]], {BC} = [[−3;p+3;q−3]]. 4 = −3k ⇒ k = −4/3. −4 = −4/3(p + 3) ⇒ p = 0; 8 = −4/3(q − 3) ⇒ q = −3"}],
  answer:"a  p = 10, q = 11     b  p = 0, q = −3" },
{ type:'qa', id:'b12', navLabel:'B12', qnum:'Q 12', heading:'Collinear points with unknowns in different vectors',
  question:"Find p and q so that A, B, C are collinear.\na  **a** = p**i** − 2**j** + **k**, **b** = −**i** + 3**j** + q**k**, **c** = 7**i** − 7**j** + 3**k**\nb  **a** = **i** + p**j** − 3**k**, **b** = 2**i** + 3**j** + q**k**, **c** = −**i** − 7**j** + 3**k**",
  guide:[{q:"Which component is known in both {AB} and {BC}?", a:"a the **j**-component (5 and −10);  b the **i**-component (1 and −3)."}],
  steps:[{label:'a', text:"{AB} = [[−1−p;5;q−1]], {BC} = [[8;−10;3−q]]. 5 = −10k ⇒ k = −½. −1 − p = −4 ⇒ p = 3. q − 1 = −½(3 − q) ⇒ q = −1"},
         {label:'b', text:"{AB} = [[1;3−p;q+3]], {BC} = [[−3;−10;3−q]]. 1 = −3k ⇒ k = −⅓. 3 − p = 10/3 ⇒ p = −⅓. q + 3 = −⅓(3 − q) ⇒ q = −6"}],
  answer:"a  p = 3, q = −1     b  p = −⅓, q = −6" },
{ type:'qa', id:'b13', navLabel:'B13', qnum:'Q 13', heading:'Midpoints',
  question:"Find the position vector of the midpoint of AB.\na  **a** = [[1;4;−2]], **b** = [[5;−2;0]]     b  **a** = [[2;2;1]], **b** = [[−4;6;3]]",
  guide:[{q:"Formula?", a:"½(**a** + **b**)."}],
  steps:[{label:'a', text:"½[[6;2;−2]] = [[3;1;−1]]"},{label:'b', text:"½[[−2;8;4]] = [[−1;4;2]]"}],
  answer:"a  [[3;1;−1]]     b  [[−1;4;2]]" },
{ type:'qa', id:'b14', navLabel:'B14', qnum:'Q 14', heading:'Midpoints',
  question:"Find the position vector of the midpoint of AB.\na  **a** = 3**i** − 4**j** + **k**, **b** = **i** − 3**k**     b  **a** = **i** + 2**j**, **b** = −5**j** + 4**k**",
  guide:[{q:"Add, then halve.", a:"a 4**i** − 4**j** − 2**k**;  b **i** − 3**j** + 4**k**."}],
  steps:[{label:'a', text:"½(4**i** − 4**j** − 2**k**) = 2**i** − 2**j** − **k**"},{label:'b', text:"½(**i** − 3**j** + 4**k**) = ½**i** − (3/2)**j** + 2**k**"}],
  answer:"a  2**i** − 2**j** − **k**     b  ½**i** − (3/2)**j** + 2**k**" },
{ type:'qa', id:'b15', navLabel:'B15', qnum:'Q 15', heading:'Midpoints from coordinates',
  question:"Find the position vector of the midpoint of AB.\na  A(−1, 0, 5), B(1, 1, 2)     b  A(1, 1, 2), B(−3, 0, 5)",
  guide:[{q:"Average each coordinate.", a:"((x₁+x₂)/2, (y₁+y₂)/2, (z₁+z₂)/2)."}],
  steps:[{label:'a', text:"½[[0;1;7]] = [[0;1/2;7/2]]"},{label:'b', text:"½[[−2;1;7]] = [[−1;1/2;7/2]]"}],
  answer:"a  [[0;1/2;7/2]]     b  [[−1;1/2;7/2]]" },
{ type:'qa', id:'b16', navLabel:'B16', qnum:'Q 16', heading:'Distance to a midpoint',
  question:"A and B have position vectors **a** = [[4;1;2]] and **b** = [[2;−1;3]]. C is the midpoint of AB. Find the exact distance AC.",
  guide:[{q:"Shortcut: how is AC related to AB?", a:"AC = ½AB."}],
  steps:[{label:'Midpoint', text:"**c** = ½[[6;0;5]] = [[3;0;5/2]]"},{label:'Displacement', text:"{AC} = [[−1;−1;1/2]]"},{label:'Distance', text:"√(1 + 1 + ¼) = √(9/4) = 3/2  (check: AB = √(4 + 4 + 1) = 3, half of it ✓)"}],
  answer:"AC = 3/2" },
{ type:'qa', id:'b17', navLabel:'B17', qnum:'Q 17', heading:'Collinearity and ratio',
  question:"a  Show that A(2, 1, 2), B(5, −4, 3) and C(−4, 11, 0) are collinear.\nb  Find the ratio AB : BC.",
  guide:[{q:"Compute {AB} and {BC}. Is one a multiple of the other?", a:"{AB} = [[3;−5;1]], {BC} = [[−9;15;−3]] = −3{AB}."},{q:"What does the scalar −3 tell you about lengths?", a:"BC is 3 times as long as AB."}],
  steps:[{label:'a', text:"{BC} = −3{AB}: parallel, and they share B ⇒ A, B, C collinear"},{label:'b', text:"|{BC}| = 3|{AB}|"}],
  answer:"b  AB : BC = 1 : 3" },
{ type:'qa', id:'b18', navLabel:'B18', qnum:'Q 18', heading:'Distance and midpoint',
  question:"**a** = **i** − 4**k**, **b** = 2**i** − 2**j** + **k**.\na  Find the distance AB.    b  Find the position vector of the midpoint of AB.",
  guide:[{q:"Write **a** with all three components.", a:"**a** = [[1;0;−4]]."}],
  steps:[{label:'a', text:"**b** − **a** = [[1;−2;5]], AB = √(1 + 4 + 25) = √30"},{label:'b', text:"½(**a** + **b**) = ½[[3;−2;−3]]"}],
  answer:"a  √30     b  [[3/2;−1;−3/2]]" },
{ type:'qa', id:'b19', navLabel:'B19', qnum:'Q 19', heading:'Median of a triangle',
  question:"A triangle has vertices **a** = [[4;−11;5]], **b** = [[−1;3;3]], **c** = [[3;1;−7]]. D is the midpoint of BC.\na  Find the position vector of D.    b  Find the length AD.",
  guide:[{q:"**d** = ?", a:"½(**b** + **c**)."},{q:"AD = |? − ?|", a:"|**d** − **a**|."}],
  steps:[{label:'a', text:"**d** = ½[[2;4;−4]] = [[1;2;−2]]"},{label:'b', text:"**d** − **a** = [[−3;13;−7]], AD = √(9 + 169 + 49) = √227"}],
  answer:"a  [[1;2;−2]]     b  √227 ≈ 15.1" },
{ type:'qa', id:'b20', navLabel:'B20', qnum:'Q 20', heading:'Using a displacement to find a point',
  question:"Point A has position vector **a** = 2**i** − 3**j** and {AD} = **i** − **j**. Find the position vector of D.",
  guide:[{q:"Rearrange {AD} = **d** − **a**.", a:"**d** = **a** + {AD}."}],
  steps:[{label:'Rearrange', text:"**d** = **a** + {AD} = (2**i** − 3**j**) + (**i** − **j**)"}],
  answer:"**d** = 3**i** − 4**j**" },
{ type:'qa', id:'b21', navLabel:'B21', qnum:'Q 21', heading:'Equal displacements',
  question:"**a** = [[4;−11;5]], **b** = [[3;1;2]]. Find the position vector of C such that {AB} = {BC}.",
  guide:[{q:"Write {AB} = {BC} with position vectors.", a:"**b** − **a** = **c** − **b**."},{q:"Geometric meaning?", a:"B is the midpoint of AC."}],
  steps:[{label:'Rearrange', text:"**c** = 2**b** − **a** = [[6;2;4]] − [[4;−11;5]]"}],
  answer:"**c** = [[2;13;−1]]" },
{ type:'qa', id:'b22', navLabel:'B22', qnum:'Q 22', heading:'Completing a parallelogram',
  question:"**a** = [[3;−1;2]], **b** = [[1;1;3]], **c** = [[−1;4;3]].\na  Find the position vector of D such that ABCD is a parallelogram.\nb  Determine whether ABCD is a rhombus.",
  guide:[{q:"For ABCD a parallelogram, which vectors are equal?", a:"{AD} = {BC}, so **d** − **a** = **c** − **b**."},{q:"For part b, compare which lengths?", a:"|{AB}| and |{BC}|."}],
  steps:[{label:'a', text:"**d** = **a** + **c** − **b** = [[3−1−1;−1+4−1;2+3−3]] = [[1;2;2]]"},{label:'b', text:"{AB} = [[−2;2;1]], |{AB}| = 3;  {BC} = [[−2;3;0]], |{BC}| = √13 ≠ 3"}],
  answer:"a  **d** = [[1;2;2]]     b  not a rhombus" },
{ type:'qa', id:'b23', navLabel:'B23', qnum:'Q 23', heading:'Diagonals of a parallelogram bisect each other',
  question:"Three vertices of parallelogram ABCD are A(5, −1, 2), B(−1, 2, 8), C(7, 7, 0).\na  Find D.    b  Find the midpoint of AC.    c  Show that this is also the midpoint of BD.",
  guide:[{q:"**d** in terms of **a**, **b**, **c**?", a:"**d** = **a** + **c** − **b**."}],
  steps:[{label:'a', text:"**d** = [[5+7+1;−1+7−2;2+0−8]] = [[13;4;−6]] ⇒ D(13, 4, −6)"},{label:'b', text:"½(**a** + **c**) = ½[[12;6;2]] ⇒ (6, 3, 1)"},{label:'c', text:"½(**b** + **d**) = ½[[12;6;2]] ⇒ (6, 3, 1) — the same point, so the diagonals bisect each other"}],
  answer:"a  D(13, 4, −6)     b, c  (6, 3, 1)" },
{ type:'qa', id:'b24', navLabel:'B24', qnum:'Q 24', heading:'Midpoint theorem',
  question:"Triangle ABC has vertices **a**, **b**, **c**. M is the midpoint of AB and N is the midpoint of AC.\na  Express {BC} and {MN} in terms of **b** and **c**.    b  What does this tell you about BC and MN?",
  guide:[{q:"**m** = ?, **n** = ?", a:"**m** = ½(**a** + **b**), **n** = ½(**a** + **c**)."},{q:"What happens to **a** when you compute **n** − **m**?", a:"It cancels."}],
  steps:[{label:'a', text:"{BC} = **c** − **b**;  {MN} = **n** − **m** = ½(**a** + **c**) − ½(**a** + **b**) = ½(**c** − **b**)"},{label:'b', text:"{MN} = ½{BC}"}],
  answer:"MN is parallel to BC and half its length" },
{ type:'qa', id:'b25', navLabel:'B25', qnum:'Q 25', heading:'Varignon’s theorem',
  question:"A quadrilateral has vertices **a**, **b**, **c**, **d**. M, N, P, Q are the midpoints of AB, BC, CD, DA. By expressing **m**, **n**, **p**, **q** in terms of **a**, **b**, **c**, **d**, prove that MNPQ is a parallelogram.",
  guide:[{q:"Write the four midpoints.", a:"**m** = ½(**a**+**b**), **n** = ½(**b**+**c**), **p** = ½(**c**+**d**), **q** = ½(**d**+**a**)."},{q:"Which two vectors should you show are equal?", a:"{MN} and {QP}."}],
  steps:[{label:'MN', text:"{MN} = **n** − **m** = ½(**c** − **a**)"},{label:'QP', text:"{QP} = **p** − **q** = ½(**c** − **a**)"},{label:'Conclude', text:"{MN} = {QP}, so MNPQ is a parallelogram (for ANY quadrilateral)"}],
  answer:"{MN} = {QP} = ½(**c** − **a**) ⇒ MNPQ is a parallelogram" },
{ type:'qa', id:'b26', navLabel:'B26', qnum:'Q 26', heading:'Collinear points with coordinates',
  question:"A(−3, 2, 5), B(q, p, 2) and C(12, 7, 0) lie in a straight line.\na  Find p and q.    b  Find the ratio AB : BC.",
  guide:[{q:"Which component of {AB} and {BC} contains no unknown?", a:"The z-component: −3 and −2."}],
  steps:[{label:'Vectors', text:"{AB} = [[q+3;p−2;−3]], {BC} = [[12−q;7−p;−2]]"},{label:'k', text:"−3 = −2k ⇒ k = 3/2"},{label:'Solve', text:"q + 3 = (3/2)(12 − q) ⇒ 5q = 30 ⇒ q = 6;  p − 2 = (3/2)(7 − p) ⇒ 5p = 25 ⇒ p = 5"},{label:'b', text:"{AB} = (3/2){BC} ⇒ AB : BC = 3 : 2"}],
  answer:"a  p = 5, q = 6     b  3 : 2" },
{ type:'qa', id:'b27', navLabel:'B27', qnum:'Q 27', heading:'Dividing a segment in a ratio',
  question:"**a** = 3**i** + **j** − 4**k**, **b** = **i** − 4**j**. C lies between A and B so that AC : CB = 2 : 3. Find the position vector of C.",
  guide:[{q:"What fraction of AB is AC?", a:"2/(2+3) = 2/5."}],
  steps:[{label:'Route', text:"**c** = **a** + ⅖(**b** − **a**) = ⅗**a** + ⅖**b**"},{label:'Compute', text:"⅗(3, 1, −4) + ⅖(1, −4, 0) = (9/5 + 2/5, 3/5 − 8/5, −12/5)"}],
  answer:"**c** = (11/5)**i** − **j** − (12/5)**k**" },
{ type:'qa', id:'b28', navLabel:'B28', qnum:'Q 28', heading:'Distance with a parameter',
  question:"{OA} = [[−1;−6;13]] and {OB} = [[1;−2;4]] + t[[2;1;−5]]. Find the possible values of t such that AB = 3.",
  guide:[{q:"Write {AB} in terms of t.", a:"{AB} = [[2+2t;4+t;−9−5t]]."},{q:"Square both sides of AB = 3.", a:"|{AB}|² = 9."}],
  steps:[{label:'Set up', text:"(2 + 2t)² + (4 + t)² + (9 + 5t)² = 9"},{label:'Expand', text:"30t² + 106t + 101 = 9 ⇒ 30t² + 106t + 92 = 0 ⇒ 15t² + 53t + 46 = 0"},{label:'Factorise', text:"(t + 2)(15t + 23) = 0"}],
  answer:"t = −2 or t = −23/15" },
{ type:'qa', id:'b29', navLabel:'B29', qnum:'Q 29', heading:'Reflecting through a point',
  question:"**p** = 2**i** − **j** − 3**k**, **q** = **i** + 4**j** − **k**.\na  Find the position vector of the midpoint M of PQ.\nb  R is distinct from M, collinear with P and Q, and QR = QM. Find the coordinates of R.",
  guide:[{q:"Where must R be on the line?", a:"On the other side of Q from M, at the same distance — Q is the midpoint of MR."},{q:"So **r** = ?", a:"**r** = 2**q** − **m**."}],
  steps:[{label:'a', text:"**m** = ½(3**i** + 3**j** − 4**k**) = (3/2)**i** + (3/2)**j** − 2**k**"},{label:'b', text:"**r** = 2**q** − **m** = (2 − 3/2)**i** + (8 − 3/2)**j** + (−2 + 2)**k**"}],
  answer:"a  **m** = (3/2)**i** + (3/2)**j** − 2**k**     b  R(1/2, 13/2, 0)" },
{ type:'qa', id:'b30', navLabel:'B30', qnum:'Q 30', heading:'Proving collinearity in a triangle',
  question:"Triangle ABC has vertices **a**, **b**, **c**. D lies on BC with BD = ⅓BC; M is the midpoint of AD.\na  Express **m** in terms of **a**, **b**, **c**.\nX lies on AC with AX = ¼AC.\nb  Show that B, M and X lie in a straight line and find the ratio BM : MX.",
  fig: figSVG(350, 220, {A:[80,20,-6,-8],B:[20,200,-12,6],C:[330,200,12,6],D:[123.3,200,0,20],M:[101.7,110,-16,0],X:[142.5,65,10,-8]}, [{p:'A',q:'B'},{p:'B',q:'C'},{p:'C',q:'A'},{p:'A',q:'D'},{p:'B',q:'X',dash:true,color:'#1a8fd0'}]),
  guide:[{q:"Find **d** first.", a:"**d** = **b** + ⅓(**c** − **b**) = ⅔**b** + ⅓**c**."},{q:"Find **x**.", a:"**x** = **a** + ¼(**c** − **a**) = ¾**a** + ¼**c**."},{q:"Compare {BM} and {BX}.", a:"Look for {BX} = k{BM}."}],
  steps:[{label:'a', text:"**m** = ½(**a** + **d**) = ½**a** + ⅓**b** + ⅙**c**"},{label:'BM', text:"{BM} = **m** − **b** = ½**a** − ⅔**b** + ⅙**c**"},{label:'BX', text:"{BX} = **x** − **b** = ¾**a** − **b** + ¼**c** = (3/2){BM}"},{label:'Conclude', text:"Parallel with common point B ⇒ collinear. BM = ⅔BX, so MX = ⅓BX"}],
  answer:"a  **m** = ½**a** + ⅓**b** + ⅙**c**     b  BM : MX = 2 : 1" },
{ type:'qa', id:'b31', navLabel:'B31', qnum:'Q 31', heading:'Menelaus-type collinearity',
  question:"D, E, F lie on (the lines of) the sides of triangle ABC as shown, with BD : DC = 2 : 3, CE : EA = 3 : 1 (E beyond A), AF : FB = 1 : 2.\na  Express the position vectors of D, E and F in terms of **a**, **b**, **c**.\nb  Hence prove that D, E and F lie in a straight line.",
  fig: figSVG(350, 320, {B:[20,300,-12,6],C:[330,300,12,6],A:[230,110,10,-6],D:[144,300,0,20],E:[180,15,0,-8],F:[160,173.3,-14,-4]}, [{p:'B',q:'C'},{p:'B',q:'A'},{p:'C',q:'E'},{p:'D',q:'E',dash:true,color:'#1a8fd0'}]),
  guide:[{q:"E lies beyond A on line CA with CE : EA = 3 : 1. What is EA as a fraction of CA?", a:"CE = CA + AE = 3AE, so CA = 2AE, i.e. AE = ½CA."},{q:"To show collinearity, which two vectors do you compare?", a:"{DE} and {DF}."}],
  steps:[{label:'D', text:"**d** = **b** + ⅖(**c** − **b**) = ⅗**b** + ⅖**c**"},{label:'E', text:"**e** = **a** + ½(**a** − **c**) = (3/2)**a** − ½**c**"},{label:'F', text:"**f** = **a** + ⅓(**b** − **a**) = ⅔**a** + ⅓**b**"},
         {label:'DF', text:"{DF} = ⅔**a** − (4/15)**b** − ⅖**c**"},{label:'DE', text:"{DE} = (3/2)**a** − ⅗**b** − (9/10)**c** = (9/4){DF}"}],
  answer:"{DE} = (9/4){DF} with common point D ⇒ D, E, F are collinear" },
{ type:'qa', id:'b32', navLabel:'B32', qnum:'Q 32', heading:'Parallelogram for all k, never a rhombus',
  question:"A(2, −1), B(k, k + 1), C(2k − 3, 3k + 2), D(k − 1, 2k).\na  Show that ABCD is a parallelogram for all k.    b  Show there are no values of k for which ABCD is a rhombus.",
  guide:[{q:"Compute {AB} and {DC} in terms of k.", a:"Both equal [[k−2;k+2]]."},{q:"For a rhombus, what equation in k would you need? What does the discriminant say?", a:"|{AB}|² = |{BC}|² gives a quadratic; a negative discriminant means no real solutions."}],

/* ==== 8C ==== */
function angleFig(deg, la, lb) {
  const r = Math.PI / 180, L = 150, x0 = 30 + (deg > 90 ? 120 : 0), y0 = 150;
  const bx = x0 + L * Math.cos(deg * r), by = y0 - L * Math.sin(deg * r) * 0.85;
  const W = x0 + L + 40;
  return figSVG(W, 175, {O:[x0,y0,-12,6], A:[x0+L,y0,12,6], B:[bx,by,-10,-6]},
    [{p:'O',q:'A',label:la,arrow:'mid',color:'#1a8fd0',ly:20},{p:'O',q:'B',label:lb,arrow:'mid',color:'#c0392b',lx:-24}],
    `<path d="M ${x0+26} ${y0} A 26 26 0 0 0 ${x0+26*Math.cos(deg*r)} ${y0-26*Math.sin(deg*r)*0.85}" fill="none" stroke="#1b2a47"/><text x="${x0+34}" y="${y0-10}" font-family="Georgia" font-size="14" fill="#1b2a47">${deg}°</text>`);
}

{ type:'qa', id:'c19', navLabel:'C19', qnum:'Q 19', heading:'Combinations of dot products',
  question:"**a** = [[2;−2;1]], **b** = [[1;1;2]], **c** = [[3;−5;1]], **d** = [[3;−3;2]]. Calculate\na  **a**•(**b** + **c**)    b  (**b** − **a**)•(**d** − **c**)    c  (**b** + **d**)•(2**a**)",
  guide:[{q:"Should you expand, or compute the vectors in brackets first?", a:"Computing the bracket vectors first is quickest."}],
  steps:[{label:'a', text:"**b** + **c** = [[4;−4;3]]; 8 + 8 + 3 = 19"},{label:'b', text:"**b** − **a** = [[−1;3;1]], **d** − **c** = [[0;2;1]]; 0 + 6 + 1 = 7"},{label:'c', text:"**b** + **d** = [[4;−2;4]], 2**a** = [[4;−4;2]]; 16 + 8 + 8 = 32"}],
  answer:"a  19     b  7     c  32" },
{ type:'qa', id:'c20', navLabel:'C20', qnum:'Q 20', heading:'Angle between a displacement and a position vector',
  question:"{OA} = [[2;2;3]], {OB} = [[−1;7;2]]. Find the angle between {AB} and {OA}.",
  guide:[{q:"Find {AB} first.", a:"{AB} = [[−3;5;−1]]."}],
  steps:[{label:'Dot', text:"{AB}•{OA} = −6 + 10 − 3 = 1"},{label:'Lengths', text:"|{AB}| = √35, |{OA}| = √17"},{label:'Angle', text:"cos θ = 1/√595 = 0.0410"}],
  answer:"θ ≈ 87.7°" },
{ type:'qa', id:'c21', navLabel:'C21', qnum:'Q 21', heading:'Angle between two displacements',
  question:"A(2, −1, 3), B(1, 1, 2), C(6, −1, 2), D(7, −3, 3). Find the angle between {AC} and {BD}.",
  guide:[{q:"Find both displacement vectors.", a:"{AC} = [[4;0;−1]], {BD} = [[6;−4;1]]."}],
  steps:[{label:'Dot', text:"24 + 0 − 1 = 23"},{label:'Lengths', text:"|{AC}| = √17, |{BD}| = √53"},{label:'Angle', text:"cos θ = 23/√901 = 0.766"}],
  answer:"θ ≈ 40.0°" },
{ type:'qa', id:'c22', navLabel:'C22', qnum:'Q 22', heading:'Exact cosine',
  question:"**p** = [[−1;1;2]], **q** = [[1;1;2]]. θ is the angle between **p** and **q**. Find the exact value of cos θ.",
  guide:[{q:"Do the magnitudes look the same?", a:"Yes, both √6 — so |**p**||**q**| = 6."}],
  steps:[{label:'Dot', text:"−1 + 1 + 4 = 4"},{label:'cos', text:"4/(√6 √6) = 4/6"}],
  answer:"cos θ = 2/3" },
{ type:'qa', id:'c23', navLabel:'C23', qnum:'Q 23', heading:'Angle from magnitudes and dot product',
  question:"|**a**| = 3, |**b**| = 5 and **a**•**b** = 10. Find the angle between **a** and **b**.",
  guide:[{q:"Rearrange the definition.", a:"cos θ = **a**•**b**/(|**a**||**b**|)."}],
  steps:[{label:'cos', text:"10/15 = 2/3"}],
  answer:"θ = cos⁻¹(2/3) ≈ 48.2°" },
{ type:'qa', id:'c24', navLabel:'C24', qnum:'Q 24', heading:'Angle from magnitudes and dot product',
  question:"|**c**| = 9, |**d**| = 12 and **c**•**d** = −15. Find the angle between **c** and **d**.",
  guide:[{q:"Acute or obtuse?", a:"Obtuse, since **c**•**d** < 0."}],
  steps:[{label:'cos', text:"−15/108 = −0.1389"}],
  answer:"θ ≈ 98.0°" },
{ type:'qa', id:'c25', navLabel:'C25', qnum:'Q 25', heading:'Verifying algebraic properties',
  question:"**a** = 2**i** + **j** − 2**k**, **b** = **i** + 3**j** − **k**, **c** = 5**i** − 3**k**, **d** = −2**j** + **k**. Verify that\na  **b**•**d** = **d**•**b**    b  **a**•(**b** + **c**) = **a**•**b** + **a**•**c**    c  (**c** − **d**)•**c** = |**c**|² − **c**•**d**    d  (**a** + **b**)•(**a** + **b**) = |**a**|² + |**b**|² + 2**a**•**b**",
  guide:[{q:"Strategy: compute each side separately. Which basic dot products will you need?", a:"**a**•**b** = 7, **a**•**c** = 16, **c**•**d** = −3, |**a**|² = 9, |**b**|² = 11, |**c**|² = 34."}],
  steps:[{label:'a', text:"**b**•**d** = 0 − 6 − 1 = −7 and **d**•**b** = 0 − 6 − 1 = −7 ✓"},{label:'b', text:"**b** + **c** = 6**i** + 3**j** − 4**k**: **a**•(**b**+**c**) = 12 + 3 + 8 = 23;  **a**•**b** + **a**•**c** = 7 + 16 = 23 ✓"},
         {label:'c', text:"**c** − **d** = 5**i** + 2**j** − 4**k**: (**c** − **d**)•**c** = 25 + 0 + 12 = 37;  |**c**|² − **c**•**d** = 34 − (−3) = 37 ✓"},{label:'d', text:"**a** + **b** = 3**i** + 4**j** − 3**k**: LHS = 9 + 16 + 9 = 34;  RHS = 9 + 11 + 14 = 34 ✓"}],
  answer:"All four identities hold for these vectors" },
{ type:'qa', id:'c26', navLabel:'C26', qnum:'Q 26', heading:'Finding a magnitude',
  question:"|**a**| = 8, **a**•**b** = 12 and the angle between **a** and **b** is 60°. Find the exact value of |**b**|.",
  guide:[{q:"Substitute into **a**•**b** = |**a**||**b**|cos θ.", a:"12 = 8|**b**| × ½."}],
  steps:[{label:'Solve', text:"12 = 4|**b**|"}],
  answer:"|**b**| = 3" },
{ type:'qa', id:'c27', navLabel:'C27', qnum:'Q 27', heading:'Angles of a triangle',
  question:"Find, in degrees, the angles of the triangle with vertices P(1, 1, 3), Q(2, −1, 1) and R(5, 1, 2).",
  guide:[{q:"How many angles must you compute with vectors?", a:"Two — the third is 180° minus their sum (a useful check)."}],
  steps:[{label:'At P', text:"{PQ} = [[1;−2;−2]], {PR} = [[4;0;−1]]; cos = 6/(3√17) ⇒ 61.0°"},{label:'At Q', text:"{QP} = [[−1;2;2]], {QR} = [[3;2;1]]; cos = 3/(3√14) ⇒ 74.5°"},{label:'At R', text:"180° − 61.0° − 74.5° = 44.5°"}],
  answer:"61.0°, 74.5°, 44.5°" },
{ type:'qa', id:'c28', navLabel:'C28', qnum:'Q 28', heading:'Angles of a triangle',
  question:"A triangle has vertices **a** = [[2;1;2]], **b** = [[4;−1;5]], **c** = [[7;1;−2]]. Find its angles in degrees.",
  guide:[{q:"Vectors for angle A?", a:"{AB} = [[2;−2;3]], {AC} = [[5;0;−4]]."}],
  steps:[{label:'At A', text:"cos = (10 + 0 − 12)/(√17 √41) = −0.0758 ⇒ 94.3°"},{label:'At B', text:"{BA} = [[−2;2;−3]], {BC} = [[3;2;−7]]; cos = 19/(√17 √62) ⇒ 54.2°"},{label:'At C', text:"180° − 94.3° − 54.2° = 31.5°"}],
  answer:"A ≈ 94.3°, B ≈ 54.2°, C ≈ 31.5°" },
{ type:'qa', id:'c29', navLabel:'C29', qnum:'Q 29', heading:'Right-angled triangle in 3D',
  question:"Vertices **a** = **i** − 2**j** + 2**k**, **b** = 3**i** − **j** + 7**k**, **c** = 5**i**.\na  Show that the triangle is right angled.    b  Calculate the other two angles.    c  Find the area of the triangle.",
  guide:[{q:"Test each vertex: which pair of sides has zero dot product?", a:"{AB}•{AC} = 0 — right angle at A."},{q:"Area of a right-angled triangle?", a:"½ × (product of the two legs)."}],
  steps:[{label:'a', text:"{AB} = [[2;1;5]], {AC} = [[4;2;−2]]; {AB}•{AC} = 8 + 2 − 10 = 0 ⇒ right angle at A"},{label:'b', text:"|{AB}| = √30, |{AC}| = √24 = 2√6. tan B = AC/AB = √(24/30) ⇒ B = 41.8°, C = 48.2°"},{label:'c', text:"Area = ½ × √30 × 2√6 = √180 = 6√5"}],
  answer:"b  41.8° and 48.2°     c  6√5 ≈ 13.4" },
{ type:'qa', id:'c30', navLabel:'C30', qnum:'Q 30', heading:'Finding |q|',
  question:"**p** is a unit vector making a 45° angle with **q**, and **p**•**q** = 3√2. Find |**q**|.",
  guide:[{q:"Substitute |**p**| = 1 and cos 45° = √2/2.", a:"3√2 = 1 × |**q**| × √2/2."}],
  steps:[{label:'Solve', text:"|**q**| = 3√2 × 2/√2"}],
  answer:"|**q**| = 6" },
{ type:'qa', id:'c31', navLabel:'C31', qnum:'Q 31', heading:'Combination perpendicular to a vector',
  question:"**p** = [[4;−1;2]], **q** = [[2;1;1]]. Find t such that **p** + t**q** is perpendicular to [[3;5;1]].",
  guide:[{q:"Write **p** + t**q**.", a:"[[4+2t;−1+t;2+t]]."}],
  steps:[{label:'Dot = 0', text:"3(4 + 2t) + 5(−1 + t) + (2 + t) = 12t + 9 = 0"}],
  answer:"t = −3/4" },
{ type:'qa', id:'c32', navLabel:'C32', qnum:'Q 32', heading:'Quadratic condition for perpendicularity',
  question:"The vectors t**i** − 3**k** and 2t**i** + **j** + t**k** are perpendicular. Find the possible values of t.",
  guide:[{q:"Dot product?", a:"2t² + 0 − 3t."}],
  steps:[{label:'Solve', text:"2t² − 3t = t(2t − 3) = 0"}],
  answer:"t = 0 or t = 3/2" },
{ type:'qa', id:'c33', navLabel:'C33', qnum:'Q 33', heading:'Unit vector perpendicular to b',
  question:"**a** is a unit vector perpendicular to **b**. Find **a**•(2**a** − 3**b**).",
  guide:[{q:"**a**•**a** = ? and **a**•**b** = ?", a:"1 and 0."}],
  steps:[{label:'Expand', text:"2**a**•**a** − 3**a**•**b** = 2(1) − 3(0)"}],
  answer:"2" },
{ type:'qa', id:'c34', navLabel:'C34', qnum:'Q 34', heading:'Right angle at C',
  question:"**a** = **i** − 19**j** + 5**k**, **b** = 2λ**i** + (λ + 2)**j** + 2**k**, **c** = −6**i** − 15**j** + 7**k**.\na  Find λ for which BC is perpendicular to AC.\nb  Find the angles of triangle ABC.    c  Find the area of triangle ABC.",
  guide:[{q:"Write {CA} and {CB}.", a:"{CA} = [[7;−4;−2]], {CB} = [[2λ+6;λ+17;−5]]."},{q:"Once you know the right angle is at C, how can you get the area quickly?", a:"½ × CA × CB."}],
  steps:[{label:'a', text:"{CA}•{CB} = 14λ + 42 − 4λ − 68 + 10 = 10λ − 16 = 0 ⇒ λ = 8/5"},{label:'B', text:"**b** = [[16/5;18/5;2]], {CB} = [[46/5;93/5;−5]], |{CB}| = √455.6 ≈ 21.34, |{CA}| = √69 ≈ 8.307"},
         {label:'b', text:"C = 90°; tan A = CB/CA ⇒ A ≈ 68.7°; B ≈ 21.3°"},{label:'c', text:"Area = ½ × 8.307 × 21.34"}],
  answer:"a  λ = 8/5     b  90°, 68.7°, 21.3°     c  ≈ 88.7" },
{ type:'qa', id:'c35', navLabel:'C35', qnum:'Q 35', heading:'Proof with equal magnitudes',
  question:"**a** and **b** have equal magnitude and (3**a** + **b**) is perpendicular to (**a** − 3**b**). Prove that **a** and **b** are perpendicular.",
  guide:[{q:"Translate “perpendicular” into an equation.", a:"(3**a** + **b**)•(**a** − 3**b**) = 0."},{q:"After expanding, what does |**a**| = |**b**| let you cancel?", a:"3|**a**|² − 3|**b**|² = 0."}],
  steps:[{label:'Expand', text:"3**a**•**a** − 9**a**•**b** + **b**•**a** − 3**b**•**b** = 3|**a**|² − 8**a**•**b** − 3|**b**|²"},{label:'Use |a| = |b|', text:"= −8**a**•**b** = 0"},{label:'Conclude', text:"**a**•**b** = 0, so **a** ⟂ **b** (for non-zero vectors)"}],
  answer:"**a**•**b** = 0 ⇒ **a** and **b** are perpendicular ∎" },
{ type:'qa', id:'c36', navLabel:'C36', qnum:'Q 36', heading:'Diagonals of a rhombus',
  question:"ABCD is a parallelogram, {AB} = **a**, {AD} = **b**.\na  Express {AC} and {BD} in terms of **a**, **b**.    b  Simplify (**a** + **b**)•(**b** − **a**).    c  Hence show that if ABCD is a rhombus then its diagonals are perpendicular.",
  guide:[{q:"What is special about |**a**| and |**b**| in a rhombus?", a:"They are equal."}],
  steps:[{label:'a', text:"{AC} = **a** + **b**, {BD} = **b** − **a**"},{label:'b', text:"**a**•**b** − |**a**|² + |**b**|² − **b**•**a** = |**b**|² − |**a**|²"},{label:'c', text:"Rhombus ⇒ |**a**| = |**b**| ⇒ {AC}•{BD} = 0 ⇒ diagonals perpendicular"}],
  answer:"b  |**b**|² − |**a**|²     c  {AC}•{BD} = 0 ∎" },
{ type:'qa', id:'c37', navLabel:'C37', qnum:'Q 37', heading:'Distance from a point to a line using a right angle',
  question:"A has position vector [[2;1;4]] and B has [[2λ;λ;4λ]].\na  Show that B lies on the line OA for all λ.\nC has position vector [[12;2;4]].\nb  Find λ for which angle CBA is a right angle.    c  For this λ, find the exact distance from C to the line OA.",
  guide:[{q:"How is {OB} related to {OA}?", a:"{OB} = λ{OA} — a multiple, through O."},{q:"If CB ⟂ OA, what does CB represent?", a:"The shortest (perpendicular) distance from C to the line."}],
  steps:[{label:'a', text:"{OB} = λ[[2;1;4]] = λ{OA} ⇒ O, A, B collinear"},{label:'b', text:"{BC}•{BA} = 0: (12 − 2λ)(2 − 2λ) + (2 − λ)(1 − λ) + (4 − 4λ)(4 − 4λ) = 21λ² − 63λ + 42 = 21(λ − 1)(λ − 2) = 0. λ = 1 makes B = A (no angle), so λ = 2"},{label:'c', text:"B = (4, 2, 8); {BC} = [[8;0;−4]], |{BC}| = √80 = 4√5"}],
  answer:"b  λ = 2     c  4√5" }
);

{ type:'examiner', id:'bte82', navLabel:'BtE 8.2', heading:'Be the Examiner 8.2',
  question:"Find the acute angle between **r** = [[5;0;2]] + λ[[−1;2;3]] and **r** = [[4;−1;3]] + μ[[4;−5;1]].",
  solutions:[
    {label:'Solution 1', style:'sol-red', lines:"**d₁**•**d₂** = 20 + 0 + 6 = 26\n|**d₁**| = √29, |**d₂**| = √26\ncos θ = 26/√(29 × 26) = 0.947\nθ = 18.8°"},
    {label:'Solution 2', style:'sol-green', lines:"**d₁**•**d₂** = −4 − 10 + 3 = −11\n|**d₁**| = √14, |**d₂**| = √42\ncos θ = −11/√(14 × 42) = −0.454\nθ = 117°; acute angle = 180 − 117 = 63.0°"},
    {label:'Solution 3', style:'sol-red', lines:"**d₁**•**d₂** = −11, |**d₁**| = √14, |**d₂**| = √42\ncos θ = −0.454, θ = 117°\nacute angle = 117 − 90 = 27.0°"}],
  guide:[{q:"Which vectors in each equation determine the direction of the line?", a:"The vectors multiplied by λ and μ."},{q:"If θ is obtuse, how is the acute angle between the LINES related to θ?", a:"Acute angle = 180° − θ (lines form two pairs of supplementary angles)."}],
  note:"Solution 2 is correct (63.0°). Solution 1 has used the position vectors [[5;0;2]] and [[4;−1;3]] instead of the direction vectors. Solution 3 finds θ correctly but then subtracts 90° instead of taking the supplement 180° − θ." },
{ type:'example', id:'we827', navLabel:'WE 8.27', badge:'Worked Example 8.27', heading:'Worked Example 8.27 — Foot of the Perpendicular',
  question:"Line l: **r** = [[3;−1;0]] + λ[[1;−1;1]] and point A(3, 9, −2). B lies on l and AB is perpendicular to l.\na  Find the coordinates of B.    b  Hence find the shortest distance from A to l.",
  guide:[{q:"Write the position vector of a general point B on l.", a:"**b** = [[3+λ;−1−λ;λ]]."},{q:"What equation expresses “AB ⟂ l”?", a:"{AB}•**d** = 0 where **d** = [[1;−1;1]]."},{q:"Why is AB the SHORTEST distance?", a:"The perpendicular is shorter than any slanted segment (Pythagoras)."}],
  hints:["{AB} = **b** − **a** = [[λ;−10−λ;λ+2]]", "{AB}•[[1;−1;1]] = λ + (10 + λ) + (λ + 2) = 3λ + 12 = 0 ⇒ λ = −4", "B = (−1, 3, −4)", "{AB} = [[−4;−6;−2]], |{AB}| = √56 = 2√14", "Alternative: minimise AB² = 3λ² + 24λ + 104 (least at λ = −4, giving 56)."] },
{ type:'keypoint', id:'kp822', navLabel:'KP 8.22', badge:'Key Point 8.22', heading:'Key Point 8.22 — Kinematics with Vectors',
  formula:"**r** = **r₀** + t**v**,   speed = |**v**|",
  notes:["An object with constant velocity **v** starting at **r₀** moves along a straight line — t plays the role of λ.", "Distance from origin = |**r**|; distance between two objects = |**r₁** − **r₂**| at the same time t."] },
{ type:'example', id:'we828', navLabel:'WE 8.28', badge:'Worked Example 8.28', heading:'Worked Example 8.28 — Constant Velocity Motion',
  question:"An object moves with constant velocity **v** = (2**i** − **j** + 5**k**) m s⁻¹. Its position when t = 0 is **r₀** = (4**i** + 3**j** − 4**k**) m.\na  Find its speed.    b  Write down its position at time t.    c  Find its distance from the origin when t = 5.",
  guide:[{q:"Is speed a vector or a scalar? How do you get it from **v**?", a:"Scalar: speed = |**v**|."}],
  hints:["a  |**v**| = √(4 + 1 + 25) = √30 = 5.48 m s⁻¹", "b  **r** = (4**i** + 3**j** − 4**k**) + t(2**i** − **j** + 5**k**)", "c  t = 5: **r** = 14**i** − 2**j** + 21**k**, |**r**| = √(196 + 4 + 441) = 25.3 m"] },

{ type:'guided', id:'gi8d2', navLabel:'GI 8D-2', heading:'Guided Inquiry — Shortest distance from a point to a line',
  intro:"Line l: **r** = [[3;−1;0]] + λ[[1;−1;1]], point A(3, 9, −2). Let B be a general point on l.",
  prompts:[
    {q:"Write AB² as a function of λ.", a:"{AB} = [[λ;−10−λ;λ+2]] ⇒ AB² = λ² + (10 + λ)² + (λ + 2)² = 3λ² + 24λ + 104."},
    {q:"Find the λ that minimises AB² (complete the square).", a:"3(λ + 4)² + 56 ⇒ minimum at λ = −4, AB² = 56."},
    {q:"At λ = −4, compute {AB}•**d**. What do you notice?", a:"[[−4;−6;−2]]•[[1;−1;1]] = −4 + 6 − 2 = 0 — the shortest segment is perpendicular to the line."},
    {q:"Which method is quicker: minimising, or setting {AB}•**d** = 0?", a:"{AB}•**d** = 0 gives a linear equation immediately."}
  ],
  takeaway:"The shortest distance from a point to a line is along the perpendicular: find B on l with {AB}•**d** = 0, then compute |{AB}|." },

{ type:'qa', id:'d1', navLabel:'D1', qnum:'Q 1', heading:'Line through two points; does C lie on it?',
  question:"a  A(2, 1, 5), B(1, 3, 7), C(0, 5, 9)     b  A(−1, 0, 3), B(3, 1, 8), C(−5, −1, 3)",
  guide:[{q:"Direction vector?", a:"**b** − **a**."},{q:"How do you test C?", a:"Find λ from one component and check the others."}],
  steps:[{label:'a', text:"**r** = [[2;1;5]] + λ[[−1;2;2]]. x: 2 − λ = 0 ⇒ λ = 2; y: 1 + 4 = 5 ✓; z: 5 + 4 = 9 ✓ ⇒ C is on the line"},
         {label:'b', text:"**r** = [[−1;0;3]] + λ[[4;1;5]]. x: −1 + 4λ = −5 ⇒ λ = −1; y: 0 − 1 = −1 ✓; z: 3 − 5 = −2 ≠ 3 ✗ ⇒ C not on the line"}],
  answer:"a  C lies on the line     b  C does not lie on the line" },
{ type:'qa', id:'d2', navLabel:'D2', qnum:'Q 2', heading:'Line through two points; does C lie on it?',

  steps:[{label:'a', text:"**r** = [[4;0;3]] + λ[[4;0;3]]. x: λ = −1; z: 3 − 3 = 0 ≠ 2 ⇒ not on the line"},{label:'b', text:"**r** = [[−1;5;1]] + λ[[0;0;7]]. Every point has y = 5, but C has y = 3 ⇒ not on the line"}],
  answer:"a  no     b  no" },
{ type:'qa', id:'d3', navLabel:'D3', qnum:'Q 3', heading:'Lines in 2D',

{ type:'qa', id:'d10', navLabel:'D10', qnum:'Q 10', heading:'Cartesian form ax + by = c',
  question:"a  **r** = [[2;−5]] + λ[[3;1]]     b  **r** = [[−2;1]] + λ[[4;−3]]",
  guide:[{q:"Eliminate λ.", a:"a λ = (x − 2)/3 = y + 5."}],
  steps:[{label:'a', text:"(x − 2)/3 = y + 5 ⇒ x − 2 = 3y + 15"},{label:'b', text:"(x + 2)/4 = (y − 1)/(−3) ⇒ −3x − 6 = 4y − 4"}],

{ type:'qa', id:'d11', navLabel:'D11', qnum:'Q 11', heading:'Cartesian form ax + by = c',

{ type:'qa', id:'d12', navLabel:'D12', qnum:'Q 12', heading:'Horizontal and vertical lines',
