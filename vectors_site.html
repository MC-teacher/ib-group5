rpendicular”?": "“수직”을 나타내는 식은 무엇인가요?", "What is cos 60°?": "cos 60°는 얼마인가요?", "Do you need exact values here?": "여기서 정확한 값이 필요한가요?", "No — use a calculator (degree mode).": "아니요 — 계산기를 쓰세요 (도(degree) 모드).", "What sign does cos θ have for 90° < θ < 180°?": "90° < θ < 180°일 때 cos θ의 부호는?", "Negative — so **a**•**b** will be negative.": "음수 — 그래서 **a**•**b**도 음수가 돼요.", "In part b, notice anything about **b** compared to **a**?": "b에서 **b**를 **a**와 비교하면 눈에 띄는 점이 있나요?", "Zeros make terms vanish. Which products survive?": "0이 있으면 그 항은 사라져요. 어떤 곱이 남나요?", "a only 2 × (−8);  b only 2 × 5.": "a 2 × (−8)만;  b 2 × 5만.", "Multiply matching coefficients.": "대응하는 계수끼리 곱하세요.", "**i** with **i**, **j** with **j**, **k** with **k**.": "**i**는 **i**와, **j**는 **j**와, **k**는 **k**와.", "What three numbers do you need?": "어떤 세 수가 필요한가요?", "A negative dot product means…?": "내적이 음수라는 것은…?", "An obtuse angle.": "둔각.", "Which vectors?": "어떤 벡터들인가요?", "Which vectors now?": "이번에는 어떤 벡터들인가요?", "{BA} and {BC} — the angle is at B.": "{BA}와 {BC} — 각이 B에 있어요.", "Compute the two building blocks.": "두 가지 기본값을 계산하세요.", "Expand 3**a**•(4**a** − 5**b**).": "3**a**•(4**a** − 5**b**)를 전개하세요.", "Expand (2**a** + **b**)•(3**a** + 2**b**) like (2x + y)(3x + 2y).": "(2**a** + **b**)•(3**a** + 2**b**)를 (2x + y)(3x + 2y)처럼 전개하세요.", "Expand part a.": "a를 전개하세요.", "Condition?": "조건은?", "Dot product = 0, giving a linear equation in t.": "내적 = 0, 이것이 t에 대한 일차방정식이 돼요.", "Write the dot product.": "내적을 쓰세요.", "Be careful with the sign of the **k**-component in part a.": "a에서 **k** 성분의 부호를 주의하세요.", "In part b, what are the missing components?": "b에서 빠진 성분은 무엇인가요?", "First vector has **j**-component 0; second has **k**-component 0.": "첫 번째 벡터는 **j** 성분이 0, 두 번째 벡터는 **k** 성분이 0이에요.", "Should you expand, or compute the vectors in brackets first?": "전개할까요, 아니면 괄호 안의 벡터를 먼저 계산할까요?", "Computing the bracket vectors first is quickest.": "괄호 안의 벡터를 먼저 계산하는 것이 가장 빨라요.", "Find {AB} first.": "먼저 {AB}를 구하세요.", "Find both displacement vectors.": "두 변위벡터를 모두 구하세요.", "Do the magnitudes look the same?": "두 벡터의 크기가 같아 보이나요?", "Yes, both √6 — so |**p**||**q**| = 6.": "네, 둘 다 √6 — 그래서 |**p**||**q**| = 6.", "Rearrange the definition.": "정의를 정리하세요.", "Acute or obtuse?": "예각인가요, 둔각인가요?", "Obtuse, since **c**•**d** < 0.": "**c**•**d** < 0이므로 둔각.", "Strategy: compute each side separately. Which basic dot products will you need?": "전략: 양변을 각각 따로 계산하세요. 어떤 기본 내적값들이 필요한가요?", "Substitute into **a**•**b** = |**a**||**b**|cos θ.": "**a**•**b** = |**a**||**b**|cos θ에 대입하세요.", "How many angles must you compute with vectors?": "벡터로 계산해야 하는 각은 몇 개인가요?", "Two — the third is 180° minus their sum (a useful check).": "두 개 — 세 번째 각은 180°에서 둘의 합을 빼면 돼요 (좋은 검산 방법).", "Vectors for angle A?": "각 A를 위한 벡터는?", "Test each vertex: which pair of sides has zero dot product?": "각 꼭짓점을 확인하세요: 어느 두 변의 내적이 0인가요?", "{AB}•{AC} = 0 — right angle at A.": "{AB}•{AC} = 0 — A에서 직각.", "Area of a right-angled triangle?": "직각삼각형의 넓이는?", "½ × (product of the two legs).": "½ × (두 직각변의 곱).", "Substitute |**p**| = 1 and cos 45° = √2/2.": "|**p**| = 1과 cos 45° = √2/2를 대입하세요.", "Write **p** + t**q**.": "**p** + t**q**를 쓰세요.", "Dot product?": "내적은?", "Write {CA} and {CB}.": "{CA}와 {CB}를 쓰세요.", "Once you know the right angle is at C, how can you get the area quickly?": "직각이 C에 있다는 것을 알면 넓이를 어떻게 빨리 구할 수 있나요?", "Translate “perpendicular” into an equation.": "“수직”을 방정식으로 바꾸세요.", "After expanding, what does |**a**| = |**b**| let you cancel?": "전개한 뒤 |**a**| = |**b**|를 이용하면 무엇이 소거되나요?", "What is special about |**a**| and |**b**| in a rhombus?": "마름모에서 |**a**|와 |**b**|는 어떤 특별한 관계인가요?", "They are equal.": "같아요.", "How is {OB} related to {OA}?": "{OB}는 {OA}와 어떤 관계인가요?", "{OB} = λ{OA} — a multiple, through O.": "{OB} = λ{OA} — O를 지나는 실수배.", "If CB ⟂ OA, what does CB represent?": "CB ⟂ OA이면 CB는 무엇을 나타내나요?", "The shortest (perpendicular) distance from C to the line.": "C에서 직선까지의 최단(수직) 거리.", "A(2, −1, 3) and B(1, 1, 5). Every point R on the line AB can be reached by starting at A and travelling some multiple of {AB}.": "A(2, −1, 3)과 B(1, 1, 5). 직선 AB 위의 모든 점 R은 A에서 출발하여 {AB}의 적당한 실수배만큼 이동하면 도달할 수 있어요.", "Find {AB}.": "{AB}를 구하세요.", "Write the position vector of the point reached by going from A a distance of 2{AB}. And −1{AB}? And ½{AB}?": "A에서 2{AB}만큼 이동한 점의 위치벡터를 쓰세요. −1{AB}만큼은? ½{AB}만큼은?", "[[0;3;7]], [[3;−3;1]], [[1.5;0;4]] (the midpoint).": "[[0;3;7]], [[3;−3;1]], [[1.5;0;4]] (중점).", "Generalise: write **r**, the position vector of any point on the line, using a parameter λ.": "일반화하세요: 직선 위의 임의의 점의 위치벡터 **r**을 매개변수 λ로 나타내세요.", "Which λ gives A? Which gives B?": "어떤 λ가 A를 주나요? 어떤 λ가 B를 주나요?", "λ = 0 gives A; λ = 1 gives B.": "λ = 0이면 A, λ = 1이면 B.", "Is C(1.5, 0, 4.5) on the line? What must happen for a point to be on the line?": "C(1.5, 0, 4.5)는 직선 위에 있나요? 점이 직선 위에 있으려면 무엇이 성립해야 하나요?", "One single λ must satisfy all three component equations. x: λ = 0.5, y: −1 + 1 = 0 ✓, z: 3 + 1 = 4 ≠ 4.5 ✗ — not on the line.": "하나의 λ가 세 성분의 방정식을 모두 만족해야 해요. x: λ = 0.5, y: −1 + 1 = 0 ✓, z: 3 + 1 = 4 ≠ 4.5 ✗ — 직선 위에 없어요.", "Could you have used B as the starting point, or 2{AB} as the direction?": "B를 출발점으로 쓰거나 2{AB}를 방향으로 써도 될까요?", "Yes — any point on the line and any non-zero multiple of the direction give a valid equation of the SAME line.": "네 — 직선 위의 아무 점과 방향의 0이 아닌 아무 실수배를 써도 같은 직선의 올바른 방정식이 돼요.", "**r** = **a** + λ**d**: a known point plus any multiple of a direction vector. Different (point, direction) choices describe the same line with a different λ for each point.": "**r** = **a** + λ**d**: 알고 있는 한 점 + 방향벡터의 실수배. (점, 방향)을 다르게 골라도 같은 직선을 나타내지만, 각 점에 대응하는 λ 값은 달라져요.", "What do you need for a vector equation?": "벡터방정식을 쓰려면 무엇이 필요한가요?", "One point on the line and a direction vector.": "직선 위의 한 점과 방향벡터.", "How many equations does “**r** = **c**” give, and how many unknowns?": "“**r** = **c**”는 방정식 몇 개와 미지수 몇 개를 주나요?", "Three equations, one unknown λ — the same λ must satisfy all three.": "방정식 세 개, 미지수 λ 하나 — 같은 λ가 세 식을 모두 만족해야 해요.", "Which vector goes outside the λ, and which is multiplied by λ?": "어느 벡터가 λ 밖에 있고, 어느 벡터에 λ를 곱하나요?", "The point (position vector) is fixed; the direction is multiplied by λ.": "점(위치벡터)은 고정이고, 방향에 λ를 곱해요.", "What happens to y because the direction has a zero second component?": "방향의 두 번째 성분이 0이면 y는 어떻게 되나요?", "y stays constant: y = −2.": "y는 일정해요: y = −2.", "How do you get rid of λ?": "λ를 어떻게 없애나요?", "Make λ the subject of both parametric equations and equate.": "두 매개변수 방정식을 각각 λ에 대해 정리하고 같게 놓아요.", "In 3D, can you get a single equation in x, y, z?": "3차원에서 x, y, z에 대한 방정식 하나로 나타낼 수 있나요?", "No — eliminating λ gives a chain of equal fractions (two equations).": "아니요 — λ를 소거하면 같은 분수들이 이어진 꼴(방정식 두 개)이 돼요.", "Can you read the direction vector from the Cartesian form?": "직교(Cartesian) 방정식에서 방향벡터를 읽어 낼 수 있나요?", "Yes, from the denominators when written as (x − 4)/(−3) = (y + 3)/5 = (z − 2)/1.": "네, (x − 4)/(−3) = (y + 3)/5 = (z − 2)/1처럼 쓰면 분모에서 읽을 수 있어요.", "What is z for every point on this line?": "이 직선 위의 모든 점에서 z는 얼마인가요?", "z = 5 always.": "항상 z = 5.", "In a, why is the z-component of the direction not 5?": "a에서 방향의 z 성분이 왜 5가 아닌가요?", "Because 2z + 1 = 5λ gives z = −½ + (5/2)λ: divide by the coefficient 2.": "2z + 1 = 5λ에서 z = −½ + (5/2)λ이기 때문이에요: 계수 2로 나눠야 해요.", "Which vectors do you use?": "어떤 벡터를 쓰나요?", "The direction vectors [[−4;0;3]] and [[1;1;−2]].": "방향벡터 [[−4;0;3]]과 [[1;1;−2]].", "cos θ is negative — what next?": "cos θ가 음수예요 — 다음은?", "θ is obtuse; the acute angle is 180° − θ.": "θ는 둔각이에요. 예각은 180° − θ.", "Which vectors in each equation determine the direction of the line?": "각 방정식에서 직선의 방향을 결정하는 벡터는 무엇인가요?", "The vectors multiplied by λ and μ.": "λ와 μ가 곱해진 벡터.", "If θ is obtuse, how is the acute angle between the LINES related to θ?": "θ가 둔각이면 두 직선 사이의 예각은 θ와 어떤 관계인가요?", "Acute angle = 180° − θ (lines form two pairs of supplementary angles).": "예각 = 180° − θ (두 직선은 서로 보각인 각 두 쌍을 만들어요).", "Write the position vector of a general point B on l.": "l 위의 일반적인 점 B의 위치벡터를 쓰세요.", "What equation expresses “AB ⟂ l”?": "“AB ⟂ l”을 나타내는 식은 무엇인가요?", "{AB}•**d** = 0 where **d** = [[1;−1;1]].": "{AB}•**d** = 0, 여기서 **d** = [[1;−1;1]].", "Why is AB the SHORTEST distance?": "왜 AB가 최단 거리인가요?", "The perpendicular is shorter than any slanted segment (Pythagoras).": "수선은 어떤 비스듬한 선분보다도 짧아요 (피타고라스).", "Is speed a vector or a scalar? How do you get it from **v**?": "속력은 벡터인가요, 스칼라인가요? **v**로부터 어떻게 구하나요?", "Scalar: speed = |**v**|.": "스칼라: 속력 = |**v**|.", "Line l: **r** = [[3;−1;0]] + λ[[1;−1;1]], point A(3, 9, −2). Let B be a general point on l.": "직선 l: **r** = [[3;−1;0]] + λ[[1;−1;1]], 점 A(3, 9, −2). B를 l 위의 일반적인 점이라 해요.", "Write AB² as a function of λ.": "AB²을 λ의 함수로 나타내세요.", "Find the λ that minimises AB² (complete the square).": "AB²을 최소로 만드는 λ를 구하세요 (완전제곱식).", "3(λ + 4)² + 56 ⇒ minimum at λ = −4, AB² = 56.": "3(λ + 4)² + 56 ⇒ λ = −4에서 최소, AB² = 56.", "At λ = −4, compute {AB}•**d**. What do you notice?": "λ = −4에서 {AB}•**d**를 계산하세요. 무엇을 알 수 있나요?", "[[−4;−6;−2]]•[[1;−1;1]] = −4 + 6 − 2 = 0 — the shortest segment is perpendicular to the line.": "[[−4;−6;−2]]•[[1;−1;1]] = −4 + 6 − 2 = 0 — 가장 짧은 선분은 직선에 수직이에요.", "Which method is quicker: minimising, or setting {AB}•**d** = 0?": "최소화하는 방법과 {AB}•**d** = 0으로 놓는 방법 중 어느 것이 더 빠른가요?", "{AB}•**d** = 0 gives a linear equation immediately.": "{AB}•**d** = 0은 바로 일차방정식이 돼요.", "The shortest distance from a point to a line is along the perpendicular: find B on l with {AB}•**d** = 0, then compute |{AB}|.": "점에서 직선까지의 최단 거리는 수선을 따라가요: {AB}•**d** = 0인 l 위의 점 B를 찾고 |{AB}|를 계산해요.", "Direction vector?": "방향벡터는?", "How do you test C?": "C는 어떻게 확인하나요?", "Find λ from one component and check the others.": "한 성분에서 λ를 구하고 나머지 성분을 확인해요.", "In part b, which coordinates stay constant along the line?": "b에서 직선을 따라 일정한 좌표는 무엇인가요?", "Same method, just two components.": "같은 방법, 성분만 두 개예요.", "Find λ from x, check y.": "x에서 λ를 구하고 y를 확인해요.", "Form?": "형태는?", "What is the **j**-component of **i** − 3**k**?": "**i** − 3**k**의 **j** 성분은 무엇인가요?", "Gradient of each line?": "각 직선의 기울기는?", "Write one equation per component.": "성분마다 방정식을 하나씩 쓰세요.", "x = a₁ + λd₁, etc.": "x = a₁ + λd₁ 등.", "Fill in the missing zero components first.": "먼저 빠진 0 성분을 채우세요.", "In a, what kind of line is it?": "a는 어떤 직선인가요?", "Vertical: x = −1 for all points.": "수직선: 모든 점에서 x = −1.", "Eliminate λ.": "λ를 소거하세요.", "Eliminate λ from the two parametric equations.": "두 매개변수 방정식에서 λ를 소거하세요.", "Which coordinate never changes in each case?": "각 경우 변하지 않는 좌표는 무엇인가요?", "Pattern?": "규칙은?", "Fractions in the point just appear in the numerators.": "점에 있는 분수는 분자에 그대로 나타나요.", "Dividing by ½ is the same as multiplying by…?": "½로 나누는 것은 무엇을 곱하는 것과 같나요…?", "What is x on each line?": "각 직선에서 x는 얼마인가요?", "Constant: a x = −1;  b x = 1.": "일정해요: a x = −1;  b x = 1.", "Which coordinate is constant?": "어느 좌표가 일정한가요?", "Two components of the direction are zero. How many coordinates are fixed?": "방향의 두 성분이 0이에요. 고정되는 좌표는 몇 개인가요?", "Two.": "두 개.", "Read the point from the numerators and the direction from the denominators.": "분자에서 점을, 분모에서 방향을 읽으세요.", "a point (2, −1, 3), direction (5, −3, 1).": "a 점 (2, −1, 3), 방향 (5, −3, 1).", "Set each expression = λ and solve for x, y, z.": "각 식을 = λ로 놓고 x, y, z에 대해 푸세요.", "What is the z-component of the direction vector?": "방향벡터의 z 성분은 무엇인가요?", "Which coordinate is free to vary?": "자유롭게 변할 수 있는 좌표는 무엇인가요?", "Only the direction vectors matter.": "방향벡터만 중요해요.", "If the dot product is negative, what do you do?": "내적이 음수이면 어떻게 하나요?", "Take its absolute value (or subtract from 180°).": "절댓값을 취하세요 (또는 180°에서 빼세요).", "Directions?": "방향은?", "Direction?": "방향은?", "What do parallel lines share?": "평행한 직선은 무엇을 공유하나요?", "A direction vector.": "방향벡터.", "Do the lines share a point? Does it matter for the angle?": "두 직선이 한 점을 공유하나요? 각을 구하는 데 영향이 있나요?", "Yes (4, 1, −2) — but the angle depends only on the directions.": "네, (4, 1, −2) — 하지만 각은 방향에만 의존해요.", "What must the dot product of the directions be?": "두 방향의 내적은 얼마여야 하나요?", "Substitute the coordinates into each fraction. What must be true?": "각 분수에 좌표를 대입하세요. 무엇이 성립해야 하나요?", "All three values must be equal.": "세 값이 모두 같아야 해요.", "For part c, what must be the same in all three components?": "c에서 세 성분 모두 같아야 하는 것은 무엇인가요?", "The time t.": "시간 t.", "Find both positions at t = 3 first.": "먼저 t = 3일 때 두 위치를 구하세요.", "Direction of the z-axis?": "z축의 방향은?", "Find the parameter for A and for B.": "A와 B에 대응하는 매개변수 값을 각각 구하세요.", "Where must C be?": "C는 어디에 있어야 하나요?", "Same step again: t = 2 (C ≠ A).": "같은 간격을 한 번 더: t = 2 (C ≠ A).", "With **r** = **p** + λ(**q** − **p**), what λ values give PR = 3PQ?": "**r** = **p** + λ(**q** − **p**)에서 PR = 3PQ가 되는 λ는?", "Moving λ units of the direction travels how far?": "방향벡터를 λ배 이동하면 얼마나 이동하나요?", "Set (3 − x)/2 = (3z + 1)/4 = λ.": "(3 − x)/2 = (3z + 1)/4 = λ로 놓으세요.", "Set each fraction equal to λ.": "각 분수를 λ와 같게 놓으세요.", "Find each direction carefully. For (3 − 2z)/2 = λ, what is z?": "각 방향을 신중하게 구하세요. (3 − 2z)/2 = λ에서 z는?", "z = 3/2 − λ, so the z-direction is −1. Directions: [[5;1;−1]] and [[3;0;−1]].": "z = 3/2 − λ, 그래서 z 방향은 −1이에요. 방향: [[5;1;−1]]과 [[3;0;−1]].", "General point C and {PC}?": "일반적인 점 C와 {PC}는?", "Which vector is the velocity?": "어느 벡터가 속도인가요?", "Minimise the distance or its square?": "거리를 최소화할까요, 거리의 제곱을 최소화할까요?", "The square — a quadratic in t.": "제곱 — t에 대한 이차식이에요.", "How do you make a velocity of the right speed?": "원하는 속력을 가진 속도는 어떻게 만드나요?", "speed × unit vector in the direction.": "속력 × 그 방향의 단위벡터.", "Where must R be relative to M and Q?": "R은 M과 Q에 대해 어디에 있어야 하나요?", "M is the midpoint of QR (equal slant lengths are symmetric about the foot).": "M이 QR의 중점이에요 (같은 길이의 빗선은 수선의 발에 대해 대칭이에요).", "In e, sketch the right-angled triangle: hypotenuse PQ, angle θ at P. Which trig ratio gives the perpendicular?": "e에서 직각삼각형을 그려 보세요: 빗변 PQ, P에서의 각 θ. 어떤 삼각비가 수선의 길이를 주나요?", "distance = PQ sin θ.": "거리 = PQ sin θ.", "Condition for the closest point F?": "가장 가까운 점 F의 조건은?", "Vector from the point to a general point on the line?": "점에서 직선 위의 일반적인 점까지의 벡터는?", "Pick up two pens (or use the edges of the classroom). Hold them so they represent two straight lines in 3D.": "펜 두 자루를 들어 보세요 (또는 교실의 모서리를 이용하세요). 3차원의 두 직선을 나타내도록 들어 보세요.", "In 2D, what are the possible arrangements of two distinct lines?": "2차원에서 서로 다른 두 직선의 가능한 배치는 무엇인가요?", "They either intersect at one point or are parallel.": "한 점에서 만나거나 평행해요.", "Find two edges of the room that never meet and are NOT parallel. What are such lines called?": "교실에서 절대 만나지 않으면서 평행하지도 않은 두 모서리를 찾아보세요. 이런 직선을 무엇이라 하나요?", "e.g. a floor edge and a non-parallel ceiling edge on the opposite wall — these are skew lines. They lie in parallel planes but have different directions.": "예: 바닥의 한 모서리와 반대쪽 벽 천장의 평행하지 않은 모서리 — 꼬인 위치(skew)에 있는 직선이에요. 평행한 두 평면 위에 있지만 방향이 달라요.", "Two lines **r** = **a** + λ**d₁** and **r** = **b** + μ**d₂** meet if there are λ, μ with **a** + λ**d₁** = **b** + μ**d₂**. How many scalar equations and unknowns is that in 3D?": "두 직선 **r** = **a** + λ**d₁**과 **r** = **b** + μ**d₂**는 **a** + λ**d₁** = **b** + μ**d₂**인 λ, μ가 있으면 만나요. 3차원에서 이것은 스칼라 방정식 몇 개, 미지수 몇 개인가요?", "Three equations, two unknowns — solve two of them, then CHECK the third.": "방정식 세 개, 미지수 두 개 — 두 개를 풀고, 세 번째로 반드시 확인하세요.", "If the third equation fails, the lines do not meet. What one extra check decides between parallel and skew?": "세 번째 식이 성립하지 않으면 두 직선은 만나지 않아요. 평행과 꼬인 위치를 구별하는 추가 확인은 무엇인가요?", "Whether **d₁** is a multiple of **d₂**.": "**d₁**이 **d₂**의 실수배인지.", "If **d₁** = k**d₂**, how can you tell “parallel” from “the same line”?": "**d₁** = k**d₂**이면 “평행”과 “같은 직선”은 어떻게 구별하나요?", "Test whether a point of one line lies on the other line.": "한 직선 위의 점이 다른 직선 위에 있는지 확인해요.", "Decision flow: (1) Are directions parallel? Yes → same line or parallel (test a point). No → (2) Solve **r₁** = **r₂**: consistent ⇒ intersect (find the point); inconsistent ⇒ skew.": "판단 흐름: (1) 방향이 평행한가? 예 → 같은 직선 또는 평행 (한 점으로 확인). 아니요 → (2) **r₁** = **r₂**를 풀어요: 해가 있으면 ⇒ 교점 (교점을 구함); 해가 없으면 ⇒ 꼬인 위치.", "Why must you use different letters λ and μ?": "왜 λ와 μ처럼 서로 다른 문자를 써야 하나요?", "The two lines reach the common point at (generally) different parameter values.": "두 직선은 (일반적으로) 서로 다른 매개변수 값에서 공통점에 도달하기 때문이에요.", "Which two equations would be easiest to solve together?": "어떤 두 식을 함께 푸는 것이 가장 쉬울까요?", "(1) and (3) — subtracting eliminates λ.": "(1)과 (3) — 빼면 λ가 소거돼요.", "What two facts together prove “skew”?": "“꼬인 위치”임을 증명하는 두 가지 사실은?", "They do not intersect AND they are not parallel.": "만나지 않고, 그리고 평행하지 않아요.", "Step 1 for both parts?": "두 문제 모두 1단계는?", "Check that the direction vectors are multiples of each other.": "방향벡터가 서로 실수배인지 확인해요.", "Step 2?": "2단계는?", "Check whether a point of one line lies on the other.": "한 직선 위의 점이 다른 직선 위에 있는지 확인해요.", "Write the three component equations. Which pair is simplest?": "세 성분 방정식을 쓰세요. 어떤 두 식이 가장 간단한가요?", "a x and y: 6 − λ = 2 + 2μ, 1 + 2λ = 1 − 2μ (add them!).  b the y-equation contains only λ.": "a x와 y: 6 − λ = 2 + 2μ, 1 + 2λ = 1 − 2μ (두 식을 더하세요!).  b y에 대한 식에는 λ만 있어요.", "In part a, which equation gives μ immediately?": "a에서 어떤 식이 μ를 바로 주나요?", "In a, what does the x-equation give?": "a에서 x에 대한 식은 무엇을 주나요?", "Two things to show?": "보여야 할 두 가지는?", "No solution for (t, s) and the directions are not parallel.": "(t, s)의 해가 없고, 방향이 평행하지 않아요.", "In a, which equation contains only λ?": "a에서 λ만 들어 있는 식은?", "Are the directions multiples?": "방향이 실수배인가요?", "Then test a point of the first line on the second line.": "그러면 첫 번째 직선의 점이 두 번째 직선 위에 있는지 확인하세요.", "Solve **a** = **b** + μ**e** and see if one μ works.": "**a** = **b** + μ**e**를 풀어서 하나의 μ가 성립하는지 보세요.", "Watch out — the point of one line is the direction of the other! Are the directions parallel?": "주의 — 한 직선의 점이 다른 직선의 방향이에요! 방향이 평행한가요?", "No, so the lines are non-parallel (in fact they intersect).": "아니요, 그래서 평행하지 않은 직선이에요 (실제로는 만나요).", "In a, write 0.5**j** − **i** as a column vector.": "a에서 0.5**j** − **i**를 열벡터로 쓰세요.", "[[−1;0.5;0]] = −½[[2;−1;0]] — parallel.": "[[−1;0.5;0]] = −½[[2;−1;0]] — 평행.", "Write both lines.": "두 직선을 모두 쓰세요.", "(−1, −2, −4) and (−1, −3, 3) — not parallel.": "(−1, −2, −4)와 (−1, −3, 3) — 평행하지 않아요.", "From z − 5 = (x − 7)/2, what is x?": "z − 5 = (x − 7)/2에서 x는?", "Add the x- and y-equations: what happens to λ?": "x와 y에 대한 식을 더하세요: λ는 어떻게 되나요?", "It cancels: 1 = 9 + 4μ.": "소거돼요: 1 = 9 + 4μ.", "Direction of the Cartesian line?": "직교 방정식으로 주어진 직선의 방향은?", "Points on the y-axis have which coordinates equal to 0?": "y축 위의 점은 어떤 좌표가 0인가요?", "Convert both to parametric form.": "둘 다 매개변수 형태로 바꾸세요.", "Which equations do not involve p?": "p가 들어 있지 않은 식은 무엇인가요?", "x and y — use them to find λ and μ, then z gives p.": "x와 y — 이것으로 λ와 μ를 구하고, z에서 p를 구해요.", "For crossing paths, should you use the same parameter for both?": "경로가 교차하는지 볼 때 두 경로에 같은 매개변수를 써야 하나요?", "No — use different parameters (t and s): paths can cross at different times.": "아니요 — 서로 다른 매개변수(t와 s)를 쓰세요: 경로는 서로 다른 시각에 교차할 수 있어요.", "For a collision, what extra condition is needed?": "충돌하려면 어떤 추가 조건이 필요한가요?", "Same point at the SAME time t.": "같은 시각 t에 같은 점에 있어야 해요.", "Velocities?": "속도는?", "“Vertically above” means which components agree?": "“바로 위에 있다”는 것은 어떤 성분이 같다는 뜻인가요?", "The **i**- and **j**-components (same time t).": "**i** 성분과 **j** 성분 (같은 시각 t에서).", "Write the submarine velocity as s(40, −25, c). Where is the boat at time T?": "잠수함의 속도를 s(40, −25, c)로 쓰세요. 시각 T에 배는 어디에 있나요?", "Write {PQ} in terms of λ and μ.": "{PQ}를 λ와 μ로 나타내세요.", "Two perpendicularity conditions?": "수직 조건 두 개는?", "Find a non-zero vector **n** = [[x;y;z]] perpendicular to both **a** = [[1;−3;2]] and **b** = [[2;1;5]].": "**a** = [[1;−3;2]]와 **b** = [[2;1;5]]에 모두 수직인 영벡터가 아닌 벡터 **n** = [[x;y;z]]를 찾으세요.", "Write the two equations that **n** must satisfy.": "**n**이 만족해야 하는 두 방정식을 쓰세요.", "Two equations, three unknowns — why can’t you find a unique answer? What does that mean geometrically?": "방정식 두 개, 미지수 세 개 — 왜 하나의 답을 구할 수 없나요? 기하학적으로 무슨 뜻인가요?", "Any multiple of a perpendicular vector is also perpendicular; the solutions form a whole line of directions.": "수직인 벡터의 어떤 실수배도 수직이에요. 해는 한 방향의 직선 전체를 이뤄요.", "Eliminate x and express x and y in terms of z.": "x를 소거하고 x와 y를 z로 나타내세요.", "2×(1st) − (2nd): −7y − z = 0 ⇒ y = −z/7; then x = 3y − 2z = −17z/7.": "2×(첫째 식) − (둘째 식): −7y − z = 0 ⇒ y = −z/7; 그러면 x = 3y − 2z = −17z/7.", "Choose z = 7. What is **n**?": "z = 7로 고르세요. **n**은 무엇인가요?", "Compare with the formula [[a₂b₃ − a₃b₂;a₃b₁ − a₁b₃;a₁b₂ − a₂b₁]].": "공식 [[a₂b₃ − a₃b₂;a₃b₁ − a₁b₃;a₁b₂ − a₂b₁]]과 비교하세요.", "[[(−3)(5) − (2)(1);(2)(2) − (1)(5);(1)(1) − (−3)(2)]] = [[−17;−1;7]] — exactly the same! This is the vector (cross) product **a** × **b**.": "[[(−3)(5) − (2)(1);(2)(2) − (1)(5);(1)(1) − (−3)(2)]] = [[−17;−1;7]] — 정확히 같아요! 이것이 벡터곱(외적) **a** × **b**예요.", "**a** × **b** is a vector perpendicular to both **a** and **b**, computed with the component formula (in the formula booklet). Its length |**a**||**b**|sin θ is the area of the parallelogram spanned by **a** and **b**.": "**a** × **b**는 **a**와 **b**에 모두 수직인 벡터이고, 성분 공식(공식집에 있음)으로 계산해요. 그 길이 |**a**||**b**|sin θ는 **a**와 **b**가 만드는 평행사변형의 넓이예요.", "Which trig function appears in the vector product (compare with the dot product)?": "벡터곱에는 어떤 삼각함수가 나오나요 (내적과 비교해 보세요)?", "sin θ (the dot product uses cos θ).": "sin θ (내적은 cos θ를 써요).", "How can you check your answer quickly?": "답을 빨리 확인하려면 어떻게 하나요?", "Dot it with **a** and with **b** — both should be 0.": "**a**, **b**와 각각 내적해 보세요 — 둘 다 0이어야 해요.", "Write the first component carefully: a₂b₃ − a₃b₂ = ?": "첫 번째 성분을 신중하게 쓰세요: a₂b₃ − a₃b₂ = ?", "How can you test each answer without recomputing?": "다시 계산하지 않고 각 답을 확인하는 방법은?", "Dot it with [[2;5;−2]]: only the correct one gives 0 (52 − 50 − 2 = 0).": "[[2;5;−2]]와 내적하세요: 올바른 답만 0이 돼요 (52 − 50 − 2 = 0).", "What are **a** × **a** and **b** × **b**?": "**a** × **a**와 **b** × **b**는 무엇인가요?", "Both **0**.": "둘 다 **0**.", "How is **b** × **a** related to **a** × **b**?": "**b** × **a**는 **a** × **b**와 어떤 관계인가요?", "Which two vectors?": "어떤 두 벡터인가요?", "Two sides from the same vertex, e.g. {MN} and {MP}.": "같은 꼭짓점에서 나오는 두 변, 예: {MN}과 {MP}.", "Can |**a** × **b**| be negative for an obtuse angle?": "둔각일 때 |**a** × **b**|가 음수가 될 수 있나요?", "No — sin θ > 0 for 0° < θ < 180°.": "아니요 — 0° < θ < 180°에서 sin θ > 0.", "First component for part a?": "a의 첫 번째 성분은?", "Check method?": "확인 방법은?", "Dot the result with **a** and **b**.": "결과를 **a**와 **b**에 각각 내적해 보세요.", "Columns for part b?": "b의 열벡터는?", "2 × 5 = 10 (perpendicular).": "2 × 5 = 10 (수직).", "**b** × **a** in terms of **a** × **b**?": "**b** × **a**를 **a** × **b**로 나타내면?", "−(**a** × **b**) — the magnitude is unaffected.": "−(**a** × **b**) — 크기는 그대로예요.", "Only the cross terms survive. In part a, what are they?": "교차항만 남아요. a에서 교차항은 무엇인가요?", "Cross terms for part a?": "a의 교차항은?", "Two sides from the first vertex?": "첫 번째 꼭짓점에서 나오는 두 변은?", "In part b, all x-coordinates are 4. What does that tell you?": "b에서 모든 x좌표가 4예요. 무엇을 알 수 있나요?", "The triangle lies in the plane x = 4 — the cross product points along **i**.": "삼각형이 평면 x = 4 위에 있어요 — 외적은 **i** 방향을 가리켜요.", "Sides from the first vertex?": "첫 번째 꼭짓점에서 나오는 변은?", "Why does the question say “acute”?": "왜 문제에서 “예각”이라고 했을까요?", "sin θ = 0.7 has an acute and an obtuse solution.": "sin θ = 0.7은 예각 해와 둔각 해를 가져요.", "First find |**a** × **b**|.": "먼저 |**a** × **b**|를 구하세요.", "Have you met this cross product before?": "이 외적을 전에 본 적이 있나요?", "Yes — Q4b: [[−1;−10;7]].": "네 — Q4b: [[−1;−10;7]].", "Which operation gives this directly?": "어떤 연산이 이것을 바로 주나요?", "How do you turn a vector into a unit vector?": "벡터를 단위벡터로 바꾸려면 어떻게 하나요?", "Divide by its magnitude.": "크기로 나눠요.", "Cross product?": "외적은?", "Expand, keeping the order in each product.": "각 곱의 순서를 유지하면서 전개하세요.", "What is the direction of **a** × **b** relative to **a**?": "**a** × **b**는 **a**에 대해 어떤 방향인가요?", "Perpendicular.": "수직.", "Both are perpendicular to the plane ABC. What must be true about their directions?": "둘 다 평면 ABC에 수직이에요. 두 방향에 대해 무엇이 성립해야 하나요?", "They are parallel (same or opposite direction).": "평행해요 (같은 방향 또는 반대 방향).", "Compute **a** × **b** and **b** × **c** first.": "먼저 **a** × **b**와 **b** × **c**를 계산하세요.", "Area of a parallelogram with sides {AB} and {AD}?": "변이 {AB}와 {AD}인 평행사변형의 넓이는?", "Sides from (2, 1, 2)?": "(2, 1, 2)에서 나오는 두 변은?", "Write each term with |**a**|, |**b**| and θ.": "각 항을 |**a**|, |**b**|, θ로 쓰세요.", "Substitute **r** = −**p** − **q**.": "**r** = −**p** − **q**를 대입하세요.", "Then expand **q** × **r** and **r** × **p**.": "그다음 **q** × **r**와 **r** × **p**를 전개하세요.", "What is G (above C)?": "G(C의 바로 위)는 무엇인가요?", "Hold a sheet of card. Push a pencil through it at right angles (the pencil is the normal **n**).": "카드 한 장을 들고, 연필을 카드에 직각으로 꽂아 보세요 (연필이 법선 **n**이에요).", "How many planes contain two given points A and B? What extra information picks out one plane?": "주어진 두 점 A, B를 포함하는 평면은 몇 개인가요? 평면 하나를 정하려면 어떤 추가 정보가 필요한가요?", "Infinitely many (they rotate about line AB). A third point not on AB — or a second direction — fixes it.": "무수히 많아요 (직선 AB를 축으로 회전). AB 위에 있지 않은 세 번째 점 — 또는 두 번째 방향 — 이 평면을 정해요.", "Starting at a point A in the plane, how could you reach any other point using two non-parallel directions **d₁**, **d₂** in the plane?": "평면 위의 점 A에서 출발해서, 평면 위의 평행하지 않은 두 방향 **d₁**, **d₂**를 이용해 다른 모든 점에 어떻게 도달할 수 있나요?", "Go λ steps along **d₁** and μ steps along **d₂**: **r** = **a** + λ**d₁** + μ**d₂**.": "**d₁** 방향으로 λ만큼, **d₂** 방향으로 μ만큼 가요: **r** = **a** + λ**d₁** + μ**d₂**.", "Keep the pencil (normal **n**) fixed and slide the card along it. What changes and what stays the same?": "연필(법선 **n**)은 고정하고 카드를 연필을 따라 밀어 보세요. 무엇이 바뀌고 무엇이 그대로인가요?", "The plane moves parallel to itself: the tilt (normal) is the same, the position changes. So **n** + one point fixes the plane.": "평면이 자기 자신과 평행하게 이동해요: 기울기(법선)는 같고 위치가 바뀌어요. 그래서 **n** + 한 점이 평면을 정해요.", "If R is any point in the plane through A with normal **n**, what is (**r** − **a**)•**n**? Why?": "R이 A를 지나고 법선이 **n**인 평면 위의 임의의 점이면 (**r** − **a**)•**n**은 얼마인가요? 왜 그런가요?", "0 — {AR} lies in the plane, so it is perpendicular to **n**.": "0 — {AR}이 평면 위에 있으므로 **n**과 수직이에요.", "Expand (**r** − **a**)•**n** = 0 with **r** = [[x;y;z]], **n** = [[3;−2;2]], **a** = [[4;8;−1]].": "**r** = [[x;y;z]], **n** = [[3;−2;2]], **a** = [[4;8;−1]]일 때 (**r** − **a**)•**n** = 0을 전개하세요.", "**r**•**n** = **a**•**n** ⇒ 3x − 2y + 2z = 12 − 16 − 2 = −6. The coefficients of x, y, z ARE the normal vector.": "**r**•**n** = **a**•**n** ⇒ 3x − 2y + 2z = 12 − 16 − 2 = −6. x, y, z의 계수가 바로 법선벡터예요.", "Given a vector equation, how could you find **n**?": "벡터방정식이 주어지면 **n**은 어떻게 구할 수 있나요?", "**n** must be perpendicular to both **d₁** and **d₂**: **n** = **d₁** × **d₂**.": "**n**은 **d₁**과 **d₂**에 모두 수직이어야 해요: **n** = **d₁** × **d₂**.", "Three forms of a plane: **r** = **a** + λ**d₁** + μ**d₂** (point + two directions) → **n** = **d₁** × **d₂** → **r**•**n** = **a**•**n** → n₁x + n₂y + n₃z = d. The Cartesian coefficients give the normal.": "평면의 세 가지 형태: **r** = **a** + λ**d₁** + μ**d₂** (점 + 두 방향) → **n** = **d₁** × **d₂** → **r**•**n** = **a**•**n** → n₁x + n₂y + n₃z = d. 직교 방정식의 계수가 법선을 줘요.", "How many unknowns and how many equations in part b?": "b에서 미지수와 방정식은 각각 몇 개인가요?", "Two unknowns (λ, μ), three equations — solve two, check the third.": "미지수 두 개(λ, μ), 방정식 세 개 — 두 개를 풀고 세 번째로 확인해요.", "Which number goes on the right-hand side?": "오른쪽에는 어떤 수가 오나요?", "What two things do you need for r•n = a•n?": "r•n = a•n을 쓰려면 어떤 두 가지가 필요한가요?", "A point (1, −2, 5) and a normal **n** = **d₁** × **d₂**.": "점 (1, −2, 5)와 법선 **n** = **d₁** × **d₂**.", "Two vectors parallel to the plane?": "평면과 평행한 두 벡터는?", "The answer y + z = 2 has no x. Why is it still a plane, not a line?": "답 y + z = 2에는 x가 없어요. 왜 직선이 아니라 평면인가요?", "x can take any value — the plane is parallel to the x-axis.": "x는 어떤 값이든 될 수 있어요 — 평면이 x축과 평행해요.", "In part a, compare B with A.": "a에서 B를 A와 비교해 보세요.", "They are the same point!": "같은 점이에요!", "Alternative test: compute **n** = **d₁** × **d₂** and compare **n**•**a** with **n**•**b**.": "다른 방법: **n** = **d₁** × **d₂**를 구하고 **n**•**a**와 **n**•**b**를 비교하세요.", "Fill in zeros: **d₂** = [[1;−3;0]] in a, **d₁** = [[5;−6;0]] in b.": "0을 채우세요: a에서 **d₂** = [[1;−3;0]], b에서 **d₁** = [[5;−6;0]].", "Compute **a**•**n**.": "**a**•**n**을 계산하세요.", "A zero component in **n** means that variable is missing. Which variable is missing in each?": "**n**의 성분이 0이면 그 변수가 없다는 뜻이에요. 각각 어떤 변수가 빠지나요?", "**n** = **d₁** × **d₂** for part a?": "a에서 **n** = **d₁** × **d₂**는?", "The plane in a contains the direction **k**. What does that say about z in the equation?": "a의 평면은 **k** 방향을 포함해요. 방정식에서 z에 대해 무엇을 알 수 있나요?", "z is free — it won’t appear.": "z는 자유로워요 — 식에 나타나지 않아요.", "Split into constant part, λ part and μ part.": "상수 부분, λ 부분, μ 부분으로 나누세요.", "Direction vectors?": "방향벡터는?", "{AB} and {AC} for part a?": "a에서 {AB}와 {AC}는?", "Quick method: find **n** and compare **n**•**a** with **n**•**p**.": "빠른 방법: **n**을 구하고 **n**•**a**와 **n**•**p**를 비교하세요.", "Cartesian form makes testing easy. Normal?": "직교 방정식으로 바꾸면 확인이 쉬워요. 법선은?", "Where is the normal hiding?": "법선은 어디에 숨어 있나요?", "In the coefficients of x, y, z.": "x, y, z의 계수에요.", "A line lies in a plane when…?": "직선이 평면 위에 있으려면…?", "…one point of the line is in the plane AND its direction is perpendicular to **n** (or two of its points are in the plane).": "…직선의 한 점이 평면 위에 있고, 그리고 방향이 **n**에 수직이어야 해요 (또는 직선의 두 점이 평면 위에 있어야 해요).", "Why is the cross product of the two directions the normal of the plane?": "두 방향의 외적이 왜 평면의 법선인가요?", "The plane contains both directions, so its normal is perpendicular to both.": "평면이 두 방향을 모두 포함하므로, 법선은 두 방향에 모두 수직이에요.", "Careful with (3 − z)/3: what is the z-direction?": "(3 − z)/3을 주의하세요: z 방향은?", "z = 3 − 3λ, so the direction is [[3;4;−3]].": "z = 3 − 3λ, 그래서 방향은 [[3;4;−3]].", "You have one direction already. Where does the second come from?": "방향 하나는 이미 있어요. 두 번째 방향은 어디서 오나요?", "From a point on the line to P: [[11;12;13]] − [[9;−3;7]].": "직선 위의 점에서 P까지: [[11;12;13]] − [[9;−3;7]].", "In a, can you write [[0;1;0]] as a combination of vectors in the plane?": "a에서 [[0;1;0]]을 평면 위의 벡터들의 조합으로 쓸 수 있나요?", "[[0;1;0]] = ½(2[[2;1;1]] − [[4;0;2]]): difference of two position vectors of points in Π.": "[[0;1;0]] = ½(2[[2;1;1]] − [[4;0;2]]): Π 위의 두 점의 위치벡터의 차예요.", "Two conditions?": "두 가지 조건은?", "A point of the line is in the plane, and **d**•**n** = 0.": "직선의 한 점이 평면 위에 있고, **d**•**n** = 0.", "Find the plane’s normal first.": "먼저 평면의 법선을 구하세요.", "Strategy?": "전략은?", "Find the plane through A, B, C, then test D.": "A, B, C를 지나는 평면을 구한 다음 D를 확인해요.", "A pencil (line, direction **d**) stands on a desk (plane, normal **n**). A lamp directly above casts its shadow on the desk.": "연필(직선, 방향 **d**)이 책상(평면, 법선 **n**) 위에 서 있어요. 바로 위의 조명이 책상에 그림자를 만들어요.", "The angle between the line and the plane is defined as the angle θ between the pencil and its shadow. Why the shadow, and not some other line in the desk?": "직선과 평면 사이의 각은 연필과 그 그림자 사이의 각 θ로 정의해요. 왜 책상 위의 다른 직선이 아니라 그림자일까요?", "The shadow (projection) gives the SMALLEST angle the pencil makes with any line in the plane.": "그림자(정사영)가 연필이 평면 위의 어떤 직선과 이루는 각 중 가장 작은 각을 줘요.", "We know **d** and **n**, but not the shadow’s direction. What angle can we compute easily with a dot product?": "**d**와 **n**은 알지만 그림자의 방향은 몰라요. 내적으로 쉽게 계산할 수 있는 각은 무엇인가요?", "φ, the angle between **d** and the normal **n**: cos φ = |**d**•**n**|/(|**d**||**n**|).": "φ, 즉 **d**와 법선 **n** 사이의 각: cos φ = |**d**•**n**|/(|**d**||**n**|).", "The pencil, its shadow and the normal form a right-angled triangle. How are θ and φ related?": "연필, 그림자, 법선은 직각삼각형을 이뤄요. θ와 φ는 어떤 관계인가요?", "θ + φ = 90°, so θ = 90° − φ (equivalently sin θ = |**d**•**n**|/(|**d**||**n**|)).": "θ + φ = 90°, 따라서 θ = 90° − φ (같은 뜻으로 sin θ = |**d**•**n**|/(|**d**||**n**|)).", "What happens when **d**•**n** = 0? When **d** is parallel to **n**?": "**d**•**n** = 0이면 어떻게 되나요? **d**가 **n**과 평행하면요?", "**d**•**n** = 0: θ = 0°, the line is parallel to (or lies in) the plane. **d** ∥ **n**: θ = 90°, the line is perpendicular to the plane.": "**d**•**n** = 0: θ = 0°, 직선이 평면과 평행하거나 평면 위에 있어요. **d** ∥ **n**: θ = 90°, 직선이 평면에 수직이에요.", "For the angle between two planes, which two vectors would you use?": "두 평면 사이의 각을 구할 때는 어떤 두 벡터를 쓰나요?", "Their normals — the angle between the normals equals the angle between the planes (Key Point 8.35).": "두 평면의 법선 — 법선 사이의 각이 평면 사이의 각과 같아요 (Key Point 8.35).", "Line–plane: θ = 90° − φ where cos φ = |**d**•**n**|/(|**d**||**n**|). Plane–plane: angle between the normals. Always check whether the question asks for the acute angle.": "직선–평면: θ = 90° − φ, 여기서 cos φ = |**d**•**n**|/(|**d**||**n**|). 평면–평면: 법선 사이의 각. 문제가 예각을 묻는지 항상 확인하세요.", "Which two vectors go into the dot product?": "내적에 들어가는 두 벡터는 무엇인가요?", "After finding φ, what’s the final step?": "φ를 구한 뒤 마지막 단계는?", "θ = 90° − φ (using the acute φ).": "θ = 90° − φ (예각인 φ를 사용).", "The angle you get from **d**•**n** is between the line and which object?": "**d**•**n**으로 구한 각은 직선과 무엇 사이의 각인가요?", "The NORMAL to the plane, not the plane itself.": "평면 자체가 아니라 평면의 법선과의 각이에요.", "Which vector in the line equation is its direction?": "직선의 방정식에서 어느 벡터가 방향인가요?", "[[1;−1;3]], the vector multiplied by λ.": "[[1;−1;3]], λ가 곱해진 벡터.", "Normals?": "법선은?", "Write x, y, z in terms of λ and substitute into the plane’s equation — one equation in λ.": "x, y, z를 λ로 나타내고 평면의 방정식에 대입하세요 — λ에 대한 방정식 하나가 돼요.", "Two equations, three unknowns: what kind of solution set?": "방정식 두 개, 미지수 세 개: 해의 집합은 어떤 모양인가요?", "Infinitely many — a line. Let one variable be the parameter.": "무수히 많아요 — 직선이에요. 변수 하나를 매개변수로 놓으세요.", "Alternative for the direction?": "방향을 구하는 다른 방법은?", "**n₁** × **n₂** = [[4;−1;3]] × [[1;2;1]] = [[−7;−1;9]] — then you just need one common point.": "**n₁** × **n₂** = [[4;−1;3]] × [[1;2;1]] = [[−7;−1;9]] — 그러면 공통점 하나만 찾으면 돼요.", "Use three sheets of card (or the walls, floor and a book) to model three planes. A system of three linear equations in x, y, z has a unique solution, infinitely many, or none.": "카드 세 장(또는 벽, 바닥, 책)으로 세 평면을 만들어 보세요. x, y, z에 대한 일차방정식 세 개의 연립방정식은 해가 하나이거나, 무수히 많거나, 없어요.", "Arrange the three planes so they share exactly one point. Example from the room?": "세 평면이 정확히 한 점을 공유하도록 배치해 보세요. 교실에서의 예는?", "Two walls and the floor meet at a corner — a unique solution.": "두 벽과 바닥이 모서리에서 만나요 — 해가 하나.", "Arrange them to share a whole line. What does that look like?": "직선 하나를 공유하도록 배치해 보세요. 어떤 모양인가요?", "Like the pages of an open book (a “sheaf”) — infinitely many solutions.": "펼친 책의 페이지들처럼 (평면 다발) — 해가 무수히 많아요.", "Find THREE different arrangements with no common point. Which normals are parallel in each?": "공통점이 없는 서로 다른 배치를 세 가지 찾아보세요. 각각 어떤 법선들이 평행한가요?", "All three parallel (all normals parallel); two parallel cut by a third (two normals parallel); a triangular prism (no normals parallel).": "세 평면 모두 평행 (모든 법선 평행); 평행한 두 평면을 세 번째 평면이 자름 (법선 두 개 평행); 삼각기둥 (평행한 법선 없음).", "If elimination gives 0 = −20, what do you know? What extra check distinguishes the three “no solution” cases?": "소거했더니 0 = −20이 나오면 무엇을 알 수 있나요? 세 가지 “해 없음” 경우를 구별하는 추가 확인은?", "The system is inconsistent (no common point). Then check which normals (if any) are multiples of each other.": "연립방정식이 모순이에요 (공통점 없음). 그다음 어떤 법선들이 서로 실수배인지 확인해요.", "If elimination gives 0 = 0, what do you know?": "소거했더니 0 = 0이 나오면 무엇을 알 수 있나요?", "One equation is a combination of the others — the planes meet in a line (assuming distinct, non-parallel planes).": "한 방정식이 다른 방정식들의 조합이에요 — 평면들이 한 직선에서 만나요 (서로 다르고 평행하지 않은 평면이라면).", "Unique solution ⇒ a point. 0 = 0 ⇒ a line (sheaf). 0 = (non-zero) ⇒ no intersection: prism (no parallel normals), two parallel planes cut by a third, or three parallel planes.": "해가 하나 ⇒ 한 점. 0 = 0 ⇒ 한 직선 (평면 다발). 0 = (0이 아닌 수) ⇒ 교점 없음: 삼각기둥 (평행한 법선 없음), 평행한 두 평면을 세 번째가 자름, 또는 세 평면이 모두 평행.", "Why can’t a GDC “show” there is no intersection?": "왜 계산기(GDC)로는 교점이 없음을 “보일” 수 없나요?", "It just gives an error; you must eliminate by hand to reach a contradiction.": "오류만 나오기 때문이에요. 직접 소거해서 모순을 이끌어내야 해요.", "What equation signals infinitely many solutions?": "어떤 식이 해가 무수히 많음을 알려주나요?", "0 = 0 after elimination.": "소거 후 0 = 0.", "Compute **d**•**n** first.": "먼저 **d**•**n**을 계산하세요.", "Shortcut: sin θ = |**d**•**n**|/(|**d**||**n**|).": "지름길: sin θ = |**d**•**n**|/(|**d**||**n**|).", "It gives θ directly.": "θ를 바로 줘요.", "Negative dot products?": "내적이 음수이면?", "Take the modulus.": "절댓값을 취하세요.", "Acute angle — use |**n₁**•**n₂**|.": "예각 — |**n₁**•**n₂**|를 쓰세요.", "Missing variables mean zero components: normals?": "빠진 변수는 성분이 0이라는 뜻이에요: 법선은?", "Substitute the parametric expressions into Π.": "매개변수 식을 Π에 대입하세요.", "Substitute.": "대입하세요.", "Quick direction?": "방향을 빨리 구하려면?", "Find one common point by setting one variable (e.g. x = 0 or z = 0).": "변수 하나를 정해서 (예: x = 0 또는 z = 0) 공통점 하나를 찾으세요.", "Directions by cross product?": "외적으로 구한 방향은?", "In part a, eliminate x and y together: what is z?": "a에서 x와 y를 함께 소거하세요: z는?", "Try the GDC solver first. If it returns a unique solution, you are done.": "먼저 계산기의 연립방정식 기능을 써 보세요. 해가 하나 나오면 끝이에요.", "Both systems have a non-zero determinant ⇒ unique solutions.": "두 연립방정식 모두 행렬식이 0이 아니에요 ⇒ 해가 하나.", "GDC gives an error — now what?": "계산기에서 오류가 나요 — 이제 어떻게 하나요?", "Eliminate by hand to find a contradiction, then check for parallel normals.": "직접 소거해서 모순을 찾고, 그다음 평행한 법선이 있는지 확인해요.", "Spot any normals that are multiples.": "실수배인 법선을 찾아보세요.", "Look for one equation being a combination of the others.": "한 방정식이 다른 방정식들의 조합인지 찾아보세요.", "Check: is (3) a combination of (1) and (2)?": "확인: (3)이 (1)과 (2)의 조합인가요?", "a (3) = ½[(1) + (2)];  b (1) − (2) gives x + 2y = 6 and (2) + (3) gives 2x + 4y = 12 — the same.": "a (3) = ½[(1) + (2)];  b (1) − (2)는 x + 2y = 6, (2) + (3)은 2x + 4y = 12 — 같은 식이에요.", "In both systems x and y always appear as (x − y) or (x − 2y). What does that suggest?": "두 연립방정식 모두 x와 y가 항상 (x − y) 또는 (x − 2y) 꼴로 나와요. 무엇을 시사하나요?", "Treat u = x − y (or x − 2y) as one unknown; z is then fixed.": "u = x − y (또는 x − 2y)를 하나의 미지수로 보세요. 그러면 z가 정해져요.", "A line perpendicular to a plane has which direction?": "평면에 수직인 직선의 방향은?", "The plane’s normal.": "평면의 법선.", "Write Π in Cartesian form.": "Π를 직교 방정식으로 쓰세요.", "For N, which line do you intersect with Π?": "N을 구하려면 어떤 직선과 Π의 교점을 구하나요?", "The line through A with direction **n**.": "A를 지나고 방향이 **n**인 직선.", "In c, A is on l. Draw the right-angled triangle formed by A, the intersection point P and the foot of the perpendicular.": "c에서 A는 l 위에 있어요. A, 교점 P, 수선의 발로 이루어진 직각삼각형을 그려 보세요.", "distance = AP sin θ.": "거리 = AP sin θ.", "Where is the reflection A′ relative to B?": "대칭점 A′는 B에 대해 어디에 있나요?", "B is the midpoint of AA′, so **a′** = 2**b** − **a**.": "B가 AA′의 중점이므로 **a′** = 2**b** − **a**.", "For d, what do you already know?": "d에서 이미 알고 있는 것은?", "A point on both planes (A) and the direction (the cross product from a).": "두 평면 위의 공통점 (A)과 방향 (a에서 구한 외적).", "Look for α, β with α(3, −5, 1) + β(1, 3, −4) = (7, −21, 11).": "α(3, −5, 1) + β(1, 3, −4) = (7, −21, 11)인 α, β를 찾으세요.", "x and y appear only as x − y. Let u = x − y.": "x와 y는 x − y 꼴로만 나와요. u = x − y로 놓으세요.", "Condition for l ∥ Π₃?": "l ∥ Π₃의 조건은?", "Use Π₁ to find c, then check Π₂.": "Π₁으로 c를 구하고, Π₂로 확인하세요.", "Volume of a tetrahedron?": "사면체의 부피는?", "⅓ × base area × perpendicular height.": "⅓ × 밑넓이 × 높이.", "Rewrite Π₂ with the same normal as Π₁.": "Π₂를 Π₁과 같은 법선으로 다시 쓰세요.", "Multiply by −3/2: 6x − 9y + 15z = −9/2.": "−3/2를 곱하세요: 6x − 9y + 15z = −9/2.", "A line parallel to both planes is perpendicular to both normals. Its direction?": "두 평면에 모두 평행한 직선은 두 법선에 모두 수직이에요. 그 방향은?", "When is the solution unique?": "해가 하나일 때는 언제인가요?", "When the determinant of the coefficient matrix is non-zero.": "계수행렬의 행렬식이 0이 아닐 때.", "If k makes the determinant zero, how do you decide between “line” and “no intersection”?": "k가 행렬식을 0으로 만들면 “직선”과 “교점 없음”을 어떻게 구별하나요?", "Express x + y + kz from Π₁ and Π₂ and compare it with c.": "Π₁과 Π₂로부터 x + y + kz를 구해서 c와 비교해요.", "Before solving a mixed problem, decide which vector tool the question is really asking for. Match each task to a method.": "혼합 문제를 풀기 전에 문제가 실제로 어떤 벡터 도구를 요구하는지 정하세요. 각 과제에 알맞은 방법을 연결해 보세요.", "“Show that A, B, C are collinear” / “Show that ABCD is a parallelogram”": "“A, B, C가 한 직선 위에 있음을 보여라” / “ABCD가 평행사변형임을 보여라”", "Compare displacement vectors: {AB} = k{BC};  {AB} = {DC}.": "변위벡터를 비교해요: {AB} = k{BC};  {AB} = {DC}.", "“Find the angle between …” (two lines / line & plane / two planes)": "“…사이의 각을 구하라” (두 직선 / 직선과 평면 / 두 평면)", "Dot product of directions; of direction and normal (then 90° − φ); of the two normals.": "방향벡터끼리의 내적; 방향과 법선의 내적 (그다음 90° − φ); 두 법선의 내적.", "“Find a vector perpendicular to both …” / “find the normal” / “find an area”": "“…에 모두 수직인 벡터를 구하라” / “법선을 구하라” / “넓이를 구하라”", "Vector product **a** × **b**; area = |**a** × **b**| (parallelogram) or ½|**a** × **b**| (triangle).": "벡터곱 **a** × **b**; 넓이 = |**a** × **b**| (평행사변형) 또는 ½|**a** × **b**| (삼각형).", "“Find the shortest distance from a point to a line / plane”": "“점에서 직선 / 평면까지의 최단 거리를 구하라”", "Line: foot F with {PF}•**d** = 0. Plane: line through P along **n**, intersect with plane — or |**p**•**n** − k|/|**n**|.": "직선: {PF}•**d** = 0인 수선의 발 F. 평면: P를 지나고 **n** 방향인 직선과 평면의 교점 — 또는 |**p**•**n** − k|/|**n**|.", "“Do the lines intersect?” / “How do the three planes meet?”": "“두 직선은 만나는가?” / “세 평면은 어떻게 만나는가?”", "Solve simultaneous equations; check the remaining equation; then check for parallel directions/normals.": "연립방정식을 풀고, 남은 식을 확인하고, 그다음 평행한 방향/법선이 있는지 확인해요.", "“Find the minimum distance” between moving objects": "움직이는 물체 사이의 “최소 거리를 구하라”", "Write d² as a quadratic in t and minimise (vertex).": "d²을 t에 대한 이차식으로 쓰고 최소화해요 (꼭짓점).", "Translate the geometry into a vector statement first (parallel ⇒ multiple, perpendicular ⇒ dot = 0, normal ⇒ cross product, on a line/plane ⇒ satisfies its equation); the algebra then follows.": "먼저 기하학적 상황을 벡터 문장으로 바꾸세요 (평행 ⇒ 실수배, 수직 ⇒ 내적 = 0, 법선 ⇒ 외적, 직선/평면 위에 있음 ⇒ 그 방정식을 만족). 그러면 계산은 따라와요.", "Route from M to D?": "M에서 D로 가는 경로는?", "Where is P? Write {AP}.": "P는 어디에 있나요? {AP}를 쓰세요.", "Above C by ½**b**: {AP} = **a** + (3/2)**b**.": "C보다 ½**b**만큼 위: {AP} = **a** + (3/2)**b**.", "Compute **a** × **b** carefully.": "**a** × **b**를 신중하게 계산하세요.", "Which double-angle identity appears?": "어떤 배각 공식이 나오나요?", "In parallelogram OABC, {OB} = ?": "평행사변형 OABC에서 {OB} = ?", "Which component controls height?": "어느 성분이 높이를 결정하나요?", "The **k**-component: height = 12t.": "**k** 성분: 높이 = 12t.", "For angle ADC, which vectors?": "각 ADC에는 어떤 벡터를 쓰나요?", "Note: the book reuses the letter B for (7, 3, k); call it C.": "참고: 책에서 (7, 3, k)에 문자 B를 다시 썼어요. C라고 부를게요.", "So d asks for AC with C(7, 3, k).": "그래서 d는 C(7, 3, k)일 때 AC를 묻는 거예요.", "Why does the cross product give the normal?": "외적이 왜 법선을 주나요?", "It is perpendicular to both direction vectors, which lie in the plane.": "평면 위에 있는 두 방향벡터에 모두 수직이기 때문이에요.", "Position vectors: **m** = ? ": "위치벡터: **m** = ?", "For c, compute {BT} = {BR} + {RT} and compare with {BM}.": "c에서 {BT} = {BR} + {RT}를 계산해서 {BM}과 비교하세요.", "Compute **a** × **b**.": "**a** × **b**를 계산하세요.", "Which component tells you the scalar?": "어느 성분이 스칼라를 알려주나요?", "The first or third: −5 = t, 15 = −3t ✓ ⇒ t = −5.": "첫 번째 또는 세 번째: −5 = t, 15 = −3t ✓ ⇒ t = −5.", "Rectangle condition?": "직사각형의 조건은?", "Parallelogram with {AB}•{AD} = 0.": "{AB}•{AD} = 0인 평행사변형.", "Expand keeping order; which terms vanish?": "순서를 유지하며 전개하세요. 어떤 항이 사라지나요?", "Two sides from (2, 1, 1)?": "(2, 1, 1)에서 나오는 두 변은?", "Parallel to [[1;1;2]] means…": "[[1;1;2]]와 평행하다는 것은…", "1st = 2nd component and 3rd = 2 × 2nd.": "첫째 성분 = 둘째 성분, 그리고 셋째 성분 = 2 × 둘째 성분.", "Use |**v**|² = **v**•**v**.": "|**v**|² = **v**•**v**를 이용하세요.", "Dot product of directions?": "방향벡터의 내적은?", "Same as Exercise 8G Q18 — can you do it without looking?": "Exercise 8G Q18과 같은 문제예요 — 보지 않고 풀 수 있나요?", "Try it!": "도전해 보세요!", "Set each fraction = λ.": "각 분수를 = λ로 놓으세요.", "Why is |AB| the distance between the lines?": "왜 |AB|가 두 직선 사이의 거리인가요?", "AB is perpendicular to both (they are parallel).": "AB가 두 직선 모두에 수직이기 때문이에요 (두 직선이 평행).", "In right-angled triangle ABC (right angle at C), AC = ?": "직각삼각형 ABC (C에서 직각)에서 AC = ?", "Direction of L₂? (careful with 2z − 1)": "L₂의 방향은? (2z − 1을 주의하세요)", "z = ½ + 2μ, so [[4;3;2]]; point (1, −2, ½).": "z = ½ + 2μ, 그래서 [[4;3;2]]; 점 (1, −2, ½).", "On the x-axis, y = z = 0. Do they occur at the same λ?": "x축 위에서는 y = z = 0이에요. 두 조건이 같은 λ에서 성립하나요?", "Distance from B to L: L meets Π at F and B is also in Π. What angle does BF make with L?": "B에서 L까지의 거리: L은 Π와 F에서 만나고 B도 Π 위에 있어요. BF는 L과 몇 도의 각을 이루나요?", "90° (L ⟂ Π), so the distance is BF.": "90° (L ⟂ Π), 그래서 거리는 BF예요.", "Line through the two points?": "두 점을 지나는 직선은?", "Complete the square for d².": "d²을 완전제곱식으로 바꾸세요.", "Intercepts?": "절편은?", "Why is **b** × **a** the direction of the line?": "왜 **b** × **a**가 직선의 방향인가요?", "It is perpendicular to both normals.": "두 법선에 모두 수직이기 때문이에요.", "If {AD} is perpendicular to the plane, what is it?": "{AD}가 평면에 수직이면 {AD}는 무엇인가요?", "A normal — and |{AD}| is D’s distance from Π.": "법선 — 그리고 |{AD}|는 D에서 Π까지의 거리예요.", "Parametrise the line with x = X.": "x = X로 놓고 직선을 매개변수로 나타내세요.", "Write Z with parameter μ and set {XY}•{YZ} = 0.": "Z를 매개변수 μ로 쓰고 {XY}•{YZ} = 0으로 놓으세요.", "Which compound-angle identity appears in **a**•**b**?": "**a**•**b**에는 어떤 덧셈정리가 나오나요?", "Unique point ⇔ ?": "한 점에서 만남 ⇔ ?", "Determinant ≠ 0.": "행렬식 ≠ 0.", "Coordinates of G?": "G의 좌표는?", "G is above C: (0, 2, 2).": "G는 C의 바로 위: (0, 2, 2).", "Which angle of triangle PQM is a right angle?": "삼각형 PQM에서 어느 각이 직각인가요?", "The angle at M.": "M에서의 각.", "PQ² as a quadratic?": "PQ²을 이차식으로 쓰면?", "Direction of the line? (careful with 2y + 2)": "직선의 방향은? (2y + 2를 주의하세요)", "Π₃ ⟂ Π₁ means **n₁** lies IN Π₃. So **n₃** ⟂ ?": "Π₃ ⟂ Π₁은 **n₁**이 Π₃ 안에 놓인다는 뜻이에요. 그러면 **n₃**는 무엇에 수직인가요?", "Both **d** and **n₁**: **n₃** = **d** × **n₁**.": "**d**와 **n₁** 모두: **n₃** = **d** × **n₁**.", "Both direction vectors have length 3. How long is PQ?": "두 방향벡터의 길이는 모두 3이에요. PQ의 길이는?", "μ = 3 ⇒ PQ = 9, so λ = ±3 for R.": "μ = 3 ⇒ PQ = 9, 그래서 R은 λ = ±3.", "Bisector direction of two equal-length vectors?": "길이가 같은 두 벡터의 각의 이등분선 방향은?", "Their sum.": "두 벡터의 합.", "Same as Exercise 8D Q41. Where is Q relative to C?": "Exercise 8D Q41과 같은 문제예요. Q는 C에 대해 어디에 있나요?", "C is the midpoint of PQ.": "C가 PQ의 중점이에요.", "Angle between **a** × **b** (normal to BCD) and **c**?": "**a** × **b** (BCD의 법선)와 **c** 사이의 각은?", "θ (or 180° − θ), since AE is along the normal.": "θ (또는 180° − θ), AE가 법선 방향이기 때문이에요.", "Normal of Π?": "Π의 법선은?", "**d₁** × **d₂** = [[9;−6;3]] ∝ [[3;−2;1]] — also the direction of PQ.": "**d₁** × **d₂** = [[9;−6;3]] ∝ [[3;−2;1]] — PQ의 방향이기도 해요.", "Distance from Q to Π using the triangle?": "삼각형을 이용한 Q에서 Π까지의 거리는?", "Compare (1) + (3) with 2 × (2).": "(1) + (3)과 2 × (2)를 비교하세요.", "The left-hand sides are equal for every a.": "모든 a에 대해 좌변이 같아요.", "Substitute **r** = **p** + λ**n** into **r**•**n** = k.": "**r** = **p** + λ**n**을 **r**•**n** = k에 대입하세요.", "Shortest path from B to S₁’s route?": "B에서 S₁의 경로까지의 최단 경로는?", "The perpendicular from B to the line **r** = t[[1;2]].": "B에서 직선 **r** = t[[1;2]]에 내린 수선.", "Speeds?": "속력은?", "For b i, start from ½|{AB} × {AC}| and expand (**b** − **a**) × (**c** − **a**).": "b i에서는 ½|{AB} × {AC}|에서 시작해서 (**b** − **a**) × (**c** − **a**)를 전개하세요."};


function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* light markup:  [[1;2;3]] column vector · {AB} arrow-over · **a** bold vector · \n line break */
function fmt(s) {
  if (s === undefined || s === null) return '';
  let h = escHtml(s);
  h = h.replace(/\[\[(.+?)\]\]/g, (m, inner) =>
    '<span class="cv">' + inner.split(';').map(x => `<span>${x.trim()}</span>`).join('') + '</span>');
  h = h.replace(/\{([A-Za-z0-9′'₀-₉]{1,4})\}/g, '<span class="ov">$1</span>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<b class="bv">$1</b>');
  h = h.replace(/\n/g, '<br>');
  h = h.replace(/(^|<br>| {3,})([a-f](?: (?:i{1,3}|iv))?|i{1,3}|iv)  (?=\S)/g, (m, pre, lab) => (pre === '' || pre === '<br>' ? pre : '&nbsp;&nbsp;&nbsp;&nbsp;') + `<b class="pl">${lab}</b>&nbsp;&nbsp;`);
  h = h.replace(/ {2,}/g, m => '&nbsp;'.repeat(m.length));
  return h;
}
function ko(s) { return (typeof KO !== 'undefined' && s && KO[s]) ? `<div class="ko">${fmt(KO[s])}</div>` : ''; }
function figHtml(sl) { return sl.fig ? `<div class="fig-wrap">${sl.fig}</div>` : ''; }

let GID = 0;
function guideHtml(list, title) {
  if (!list || !list.length) return '';
  const gid = 'g' + (GID++);
  const items = list.map((g, i) => `
    <li><span class="gq-num">G${i+1}</span>
      <div class="gq-body">
        <div class="gq">${fmt(g.q)}${ko(g.q)}</div>
        <button class="gq-btn" onclick="toggleGA(this)">reveal ▾</button>
        <div class="ga">${fmt(g.a)}${ko(g.a)}</div>
      </div></li>`).join('');
  return `
  <div class="guide-box" id="${gid}">
    <div class="guide-title"><span>🧭 ${title || 'Guiding Questions'}</span>
      <button class="guide-all" onclick="toggleAllGA('${gid}', this)">reveal all</button></div>
    <ol class="guide-list">${items}</ol>
  </div>`;
}

function renderSlide(sl) {
  switch (sl.type) {
    case 'title':    return renderTitle(sl);
    case 'divider':  return renderDivider(sl);
    case 'keypoint': return renderKeypoint(sl);
    case 'example':  return renderExample(sl);
    case 'examiner': return renderExaminer(sl);
    case 'qa':       return renderQA(sl);
    case 'guided':   return renderGuided(sl);
    case 'summary':  return renderSummary(sl);
    default: return '';
  }
}

function renderTitle(sl) {
  const goals = sl.goals.map(g => `<li><span>${fmt(g)}</span></li>`).join('');
  return `
  <div class="slide s-title" id="${sl.id}" data-slide>
    <div class="chapter-badge">8</div>
    <h1>Geometry &amp; Trigonometry: Vectors</h1>
    <p class="subtitle">8A&ndash;8H &nbsp;·&nbsp; Vectors, Lines, Planes, Scalar &amp; Vector Products</p>
    <ul class="learning-goals">${goals}</ul>
  </div>`;
}

function renderDivider(sl) {
  return `
  <div class="slide s-divider" id="${sl.id}" data-slide data-symbol="${sl.symbol}">
    <div class="divider-num">${sl.bigNum}</div>
    <div>
      <h2>${escHtml(sl.heading)}</h2>
      <p>${escHtml(sl.sub)}</p>
    </div>
  </div>`;
}

function renderKeypoint(sl) {
  const notes = sl.notes.map(n => `<li><span>${fmt(n)}</span></li>`).join('');
  const altHtml = sl.formulaAlt ? `<div class="formula-alt">${fmt(sl.formulaAlt)}</div>` : '';
  return `
  <div class="slide s-keypoint" id="${sl.id}" data-slide>
    <div class="kp-header">
      <span class="kp-badge">${escHtml(sl.badge)}</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="kp-body">
      <div class="formula-box">
        <div class="formula">${fmt(sl.formula)}</div>
        ${altHtml}
      </div>
      ${figHtml(sl)}
      <ul class="note-list">${notes}</ul>
    </div>
  </div>`;
}

function renderExample(sl) {
  const hints = sl.hints.map((h, i) => `
    <li><span class="hint-num">${i+1}</span><span>${fmt(h)}</span></li>`).join('');
  const uid = sl.id + '-sol';
  return `
  <div class="slide s-example" id="${sl.id}" data-slide>
    <div class="ex-header">
      <span class="ex-badge">${escHtml(sl.badge)}</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="ex-body">
      <div class="question-box">
        <div class="q-label">Question</div>
        <div class="q-text">${fmt(sl.question)}</div>
        ${figHtml(sl)}
      </div>
      ${guideHtml(sl.guide)}
      <div class="qa-solution">
        <button class="qa-sol-toggle" onclick="toggleSol('${uid}')" id="${uid}-btn">
          <span>▶ Show Worked Solution</span>
          <span class="qa-sol-arrow">▼</span>
        </button>
        <div class="qa-sol-body" id="${uid}">
          <div class="qa-sol-inner hints-section">
            <h4>Hints / Strategy</h4>
            <ul class="hint-list">${hints}</ul>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderExaminer(sl) {
  const sols = sl.solutions.map(s => `
    <div class="sol-card ${s.style}">
      <div class="sol-card-header">${escHtml(s.label)}</div>
      <div class="sol-card-body">${fmt(s.lines)}</div>
    </div>`).join('');
  const uid = sl.id + '-sol';
  return `
  <div class="slide s-examiner" id="${sl.id}" data-slide>
    <div class="examiner-header">
      <span class="ex-badge-purple">Be the Examiner</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="examiner-body">
      <div class="challenge-box">
        <div class="q-text">${fmt(sl.question)}</div>
      </div>
      <div class="solutions-grid">${sols}</div>
      <div style="margin-top:1rem">${guideHtml(sl.guide, 'Examiner Questions')}</div>
      <div class="qa-solution">
        <button class="qa-sol-toggle" onclick="toggleSol('${uid}')" id="${uid}-btn">
          <span>▶ Show Verdict</span><span class="qa-sol-arrow">▼</span>
        </button>
        <div class="qa-sol-body" id="${uid}">
          <div class="qa-sol-inner"><p class="examiner-note" style="margin-top:0">${fmt(sl.note)}</p></div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderQA(sl) {
  const steps = sl.steps.map(s => `
    <div class="sol-step">
      <span class="step-badge">${escHtml(s.label)}</span>
      <span class="step-content">${fmt(s.text)}</span>
    </div>`).join('');
  const uid = sl.id + '-sol';
  const hint = sl.hint ? `<div class="qa-hint">${fmt(sl.hint)}</div>` : '';
  return `
  <div class="slide s-qa" id="${sl.id}" data-slide>
    <div class="qa-header">
      <span class="qa-qnum">${escHtml(sl.qnum)}</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="qa-body">
      <div class="qa-question">
        <div class="qa-qlabel">Question</div>
        <div class="qa-qtext">${fmt(sl.question)}</div>
        ${figHtml(sl)}
      </div>
      ${guideHtml(sl.guide)}
      ${hint}
      <div class="qa-solution">
        <button class="qa-sol-toggle" onclick="toggleSol('${uid}')" id="${uid}-btn">
          <span>▶ Show Solution</span>
          <span class="qa-sol-arrow">▼</span>
        </button>
        <div class="qa-sol-body" id="${uid}">
          <div class="qa-sol-inner">
            <div class="sol-steps">${steps}</div>
            <div class="sol-answer">${fmt(sl.answer)}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderGuided(sl) {
  const steps = sl.prompts.map((p, i) => `
    <li><span class="gd-n">${i+1}</span>
      <div class="gq-body">
        <div class="gq">${fmt(p.q)}${ko(p.q)}</div>
        <button class="gq-btn" onclick="toggleGA(this)">reveal ▾</button>
        <div class="ga">${fmt(p.a)}${ko(p.a)}</div>
      </div></li>`).join('');
  const uid = sl.id + '-take';
  return `
  <div class="slide s-guided" id="${sl.id}" data-slide>
    <div class="gd-header">
      <span class="gd-badge">${escHtml(sl.badge || 'Guided Inquiry')}</span>
      <h3>${escHtml(sl.heading)}</h3>
    </div>
    <div class="gd-body">
      <div class="gd-intro"><div class="q-label">Investigate</div>${fmt(sl.intro)}${ko(sl.intro)}${figHtml(sl)}</div>
      <ol class="gd-steps">${steps}</ol>
      <div class="gd-take">
        <button class="gd-take-btn" onclick="document.getElementById('${uid}').classList.toggle('open')">★ Big Idea — click when the class has discussed</button>
        <div class="gd-take-body" id="${uid}">${fmt(sl.takeaway)}${ko(sl.takeaway)}</div>
      </div>
    </div>
  </div>`;
}

function renderSummary() {
  const rows = SUMMARY_ROWS.map(r => `<tr>${r.map(x => `<td>${fmt(x)}</td>`).join('')}</tr>`).join('');
  return `
  <div class="slide s-summary" id="summary" data-slide>
    <h3>Chapter 8 — Vectors Summary</h3>
    <table class="summary-table">
      <thead><tr><th>Idea</th><th>Result</th><th>When to Use</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="summary-note">${fmt(SUMMARY_NOTE)}</p>
  </div>`;
}

/* ── Toggles ───────────────────────────────── */
function toggleSol(uid) {
  const body = document.getElementById(uid);
  const btn  = document.getElementById(uid + '-btn');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  body.style.maxHeight = isOpen ? '0px' : body.scrollHeight + 40 + 'px';
  btn.classList.toggle('open', !isOpen);
  const lbl = btn.querySelector('span:first-child');
  lbl.textContent = lbl.textContent.replace(isOpen ? '▼ Hide' : '▶ Show', isOpen ? '▶ Show' : '▼ Hide');
}
function toggleGA(btn) {
  const a = btn.nextElementSibling;
  const open = a.classList.toggle('open');
  btn.textContent = open ? 'hide ▴' : 'reveal ▾';
  refreshOpenSol(btn);
}
function toggleAllGA(gid, btn) {
  const box = document.getElementById(gid);
  const show = btn.textContent === 'reveal all';
  box.querySelectorAll('.ga').forEach(a => a.classList.toggle('open', show));
  box.querySelectorAll('.gq-btn').forEach(b => b.textContent = show ? 'hide ▴' : 'reveal ▾');
  btn.textContent = show ? 'hide all' : 'reveal all';
}
function refreshOpenSol(el) {
  const body = el.closest('.qa-sol-body');
  if (body && body.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 40 + 'px';
}
function setAll(open) {
  document.querySelectorAll('.qa-sol-body').forEach(b => {
    b.classList.toggle('open', open);
    b.style.maxHeight = open ? b.scrollHeight + 40 + 'px' : '0px';
  });
  document.querySelectorAll('.qa-sol-toggle').forEach(btn => {
    btn.classList.toggle('open', open);
    const l = btn.querySelector('span:first-child');
    l.textContent = open ? l.textContent.replace('▶ Show', '▼ Hide') : l.textContent.replace('▼ Hide', '▶ Show');
  });
}

/* ── Build DOM ─────────────────────────────── */
const stream = document.getElementById('slideStream');
const navPills = document.getElementById('navPills');

SLIDES.forEach((sl, i) => {
  stream.insertAdjacentHTML('beforeend', renderSlide(sl));
  if (sl.navLabel && sl.navLabel !== '─') {
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${sl.id}" data-nav="${i}">${sl.navLabel}</a>`;
    navPills.appendChild(li);
  }
});

const allSlides = document.querySelectorAll('[data-slide]');
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.04 });
allSlides.forEach(s => obs.observe(s));

const fill    = document.getElementById('progressFill');
const counter = document.getElementById('slideCounter');
const navAs   = navPills.querySelectorAll('a');

function updateProgress() {
  const scrolled = window.scrollY;
  const total    = document.body.scrollHeight - window.innerHeight;
  fill.style.width = (total > 0 ? (scrolled / total) * 100 : 0) + '%';
  let active = 0;
  allSlides.forEach((s, i) => { if (s.getBoundingClientRect().top < window.innerHeight * 0.5) active = i; });
  counter.textContent = `${active + 1} / ${allSlides.length}`;
  let navActive = null;
  navAs.forEach(a => { if (parseInt(a.dataset.nav) <= active) navActive = a; });
  navAs.forEach(a => a.classList.toggle('active', a === navActive));
}
window.addEventListener('scroll', updateProgress, { passive: true });
updateProgress();

</script>
