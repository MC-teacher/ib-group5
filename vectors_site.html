{ type:'qa', id:'d13', navLabel:'D13', qnum:'Q 13', heading:'Cartesian equation in 3D',
  question:"a  **r** = [[1;7;2]] + λ[[−1;1;2]]     b  **r** = [[3;−1;0]] + λ[[2;−4;5]]",
  guide:[{q:"Pattern?", a:"(x − a₁)/d₁ = (y − a₂)/d₂ = (z − a₃)/d₃."}],

{ type:'qa', id:'d14', navLabel:'D14', qnum:'Q 14', heading:'Cartesian equation with fractions',

  answer:"a  (2x − 1)/4 = (y + 2)/3 = (4 − 3z)/6     b  2/3 − x = y − 2 = (2z + 1)/6" },
{ type:'qa', id:'d15', navLabel:'D15', qnum:'Q 15', heading:'Cartesian equation with fractional directions',

{ type:'qa', id:'d16', navLabel:'D16', qnum:'Q 16', heading:'Zero x-component in the direction',

{ type:'qa', id:'d23', navLabel:'D23', qnum:'Q 23', heading:'Acute angle between lines',

  question:"a  **r** = (**i** + 3**j** − **k**) + λ(−**i** + 2**j** + 2**k**) and **r** = (**i** − 2**j** − **k**) + μ(2**i** − 4**j** − 4**k**)\nb  **r** = [[−1;2;0]] + λ[[−3;1;2]] and **r** = [[0;1;0]] + μ[[1.5;−0.5;−1]]",
  guide:[{q:"Are the directions multiples?", a:"a (2, −4, −4) = −2(−1, 2, 2) ✓;  b (1.5, −0.5, −1) = −½(−3, 1, 2) ✓."},{q:"Then test a point of the first line on the second line.", a:"Solve **a** = **b** + μ**e** and see if one μ works."}],
  steps:[{label:'a', text:"(1, 3, −1) on line 2? x: 1 = 1 + 2μ ⇒ μ = 0; y: 3 = −2 ✗ ⇒ distinct parallel lines"},{label:'b', text:"(−1, 2, 0) on line 2? x: μ = −2/3; y: 1 + 1/3 = 4/3 ≠ 2 ✗ ⇒ distinct parallel lines"}],
  answer:"a  parallel     b  parallel" },
{ type:'qa', id:'e7', navLabel:'E7', qnum:'Q 7', heading:'Same, parallel or not parallel?',
  question:"a  **r** = [[0;0;1]] + λ[[2;−1;3]] and **r** = [[2;−1;3]] + μ[[0;0;1]]\nb  **r** = (4**i** + **j** + 2**k**) + λ(−**i** + 2**j** + 2**k**) and **r** = (−**i** + 2**j** + 2**k**) + μ(4**i** + **j** + 2**k**)",
  guide:[{q:"Watch out — the point of one line is the direction of the other! Are the directions parallel?", a:"No, so the lines are non-parallel (in fact they intersect)."}],
  steps:[{label:'a', text:"Directions not multiples ⇒ not parallel. (λ = μ = 1 gives the common point (2, −1, 4).)"},{label:'b', text:"Directions not multiples ⇒ not parallel. (λ = μ = 1 gives the common point (3, 3, 4).)"}],
  answer:"a  non-parallel (intersect at (2, −1, 4))     b  non-parallel (intersect at (3, 3, 4))" },
{ type:'qa', id:'e8', navLabel:'E8', qnum:'Q 8', heading:'Same, parallel or not parallel?',
  question:"a  **r** = (−**i** + 3**k**) + λ(2**i** − **j**) and **r** = (−3**i** + **j** + 3**k**) + μ(0.5**j** − **i**)\nb  **r** = (3**j** + **k**) + λ(**i** − 2**j** + **k**) and **r** = (−**i** + 5**j**) + μ(−2**i** + 4**j** − 2**k**)",
  guide:[{q:"In a, write 0.5**j** − **i** as a column vector.", a:"[[−1;0.5;0]] = −½[[2;−1;0]] — parallel."}],
  steps:[{label:'a', text:"(−1, 0, 3) on line 2? x: −1 = −3 − μ ⇒ μ = −2; y: 1 − 1 = 0 ✓; z: 3 = 3 ✓ ⇒ same line"},{label:'b', text:"Directions: (−2, 4, −2) = −2(1, −2, 1). (0, 3, 1) on line 2? x: μ = −½; y: 5 − 2 = 3 ✓; z: 0 + 1 = 1 ✓ ⇒ same line"}],

{ type:'qa', id:'e9', navLabel:'E9', qnum:'Q 9', heading:'Intersection of AB and CD',
  question:"A(1, 0, 0), B(6, 5, 5), C(8, 3, 3), D(6, 3, 3). Find the point of intersection of lines AB and CD.",
  guide:[{q:"Write both lines.", a:"AB: [[1;0;0]] + λ[[5;5;5]];  CD: [[8;3;3]] + μ[[−2;0;0]]."}],
  steps:[{label:'y', text:"5λ = 3 ⇒ λ = 3/5 (z gives the same ✓)"},{label:'x', text:"1 + 3 = 8 − 2μ ⇒ μ = 2"}],
  answer:"(4, 3, 3)" },
{ type:'qa', id:'e10', navLabel:'E10', qnum:'Q 10', heading:'Intersect, parallel or skew?',
  question:"l₁: x = −3 − λ, y = 5 − 2λ, z = 2 − 4λ;   l₂: x = 8 − μ, y = 5 − 3μ, z = 1 + 3μ",

  steps:[{label:'x, y', text:"−3 − λ = 8 − μ, 5 − 2λ = 5 − 3μ ⇒ λ = 1.5μ ⇒ −3 − 1.5μ = 8 − μ ⇒ μ = −22, λ = −33"},{label:'z', text:"2 − 4(−33) = 134 but 1 + 3(−22) = −65 ✗"}],

{ type:'qa', id:'e11', navLabel:'E11', qnum:'Q 11', heading:'Cartesian lines — intersection',
  question:"(x − 7)/2 = (y − 1)/2 = z − 5 and (4 − x)/3 = y + 6 = (z + 3)/5.\na  For each line, express x and y in terms of z.    b  Hence show that the lines intersect and find the point.",
  guide:[{q:"From z − 5 = (x − 7)/2, what is x?", a:"x = 2z − 3."}],
  steps:[{label:'a line 1', text:"x = 2z − 3,  y = 2z − 9"},{label:'a line 2', text:"x = 4 − 3(z + 3)/5 = (11 − 3z)/5,  y = (z + 3)/5 − 6 = (z − 27)/5"},{label:'b', text:"2z − 3 = (11 − 3z)/5 ⇒ 13z = 26 ⇒ z = 2; then y: 2(2) − 9 = −5 and (2 − 27)/5 = −5 ✓"}],

{ type:'qa', id:'e12', navLabel:'E12', qnum:'Q 12', heading:'Show lines intersect',
  question:"**r** = [[1;0;5]] + λ[[−1;1;2]] and **r** = [[7;2;7]] + μ[[2;2;3]]. Show that they intersect and find the point.",
  guide:[{q:"Add the x- and y-equations: what happens to λ?", a:"It cancels: 1 = 9 + 4μ."}],
  steps:[{label:'x + y', text:"(1 − λ) + λ = (7 + 2μ) + (2 + 2μ) ⇒ μ = −2"},{label:'y', text:"λ = 2 + 2(−2) = −2"},{label:'Check z', text:"5 + 2(−2) = 1 and 7 + 3(−2) = 1 ✓"}],

{ type:'qa', id:'e13', navLabel:'E13', qnum:'Q 13', heading:'Same line in different forms',
  question:"a  Show that **r** = [[−1;1;2]] + λ[[2;2;1]] and (x − 5)/6 = (y − 7)/6 = (z − 5)/3 represent the same line.\nb  Show that **r** = (4t − 5)**i** + (4t − 3)**j** + (1 + 2t)**k** represents a different line.",
  guide:[{q:"Direction of the Cartesian line?", a:"(6, 6, 3) = 3(2, 2, 1)."}],
  steps:[{label:'a', text:"Same direction. Is (5, 7, 5) on the first line? λ = 3 gives (5, 7, 5) ✓ ⇒ same line"},{label:'b', text:"Direction (4, 4, 2) = 2(2, 2, 1): parallel. Point (−5, −3, 1) on the first line? x: λ = −2 gives (−5, −3, 0) ≠ (−5, −3, 1) ✗ ⇒ a different (parallel) line"}],

{ type:'qa', id:'e14', navLabel:'E14', qnum:'Q 14', heading:'Meeting the coordinate axes',
  question:"(x − 6)/2 = (y + 1)/7 = (z + 9)/(−3).\na  Find where the line intersects the y-axis.    b  Show that the line does not intersect the z-axis.",
  guide:[{q:"Points on the y-axis have which coordinates equal to 0?", a:"x = 0 and z = 0."}],
  steps:[{label:'a', text:"Parametric: x = 6 + 2t, y = −1 + 7t, z = −9 − 3t. x = 0 ⇒ t = −3 ⇒ z = 0 ✓, y = −22"},{label:'b', text:"z-axis needs x = 0 (t = −3) and y = 0 (t = 1/7) — impossible simultaneously"}],

{ type:'qa', id:'e15', navLabel:'E15', qnum:'Q 15', heading:'Three concurrent lines',
  question:"a  Find the intersection of (x − 2)/3 = (y + 1)/4 = (z + 1)/1 and 5 − x = (y + 2)/(−3) = (z − 7)/2.\nb  Show that **r** = [[7;8;−1]] + λ[[1;−1;2]] passes through that point.",

  steps:[{label:'a', text:"2 + 3λ = 5 − μ and −1 + 4λ = −2 − 3μ ⇒ λ = 2, μ = −3; z: 1 = 1 ✓ ⇒ (8, 7, 1)"},{label:'b', text:"λ = 1: (8, 7, 1) ✓"}],

{ type:'qa', id:'e16', navLabel:'E16', qnum:'Q 16', heading:'Unknown in a direction',
  question:"Find p for which **r** = (**j** − **k**) + μ(**i** + 2**j** + **k**) and **r** = (**i** + 7**j** − 4**k**) + λ(**i** + p**k**) intersect, and find the point.",

  steps:[{label:'x, y', text:"μ = 1 + λ, 1 + 2μ = 7 ⇒ μ = 3, λ = 2"},{label:'z', text:"−1 + 3 = −4 + 2p ⇒ p = 3"}],

{ type:'qa', id:'e17', navLabel:'E17', qnum:'Q 17', heading:'Do the helicopters collide?',
  question:"**r₁** = [[1;0;3]] + t[[1;−1;2]], **r₂** = [[1;−1;4]] + t[[2;−1;3]].\na  Show that the paths cross.    b  Determine whether the helicopters collide.",
  guide:[{q:"For crossing paths, should you use the same parameter for both?", a:"No — use different parameters (t and s): paths can cross at different times."},{q:"For a collision, what extra condition is needed?", a:"Same point at the SAME time t."}],
  steps:[{label:'a', text:"1 + t = 1 + 2s, −t = −1 − s ⇒ t = 2, s = 1; z: 3 + 4 = 7 = 4 + 3 ✓ ⇒ paths cross at (3, −2, 7)"},{label:'b', text:"Helicopter 1 is there at t = 2 s, helicopter 2 at t = 1 s"}],

{ type:'qa', id:'e18', navLabel:'E18', qnum:'Q 18', heading:'Do the particles meet?',
  question:"**r₁** = (1 + 2t)**i** + (t − 3)**j** + (3 + 7t)**k**, **r₂** = (9 − 2t)**i** + (t − 2)**j** + (22 + 2t)**k**.\na  Find the speed of each particle.    b  Determine whether they meet.",
  guide:[{q:"Velocities?", a:"(2, 1, 7) and (−2, 1, 2)."}],
  steps:[{label:'a', text:"|(2, 1, 7)| = √54 = 3√6 ≈ 7.35;  |(−2, 1, 2)| = 3"},{label:'b', text:"y-components: t − 3 = t − 2 is never true"}],
  answer:"a  3√6 and 3     b  they never meet" },
{ type:'qa', id:'e19', navLabel:'E19', qnum:'Q 19', heading:'One fly vertically above the other',
  question:"**r₁** = (0.7**j** + 3**k**) + t(1.2**i** + 0.8**j** − 0.1**k**), **r₂** = (7.7**i** + **k**) + t(−**i** + **j** + 0.3**k**).\na  Show that there is a time when one fly is vertically above the other.    b  Find the distance between them then.",
  guide:[{q:"“Vertically above” means which components agree?", a:"The **i**- and **j**-components (same time t)."}],
  steps:[{label:'i', text:"1.2t = 7.7 − t ⇒ t = 3.5"},{label:'j', text:"0.7 + 0.8(3.5) = 3.5 = 3.5 ✓"},{label:'b', text:"k: 3 − 0.35 = 2.65 and 1 + 1.05 = 2.05"}],

{ type:'qa', id:'e20', navLabel:'E20', qnum:'Q 20', heading:'Submarine meets boat',
  question:"Boat: velocity 64**i** km h⁻¹, starts at the origin. Submarine starts at (0, 0.5, −0.02) and moves with constant velocity in the direction (40**i** − 25**j** + c**k**). Given the submarine reaches the boat,\na  find c    b  find the speed of the submarine.",
  guide:[{q:"Write the submarine velocity as s(40, −25, c). Where is the boat at time T?", a:"(64T, 0, 0)."}],
  steps:[{label:'Equations', text:"40sT = 64T ⇒ s = 1.6;  0.5 − 25sT = 0 ⇒ T = 0.0125 h;  −0.02 + scT = 0 ⇒ c = 1"},{label:'Speed', text:"1.6 × √(1600 + 625 + 1) = 1.6√2226"}],
  answer:"a  c = 1     b  ≈ 75.5 km h⁻¹" },
{ type:'qa', id:'e21', navLabel:'E21', qnum:'Q 21', heading:'Shortest distance between skew lines',
  question:"l₁: **r** = (**i** − 10**j** + 12**k**) + λ(**i** + 3**j** − 4**k**), l₂: **r** = (4**i** + **j** + 5**k**) + μ(**i** + 2**k**). P on l₁, Q on l₂, {PQ} ⟂ both lines.\na  Show that 26λ + 7μ = 64 and find another equation.    b  Hence find the shortest distance between the lines.",
  guide:[{q:"Write {PQ} in terms of λ and μ.", a:"[[3+μ−λ;11−3λ;−7+2μ+4λ]]."},{q:"Two perpendicularity conditions?", a:"{PQ}•[[1;3;−4]] = 0 and {PQ}•[[1;0;2]] = 0."}],
  steps:[{label:'Dot 1', text:"(3 + μ − λ) + 3(11 − 3λ) − 4(−7 + 2μ + 4λ) = 64 − 26λ − 7μ = 0"},{label:'Dot 2', text:"(3 + μ − λ) + 2(−7 + 2μ + 4λ) = 7λ + 5μ − 11 = 0"},{label:'Solve', text:"λ = 3, μ = −2 ⇒ {PQ} = [[−2;2;1]]"}],
  answer:"a  7λ + 5μ = 11     b  shortest distance = 3" }

    {q:"Eliminate x and express x and y in terms of z.", a:"2×(1st) − (2nd): −7y − z = 0 ⇒ y = −z/7; then x = 3y − 2z = −17z/7."},

{ type:'keypoint', id:'kp825', navLabel:'KP 8.25', badge:'Key Point 8.25', heading:'Key Point 8.25 — Component Formula',

{ type:'example', id:'we833', navLabel:'WE 8.33', badge:'Worked Example 8.33', heading:'Worked Example 8.33 — Computing a × b',

{ type:'examiner', id:'bte83', navLabel:'BtE 8.3', heading:'Be the Examiner 8.3',
  question:"Find [[2;5;−2]] × [[1;3;4]]. Which is the correct solution? Identify the errors in the incorrect solutions.",
  solutions:[

    {label:'Solution 2', style:'sol-red', lines:"[[20 − 6;8 − 2;6 − 5]] = [[14;6;1]]"},
    {label:'Solution 3', style:'sol-green', lines:"[[20 + 6;−(8 + 2);6 − 5]] = [[26;−10;1]]"}],
  guide:[{q:"Write the first component carefully: a₂b₃ − a₃b₂ = ?", a:"(5)(4) − (−2)(3) = 20 + 6 = 26."},{q:"How can you test each answer without recomputing?", a:"Dot it with [[2;5;−2]]: only the correct one gives 0 (52 − 50 − 2 = 0)."}],

{ type:'keypoint', id:'kp826', navLabel:'KP 8.26', badge:'Key Point 8.26', heading:'Key Point 8.26 — Algebraic Properties',
  formula:"**a** × **b** = −**b** × **a**",

{ type:'keypoint', id:'kp827', navLabel:'KP 8.27', badge:'Key Point 8.27', heading:'Key Point 8.27 — Parallel and Perpendicular',

{ type:'example', id:'we834', navLabel:'WE 8.34', badge:'Worked Example 8.34', heading:'Worked Example 8.34 — Expanding Vector Products',

{ type:'example', id:'we835', navLabel:'WE 8.35', badge:'Worked Example 8.35', heading:'Worked Example 8.35 — Area of a Triangle in 3D',

{ type:'qa', id:'g1', navLabel:'G1', qnum:'Q 1', heading:'Vector equation; is B in the plane?',
  question:"a  A(3, 4, −2), **d₁** = [[−2;5;5]], **d₂** = [[1;−2;2]], B(3, 4, −2)\nb  A(4, −1, 2), **d₁** = [[−3;1;1]], **d₂** = [[3;−1;0]], B(−2, 1, 3)",
  guide:[{q:"In part a, compare B with A.", a:"They are the same point!"}],
  steps:[{label:'a', text:"**r** = [[3;4;−2]] + λ[[−2;5;5]] + μ[[1;−2;2]]; B = A (λ = μ = 0) ⇒ B lies in the plane"},{label:'b', text:"**r** = [[4;−1;2]] + λ[[−3;1;1]] + μ[[3;−1;0]]. z: 2 + λ = 3 ⇒ λ = 1; x: 1 + 3μ = −2 ⇒ μ = −1; y: −1 + 1 + 1 = 1 ✓ ⇒ B lies in the plane"}],
  answer:"a  yes     b  yes" },
{ type:'qa', id:'g2', navLabel:'G2', qnum:'Q 2', heading:'Vector equation; is B in the plane?',
  question:"a  **d₁** = [[−1;5;2]], **d₂** = [[1;−2;3]], A(1, 0, 2), B(1, 1, 7)\nb  **d₁** = [[0;4;−1]], **d₂** = [[5;3;0]], A(0, 2, 0), B(0, 6, 1)",
  guide:[{q:"Alternative test: compute **n** = **d₁** × **d₂** and compare **n**•**a** with **n**•**b**.", a:"a **n** = [[19;5;−3]]: 13 vs 3;  b **n** = [[3;−5;−20]]: −10 vs −50."}],
  steps:[{label:'a', text:"**r** = [[1;0;2]] + λ[[−1;5;2]] + μ[[1;−2;3]]. x: μ = λ; y: 3λ = 1 ⇒ λ = ⅓; z: 2 + 5/3 ≠ 7 ⇒ B not in plane"},{label:'b', text:"**r** = [[0;2;0]] + λ[[0;4;−1]] + μ[[5;3;0]]. x: μ = 0; z: λ = −1; y: 2 − 4 = −2 ≠ 6 ⇒ B not in plane"}],
  answer:"a  no     b  no" },
{ type:'qa', id:'g3', navLabel:'G3', qnum:'Q 3', heading:'Vector equation; is B in the plane?',
  question:"a  A(0, 1, 1), B(1, 1, 2), **d₁** = 3**i** + **j** − 3**k**, **d₂** = **i** − 3**j**\nb  A(1, −6, 2), B(0, −3, 1), **d₁** = 5**i** − 6**j**, **d₂** = −**i** + 3**j** − **k**",
  guide:[{q:"Fill in zeros: **d₂** = [[1;−3;0]] in a, **d₁** = [[5;−6;0]] in b."}],
  steps:[{label:'a', text:"**r** = [[0;1;1]] + λ[[3;1;−3]] + μ[[1;−3;0]]. z: 1 − 3λ = 2 ⇒ λ = −⅓; x: −1 + μ = 1 ⇒ μ = 2; y: 1 − ⅓ − 6 ≠ 1 ⇒ no"},{label:'b', text:"**r** = [[1;−6;2]] + λ[[5;−6;0]] + μ[[−1;3;−1]]. z: μ = 1; x: 1 + 5λ − 1 = 0 ⇒ λ = 0; y: −6 + 3 = −3 ✓ ⇒ yes"}],
  answer:"a  no     b  yes" },
{ type:'qa', id:'g4', navLabel:'G4', qnum:'Q 4', heading:'Normal + point → equation',
  question:"Find the equation of the plane i in scalar product form, ii in Cartesian form.\na  **n** = [[3;−5;2]], A(3, 3, 1)     b  **n** = [[6;−1;2]], A(4, 3, −1)",
  guide:[{q:"Compute **a**•**n**.", a:"a 9 − 15 + 2 = −4;  b 24 − 3 − 2 = 19."}],
  steps:[{label:'a', text:"i **r**•[[3;−5;2]] = −4    ii 3x − 5y + 2z = −4"},{label:'b', text:"i **r**•[[6;−1;2]] = 19    ii 6x − y + 2z = 19"}],
  answer:"a  3x − 5y + 2z = −4     b  6x − y + 2z = 19" },
{ type:'qa', id:'g5', navLabel:'G5', qnum:'Q 5', heading:'Normal + point → equation',
  question:"a  **n** = 3**i** − 2**j** + 5**k**, A(4, 1, −1)     b  **n** = 4**i** + **j** − 2**k**, A(1, −2, 2)",
  guide:[{q:"**a**•**n**?", a:"a 12 − 2 − 5 = 5;  b 4 − 2 − 4 = −2."}],
  steps:[{label:'a', text:"i **r**•(3**i** − 2**j** + 5**k**) = 5    ii 3x − 2y + 5z = 5"},{label:'b', text:"i **r**•(4**i** + **j** − 2**k**) = −2    ii 4x + y − 2z = −2"}],

{ type:'qa', id:'g6', navLabel:'G6', qnum:'Q 6', heading:'Normal + point → equation',
  question:"a  **n** = [[3;−1;0]], A(−3, 0, 2)     b  **n** = [[4;0;−5]], A(0, 0, 2)",
  guide:[{q:"A zero component in **n** means that variable is missing. Which variable is missing in each?", a:"a z;  b y."}],
  steps:[{label:'a', text:"**a**•**n** = −9: i **r**•[[3;−1;0]] = −9   ii 3x − y = −9"},{label:'b', text:"**a**•**n** = −10: i **r**•[[4;0;−5]] = −10   ii 4x − 5z = −10"}],
  answer:"a  3x − y = −9     b  4x − 5z = −10" },
{ type:'qa', id:'g7', navLabel:'G7', qnum:'Q 7', heading:'Vector → Cartesian',
  question:"a  **r** = [[5;0;1]] + λ[[1;2;3]] + μ[[5;−2;2]]     b  **r** = [[0;0;1]] + λ[[−3;6;2]] + μ[[−1;1;2]]",
  guide:[{q:"**n** = **d₁** × **d₂** for part a?", a:"[[4 + 6;15 − 2;−2 − 10]] = [[10;13;−12]]."}],
  steps:[{label:'a', text:"**n** = [[10;13;−12]], **a**•**n** = 50 − 12 = 38"},{label:'b', text:"**n** = [[12 − 2;−2 + 6;−3 + 6]] = [[10;4;3]], **a**•**n** = 3"}],

{ type:'qa', id:'g8', navLabel:'G8', qnum:'Q 8', heading:'Vector → Cartesian',
  question:"a  **r** = (7**i** + 3**j** + 5**k**) + λ(−5**i** + **j** + 2**k**) + μ**k**\nb  **r** = (3**i** + 5**j** + 7**k**) + λ(6**i** − **j** + 2**k**) + μ(−**i** − **j** + 3**k**)",

  steps:[{label:'a', text:"**n** = [[−5;1;2]] × [[0;0;1]] = [[1;5;0]], **a**•**n** = 7 + 15 = 22"},{label:'b', text:"**n** = [[−3 + 2;−2 − 18;−6 − 1]] = [[−1;−20;−7]] ⇒ use [[1;20;7]]; **a**•**n** = 3 + 100 + 49 = 152"}],

{ type:'qa', id:'g9', navLabel:'G9', qnum:'Q 9', heading:'Parametric-style vector equations',
  question:"a  **r** = (7 − 8λ − 2μ)**i** + (1 + 3λ + μ)**j** + (2 + 5λ + μ)**k**\nb  **r** = (12 + λ + 3μ)**i** + (4 − 8μ)**j** + (10 − 5λ − 10μ)**k**",

  steps:[{label:'a', text:"**n** = [[−8;3;5]] × [[−2;1;1]] = [[−2;−2;−2]] ∝ [[1;1;1]]; 7 + 1 + 2 = 10"},{label:'b', text:"[[12;4;10]] + λ[[1;0;−5]] + μ[[3;−8;−10]]; **n** = [[−40;−5;−8]] ∝ [[40;5;8]]; 480 + 20 + 80 = 580"}],
  answer:"a  x + y + z = 10     b  40x + 5y + 8z = 580" },
{ type:'qa', id:'g10', navLabel:'G10', qnum:'Q 10', heading:'Plane through three points',
  question:"a  A(12, 4, 10), B(13, 4, 5), C(15, −4, 0)     b  A(1, 0, 0), B(0, 1, 0), C(0, 0, 1)",

{ type:'qa', id:'g11', navLabel:'G11', qnum:'Q 11', heading:'Plane through three points',

  steps:[{label:'a', text:"**r** = [[3;−1;3]] + λ[[−2;2;−1]] + μ[[1;0;−1]]  (Cartesian: 2x + 3y + 2z = 9)"},{label:'b', text:"**r** = [[−1;−1;5]] + λ[[5;2;−3]] + μ[[−6;2;−4]]  (Cartesian: −x + 19y + 11z = 37)"}],

{ type:'qa', id:'g12', navLabel:'G12', qnum:'Q 12', heading:'Plane through three points',
  question:"a  A(9, 0, 0), B(−2, 1, 0), C(1, −1, 2)     b  A(11, −7, 3), B(1, 14, 2), C(−5, 10, 0)",

  steps:[{label:'a', text:"**r** = [[9;0;0]] + λ[[−11;1;0]] + μ[[−8;−1;2]]  (Cartesian: 2x + 22y + 19z = 18)"},{label:'b', text:"**r** = [[11;−7;3]] + λ[[−10;21;−1]] + μ[[−16;17;−3]]  (Cartesian: −23x − 7y + 83z = 45)"}],
  answer:"See steps" },
{ type:'qa', id:'g13', navLabel:'G13', qnum:'Q 13', heading:'Is the point in the plane?',
  question:"Determine whether (−4, 8, 13) lies in the plane **r** = [[2;1;1]] + λ[[4;1;2]] + μ[[−1;4;7]].",
  guide:[{q:"Quick method: find **n** and compare **n**•**a** with **n**•**p**.", a:"**n** = [[−1;−30;17]]: −2 − 30 + 17 = −15 and 4 − 240 + 221 = −15."}],
  steps:[{label:'Solve', text:"2 + 4λ − μ = −4, 1 + λ + 4μ = 8 ⇒ λ = −1, μ = 2"},{label:'Check z', text:"1 + 2(−1) + 7(2) = 13 ✓"}],
  answer:"Yes, the point lies in the plane (λ = −1, μ = 2)" },
{ type:'qa', id:'g14', navLabel:'G14', qnum:'Q 14', heading:'Plane through three points; test D',
  question:"Π contains A(3, −1, 2), B(3, 3, 4), C(−1, 3, 6).\na  Write down a vector equation of Π.    b  Determine whether D(4, 4, 0) lies in Π.",
  guide:[{q:"Cartesian form makes testing easy. Normal?", a:"[[0;4;2]] × [[−4;4;4]] = [[8;−8;16]] ∝ [[1;−1;2]]."}],
  steps:[{label:'a', text:"**r** = [[3;−1;2]] + λ[[0;4;2]] + μ[[−4;4;4]]"},{label:'Cartesian', text:"x − y + 2z = 3 + 1 + 4 = 8"},{label:'b', text:"D: 4 − 4 + 0 = 0 ≠ 8"}],

{ type:'qa', id:'g15', navLabel:'G15', qnum:'Q 15', heading:'Normal and point',
  question:"**n** = 4**i** − **j** + 7**k**, **a** = **i** + 5**k**.\na  Find the Cartesian equation.    b  Does **b** = 5**i** + 11**j** − **k** lie in the plane?",

{ type:'qa', id:'g16', navLabel:'G16', qnum:'Q 16', heading:'Reading a normal',
  question:"Π: 5x + y − 4z = 20.\na  Write down a normal vector.    b  Find c so that Π contains (2, c, 1).",

{ type:'qa', id:'g17', navLabel:'G17', qnum:'Q 17', heading:'Unit normal; points and a line in the plane',
  question:"Π: x + 5y − 8z = 37.\na  Find a unit vector perpendicular to Π.    b  Find p and q such that (p, 3, 1) and (48, q, 2) lie in Π.    c  Hence show that Π contains the line (x − 30)/12 = (y − 3)/2 = (z − 1)/(−1).",
  guide:[{q:"A line lies in a plane when…?", a:"…one point of the line is in the plane AND its direction is perpendicular to **n** (or two of its points are in the plane)."}],
  steps:[{label:'a', text:"|**n**| = √90 = 3√10 ⇒ (1/(3√10))[[1;5;−8]]"},{label:'b', text:"p + 15 − 8 = 37 ⇒ p = 30;  48 + 5q − 16 = 37 ⇒ q = 1"},{label:'c', text:"The line through (30, 3, 1) and (48, 1, 2) has direction [[18;−2;1]] and both points lie in Π, so that line lies in Π: (x − 30)/18 = (y − 3)/(−2) = z − 1"},
         {label:'⚠ Note', text:"As printed, the direction [[12;2;−1]] gives **n**•**d** = 12 + 10 + 8 = 30 ≠ 0, so that line only meets Π at (30, 3, 1). The intended line is almost certainly (x − 30)/18 = (y − 3)/(−2) = (z − 1)/1."}],
  answer:"a  (1/(3√10))(**i** + 5**j** − 8**k**)     b  p = 30, q = 1" },
{ type:'qa', id:'g18', navLabel:'G18', qnum:'Q 18', heading:'Plane containing two intersecting lines',
  question:"l₁: **r** = [[7;−3;2]] + t[[−1;0;2]], l₂: **r** = [[1;1;26]] + s[[0;1;3]].\na  Show that the lines intersect and find the point.    b  Calculate [[−1;0;2]] × [[0;1;3]].    c  Hence find the Cartesian equation of the plane containing l₁ and l₂.",
  guide:[{q:"Why is the cross product of the two directions the normal of the plane?", a:"The plane contains both directions, so its normal is perpendicular to both."}],
  steps:[{label:'a', text:"x: 7 − t = 1 ⇒ t = 6; y: −3 = 1 + s ⇒ s = −4; z: 2 + 12 = 14 = 26 − 12 ✓ ⇒ (1, −3, 14)"},{label:'b', text:"[[0 − 2;0 + 3;−1 − 0]] = [[−2;3;−1]]"},{label:'c', text:"−2x + 3y − z = −2 − 9 − 14 = −25"}],
  answer:"c  2x − 3y + z = 25" },
{ type:'qa', id:'g19', navLabel:'G19', qnum:'Q 19', heading:'Plane containing two Cartesian lines',
  question:"l₁: (x − 1)/3 = (y + 1)/4 = (3 − z)/3,  l₂: (x + 12)/2 = y/1 = (z + 17)/1.\na  Find the intersection point.    b  Find a vector perpendicular to both lines.    c  Find the Cartesian equation of the plane containing l₁ and l₂.",
  guide:[{q:"Careful with (3 − z)/3: what is the z-direction?", a:"z = 3 − 3λ, so the direction is [[3;4;−3]]."}],
  steps:[{label:'a', text:"1 + 3λ = −12 + 2μ, −1 + 4λ = μ ⇒ λ = 3, μ = 11; z: 3 − 9 = −6 = −17 + 11 ✓ ⇒ (10, 11, −6)"},{label:'b', text:"[[3;4;−3]] × [[2;1;1]] = [[7;−9;−5]]"},{label:'c', text:"7(10) − 9(11) − 5(−6) = 1"}],
  answer:"a  (10, 11, −6)     c  7x − 9y − 5z = 1" },
{ type:'qa', id:'g20', navLabel:'G20', qnum:'Q 20', heading:'Plane containing a line and a point',
  question:"Find a vector equation of the plane containing l: **r** = [[9;−3;7]] + t[[6;−3;1]] and P(11, 12, 13).",
  guide:[{q:"You have one direction already. Where does the second come from?", a:"From a point on the line to P: [[11;12;13]] − [[9;−3;7]]."}],
  steps:[{label:'Second direction', text:"[[2;15;6]]"}],
  answer:"**r** = [[9;−3;7]] + λ[[6;−3;1]] + μ[[2;15;6]]" },
{ type:'qa', id:'g21', navLabel:'G21', qnum:'Q 21', heading:'Plane through the origin',
  question:"Π contains l: **r** = t[[2;1;1]] and P(4, 0, 2).\na  Show that [[0;1;0]] is parallel to Π.    b  Calculate [[2;1;1]] × [[0;1;0]].    c  Hence find the Cartesian equation of Π.",
  guide:[{q:"In a, can you write [[0;1;0]] as a combination of vectors in the plane?", a:"[[0;1;0]] = ½(2[[2;1;1]] − [[4;0;2]]): difference of two position vectors of points in Π."}],
  steps:[{label:'a', text:"(4, 2, 2) (t = 2) and (4, 0, 2) are both in Π; their difference [[0;2;0]] = 2[[0;1;0]] lies in Π"},{label:'b', text:"[[0 − 1;0 − 0;2 − 0]] = [[−1;0;2]]"},{label:'c', text:"Through the origin: −x + 2z = 0 (check P: −4 + 4 = 0 ✓)"}],
  answer:"c  x − 2z = 0" },
{ type:'qa', id:'g22', navLabel:'G22', qnum:'Q 22', heading:'Line contained in a plane',
  question:"Show that the plane 5x + y − 2z = 15 contains the line (x − 4)/1 = (y + 1)/1 = (z − 2)/3.",

{ type:'qa', id:'g23', navLabel:'G23', qnum:'Q 23', heading:'Line contained in a plane',
  question:"Show that **r** = [[−3;5;1]] + t[[4;1;2]] lies in the plane **r** = [[−1;4;3]] + λ[[4;1;2]] + μ[[2;−1;2]].",
  guide:[{q:"Find the plane’s normal first.", a:"[[4;1;2]] × [[2;−1;2]] = [[4;−4;−6]] ∝ [[2;−2;−3]]."}],
  steps:[{label:'Plane', text:"2x − 2y − 3z = −2 − 8 − 9 = −19"},{label:'Point', text:"(−3, 5, 1): −6 − 10 − 3 = −19 ✓"},{label:'Direction', text:"[[4;1;2]] is one of the plane’s direction vectors (or: 8 − 2 − 6 = 0 ✓)"}],
  answer:"The line lies in the plane ∎" },
{ type:'qa', id:'g24', navLabel:'G24', qnum:'Q 24', heading:'Four points in one plane?',
  question:"Show that A(11, 0, 6), B(9, −4, 0), C(−4, 6, 0) and D(3, 8, 7) lie in the same plane.",
  guide:[{q:"Strategy?", a:"Find the plane through A, B, C, then test D."}],
  steps:[{label:'Normal', text:"{AB} = [[−2;−4;−6]], {AC} = [[−15;6;−6]]; {AB} × {AC} = [[60;78;−72]] ∝ [[10;13;−12]]"},{label:'Plane', text:"10x + 13y − 12z = 110 − 72 = 38 (B: 90 − 52 = 38 ✓, C: −40 + 78 = 38 ✓)"},{label:'Test D', text:"D(3, 8, 7): 30 + 104 − 84 = 50 ≠ 38"},
         {label:'⚠ Note', text:"With the coordinates as printed, D is NOT in the plane. The intended point is very likely D(3, 8, 8): 30 + 104 − 96 = 38 ✓. Worth discussing with the class — checking is part of the method!"}],
  answer:"Plane ABC: 10x + 13y − 12z = 38; D(3, 8, 8) lies on it (the printed D(3, 8, 7) does not)" }
);

{ type:'guided', id:'gi8h1', navLabel:'GI 8H-1', heading:'Guided Inquiry — The angle between a line and a plane',

  prompts:[

    {q:"We know **d** and **n**, but not the shadow’s direction. What angle can we compute easily with a dot product?", a:"φ, the angle between **d** and the normal **n**: cos φ = |**d**•**n**|/(|**d**||**n**|)."},
    {q:"The pencil, its shadow and the normal form a right-angled triangle. How are θ and φ related?", a:"θ + φ = 90°, so θ = 90° − φ (equivalently sin θ = |**d**•**n**|/(|**d**||**n**|))."},
    {q:"What happens when **d**•**n** = 0? When **d** is parallel to **n**?", a:"**d**•**n** = 0: θ = 0°, the line is parallel to (or lies in) the plane. **d** ∥ **n**: θ = 90°, the line is perpendicular to the plane."},

  ],
  takeaway:"Line–plane: θ = 90° − φ where cos φ = |**d**•**n**|/(|**d**||**n**|). Plane–plane: angle between the normals. Always check whether the question asks for the acute angle." },

    {label:'Solution 1', style:'sol-red', lines:"cos θ = ([[1;−1;3]]•[[4;−1;1]])/(√11 √18) = 8/√198 = 0.569\nθ = 55.4°"},
    {label:'Solution 2', style:'sol-green', lines:"cos θ = 8/√198 = 0.569\nθ = 55.4°\n90 − 55.4 = 34.6°"},
    {label:'Solution 3', style:'sol-red', lines:"cos θ = ([[3;1;−2]]•[[4;−1;1]])/(√14 √18) = 9/√252 = 0.567\n55.5°, 90 − 55.5 = 34.5°"}],
  guide:[{q:"The angle you get from **d**•**n** is between the line and which object?", a:"The NORMAL to the plane, not the plane itself."},{q:"Which vector in the line equation is its direction?", a:"[[1;−1;3]], the vector multiplied by λ."}],
  note:"Solution 2 is correct: 34.6°. Solution 1 stops after finding the angle with the normal (55.4°) and forgets θ = 90° − φ. Solution 3 uses the position vector [[3;1;−2]] instead of the direction vector — the answer is close only by coincidence." },
{ type:'keypoint', id:'kp835', navLabel:'KP 8.35', badge:'Key Point 8.35', heading:'Key Point 8.35 — Angle Between Two Planes',
  formula:"cos θ = |**n₁**•**n₂**| / (|**n₁**||**n₂**|)",
  notes:["The angle between two planes equals the angle between their normals.", "Read the normals straight from the Cartesian equations."] },
{ type:'example', id:'we841', navLabel:'WE 8.41', badge:'Worked Example 8.41', heading:'Worked Example 8.41 — Acute Angle Between Planes',
  question:"Find the acute angle between 4x − y + 5z = 11 and x + y − 3z = 3.",
  guide:[{q:"Normals?", a:"[[4;−1;5]] and [[1;1;−3]]."}],
  hints:["cos θ = (4 − 1 − 15)/(√42 √11) = −12/(√42 √11) ⇒ θ = 123.9°", "Acute angle: 180° − 123.9° = 56.1°"] },
{ type:'example', id:'we842', navLabel:'WE 8.42', badge:'Worked Example 8.42', heading:'Worked Example 8.42 — Line Meets Plane',
  question:"Find the point of intersection of **r** = [[3;−1;2]] + λ[[−1;2;2]] and the plane x − 2y + z = 1.",
  guide:[{q:"Strategy?", a:"Write x, y, z in terms of λ and substitute into the plane’s equation — one equation in λ."}],
  hints:["x = 3 − λ, y = −1 + 2λ, z = 2 + 2λ", "(3 − λ) − 2(−1 + 2λ) + (2 + 2λ) = 1 ⇒ 7 − 3λ = 1 ⇒ λ = 2", "Point (1, 3, 6) (check: 1 − 6 + 6 = 1 ✓)"] },
{ type:'example', id:'we843', navLabel:'WE 8.43', badge:'Worked Example 8.43', heading:'Worked Example 8.43 — Line of Intersection of Two Planes',
  question:"Find the line of intersection of 4x − y + 3z = 12 and x + 2y + z = 39.",
  guide:[{q:"Two equations, three unknowns: what kind of solution set?", a:"Infinitely many — a line. Let one variable be the parameter."},{q:"Alternative for the direction?", a:"**n₁** × **n₂** = [[4;−1;3]] × [[1;2;1]] = [[−7;−1;9]] — then you just need one common point."}],
  hints:["2×(1) + (2): 9x + 7z = 63", "Let z = λ: x = 7 − (7/9)λ, y = 4x + 3z − 12 = 16 − (1/9)λ", "**r** = [[7;16;0]] + λ[[−7/9;−1/9;1]], or **r** = [[7;16;0]] + λ[[−7;−1;9]]"] },

{ type:'guided', id:'gi8h2', navLabel:'GI 8H-2', heading:'Guided Inquiry — How can three planes meet?',
  intro:"Use three sheets of card (or the walls, floor and a book) to model three planes. A system of three linear equations in x, y, z has a unique solution, infinitely many, or none.",
  prompts:[
    {q:"Arrange the three planes so they share exactly one point. Example from the room?", a:"Two walls and the floor meet at a corner — a unique solution."},
    {q:"Arrange them to share a whole line. What does that look like?", a:"Like the pages of an open book (a “sheaf”) — infinitely many solutions."},
    {q:"Find THREE different arrangements with no common point. Which normals are parallel in each?", a:"All three parallel (all normals parallel); two parallel cut by a third (two normals parallel); a triangular prism (no normals parallel)."},
    {q:"If elimination gives 0 = −20, what do you know? What extra check distinguishes the three “no solution” cases?", a:"The system is inconsistent (no common point). Then check which normals (if any) are multiples of each other."},
    {q:"If elimination gives 0 = 0, what do you know?", a:"One equation is a combination of the others — the planes meet in a line (assuming distinct, non-parallel planes)."}
  ],
  takeaway:"Unique solution ⇒ a point. 0 = 0 ⇒ a line (sheaf). 0 = (non-zero) ⇒ no intersection: prism (no parallel normals), two parallel planes cut by a third, or three parallel planes." },

{ type:'example', id:'we844', navLabel:'WE 8.44', badge:'Worked Example 8.44', heading:'Worked Example 8.44 — Point or Prism?',
  question:"Π₁: x + 2y + kz = 8,  Π₂: 2x + 5y + 2z = 7,  Π₃: 5x + 12y + z = 2.\na  For k = 2 the planes meet at a single point. Find it.\nb  For k = −3, show the planes do not intersect and describe their configuration.",
  guide:[{q:"Why can’t a GDC “show” there is no intersection?", a:"It just gives an error; you must eliminate by hand to reach a contradiction."}],
  hints:["a  Solve x + 2y + 2z = 8, 2x + 5y + 2z = 7, 5x + 12y + z = 2 (GDC): (2, −1, 4)", "b  3×(3) + (1): 16x + 38y = 14;  2×(3) − (2): 8x + 17y = −3", "2×(8x + 17y = −3) − (16x + 38y = 14): 0 − 4y ... ⇒ leads to 0 = −20 (inconsistent)", "No two normals are multiples, so the planes form a triangular prism"] },
{ type:'example', id:'we845', navLabel:'WE 8.45', badge:'Worked Example 8.45', heading:'Worked Example 8.45 — Three Planes in a Line',
  question:"Show that Π₁: x + 4y − 2z = −3, Π₂: 2x − y + 5z = 12, Π₃: 8x + 5y + 11z = 30 intersect in a line, and find its vector equation.",
  guide:[{q:"What equation signals infinitely many solutions?", a:"0 = 0 after elimination."}],
  hints:["2×(1) − (2): 9y − 9z = −18 (4);  8×(1) − (3): 27y − 27z = −54 (5)", "3×(4) − (5): 0 = 0 ⇒ infinitely many solutions", "Let z = λ: y = −2 + λ, x = −3 − 4(−2 + λ) + 2λ = 5 − 2λ", "**r** = [[5;−2;0]] + λ[[−2;1;1]]"] },

{ type:'qa', id:'h5', navLabel:'H5', qnum:'Q 5', heading:'Angle between two planes',

{ type:'qa', id:'h7', navLabel:'H7', qnum:'Q 7', heading:'Line meets plane',
  question:"a  l: **r** = [[1;0;5]] + λ[[2;1;2]], Π: x + y + 2z = 32     b  l: **r** = [[3;1;0]] + λ[[1;1;3]], Π: 3x + y + z = 24",

{ type:'qa', id:'h9', navLabel:'H9', qnum:'Q 9', heading:'Line meets plane',

  answer:"a  (−7, 0, 3)     b  (−97/11, 15/11, 63/11)" },
{ type:'qa', id:'h10', navLabel:'H10', qnum:'Q 10', heading:'Line of intersection of two planes',

  steps:[{label:'a', text:"**r** = [[0;1;2]] + λ[[−1;3;5]]"},{label:'b', text:"**r** = [[1;−1;0]] + λ[[−3;4;1]]"}],

{ type:'qa', id:'h11', navLabel:'H11', qnum:'Q 11', heading:'Line of intersection of two planes',

  steps:[{label:'a', text:"Common point (3, −2, 3): 6 − 2 + 3 = 7 ✓, 9 + 2 + 6 = 17 ✓ ⇒ **r** = [[3;−2;3]] + λ[[−3;1;5]]"},{label:'b', text:"x = 0: 4y − z = 11, y + 2z = 5 ⇒ (0, 3, 1) ⇒ **r** = [[0;3;1]] + λ[[−9;5;11]]"}],

{ type:'qa', id:'h12', navLabel:'H12', qnum:'Q 12', heading:'Line of intersection of two planes',

{ type:'qa', id:'h13', navLabel:'H13', qnum:'Q 13', heading:'Three planes: point or no intersection?',
  question:"a  2x − 5y + 4z = 10, x + 3y − 2z = 5, 4x + 2y − z = −4\nb  x − 3y + z = −5, 3x − y − z = −7, x + 3y + 5z = 1  (printed as “x + 3y + 5y = 1”)",

  answer:"a  (−11, 64, 88)     b  (−2, 1, 0)" },
{ type:'qa', id:'h14', navLabel:'H14', qnum:'Q 14', heading:'Three planes: point or no intersection?',
  question:"a  Π₁: x + 5y − z = −1, Π₂: 2x − 2y + z = 2, Π₃: 5x − 3y + 2z = 4\nb  Π₁: 2x + 3y + 8z = 6, Π₂: 2x + y + 2z = 4, Π₃: 6x − y − 6z = 5",

         {label:'b', text:"(1) − (2): 2y + 6z = 2;  3×(2) − (3): 4y + 12z = 7 ⇒ y + 3z = 1 and y + 3z = 7/4 — contradiction; no parallel normals ⇒ triangular prism"}],

{ type:'qa', id:'h15', navLabel:'H15', qnum:'Q 15', heading:'Three planes with parallel pairs',
  question:"a  Π₁: x − y + 2z = 11, Π₂: 3x − 3y + 6z = 15, Π₃: 2x + y + z = 16\nb  Π₁: x + y − 2z = 6, Π₂: 2x − y + z = 5, Π₃: 3x + 3y − 6z = 2",

{ type:'qa', id:'h16', navLabel:'H16', qnum:'Q 16', heading:'Three planes meeting in a line',
  question:"a  x − y + 2z = 1, x + 2y − z = 4, 2x + y + z = 5     b  2x − y − 3z = 3, x + y − 3z = 0, x + 2y − 4z = −1",

  steps:[{label:'a', text:"(2) − (1): 3y − 3z = 3 ⇒ y = 1 + z; x = 1 + y − 2z = 2 − z. Let z = λ"},{label:'b', text:"(1) − (2): x − 2y = 3... ⇒ x = 1 + 2z, y = z − 1. Let z = λ"}],
  answer:"a  **r** = [[2;1;0]] + λ[[−1;1;1]]     b  **r** = [[1;−1;0]] + λ[[2;1;1]]" },
{ type:'qa', id:'h17', navLabel:'H17', qnum:'Q 17', heading:'Three planes meeting in a line',
  question:"a  3x + 2y + z = 1, 7x + 4y + 5z = 3, 5x + 3y + 3z = 2     b  2x + y + z = 11, x − y + z = 5, x + 5y − z = 7",

{ type:'qa', id:'h18', navLabel:'H18', qnum:'Q 18', heading:'Three planes meeting in a line',
  question:"a  −x + y + z = −2, x − y + 2z = 5, 2x − 2y + 3z = 9     b  3x − 6y + z = 3, x − 2y + z = 1, −x + 2y + 2z = −1",

  answer:"a  **r** = [[3;0;1]] + λ[[1;1;0]]     b  **r** = [[1;0;0]] + λ[[2;1;0]]" },
{ type:'qa', id:'h19', navLabel:'H19', qnum:'Q 19', heading:'Angle between two planes',
  question:"Π₁: 3x − y + z = 7.  a  Write down a normal vector of Π₁.  Π₂: x − 5y + 5z = 11.  b  Find, to the nearest degree, the acute angle between Π₁ and Π₂.",

{ type:'qa', id:'h20', navLabel:'H20', qnum:'Q 20', heading:'Perpendicular distance from a point to a plane',
  question:"Π: 2x + 2y − z = 11. Line l is perpendicular to Π through P(−3, −3, 4) and meets Π at N.\na  Direction of l?    b  Vector equation of l?    c  Coordinates of N?    d  Perpendicular distance from P to Π?",
  guide:[{q:"A line perpendicular to a plane has which direction?", a:"The plane’s normal."}],
  steps:[{label:'a, b', text:"**d** = [[2;2;−1]];  **r** = [[−3;−3;4]] + λ[[2;2;−1]]"},{label:'c', text:"2(−3 + 2λ) + 2(−3 + 2λ) − (4 − λ) = 9λ − 16 = 11 ⇒ λ = 3 ⇒ N(3, 3, 1)"},{label:'d', text:"PN = 3|**d**| = 3 × 3"}],
  answer:"c  N(3, 3, 1)     d  9" },
{ type:'qa', id:'h21', navLabel:'H21', qnum:'Q 21', heading:'Plane through three points; angle between planes',
  question:"Π₁ contains A(2, −2, 1), B(5, 1, 2), C(−2, 2, 5).  a  Find {AB} × {AC}.  b  Find the Cartesian equation of Π₁.  Π₂: **r**•(3**i** + **j** − 2**k**) = 12.  c  Find the acute angle between Π₁ and Π₂.",
  guide:[{q:"{AB}, {AC}?", a:"[[3;3;1]] and [[−4;4;4]]."}],
  steps:[{label:'a', text:"[[12 − 4;−4 − 12;12 + 12]] = [[8;−16;24]]"},{label:'b', text:"∝ [[1;−2;3]]: x − 2y + 3z = 2 + 4 + 3 = 9"},{label:'c', text:"cos θ = |3 − 2 − 6|/(√14 √14) = 5/14"}],
  answer:"b  x − 2y + 3z = 9     c  69.1°" },
{ type:'qa', id:'h22', navLabel:'H22', qnum:'Q 22', heading:'Line and plane: intersection, angle, distance',
  question:"L passes through A(4, 1, −3) with direction **i** + **j** + 2**k**. Π: **r**•**n** = 20 with **n** = 3**i** − **k**. They meet at M.\na  Find M.    b  Find the angle between L and Π.    c  N lies in Π so that AN ⟂ Π. Find MN.",
  guide:[{q:"Write Π in Cartesian form.", a:"3x − z = 20."},{q:"For N, which line do you intersect with Π?", a:"The line through A with direction **n**."}],
  steps:[{label:'a', text:"3(4 + λ) − (−3 + 2λ) = 15 + λ = 20 ⇒ λ = 5 ⇒ M(9, 6, 7)"},{label:'b', text:"sin θ = |3 − 2|/(√6 √10) = 1/√60 ⇒ θ = 7.42°"},{label:'c', text:"A + μ**n**: 3(4 + 3μ) − (−3 − μ) = 15 + 10μ = 20 ⇒ μ = ½ ⇒ N(5.5, 1, −3.5); {MN} = [[−3.5;−5;−10.5]]"}],

  steps:[{label:'Parallel', text:"[[−5;−1−3p;15]] = −5[[1;4;−3]] ⇒ −1 − 3p = −20"}],
  answer:"p = 19/3" },
{ type:'qa', id:'mp13', navLabel:'M13', qnum:'Q 13', heading:'Parallelogram for all k; rectangle',
  question:"A(2, 4, 1), B(k, 4, 2k), C(k + 4, 2k + 4, 2k + 2), D(6, 2k + 4, 3).\na  Show ABCD is a parallelogram for all k.  b  When k = 1, find its angles.  c  Find k for which ABCD is a rectangle.",
  guide:[{q:"Rectangle condition?", a:"Parallelogram with {AB}•{AD} = 0."}],
  steps:[{label:'a', text:"{AB} = [[k−2;0;2k−1]] = {DC}"},{label:'b', text:"k = 1: {AB} = [[−1;0;1]], {AD} = [[4;2;2]]; cos A = −2/(√2 √24) ⇒ A = 106.8°, B = 73.2°"},{label:'c', text:"{AD} = [[4;2k;2]]: 4(k − 2) + 2(2k − 1) = 8k − 10 = 0"}],
  answer:"b  106.8°, 73.2°, 106.8°, 73.2°     c  k = 5/4" },
{ type:'qa', id:'mp14', navLabel:'M14', qnum:'Q 14', heading:'Vector product identity',
  question:"Show that (2**a** − **b**) × (**a** + 3**b**) = 7**a** × **b**.",
  guide:[{q:"Expand keeping order; which terms vanish?", a:"**a** × **a** and **b** × **b**."}],
  steps:[{label:'Expand', text:"2**a**×**a** + 6**a**×**b** − **b**×**a** − 3**b**×**b** = 6**a**×**b** + **a**×**b**"}],
  answer:"= 7**a** × **b** ∎" },
{ type:'qa', id:'mp15', navLabel:'M15', qnum:'Q 15', heading:'Area of a triangle',
  question:"Find the area of the triangle with vertices (2, 1, 1), (−1, 2, 2) and (0, 1, 5).",
  guide:[{q:"Two sides from (2, 1, 1)?", a:"[[−3;1;1]] and [[−2;0;4]]."}],
  steps:[{label:'Cross', text:"[[4;10;2]], |…| = √120 = 2√30"}],
  answer:"Area = √30 ≈ 5.48" },
{ type:'qa', id:'mp16', navLabel:'M16', qnum:'Q 16', heading:'Combination parallel to a vector',
  question:"**a** = **i** − **j** + 3**k**, **b** = 2q**i** + **j** + q**k**. Find p and q such that p**a** + **b** is parallel to **i** + **j** + 2**k**.",
  guide:[{q:"p**a** + **b** = ?", a:"[[p+2q;1−p;3p+q]]."},{q:"Parallel to [[1;1;2]] means…", a:"1st = 2nd component and 3rd = 2 × 2nd."}],
  steps:[{label:'Equations', text:"p + 2q = 1 − p ⇒ 2p + 2q = 1;  3p + q = 2 − 2p ⇒ 5p + q = 2"},{label:'Solve', text:"q = ½ − p ⇒ 4p = 3/2"}],
  answer:"p = 3/8, q = 1/8" },
{ type:'qa', id:'mp17', navLabel:'M17', qnum:'Q 17', heading:'Unit vectors and |a ± b|',
  question:"**a**, **b** are unit vectors with angle α between them.\na  Express |**a** − **b**| and |**a** + **b**| in terms of cos α.  b  Find α such that |**a** + **b**| = 4|**a** − **b**|.",
  guide:[{q:"Use |**v**|² = **v**•**v**.", a:"|**a** ± **b**|² = 1 + 1 ± 2cos α."}],
  steps:[{label:'a', text:"|**a** − **b**| = √(2 − 2cos α),  |**a** + **b**| = √(2 + 2cos α)"},{label:'b', text:"2 + 2cos α = 16(2 − 2cos α) ⇒ 34cos α = 30"}],
  answer:"b  cos α = 15/17, α ≈ 0.490 rad (28.1°)" },
{ type:'qa', id:'mp18', navLabel:'M18', qnum:'Q 18', heading:'Parallel, perpendicular, intersecting?',
  question:"**r** = [[2;−1;5]] + λ[[4;−1;2]] and **r** = [[−2;0;3]] + μ[[1;−2;−3]].\na  Are they parallel or perpendicular?    b  Do they intersect?",
  guide:[{q:"Dot product of directions?", a:"4 + 2 − 6 = 0."}],
  steps:[{label:'a', text:"Directions perpendicular (dot = 0) — so the lines are perpendicular in direction"},{label:'b', text:"2 + 4λ = −2 + μ, −1 − λ = −2μ ⇒ μ = 0, λ = −1; z: 5 − 2 = 3 ✓"}],
  answer:"a  perpendicular     b  yes, at (−2, 0, 3)" },
{ type:'qa', id:'mp19', navLabel:'M19', qnum:'Q 19', heading:'Plane containing two intersecting lines',
  question:"a  Calculate [[−1;0;2]] × [[0;1;3]].  b  l₁: **r** = [[7;−3;2]] + t[[−1;0;2]], l₂: **r** = [[1;1;26]] + s[[0;1;3]]. i Show they intersect; ii find R.  c  Find the Cartesian equation of the plane Π containing l₁ and l₂.",
  guide:[{q:"Same as Exercise 8G Q18 — can you do it without looking?", a:"Try it!"}],
  steps:[{label:'a', text:"[[−2;3;−1]]"},{label:'b', text:"t = 6, s = −4 satisfy all three equations ⇒ R(1, −3, 14)"},{label:'c', text:"−2x + 3y − z = −2 − 9 − 14 = −25"}],
  answer:"b  R(1, −3, 14)     c  2x − 3y + z = 25" },
{ type:'qa', id:'mp20', navLabel:'M20', qnum:'Q 20', heading:'Distance of a line from the origin',
  question:"l: (2x − 3)/2 = (3 − y)/4 = z/5.\na  Write down a vector equation of l.  b  A on l with OA ⟂ l: find A.  c  Find the shortest distance of l from O.",
  guide:[{q:"Set each fraction = λ.", a:"x = 3/2 + λ, y = 3 − 4λ, z = 5λ."}],
  steps:[{label:'a', text:"**r** = [[3/2;3;0]] + λ[[1;−4;5]]"},{label:'b', text:"(3/2 + λ) − 4(3 − 4λ) + 25λ = 42λ − 21/2 = 0 ⇒ λ = ¼ ⇒ A(7/4, 2, 5/4)"},{label:'c', text:"|{OA}| = √(49/16 + 64/16 + 25/16) = √138/4"}],
  answer:"b  A(7/4, 2, 5/4)     c  √138/4 ≈ 2.94" },
{ type:'qa', id:'mp21', navLabel:'M21', qnum:'Q 21', heading:'Distance between parallel lines',
  question:"l₁: (x − 2)/4 = (y + 1)/(−3) = z/3. l₂ ∥ l₁ through A(0, −1, 2).\na  Write down l₂.  b  Find B on l₁ with AB ⟂ l₁.  c  Find (3 s.f.) the shortest distance between the lines.",
  guide:[{q:"Why is |AB| the distance between the lines?", a:"AB is perpendicular to both (they are parallel)."}],
  steps:[{label:'a', text:"**r** = [[0;−1;2]] + μ[[4;−3;3]]"},{label:'b', text:"{AB} = [[2+4λ;−3λ;−2+3λ]]; •[[4;−3;3]] = 34λ + 2 = 0 ⇒ λ = −1/17 ⇒ B(30/17, −14/17, −3/17)"},{label:'c', text:"{AB} = (1/17)[[30;3;−37]], |{AB}| = √2278/17"}],
  answer:"c  ≈ 2.81" },
{ type:'qa', id:'mp22', navLabel:'M22', qnum:'Q 22', heading:'Projection onto a line',
  question:"a  Find L through A(−2, 4, 2) parallel to **l** = [[1;1;0]].  B(2, 3, 3).  b  Find the cosine of the angle between AB and L.  c  Find AB.  d  C on L with BC ⟂ L: find AC exactly.",
  guide:[{q:"In right-angled triangle ABC (right angle at C), AC = ?", a:"AB cos θ."}],
  steps:[{label:'a', text:"**r** = [[−2;4;2]] + λ[[1;1;0]]"},{label:'b', text:"{AB} = [[4;−1;1]]: cos θ = 3/(√18 √2) = ½"},{label:'c', text:"√18 = 3√2"},{label:'d', text:"AC = 3√2 × ½"}],
  answer:"b  ½     c  3√2     d  3√2/2" },
{ type:'qa', id:'mp23', navLabel:'M23', qnum:'Q 23', heading:'Plane parallel to two skew lines',
  question:"L₁: **r** = [[4;1;2]] + λ[[−3;3;1]], L₂: (x − 1)/4 = (y + 2)/3 = (2z − 1)/4.\na  Show the lines do not intersect.  b  Calculate [[−3;3;1]] × [[4;3;2]].  c  Find the plane through (3, 0, 1) parallel to both lines.",
  guide:[{q:"Direction of L₂? (careful with 2z − 1)", a:"z = ½ + 2μ, so [[4;3;2]]; point (1, −2, ½)."}],
  steps:[{label:'a', text:"4 − 3λ = 1 + 4μ, 1 + 3λ = −2 + 3μ ⇒ μ = 6/7, λ = −1/7; z: 13/7 vs 31/14 ✗"},{label:'b', text:"[[6 − 3;4 + 6;−9 − 12]] = [[3;10;−21]]"},{label:'c', text:"3x + 10y − 21z = 9 − 21"}],
  answer:"c  3x + 10y − 21z = −12" },
{ type:'qa', id:'mp24', navLabel:'M24', qnum:'Q 24', heading:'Line meeting the x-axis',
  question:"(2x − 1)/4 = (y + 2)/3 = (4 − 3z)/6.\na  Find a vector equation.  b  Does it meet the x-axis?  c  Find the angle with the x-axis.",
  guide:[{q:"On the x-axis, y = z = 0. Do they occur at the same λ?", a:"y = 0 ⇒ λ = 2/3; z = 4/3 − 2(2/3) = 0 ✓."}],
  steps:[{label:'a', text:"x = ½ + 2λ, y = −2 + 3λ, z = 4/3 − 2λ ⇒ **r** = [[1/2;−2;4/3]] + λ[[2;3;−2]]"},{label:'b', text:"λ = 2/3 gives (11/6, 0, 0)"},{label:'c', text:"cos θ = 2/√17"}],
  answer:"b  yes, at (11/6, 0, 0)     c  61.0°" },
{ type:'qa', id:'mp25', navLabel:'M25', qnum:'Q 25', heading:'Line perpendicular to a plane; reflection',
  question:"A(3, 1, −4) lies on L ⟂ Π: 3x − y − z = 1.\na  Cartesian equation of L.  b  Intersection of L and Π.  c  Reflection of A in Π.  d  Show B(1, 1, 1) ∈ Π.  e  Exact distance between B and L.",
  guide:[{q:"Distance from B to L: L meets Π at F and B is also in Π. What angle does BF make with L?", a:"90° (L ⟂ Π), so the distance is BF."}],
  steps:[{label:'a', text:"(x − 3)/3 = (y − 1)/(−1) = (z + 4)/(−1)"},{label:'b', text:"3(3 + 3λ) − (1 − λ) − (−4 − λ) = 12 + 11λ = 1 ⇒ λ = −1 ⇒ F(0, 2, −3)"},{label:'c', text:"2F − A = (−3, 3, −2)"},{label:'d', text:"3 − 1 − 1 = 1 ✓"},{label:'e', text:"|BF| = |(−1, 1, −4)| = √18"}],
  answer:"b  (0, 2, −3)     c  (−3, 3, −2)     e  3√2" },
{ type:'qa', id:'mp26', navLabel:'M26', qnum:'Q 26', heading:'Particle path vs a line',
  question:"**r** = (4 + 3t)**i** + (6 − t)**j** + (2t − 7)**k**.\na  Displacement after 5 s?  b  Speed?  c  Does the path cross the line through (3, 0, 1) and (1, 1, 5)?",
  guide:[{q:"Line through the two points?", a:"[[3;0;1]] + s[[−2;1;4]]."}],
  steps:[{label:'a', text:"5[[3;−1;2]] = [[15;−5;10]] m (|…| = 5√14 ≈ 18.7 m)"},{label:'b', text:"√(9 + 1 + 4) = √14 ≈ 3.74 m s⁻¹"},{label:'c', text:"4 + 3t = 3 − 2s, 6 − t = s ⇒ t = −13, s = 19; z: −33 ≠ 77 ✗"}],
  answer:"c  No — the path and the line are skew" },
{ type:'qa', id:'mp27', navLabel:'M27', qnum:'Q 27', heading:'Two aircraft',
  question:"At t = 0 aircraft are at 5**j** and 7**k** with velocities 3**i** − 4**j** + **k** and 5**i** + 2**j** − **k**.\na  Position of the first at time t.  b  Show d² = 44t² − 88t + 74.  c  Show they don’t collide.  d  Minimum distance.",
  guide:[{q:"Complete the square for d².", a:"44(t − 1)² + 30."}],
  steps:[{label:'a', text:"**r₁** = 3t**i** + (5 − 4t)**j** + t**k**"},{label:'b', text:"**r₁** − **r₂** = [[−2t;5−6t;2t−7]] ⇒ 4t² + (5 − 6t)² + (2t − 7)² = 44t² − 88t + 74"},{label:'c', text:"d² = 44(t − 1)² + 30 ≥ 30 > 0"},{label:'d', text:"At t = 1: d = √30"}],
  answer:"d  √30 ≈ 5.48" },
{ type:'qa', id:'mp28', navLabel:'M28', qnum:'Q 28', heading:'Triangle cut by the axes',
  question:"The plane 3x − y + 5z = 30 meets the axes at A, B, C. Find the area of triangle ABC.",
  guide:[{q:"Intercepts?", a:"A(10, 0, 0), B(0, −30, 0), C(0, 0, 6)."}],
  steps:[{label:'Vectors', text:"{AB} = [[−10;−30;0]], {AC} = [[−10;0;6]]"},{label:'Cross', text:"[[−180;60;−300]], |…| = 60√35"}],
  answer:"Area = 30√35 ≈ 177" },
{ type:'qa', id:'mp29', navLabel:'M29', qnum:'Q 29', heading:'Line of intersection by cross product',
  question:"a  **a** = 2**i** − **j** + **k**, **b** = **i** − **j** + 4**k**: show **b** × **a** = 3**i** + 7**j** + **k**.  Planes **r**•**a** = 5 and **r**•**b** = 12.  b  Show (2, 2, 3) lies on both.  c  Write down the line of intersection.",
  guide:[{q:"Why is **b** × **a** the direction of the line?", a:"It is perpendicular to both normals."}],
  steps:[{label:'a', text:"[[(−1)(1) − 4(−1);4(2) − 1(1);1(−1) − (−1)(2)]] = [[3;7;1]]"},{label:'b', text:"4 − 2 + 3 = 5 ✓;  2 − 2 + 12 = 12 ✓"}],
  answer:"c  (x − 2)/3 = (y − 2)/7 = z − 3" },
{ type:'qa', id:'mp30', navLabel:'M30', qnum:'Q 30', heading:'Volume of a tetrahedron',
  question:"A(7, 0, 1), B(8, −1, 4), C(9, 0, 2), D(6, 5, 3).\na  Show {AD} ⟂ {AB} and {AC}.  b  Equation of plane Π (A, B, C) as **r**•**n** = k.  c  Exact distance of D from Π.  d  Volume of ABCD.",
  guide:[{q:"If {AD} is perpendicular to the plane, what is it?", a:"A normal — and |{AD}| is D’s distance from Π."}],
  steps:[{label:'a', text:"{AD} = [[−1;5;2]], {AB} = [[1;−1;3]], {AC} = [[2;0;1]]: dots −1 − 5 + 6 = 0 and −2 + 0 + 2 = 0"},{label:'b', text:"**r**•[[−1;5;2]] = −7 + 0 + 2 = −5"},{label:'c', text:"|{AD}| = √30"},{label:'d', text:"Area ABC = ½|{AB} × {AC}| = √30/2; V = ⅓ × √30/2 × √30"}],
  answer:"b  **r**•(−**i** + 5**j** + 2**k**) = −5     c  √30     d  5" },
{ type:'qa', id:'mp31', navLabel:'M31', qnum:'Q 31', heading:'Finding k from the line of intersection',
  question:"The planes x − 2y + z = 15 and 4x + y − z = k intersect along the line 45x = 9y + 180 = 5z + 125. Find k.",
  guide:[{q:"Parametrise the line with x = X.", a:"y = 5X − 20, z = 9X − 25."}],
  steps:[{label:'Check Π₁', text:"X − 2(5X − 20) + (9X − 25) = 15 ✓"},{label:'Π₂', text:"4X + (5X − 20) − (9X − 25) = 5"}],
  answer:"k = 5" },
{ type:'qa', id:'mp32', navLabel:'M32', qnum:'Q 32', heading:'Right-angled triangle between lines',
  question:"L₁: **r** = [[5;−3;1]] + λ[[2;−2;1]], L₂: **r** = [[0;7;−5]] + μ[[1;−6;4]].\na  Acute angle between the lines.  b  Intersection X.  c  Show Y(9, −7, 3) ∈ L₁.  d  Z on L₂ with XY ⟂ YZ: find the area of XYZ.",
  guide:[{q:"Write Z with parameter μ and set {XY}•{YZ} = 0.", a:"{YZ} = [[μ−9;14−6μ;4μ−8]]."}],
  steps:[{label:'a', text:"cos θ = |2 + 12 + 4|/(3√53) ⇒ 34.5°"},{label:'b', text:"λ = −2, μ = 1 ⇒ X(1, 1, −1)"},{label:'c', text:"λ = 2 gives (9, −7, 3) ✓"},{label:'d', text:"{XY} = [[8;−8;4]]: 72μ − 216 = 0 ⇒ μ = 3, Z(3, −11, 7); |XY| = 12, |YZ| = 2√17"}],
  answer:"a  34.5°     b  X(1, 1, −1)     d  12√17 ≈ 49.5" },
{ type:'qa', id:'mp33', navLabel:'M33', qnum:'Q 33', heading:'IB HL Nov 2010 P2 Q9 — trig vectors',
  question:"**a** = sin(2α)**i** − cos(2α)**j** + **k**, **b** = cos α **i** − sin α **j** − **k**, 0 < α < 2π.\na  Express cos θ in terms of α.  b  Find the acute α for which the vectors are perpendicular.  c  For α = 7π/6, find **a** × **b** and comment.",
  guide:[{q:"Which compound-angle identity appears in **a**•**b**?", a:"sin 2α cos α + cos 2α sin α = sin 3α."}],
  steps:[{label:'a', text:"**a**•**b** = sin 3α − 1; |**a**| = |**b**| = √2 ⇒ cos θ = (sin 3α − 1)/2"},{label:'b', text:"sin 3α = 1 ⇒ 3α = π/2"},{label:'c', text:"**a** = [[√3/2;−1/2;1]], **b** = [[−√3/2;1/2;−1]] = −**a** ⇒ **a** × **b** = **0**"}],
  answer:"b  α = π/6     c  **0**: the vectors are parallel (opposite directions)" },
{ type:'qa', id:'mp34', navLabel:'M34', qnum:'Q 34', heading:'IB HL May 2011 P2 Q11 — three planes',
  question:"ax + 2y + z = 3, −x + (a + 1)y + 3z = 1, −2x + y + (a + 2)z = k.\na  For a = 0, show the planes meet at a point.  b  Find a such that they do not meet at a point.  c  For that a, find k such that they meet in a line, and the line.",
  guide:[{q:"Unique point ⇔ ?", a:"Determinant ≠ 0."}],
  steps:[{label:'det', text:"det = (a − 1)(a² + 4a + 7); a = 0 gives −7 ≠ 0 ⇒ unique point"},{label:'b', text:"a² + 4a + 7 has no real roots ⇒ a = 1"},{label:'c', text:"(1) + (2): 4y + 4z = 4;  2(1) + (3): 5y + 5z = 6 + k ⇒ consistent iff k = −1"},{label:'Line', text:"z = λ: y = 1 − λ, x = 1 + λ"}],
  answer:"b  a = 1     c  k = −1, **r** = [[1;1;0]] + λ[[1;−1;1]]" },
{ type:'qa', id:'mp35', navLabel:'M35', qnum:'Q 35', heading:'IB HL Nov 2010 P2 Q12 — plane in a cube',
  question:"Cube OABCDEFG, O origin, OA, OC, OD along x, y, z; F(2, 2, 2). M, N, P are midpoints of [FG], [DG], [CG].\na  Find {OM}, {ON}, {OP}.  b  Find {MP} × {MN}.  c  i area MNP  ii show (AG) ⟂ plane MNP  iii equation of MNP.  d  Where does (AG) meet MNP?",
  guide:[{q:"Coordinates of G?", a:"G is above C: (0, 2, 2)."}],
  steps:[{label:'a', text:"M(1, 2, 2), N(0, 1, 2), P(0, 2, 1)"},{label:'b', text:"{MP} = [[−1;0;−1]], {MN} = [[−1;−1;0]] ⇒ [[−1;1;1]]"},{label:'c', text:"i ½√3   ii {AG} = [[−2;2;2]] = 2[[−1;1;1]] ∥ normal   iii −x + y + z = 3"},{label:'d', text:"(2 − 2λ, 2λ, 2λ): −2 + 6λ = 3 ⇒ λ = 5/6"}],
  answer:"c i  √3/2     iii  −x + y + z = 3     d  (1/3, 5/3, 5/3)" },
{ type:'qa', id:'mp36', navLabel:'M36', qnum:'Q 36', heading:'Triangle from two lines',
  question:"l₁: **r** = [[−5;1;10]] + λ[[−3;0;4]], l₂: **r** = [[3;0;−9]] + μ[[1;1;7]].\na  Find P.  b  Show Q(5, 2, 5) ∈ l₂.  c  M on l₁ with QM ⟂ l₁.  d  Area of PQM.",
  guide:[{q:"Which angle of triangle PQM is a right angle?", a:"The angle at M."}],
  steps:[{label:'a', text:"λ = −3, μ = 1 ⇒ P(4, 1, −2)"},{label:'b', text:"μ = 2 ✓"},{label:'c', text:"(−5 − 3λ − 5)(−3) + (10 + 4λ − 5)(4) = 25λ + 50 = 0 ⇒ λ = −2 ⇒ M(1, 1, 2)"},{label:'d', text:"PM = 5, QM = |(−4, −1, −3)| = √26 ⇒ ½ × 5 × √26"}],
  answer:"a  P(4, 1, −2)     c  M(1, 1, 2)     d  5√26/2 ≈ 12.7" },
{ type:'qa', id:'mp37', navLabel:'M37', qnum:'Q 37', heading:'Minimum distance',
  question:"**p** = **i** + **j** + 3**k**, **q** = (2 + t)**i** + (1 − t)**j** + (1 + t)**k**. Find t for which PQ is minimum and the minimum distance.",
  guide:[{q:"PQ² as a quadratic?", a:"(1 + t)² + t² + (t − 2)² = 3t² − 2t + 5."}],
  steps:[{label:'Vertex', text:"t = 2/6 = ⅓"},{label:'Value', text:"3(⅑) − ⅔ + 5 = 14/3"}],
  answer:"t = ⅓, PQ = √(14/3) = √42/3 ≈ 2.16" },
{ type:'qa', id:'mp38', navLabel:'M38', qnum:'Q 38', heading:'Line contained in a plane',
  question:"The plane 3x + 2y − z = 2 contains the line x − 3 = (2y + 2)/5 = (z − 5)/k. Find k.",
  guide:[{q:"Direction of the line? (careful with 2y + 2)", a:"[[1;5/2;k]]."}],
  steps:[{label:'Point', text:"(3, −1, 5): 9 − 2 − 5 = 2 ✓"},{label:'Direction', text:"3 + 5 − k = 0"}],
  answer:"k = 8" },
{ type:'qa', id:'mp39', navLabel:'M39', qnum:'Q 39', heading:'Plane containing a line, perpendicular to a plane',
  question:"a  Find the line l of intersection of Π₁: x − 3y + 5z = 12 and Π₂: 5x + y + z = 20.  b  Find the Cartesian equation of Π₃ which contains l and is perpendicular to Π₁.",
  guide:[{q:"Π₃ ⟂ Π₁ means **n₁** lies IN Π₃. So **n₃** ⟂ ?", a:"Both **d** and **n₁**: **n₃** = **d** × **n₁**."}],
  steps:[{label:'a', text:"**d** = **n₁** × **n₂** = [[−8;24;16]] ∝ [[1;−3;−2]]; z = 0 ⇒ (9/2, −5/2, 0) ⇒ **r** = [[9/2;−5/2;0]] + λ[[1;−3;−2]]"},{label:'b', text:"**n₃** = [[1;−3;−2]] × [[1;−3;5]] ∝ [[3;1;0]]; 3(9/2) − 5/2 = 11"}],
  answer:"b  3x + y = 11" },
{ type:'qa', id:'mp40', navLabel:'M40', qnum:'Q 40', heading:'Angle bisector',
  question:"l₁: **r** = [[2;−1;0]] + λ[[1;−2;2]], l₂: **r** = [[2;−1;0]] + μ[[2;1;2]] meet at P.\na  Show Q(8, 2, 6) ∈ l₂.  b  R on l₁ with |PR| = |PQ|: find R.  c  Find a line through P bisecting angle QPR.",
  guide:[{q:"Both direction vectors have length 3. How long is PQ?", a:"μ = 3 ⇒ PQ = 9, so λ = ±3 for R."},{q:"Bisector direction of two equal-length vectors?", a:"Their sum."}],

         {label:'b i', text:"Area = ½|(**b** − **a**) × (**c** − **a**)| = ½|**a** × **b** + **b** × **c** + **c** × **a**|"},{label:'b ii', text:"Area = ½ × AC × h with AC = |**c** − **a**| ⇒ h = |**a** × **b** + **b** × **c** + **c** × **a**|/|**c** − **a**|"}],

const KO = {"Starter: on a city map you want to give directions from one landmark to another. A friend says “walk 500 m”. Another says “walk 300 m east and 400 m north”.": "도입: 도시 지도에서 한 랜드마크에서 다른 랜드마크로 가는 길을 알려주려고 해요. 한 친구는 “500 m 걸어가”라고 하고, 다른 친구는 “동쪽으로 300 m, 북쪽으로 400 m 걸어가”라고 해요.", "Why is “walk 500 m” not enough information?": "왜 “500 m 걸어가”만으로는 정보가 부족할까요?", "It gives only a distance (a magnitude). You also need a direction — 500 m north and 500 m east end in completely different places.": "거리(크기)만 알려주기 때문이에요. 방향도 필요해요 — 북쪽으로 500 m와 동쪽으로 500 m는 전혀 다른 곳에 도착해요.", "Write “300 m east and 400 m north” as a pair of numbers. What does each number tell you?": "“동쪽으로 300 m, 북쪽으로 400 m”를 두 개의 수로 나타내 보세요. 각 수는 무엇을 의미하나요?", "[[300;400]] — the first component is the movement in the horizontal (east) direction, the second in the vertical (north) direction.": "[[300;400]] — 첫 번째 성분은 수평(동쪽) 방향의 이동, 두 번째 성분은 수직(북쪽) 방향의 이동이에요.", "How far is the destination from the start in a straight line?": "출발점에서 목적지까지 직선거리는 얼마인가요?", "By Pythagoras: √(300² + 400²) = 500 m. So the components also tell us the magnitude.": "피타고라스 정리로: √(300² + 400²) = 500 m. 즉 성분으로부터 크기도 알 수 있어요.", "Your friend then walks [[−100;200]]. Where does she end up relative to the start? How did you get it?": "그다음 친구가 [[−100;200]]만큼 걸어가요. 출발점 기준으로 어디에 도착하나요? 어떻게 구했나요?", "[[300;400]] + [[−100;200]] = [[200;600]]: add corresponding components — that is vector addition (journeys joined head to tail).": "[[300;400]] + [[−100;200]] = [[200;600]]: 대응하는 성분끼리 더해요 — 이것이 벡터의 덧셈이에요 (이동을 머리-꼬리로 이어 붙이기).", "In 3D (e.g. a drone) how many numbers would you need?": "3차원(예: 드론)에서는 몇 개의 수가 필요할까요?", "Three — east, north and up. These become the components along **i**, **j** and **k**.": "세 개 — 동쪽, 북쪽, 위쪽. 이것이 **i**, **j**, **k** 방향의 성분이 돼요.", "A **vector** has both magnitude and direction. In components it is a column of numbers; adding vectors = adding components = joining journeys head to tail; the length comes from Pythagoras.": "**벡터**는 크기와 방향을 모두 가져요. 성분으로는 수의 열(column)로 나타내고, 벡터의 덧셈 = 성분끼리의 덧셈 = 이동을 머리-꼬리로 잇기이며, 길이는 피타고라스 정리로 구해요.", "For a vector arrow, where do you start counting — the tail or the head?": "벡터 화살표에서 어디서부터 세기 시작하나요 — 꼬리인가요, 머리인가요?", "Start at the tail (no arrowhead) and count to the head.": "꼬리(화살촉이 없는 쪽)에서 시작해서 머리까지 세요.", "Which direction counts as positive for each component?": "각 성분에서 어느 방향이 양(+)의 방향인가요?", "Right is positive for the top component; up is positive for the bottom component.": "위쪽 성분은 오른쪽이 양, 아래쪽 성분은 위쪽이 양이에요.", "What are **i**, **j**, **k** as column vectors?": "**i**, **j**, **k**를 열벡터로 쓰면 어떻게 되나요?", "In **f** = 3**k** − **i**, which component is written first in the column vector?": "**f** = 3**k** − **i**에서 열벡터의 맨 위에 쓰는 성분은 무엇인가요?", "Always the **i**-component first, then **j**, then **k** — regardless of the order they are written in.": "항상 **i** 성분이 먼저, 그다음 **j**, 그다음 **k** — 식에 쓰인 순서와 상관없어요.", "Find a route from A to D that only uses the given vectors.": "주어진 벡터만 이용해서 A에서 D로 가는 경로를 찾아보세요.", "A → B → C → D, i.e. **a** then **b** then **c**.": "A → B → C → D, 즉 **a** 다음 **b** 다음 **c**.", "How is {DB} related to {BD}?": "{DB}는 {BD}와 어떤 관계인가요?", "It is its negative: {DB} = −{BD}.": "부호가 반대예요: {DB} = −{BD}.", "What does multiplying a vector by 2 do to each component? To the arrow?": "벡터에 2를 곱하면 각 성분은 어떻게 되나요? 화살표는요?", "Each component is doubled; the arrow keeps its direction and doubles in length.": "각 성분이 두 배가 되고, 화살표는 방향은 그대로이며 길이가 두 배가 돼요.", "What does multiplying by a negative scalar do?": "음의 스칼라를 곱하면 어떻게 되나요?", "It reverses the direction.": "방향이 반대로 바뀌어요.", "Which side of the parallelogram is parallel to CM? Is CM in the same or opposite direction to **a**?": "평행사변형의 어느 변이 CM과 평행한가요? CM은 **a**와 같은 방향인가요, 반대 방향인가요?", "CM is along DC, which equals **a**; but C → M goes in the opposite direction to **a**, and is half as long.": "CM은 DC 위에 있고 DC = **a**예요. 하지만 C → M은 **a**와 반대 방향이고 길이는 절반이에요.", "{BC} equals which given vector?": "{BC}는 주어진 벡터 중 어느 것과 같나요?", "{BC} = {AD} = **b** (opposite sides of a parallelogram).": "{BC} = {AD} = **b** (평행사변형의 마주 보는 변).", "Plan a route from M to N using points you already know.": "이미 알고 있는 점을 이용해서 M에서 N으로 가는 경로를 세워 보세요.", "Consider **u** = [[1;2;7]], **v** = [[3;6;21]], **w** = [[−2;−4;−14]] and **z** = [[2;4;13]].": "**u** = [[1;2;7]], **v** = [[3;6;21]], **w** = [[−2;−4;−14]], **z** = [[2;4;13]]을 생각해 봅시다.", "Compare **v** with **u** component by component. What do you notice?": "**v**와 **u**를 성분별로 비교해 보세요. 무엇을 알 수 있나요?", "Every component of **v** is 3 times the matching component of **u**: **v** = 3**u**.": "**v**의 모든 성분이 **u**의 대응하는 성분의 3배예요: **v** = 3**u**.", "Is **w** a multiple of **u**? What does the sign tell you about its direction?": "**w**는 **u**의 실수배인가요? 부호는 방향에 대해 무엇을 알려주나요?", "Yes, **w** = −2**u**. The negative scalar means **w** points the opposite way — still parallel.": "네, **w** = −2**u**. 음의 스칼라는 **w**가 반대 방향을 가리킨다는 뜻이에요 — 그래도 평행이에요.", "Why is **z** NOT parallel to **u**, even though two components are doubled?": "두 성분이 두 배인데도 왜 **z**는 **u**와 평행하지 않을까요?", "2/1 = 4/2 = 2 but 13/7 ≠ 2. One single scalar must work for every component.": "2/1 = 4/2 = 2 이지만 13/7 ≠ 2. 하나의 스칼라가 모든 성분에 동시에 성립해야 해요.", "Write an equation that says “**b** is parallel to **a**”.": "“**b**는 **a**와 평행하다”를 식으로 나타내 보세요.", "**b** = t**a** for some scalar t (t may be negative).": "어떤 스칼라 t에 대해 **b** = t**a** (t는 음수일 수도 있어요).", "Parallel ⇔ scalar multiple: **b** = t**a**. Comparing components gives equations that let us find unknowns (Key Point 8.1).": "평행 ⇔ 실수배: **b** = t**a**. 성분을 비교하면 미지수를 구하는 방정식이 생겨요 (Key Point 8.1).", "Which component lets you find the scalar t immediately?": "어느 성분으로 스칼라 t를 바로 구할 수 있나요?", "The first: −2 = t × 1, so t = −2.": "첫 번째 성분: −2 = t × 1, 따라서 t = −2.", "Once t is known, how do you find p and q?": "t를 알면 p와 q는 어떻게 구하나요?", "Equate the remaining components: p = 2t, q = 7t.": "나머지 성분을 같게 놓아요: p = 2t, q = 7t.", "Do negative components reduce the magnitude?": "음수 성분은 크기를 줄이나요?", "No — each component is squared, so signs don’t matter.": "아니요 — 각 성분을 제곱하므로 부호는 상관없어요.", "Why are there two possible answers in part b?": "b에서 답이 두 가지 가능한 이유는 무엇인가요?", "You may divide by 3 or by −3; the second reverses the direction but is still parallel.": "3으로 나눌 수도 있고 −3으로 나눌 수도 있어요. 두 번째는 방향이 반대지만 여전히 평행이에요.", "Where is the tail of **a**, and where is its head?": "**a**의 꼬리는 어디이고 머리는 어디인가요?", "Tail at the lower-left end, head at the arrow tip.": "꼬리는 왼쪽 아래 끝, 머리는 화살촉 끝이에요.", "Right/up are positive; left/down negative. How many units right and up for **a**?": "오른쪽/위쪽은 양, 왼쪽/아래쪽은 음이에요. **a**는 오른쪽으로 몇 칸, 위로 몇 칸인가요?", "2 right, 3 up.": "오른쪽 2, 위 3.", "Both arrows point downwards. What sign will the second component have?": "두 화살표 모두 아래를 향해요. 두 번째 성분의 부호는 무엇일까요?", "Negative.": "음수.", "Count **b**: how many right, how many down?": "**b**를 세어 보세요: 오른쪽으로 몇 칸, 아래로 몇 칸인가요?", "2 right, 3 down.": "오른쪽 2, 아래 3.", "Both arrows go to the left. What sign does the first component have?": "두 화살표 모두 왼쪽으로 가요. 첫 번째 성분의 부호는 무엇인가요?", "Count **a** from tail (bottom right) to head (top).": "**a**를 꼬리(오른쪽 아래)에서 머리(위)까지 세어 보세요.", "1 left, 4 up.": "왼쪽 1, 위 4.", "Both arrows point left and down. What are the signs of both components?": "두 화살표 모두 왼쪽 아래를 향해요. 두 성분의 부호는 각각 무엇인가요?", "Both negative.": "둘 다 음수.", "Count **b**.": "**b**를 세어 보세요.", "1 left, 3 down.": "왼쪽 1, 아래 3.", "Which base vector goes with the top component? The middle? The bottom?": "맨 위 성분에는 어떤 기본 벡터가 대응하나요? 가운데는? 맨 아래는?", "Top → **i**, middle → **j**, bottom → **k**.": "위 → **i**, 가운데 → **j**, 아래 → **k**.", "What happens to a component that is zero?": "0인 성분은 어떻게 되나요?", "That base vector is simply left out.": "그 기본 벡터는 그냥 생략해요.", "Which directions do these vectors point along?": "이 벡터들은 어느 방향을 따라가나요?", "a is along the x-axis (**i**), b along the negative y-axis (−**j**).": "a는 x축 방향(**i**), b는 y축의 음의 방향(−**j**)이에요.", "What is the coefficient of **k** in “+ **k**”?": "“+ **k**”에서 **k**의 계수는 무엇인가요?", "Which component is missing in each?": "각각 빠진 성분은 무엇인가요?", "a has no **j** term; b has no **i** term — those components are 0.": "a에는 **j** 항이 없고, b에는 **i** 항이 없어요 — 그 성분은 0이에요.", "The terms are not written in the order i, j, k. What must you do before writing the column?": "항들이 i, j, k 순서로 쓰여 있지 않아요. 열벡터로 쓰기 전에 무엇을 해야 하나요?", "Re-order: a = −**i** + 4**j** − 2**k**, b = −3**i** + 0**j** + **k**.": "순서를 다시 정리해요: a = −**i** + 4**j** − 2**k**, b = −3**i** + 0**j** + **k**.", "Which route from A to C uses only the given vectors?": "주어진 벡터만 이용해 A에서 C로 가는 경로는 무엇인가요?", "Which route from B to D?": "B에서 D로 가는 경로는요?", "If you travel D → C → B → A, are you going with or against each arrow?": "D → C → B → A로 이동하면 각 화살표와 같은 방향인가요, 반대 방향인가요?", "Against each arrow, so each vector gets a minus sign.": "모든 화살표와 반대 방향이에요. 그래서 각 벡터에 마이너스 부호가 붙어요.", "How should **b** − **a** relate to **a** − **b**?": "**b** − **a**는 **a** − **b**와 어떤 관계여야 하나요?", "It is the negative: **b** − **a** = −(**a** − **b**). Use this to check.": "부호가 반대예요: **b** − **a** = −(**a** − **b**). 이것으로 검산하세요.", "What is 3**a**? What is 2**b**?": "3**a**는 무엇인가요? 2**b**는요?", "Compute 3**b** and 2**a** first.": "먼저 3**b**와 2**a**를 계산하세요.", "Express {BP} as a multiple of **b**.": "{BP}를 **b**의 실수배로 나타내 보세요.", "Express {BM} as a multiple of **b**.": "{BM}을 **b**의 실수배로 나타내 보세요.", "What is {AQ} in terms of **a**?": "{AQ}를 **a**로 나타내면 무엇인가요?", "Route for {MQ}?": "{MQ}의 경로는요?", "How can you use your answer to Q17a?": "Q17a의 답을 어떻게 활용할 수 있나요?", "Route for {PQ}?": "{PQ}의 경로는요?", "P → B → Q, where {PB} = −(4/3)**b**.": "P → B → Q, 여기서 {PB} = −(4/3)**b**.", "Write **b** = t**a**. Which component gives t directly?": "**b** = t**a**로 쓰세요. 어느 성분이 t를 바로 알려주나요?", "The first: a 6 = 2t → t = 3;  b 4 = t.": "첫 번째 성분: a 6 = 2t → t = 3;  b 4 = t.", "What is t here, and what does its sign mean?": "여기서 t는 무엇이고, 그 부호는 무엇을 의미하나요?", "a t = −3, b t = −2: **b** points in the opposite direction to **a**.": "a t = −3, b t = −2: **b**는 **a**와 반대 방향을 가리켜요.", "Which component has numbers in BOTH vectors?": "두 벡터 모두에 숫자가 있는 성분은 어느 것인가요?", "The third component — use it to find t.": "세 번째 성분 — 이것으로 t를 구하세요.", "Once t is found, which unknown is in **a** and which in **b**?": "t를 구한 뒤, 어떤 미지수가 **a**에 있고 어떤 미지수가 **b**에 있나요?", "p is in **a**, q is in **b** — be careful which way the multiplication goes.": "p는 **a**에, q는 **b**에 있어요 — 곱하는 방향을 주의하세요.", "Which component is known in both vectors?": "두 벡터 모두에서 알려진 성분은 어느 것인가요?", "a the **j**-component (−2 and 6);  b the **k**-component (−3 and 6).": "a **j** 성분(−2와 6);  b **k** 성분(−3과 6).", "Find t from the component known in both vectors.": "두 벡터 모두에서 알려진 성분으로 t를 구하세요.", "What is the magnitude of each vector?": "각 벡터의 크기는 얼마인가요?", "Find |**a**| in each case.": "각 경우에 |**a**|를 구하세요.", "Magnitudes?": "크기는?", "Missing components count as 0. Magnitudes?": "빠진 성분은 0으로 계산해요. 크기는?", "What is {BE} in terms of **b**?": "{BE}를 **b**로 나타내면 무엇인가요?", "½**b** (E is halfway up BC, which equals **b**).": "½**b** (E는 BC의 중점이고 BC = **b**).", "Route from E to F?": "E에서 F로 가는 경로는?", "E → C → F: up ½**b**, then left ½**a**.": "E → C → F: 위로 ½**b**, 그다음 왼쪽으로 ½**a**.", "What is {AG}?": "{AG}는 무엇인가요?", "Route from B to A?": "B에서 A로 가는 경로는?", "To reach N from O, go to B first, then what fraction of {BA}?": "O에서 N으로 가려면 먼저 B로 간 다음, {BA}의 몇 분의 몇만큼 가나요?", "How can you get {MN} from {OM} and {ON}?": "{OM}과 {ON}으로부터 {MN}을 어떻게 구할 수 있나요?", "Work out 3**a** and 5**b** first.": "먼저 3**a**와 5**b**를 계산하세요.", "For part b, find the vector first, then its magnitude.": "b에서는 먼저 벡터를 구한 다음 크기를 구하세요.", "Write the magnitude as an expression in k.": "크기를 k에 대한 식으로 나타내 보세요.", "Why are there two answers?": "왜 답이 두 개인가요?", "k is squared, so k and −k give the same magnitude.": "k가 제곱되므로 k와 −k는 같은 크기를 줘요.", "Square both sides of |**v**| = 3. What equation do you get?": "|**v**| = 3의 양변을 제곱하세요. 어떤 방정식이 나오나요?", "What type of equation is this?": "이것은 어떤 종류의 방정식인가요?", "A quadratic in t — use the quadratic formula.": "t에 대한 이차방정식이에요 — 근의 공식을 쓰세요.", "Rearrange like an ordinary linear equation. What is **x**?": "일반적인 일차방정식처럼 정리하세요. **x**는 무엇인가요?", "Write **a** + t**b** in components.": "**a** + t**b**를 성분으로 나타내세요.", "Three equations, one unknown — what must you check?": "방정식 세 개, 미지수 하나 — 무엇을 확인해야 하나요?", "That the same t satisfies all three.": "같은 t가 세 식을 모두 만족하는지요.", "Magnitude of 6**i** + 6**j** − 3**k**?": "6**i** + 6**j** − 3**k**의 크기는?", "How do you make a vector of length 10 in a given direction?": "주어진 방향으로 길이가 10인 벡터는 어떻게 만드나요?", "10 × (unit vector).": "10 × (단위벡터).", "Write **a** + p**b** in components.": "**a** + p**b**를 성분으로 나타내세요.", "Parallel to [[3;2;3]] means equal to t[[3;2;3]]. Which two equations involve both p and t?": "[[3;2;3]]과 평행하다는 것은 t[[3;2;3]]과 같다는 뜻이에요. p와 t가 함께 들어 있는 두 식은 무엇인가요?", "A vector parallel to **j** has the form [[0;s;0]]. Which components must vanish?": "**j**와 평행한 벡터는 [[0;s;0]] 꼴이에요. 어떤 성분이 0이 되어야 하나요?", "The **i**- and **k**-components.": "**i** 성분과 **k** 성분.", "Write λ**x** + **y** in components.": "λ**x** + **y**를 성분으로 나타내세요.", "Magnitude of [[4;−1;1]]?": "[[4;−1;1]]의 크기는?", "What multiple of it has length 6?": "몇 배를 하면 길이가 6이 되나요?", "Write **a** + λ**b** in components.": "**a** + λ**b**를 성분으로 나타내세요.", "Square both sides: what is (5√2)²?": "양변을 제곱하세요: (5√2)²은 얼마인가요?", "Is it easier to minimise |**v**| or |**v**|²?": "|**v**|와 |**v**|² 중 어느 것을 최소화하는 것이 더 쉬울까요?", "|**v**|² — it has no square root and is minimised at the same t.": "|**v**|² — 제곱근이 없고, 같은 t에서 최소가 돼요.", "What kind of function of t is |**v**|²?": "|**v**|²은 t에 대한 어떤 함수인가요?", "A quadratic, so complete the square or use t = −b/(2a).": "이차함수예요. 완전제곱식으로 바꾸거나 t = −b/(2a)를 쓰세요.", "Which identity will make θ disappear in part a?": "a에서 θ를 없애 주는 항등식은 무엇인가요?", "In part b, after expanding, what θ-expression remains? What is its maximum?": "b에서 전개한 뒤 남는 θ에 관한 식은 무엇인가요? 그 최댓값은?", "6(sin θ − cos θ); sin θ − cos θ = √2 sin(θ − π/4) has maximum √2.": "6(sin θ − cos θ); sin θ − cos θ = √2 sin(θ − π/4)의 최댓값은 √2.", "Points A(3, −1, 2) and B(5, 0, 3). O is the origin.": "점 A(3, −1, 2), B(5, 0, 3). O는 원점이에요.", "Write down {OA} and {OB} as column vectors. How do they relate to the coordinates?": "{OA}와 {OB}를 열벡터로 쓰세요. 좌표와 어떤 관계인가요?", "{OA} = [[3;−1;2]], {OB} = [[5;0;3]] — the components are exactly the coordinates. These are the position vectors **a** and **b**.": "{OA} = [[3;−1;2]], {OB} = [[5;0;3]] — 성분이 바로 좌표예요. 이것이 위치벡터 **a**와 **b**예요.", "To get from A to B you may travel A → O → B. Write {AB} using **a** and **b**.": "A에서 B로 가려면 A → O → B로 갈 수 있어요. {AB}를 **a**와 **b**로 나타내세요.", "Calculate {AB}. Which point is subtracted: the start or the end?": "{AB}를 계산하세요. 출발점과 도착점 중 어느 것을 빼나요?", "{AB} = [[2;1;1]]. End minus start: **b** − **a**.": "{AB} = [[2;1;1]]. 도착점 빼기 출발점: **b** − **a**.", "How far apart are A and B?": "A와 B는 얼마나 떨어져 있나요?", "Predict the position vector of the point halfway between A and B. Check by reasoning: start at A and go half of {AB}.": "A와 B의 정중앙에 있는 점의 위치벡터를 예측해 보세요. A에서 출발해 {AB}의 절반만큼 간다고 생각해서 확인하세요.", "Position vector = coordinates. Displacement {AB} = **b** − **a** (end − start); distance AB = |**b** − **a**|; midpoint = ½(**a** + **b**).": "위치벡터 = 좌표. 변위 {AB} = **b** − **a** (끝 − 시작); 거리 AB = |**b** − **a**|; 중점 = ½(**a** + **b**).", "What are the position vectors of A and B?": "A와 B의 위치벡터는 무엇인가요?", "Which is subtracted from which?": "어느 것에서 어느 것을 빼나요?", "{AB} = **b** − **a** (end − start).": "{AB} = **b** − **a** (끝 − 시작).", "What do you need before you can find the distance?": "거리를 구하기 전에 무엇이 필요한가요?", "The displacement vector {AB} = **b** − **a**.": "변위벡터 {AB} = **b** − **a**.", "Which two vectors must be equal for a parallelogram?": "평행사변형이 되려면 어떤 두 벡터가 같아야 하나요?", "For a rhombus, which two lengths must you compare?": "마름모인지 확인하려면 어떤 두 길이를 비교해야 하나요?", "Two adjacent sides, e.g. |{AB}| and |{BC}|.": "이웃한 두 변, 예를 들어 |{AB}|와 |{BC}|.", "Find {AB} and {BC}.": "{AB}와 {BC}를 구하세요.", "What does it mean geometrically if {AB} is a multiple of {BC}?": "{AB}가 {BC}의 실수배라는 것은 기하학적으로 무슨 뜻인가요?", "The segments AB and BC are parallel.": "선분 AB와 BC가 평행하다는 뜻이에요.", "Two parallel segments could be on different (parallel) lines. Why is that impossible here?": "평행한 두 선분은 서로 다른(평행한) 직선 위에 있을 수도 있어요. 여기서는 왜 그럴 수 없나요?", "AB and BC share the point B — parallel lines through a common point are the same line.": "AB와 BC는 점 B를 공유해요 — 한 점을 공유하는 평행한 직선은 같은 직선이에요.", "Now replace C by C(6, p, q). What must be true about {AB} and {BC}?": "이제 C를 C(6, p, q)로 바꿔요. {AB}와 {BC}에 대해 무엇이 성립해야 하나요?", "{AB} = k{BC} for some scalar k; compare components to find k, p, q.": "어떤 스칼라 k에 대해 {AB} = k{BC}; 성분을 비교해서 k, p, q를 구해요.", "A, B, C are collinear ⇔ {AB} = k{BC} (parallel AND sharing point B) — Key Point 8.8.": "A, B, C가 한 직선 위에 있음 ⇔ {AB} = k{BC} (평행하면서 점 B를 공유) — Key Point 8.8.", "Which component of {BC} contains no unknown?": "{BC}의 어느 성분에 미지수가 없나요?", "The first: 6 − 2 = 4.": "첫 번째 성분: 6 − 2 = 4.", "Use that component to find k.": "그 성분으로 k를 구하세요.", "Write a route from O to M through A.": "A를 거쳐 O에서 M으로 가는 경로를 쓰세요.", "What fraction of {AB} is {AM}?": "{AM}은 {AB}의 몇 분의 몇인가요?", "One half.": "절반.", "Which formula do you use?": "어떤 공식을 쓰나요?", "Write **g** as **a** + (something).": "**g**를 **a** + (무언가)로 쓰세요.", "What is **d**? What is **e**?": "**d**는 무엇인가요? **e**는요?", "To show B, G, E collinear, what should {BG} be in terms of {BE}?": "B, G, E가 한 직선 위에 있음을 보이려면 {BG}가 {BE}로 어떻게 나타나야 하나요?", "A scalar multiple — here ⅔{BE}.": "실수배 — 여기서는 ⅔{BE}.", "**b** − **a** (end − start).": "**b** − **a** (끝 − 시작).", "How is {CA} related to {AC} from Q1?": "{CA}는 Q1의 {AC}와 어떤 관계인가요?", "Can you write these down from earlier answers?": "앞에서 구한 답으로 바로 쓸 수 있나요?", "Find **b** − **a** first.": "먼저 **b** − **a**를 구하세요.", "Write each as a column vector including zeros.": "0을 포함해서 각각 열벡터로 쓰세요.", "Displacements?": "변위는?", "Which vectors do you compare first?": "먼저 어떤 벡터들을 비교하나요?", "If they are equal, what do you compare next?": "같다면 그다음에는 무엇을 비교하나요?", "Is {AB} equal to {DC}?": "{AB}와 {DC}는 같나요?", "Compute both and compare component by component.": "둘 다 계산해서 성분별로 비교하세요.", "Compute {AB}, {DC}, {BC}.": "{AB}, {DC}, {BC}를 계산하세요.", "Find {AB} and {BC}. Which component of {BC} is fully known?": "{AB}와 {BC}를 구하세요. {BC}의 어느 성분이 완전히 알려져 있나요?", "The x-component.": "x 성분.", "Set {AB} = k{BC}. What is k?": "{AB} = k{BC}로 놓으세요. k는 얼마인가요?", "In part a, which component of **c** is known?": "a에서 **c**의 어느 성분이 알려져 있나요?", "The y-component (7) — use it to find k.": "y 성분(7) — 이것으로 k를 구하세요.", "Which component is known in both {AB} and {BC}?": "{AB}와 {BC} 모두에서 알려진 성분은 무엇인가요?", "a the **j**-component (5 and −10);  b the **i**-component (1 and −3).": "a **j** 성분(5와 −10);  b **i** 성분(1과 −3).", "Formula?": "공식은?", "Add, then halve.": "더한 다음 반으로 나눠요.", "Average each coordinate.": "각 좌표의 평균을 구하세요.", "Shortcut: how is AC related to AB?": "지름길: AC는 AB와 어떤 관계인가요?", "Compute {AB} and {BC}. Is one a multiple of the other?": "{AB}와 {BC}를 계산하세요. 하나가 다른 하나의 실수배인가요?", "What does the scalar −3 tell you about lengths?": "스칼라 −3은 길이에 대해 무엇을 알려주나요?", "BC is 3 times as long as AB.": "BC의 길이는 AB의 3배예요.", "Write **a** with all three components.": "**a**를 세 성분 모두 써서 나타내세요.", "Rearrange {AD} = **d** − **a**.": "{AD} = **d** − **a**를 정리하세요.", "Write {AB} = {BC} with position vectors.": "{AB} = {BC}를 위치벡터로 쓰세요.", "Geometric meaning?": "기하학적 의미는?", "B is the midpoint of AC.": "B는 AC의 중점이에요.", "For ABCD a parallelogram, which vectors are equal?": "ABCD가 평행사변형이면 어떤 벡터들이 같나요?", "For part b, compare which lengths?": "b에서는 어떤 길이를 비교하나요?", "**d** in terms of **a**, **b**, **c**?": "**d**를 **a**, **b**, **c**로 나타내면?", "What happens to **a** when you compute **n** − **m**?": "**n** − **m**을 계산하면 **a**는 어떻게 되나요?", "It cancels.": "소거돼요.", "Write the four midpoints.": "네 중점을 쓰세요.", "Which two vectors should you show are equal?": "어떤 두 벡터가 같음을 보여야 하나요?", "Which component of {AB} and {BC} contains no unknown?": "{AB}와 {BC}의 어느 성분에 미지수가 없나요?", "The z-component: −3 and −2.": "z 성분: −3과 −2.", "What fraction of AB is AC?": "AC는 AB의 몇 분의 몇인가요?", "Write {AB} in terms of t.": "{AB}를 t로 나타내세요.", "Square both sides of AB = 3.": "AB = 3의 양변을 제곱하세요.", "Where must R be on the line?": "R은 직선 위의 어디에 있어야 하나요?", "On the other side of Q from M, at the same distance — Q is the midpoint of MR.": "Q를 기준으로 M의 반대쪽, 같은 거리에 — Q가 MR의 중점이에요.", "Find **d** first.": "먼저 **d**를 구하세요.", "Find **x**.": "**x**를 구하세요.", "Compare {BM} and {BX}.": "{BM}과 {BX}를 비교하세요.", "Look for {BX} = k{BM}.": "{BX} = k{BM}인지 찾아보세요.", "E lies beyond A on line CA with CE : EA = 3 : 1. What is EA as a fraction of CA?": "E는 직선 CA 위에서 A 너머에 있고 CE : EA = 3 : 1이에요. EA는 CA의 몇 분의 몇인가요?", "To show collinearity, which two vectors do you compare?": "한 직선 위에 있음을 보이려면 어떤 두 벡터를 비교하나요?", "Compute {AB} and {DC} in terms of k.": "{AB}와 {DC}를 k로 나타내세요.", "Both equal [[k−2;k+2]].": "둘 다 [[k−2;k+2]]와 같아요.", "For a rhombus, what equation in k would you need? What does the discriminant say?": "마름모가 되려면 k에 대해 어떤 방정식이 필요한가요? 판별식은 무엇을 말해 주나요?", "|{AB}|² = |{BC}|² gives a quadratic; a negative discriminant means no real solutions.": "|{AB}|² = |{BC}|²은 이차방정식이 되고, 판별식이 음수이면 실근이 없어요.", "For each pair, work out the number S = a₁b₁ + a₂b₂ and compare it with what you can see about the angle between the vectors.\n(1) **a** = [[3;0]], **b** = [[0;2]]     (2) **a** = [[1;1]], **b** = [[2;2]]     (3) **a** = [[1;0]], **b** = [[1;1]]     (4) **a** = [[1;2]], **b** = [[−2;1]]": "각 쌍에 대해 S = a₁b₁ + a₂b₂를 계산하고, 두 벡터 사이의 각과 비교해 보세요.\n(1) **a** = [[3;0]], **b** = [[0;2]]     (2) **a** = [[1;1]], **b** = [[2;2]]     (3) **a** = [[1;0]], **b** = [[1;1]]     (4) **a** = [[1;2]], **b** = [[−2;1]]", "Compute S for each pair.": "각 쌍의 S를 계산하세요.", "Pairs (1) and (4) give S = 0. Sketch them — what do you notice?": "(1)과 (4)는 S = 0이에요. 그려 보세요 — 무엇을 알 수 있나요?", "Both pairs are perpendicular.": "두 쌍 모두 수직이에요.", "Pair (2) points the same way. Compare S with |**a**||**b**|.": "(2)는 같은 방향을 가리켜요. S와 |**a**||**b**|를 비교하세요.", "|**a**||**b**| = √2·√8 = 4 = S. When θ = 0°, S = |**a**||**b**|.": "|**a**||**b**| = √2·√8 = 4 = S. θ = 0°일 때 S = |**a**||**b**|.", "Pair (3) has θ = 45°. Compute |**a**||**b**|cos 45°.": "(3)은 θ = 45°예요. |**a**||**b**|cos 45°를 계산하세요.", "Make a conjecture connecting S, |**a**|, |**b**| and θ.": "S, |**a**|, |**b**|, θ 사이의 관계를 추측해 보세요.", "S = |**a**||**b**|cos θ. This number is called the scalar (dot) product **a**•**b**.": "S = |**a**||**b**|cos θ. 이 수를 스칼라곱(내적) **a**•**b**라고 해요.", "**a**•**b** = |**a**||**b**|cos θ = a₁b₁ + a₂b₂ + a₃b₃. So cos θ = **a**•**b** / (|**a**||**b**|), and **a**•**b** = 0 ⇔ perpendicular. (Proof 8.2 uses the cosine rule.)": "**a**•**b** = |**a**||**b**|cos θ = a₁b₁ + a₂b₂ + a₃b₃. 따라서 cos θ = **a**•**b** / (|**a**||**b**|)이고, **a**•**b** = 0 ⇔ 수직. (Proof 8.2는 코사인법칙을 이용해요.)", "Which formula applies when you know lengths and the angle?": "길이와 각을 알 때는 어떤 공식을 쓰나요?", "Is the answer a vector or a number?": "답은 벡터인가요, 수인가요?", "A number.": "수(스칼라).", "Which two vectors form the angle at A?": "A에서의 각을 이루는 두 벡터는 무엇인가요?", "{AB} and {AC} — both starting at A.": "{AB}와 {AC} — 둘 다 A에서 출발해요.", "For angle ABC, at which point is the angle? Which way must both vectors point?": "각 ABC는 어느 점에서의 각인가요? 두 벡터는 어느 쪽을 향해야 하나요?", "At B; both vectors must point away from B: {BA} and {BC}.": "B에서의 각이에요. 두 벡터 모두 B에서 바깥쪽을 향해야 해요: {BA}와 {BC}.", "Can an angle in a triangle be obtuse? Is a negative cosine a problem?": "삼각형의 각이 둔각일 수 있나요? 코사인이 음수인 것이 문제가 되나요?", "Yes — a negative cosine simply means the angle is obtuse; no adjustment is needed.": "네, 둔각일 수 있어요 — 코사인이 음수이면 단지 둔각이라는 뜻이고, 따로 고칠 필요가 없어요.", "Which triangle rule links three side lengths and one angle?": "세 변의 길이와 한 각을 연결하는 삼각형 법칙은 무엇인가요?", "The cosine rule: AB² = |**a**|² + |**b**|² − 2|**a**||**b**|cos θ.": "코사인법칙: AB² = |**a**|² + |**b**|² − 2|**a**||**b**|cos θ.", "How can you write AB² using components?": "AB²을 성분으로 어떻게 쓸 수 있나요?", "What is **a**•**a** for a unit vector?": "단위벡터에서 **a**•**a**는 얼마인가요?", "What is **a**•**b**?": "**a**•**b**는 얼마인가요?", "Which equation expresses “pe
